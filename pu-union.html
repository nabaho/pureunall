<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>푸른노무법인 노사관계·단체교섭</title>
<!-- ⚠ pu-version.js 는 싣지 않는다 — 교섭일지·신구조문대비 검토의견 작성 중 자동 새로고침 시 미저장 작업이 초기화되지 않도록 보호한다 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🗣️</text></svg>">
<!-- ══════════════════════════════════════════════════════════════════════
     푸른노무법인 노사관계·단체교섭 통합 워크스페이스 (pu-union.html) — 2026-11-28
     의뢰인 업무 › 사업장·연도별 단체교섭 · 임금협상 · 교섭창구단일화 · 쟁의조정 · 노사협의회
     ★ 하는 일:
       1. 푸른 메일함(IMAP mailbox/folders·msgs + POP3 지난메일 mailbox/old/msgs + searchMailbox)에서
          노사관계·단체교섭·임금협상·창구단일화·쟁의조정·노사협의회 메일을 전수 긁어와 사업장×연도별 분류.
       2. 8단계 표준 교섭 절차 · 창구단일화/쟁의조정 법정기일 자동계산기 · 회차별 교섭일지 관리.
       3. 진행 서류 / 검토·자문 서류 / 합의·체결·신고 서류 / 증빙자료 4대 서류군 및 로컬 교섭폴더 연결.
       4. 3단 신구조문대비표 · 임금협상 원가 시뮬레이터 · 공고문/검토서/종합현황 HWPX·CSV·푸른한글 출력.
     ★ 모든 쓰기는 PuOntologyWrite 강제 관문(enforce)만 거치며 물리 삭제 대신 _deleted 표식을 남긴다.
     ══════════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --ink:#1e293b; --ink2:#475569; --mute:#475569; --line:#e2e8f0; --line2:#cbd5e1; --bg:#f8fafc; --card:#ffffff;
  --blue:#2563eb; --blue-d:#1e40af; --blue-bg:#eff6ff; --blue-line:#bfdbfe;
  --green:#166534; --green-m:#16a34a; --green-bg:#f0fdf4; --green-line:#bbf7d0;
  --amber:#854d0e; --amber-m:#d97706; --amber-bg:#fffbeb; --amber-line:#fde68a;
  --red:#991b1b; --red-m:#dc2626; --red-bg:#fef2f2; --red-line:#fecaca;
  --pri-bg:#1e40af; --ok-bg:#166534;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#f8fafc; --ink2:#e2e8f0; --mute:#cbd5e1; --line:#475569; --line2:#64748b; --bg:#000000; --card:#1e293b;
    --blue:#60a5fa; --blue-d:#bfdbfe; --blue-bg:#1e293b; --blue-line:#2563eb;
    --green:#4ade80; --green-m:#16a34a; --green-bg:#1e293b; --green-line:#16a34a;
    --amber:#fde68a; --amber-m:#d97706; --amber-bg:#1e293b; --amber-line:#d97706;
    --red:#fecaca; --red-m:#dc2626; --red-bg:#1e293b; --red-line:#dc2626;
    --pri-bg:#2563eb; --ok-bg:#166534;
  }
}
*{box-sizing:border-box}
html,body{width:100%;max-width:none;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 11px;line-height:1.3;white-space:nowrap}
button:hover{border-color:var(--mute)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--pri-bg);border-color:var(--pri-bg);color:#ffffff;font-weight:600}
button.ok{background:var(--ok-bg);border-color:var(--ok-bg);color:#ffffff;font-weight:600}
button.warn-btn{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber);font-weight:600}
button.danger{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
button.sm{padding:3px 8px;min-height:26px;font-size:11.5px}
input,select,textarea{font:inherit;font-size:13px;padding:4px 7px;border:1px solid var(--line2);border-radius:7px;background:var(--card);color:var(--ink)}
textarea{width:100%;resize:vertical;font-family:inherit;line-height:1.55}
a{color:var(--blue-d);text-decoration:none}
a.act-link{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid var(--blue-line);border-radius:7px;background:var(--blue-bg);color:var(--blue-d);font-size:11.5px;font-weight:600;white-space:nowrap}
#head{position:sticky;top:0;z-index:20;width:100%;max-width:none;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:6px;padding:4px 12px;width:100%;max-width:none;flex-wrap:wrap}
.top h1{font-size:15px;margin:0;white-space:nowrap}
.top .sub{font-size:11px;color:var(--mute);white-space:nowrap}
#head .top button.sm,#head .top a.act-link{padding:3px 7px;min-height:25px;font-size:11.5px}
.sp{flex:1}
#who{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:3px;padding:0 12px;width:100%;max-width:none;flex-wrap:wrap;align-items:center}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mute);padding:6px 10px;font-size:12.5px}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--blue)}
.chip{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--ink2)}
.c-blue{background:var(--blue-bg);color:var(--blue-d);border-color:var(--blue-line)}
.c-green{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.c-amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.c-red{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
main{display:block;padding:7px 62px 56px 12px;width:100%;max-width:none;margin:0}
.pane{display:none}
.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.bar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:6px 10px}
.sec{padding:8px 12px;font-weight:700;font-size:13px;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.sec select{max-width:100%;min-width:0;text-overflow:ellipsis}
.card>.sec:first-child{border-top:0;border-radius:10px 10px 0 0}
.note{background:var(--blue-bg);border:1px solid var(--blue-line);color:var(--blue-d);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:10px}
.warn{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}
/* ── 최근 코딩 변경 안내 바 (#recent-diff-bar) & 강조 테두리 (.code-diff-box) ── */
#recent-diff-bar{background:var(--card);border:1px solid var(--blue-line);border-radius:10px;padding:6px 10px;margin-bottom:7px;max-width:100%}
.diff-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.diff-title{font-size:11.5px;font-weight:700;color:var(--blue-d);white-space:nowrap}
.diff-pills{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
.diff-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;min-height:24px;font-size:11.5px;border-radius:14px;background:var(--blue-bg);border:1px solid var(--blue-line);color:var(--blue-d);white-space:normal;text-align:left;max-width:100%}
.diff-pill:hover{border-color:var(--blue)}
.diff-badge{display:inline-block;padding:0 5px;border-radius:8px;font-size:10px;font-weight:700;background:var(--pri-bg);color:#ffffff}
.diff-toggle{padding:2px 8px;min-height:24px;font-size:11px;border-radius:12px}
.code-diff-box{box-shadow:0 0 0 2px var(--blue-line);border-color:var(--blue) !important}
/* ── 통합 트랙 바 · 초소형 1줄 KPI 배지 · 연도별 알약/분포 ── */
.ur-top-strip{display:flex;flex-direction:column;gap:5px;padding:7px 11px;margin-bottom:7px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.ur-top-strip .scope-bar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:0;padding:0}
.ur-top-strip .scope-lbl{font-weight:700;font-size:12px;color:var(--ink2);white-space:nowrap;margin-right:2px}
.ur-top-strip .scope-btn{padding:4px 9px;min-height:27px;border-radius:8px;font-weight:600;font-size:12px;border:1px solid var(--line2);background:var(--card);color:var(--ink)}
.ur-top-strip .scope-btn:hover{border-color:var(--blue)}
.scope-btn.on{background:var(--pri-bg);border-color:var(--pri-bg);color:#ffffff}
.ur-top-strip .kpis{display:flex;flex-wrap:wrap;gap:5px;margin:0;align-items:center}
.kpi{display:inline-flex;flex-direction:row;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;background:var(--bg);border:1px solid var(--line);min-width:0}
.kpi span{font-size:11.5px;font-weight:700;color:var(--mute);white-space:nowrap}
.kpi b{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi.k-blue b{color:var(--blue-d)}
.kpi.k-green b{color:var(--green)}
.kpi.k-amber b{color:var(--amber)}
.kpi.k-red b{color:var(--red)}
.kpi[data-act]{cursor:pointer}
.kpi[data-act]:hover{border-color:var(--blue)}
.kpi.k-on{border-color:var(--green-m);background:var(--green-bg)}
.yr-pills{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.yr-pills button{font-size:11.5px;padding:3px 9px;border-radius:14px;min-height:26px;background:var(--card);border:1px solid var(--line2);color:var(--ink2)}
.yr-pills button.on{background:var(--pri-bg);border-color:var(--pri-bg);color:#ffffff;font-weight:700}
.yr-dist{display:flex;gap:6px;flex-wrap:wrap;padding:6px 10px;background:var(--card)}
.yr-dist-item{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-size:11.5px;cursor:pointer}
.yr-dist-item.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d);font-weight:700}
.pbar{display:inline-flex;gap:2px;align-items:center;vertical-align:middle;margin-right:4px}
.pdot{display:inline-block;width:7.5px;height:8.5px;border-radius:2px;background:var(--line2)}
.pdot.done{background:var(--green-m)}
.pdot.cur{background:var(--blue)}
.ws-steps{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding:7px 10px;background:var(--bg);border-top:1px solid var(--line)}
.ws-step{display:flex;align-items:center;justify-content:center;gap:4px;min-height:32px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--mute);text-align:center;min-width:0;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ws-step b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-step.done{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}
.ws-step.cur{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue-d);font-weight:700}
.bulk{display:none;gap:6px;align-items:center;padding:6px 12px;background:var(--blue-bg);border-bottom:1px solid var(--blue-line);font-size:12.5px;flex-wrap:wrap}
.bulk.on{display:flex}
.scroll{overflow:auto}
table.t{width:100%;max-width:none;border-collapse:collapse;font-size:12px}
table.t th,table.t td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{background:var(--bg);color:var(--ink2);font-size:11.5px;font-weight:600}
table.t td{overflow:hidden;text-overflow:ellipsis;max-width:210px}
table.t td.ti{font-weight:600;max-width:240px}
table.t td.wide{max-width:440px}
table.t td[data-k="act"]{max-width:none;overflow:visible;text-overflow:clip;width:1%}
table.t th.c,table.t td.c{width:34px;text-align:center}
table.t th.n,table.t td.n{width:36px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=checkbox],input[type=radio]{width:24px;height:24px;min-width:24px;min-height:24px;margin:0;cursor:pointer;vertical-align:middle}
table.t input[type=checkbox]{width:24px;height:24px;margin:0;cursor:pointer;vertical-align:middle}
table.t tr[data-row]{cursor:pointer}
table.t tr[data-row]:hover>td{background:var(--bg)}
table.t tr.cur>td{background:var(--blue-bg)}
.th-flt-btn{display:inline-flex;align-items:center;gap:4px;border:none;background:transparent;padding:2px 4px;margin:-2px -4px;min-height:24px;font:inherit;font-size:11.5px;font-weight:700;color:var(--ink2);border-radius:6px;cursor:pointer}
.th-flt-btn:hover{background:var(--card);color:var(--ink)}
.th-flt-btn.on{color:var(--blue-d);background:var(--blue-bg)}
.th-pop{position:fixed;z-index:45;width:270px;max-width:calc(100vw - 16px);max-height:calc(100vh - 24px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.th-pop-hd{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700}
.th-pop-bd{padding:8px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;max-height:58vh}
.th-pop-sorts{display:flex;gap:4px;flex-wrap:wrap}
.th-pop-sorts button{flex:1 1 auto;padding:4px 8px;min-height:28px;font-size:11.5px;border-radius:7px}
.th-pop-sorts button.on{background:var(--pri-bg);border-color:var(--pri-bg);color:#ffffff;font-weight:700}
.th-pop-list{display:flex;flex-direction:column;gap:2px;max-height:195px;overflow-y:auto}
.th-pop-item{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;font-size:12px;color:var(--ink);cursor:pointer;min-width:0}
.th-pop-item:hover{background:var(--bg)}
.th-pop-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th-pop-item .cnt{margin-left:auto;flex:none;font-size:11px;color:var(--mute)}
.th-pop-ft{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 10px;background:var(--bg);border-top:1px solid var(--line)}
.ws-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start}
.tl-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:10px 12px}
.tl-card{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.tl-card.urgent{border-color:var(--red-line);background:var(--red-bg)}
.tl-card.upcoming{border-color:var(--blue-line);background:var(--blue-bg)}
.tl-card b{font-size:12px}
.tl-card span{font-size:11px;color:var(--ink2)}
.sim-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:10px 12px}
.sim-cell{display:flex;flex-direction:column;gap:3px}
.sim-cell label{font-size:11.5px;font-weight:600;color:var(--ink2)}
.sim-res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 12px 10px}
.fr{display:flex;gap:10px;padding:7px 14px;align-items:center}
.fr>label{width:120px;flex:none;color:var(--ink2);font-size:12.5px;font-weight:600;white-space:nowrap}
.fv{flex:1;min-width:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fv input[type=text],.fv input[type=number],.fv input[type=date],.fv select{flex:1;min-width:140px}
.mail-body{max-height:48vh;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.55}
.att-list{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0}
.empty{padding:24px 12px;text-align:center;color:var(--mute)}
.hint{font-size:12px;color:var(--mute)}
#lock{display:none;max-width:460px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center}
#lock p{color:var(--mute);font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e293b;color:#ffffff;border-radius:10px;padding:10px 16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70;max-width:90vw}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(30,41,59,.42);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:12px;width:100%;max-width:740px;overflow:hidden}
.mbox.wide{max-width:1040px}
.mhd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--bg);font-weight:700}
.mbd{padding:12px 14px;max-height:76vh;overflow:auto}
.mft{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.phone-only{display:none}
@media (max-width:1180px){
  .ws-steps{grid-template-columns:repeat(4,minmax(0,1fr))}
  .ws-split{grid-template-columns:1fr}
  .tl-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sim-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sim-res{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* ── 폰 화면: 입력칸 16px 이상(확대 방지) · 가로 밀기 없는 2줄 카드 · ☐·№ 왼쪽 고정 ── */
@media (max-width:768px){
  input,select,textarea{font-size:16px}
  button.sm,#head .top button.sm,.ur-top-strip .scope-btn,.th-flt-btn{min-height:36px;padding:6px 9px}
  input[type=checkbox],input[type=radio]{width:24px;height:24px;min-width:24px;min-height:24px;margin:0;vertical-align:middle}
  .modal{padding:0}
  .mbox,.mbox.wide{max-width:100vw;border-left:0;border-right:0;border-radius:0}
  .mbd{padding:10px;max-height:84vh}
  .phone-only{display:inline}
  .wide-only{display:none}
  .top{padding:6px 8px;gap:5px}
  .top h1{font-size:14.5px;white-space:nowrap}
  #who{flex:0 1 auto;min-width:0;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:0;padding:0 6px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;padding:8px 8px;font-size:13px}
  .ur-top-strip .scope-bar,.yr-pills{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .ur-top-strip .scope-bar::-webkit-scrollbar,.yr-pills::-webkit-scrollbar{display:none}
  .ur-top-strip .scope-btn,.yr-pills button{flex:0 0 auto}
  .ws-steps{display:flex;overflow-x:auto;scrollbar-width:none;gap:5px}
  .ws-steps::-webkit-scrollbar{display:none}
  .ws-step{flex:0 0 auto;min-height:36px;padding:5px 10px}
  .tl-grid,.sim-grid,.sim-res{grid-template-columns:1fr}
