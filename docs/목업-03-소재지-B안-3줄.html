<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>목업 3 — 소재지 B안 (3줄)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--acc:#2563eb;--tag:#7c3aed;--ink:#1e293b;--sub:#475569;--line:#e2e8f0;--panel:#fff;--radius:11px;--warn-bg:#fffbeb}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;color:var(--ink);background:#f1f5f9;font-size:14px;padding:24px 16px 60px}
  .wrap{max-width:460px;margin:0 auto}
  h1{font-size:17px;margin:0 0 6px}
  .tag{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--tag);border-radius:6px;padding:3px 10px;margin-bottom:14px}
  .muted{color:var(--sub);font-size:12.5px}
  button{font-family:inherit;font-size:13px;padding:7px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
  .fld{display:flex;flex-direction:column;gap:8px}
  .fld label{font-size:11.5px;color:var(--sub);font-weight:600}
  .fld input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;width:100%}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
  .r1{display:flex;gap:8px}
  .zip{width:140px;flex:none}
  .zip input{font-family:monospace;text-align:center;background:#f8fafc;color:var(--sub)}
  .lines{margin:16px 0;padding:12px 14px;background:#faf5ff;border-radius:9px;font-size:12.5px;line-height:1.9}
  .warn{background:var(--warn-bg);border:1px solid #fde68a;border-left:4px solid #d97706;border-radius:9px;padding:12px 14px;margin-top:14px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>목업 3 — 소재지, B안</h1>
<span class="tag">B안 · 3줄</span>

<div class="box">
  <div class="fld">
    <label>소재지</label>
    <div class="r1">
      <div class="zip"><input value="000-000" readonly></div>
      <div><button class="primary">🔍 우편번호 검색</button></div>
    </div>
    <input value="○○시 ○○구 ○○로 00" readonly>
    <input value="" placeholder="상세주소 — 동·호수 등 (예: 본관 2층)">
  </div>
</div>

<div class="lines">
1줄 — 우편번호 + [검색] 단추<br>
2줄 — 도로명주소 (검색으로만 채워짐, <b>읽기전용</b>)<br>
3줄 — 상세주소 (<b>직접 입력</b>하는 새 칸)
</div>

<div class="warn">
도로명주소와 상세주소를 <b>따로 저장</b>합니다 — 새 칸이 하나 더 늘어납니다.
목록·서식에서 「소재지」를 쓰는 곳은 두 칸을 <b>합쳐서</b> 보여주도록 같이 고쳐야 합니다
(찾아서 다 고치겠습니다 — 빠뜨리면 그 화면만 소재지가 반쪽으로 나옵니다).
</div>
</div>
</body>
</html>
