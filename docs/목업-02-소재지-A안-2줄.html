<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>목업 2 — 소재지 A안 (2줄)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--acc:#2563eb;--ink:#1e293b;--sub:#475569;--line:#e2e8f0;--panel:#fff;--radius:11px;--ok-bg:#f8fafc}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;color:var(--ink);background:#f1f5f9;font-size:14px;padding:24px 16px 60px}
  .wrap{max-width:460px;margin:0 auto}
  h1{font-size:17px;margin:0 0 6px}
  .tag{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--acc);border-radius:6px;padding:3px 10px;margin-bottom:14px}
  .muted{color:var(--sub);font-size:12.5px}
  button{font-family:inherit;font-size:13px;padding:7px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:11.5px;color:var(--sub);font-weight:600}
  .fld input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;width:100%}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
  .r1{display:flex;gap:8px;margin-bottom:8px}
  .zip{width:140px;flex:none}
  .zip input{font-family:monospace;text-align:center;background:#f8fafc;color:var(--sub)}
  .lines{margin:16px 0;padding:12px 14px;background:var(--ok-bg);border-radius:9px;font-size:12.5px;line-height:1.9}
  .note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:9px;padding:12px 14px;margin-top:14px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>목업 2 — 소재지, A안</h1>
<span class="tag">A안 · 2줄</span>

<div class="box">
  <div class="fld">
    <label>소재지</label>
    <div class="r1">
      <div class="zip"><input value="000-000" readonly></div>
      <div><button class="primary">🔍 우편번호 검색</button></div>
    </div>
    <input value="○○시 ○○구 ○○로 00">
  </div>
</div>

<div class="lines">
1줄 — 우편번호 + [검색] 단추<br>
2줄 — 도로명주소 (검색으로 채워지고, <b>사람이 이어서 상세주소를 직접 적을 수 있음</b>)
</div>

<div class="note">
저장 칸은 지금처럼 <b>소재지 하나</b>만 늘어납니다(우편번호만 새로 생김). 상세주소(동·호수)를
따로 저장하지 않고 도로명주소 칸에 이어 적습니다 — <b>바꿀 데이터가 가장 적은 안</b>입니다.
</div>
</div>
</body>
</html>
