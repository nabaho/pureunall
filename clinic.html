<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>푸른노무법인 현장클리닉</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🩺</text></svg>">
<style>
:root{
  --ink:#1e293b; --ink2:#475569; --mute:#475569; --line:#e2e8f0; --line2:#cbd5e1; --bg:#f8fafc; --card:#ffffff;
  --blue:#2563eb; --blue-d:#1e40af; --blue-bg:#eff6ff; --blue-line:#bfdbfe;
  --green:#166534; --green-m:#16a34a; --green-bg:#f0fdf4; --green-line:#bbf7d0;
  --amber:#854d0e; --amber-m:#d97706; --amber-bg:#fffbeb; --amber-line:#fde68a;
  --red:#991b1b; --red-m:#dc2626; --red-bg:#fef2f2; --red-line:#fecaca;
  --pri-bg:#1e40af; --ok-bg:#166534;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#f8fafc; --ink2:#e2e8f0; --mute:#cbd5e1; --line:#475569; --line2:#64748b; --bg:#000000; --card:#1e293b;
    --blue:#60a5fa; --blue-d:#bfdbfe; --blue-bg:#1e293b; --blue-line:#2563eb;
    --green:#4ade80; --green-m:#16a34a; --green-bg:#1e293b; --green-line:#16a34a;
    --amber:#fde68a; --amber-m:#d97706; --amber-bg:#1e293b; --amber-line:#d97706;
    --red:#fecaca; --red-m:#dc2626; --red-bg:#1e293b; --red-line:#dc2626;
    --pri-bg:#2563eb; --ok-bg:#166534;
  }
}
*{box-sizing:border-box}
html,body{width:100%;max-width:none;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 11px;line-height:1.3;white-space:nowrap}
button:hover{border-color:var(--mute)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.drop-zone:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button[data-quiz],button[data-hqz],.wrap-btn{white-space:normal;text-align:left;max-width:100%;height:auto;line-height:1.4}
.wrap-chip{white-space:normal;overflow-wrap:anywhere;word-break:keep-all;max-width:100%}
code{overflow-wrap:anywhere;word-break:break-all;max-width:100%}
button.pri{background:var(--pri-bg);border-color:var(--pri-bg);color:#ffffff;font-weight:600}
button.ok{background:var(--ok-bg);border-color:var(--ok-bg);color:#ffffff;font-weight:600}
button.warn-btn{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber);font-weight:600}
button.danger{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
button.sm{padding:5px 10px;min-height:32px;font-size:12px}
input,select,textarea{font:inherit;font-size:16px;padding:5px 8px;border:1px solid var(--line2);border-radius:7px;background:var(--card);color:var(--ink)}
textarea{width:100%;resize:vertical;font-family:inherit;line-height:1.55;word-break:keep-all;overflow-wrap:break-word}
a{color:var(--blue-d);text-decoration:none}
a.act-link{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border:1px solid var(--blue-line);border-radius:7px;background:var(--blue-bg);color:var(--blue-d);font-size:12px;font-weight:600;white-space:nowrap}
.code-diff-box{border:2px solid var(--blue);background:var(--blue-bg)}
#head{position:sticky;top:0;z-index:20;width:100%;max-width:none;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;width:100%;max-width:none;flex-wrap:wrap}
.top h1{font-size:17px;margin:0}
.top .sub{font-size:12px;color:var(--mute)}
.sp{flex:1}
#who{font-size:13px;color:var(--mute)}
.tabs{display:flex;gap:4px;padding:0 12px;width:100%;max-width:none;flex-wrap:wrap;align-items:center}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mute);padding:8px 12px}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--blue)}
.chip{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--ink2)}
.c-blue{background:var(--blue-bg);color:var(--blue-d);border-color:var(--blue-line)}
.c-green{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.c-amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.c-red{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.chip.wrap-chip,.wrap-chip{white-space:normal;overflow-wrap:anywhere;word-break:keep-all;max-width:100%;text-align:left}
main{display:block;padding:10px 26px 56px 12px;width:100%;max-width:none;margin:0}
.pane,.card,.scope-bar,.kpis,#projectsBox,#checkBox,#intakeBox,#reportBox,#coachBox,.report-workbench,.guide-grid,.scroll{width:100%;max-width:none}
.pane{display:none}
.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;min-width:0;max-width:100%}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:9px 12px;min-width:0;max-width:100%}
.bar>*{min-width:0;max-width:100%}
.sec{padding:9px 12px;font-weight:700;font-size:13px;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card>.sec:first-child{border-top:0;border-radius:10px 10px 0 0}
.note{background:var(--blue-bg);border:1px solid var(--blue-line);color:var(--blue-d);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:10px}
.warn{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}
.ok-banner{background:var(--green-bg);border:1px solid var(--green-line);color:var(--green);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:10px}
.scope-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.scope-lbl{font-weight:700;font-size:12px;color:var(--ink2);white-space:nowrap}
.report-workbench{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
@media (min-width:1560px){
  .report-workbench{grid-template-columns:minmax(0,1.15fr) minmax(0,0.85fr)}
  .report-side-sticky{position:sticky;top:92px;max-height:calc(100vh - 108px);overflow:auto}
}
.guide-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
@media (max-width:1180px){.guide-grid{grid-template-columns:1fr}}
.ind-card{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:11px 13px;display:flex;flex-direction:column;gap:6px}
.ind-hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ind-hd b{font-size:13.5px}
.ind-ul{margin:0;padding-left:18px;font-size:12px;color:var(--ink2);line-height:1.55}
.kpi{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--card);display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi span{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.k-blue b{color:var(--blue-d)}
.kpi.k-green b{color:var(--green)}
.kpi.k-amber b{color:var(--amber)}
.prof{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 12px;font-size:12.5px;border-bottom:1px solid var(--line);align-items:center}
.prof span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof b{color:var(--mute);font-weight:500;margin-right:4px}
.ws-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.ws-step{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);text-align:left;min-width:0;font-size:11.5px;white-space:normal}
.ws-step b{font-size:12px;display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-step span{font-size:11px;color:var(--mute);display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-step.done{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}
.ws-step.done span{color:var(--green)}
.ws-step.cur{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue-d)}
.ws-step.cur span{color:var(--blue-d)}
.scroll{overflow:auto}
table.t{width:100%;max-width:none;border-collapse:collapse}
table.t th,table.t td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{background:var(--bg);color:var(--ink2);font-size:12px;font-weight:600}
table.t td{overflow:hidden;text-overflow:ellipsis;max-width:480px}
table.t td.ti{font-weight:600;max-width:340px}
table.t td.wide{max-width:760px}
table.t th.c,table.t td.c{width:38px;text-align:center}
input[type=checkbox],input[type=radio]{width:24px;height:24px;min-width:24px;min-height:24px;margin:0;cursor:pointer;vertical-align:middle}
table.t input[type=checkbox]{width:24px;height:24px;margin:0;cursor:pointer;vertical-align:middle}
table.t th.n,table.t td.n{width:38px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
@media (min-width:769px){
  table.t td.wide{width:100%;max-width:0}
  table.t td[data-k="act"]{width:1%;white-space:nowrap;max-width:none}
  table.t td[data-k="act"] button.sm{margin-left:3px}
  table.t td[data-k="act"] button.sm:first-child{margin-left:0}
}
table.t tr[data-row]{cursor:pointer}
table.t tr[data-row]:hover>td{background:var(--bg)}
table.t tr.cur>td{background:var(--blue-bg)}
.empty{padding:24px 12px;text-align:center;color:var(--mute)}
.hint{font-size:12px;color:var(--mute)}
.fr{display:flex;gap:10px;padding:7px 14px;align-items:center}
.fr>label{width:130px;flex:none;color:var(--ink2);font-size:12.5px;font-weight:600;white-space:nowrap}
.fv{flex:1;min-width:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fv input[type=text],.fv input[type=number],.fv select{flex:1;min-width:140px}
.drop-zone{border:1.5px dashed var(--blue-line);background:var(--blue-bg);color:var(--blue-d);border-radius:10px;padding:14px 12px;text-align:center;cursor:pointer;margin:6px 0}
.drop-zone b{display:block;font-size:13px;margin-bottom:3px}
.drop-zone span{font-size:11.5px;color:var(--ink2)}
.rpt-sec-list{display:flex;flex-direction:column;gap:10px;padding:10px 12px}
.rpt-sec-card{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.rpt-sec-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
.rpt-sec-body{padding:10px 12px}
.rpt-sec-body textarea{min-height:110px;font-size:16px;line-height:1.6}
.mail-body{max-height:48vh;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.55}
.pv-doc{max-width:none;width:100%;margin:0;padding:16px 18px;border:1px solid var(--line2);border-radius:10px;background:var(--card);color:var(--ink)}
.pv-banner{border:2px solid var(--pri-bg);border-radius:8px;overflow:hidden;margin-bottom:14px;text-align:center}
.pv-top{background:var(--pri-bg);color:#ffffff;padding:6px 12px;font-weight:700;font-size:12px}
.pv-banner h2{margin:12px 12px 5px;font-size:17px;color:var(--ink)}
.pv-banner p{margin:0 12px 12px;color:var(--ink2);font-size:12px}
.pv-sec-hd{margin:14px 0 6px;padding:5px 10px;background:var(--blue-bg);border-left:4px solid var(--blue-d);color:var(--blue-d);font-weight:700;font-size:13px}
.pv-para{white-space:pre-wrap;margin-bottom:9px;color:var(--ink);font-size:12.5px;line-height:1.6}
.pv-tbl{width:100%;border-collapse:collapse;margin:7px 0 12px;font-size:11.5px}
.pv-tbl th,.pv-tbl td{border:1px solid var(--line2);padding:5px 7px;text-align:left;vertical-align:top}
.pv-tbl th{background:var(--bg);font-weight:700;text-align:center;color:var(--ink)}
#lock{display:none;max-width:460px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center}
#lock p{color:var(--mute);font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e293b;color:#ffffff;border-radius:10px;padding:10px 16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70;max-width:90vw}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(30,41,59,.42);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:12px;width:100%;max-width:740px;overflow:hidden}
.mhd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--bg);font-weight:700}
.mbd{padding:12px 14px;max-height:76vh;overflow:auto}
.mft{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.wide-only{display:inline}
@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ws-steps{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:768px){
  button.sm{min-height:36px;padding:6px 9px}
  input,select,textarea,.rpt-sec-body textarea{font-size:16px}
  input[type=checkbox],input[type=radio]{width:24px;height:24px;min-width:24px;min-height:24px;margin:0;vertical-align:middle}
  .modal{padding:0}
  .mbox{max-width:100vw;border-left:0;border-right:0;border-radius:0}
  .mbd{padding:10px;max-height:84vh}
  .wide-only{display:none}
  .top{padding:6px 8px;gap:6px;flex-wrap:wrap}
  .top h1{font-size:15px;white-space:nowrap;flex-shrink:0}
  .top .sub{display:none}
  #who{flex:0 1 auto;min-width:0;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:0;padding:0 6px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;padding:8px 8px;font-size:13px}
  main{padding:8px 0 64px}
  .card,.scope-bar,.ind-card{border-left:0;border-right:0;border-radius:0}
  .note,.warn,.ok-banner{margin:0 10px 10px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:0 10px}
  .ws-steps{grid-template-columns:repeat(2,minmax(0,1fr));padding:8px 10px}
  .fr{flex-direction:column;align-items:stretch;gap:4px;padding:6px 10px}
  .fr>label{width:auto}
  select{max-width:100%}
  table.t[data-name],table.t[data-name] thead,table.t[data-name] tbody{display:block;width:100%}
  table.t[data-name] thead tr{display:flex;align-items:center}
  table.t[data-name] thead th{display:none}
  table.t[data-name] thead th.c{display:block;width:40px;padding:6px 0;margin-left:4px}
  table.t[data-name] thead th.n{display:block;width:auto;text-align:left;padding:6px 0;white-space:nowrap}
  table.t[data-name] tbody tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;position:relative;padding:8px 10px 8px 76px;min-height:46px;border-bottom:1px solid var(--line)}
  table.t[data-name] tbody tr::after{content:'';flex:0 0 100%;height:0;order:5}
  table.t[data-name] tbody td{border:0;padding:0;max-width:none;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;order:6;color:var(--ink2);font-size:12.5px}
  table.t[data-name] tbody td:empty{display:none}
  table.t[data-name] tbody td.c{position:absolute;left:4px;top:8px;width:40px;text-align:center;order:0}
  table.t[data-name] tbody td.n{position:absolute;left:44px;top:11px;width:26px;text-align:right;order:0}
  table.t[data-name] tbody td.ti{order:1;flex:1 1 130px;min-width:130px;font-size:13.5px;font-weight:600;color:var(--ink)}
  table.t[data-name] tbody td[data-k="badge"]{order:2;color:var(--ink)}
  table.t[data-name] tbody td[data-k="act"]{order:7;flex:0 0 100%;display:flex;gap:5px;flex-wrap:wrap;padding-top:2px}
}
@media (max-width:520px){#who{display:none}}
</style>

<body class="pu-design pu-frame-a pu-dark-auto">
<div id="lock"><h2>🩺 현장클리닉</h2><p id="lockWhy">직원 계정으로 로그인하면 열립니다.</p></div>
<div id="app" style="display:none">
<header id="head">
  <div class="top">
    <h1>🩺 현장클리닉<span class="wide-only"> 통합워크스페이스</span></h1>
    <span class="sub">중기청 비즈니스지원단·방문·결과보고</span>
    <span class="sp"></span>
    <span id="who"></span>
    <span class="chip c-blue wide-only" id="syncStateChip" style="display:none" aria-live="polite"></span>
    <button type="button" class="sm" id="outBtn" style="display:none">로그아웃</button>
  </div>
  <nav class="tabs" role="tablist" aria-label="현장클리닉 작업 화면">
    <button type="button" role="tab" aria-selected="true" class="on" data-t="projects">🏢 수행 기업·자동감지</button>
    <button type="button" role="tab" aria-selected="false" data-t="check">✅ 체크리스트</button>
    <button type="button" role="tab" aria-selected="false" data-t="intake">📨 메일·카톡·자료수집</button>
    <button type="button" role="tab" aria-selected="false" data-t="report">📄 보고서·HWPX</button>
    <button type="button" role="tab" aria-selected="false" data-t="coach">🧠 수습 RAG 코치</button>
  </nav>
</header>
<main>
  <div id="recentDiffBarWrap"></div>
  <div class="kpis" id="kpiRow"></div>
  <div id="scopeBarWrap"></div>

  <section class="pane on" id="p-projects">
    <div class="card">
      <div class="bar">
        <input type="text" id="projQ" aria-label="기업명·트랙·메모 검색" placeholder="기업명 · 트랙 · 메모 검색" style="flex:1;min-width:180px">
        <button type="button" class="pri" id="newProjBtn">+ 신규 사업장 등록</button>
        <button type="button" class="ok" id="scanAllBtn">메일·카톡 재스캔</button>
        <button type="button" class="sm" id="reloadBtn">새로고침</button>
      </div>
      <div id="projectsBox"></div>
    </div>
    <div class="card" id="discoverCard">
      <div class="sec">
        <span>🔎 푸른메일함(IMAP+POP3) · 카톡/문자 수집함 자동 감지 후보</span>
        <span class="chip c-blue" id="nDiscover">0</span>
        <span class="sp"></span>
        <span class="hint">중소벤처기업청 비즈니스지원단 관련 메일·대화·ERP 사업유형을 자동 선별합니다</span>
      </div>
      <div id="discoverBox"></div>
    </div>
  </section>

  <section class="pane" id="p-check"><div id="checkBox"></div></section>
  <section class="pane" id="p-intake"><div id="intakeBox"></div></section>
  <section class="pane" id="p-report"><div id="reportBox"></div></section>
  <section class="pane" id="p-coach"><div id="coachBox"></div></section>
