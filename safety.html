<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>푸른노무법인 안전보건체계구축</title>
<!-- ⚠ pu-version.js 는 싣지 않는다 — 체크리스트 진단·위험성평가·보고서 원고 작성 중 자동 새로고침 시 미저장 작업이 초기화되지 않도록 보호한다 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🦺</text></svg>">
<!-- ══════════════════════════════════════════════════════════════════════
     푸른노무법인 안전보건관리체계 구축 통합 워크스페이스 (safety.html) — 2026-11-23
     의뢰인 업무 › 과거 수행이력 통합 아카이브 · 신규 사업장 착수 사전체크 · 다업종 맞춤 체크리스트 · 위험성평가 · HWPX/1P요약

     ★ 하는 일:
       1. 과거 안전보건체계구축 수행 사업장(2022~2026)·푸른메일함(mailbox)·컨설팅 폴더를 비식별 집계·아카이브한다.
       2. 신규 사업장 착수 전 사전 체크(12항목)·근로자 규모별 법적 의무(5인이상/20인이상/50인이상)를 자동 판별한다.
       3. 제조업(일반·고위험특화), 유통/도소매/물류, 서비스/시설관리, 의료/사회복지, 숙박/외식, 교육/사무, 건설/도급
          8대 업종별 특화 체크리스트 + 7대 핵심요소(25문항) + 고위험 기인물 24종 + 표준 16대 서류를 통합 점검한다.
       4. 종합보고서(7장)·핵심 개선사항 1P 요약보고서·업종 맞춤 체크리스트(.hwpx/.xlsx/.zip) 및 푸른한글(hangul.html) 연동을 제공한다.
     ★ 모든 쓰기는 PuOntologyWrite 강제 관문(enforce)을 거치며 물리 삭제 대신 _deleted 표식을 남긴다.
     ══════════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --ink:#1e293b; --ink2:#475569; --mute:#475569; --line:#e2e8f0; --line2:#cbd5e1; --bg:#f8fafc; --card:#ffffff;
  --blue:#2563eb; --blue-d:#1e40af; --blue-bg:#eff6ff; --blue-line:#bfdbfe;
  --green:#166534; --green-m:#16a34a; --green-bg:#f0fdf4; --green-line:#bbf7d0;
  --amber:#854d0e; --amber-m:#d97706; --amber-bg:#fffbeb; --amber-line:#fde68a;
  --red:#991b1b; --red-m:#dc2626; --red-bg:#fef2f2; --red-line:#fecaca;
  --pri-bg:#1e40af; --ok-bg:#166534;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#f8fafc; --ink2:#e2e8f0; --mute:#cbd5e1; --line:#475569; --line2:#64748b; --bg:#000000; --card:#1e293b;
    --blue:#60a5fa; --blue-d:#bfdbfe; --blue-bg:#1e293b; --blue-line:#2563eb;
    --green:#4ade80; --green-m:#16a34a; --green-bg:#1e293b; --green-line:#16a34a;
    --amber:#fde68a; --amber-m:#d97706; --amber-bg:#1e293b; --amber-line:#d97706;
    --red:#fecaca; --red-m:#dc2626; --red-bg:#1e293b; --red-line:#dc2626;
    --pri-bg:#2563eb; --ok-bg:#166534;
  }
}
*{box-sizing:border-box}
html,body{width:100%;max-width:none;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 11px;line-height:1.3;white-space:nowrap}
button:hover{border-color:var(--mute)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.drop-zone:focus-visible,.kpi[role="button"]:focus-visible,.sub-fold>summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--pri-bg);border-color:var(--pri-bg);color:#ffffff;font-weight:600}
button.ok{background:var(--ok-bg);border-color:var(--ok-bg);color:#ffffff;font-weight:600}
button.warn-btn{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber);font-weight:600}
button.danger{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
button.sm{padding:3px 8px;min-height:26px;font-size:11.5px}
input,select,textarea{font:inherit;font-size:13px;padding:4px 7px;border:1px solid var(--line2);border-radius:7px;background:var(--card);color:var(--ink)}
textarea{width:100%;resize:vertical;font-family:inherit;line-height:1.55;word-break:keep-all;overflow-wrap:break-word}
a{color:var(--blue-d);text-decoration:none}
a.act-link{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid var(--blue-line);border-radius:7px;background:var(--blue-bg);color:var(--blue-d);font-size:11.5px;font-weight:600;white-space:nowrap}
#head{position:sticky;top:0;z-index:20;width:100%;max-width:none;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:6px;padding:4px 12px;width:100%;max-width:none;flex-wrap:wrap}
.top h1{font-size:15px;margin:0;white-space:nowrap}
.top .sub{font-size:11px;color:var(--mute);white-space:nowrap}
#head .top button.sm,#head .top a.act-link{padding:3px 7px;min-height:25px;font-size:11.5px}
.sp{flex:1}
#who{font-size:12px;color:var(--mute)}
#who b{color:var(--ink)!important}
.tabs{display:flex;gap:3px;padding:0 12px;width:100%;max-width:none;flex-wrap:wrap;align-items:center}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mute);padding:5px 10px;font-size:12px}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--blue)}
.chip{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--ink2)}
.c-blue{background:var(--blue-bg);color:var(--blue-d);border-color:var(--blue-line)}
.c-green{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.c-amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.c-red{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.c-direct{background:var(--ok-bg);color:#ffffff;border-color:var(--ok-bg);font-weight:700}
.c-direct-ing{background:var(--pri-bg);color:#ffffff;border-color:var(--pri-bg);font-weight:600}
.c-urgent{background:var(--red-bg);color:var(--red);border-color:var(--red-line);font-weight:700}
main{display:block;padding:7px 24px 48px 12px;width:100%;max-width:none;margin:0}
.pane,.card,.scope-bar,.kpis,#projectsBox,#checkBox,#docsBox,#intakeBox,#reportBox,#guideBox,.report-workbench,.guide-grid,.scroll{width:100%;max-width:none}
.pane{display:none}
.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:7px}
.bar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:6px 10px}
.sec{padding:9px 12px;font-weight:700;font-size:13px;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card>.sec:first-child{border-top:0;border-radius:10px 10px 0 0}
.note{background:var(--blue-bg);border:1px solid var(--blue-line);color:var(--blue-d);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:10px}
.warn{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}
.ok-banner{background:var(--green-bg);border:1px solid var(--green-line);color:var(--green);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}
.err-banner{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}
/* ── 상단 1줄 균등 셀 KPI·트랙 통합 바 (모든 셀 동일 폭 · 1행 일렬 통일) ── */
.sf-top-strip{padding:6px 10px;margin-bottom:7px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.sf-top-strip .scope-bar{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;width:100%;margin:0;padding:0;background:transparent;border:none;border-radius:0}
.sf-top-strip .scope-bar[hidden]{display:none}
.sf-top-strip .scope-lbl{font-weight:700;font-size:12px;color:var(--ink2);white-space:nowrap;margin-right:2px}
.sf-top-strip .scope-btn{flex:1 1 0;min-width:0;padding:4px 9px;min-height:30px;border-radius:8px;font-weight:600;font-size:12px;border:1px solid var(--line2);background:var(--card);color:var(--ink)}
.sf-top-strip .scope-btn:hover{border-color:var(--blue)}
.sf-top-strip .kpis,.kpis{display:flex;flex-wrap:nowrap;width:100%;gap:6px;margin:0;align-items:stretch}
.sf-top-strip .kpi,.kpi{flex:1 1 0;min-width:0;min-height:32px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:6px;padding:5px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);box-shadow:none}
.sf-top-strip .kpi[data-kpi-status],.sf-top-strip .kpi[data-kpi-kosha]{cursor:pointer}
.sf-top-strip .kpi[data-kpi-status]:hover,.sf-top-strip .kpi[data-kpi-kosha]:hover{border-color:var(--blue)}
.sf-top-strip .kpi.k-on{background:var(--pri-bg);border-color:var(--pri-bg);color:#ffffff}
.sf-top-strip .kpi.k-direct.k-on{background:var(--ok-bg);border-color:var(--ok-bg);color:#ffffff}
.sf-top-strip .kpi span,.kpi span{font-size:11.5px;font-weight:700;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sf-top-strip .kpi b,.kpi b{font-size:13px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.sf-top-strip .kpi.k-blue b,.kpis .kpi.k-blue b{color:var(--blue-d)}
.sf-top-strip .kpi.k-green b,.kpis .kpi.k-green b{color:var(--green)}
.sf-top-strip .kpi.k-amber b,.kpis .kpi.k-amber b{color:var(--amber)}
.sf-top-strip .kpi.k-on span,.sf-top-strip .kpi.k-on b{color:#ffffff}
.scope-btn.on{background:var(--pri-bg);border-color:var(--pri-bg);color:#ffffff}
.scope-btn.ok{background:var(--ok-bg);border-color:var(--ok-bg);color:#ffffff}
.scope-btn.ok.on{background:var(--ok-bg);border-color:var(--ok-bg);color:#ffffff}
.report-workbench{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
@media (min-width:1560px){
  .report-workbench{grid-template-columns:minmax(0,1.15fr) minmax(0,0.85fr)}
  .report-side-sticky{position:sticky;top:92px;max-height:calc(100vh - 108px);overflow:auto}
}
.guide-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
@media (max-width:1180px){.guide-grid{grid-template-columns:1fr}}
.ind-card{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:11px 13px;display:flex;flex-direction:column;gap:6px}
.ind-card.on{border-color:var(--blue);background:var(--blue-bg)}
.ind-hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ind-hd b{font-size:13.5px}
.ind-ul{margin:0;padding-left:18px;font-size:12px;color:var(--ink2);line-height:1.55}
.pbar{display:inline-flex;gap:2px;align-items:center;vertical-align:middle;margin-right:5px}
.pdot{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--line2)}
.pdot.done{background:var(--green-m)}
.pdot.cur{background:var(--blue)}
.ws-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:6px 12px;background:var(--bg);border-top:1px solid var(--line)}
.ws-step{display:flex;align-items:center;justify-content:center;gap:4px;min-height:32px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--mute);text-align:center;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-step b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-step.done{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}
.ws-step.cur{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue-d);font-weight:700}
.sub-fold{border-top:1px solid var(--line);background:var(--bg)}
.sub-fold>summary{list-style:none;display:flex;align-items:center;gap:6px;min-height:32px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;user-select:none}
.sub-fold>summary::-webkit-details-marker{display:none}
.sub-fold>summary::before{content:'▸';font-size:11px;color:var(--mute)}
.sub-fold[open]>summary::before{content:'▾'}
.sub-fold>summary:hover{color:var(--ink)}
.sub-fold-bd{padding:8px 12px 10px;background:var(--card);border-top:1px solid var(--line);font-size:12px;color:var(--ink2);line-height:1.55}
.bulk{display:none;gap:6px;align-items:center;padding:6px 12px;background:var(--blue-bg);border-bottom:1px solid var(--blue-line);font-size:12.5px;flex-wrap:wrap}
.bulk.on{display:flex}
.scroll{overflow:auto}
table.t{width:100%;max-width:none;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{background:var(--bg);color:var(--ink2);font-size:11.5px;font-weight:600}
table.t td{overflow:hidden;text-overflow:ellipsis;max-width:480px}
table.t td.ti{font-weight:600;max-width:340px}
table.t td.wide{max-width:760px}
table.t th.c,table.t td.c{width:30px;text-align:center}
table.t th.yr,table.t td.yr{width:52px;text-align:center}
table.t th.st,table.t td.st{width:70px;text-align:center}
input[type=checkbox],input[type=radio]{width:24px;height:24px;min-width:24px;min-height:24px;margin:0;cursor:pointer;vertical-align:middle}
table.t input[type=checkbox]{width:24px;height:24px;margin:0;cursor:pointer;vertical-align:middle}
table.t th.n,table.t td.n{width:28px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
@media (min-width:769px){
  table.t td.wide,table.t th.wide{width:100%;max-width:0;overflow:hidden;text-overflow:ellipsis}
  table.t td[data-k="act"]{width:1%;white-space:nowrap;max-width:none}
  table.t td[data-k="act"] button.sm{margin-left:3px;padding:3px 6px}
  table.t td[data-k="act"] button.sm:first-child{margin-left:0}
}
table.t tr[data-row]{cursor:pointer}
table.t tr[data-row]:hover>td{background:var(--bg)}
table.t tr.cur>td{background:var(--blue-bg)}
table.t tr.cur>td.n{color:var(--ink2)}
table.t tr.perf-direct>td:first-child{box-shadow:inset 3px 0 0 var(--green-m)}
.empty{padding:24px 12px;text-align:center;color:var(--mute)}
.hint{font-size:12px;color:var(--mute)}
.fr{display:flex;gap:10px;padding:7px 14px;align-items:center}
.fr>label{width:130px;flex:none;color:var(--ink2);font-size:12.5px;font-weight:600;white-space:nowrap}
.fv{flex:1;min-width:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fv input[type=text],.fv input[type=email],.fv input[type=number],.fv input[type=date],.fv select{flex:1;min-width:140px}
.prog-wrap{height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:1;min-width:100px;max-width:220px}
.prog-fill{height:100%;background:var(--green-m)}
.drop-zone{border:1.5px dashed var(--blue-line);background:var(--blue-bg);color:var(--blue-d);border-radius:10px;padding:14px 12px;text-align:center;cursor:pointer;margin:10px 12px}
.drop-zone:hover,.drop-zone.drag{border-color:var(--blue);background:var(--card)}
.drop-zone b{display:block;font-size:13px;margin-bottom:3px}
.drop-zone span{font-size:11.5px;color:var(--ink2)}
.sec-list-hd{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink2);flex-wrap:wrap}
.sec-no{min-width:22px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px}
.rpt-sec-list{display:flex;flex-direction:column;gap:10px;padding:10px 12px}
.rpt-sec-card{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.rpt-sec-card.sel{border-color:var(--blue)}
.rpt-sec-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
.rpt-sec-hd b{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpt-sec-body{padding:10px 12px}
.rpt-sec-body textarea{min-height:115px;font-size:16px;line-height:1.6}
.eos-bars{display:flex;flex-direction:column;gap:7px;padding:10px 12px}
.eos-row{display:grid;grid-template-columns:190px minmax(0,1fr) 125px;gap:8px;align-items:center;font-size:12px}
.eos-lbl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eos-track{position:relative;height:16px;background:var(--line);border-radius:4px;overflow:hidden}
.eos-fill{height:100%;background:var(--blue)}
.eos-fill.low{background:var(--amber-m)}
.eos-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.task-pick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.task-opt{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
.task-opt.on{border-color:var(--blue);background:var(--blue-bg)}
.task-opt div{min-width:0;flex:1}
.task-opt b{display:block;font-size:12.5px}
.task-opt span{display:block;font-size:11.5px;color:var(--ink2);margin-top:2px}
.mail-body{max-height:48vh;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.55}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg);align-items:center}
.pill-row.uniform-row{flex-wrap:nowrap;width:100%}
.pill-row.uniform-row .scope-btn{flex:1 1 0;min-width:0;min-height:32px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ── 웹 A4 미리보기 (27색 팔레트 변수만 사용) ── */
.pv-doc{max-width:100%;overflow-x:auto;width:100%;margin:0;padding:16px 18px;border:1px solid var(--line2);border-radius:10px;background:var(--card);color:var(--ink)}
.pv-banner{border:2px solid var(--pri-bg);border-radius:8px;overflow:hidden;margin-bottom:14px;text-align:center}
.pv-green .pv-banner{border-color:var(--ok-bg)}
.pv-high .pv-banner{border-color:var(--red)}
.pv-top{background:var(--pri-bg);color:#ffffff;padding:6px 12px;font-weight:700;font-size:12px}
.pv-green .pv-top{background:var(--ok-bg)}
.pv-high .pv-top{background:var(--red)}

  document.getElementById('lockWhy').textContent='인터넷 연결이 필요합니다';
} else {
  if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
  if(window.PuSafetyView) PuSafetyView.boot(firebase);
  else if(window.PuGate) PuGate.show();
}
</script>
