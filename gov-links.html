<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>푸른노무법인 정부사업 바로가기</title>
<!-- ═══════════════════════════════════════════════════════
     푸른노무법인 정부사업 바로가기 (gov-links.html) — 2026-11-28
     대표 지시 「정부 지원 사업 바로 가기 앱을 차라리 하나 만들어줘 … 누르면 지금 진행하고 있는 모든 사업들, 기업 연결 다 시켜주고 …
       나중에 더 늘 수도 있고 빠질 수도 있는데 … 그 사업 바로 사업 보고나 시스템 들어갈 수 있게」
       (바탕화면 컨설팅업체\정부지원사업_바로가기.html · 북마크 «컨설팅 기관등» 을 앱으로 옮김)

     ★ 하는 일: 사업마다 카드 하나 — 기관 시스템 주소(로그인 표시) · 할 일 메모 · 이 PC 폴더 경로 복사 ·
       이어 둔 이알피 컨설팅 사업의 «올해 업체»(누르면 정부사업일정 보고서 창 #rpt=업체|사업).
       이알피에서 진행 중인데 카드가 없는 사업은 «바로가기 없는 진행 사업»에 저절로 나온다. 종결(scal_bizState)되면 «종결된 사업»으로 내려간다.
     ★ 쓰는 자리(관문 강제 모드, PROGRAMS.govlinks.writeContracts): govlinks/sets/{id} (GovLinkSet) 하나뿐.
       지우기는 _deleted 표식(공용 관문 tombstone) — «지운 묶음»에서 되살린다.
     ★ 읽기만: 이알피 컨설팅 사업(data/biz_cons_types) · 사업 이음표(scal_erpTypeMap) · 정부사업일정 업체·사업·일정·담당(scal_cos·scal_types·scal_scheds·scal_staff)
       · 사업 종결·순서(scal_bizState·scal_bizOrder) · uid_roles. 컨설팅보고서(gov-report.html)와 같은 모듈(PuGovReportDocs·Nav)로 묶는다.
     ⚠ 재직 직원 모두 열고 고친다(규칙 govlinks = LOGIN). 주소는 http(s) 만 저장·표시한다(js/pu-gov-links.js safeUrl).
     ⚠ 아이디·비밀번호 칸은 없다 — 넣지 않는다. 폴더 경로는 «복사»만(브라우저는 내 PC 폴더를 직접 못 연다).
     ═══════════════════════════════════════════════════════ -->
<style>
:root{
  --ink:#1e293b; --ink2:#475569; --mute:#64748b; --line:#e2e8f0; --line2:#cbd5e1; --bg:#f8fafc; --card:#ffffff;
  --blue:#2563eb; --blue-d:#1e40af; --blue-bg:#eff6ff; --blue-line:#bfdbfe;
  --green:#166534; --green-m:#16a34a; --green-bg:#f0fdf4; --green-line:#bbf7d0;
  --amber:#854d0e; --amber-m:#d97706; --amber-bg:#fffbeb; --amber-line:#fde68a;
  --red:#991b1b; --red-bg:#fef2f2; --red-line:#fecaca;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;word-break:keep-all}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 11px;line-height:1.3;white-space:nowrap}
button:hover{border-color:var(--mute)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--blue);border-color:var(--blue);color:#ffffff}
button.del{color:var(--red);border-color:var(--red-line)}
button.sm{padding:3px 9px;font-size:12px}
button.ic{padding:2px 7px;font-size:12px;color:var(--mute)}
input,select,textarea{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line2);border-radius:7px;background:var(--card);color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--blue-line);border-color:var(--blue)}
textarea{width:100%;resize:vertical}
a{color:var(--blue-d);text-decoration:none}
#head{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:9px 16px;flex-wrap:wrap}
.top h1{font-size:17px;margin:0;white-space:nowrap}
.top .sub{font-size:12px;color:var(--mute)}
.sp{flex:1}
#who{font-size:13px;color:var(--mute)}
.tabs{display:flex;gap:4px;padding:0 16px;flex-wrap:wrap}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mute);padding:8px 12px}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--blue)}
.chip{display:inline-block;min-width:18px;text-align:center;border-radius:9px;padding:0 6px;font-size:11px;background:var(--blue-bg);color:var(--blue-d);border:1px solid var(--blue-line)}
/* 한 번에 전체 화면에서 빨리 누르게 — 폭을 막지 않는다(대표 지시 2026-11-28) */
main{padding:10px 14px 40px}
.pane{display:none}
.pane.on{display:block}
.hint{font-size:12px;color:var(--mute)}
/* 1줄 균등 셀 KPI 바 — 모든 칸이 같은 폭·같은 높이, 칸 안은 «이름 · 수» 한 줄 */
.kpis{display:flex;flex-wrap:nowrap;gap:6px;width:100%;margin:0 0 8px}
.kpis .k{flex:1 1 0;min-width:0;min-height:32px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:12.5px;color:var(--ink2);white-space:nowrap}
.kpis .k span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.kpis .k b{font-variant-numeric:tabular-nums;color:var(--ink)}
.kpis .k.k-on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d)}
.kpis .k.k-on b{color:var(--blue-d)}
.tool{display:flex;gap:8px;align-items:center;margin-bottom:8px}
#q{flex:1 1 auto;min-width:0;padding:8px 11px;font-size:14px}
#cnt{font-size:12px;color:var(--mute);white-space:nowrap}
.strip{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.strip .lb{font-size:12px;color:var(--mute);margin-right:2px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:4px 11px;border-radius:999px;background:var(--blue-bg);color:var(--blue-d);border:1px solid var(--blue-line);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill:hover{border-color:var(--blue)}
.pill.in{background:var(--card);color:var(--ink2);border-color:var(--line2)}
.banner{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-radius:9px;margin:8px 0;font-size:12.5px}
.banner.info{background:var(--blue-bg);border:1px solid var(--blue-line);color:var(--blue-d)}
.banner.warn{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber)}
.banner.err{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red)}
/* ── 왼쪽 대시보드 · 오른쪽 상세 (대표 지시 2026-11-28 「왼쪽에 대시보드 … 클릭하면 오른쪽 메인 화면에 도메인 주소하고 어떻게 해야 되는지」) ── */
.gl-split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:12px;align-items:start}
.dash{position:sticky;top:96px;max-height:calc(100vh - 106px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.dash-top{display:flex;gap:6px;align-items:center;position:sticky;top:-8px;background:var(--card);padding:2px 0 6px;z-index:1}
.dash-top #q{flex:1 1 auto;min-width:0;padding:7px 10px;font-size:13.5px}
.dhd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mute);padding:8px 4px 3px;white-space:nowrap}
.dhd .sp{flex:1}
.drow{display:flex;align-items:center;gap:4px;border-radius:8px;min-width:0}
.drow:hover{background:var(--bg)}
.drow.on{background:var(--blue-bg);box-shadow:inset 3px 0 0 var(--blue)}
.drow .pick{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:6px;border:none;background:none;border-radius:8px;padding:6px 4px;text-align:left;cursor:pointer;color:var(--ink)}
.drow .pick .t{min-width:0;flex:1 1 auto;display:flex;align-items:baseline;gap:6px;overflow:hidden;white-space:nowrap}
.drow .pick .t b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.drow .pick .t i{font-style:normal;font-size:11.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:0}
.drow .pick .n{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.star{border:none;background:none;padding:4px 5px;font-size:15px;line-height:1;color:var(--line2);cursor:pointer;border-radius:6px;flex:0 0 auto;min-width:26px;min-height:26px}
.star.on{color:var(--amber-m)}
.star:hover{color:var(--amber-m)}
.caret{border:none;background:none;padding:4px 5px;font-size:11px;color:var(--mute);cursor:pointer;flex:0 0 auto;border-radius:6px;min-width:26px;min-height:26px}
.dsub{display:flex;flex-direction:column;margin:0 0 4px 30px;border-left:2px solid var(--line);padding-left:4px}
.dlink{display:flex;align-items:center;gap:4px;min-width:0;border-radius:7px}
.dlink:hover{background:var(--blue-bg)}
.dlink a{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:6px;padding:4px 4px;color:var(--ink);font-size:12.5px;white-space:nowrap;overflow:hidden}
.dlink a span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.dlink a .h{color:var(--mute);font-size:11px;flex:0 0 auto}
.dempty{font-size:12px;color:var(--mute);padding:4px 6px}
/* 오른쪽 상세 */
.detail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px 18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.dh{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.dh h2{font-size:19px;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh .org{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dh .star{font-size:20px}
.how{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink);white-space:pre-wrap;line-height:1.6}
.how .lbl{display:block;font-size:12px;font-weight:700;color:var(--blue-d);margin-bottom:2px;white-space:normal}
.how.none{border-left-color:var(--line2);color:var(--mute)}
.sites{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 2px;min-width:0}
.srow:hover{border-color:var(--blue-line);background:var(--blue-bg)}
.srow a.go{flex:1 1 auto;min-width:0;display:grid;grid-template-columns:minmax(0,auto) auto minmax(0,1fr);align-items:center;column-gap:10px;padding:7px 4px;color:var(--ink)}
.srow a.go .nm{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow a.go .dom{font-size:12.5px;color:var(--blue-d);font-family:Consolas,'Malgun Gothic',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow a.go .mm{grid-column:1 / -1;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .open{flex:0 0 auto}
.opmode{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.opmode button{border:none;border-radius:0;padding:3px 10px;font-size:12px;background:var(--card);color:var(--mute)}
.opmode button.on{background:var(--blue);color:#ffffff}
.dsec{display:flex;flex-direction:column;gap:6px}
.dsec>.lbl{font-size:12px;font-weight:700;color:var(--mute)}
.badge{font-size:11px;padding:1px 6px;border-radius:5px;white-space:nowrap;color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-line)}
.badge.g{color:var(--green);background:var(--green-bg);border-color:var(--green-line)}
.badge.m{color:var(--mute);background:var(--bg);border-color:var(--line2)}
.prog{border-top:1px dashed var(--line);padding-top:7px;display:flex;flex-direction:column;gap:5px}
.pl{display:flex;align-items:center;gap:6px;font-size:12.5px;min-width:0}
.pl .t{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.cos{display:flex;flex-wrap:wrap;gap:5px}
.co{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:7px;border:1px solid var(--green-line);background:var(--green-bg);color:var(--green);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co:hover{border-color:var(--green-m)}
.co small{color:var(--mute);font-size:11px}
.sug{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.folders{border-top:1px dashed var(--line);padding-top:7px;display:flex;flex-direction:column;gap:4px}
.folder{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);min-width:0}
.folder span{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{font-size:14px;font-weight:700;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px}
details.closed>summary{cursor:pointer;font-size:14px;font-weight:700;margin:18px 0 6px;color:var(--ink2)}
.empty{color:var(--mute);padding:26px 0;text-align:center}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:8px 10px}
.selbar{display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 10px;background:var(--blue-bg);border-bottom:1px solid var(--blue-line);color:var(--blue-d);font-size:12.5px}
.selbar.on{display:flex}
.scroll{overflow:auto}
.mt{border-collapse:collapse;width:100%}
.mt th,.mt td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
.mt th{font-size:12px;color:var(--mute);font-weight:600;background:var(--bg)}
.mt td.ck,.mt th.ck{width:28px;text-align:center;padding:6px 4px}
.mt td.no,.mt th.no{width:36px;text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
.mt td.nm{max-width:260px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mt td.org,.mt td.bz{max-width:220px;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.mt td.num{text-align:right;font-variant-numeric:tabular-nums}
.mt td.sub{display:none}
.mt tr.sel td{background:var(--blue-bg)}
.act{display:flex;gap:4px;align-items:center}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.mbox{background:var(--card);border-radius:12px;width:100%;max-width:720px;padding:16px 18px;box-shadow:0 12px 40px rgba(15,23,42,.25)}
.mbox h3{margin:0 0 10px;font-size:16px}
.fv{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fv>label{font-size:12px;color:var(--mute);font-weight:600}
.fv input[type=text],.fv input:not([type]){width:100%}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto auto;gap:6px;align-items:center;margin-bottom:8px}
.lrow .lm{grid-column:1 / -1;font-size:12.5px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;margin-bottom:5px}
.ckl{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);white-space:nowrap}
.bzl{display:flex;flex-direction:column;gap:3px;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.bzl label{display:flex;align-items:center;gap:6px;font-size:12.5px;min-width:0}
.bzl label span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.errs{color:var(--red);font-size:12.5px;margin:6px 0}
.mfoot{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
#lock{display:none;max-width:460px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#ffffff;border-radius:10px;padding:10px 16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw}
#toast.on{opacity:1}
.phone-only{display:none}
/* ── 폰 — 이 구간에서만 바꾼다. PC 는 위 그대로(대표 지시 2026-10-18 「폰에서 한 화면에」) ── */
@media (max-width:768px){
  input,select,textarea{font-size:16px}
  #q{font-size:16px}
  .phone-only{display:inline}
  .wide-only{display:none}
  .top{padding:8px 10px;gap:6px}
  .top .sub{display:none}
  .tabs{padding:0 6px}
  main{padding:8px 5px 40px}   /* 양옆 = 5 + 상자 테두리 1 + 상자 안 8 = 14px(폰 규칙 8~14px) */
  button{min-height:32px}
  /* 폰 — 대시보드 한 화면 → 사업을 누르면 상세 한 화면(「← 목록」·뒤로가기로 돌아온다) */
  .gl-split{display:block}
  .dash{position:static;max-height:none;padding:6px 8px}
  .dash-top{position:static}
  .dash-top #q{font-size:16px}
  .detail{display:none;padding:10px 8px 14px}
  .gl-split.show-detail .dash{display:none}
  .gl-split.show-detail .detail{display:flex}
  .drow .pick{min-height:40px}
  .star,.caret{min-width:32px;min-height:32px}
  .dlink a{min-height:36px}
  .srow a.go{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
  .srow a.go .dom{grid-column:1 / -1}
  .dh h2{font-size:17px;white-space:normal}
  .mbox{padding:14px 12px}
  .modal{padding:0}
  .lrow{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:'n l x' 'u u u' 'm m m'}
  .lrow .ln{grid-area:n} .lrow .lu{grid-area:u} .lrow .ckl{grid-area:l} .lrow .lx{grid-area:x} .lrow .lm{grid-area:m;font-size:16px}
  .kpis{overflow-x:auto;scrollbar-width:none}
  .kpis .k{flex:0 0 auto;min-height:36px}
  .pill{flex:0 0 auto;padding:6px 11px}
  .mt input[type=checkbox]{width:24px;height:24px;margin:0}
  /* 목록 관리 표 → 줄마다 두 줄 카드(☐·№ 는 왼쪽 끝 그대로) */
  .mt thead{display:none}
  .mt tr{display:grid;grid-template-columns:28px 32px minmax(0,1fr) auto;align-items:center;border-bottom:1px solid var(--line);padding:4px 3px}
  .mt td{border-bottom:none;padding:3px 4px}
  .mt td.ck{grid-column:1;grid-row:1 / 3}
  .mt td.no{grid-column:2;grid-row:1 / 3;width:auto}
  .mt td.nm{grid-column:3;grid-row:1;max-width:none}
  .mt td.ac{grid-column:4;grid-row:1}
  .mt td.sub{display:block;grid-column:3 / 5;grid-row:2;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--mute)}
  .mt td.org,.mt td.bz,.mt td.num,.mt td.at{display:none}
}

    return '<a class="pill in" href="'+esc(a.url)+'" title="푸른 '+esc(a.name)+' 열기">'+esc(a.icon)+' '+esc(a.name)+'</a>';

/* 1줄 균등 셀 KPI 바 — 묶음·사이트·로그인·이어 둔 사업·올해 업체·바로가기 없는 진행 사업.
   «로그인»·«이어 둔 사업»·«올해 업체»는 누르면 대시보드를 그것만 거른다(다시 누르면 풂) · «바로가기 없는 진행 사업»은 그 칸으로 간다 */
function renderKpis(b){
  var cards=b.cards||[], sites=0, login=0, progs=0, cos=0;
  cards.forEach(function(c){
    sites+=c.set.links.length;
    login+=c.set.links.filter(function(l){ return l.login; }).length;
    progs+=c.programs.filter(function(p){ return !p.missing&&!p.closed; }).length;
    cos+=c.companyCount;
  });
  var cell=function(k,label,n,tip){
    var on=!!(k&&KF===k), toggle=(k==='login'||k==='progs'||k==='cos');   /* aria-pressed 는 «켜고 끄는» 칸에만 — 모두 보기·내려가기는 그냥 단추 */
    return '<button type="button" class="k'+(on?' k-on':'')+'" data-act="kpi" data-k="'+k+'"'+(toggle?' aria-pressed="'+(on?'true':'false')+'"':'')+' title="'+esc(tip)+'"><span>'+label+'</span><b>'+n+'</b></button>';

    +cell('all','사이트',sites,'거르기를 풀고 모두 봅니다')
    +cell('login','로그인',login,'로그인이 필요한 사이트가 있는 사업만 봅니다(다시 누르면 풂)')
    +cell('progs','이어 둔 사업',progs,'이알피 사업이 이어진 사업만 봅니다(다시 누르면 풂)')
    +cell('cos',kstYear()+'년 업체',cos,'올해 업체가 있는 사업만 봅니다(다시 누르면 풂)')
    +cell('bare','바로가기 없는 진행 사업',(b.bare||[]).length,'바로가기가 아직 없는 이알피 진행 사업으로 갑니다');
  $('resetBtn').style.display=(Q||KF)?'':'none';
}

/* 사이트 열기 — 팝업창: 사이트마다 창 이름 하나(다시 누르면 그 창을 다시 쓴다). 빈 창을 먼저 열어 opener 를 끊고 나서 주소로 보낸다
   (직원 누구나 고치는 목록이라, 열린 사이트가 이 화면을 몰래 다른 주소로 바꾸지 못하게). 팝업이 막히면 새 탭으로 */
function popName(url){ var h=L.hostOf(url)||'site'; return 'gl_'+h.replace(/[^A-Za-z0-9]/g,'_').slice(0,40); }
function openSite(url, mode){
  url=L.safeUrl(url); if(!url) return;
  lsSet('recent', L.pushRecent(lsGet('recent'), url, 6));
  if(mode!=='pop'){ var t=window.open(url,'_blank','noopener,noreferrer'); if(!t){} return; }
  var aw=(screen&&screen.availWidth)||1366, ah=(screen&&screen.availHeight)||800;
  var w=Math.min(1440,Math.round(aw*0.86)), hh=Math.min(1000,Math.round(ah*0.9));
  var win=null;
  try{ win=window.open('about:blank',popName(url),'popup=yes,width='+w+',height='+hh+',left='+Math.round((aw-w)/2)+',top='+Math.round((ah-hh)/2)+',resizable=yes,scrollbars=yes'); }catch(e){ win=null; }
  if(!win){ toast('팝업이 막혀 새 탭으로 엽니다 — 주소줄 오른쪽 «팝업 차단» 표시에서 이 주소를 허용하면 다음부터 팝업창으로 열립니다'); window.open(url,'_blank','noopener,noreferrer'); return; }
  try{ win.opener=null; }catch(e){}
  try{ win.location.replace(url); }catch(e){ try{ win.location.href=url; }catch(_e){} }
  try{ win.focus(); }catch(e){}
}

    +'<div class="fv"><label for="fNote">할 일 · 순서 (오른쪽 화면 맨 위에 늘 보입니다 · 줄을 바꿔 차례대로 적으세요)</label><textarea id="fNote" rows="4" maxlength="'+L.LIMIT.note+'" placeholder="예: ① 플랫폼 로그인 → ② 수행일지 등록 → ③ 사진·서명지 올리기">'+esc(s.note)+'</textarea></div>'
    +'<div class="fv"><label>사이트 — 주소는 http:// · https:// 만 · 아이디·비밀번호는 적지 마세요</label><div id="fLinks">';
  s.links.forEach(function(l,i){
    h+='<div class="lrow"><input class="ln" data-f="name" data-i="'+i+'" value="'+esc(l.name)+'" maxlength="'+L.LIMIT.linkName+'" placeholder="이름" aria-label="사이트 이름">'
      +'<input class="lu" data-f="url" data-i="'+i+'" value="'+esc(l.url)+'" maxlength="'+L.LIMIT.url+'" placeholder="https://…" inputmode="url" aria-label="사이트 주소">'
      +'<label class="ckl"><input type="checkbox" data-f="login" data-i="'+i+'"'+(l.login?' checked':'')+'>로그인</label>'
      +'<button class="ic lx" data-act="rmLink" data-i="'+i+'" title="이 사이트 빼기">✕</button>'
      +'<input class="lm" data-f="memo" data-i="'+i+'" value="'+esc(l.memo||'')+'" maxlength="'+L.LIMIT.linkMemo+'" placeholder="여기서 하는 일 (예: 수행일지·사진 올리는 곳)" aria-label="이 사이트에서 하는 일"></div>';
  });
  h+='</div><div><button class="sm" data-act="addLink"'+(s.links.length>=L.LIMIT.links?' disabled':'')+'>+ 사이트 추가</button></div></div>'
    +'<div class="fv"><label>이 PC 폴더 경로 (경로 복사용)</label><div id="fFolders">';
  s.folders.forEach(function(f,i){
    h+='<div class="frow"><input data-f="folder" data-i="'+i+'" value="'+esc(f)+'" maxlength="'+L.LIMIT.folder+'" placeholder="C:\\…" aria-label="폴더 경로"><button class="ic" data-act="rmFolder" data-i="'+i+'" title="이 폴더 빼기">✕</button></div>';
  });
  h+='</div><div><button class="sm" data-act="addFolder"'+(s.folders.length>=L.LIMIT.folders?' disabled':'')+'>+ 폴더 추가</button></div></div>'
    +'<div class="fv"><label>함께 열 푸른 앱 (보고서·자동화 화면)</label><div class="strip">'+L.INNER_KEYS.map(function(k){
      var a=L.INNER[k];
      return '<label class="ckl"><input type="checkbox" data-f="app" value="'+esc(k)+'"'+(s.apps.indexOf(k)>=0?' checked':'')+'>'+esc(a.icon)+' '+esc(a.name)+'</label>';
    }).join('')+'</div></div>'
    +'<div class="fv"><label>이어 둘 이알피 컨설팅 사업 — 고르면 그 사업의 올해 업체가 오른쪽 화면에 붙습니다</label>';
  if(!types.length) h+='<div class="hint">'+(D.erpErr?'이알피 사업 목록을 읽지 못했습니다.':D.erpLoading?'불러오는 중…':'이알피 컨설팅 사업이 없습니다.')+'</div>';
  else h+='<div class="bzl">'+types.map(function(t){
    var on=s.bizCodes.indexOf(t.code)>=0, closed=PuGovReportNav.closedFor(st,t.code,yr), lb=PuGovReportNav.label(t).text;
    return '<label><input type="checkbox" data-f="biz" value="'+esc(t.code)+'"'+(on?' checked':'')+'><span title="'+esc(lb)+'">'+esc(lb)+'</span>'+(closed?'<span class="badge m">종결</span>':'')+'</label>';
  }).join('')+'</div>';
  h+='</div><div class="errs" id="fErrs" role="alert">'+EDIT.errs.map(esc).join('<br>')+'</div>'
    +'<div class="mfoot"><button class="pri" data-act="save"'+(BUSY?' disabled':'')+'>저장</button><button data-act="close"'+(BUSY?' disabled':'')+'>닫기</button><span class="sp"></span>'
    +(EDIT.isNew?'':'<button class="del" data-act="delOne" data-id="'+esc(EDIT.id)+'"'+(BUSY?' disabled':'')+'>이 묶음 지우기</button>')+'</div>';
  $('mbox').innerHTML=h;
}
/* 창의 입력값을 EDIT.set 으로 옮긴다 — 줄 더하기·빼기 전에도 불러 쓴 글을 잃지 않는다 */
function pullForm(){
  if(!EDIT) return;
  var s=EDIT.set, box=$('mbox');
  s.title=$('fTitle').value; s.org=$('fOrg').value; s.note=$('fNote').value;
  box.querySelectorAll('[data-f]').forEach(function(el){
    var f=el.dataset.f, i=+el.dataset.i;
    if(f==='name') s.links[i].name=el.value;
    else if(f==='url') s.links[i].url=el.value;
    else if(f==='login') s.links[i].login=el.checked;
    else if(f==='memo') s.links[i].memo=el.value;
    else if(f==='folder') s.folders[i]=el.value;
  });
  s.bizCodes=[].slice.call(box.querySelectorAll('[data-f="biz"]')).filter(function(el){ return el.checked; }).map(function(el){ return el.value; });
  s.apps=[].slice.call(box.querySelectorAll('[data-f="app"]')).filter(function(el){ return el.checked; }).map(function(el){ return el.value; });
}

/* ═══ 쓰기 — 모두 공용 관문(gate, enforce)으로. 지우기는 _deleted 표식 ═══ */
function setRef(id){ return fbDb.ref(GL_NODES.sets+'/'+id); }
/* 처음 쓰는 목록이면 기본 묶음을 먼저 저장한다 — 그래야 고친 하나 말고 나머지 21곳도 함께 남는다.
   ⚠ 남이 먼저 넣었으면(이미 있음) 그 묶음은 건너뛴다 — 덮지 않는다 */
async function ensureSeeded(){
  if(!D.empty) return;
  var defs=L.defaultSets();
  D.seededByMe={};   /* «내가 방금 넣은» 기본 묶음 — 아래 saveSet 이 «남이 먼저 넣고 고친 것»과 가른다 */
  for(var i=0;i<defs.length;i++){
    var v=L.cleanSet(defs[i]).value;
    try{ await gate.save(setRef(v.id), v, {entityType:L.ENTITY, expectedRevision:-1}); D.seededByMe[v.id]=true; }
    catch(e){ if(!/먼저 수정/.test(errMsg(e))) throw e; }
  }
  await loadSets();
}
/* 한 묶음 저장 — base = «고치기 시작한 때»의 수정차수(2단계 점검 2026-11-28 지적 반영).
   · 1 이상: 서버가 그 차수여야 한다 — 그 사이 남이 고쳤으면 거절한다(새로 읽은 판으로 조용히 덮지 않는다).
   · 0(아직 저장 안 된 기본 묶음): 방금 «내가» 넣은 것일 때만 1 로 본다 — 남이 먼저 넣고 고쳤으면 거절.
   · 없음(새 묶음): 서버에 없어야 한다. */
async function saveSet(value, base){
  var c=L.cleanSet(value);
  if(!c.ok) throw new Error(c.errors.join(' · '));
  var id=c.value.id, exp=-1;
  if(Number(base)>0) exp=Number(base);
  else if(base===0 && D.seededByMe && D.seededByMe[id]) exp=1;
  await gate.save(setRef(id), c.value, {entityType:L.ENTITY, expectedRevision:exp});
}
async function run(label, fn){
  if(BUSY) return;
  if(!gate){ toast('로그인한 뒤에 고칠 수 있습니다'); return; }
  BUSY=true; if(EDIT) drawEdit();
  try{ await ensureSeeded(); await fn(); await reloadSets(); if(label) toast(label); return true; }
  catch(e){ toast('저장하지 못했습니다 — '+errMsg(e)); try{ await reloadSets(); }catch(_e){} return false; }
  finally{ BUSY=false; }
}
async function doSave(){
  pullForm();
  var s=EDIT.set, c=L.cleanSet(s);
  EDIT.errs=c.errors;
  if(!c.ok){ drawEdit(); return; }
  if(EDIT.isNew) s.order=L.nextOrder(D.sets);
  var base=EDIT.isNew?undefined:Number(s.revision||0);
  var ok=await run(EDIT.isNew?'새 묶음을 더했습니다':'고쳤습니다', function(){ return saveSet(s, base); });
  if(ok) closeEdit(); else if(EDIT) drawEdit();
}
async function doDelete(ids){
  var n=ids.length;
  if(!n) return;
  if(!confirm(n+'건을 지울까요?\n지운 묶음은 「목록 관리 › 지운 묶음」에서 되살릴 수 있습니다.')) return;
  var ok=await run(n+'건을 지웠습니다', async function(){
    for(var i=0;i<ids.length;i++){
      var prev=D.raw&&Object.prototype.hasOwnProperty.call(D.raw,ids[i])?D.raw[ids[i]]:null;
      if(!prev) continue;
      await gate.remove(setRef(ids[i]), prev, {entityType:L.ENTITY});
    }
  });
  if(ok){ SEL={}; if(EDIT) closeEdit(); } else if(EDIT) drawEdit();
}
/* 되살리기 — 하나든 여럿이든 한 번에(지운 묶음 표의 ☐ 고르기). 순서는 맨 뒤로 차례대로 */
async function doRestore(ids){
  ids=(ids||[]).filter(function(id){ return D.raw&&Object.prototype.hasOwnProperty.call(D.raw,id); });
  if(!ids.length) return;
  if(ids.length>1 && !confirm(ids.length+'건을 되살릴까요?')) return;
  var ok=await run(ids.length+'건을 되살렸습니다', async function(){
    var order=L.nextOrder(D.sets);
    for(var i=0;i<ids.length;i++){
      var prev=D.raw[ids[i]];
      if(!prev||!prev._deleted) continue;
      var v=L.cleanSet(prev).value; v.order=order; order+=10;
      await saveSet(v, Number(prev.revision||0));
    }
  });
  if(ok) DSEL={};
}
async function doMove(id, dir){
  var ch=L.moveOrder(D.sets,id,dir);
  if(!ch.length) return;
  await run('', async function(){
    for(var i=0;i<ch.length;i++){
      var s=findSet(ch[i].id);   /* 처음 쓰는 목록이었으면 ensureSeeded 가 D.sets 를 새로 읽었다 — 그 판으로 */
      if(!s) continue;
      await saveSet(Object.assign({},s,{order:ch[i].order}), s.revision);
    }
  });
}
async function doLink(id, code){
  var s=findSet(id); if(!s) return;
  if(s.bizCodes.indexOf(code)>=0) return;
  await run('이었습니다 — 올해 업체가 붙습니다', function(){
    var cur=findSet(id)||s;
    return saveSet(Object.assign({},cur,{bizCodes:cur.bizCodes.concat([code])}), cur.revision);
  });
}
function newSet(pre){
  return Object.assign({ id:L.newId(Date.now()), isNew:true, title:'', org:'', note:'', links:[], folders:[], bizCodes:[], apps:[], order:0 }, pre||{});
}

/* ═══ 누르기 — 한 곳에서 받는다 ═══ */
async function copyText(text, btn){
  var ok=false;
  try{ await navigator.clipboard.writeText(text); ok=true; }
  catch(e){
    var ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0;pointer-events:none'; document.body.appendChild(ta); ta.select();
    try{ ok=document.execCommand('copy'); }catch(_e){ ok=false; } ta.remove();
  }
  toast(ok?'폴더 경로를 복사했습니다 — 파일 선택 창 주소줄에 붙여 넣으세요':'경로를 복사하지 못했습니다');
  if(btn){ btn.textContent=ok?'복사됨':'복사 실패'; setTimeout(function(){ btn.textContent='경로 복사'; },1200); }
}
function setTab(t){ if(t!==TAB){ SEL={}; DSEL={}; } TAB=t; lsSet('tab',t); render(); }
document.addEventListener('click', function(ev){
  /* 사이트 — 그냥 누르면 고른 방식(팝업창·새 탭)으로 연다. Ctrl·가운데 단추 등 브라우저 자기 열기는 그대로 둔다 */
  var site=ev.target.closest('a.site');
  if(site){
    var plain=ev.button===0&&!ev.ctrlKey&&!ev.metaKey&&!ev.shiftKey&&!ev.altKey;
    if(plain){ ev.preventDefault(); openSite(site.getAttribute('href'), OPMODE); }
    else lsSet('recent', L.pushRecent(lsGet('recent'), site.getAttribute('href'), 6));
    setTimeout(function(){ if(TAB==='go') renderGo(); },0);
    return;
  }
  var tb=ev.target.closest('#tabs button'); if(tb){ setTab(tb.dataset.tab); return; }
  var el=ev.target.closest('[data-act]'); if(!el) return;
  var a=el.dataset.act, id=el.dataset.id;
  if(a==='sel'||a==='selAll'||a==='dsel'||a==='dselAll') return;   /* 고르기 칸은 change 에서 */
  if(a==='reload') return glReload();
  if(a==='logout') return firebase.auth().signOut();
  if(a==='more'){ MORE[el.dataset.key]=!MORE[el.dataset.key]; return renderGo(); }
  /* 대시보드 */
  if(a==='pick') return pick(el.dataset.key);
  if(a==='back') return showDetail(false);
  if(a==='starItem') return toggleStar('items', el.dataset.key);
  if(a==='starLink') return toggleStar('links', el.dataset.key);
  if(a==='caret'){ var ck=el.dataset.key; if(OPEN[ck]) delete OPEN[ck]; else OPEN[ck]=true; lsSet('open', JSON.stringify(OPEN)); return renderGo(); }
  if(a==='openAll'){
    var want=el.dataset.on==='1';
    D.sets.forEach(function(s){ if(want&&s.links.length) OPEN[s.id]=true; else delete OPEN[s.id]; });
    lsSet('open', JSON.stringify(OPEN)); return renderGo();
  }
  if(a==='opmode'){ OPMODE=el.dataset.m==='tab'?'tab':'pop'; lsSet('opmode',OPMODE); return renderGo(); }
  if(a==='openOther'){ openSite(el.dataset.url, el.dataset.m); setTimeout(renderGo,0); return; }
  if(a==='kpi'){
    var k=el.dataset.k;
    if(k==='bare'){ var bh=$('bareHd'); if(bh){ if(isPhone()) showDetail(false); bh.scrollIntoView({behavior:'smooth',block:'start'}); } return; }
    KF=(k==='all'||KF===k)?'':k; return renderGo();
  }
  if(a==='reset'){ Q=''; KF=''; $('q').value=''; return renderGo(); }
  if(a==='copy'){ var s=findSet(id); if(s&&s.folders[+el.dataset.i]) copyText(s.folders[+el.dataset.i], el); return; }
  if(a==='edit'){ var s2=findSet(id); if(s2) openEdit(s2); return; }
  if(a==='new') return openEdit(newSet());
  if(a==='newFor'){
    var t=((D.board&&D.board.types)||[]).filter(function(x){ return x.code===el.dataset.code; })[0];
    return openEdit(newSet(t?{title:t.name,org:t.agency,bizCodes:[t.code]}:{}));
  }
  if(a==='link') return doLink(id, el.dataset.code);
  if(a==='up'||a==='down') return doMove(id, a==='up'?-1:1);
  if(a==='restore') return doRestore([id]);
  if(a==='bulkRestore') return doRestore(dselIds());
  if(a==='delSelClear'){ DSEL={}; return renderManage(); }
  if(a==='bulkDel') return doDelete(selIds());
  if(a==='selClear'){ SEL={}; return renderManage(); }
  if(!EDIT) return;
  if(a==='close') return closeEdit();
  if(a==='save') return doSave();
  if(a==='delOne') return doDelete([EDIT.id]);
  pullForm();
  if(a==='addLink') EDIT.set.links.push({name:'',url:'',login:false});
  else if(a==='rmLink') EDIT.set.links.splice(+el.dataset.i,1);
  else if(a==='addFolder') EDIT.set.folders.push('');
  else if(a==='rmFolder') EDIT.set.folders.splice(+el.dataset.i,1);
  drawEdit();
});
document.addEventListener('change', function(ev){
  var el=ev.target; if(!el.dataset) return;
  if(el.dataset.act==='sel'){ SEL[el.dataset.id]=el.checked; renderManage(); }
  else if(el.dataset.act==='selAll'){ var on=el.checked; SEL={}; if(on) D.sets.forEach(function(s){ SEL[s.id]=true; }); renderManage(); }
  else if(el.dataset.act==='dsel'){ DSEL[el.dataset.id]=el.checked; renderManage(); }
  else if(el.dataset.act==='dselAll'){ var don=el.checked; DSEL={}; if(don) D.deleted.forEach(function(s){ DSEL[s.id]=true; }); renderManage(); }
});
$('modal').addEventListener('click', function(ev){ if(ev.target===$('modal')&&!BUSY) closeEdit(); });
$('q').addEventListener('input', function(){ Q=$('q').value; renderGo(); });
$('q').addEventListener('keydown', function(ev){
  if(ev.key==='Enter'){ var a=document.querySelector('#dashList a.site'); if(a) openSite(a.getAttribute('href'), OPMODE); }
  else if(ev.key==='Escape'){ $('q').value=''; Q=''; renderGo(); }
});
document.addEventListener('keydown', function(ev){
  if(ev.key==='Escape' && EDIT && !BUSY){ ev.preventDefault(); closeEdit(); return; }
  if(ev.key==='/' && TAB==='go' && !EDIT && !/^(input|textarea|select)$/i.test((document.activeElement||{}).tagName||'')){ ev.preventDefault(); $('q').focus(); }
});

/* ═══ 로그인·잠금 — 모르면 잠근다 ═══
   재직 직원(status==='active' + sid)이면 연다. 로그인 안 함·퇴사·못 읽음은 잠근다. */
function lock(why){ $('app').style.display='none'; $('lock').style.display='block'; $('lockWhy').textContent=why||''; }
async function staffSid(u){
  try{ var v=(await fbDb.ref('uid_roles/'+u.uid).once('value')).val()||{};
    return v.status==='active' && v.sid ? String(v.sid) : '';
  }catch(e){ return ''; }
}
function boot(){
  var t=lsGet('tab'); if(t==='go'||t==='manage') TAB=t;
  if(location.protocol==='file:'){ lock('file:// 로 열면 로그인할 수 없습니다 — 주소로 여세요'); return; }
  if(typeof firebase==='undefined'){ lock('인터넷이 필요합니다'); return; }
  if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
  fbDb=firebase.database();
  try{ firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
  firebase.auth().onAuthStateChanged(async function(u){
    $('outBtn').style.display=u?'':'none';
    if(!u){ PuGate.show(); return; }
    PuGate.hide();
    var sid=await staffSid(u);
    /* 이름만 — 로그인 이메일·사번을 잠금 화면에 적지 않는다(대표 결정 2026-10-25) */
    if(!sid){ lock((who()?'접속: '+who()+' — ':'')+'재직 중인 직원 계정이 아닙니다'); return; }
    ME.sid=sid; gate=PuOntologyWrite.createGateway({ mode:'enforce', actor:sid });
    $('lock').style.display='none'; $('app').style.display='';
    await loadStars();
    await glReload();
  });
}
boot();
</script>
