<!-- ═══════════════════════════════════════════════════════
     푸른등기 (pu-deungi.html) — 2026-11-14
     대표 지시 「매번 푸른노무법인 노무사 변경될 때마다 등기를 새로 해야 한다. 기존 등기서류와 푸른메일함에서 주고받았던 법무사 등기 관련
     모든 서류 확인하고 등기 프로그램 만들어 달라. 등기에서 변경되는 사람 정보만 입력하면 모든 서류가 자동으로 한글파일로 정리되어서
     나오게 하고 등기만 하면 되게. 관련 필요서류 등도 체크할 수 있게」 · 「내부관리에 프로그램을 넣어라」
     ★ 하는 일: «등기 현황»(지금 등기부의 사원·출자·대표사원·분사무소)을 한 번 넣어 두면, 등기 건마다 «바뀌는 것»(사원 입사·퇴사·지분 양도,
       대표사원 취임·사임, 주소 변경, 분사무소 설치·이전·폐지)만 넣는다 → 의사록·총사원 동의서·정관 신구대비·이유서·인가 신청서·변경 정관
       ·사원명부·취임승낙서·퇴사원·지분 양도양수 계약서·위임장 둘·변경등기 신청서(초안)·필요서류 확인표를 한글(hwpx)로 한 번에 만든다.
       필요서류는 법무사 안내(2025-02-14 메일)와 지난 등기 첨부서면으로 확인표를 만들고, 발급 3개월을 넘긴 서류를 알려 준다.
     ★ 쓰는 자리(관문 강제 모드, PROGRAMS.deungi.writeContracts): deungi/base(DeungiBase) · deungi/cases/{id}(DeungiCase)
       · deungi/archive/{id}(DeungiArchive — 지난 등기 원본 서류 묶음, 2026-11-14 대표 「지난기록 서식 원본과 자료들 모두 넣어달라」)
     ★ 파일 바이트는 원본 보관함 🔒 자리(pu_docs/secret · 기록 pu_docs/originals, from.kind 'deungi') — 여는 길은 서버 함수 puDocSecret(총괄관리자만)
     ★ 읽기만: uid_roles(권한)
     ⚠ 주민등록번호 «뒷자리»는 저장하지 않는다 — 생년월일만 저장하고, 뒷자리는 서류를 만들 때 «🔐 주민번호 넣기»로 이 창에만 받는다
       (새로고침·창 닫기에 지워진다). 정관 본문에 붙여 넣은 주민번호 뒷자리도 저장할 때 빈칸으로 바꾼다.
     ⚠ 대표·위임관리인만 연다(규칙 deungi = 같은 사람) — 사원 주소·생년월일이 든 자리다. 타일 감춤은 화면일 뿐, 진짜 잠금은 규칙이다.
     ⚠ 법령 근거(2026-11-14 현행 원문 확인)·기한은 js/pu-deungi-core.js 머리글. 서식·기한·비용은 담당 법무사가 최종 확인한다.
     ═══════════════════════════════════════════════════════ -->

  .tor input,.tor select{width:100%}

  .mbox{border-radius:10px}

function saveCase(){
  var c=cur(); if(!c||!gate) return Promise.resolve();
  if(SAVE.busy){ clearTimeout(SAVE.t); SAVE.t=setTimeout(saveCase, 600); return Promise.resolve(); }
  clearTimeout(SAVE.t);
  var id=c.id, rec=caseRecord(c);
  SAVE.busy=true; SAVE.err=''; drawSaveState();
  var g=GEN;
  return save('deungi/cases/'+id, 'DeungiCase', function(prev){ return Object.assign({}, rec, prev&&prev.createdAt?{ createdAt:prev.createdAt }:{}); })
    .then(function(r){
      if(g!==GEN) return;
      var v=r&&r.snapshot&&r.snapshot.val();
      if(v && CASES[id]){ CASES[id].revision=v.revision; CASES[id].createdAt=v.createdAt; CASES[id].updatedAt=v.updatedAt; }
      SAVE.busy=false; SAVE.dirty=false; SAVE.at=Date.now(); drawSaveState(); drawCaseList();
    })
    .catch(function(e){ if(g!==GEN) return; SAVE.busy=false; SAVE.err=(e&&e.message)||'저장 실패'; drawSaveState(); toast('저장하지 못했습니다 — '+SAVE.err, 5000); });
}
function drawSaveState(){
  var el=$('saveState'); if(!el) return;
  el.className='chip '+(SAVE.err?'r':SAVE.busy||SAVE.dirty?'a':'g');
  el.textContent=SAVE.err?'저장 안 됨':SAVE.busy?'저장 중…':SAVE.dirty?'고침':'저장됨';
  el.title=SAVE.err||'';
}
window.addEventListener('beforeunload', function(e){ if(SAVE.dirty||SAVE.busy||BASE_DRAFT){ e.preventDefault(); e.returnValue=''; } });

/* ═══ 읽기 ═══ */
function reload(){
  if(!fbDb) return Promise.resolve();
  var gen=GEN;
  return fbDb.ref('deungi').once('value').then(function(s){
    if(gen!==GEN) return;
    var v=s.val()||{};
    BASE=v.base ? C.normBase(v.base) : C.emptyBase();
    CASES={};
    Object.keys(v.cases||{}).forEach(function(k){ var x=v.cases[k]; if(x&&x.id===k) CASES[k]=x; });
    ARCH={};
    Object.keys(v.archive||{}).forEach(function(k){ var x=v.archive[k]; if(x&&x.id===k) ARCH[k]=x; });
    if(CUR && !CASES[CUR]) CUR='';
    draw();
  }).catch(function(e){ lock('등기 자료를 읽을 권한이 없습니다 — '+((e&&e.message)||'')); });
}

function setTab(t){ TAB=t; lsSet('tab', t); draw(); }
function draw(){
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function(b){ b.classList.toggle('on', b.dataset.tab===TAB); b.setAttribute('aria-selected', b.dataset.tab===TAB ? 'true' : 'false'); });
  ['case','base','hist'].forEach(function(k){ $('pane-'+k).classList.toggle('on', TAB===k); });
  if(TAB==='case'){ drawBaseWarn(); drawCaseList(); drawEditor(); }
  else if(TAB==='base') drawBase();
  else drawHist();
}
function drawBaseWarn(){
  var p=C.baseProblems(BASE);
  $('baseWarn').innerHTML=p.length ? '<div class="msg w">⚠ 등기 현황(지금 등기부)이 비었거나 모자랍니다 — '+esc(p[0])+' <button class="sm" data-act="goBase">등기 현황 넣기</button></div>' : '';
}
function caseRows(){
  return Object.keys(CASES).map(function(k){ return CASES[k]; }).filter(function(c){ return !c._deleted; })
    .sort(function(a,b){ return String(b.meeting&&b.meeting.date||b.createdAt||'').localeCompare(String(a.meeting&&a.meeting.date||a.createdAt||'')) || String(b.id).localeCompare(String(a.id)); });
}
function stChip(st){ var cls={draft:'m',meeting:'',approval:'a',filed:'a',done:'g',cancelled:'m'}[st]||'m'; return '<span class="chip '+cls+'">'+esc(C.STATUS[st]||st)+'</span>'; }

  var b=C.normBase(BASE_DRAFT); b.charter=maskRrnText(b.charter);
  var p=C.baseProblems(b);
  if(p.length && !confirm('확인할 것이 있습니다:\n· '+p.join('\n· ')+'\n\n그래도 저장할까요?')) return;
  var g=GEN;
  save('deungi/base', 'DeungiBase', function(prev){ var o=Object.assign({}, b); if(prev&&prev.createdAt) o.createdAt=prev.createdAt; return o; })
    .then(function(){ if(g!==GEN) return; BASE=b; BASE_DRAFT=null; toast('등기 현황을 저장했습니다'); draw(); })

}

/* ═══ 지난 기록 ═══ */
/* ── 지난 등기 원본 서류 (2026-11-14 대표 「지난기록 서식 원본과 자료들 모두 넣어달라」) ──
   묶음(지난 등기 하나) → 파일들. 파일은 원본 보관함 🔒 자리에 올리고, 묶음에는 파일 번호·종류만 적는다.
   ⚠ 여는 것(보기·받기)은 서버 함수 puDocSecret 이 총괄관리자에게만 내준다 — 위임관리인은 목록만 본다.
   ⚠ 지우기 없음 — «묶음에서 빼기»는 연결만 끊고 파일은 보관함에 남는다(보관함 규칙이 «새로 쓰기만»). */
function arcRows(){ return C.archiveList(ARCH); }
function arcById(id){ return arcRows().filter(function(a){ return a.id===id; })[0]||null; }
function extOf(nm){ var m=/\.([A-Za-z0-9]+)$/.exec(String(nm||'')); return m?m[1].toLowerCase():''; }
function arcLockAttr(){ return ME.isAdmin?'':' disabled title="🔒 총괄관리자만 엽니다"'; }
function drawArchive(){
  var rows=arcRows(), nsel=Object.keys(SEL.arc).filter(function(k){ return SEL.arc[k]; }).length;
  var h='<div class="card" id="arcCard"><h3>📁 지난 등기 원본 서류 <span class="chip m">'+rows.length+'묶음</span><span class="hint wide-only">파일은 원본 보관함 🔒 자리 — 보기·받기는 총괄관리자만</span><span class="sp"></span><button class="sm pri" data-act="arcNew">＋ 묶음 만들기</button></h3>';
  if(nsel) h+='<div class="bar"><b>'+nsel+'개 선택</b><button class="sm" data-act="arcSelDl"'+arcLockAttr()+'>⬇ 받기</button><button class="sm warn" data-act="arcSelOut">묶음에서 빼기</button><button class="sm" data-act="arcSelClear">고르기 풀기</button><span class="hint">빼도 파일은 보관함에 남습니다</span></div>';
  if(ARC_BUSY) h+='<div class="msgs"><div class="msg i">파일을 올리는 중입니다 — 창을 닫지 마십시오.</div></div>';
  if(!rows.length) h+='<div class="empty">아직 없습니다. «＋ 묶음 만들기»로 지난 등기(예: 2019-07 서산분사무소 설치)를 만들고 원본 파일을 올리십시오.</div>';
  rows.forEach(function(a){
    var fl=C.arcFiles(a), all=fl.length && fl.every(function(x){ return SEL.arc[a.id+'|'+x.fileId]; });
    h+='<div class="chg" data-arc="'+esc(a.id)+'"><div class="hd"><b>'+esc(a.at||'날짜 없음')+'</b> '+esc(a.title||'(이름 없음)')+' <span class="chip m">'+fl.length+'개</span><span class="sp"></span><button class="sm" data-act="arcEdit">고치기</button><button class="sm pri" data-act="arcUp"'+(ARC_BUSY?' disabled':'')+'>＋ 파일 올리기</button></div>';
    if(a.summary) h+='<div class="cb hint">'+esc(a.summary)+'</div>';
    if(!fl.length) h+='<div class="empty">파일이 없습니다.</div>';
    else {
      h+='<div class="scroll"><table class="t"><thead><tr><th class="c"><input type="checkbox" aria-label="이 묶음 모두 고르기" data-selall="arc:'+esc(a.id)+'"'+(all?' checked':'')+'></th><th class="n">№</th><th>종류</th><th>파일 이름</th><th>날짜</th><th>표시</th><th></th></tr></thead><tbody>';
      fl.forEach(function(x, i){
        var k=a.id+'|'+x.fileId;
        h+='<tr data-arcf="'+esc(x.fileId)+'"><td class="c tk"><input type="checkbox" aria-label="'+esc(x.name)+' 고르기" data-sel="arc" data-id="'+esc(k)+'"'+(SEL.arc[k]?' checked':'')+'></td><td class="n">'+(i+1)+'</td>'+
          '<td data-l="종류"><select data-arckind aria-label="'+esc(x.name)+' 종류">'+C.ARC_KINDS.map(function(o){ return '<option value="'+o[0]+'"'+(o[0]===x.kind?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')+'</select></td>'+
          '<td class="ti" title="'+esc(x.name)+'">'+esc(x.name)+'</td><td data-l="날짜">'+esc(x.date||'—')+'</td>'+
          '<td>🔒'+(x.masked?' <span class="chip g">주민번호 가림</span>':'')+'</td>'+
          '<td><button class="sm" data-act="arcView"'+arcLockAttr()+'>👁 보기</button> <button class="sm" data-act="arcDl"'+arcLockAttr()+'>⬇ 받기</button></td></tr>';
      });
      h+='</tbody></table></div>';
    }
    h+='</div>';
  });
  return h+'<div style="height:4px"></div></div>';
}
/* 묶음 하나 고치기 — 관문으로. 찬 자리에서 previous 가 null 로 먼저 오면 화면 기억(ARCH)으로 만든다 */
function arcWrite(id, fn){
  var g=GEN;
  return save('deungi/archive/'+id, 'DeungiArchive', function(prev){
    var a=C.normArchive(prev||ARCH[id]||{ id:id }); a.id=id; a=fn(a)||a;
    var rec=C.normArchive(a); rec.id=id; rec.entityType='DeungiArchive';
    if(prev&&prev.createdAt) rec.createdAt=prev.createdAt;
    return rec;
  }).then(function(r){ if(g!==GEN) return; var v=r&&r.snapshot&&r.snapshot.val(); if(v&&v.id===id) ARCH[id]=v; return v; });
}
function arcModal(id){
  var a=id?arcById(id):null;
  openModal('<h3>📁 '+(a?'묶음 고치기':'새 묶음')+'<span class="sp"></span><button class="sm" data-act="closeModal">닫기</button></h3><div class="mb"><div class="grid">'+
    '<label class="fl">날짜(등기일·총회일)<input type="date" data-af="at" value="'+esc(a?a.at:'')+'"></label>'+
    '<label class="fl wide">이름<input type="text" data-af="title" maxlength="120" value="'+esc(a?a.title:'')+'" placeholder="예: 2019-07 서산분사무소 설치·정관변경"></label>'+
    '<label class="fl wide">요약(선택)<textarea data-af="summary" rows="3" maxlength="600">'+esc(a?a.summary:'')+'</textarea></label></div>'+
    '<div class="msg i">주민번호 뒷자리는 저장할 때 지워집니다. 파일은 묶음을 만든 뒤 «＋ 파일 올리기»로 넣습니다.</div></div>'+
    '<div class="mf"><button class="sm" data-act="closeModal">취소</button><button class="sm pri" data-act="arcSave" data-id="'+esc(id||'')+'">저장</button></div>');
}

/* 파일 올리기 — 한 개씩: 보관함 🔒 자리 → 묶음에 한 줄. 중간에 끊겨도 올린 것까지는 묶음에 남는다 */
function arcUpload(evId, files){
  var list=Array.prototype.slice.call(files||[]); if(!list.length) return;
  var a=arcById(evId); if(!a){ toast('묶음을 찾지 못했습니다'); return; }
  if(!window.PuOfficeStore){ toast('원본 보관함 기능을 불러오지 못했습니다 — 새로고침 하십시오', 4000); return; }
  for(var i=0;i<list.length;i++){ var ck=PuOfficeStore.okDocFile(list[i].name, list[i].size); if(!ck.ok){ toast(list[i].name+' — '+ck.why, 5000); return; } }
  if(!confirm('«'+(a.title||'묶음')+'»에 '+list.length+'개 파일을 올릴까요?\n\n· 원본 보관함 🔒 자리에 둡니다 — 보기·받기는 총괄관리자만.\n· 주민번호 뒷자리가 보이는 서류는 가린 사본을 올리십시오.\n· 올린 파일은 지울 수 없습니다(묶음에서 빼기만).')) return;
  ARC_BUSY=true; drawHist();
  var g=GEN, ok=0, fail=[], open=0;
  list.reduce(function(p, fl, idx){ return p.then(function(){
    if(g!==GEN) return;
    toast('올리는 중… '+(idx+1)+'/'+list.length+' '+fl.name, 60000);
    return fl.arrayBuffer().then(function(buf){
      if(g!==GEN) return null;
      return PuOfficeStore.putOriginal({ name:fl.name, size:fl.size, type:fl.type||'', bytes:new Uint8Array(buf) }, { kind:'deungi', ev:evId }, { secret:true });
    }).then(function(r){
      if(g!==GEN||!r) return;
      if(r.reused && r.secret===false) open++;
      var e=C.arcFileEntry(r.fileId, fl.name); if(!e) throw new Error('파일 번호가 올바르지 않습니다');
      return arcWrite(evId, function(x){ var had=x.files[e.fileId]; x.files[e.fileId]=had?Object.assign({}, e, { kind:had.kind, date:had.date||e.date, addedAt:had.addedAt||e.addedAt }):e; return x; }).then(function(){ ok++; });
    }).catch(function(err){ fail.push(fl.name+' — '+((err&&err.message)||err)); });
  }); }, Promise.resolve()).then(function(){
    if(g!==GEN) return;
    ARC_BUSY=false; drawHist();
    toast(ok+'개 올렸습니다'+(open?' · 이미 보관함 보통 자리에 있던 같은 파일 '+open+'개(직원 열람 가능)':'')+(fail.length?' · 못 올림 '+fail.length+'개: '+fail[0]:''), fail.length||open?9000:3000);
  });
}
function arcSetKind(evId, fid, kind){
  var g=GEN;
  arcWrite(evId, function(a){ if(a.files[fid]) a.files[fid].kind=kind; return a; })
    .then(function(){ if(g!==GEN) return; toast('종류를 바꿨습니다'); drawHist(); })
    .catch(function(e){ if(g!==GEN) return; toast('저장하지 못했습니다 — '+((e&&e.message)||''), 5000); drawHist(); });
}
function arcSelected(){ return Object.keys(SEL.arc).filter(function(k){ return SEL.arc[k]; }).map(function(k){ var p=k.split('|'); return { ev:p[0], fid:p[1] }; }); }
function arcSelOut(){
  var sel=arcSelected(); if(!sel.length) return;
  if(!confirm(sel.length+'개 파일을 묶음에서 뺄까요?\n(파일은 원본 보관함에 그대로 남습니다)')) return;
  var by={}; sel.forEach(function(x){ (by[x.ev]=by[x.ev]||[]).push(x.fid); });
  var g=GEN;
  Object.keys(by).reduce(function(p, ev){ return p.then(function(){ if(g!==GEN) return; return arcWrite(ev, function(a){ by[ev].forEach(function(fid){ delete a.files[fid]; }); return a; }); }); }, Promise.resolve())
    .then(function(){ if(g!==GEN) return; SEL.arc={}; toast(sel.length+'개를 뺐습니다'); drawHist(); })
    .catch(function(e){ if(g!==GEN) return; toast('저장하지 못했습니다 — '+((e&&e.message)||''), 5000); drawHist(); });
}
var ARC_DL=false;
function arcDownload(list){
  if(!ME.isAdmin) return toast('🔒 총괄관리자만 엽니다');
  if(ARC_DL) return toast('받는 중입니다 — 잠시 기다리십시오');
  if(!window.PuOfficeStore) return toast('원본 보관함 기능을 불러오지 못했습니다', 4000);
  var g=GEN, i=0, ok=0; ARC_DL=true;
  (function next(){
    if(g!==GEN){ ARC_DL=false; return; }
    if(i>=list.length){ ARC_DL=false; toast(ok+'개를 받았습니다'); return; }
    var x=list[i++], a=arcById(x.ev), f=a&&a.files[x.fid];
    if(!f){ next(); return; }
    PuOfficeStore.download(f.fileId, f.name).then(function(){ ok++; }, function(e){ toast(f.name+' — '+((e&&e.message)||e), 5000); })
      .then(function(){ setTimeout(next, 500); });
  })();
}
function arcRevoke(){ if(PV_URL){ try{ URL.revokeObjectURL(PV_URL); }catch(e){} PV_URL=''; } }
function arcView(evId, fid){
  if(!ME.isAdmin) return toast('🔒 총괄관리자만 엽니다');
  var a=arcById(evId), f=a&&a.files[fid]; if(!f) return;
  openModal('<h3>👁 '+esc(f.name)+'<span class="sp"></span><button class="sm" data-act="arcDlOne" data-ev="'+esc(evId)+'" data-fid="'+esc(fid)+'">⬇ 받기</button><button class="sm" data-act="closeModal">닫기</button></h3><div class="mb"><div id="pv"><div class="empty">불러오는 중…</div></div></div>');
  var g=GEN, ext=extOf(f.name);
  PuOfficeStore.secretBlob(fid).then(function(blob){
    if(g!==GEN||!$('pv')) return;
    if(ext==='hwp'||ext==='hwpx') return blob.arrayBuffer().then(function(b){ if(g!==GEN||!$('pv')) return; return PureunHwp.renderPreview($('pv'), new Uint8Array(b), f.name); });
    arcRevoke();
    if(ext==='pdf'){ PV_URL=URL.createObjectURL(new Blob([blob], { type:'application/pdf' })); $('pv').innerHTML='<iframe src="'+PV_URL+'" title="'+esc(f.name)+'" style="width:100%;height:75vh;border:0"></iframe>'; }
    else if(/^(jpg|jpeg|png)$/.test(ext)){ PV_URL=URL.createObjectURL(blob); $('pv').innerHTML='<img src="'+PV_URL+'" alt="'+esc(f.name)+'" style="max-width:100%">'; }
    else $('pv').innerHTML='<div class="msg i">이 종류는 미리보기가 없습니다 — «⬇ 받기»로 여십시오.</div>';
  }).catch(function(e){ if(g!==GEN||!$('pv')) return; $('pv').innerHTML='<div class="msg w">열지 못했습니다 — '+esc((e&&e.message)||e)+'</div>'; });
}
/* 🔒 파일 받기 — 서버 함수 puDocSecret(총괄관리자만, 열람 기록을 남긴다). 문서관리(docs-esign)와 같은 길 */
function fetchSecret(fileId){
  var u=firebase.auth().currentUser;
  if(!u) return Promise.reject(new Error('로그인이 필요합니다'));
  return u.getIdToken().then(function(tok){
    return fetch('https://asia-northeast3-pureun-erp.cloudfunctions.net/puDocSecret', { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+tok }, body:JSON.stringify({ fileId:fileId }) });
  }).then(function(r){
    if(r.ok) return r.blob();
    return r.json().catch(function(){ return {}; }).then(function(j){ throw new Error(j.error||('열지 못했습니다 ('+r.status+')')); });
  });
}
function drawHist(){
  var done=caseRows().filter(function(c){ return c.status==='cancelled' || (c.status==='done' && c.applied); });
  var h='<div class="card"><h3>끝난·취소한 등기 건 '+done.length+'</h3>';
  if(!done.length) h+='<div class="empty">아직 없습니다.</div>';
  else {
    h+='<div class="scroll"><table class="t"><thead><tr><th class="c"></th><th class="n">№</th><th>건 이름</th><th>총회일</th><th>단계</th><th>등기 완료</th><th>바뀐 것</th></tr></thead><tbody>';
    done.forEach(function(c, i){
      var a=C.applyChanges(baseOf(c), c);
      h+='<tr class="click" data-open="'+esc(c.id)+'" tabindex="0" aria-label="'+esc(c.title)+' 열기"><td class="c">📄</td><td class="n">'+(i+1)+'</td><td class="ti">'+esc(c.title)+'</td><td data-l="총회">'+esc((c.meeting&&c.meeting.date)||'—')+'</td><td>'+stChip(C.normCase(c).status)+'</td><td data-l="완료">'+esc((c.dates&&c.dates.done)||'—')+'</td><td class="nw" title="'+esc(C.summary(a))+'">'+esc(C.summary(a)||'—')+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='</div>';
  var hi=(BASE.history||[]).slice().reverse();
  h+='<div class="card"><h3>등기 현황 바뀐 기록 '+hi.length+'</h3>'+(hi.length?'<div class="cb items">'+hi.map(function(x){ return '<div class="it"><span class="g">'+esc(x.at)+'</span> '+esc(x.title)+' <span class="hint">'+esc(x.summary)+'</span></div>'; }).join('')+'</div>':'<div class="empty">없음</div>')+'</div>';
  $('histBox').innerHTML=drawArchive()+h;
}

/* ═══ 서류 ═══ */
function docCtx(){ var c=cur(); return DD.context(baseOf(c), c, RRN, today()); }
function ready(){
  if(!window.HWPX||!window.HWPXDOC||!window.DeungiDocs||!window.PureunHwp){ toast('한글 문서 기능을 불러오지 못했습니다 — 새로고침 하십시오', 4000); return false; }
  return true;
}
function chosenKeys(a){ return C.docPlan(a, { today:today() }).filter(function(d){ return d.on; }).map(function(d){ return d.key; }); }
function dlPack(){
  if(!ready()) return; var x=docCtx();
  if(x.after.errors.length) return toast('빨간 글을 먼저 고치십시오');
  var keys=chosenKeys(x.after); if(!keys.length) return toast('고른 서류가 없습니다');
  try{
    var docs=DD.build(x, keys), u8=DD.filePack(docs), name=DD.fileName(x, null);
    PureunHwp.validate(u8, name); PureunHwp.download(u8, name, 'hwpx');
    toast(docs.length+'가지 서류를 한 파일로 받았습니다');
  }catch(e){ toast('만들지 못했습니다 — '+((e&&e.message)||e), 5000); }
}
var DL_EACH=false, DL_T=null;

function preview(key){

    if(el.dataset.ck) ck.ok=el.checked; else if(el.dataset.iss) ck.issued=v; else ck.note=v;
    if(el.dataset.note) { scheduleSave(); return; }
    drawDerived(); scheduleSave(); return;
  }
  if(el.dataset.rrn!=null) return;
  /* 변경 하나 */
  var box=el.closest('[data-ch]');
  if(box){
    var ch=chgById(box.dataset.ch); if(!ch) return; var k2=el.dataset.k;
    if(el.dataset.to!=null){ var t=ch.share.to[Number(el.dataset.to)]; if(!t) return; t[k2]=k2==='amount'?C.num(v):v; }
    else if(k2==='invest.cash'){ ch.invest=C.normInvest(ch.invest); ch.invest.cash=C.num(v); }
    else if(k2==='invest.labor'){ ch.invest=C.normInvest(ch.invest); ch.invest.labor=!!v; }
    else if(k2==='invest.inKind'){ ch.invest=C.normInvest(ch.invest); ch.invest.inKind=C.str(v).slice(0,300); }
    else if(k2==='birth') ch.birth=String(v).replace(/[^0-9]/g,'').slice(0,6);
    else setPath(ch, k2, v);
    if(k2==='member'&&ch.type==='leave'&&el.dataset.to==null){ ch.share={ mode:'transfer', to:[] }; }
    if(!isText) drawChanges(); else { var aa=C.applyChanges(baseOf(c), c); Array.prototype.forEach.call(document.querySelectorAll('#edChanges [data-ch]'), function(bx3){ var cx=chgById(bx3.dataset.ch), hx=bx3.querySelector('.hd .hint'); if(cx&&hx) hx.textContent=C.describe(C.normChange(cx), baseOf(c), aa); });
      if(el.dataset.to!=null){ var tip=el.nextElementSibling; if(tip) tip.textContent=C.num(v)?C.won(v)+'원':'';
        var lmv=baseOf(c).members.filter(function(m){ return m.id===ch.member; })[0], tot=lmv?C.normInvest(lmv.invest).cash:0, sm=ch.share.to.reduce(function(a,x){ return a+C.num(x.amount); },0), chip=box.querySelector('.tos .chip');
        if(chip){ chip.className='chip '+(sm===tot?'g':'a'); chip.textContent='합계 '+C.won(sm)+' / '+C.won(tot)+'원'; } } }
    drawDerived(); scheduleSave(); return;
  }
  /* 건 정보 */
  if(el.dataset.k){ setPath(c, el.dataset.k, v); if(el.dataset.k==='status') drawEditor(); else drawDerived(); scheduleSave(); drawCaseList(); }
}

/* ═══ 로그인·잠금 — 모르면 잠근다 ═══
   대표·위임관리인만 연다(규칙 deungi 와 같은 사람). 로그인 안 함·퇴사·권한 없음은 잠근다. */
var GEN=0, WHO='';
function wipe(){ GEN++; clearTimeout(SAVE.t); clearTimeout(DL_T); DL_T=null; if(JSON_READER){ try{ JSON_READER.abort(); }catch(e){} JSON_READER=null; } SAVE={ t:null, busy:false, dirty:false, err:'', at:0 }; RRN={}; BASE=C.emptyBase(); BASE_DRAFT=null; CASES={}; CUR=''; SEL={ cases:{}, docs:{}, mem:{}, br:{}, arc:{} }; DL_EACH=false; gate=null;
  ARCH={}; ARC_EV=''; ARC_BUSY=false; ARC_DL=false; arcRevoke(); try{ if(window.PuOfficeStore) PuOfficeStore.init({}); }catch(e){}
  var m=$('modal'); if(m){ m.style.display='none'; m.innerHTML=''; } ['caseList','caseSelBar','editor','baseBox','histBox','baseWarn'].forEach(function(k){ var e=$(k); if(e) e.innerHTML=''; }); }
function lock(why){ wipe(); $('app').style.display='none'; $('lock').style.display='block'; $('lockWhy').textContent=why||''; }
function canOpen(role){ return !!role && role.status==='active' && !!role.sid && (role.isAdmin===true || role.isSubAdmin===true); }
async function staffRole(u){ try{ return (await fbDb.ref('uid_roles/'+u.uid).once('value')).val()||null; }catch(e){ return null; } }
function boot(){
  var t=lsGet('tab'); if(['case','base','hist'].indexOf(t)>=0) TAB=t;
  var cu=lsGet('cur'); if(cu) CUR=cu;
  if(location.protocol==='file:'){ lock('file:// 로 열면 로그인할 수 없습니다 — 주소로 여십시오'); return; }
  if(typeof firebase==='undefined'){ lock('인터넷이 필요합니다'); return; }
  if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
  fbDb=firebase.database();
  try{ firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
  firebase.auth().onAuthStateChanged(async function(u){
    $('outBtn').style.display=u?'':'none';
    if(!u){ WHO=''; wipe(); $('app').style.display='none'; PuGate.show(); return; }
    if(WHO && WHO!==u.uid) wipe();
    WHO=u.uid; var gen=GEN;
    PuGate.hide();
    var role=await staffRole(u);
    var now=firebase.auth().currentUser;
    if(gen!==GEN || !now || now.uid!==u.uid) return;
    if(!canOpen(role)){ lock(role&&role.status==='active'?'대표·위임관리인 권한이 없는 계정입니다':'재직 중인 직원 계정이 아닙니다'); return; }
    ME.sid=String(role.sid); ME.isAdmin=role.isAdmin===true; gate=PuOntologyWrite.createGateway({ mode:'enforce', actor:ME.sid });
    try{ PuOfficeStore.init({ db:fbDb, storage:firebase.app().storage('gs://pureun-erp-hrphotos'), uid:u.uid, name:String(role.name||'').slice(0,60), secretFetch:fetchSecret }); }catch(e){}
    $('lock').style.display='none'; $('app').style.display='';
    await reload();
  });
}
boot();
</script>
