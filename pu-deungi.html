<!-- ═══════════════════════════════════════════════════════
     푸른등기 (pu-deungi.html) — 2026-11-14
     대표 지시 「매번 푸른노무법인 노무사 변경될 때마다 등기를 새로 해야 한다. 기존 등기서류와 푸른메일함에서 주고받았던 법무사 등기 관련
     모든 서류 확인하고 등기 프로그램 만들어 달라. 등기에서 변경되는 사람 정보만 입력하면 모든 서류가 자동으로 한글파일로 정리되어서
     나오게 하고 등기만 하면 되게. 관련 필요서류 등도 체크할 수 있게」 · 「내부관리에 프로그램을 넣어라」
     ★ 하는 일: «등기 현황»(지금 등기부의 사원·출자·대표사원·분사무소)을 한 번 넣어 두면, 등기 건마다 «바뀌는 것»(사원 입사·퇴사·지분 양도,
       대표사원 취임·사임, 주소 변경, 분사무소 설치·이전·폐지)만 넣는다 → 의사록·총사원 동의서·정관 신구대비·이유서·인가 신청서·변경 정관
       ·사원명부·취임승낙서·퇴사원·지분 양도양수 계약서·위임장 둘·변경등기 신청서(초안)·필요서류 확인표를 한글(hwpx)로 한 번에 만든다.
       필요서류는 법무사 안내(2025-02-14 메일)와 지난 등기 첨부서면으로 확인표를 만들고, 발급 3개월을 넘긴 서류를 알려 준다.
     ★ 쓰는 자리(관문 강제 모드, PROGRAMS.deungi.writeContracts): deungi/base(DeungiBase) · deungi/cases/{id}(DeungiCase)
       · deungi/archive/{id}(DeungiArchive — 지난 등기 원본 서류 묶음, 2026-11-14 대표 「지난기록 서식 원본과 자료들 모두 넣어달라」)
     ★ 파일 바이트는 원본 보관함 🔒 자리(pu_docs/secret · 기록 pu_docs/originals, from.kind 'deungi') — 여는 길은 서버 함수 puDocSecret(총괄관리자만)
     ★ 읽기만: uid_roles(권한)
     ⚠ 주민등록번호 «뒷자리»는 저장하지 않는다 — 생년월일만 저장하고, 뒷자리는 서류를 만들 때 «🔐 주민번호 넣기»로 이 창에만 받는다
       (새로고침·창 닫기에 지워진다). 정관 본문에 붙여 넣은 주민번호 뒷자리도 저장할 때 빈칸으로 바꾼다.
     ⚠ 대표·위임관리인만 연다(규칙 deungi = 같은 사람) — 사원 주소·생년월일이 든 자리다. 타일 감춤은 화면일 뿐, 진짜 잠금은 규칙이다.
     ★ 쉬운 진행(2026-11-14 대표 「기본정보만 넣으면 전체서류가 생성되어서 도장찍고 노동부 인가 후 등기만 할 수 있게 … 아주 쉽게 … 한글 hwpx 화면」):
       등기 건을 열면 ① 바뀌는 것 → ② 서류 확인·도장(만든 한글 서류를 쪽 그대로 화면에) → ③ 노동부 인가 → ④ 등기 네 단계만 보인다.
       «자세히(모든 칸)»를 누르면 예전 전체 편집 화면.
     ★ 직접 등기·비용(2026-11-15 대표 「등기비용 등 필요 비용도 표시해달라 — 법무사 없이 직접하는 것이다」): 신청 방법 기본 «직접» —
       등기신청 위임장을 빼고 신청서를 제출용으로, ④ 단계에 직접 등기 순서와 💰 예상 비용(core costPlan — 2026-11-15 법령 확인 금액·근거).
     ★ 오른쪽 보기 칸(2026-11-15 대표 「보기서류는 … 오른쪽에 보여서 하나씩 확인할 수 있게 — 그렇게 해야 실시간으로 비교할 수 있다」):
       지난 기록 «👁 보기»는 목록 오른쪽 칸에 열린다(◀ 이전·다음 ▶ 으로 차례로 넘김 · 왼쪽 가장자리를 끌어 너비 조절).
       탭을 옮겨도 칸은 남아 «등기 건 ② 서류»와 나란히 비교한다. 1080px 보다 좁으면 화면 전체를 덮는 창.
     ★ 새로 만든 서류도 같은 칸(2026-11-15 대표 「새로 만든 서류도 오른쪽으로 — 화면이 너무 정신없다, 간략하게」):
       ② 서류 확인·도장은 «서류 목록 + 도장 ☑» 한 줄씩만 왼쪽에 두고, 서류를 누르면 오른쪽 칸에 한글 쪽 그대로 나온다(◀ 이전·다음 ▶).
       칸 위쪽 «새 서류 | 지난 원본» 단추로 같은 자리에서 맞바꿔 본다. ①에서 값을 고치면 칸의 서류도 저절로 다시 그려진다.
       지난 기록 목록도 한 줄(이름·종류·날짜)로 줄였다 — 종류 바꾸기는 칸 위쪽에서.
     ★ 화면 개편(2026-11-18 대표 「UI 모두 깔끔하게 — 너무 단순하고 무미건조하고 빈 공백이 많다 · 한 화면에서 가급적 모두 확인 · 각 지사 지사장 정보가 안 맞는다 · 지난 기록은 접어서 펴기」):
       머리줄 한 줄(탭 알약·개수) · 본문은 화면 너비를 쓴다 · 등기 현황은 «사무소·지사장 띠» + 왼쪽 법인 정보 / 오른쪽 사원·분사무소(넓은 화면 한 화면) ·
       분사무소마다 «지사장»(사원 줄을 가리킨다 — core branch.head)·사원 줄 «직책» 칸 · 지난 기록 묶음·끝난 건·바뀐 기록은 접고 펴기(FOLD — 이 브라우저에 기억).
     ⚠ 법령 근거(2026-11-14 현행 원문 확인)·기한은 js/pu-deungi-core.js 머리글. 서식·기한·비용은 담당 법무사가 최종 확인한다.
     ═══════════════════════════════════════════════════════ -->
<style>
:root{
  --ink:#1e293b; --ink2:#475569; --mute:#64748b; --line:#e2e8f0; --line2:#cbd5e1; --bg:#f8fafc; --card:#ffffff;
  --blue:#2563eb; --blue-d:#1e40af; --blue-bg:#eff6ff; --blue-line:#bfdbfe;
  --green:#166534; --green-m:#16a34a; --green-bg:#f0fdf4; --green-line:#bbf7d0;
  --amber:#854d0e; --amber-m:#d97706; --amber-bg:#fffbeb; --amber-line:#fde68a;
  --red:#991b1b; --red-bg:#fef2f2; --red-line:#fecaca;
}
*{box-sizing:border-box}
body{word-break:keep-all;overflow-wrap:anywhere;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 11px;line-height:1.3;white-space:nowrap}
button:hover{border-color:var(--mute)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--blue);border-color:var(--blue);color:#ffffff}
button.warn{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
button.sm{padding:3px 9px;font-size:12px}
input,select,textarea{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line2);border-radius:7px;background:var(--card);color:var(--ink);min-width:0}
textarea{width:100%;resize:vertical;font-family:inherit}
input[type=checkbox]{width:16px;height:16px;padding:0;vertical-align:middle}
a{color:var(--blue-d);text-decoration:none}
#head{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:9px 16px;flex-wrap:wrap}
.top h1{font-size:17px;margin:0}
.top .sub{font-size:12px;color:var(--mute)}
.sp{flex:1}
#who{font-size:13px;color:var(--mute)}
.tabs{display:flex;gap:4px;padding:0 16px;flex-wrap:wrap;align-items:center}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mute);padding:8px 12px}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--blue)}
.chip{display:inline-block;min-width:18px;text-align:center;border-radius:9px;padding:0 7px;font-size:11px;background:var(--blue-bg);color:var(--blue-d);border:1px solid var(--blue-line);white-space:nowrap}
.chip.g{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.chip.a{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.chip.r{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.chip.m{background:var(--bg);color:var(--mute);border-color:var(--line2)}
main{padding:12px 16px 40px;max-width:1280px}
.pane{display:none}
.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.card>h3{margin:0;font-size:14px;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h3 .hint{font-weight:400}
.cb{padding:10px 12px}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:8px 10px}
.hint{font-size:12px;color:var(--mute)}
.scroll{overflow:auto}
.t{border-collapse:collapse;width:100%}
.t th,.t td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.t th{background:var(--bg);color:var(--ink2);font-size:12px}
.t .c{width:28px;text-align:center}
.t .n{width:36px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.t td.ti{max-width:280px;overflow:hidden;text-overflow:ellipsis}
.t td.nw{max-width:340px;overflow:hidden;text-overflow:ellipsis}
.t tr.cur,.t tr.cur td{background:var(--blue-bg)}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--blue-bg)}
.t td.kd,.t td.dt{color:var(--mute);font-size:12px}
.t td.ac{text-align:right}
/* 목록의 이름 — 누르면 오른쪽 칸에 열린다(한 줄·말줄임) */
button.lnk{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:none;background:none;padding:2px 0;border-radius:4px;font-weight:600;text-align:left;color:var(--ink)}
button.lnk:hover{border:none;color:var(--blue-d);text-decoration:underline}
button.lnk:disabled{opacity:1;color:var(--ink);cursor:default;text-decoration:none}
.t input:not([type=checkbox]),.t select{width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 12px}
.fl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2);min-width:0}
.fl select,.fl input,.fl textarea{max-width:100%;min-width:0}
.fl.wide{grid-column:1/-1}
.fl input,.fl select,.fl textarea{font-size:13px;color:var(--ink)}
.ck{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink);white-space:nowrap}
.adds{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.chg{border:1px solid var(--line);border-radius:9px;margin:10px 12px;background:var(--card)}
.chg>.hd{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg);border-bottom:1px solid var(--line);border-radius:9px 9px 0 0}
.chg>.hd b{font-size:13px}
/* 쉬운 진행 — 단계 막대 · 큰 단추 · 한글 쪽 화면 */
.wiz{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap}
.wiz button{flex:1 1 150px;display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;border-radius:10px;white-space:normal}
.wiz button .no{flex:0 0 26px;height:26px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;background:var(--line);color:var(--ink2);font-weight:700}
.wiz button .tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.wiz button .tx small{color:var(--mute);font-size:11.5px}
.wiz button.on{border-color:var(--blue);background:var(--blue-bg)}
.wiz button.on .no{background:var(--blue);color:#ffffff}
.wiz button.done .no{background:var(--green-m);color:#ffffff}
/* 단계 줄은 지금 단계만 설명을 보인다 — 한눈에 덜 복잡하게 */
.wiz button:not(.on):not(.skip) .tx small{display:none}
.easy .adds{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;padding:10px 12px}
.tile{padding:12px;font-size:14px;text-align:left;white-space:normal;border-radius:10px;line-height:1.35}
.tile small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
#editor{scroll-margin-top:96px}
.howto{margin:6px 0 0;padding-left:20px}
.howto li{margin:5px 0;line-height:1.5}
.nextbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line)}
.nextbar .pri{padding:9px 16px;font-size:14px}
/* 인쇄 — 보기 칸이 열려 있을 때는 칸 안의 서류만(새 서류 «🖨 인쇄») */
@media print{
  body.withSide>*:not(#side){display:none !important}
  body.withSide #side.on{display:block !important;position:static !important;width:auto !important;border:0 !important;box-shadow:none !important}
  body.withSide #side .sdh, body.withSide #side .sdt, body.withSide #side .grip{display:none !important}
  body.withSide main{margin-right:0}
  #spv{overflow:visible !important;height:auto !important;background:#ffffff !important}
  #spv .pvi{padding:0 !important;background:#ffffff !important;overflow:visible !important}
  #spv canvas{box-shadow:none !important;margin:0 auto !important;break-after:page;page-break-after:always;max-width:100% !important}
}
.chg>.bd{padding:9px 10px}
.tos{margin-top:8px;border-top:1px dashed var(--line2);padding-top:8px}
.tor{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}
.tor select{min-width:140px}
.tor input{width:150px}
.msgs{padding:0 12px 4px}
.msg{padding:6px 10px;border-radius:8px;margin:6px 0;font-size:12.5px;border:1px solid}
.msg.e{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.msg.w{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.msg.i{background:var(--blue-bg);color:var(--blue-d);border-color:var(--blue-line)}
.msg.ok{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reg{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:12.5px;background:var(--card)}
.reg h4{margin:0 0 6px;font-size:12.5px;color:var(--ink2)}
.reg .ln{padding:3px 0;border-bottom:1px dotted var(--line)}
.reg .ln:last-child{border-bottom:none}
.reg .del{text-decoration:line-through;color:var(--mute)}
.reg .new{color:var(--blue-d);font-weight:600}
.items .it{padding:6px 0;border-bottom:1px solid var(--line)}
.items .it:last-child{border-bottom:none}
.items .g{display:inline-block;min-width:66px;color:var(--ink2);font-size:12px}
.steps{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px}
.step{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12px;display:flex;flex-direction:column;gap:3px;min-width:150px}
.step.done{border-color:var(--green-line);background:var(--green-bg)}
.step input{font-size:12.5px}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;min-width:80px;flex:0 0 120px}
.prog>i{display:block;height:100%;background:var(--green-m)}
#lock{display:none;max-width:520px;margin:60px auto;padding:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:center}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#ffffff;padding:9px 16px;border-radius:9px;font-size:13px;display:none;z-index:60;max-width:90vw}
.modal{position:fixed;inset:0;background:var(--ink2);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.mbox{background:var(--card);border-radius:12px;max-width:900px;width:100%;box-shadow:0 8px 24px var(--ink2)}
.mbox>h3{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px;display:flex;gap:8px;align-items:center}
.mbox>.mb{padding:12px 14px}
.mbox>.mf{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* 오른쪽 보기 칸(2026-11-15) — 넓은 화면은 목록 오른쪽에 붙고 본문이 왼쪽으로 좁아진다 · 좁은 화면은 전체를 덮는다 */
#side{display:none}
#side.on{display:flex;flex-direction:column;position:fixed;z-index:15;top:var(--headH,92px);right:0;bottom:0;width:var(--sideW,46vw);background:var(--card);border-left:1px solid var(--line2);box-shadow:-4px 0 12px var(--line)}
body.withSide main{margin-right:var(--sideW,46vw)}
#side [hidden]{display:none !important}
#side .sdh{display:flex;align-items:center;gap:6px;padding:8px 10px 4px 14px;flex-wrap:wrap}
#side .sdg{display:inline-flex;gap:6px}
#side .sdt{padding:2px 14px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:2px}
#side .sdt b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
#side .sdsub{font-size:12px;color:var(--mute);line-height:1.45}
#side .sdsub:empty{display:none}
#side select{font-size:12px;padding:2px 6px;margin-top:2px}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg button:last-child{border-radius:0 8px 8px 0}
.seg button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#ffffff;position:relative}

/* 칸을 열어 왼쪽 본문이 820px 보다 좁아지면(body.slim — sideFit 이 잰다) 폰처럼 표를 줄마다 카드로(외부 검토 2026-11-15: 종류 칸이 짓눌리고 보기 단추가 잘렸다) */
body.slim .two{grid-template-columns:1fr}
body.slim .t thead{display:none}

body.slim .t tbody td input:not([type=checkbox]),body.slim .t tbody td select{width:100%}
body.slim .t tbody td.inp{flex:1 1 100%}
body.slim .t tbody td.ac{margin-left:auto}
body.slim .arct tbody td.ti{flex:1 1 0;min-width:140px}
body.slim .chg{margin:8px 6px}
body.slim .tor input,body.slim .tor select{width:100%}
body.slim .tiles{grid-template-columns:1fr 1fr}
body.slim .wiz button{flex:1 1 calc(50% - 6px)}
@media (max-width:1079px){

  body.withSide main{margin-right:0}

.empty{padding:22px 12px;text-align:center;color:var(--mute)}
.phone-only{display:none}
@media (max-width:768px){
  main{padding:10px 10px 40px}
  .top{padding:8px 10px}
  .tabs{padding:0 6px}
  .phone-only{display:inline}
  .wide-only{display:none}
  input,select,textarea,.fl input,.fl select,.fl textarea,.step input,.t input:not([type=checkbox]),.t select{font-size:16px}
  .two{grid-template-columns:1fr}
  .grid{grid-template-columns:minmax(0,1fr)}
  /* 넓은 표 → 줄마다 카드(☐·№ 는 왼쪽 끝) */
  .t thead{display:none}
  .t tbody tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:8px 10px;border-bottom:1px solid var(--line)}
  .t tbody td{border:none;padding:0;max-width:100%;white-space:normal}
  .t tbody td.c,.t tbody td.n{width:auto;flex:0 0 auto}
  .t tbody td.tk{cursor:pointer;padding:8px}
  .t tbody td.c{padding:8px}
  .t tbody td.ti{flex:1 1 60%;font-weight:600;white-space:nowrap}
  .t tbody td.nw{flex:1 1 100%;white-space:nowrap}
  .t tbody td.full{flex:1 1 100%;white-space:normal;overflow:visible}
  .t tbody td[data-l]::before{content:attr(data-l) ' ';color:var(--mute);font-size:12px}
  .t tbody td input:not([type=checkbox]),.t tbody td select{width:100%}
  .t tbody td.inp{flex:1 1 100%}
  .t tbody td.ac{margin-left:auto}
  .arct tbody td.ti{flex:1 1 0;min-width:140px}
  #side select{font-size:16px}
  .chg{margin:8px 6px}
  .tor input,.tor select{width:100%}
  .step{flex:1 1 100%}

/* 아주 좁은 폰 — 파일 줄: 1줄 ☐ № 이름 ⬇ · 2줄 종류·날짜(받기 단추가 혼자 둘째 줄로 떨어지지 않게 · 외부 검토 2026-11-15) */
@media (max-width:440px){
  .arct tbody td.ac{order:2;margin-left:0}
  .arct tbody td.kd,.arct tbody td.dt{order:3}
  .arct tbody td.kd{margin-left:54px}
}
/* ═══ 화면 개편(2026-11-18 대표 «UI 모두 깔끔하게 — 너무 단순하고 무미건조하고 빈 공백이 많다 · 한 화면에서 가급적 모두 확인 · 지난 기록은 접어서 펴기») ═══
   · 머리줄 한 줄(이름·탭·사람) · 본문은 화면 너비를 쓴다 · 카드·표를 촘촘하게(표 안 글칸은 가리키면 테두리)
   · 등기 현황: 사무소·지사장 띠 + 왼쪽 법인 정보 / 오른쪽 사원·분사무소 (넓은 화면에서 한 화면)
   · 지난 기록: 묶음·끝난 건·바뀐 기록을 접고 펴기 */
:root{--shadow:0 1px 2px rgba(15,23,42,.07),0 1px 1px rgba(15,23,42,.04)}
body{background:linear-gradient(180deg,#f8fafc,#e2e8f0) fixed}
.card{box-shadow:var(--shadow);border-radius:12px}
.card>h3{padding:8px 12px;background:linear-gradient(#ffffff,#f8fafc);border-radius:12px 12px 0 0;font-size:13.5px}
.cb{padding:8px 12px}
.bar{padding:6px 10px}
.t th,.t td{padding:4px 8px}
.t th{font-weight:600;letter-spacing:-.1px}
@media (min-width:769px){ :where(body:not(.slim)) .t tbody tr:where(:nth-child(even))>td{background:#f8fafc} }
.t td.inp{padding:2px 3px}
.t td.inp input,.t td.inp select{border-color:transparent;background:transparent;padding:3px 6px;font-size:12.5px;text-overflow:ellipsis}
.t td.inp input:hover,.t td.inp select:hover{border-color:var(--line2);background:var(--card)}
.t td.inp input:focus,.t td.inp select:focus{border-color:var(--blue);background:var(--card);outline:none;box-shadow:0 0 0 2px var(--blue-line)}
.t.fx{table-layout:fixed}
.t.fx th,.t.fx td{overflow:hidden;text-overflow:ellipsis}
.t.mt{min-width:940px}
.t.bt{min-width:900px}
.t td.duty{white-space:normal;line-height:1.7}
.mute{color:var(--mute)}
.tiles{gap:6px;padding:8px 12px}
.tile{padding:8px 10px;font-size:13px;border-radius:9px}
.tile small{font-size:11.5px}
.msgs{padding:0 12px 2px}
.msg{padding:5px 10px;margin:5px 0}
.empty{padding:16px 12px}
/* 머리줄 — 이름 · 탭 · 사람이 한 줄 */
#head{background:linear-gradient(90deg,#2563eb,#60a5fa) top/100% 3px no-repeat,var(--card);box-shadow:0 1px 3px rgba(15,23,42,.08)}
.top{padding:6px 16px;gap:10px}
.top h1{font-size:16px;white-space:nowrap}
.tabs{padding:0;margin-left:6px;gap:4px;flex-wrap:nowrap}
.tabs button{border:1px solid transparent;border-radius:999px;background:none;color:var(--ink2);padding:5px 13px;font-weight:600;white-space:nowrap}
.tabs button:hover{background:var(--blue-bg);border-color:var(--blue-line)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#ffffff}
.tabs .tn{display:inline-block;margin-left:5px;min-width:18px;text-align:center;border-radius:9px;padding:0 6px;font-size:11px;font-weight:700;background:var(--blue-bg);color:var(--blue-d)}
.tabs button.on .tn{background:#ffffff;color:var(--blue-d)}
.tabs .tn:empty{display:none}
main{padding:12px 16px 40px;max-width:1760px;margin:0 auto}
/* 등기 현황 — 사무소·지사장 띠 · 왼쪽 법인 정보 / 오른쪽 사원·분사무소 */
#pane-base,#pane-hist,#pane-case{container-type:inline-size}
.sums{display:inline-flex;gap:5px;flex-wrap:wrap;align-items:center;font-weight:400}
.ofc{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px;padding:10px 12px}
.oc{border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:9px;padding:6px 10px;background:var(--card);display:flex;flex-direction:column;gap:1px;min-width:0}
.oc.hq{border-left-color:var(--blue);background:linear-gradient(90deg,var(--blue-bg),#ffffff 70%)}
.oc.ok{border-left-color:var(--green-m);background:linear-gradient(90deg,var(--green-bg),#ffffff 70%)}
.oc.no{border-left-color:var(--amber-m);background:linear-gradient(90deg,var(--amber-bg),#ffffff 70%)}
.oc .oh{display:flex;align-items:center;justify-content:space-between;gap:6px}
.oc .oh b{font-size:13px;white-space:nowrap}
.oc .op{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc .ot{font-size:11px;font-weight:600;color:var(--mute);margin-right:3px}
.oc .miss{font-size:12.5px;font-weight:600;color:var(--amber)}
.oc .lic{font-size:11px;font-weight:400;color:var(--mute)}
.oc .oa,.oc .om{font-size:11.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcols,.dright{display:block;min-width:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
.fgrid .fl{font-size:11.5px}
.fgrid .fl input{padding:4px 7px;font-size:12.5px}
/* 중간 너비(2단이 못 되는 데스크톱) — 법인 정보를 4칸으로 펼쳐 세로를 줄인다 */
@container (min-width:720px) and (max-width:1299px){
  .fgrid{grid-template-columns:repeat(4,1fr)}
  .fgrid .fl.wide{grid-column:span 2}
}
@container (min-width:1300px){
  .dcols{display:grid;grid-template-columns:330px minmax(0,1fr);gap:12px;align-items:start}
}
/* 접고 펴기 — 카드 머리가 단추 */
.car{display:inline-block;flex:0 0 14px;width:14px;color:var(--mute);font-size:12px;transition:transform .15s}
.card.fc>.fh{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;border-radius:12px;background:linear-gradient(#ffffff,#f8fafc);padding:8px 12px;white-space:normal;font-weight:400}

/* 지난 기록 AB-1 대시보드 (왼쪽 1줄 핵심 제목 + 가운데 중복 없는 요약·서류 + 오른쪽 상단 밀착 풀높이 한글 뷰어) */
.hd-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-items:start}
@container (min-width:820px){
  :where(body:not(.slim)) .hd-wrap{grid-template-columns:clamp(195px,21%,240px) minmax(0,1fr)}

}
@container (min-width:1050px){

.hd-done-list{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.hd-done-card{width:100%;text-align:left;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px;white-space:normal}

.hd-log-desc{font-size:12px;color:var(--ink2);line-height:1.45;white-space:normal}
.hd-sum{border-bottom:1px solid var(--line);background:var(--card)}
.hd-sum-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;padding:7px 9px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.hd-sum-info{display:flex;flex-direction:column;gap:3px;min-width:min(100%,180px);flex:1}
.hd-sum-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap}

  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function(b){ b.classList.toggle('on', b.dataset.tab===TAB); b.setAttribute('aria-selected', b.dataset.tab===TAB ? 'true' : 'false'); });
  ['case','base','hist'].forEach(function(k){ $('pane-'+k).classList.toggle('on', TAB===k); });
  if(TAB==='case'){ drawBaseWarn(); drawCaseList(); drawEditor(); }
  else if(TAB==='base') drawBase();
  else drawHist();
  drawTabBadges(); sideHead(); sideDocRefresh(); syncHeadH();
}
/* 탭 꼬리표 — 진행 중인 건 수 · 지난 기록 묶음 수 */
function drawTabBadges(){
  var m={ case:caseRows().filter(function(c){ return c.status!=='cancelled' && !(c.status==='done' && c.applied); }).length||'', base:'', hist:arcRows().length||'' };
  /* 꼬리표 숫자의 뜻을 말로도(스크린리더·가리키면) — «등기 건 1» 만 읽히지 않게 */
  var say={ case:function(n){ return '등기 건 — 진행 중 '+n+'건'; }, hist:function(n){ return '지난 기록 — 원본 서류 묶음 '+n+'개'; } };
  Array.prototype.forEach.call(document.querySelectorAll('#tabs .tn'), function(e){
    var n=m[e.dataset.n]||''; e.textContent=n;
    if(e.parentNode) e.parentNode.title=(n&&say[e.dataset.n])?say[e.dataset.n](n):'';
  });
}
function drawBaseWarn(){
  var p=C.baseProblems(BASE);
  $('baseWarn').innerHTML=p.length ? '<div class="msg w">⚠ 등기 현황(지금 등기부)이 비었거나 모자랍니다 — '+esc(p[0])+' <button class="sm" data-act="goBase">등기 현황 넣기</button></div>' : '';
}
function caseRows(){
  return Object.keys(CASES).map(function(k){ return CASES[k]; }).filter(function(c){ return !c._deleted; })
    .sort(function(a,b){ return String(b.meeting&&b.meeting.date||b.createdAt||'').localeCompare(String(a.meeting&&a.meeting.date||a.createdAt||'')) || String(b.id).localeCompare(String(a.id)); });
}
function stChip(st){ var cls={draft:'m',meeting:'',approval:'a',filed:'a',done:'g',cancelled:'m'}[st]||'m'; return '<span class="chip '+cls+'">'+esc(C.STATUS[st]||st)+'</span>'; }
function drawCaseList(){
  var rows=caseRows().filter(function(c){ return c.status!=='cancelled' && !(c.status==='done' && c.applied); });
  var n=Object.keys(SEL.cases).filter(function(k){ return SEL.cases[k]; }).length;
  $('caseSelBar').innerHTML=n ? '<div class="bar"><b>'+n+'건 선택</b><button class="sm warn" data-act="cancelSel">취소로 표시</button><button class="sm" data-act="clearSel">고르기 풀기</button><span class="hint">지우지 않고 «취소» 상태로 돌려 «지난 기록»에 남깁니다</span></div>' : '';
  if(!rows.length){ $('caseList').innerHTML='<div class="empty">진행 중인 등기 건이 없습니다. «＋ 새 등기 건»으로 시작하십시오. 끝난 건은 «📚 지난 기록»에 있습니다.</div>'; return; }
  var all=rows.length && rows.every(function(c){ return SEL.cases[c.id]; });
  var h='<table class="t"><thead><tr><th class="c"><input type="checkbox" data-selall="cases"'+(all?' checked':'')+' title="보이는 줄 모두 고르기"></th><th class="n">№</th><th>건 이름</th><th>총회일</th><th>단계</th><th>다음 할 일</th><th>필요서류</th></tr></thead><tbody>';
  rows.forEach(function(c, i){
    var a=C.applyChanges(baseOf(c), c), pr=C.checkProgress(a, today());
    h+='<tr class="click'+(c.id===CUR?' cur':'')+'" data-open="'+esc(c.id)+'" tabindex="0" aria-label="'+esc(c.title)+' 열기"><td class="c"><input type="checkbox" aria-label="'+esc(c.title)+' 고르기" data-sel="cases" data-id="'+esc(c.id)+'"'+(SEL.cases[c.id]?' checked':'')+'></td><td class="n">'+(i+1)+'</td>'+
      '<td class="ti" title="'+esc(c.title)+'">'+esc(c.title)+'</td><td data-l="총회">'+esc((c.meeting&&c.meeting.date)||'—')+'</td><td>'+stChip(C.normCase(c).status)+'</td>'+
      '<td class="nw" title="'+esc(C.nextStep(a, today()))+'">'+esc(C.nextStep(a, today()))+'</td><td data-l="서류"><span class="chip '+(pr.stale?'r':pr.done===pr.total?'g':'m')+'">'+pr.done+'/'+pr.total+(pr.stale?' · 기한 지남 '+pr.stale:'')+'</span></td></tr>';
  });
  $('caseList').innerHTML=h+'</tbody></table>';
}

function fld(label, key, val, opt){
  opt=opt||{};
  var t=opt.type||'text', attr=' data-k="'+esc(key)+'"';
  var inp=t==='select' ? '<select'+attr+'>'+opt.options.map(function(o){ return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')+'</select>'
    : t==='textarea' ? '<textarea'+attr+' rows="'+(opt.rows||3)+'" placeholder="'+esc(opt.ph||'')+'">'+esc(val||'')+'</textarea>'
    : '<input type="'+t+'"'+attr+' value="'+esc(val==null?'':val)+'" placeholder="'+esc(opt.ph||'')+'"'+(opt.im?' inputmode="'+opt.im+'"':'')+(opt.max?' maxlength="'+opt.max+'"':'')+'>';
  return '<label class="fl'+(opt.wide?' wide':'')+'">'+esc(label)+inp+'</label>';
}

var ADD_ORDER=['join','leave','repIn','repOut','addr','brAdd','brMove','brClose'];
function staffBySid(sid){ if(!sid) return null; for(var i=0;i<STAFF.length;i++) if(STAFF[i].sid===sid) return STAFF[i]; return null; }
function leaveMemberOpts(list){
  return [['','— 고르기 —']].concat(list.map(function(m){
    var res=STAFF.length?C.matchStaffForMember(STAFF, m):{ hit:null };
    var tag=(res.hit&&(res.hit.status==='retired'||res.hit.retireDate))?' · 인사관리 퇴사'+(res.hit.retireDate?' '+res.hit.retireDate:''):'';
    return [m.id, m.name+(m.rep?' (대표사원)':'')+tag];
  }));
}
function staffOptLabel(u){
  return u.name+(u.title?' · '+u.title:'')+(u.branch?' · '+u.branch:'')+(u.birth?' ('+u.birth+')':' · 생년월일 없음')+(u.addr?'':' · 주소 없음')+(u.status==='retired'?' [퇴직]':'');
}
function joinStaffPicked(ch){
  if(!STAFF.length) return { staff:null, dup:[] };
  var pk=STAFF_PICK[ch.id];
  if(pk==='__off__') return { staff:null, dup:[] };
  if(pk){ var u=staffBySid(pk); if(u && u.name===C.str(ch.name)) return { staff:u, dup:[] }; }
  var nm=C.str(ch.name); if(!nm) return { staff:null, dup:[] };
  if(C.birthOk(ch.birth)){ var mr=C.matchStaffForMember(STAFF, { name:nm, birth:ch.birth }); return { staff:mr.hit, dup:mr.dup||[] }; }
  var mb=C.matchStaffByName(STAFF, nm);
  return { staff:mb.hit, dup:mb.dup||[] };
}
function staffSelectGroupsHtml(grp, selSid){
  var og=function(lab, arr){
    if(!arr.length) return '';
    return '<optgroup label="'+esc(lab)+'">'+arr.map(function(u){
      return '<option value="'+esc(u.sid)+'"'+(u.sid===selSid?' selected':'')+'>'+esc(staffOptLabel(u))+'</option>';
    }).join('')+'</optgroup>';
  };
  return og('아직 등기 안 된 노무사', grp.unregLabor)+og('그 밖의 재직·입사예정', grp.unregOther)+og('이미 등기된 사원 · 퇴사자', grp.others);
}

function addrStaffMetaHtml(ch, am){
  if(!am || !STAFF.length) return '';
  var mr=C.matchStaffForMember(STAFF, am);
  if(!mr.hit || !mr.hit.addr) return '';
  var u=mr.hit;
  if(C.str(ch.addr).replace(/\s+/g,' ')===C.str(u.addr).replace(/\s+/g,' ')) return '';
  return '<div class="staff-meta"><span>푸른통합시스템 주소: <b>'+esc(u.addr)+'</b></span><button class="sm" data-act="useStaffAddr" data-ad="'+esc(u.addr)+'">📥 이 주소 가져오기</button></div>';

function clearJoinAuto(ch, box){
  var prev=STAFF_AUTO[ch.id]; if(!prev) return;
  ['birth','addr','license'].forEach(function(k){
    if(prev[k] && String(ch[k]||'')===String(prev[k])){
      ch[k]='';
      if(box){ var inp=box.querySelector('[data-k="'+k+'"]'); if(inp) inp.value=''; }
    }
  });
  delete STAFF_AUTO[ch.id];
}
function autoFillJoinByName(box, ch){
  if(!STAFF.length) return;
  var prevAuto=STAFF_AUTO[ch.id];
  if(prevAuto && prevAuto.name!==C.str(ch.name)) clearJoinAuto(ch, box);
  delete STAFF_PICK[ch.id];
  var mr=C.matchStaffByName(STAFF, ch.name);
  var sel=box.querySelector('[data-staff-join]');
  if(mr.hit){
    STAFF_PICK[ch.id]=mr.hit.sid;
    var res=C.staffFillJoinPatch(mr.hit, ch, { fromPicker:false });
    Object.keys(res.patch).forEach(function(k){
      ch[k]=res.patch[k];
      var inp=box.querySelector('[data-k="'+k+'"]');
      if(inp) inp.value=res.patch[k];
    });
    STAFF_AUTO[ch.id]={ sid:mr.hit.sid, name:mr.hit.name, birth:res.patch.birth||'', addr:res.patch.addr||'', license:res.patch.license||'' };
    if(sel) sel.value=mr.hit.sid;
    if(res.filled.length){
      joinOptLabel(ch);
      toast('푸른통합시스템에서 '+mr.hit.name+'님의 '+res.filled.join('·')+'을(를) 자동으로 가져왔습니다', 3500);
    }
  } else if(sel){
    sel.value='';
  }
  var nt=box.querySelector('[data-staff-note]');
  if(nt) nt.innerHTML=joinStaffMetaHtml(ch);
}
function drawChanges(){
  var c=cur(), n=C.normCase(c), a=C.applyChanges(baseOf(c), c); var B0=baseOf(c);
  var h='<div class="adds">'+ADD_ORDER.map(function(t){ return '<button class="sm" data-add="'+t+'">'+C.TYPES[t].icon+' '+esc(C.TYPES[t].label)+'</button>'; }).join('')+'</div>';
  h+=drawStaffAlertHtml(B0, n);

function arcWrite(id, fn){

/* 파일 올리기 — 한 개씩: 보관함 🔒 자리 → 묶음에 한 줄. 중간에 끊겨도 올린 것까지는 묶음에 남는다 */
function arcUpload(evId, files){
  var list=Array.prototype.slice.call(files||[]); if(!list.length) return;
  var a=arcById(evId); if(!a){ toast('묶음을 찾지 못했습니다'); return; }
  if(!window.PuOfficeStore){ toast('원본 보관함 기능을 불러오지 못했습니다 — 새로고침 하십시오', 4000); return; }
  for(var i=0;i<list.length;i++){ var ck=PuOfficeStore.okDocFile(list[i].name, list[i].size); if(!ck.ok){ toast(list[i].name+' — '+ck.why, 5000); return; } }
  if(!confirm('«'+(a.title||'묶음')+'»에 '+list.length+'개 파일을 올릴까요?\n\n· 원본 보관함 🔒 자리에 둡니다 — 보기·받기는 총괄관리자만.\n· 주민번호 뒷자리가 보이는 서류는 가린 사본을 올리십시오.\n· 올린 파일은 지울 수 없습니다(묶음에서 빼기만).')) return;
  ARC_BUSY=true; drawHist();
  var g=GEN, ok=0, fail=[], other=0;
  list.reduce(function(p, fl, idx){ return p.then(function(){
    if(g!==GEN) return;
    /* ★ 이름의 주민번호 뒷자리는 «올리기 전»에 지운다 — 원본 보관함 색인(pu_docs/originals)은 직원 모두가 읽고, 창고 경로에도 이름이 들어간다(보안 검토 2026-11-14) */
    var nm=C.safeName(fl.name)||'파일';
    toast('올리는 중… '+(idx+1)+'/'+list.length+' '+nm, 60000);
    return fl.arrayBuffer().then(function(buf){
      if(g!==GEN) return null;
      return PuOfficeStore.putOriginal({ name:nm, size:fl.size, type:fl.type||'', bytes:new Uint8Array(buf) }, { kind:'deungi', ev:evId }, { secret:true, alive:function(){ return g===GEN; } });
    }).then(function(r){
      if(g!==GEN||!r) return;
      /* 같은 파일이 이미 보관함에 있으면 그 기록을 다시 쓴다 — 🔒 푸른등기 파일이 아니면(직원이 여는 보통 자리·다른 업무) 잇지 않는다. 규칙도 같은 것을 막는다 */
      return (r.reused ? PuOfficeStore.getOriginal(r.fileId) : Promise.resolve({ secret:true, from:{ kind:'deungi' } })).then(function(rec){
        if(g!==GEN) return;
        if(!rec || rec.secret!==true || !rec.from || rec.from.kind!=='deungi'){ other++; return; }
        var e=C.arcFileEntry(r.fileId, nm); if(!e) throw new Error('파일 번호가 올바르지 않습니다');
        return arcWrite(evId, function(x){ var had=x.files[e.fileId]; x.files[e.fileId]=had?Object.assign({}, e, { kind:had.kind, date:had.date||e.date, addedAt:had.addedAt||e.addedAt }):e; return x; }).then(function(){ ok++; });
      });
    }).catch(function(err){ if(g!==GEN) return; fail.push(C.safeName(fl.name)+' — '+((err&&err.message)||err)); });
  }); }, Promise.resolve()).then(function(){
    if(g!==GEN) return;
    ARC_BUSY=false; drawHist();
    toast(ok+'개 올렸습니다'+(other?' · 같은 파일이 이미 원본 보관함에 다른 업무 파일로 있어 잇지 않음 '+other+'개':'')+(fail.length?' · 못 올림 '+fail.length+'개: '+fail[0]:''), fail.length||other?9000:3000);
  });
}
function arcSetKind(evId, fid, kind){
  if(!C.ARC_KINDS.some(function(o){ return o[0]===kind; })) return toast('올바른 파일 종류가 아닙니다');
  var g=GEN;
  arcWrite(evId, function(a){ if(a.files[fid]) a.files[fid].kind=kind; return a; })
    .then(function(){ if(g!==GEN) return; toast('종류를 바꿨습니다'); drawHist(); })
    .catch(function(e){ if(g!==GEN) return; toast('저장하지 못했습니다 — '+((e&&e.message)||''), 5000); drawHist(); });
}
function arcSelected(){ return Object.keys(SEL.arc).filter(function(k){ return SEL.arc[k]; }).map(function(k){ var p=k.split('|'); return { ev:p[0], fid:p[1] }; }); }
function arcSelOut(){

  Object.keys(by).reduce(function(p, ev){ return p.then(function(){ if(g!==GEN) return; return arcWrite(ev, function(a){ by[ev].forEach(function(fid){ delete a.files[fid]; }); return a; }); }); }, Promise.resolve())

    .catch(function(e){ if(g!==GEN) return; toast('저장하지 못했습니다 — '+((e&&e.message)||''), 5000); drawHist(); });
}
var ARC_DL=false;
function arcDownload(list){

function arcRevoke(){ PV_SEQ++; PV_BYTES=null; clearTimeout(SIDE_T); SIDE_T=null; clearTimeout(SIDE_DT); SIDE_DT=null; if(SIDE_RAF){ cancelAnimationFrame(SIDE_RAF); SIDE_RAF=0; } var sd=SIDE_DOC; SIDE_DOC=null; SIDE_DRAW=null; if(sd && typeof sd.free==='function'){ try{ sd.free(); }catch(e){} } if(PV_URL){ try{ URL.revokeObjectURL(PV_URL); }catch(e){} PV_URL=''; } }
/* ── 오른쪽 보기 칸(2026-11-15 대표 「보기서류는 … 오른쪽에 보여서 하나씩 확인할 수 있게 — 그렇게 해야 실시간으로 비교할 수 있다」 · 「새로 만든 서류도 오른쪽으로」) ──
   넓은 화면: 목록 오른쪽에 붙는 칸(본문은 왼쪽으로 좁아진다) — 탭을 옮겨도 남아 «지난 원본»과 «새로 만든 서류»를 같은 자리에서 맞바꿔 본다.
   좁은 화면(1080px 미만·폰): 화면 전체를 덮는 창(Tab 은 칸 안에서만 돈다). ◀ 이전·다음 ▶ 은 보는 쪽(원본 전체·새 서류 전체)을 목록 차례대로.
   ⚠ 여는 길은 그대로 puDocSecret(총괄관리자만) — 늦게 온 응답은 세대(GEN)·차례(PV_SEQ)·그릴 자리(box)로 버린다.
   ⚠ 새 서류는 서버를 거치지 않는다 — 지금 건의 값으로 이 브라우저에서 만든다(주민번호 뒷자리는 «🔐 주민번호 넣기»로 넣은 것만, 칸을 닫거나 로그아웃하면 바이트를 비운다). */
var SIDE_MIN=360, SIDE_KEEP=520;   /* 칸 최소 너비 · 왼쪽 본문에 남길 너비 */
function sideOverlay(){ try{ return window.matchMedia('(max-width:1079px)').matches; }catch(e){ return false; } }
function sideW(){ var w=Number(lsGet('sideW'))||Math.round(window.innerWidth*0.46); return Math.max(SIDE_MIN, Math.min(w, window.innerWidth-SIDE_KEEP)); }
function arcFlat(){ var out=[]; arcRows().forEach(function(a){ C.arcFiles(a).forEach(function(x){ out.push({ ev:a.id, fid:x.fileId }); }); }); return out; }
/* 새로 만든 서류 목록 — 쉬운 진행은 «고른» 서류, 자세히는 필요한 서류 전부. 건이 없거나 빨간 글이 있으면 빈 목록 */
function docList(){
  var c=cur(); if(!c || !window.DeungiDocs) return [];
  var a=C.applyChanges(baseOf(c), c); if(a.errors.length || !a.c.changes.length) return [];
  return C.docPlan(a, { today:today() }).filter(function(d){ return d.need && (MODE!=='easy' || d.on); }).map(function(d){ return { key:d.key, title:d.title }; });
}
function docTitle(key){ var t=key; (C.DOCS||[]).forEach(function(d){ if(d.key===key) t=d.title; }); return t; }
function sideList(){ return !SIDE ? [] : SIDE.kind==='doc' ? docList() : arcFlat(); }
function sideIdx(fl){ if(!SIDE) return -1; for(var i=0;i<fl.length;i++){ var x=fl[i]; if(SIDE.kind==='doc' ? x.key===SIDE.key : (x.ev===SIDE.ev && x.fid===SIDE.fid)) return i; } return -1; }
function sideFit(){
  var root=document.documentElement, hd=$('head'), s=$('side'), w=sideW();
  root.style.setProperty('--headH', (hd?Math.round(hd.getBoundingClientRect().height):0)+'px');
  root.style.setProperty('--sideW', w+'px');
  var ov=sideOverlay();
  document.body.classList.toggle('slim', !!SIDE && !ov && document.documentElement.clientWidth-w < 820);
  /* 덮는 모양일 때 가려진 머리·본문은 보조기술도 못 건드리게(보안 검토 2026-11-15) */
  [hd, $('app')].forEach(function(e){ if(e) e.inert=!!(SIDE && ov); });
  if(!s||!SIDE) return;
  var gr=s.querySelector('[data-grip]');
  s.setAttribute('role', ov?'dialog':'complementary'); if(ov) s.setAttribute('aria-modal','true'); else s.removeAttribute('aria-modal');
  if(gr){ gr.setAttribute('aria-valuenow', String(w)); gr.setAttribute('aria-valuemax', String(Math.max(SIDE_MIN, window.innerWidth-SIDE_KEEP))); }
}
/* 칸 뼈대 — 한 번만 만든다(원본↔새 서류를 바꿔도 단추에 초점이 남는다). 종류 칸은 지난 원본일 때만 */

  var el=ev.target; if(!el||!el.matches('input,select,textarea')) return;
  if(el.dataset.af!=null) return; /* 묶음 창의 글칸 — «저장» 단추로만 */
  if(el.id==='sdKind'){ if(ev.type==='change' && SIDE && SIDE.kind==='arc') arcSetKind(SIDE.ev, SIDE.fid, el.value); return; }
  if(el.id==='arcPvKind'){ if(ev.type==='change' && HIST_UI.sel && HIST_UI.fid) arcSetKind(HIST_UI.sel, HIST_UI.fid, el.value); return; }
  if(el.dataset.histQ){ if(HIST_UI.q!==el.value){ HIST_UI.q=el.value; drawHist(); } return; }
  var isText=(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&/^(text|search|tel|)$/.test(el.type||'')));
  if(ev.type==='input' && !isText) return;
  if(ev.type==='change' && isText && !el.closest('#pane-base')){ var bx=el.closest('[data-ch]'); if(bx && cur() && el.dataset.k==='name'){ var cj=chgById(bx.dataset.ch); if(cj && cj.type==='join') joinOptLabel(cj); } return; }
  var v=el.type==='checkbox'?el.checked:el.value;
  /* 고르기 칸 */
  if(el.dataset.selall && el.dataset.selall.indexOf('arc:')===0){ var ak=el.dataset.selall.slice(4), aa2=arcById(ak); if(aa2) C.arcFiles(aa2).filter(function(x){ return HIST_UI.kind==='ALL' || (x.kind||'etc')===HIST_UI.kind; }).forEach(function(x){ SEL.arc[ak+'|'+x.fileId]=el.checked; }); drawHist(); return; }
  if(el.dataset.selall){ var key=el.dataset.selall, on=el.checked;
    var ids=key==='cases'?caseRows().filter(function(c){ return c.status!=='cancelled' && !(c.status==='done'&&c.applied); }).map(function(c){ return c.id; }):key==='mem'?bd().members.map(function(m){ return m.id; }):bd().branches.map(function(x){ return x.id; });
    SEL[key]={}; if(on) ids.forEach(function(id){ SEL[key][id]=true; });
    if(key==='cases') drawCaseList(); else drawBase(); return; }
  if(el.dataset.sel){ SEL[el.dataset.sel][el.dataset.id]=el.checked; if(el.dataset.sel==='cases') drawCaseList(); else if(el.dataset.sel==='arc') drawHist(); else drawBase(); return; }
  /* 등기 현황 */
  if(el.closest('#pane-base')){
    var b=touchBase();
    if(el.dataset.bm!=null){ var m=b.members[Number(el.dataset.bm)]; if(!m) return; var k=el.dataset.k;
      if(k==='invest.cash'){ m.invest=C.normInvest(m.invest); m.invest.cash=C.num(v); }
      else if(k==='invest.labor'){ m.invest=C.normInvest(m.invest); m.invest.labor=!!v; }
      else if(k==='invest.inKind'){ m.invest=C.normInvest(m.invest); m.invest.inKind=C.str(v).slice(0,300); }
      else if(k==='birth') m.birth=String(v).replace(/[^0-9]/g,'').slice(0,6);
      else m[k]=v; }
    else if(el.dataset.bb!=null){ var x=b.branches[Number(el.dataset.bb)]; if(!x) return; x[el.dataset.k]=el.dataset.k==='no'?C.num(v):v; }
    else if(el.dataset.b){ setPath(b, el.dataset.b, v); }
    /* 글자 칸은 다시 그리지 않는다(치는 중 커서가 빠진다) — 고르기·날짜만 다시 그린다 */
    if(ev.type==='change' && (el.type==='checkbox'||el.type==='date')) drawBase(); else baseLive();
    return;
  }
  var c=cur(); if(!c) return;
  /* 쉬운 진행 ② 도장 찍음 */
  if(el.dataset.seal){ c.checks=c.checks||{}; c.checks['seal_'+el.dataset.seal]=Object.assign({}, c.checks['seal_'+el.dataset.seal]||{}, { ok:el.checked }); drawEasyDerived(); scheduleSave(); return; }
  /* 서류 고르기 */
  if(el.hasAttribute('data-docall')){ var plan=C.docPlan(C.applyChanges(baseOf(c), c), { today:today() }).filter(function(d){ return d.need; }); c.docsOff={}; if(!el.checked) plan.forEach(function(d){ c.docsOff[d.key]=true; }); drawDerived(); scheduleSave(); return; }
  if(el.dataset.doc){ c.docsOff=c.docsOff||{}; if(el.checked) delete c.docsOff[el.dataset.doc]; else c.docsOff[el.dataset.doc]=true; drawDerived(); scheduleSave(); return; }
  /* 필요서류 */
  if(el.dataset.ck||el.dataset.iss||el.dataset.note){
    var key2=el.dataset.ck||el.dataset.iss||el.dataset.note; c.checks=c.checks||{}; var ck=c.checks[key2]=Object.assign({}, c.checks[key2]||{});
    if(el.dataset.ck) ck.ok=el.checked; else if(el.dataset.iss) ck.issued=v; else ck.note=v;
    if(el.dataset.note) { scheduleSave(); return; }
    drawDerived(); scheduleSave(); return;
  }
  if(el.dataset.rrn!=null) return;
  if(el.closest('#modal')) return;
  /* 변경 하나 */
  var box=el.closest('[data-ch]');
  if(box){
    var ch=chgById(box.dataset.ch); if(!ch) return; var k2=el.dataset.k;
    if(el.dataset.staffJoin){
      if(!v){ clearJoinAuto(ch, box); STAFF_PICK[ch.id]='__off__'; drawChanges(); drawDerived(); scheduleSave(); return; }
      var su=staffBySid(v); if(!su) return;
      clearJoinAuto(ch, box);
      STAFF_PICK[ch.id]=su.sid;
      var sr=C.staffFillJoinPatch(su, ch, { fromPicker:true });
      Object.keys(sr.patch).forEach(function(pk){ ch[pk]=sr.patch[pk]; });
      STAFF_AUTO[ch.id]={ sid:su.sid, name:su.name, birth:sr.patch.birth||'', addr:sr.patch.addr||'', license:sr.patch.license||'' };
      joinOptLabel(ch); drawChanges(); drawDerived(); scheduleSave();
      toast('푸른통합시스템에서 '+su.name+'님의 '+sr.filled.join('·')+'을(를) 불러왔습니다'+(sr.missing.length?' (비어 있는 '+sr.missing.join('·')+'은(는) 직접 입력)':''), 4000);
      return;
    }
    var prevMember=ch.member;
    if(el.dataset.to!=null){ var t=ch.share.to[Number(el.dataset.to)]; if(!t) return; t[k2]=k2==='amount'?C.num(v):v; }
    else if(k2==='invest.cash'){ ch.invest=C.normInvest(ch.invest); ch.invest.cash=C.num(v); }
    else if(k2==='invest.labor'){ ch.invest=C.normInvest(ch.invest); ch.invest.labor=!!v; }
    else if(k2==='invest.inKind'){ ch.invest=C.normInvest(ch.invest); ch.invest.inKind=C.str(v).slice(0,300); }
    else if(k2==='birth') ch.birth=String(v).replace(/[^0-9]/g,'').slice(0,6);
    else setPath(ch, k2, v);
    if(k2==='member'&&ch.type==='leave'&&el.dataset.to==null){
      ch.share={ mode:'transfer', to:[] };
      if(STAFF.length){
        var B0m=baseOf(c), plm=B0m.members.filter(function(m){ return m.id===prevMember; })[0];
        var pmr=plm?C.matchStaffForMember(STAFF, plm):{ hit:null };
        if(pmr.hit){
          if(ch.date && ch.date===pmr.hit.retireDate) ch.date='';
          if(ch.reason && ch.reason===pmr.hit.leaveReason) ch.reason='';
        }
        var nlm=B0m.members.filter(function(m){ return m.id===v; })[0];
        var nmr=nlm?C.matchStaffForMember(STAFF, nlm):{ hit:null };
        if(nmr.hit){
          var lp2=C.staffFillLeavePatch(nmr.hit, ch);
          Object.keys(lp2.patch).forEach(function(pk){ ch[pk]=lp2.patch[pk]; });
          if(lp2.filled.length) toast('푸른통합시스템에서 '+nlm.name+'님의 '+lp2.filled.join('·')+'을(를) 불러왔습니다', 3500);
        }
      }
    }
    if(k2==='member'&&ch.type==='addr'&&STAFF.length){
      var B0a=baseOf(c), pam=B0a.members.filter(function(m){ return m.id===prevMember; })[0];
      var pmra=pam?C.matchStaffForMember(STAFF, pam):{ hit:null };
      if(pmra.hit && ch.addr && ch.addr===pmra.hit.addr) ch.addr='';
      var nam=B0a.members.filter(function(m){ return m.id===v; })[0];
      var nmra=nam?C.matchStaffForMember(STAFF, nam):{ hit:null };
      if(nmra.hit && nmra.hit.addr && C.str(nmra.hit.addr).replace(/\s+/g,' ')!==C.str(nam.addr).replace(/\s+/g,' ') && !C.str(ch.addr)){
        ch.addr=nmra.hit.addr;
        toast('푸른통합시스템에서 '+nam.name+'님의 바뀐 주소를 가져왔습니다', 3500);
      }
    }
    if(!isText) drawChanges(); else {
      if(k2==='name' && ch.type==='join') autoFillJoinByName(box, ch);
      var aa=C.applyChanges(baseOf(c), c); Array.prototype.forEach.call(document.querySelectorAll('#edChanges [data-ch]'), function(bx3){ var cx=chgById(bx3.dataset.ch), hx=bx3.querySelector('.hd .hint'); if(cx&&hx) hx.textContent=C.describe(C.normChange(cx), baseOf(c), aa); });
      if(el.dataset.to!=null){ var tip=el.nextElementSibling; if(tip) tip.textContent=C.num(v)?C.won(v)+'원':'';
        var lmv=baseOf(c).members.filter(function(m){ return m.id===ch.member; })[0], tot=lmv?C.normInvest(lmv.invest).cash:0, sm=ch.share.to.reduce(function(a,x){ return a+C.num(x.amount); },0), chip=box.querySelector('.tos .chip');
        if(chip){ chip.className='chip '+(sm===tot?'g':'a'); chip.textContent='합계 '+C.won(sm)+' / '+C.won(tot)+'원'; } } }
    drawDerived(); scheduleSave(); return;
  }
  /* 건 정보 */
  if(el.dataset.k==='filing'){ c.filing=v==='agent'?'agent':'self'; scheduleSave(); drawCaseList(); if(MODE==='easy') drawEasy(); else drawEditor(); return; }
  if(el.dataset.k){ setPath(c, el.dataset.k, v); if(el.dataset.k==='status') drawEditor(); else drawDerived(); scheduleSave(); drawCaseList(); }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

/* ═══ 로그인·잠금 — 모르면 잠근다 ═══
   대표·위임관리인만 연다(규칙 deungi 와 같은 사람). 로그인 안 함·퇴사·권한 없음은 잠근다. */
var GEN=0, WHO='';
function wipe(){ GEN++; clearTimeout(SAVE.t); clearTimeout(DL_T); DL_T=null; if(JSON_READER){ try{ JSON_READER.abort(); }catch(e){} JSON_READER=null; } SAVE={ t:null, busy:false, dirty:false, err:'', at:0 }; RRN={}; BASE=C.emptyBase(); BASE_DRAFT=null; BASE_DRAFT_REV=null; BASE_REV=0; CASES={}; CUR=''; SEL={ cases:{}, docs:{}, mem:{}, br:{}, arc:{} }; DL_EACH=false; gate=null;
  ARCH={}; ARC_EV=''; ARC_BUSY=false; ARC_DL=false; sideClose(); arcPvRevoke(); arcCacheClear(); CHARTER_PULL=null; HIST_UI=histUiInit(); SIDE_LAST={ arc:null, doc:null }; DOC_NO_AUTO=''; STEP=0; SHOWN=0; VIEW_GEN++; STAFF=[]; STAFF_SRC=''; STAFF_ERR=''; STAFF_PICK={}; STAFF_AUTO={}; clearTimeout(toastT); var tt=$('toast'); if(tt) tt.style.display='none'; try{ if(window.PuOfficeStore) PuOfficeStore.init({}); }catch(e){}
  var m=$('modal'); if(m){ m.style.display='none'; m.innerHTML=''; } ['caseList','caseSelBar','editor','baseBox','histBox','baseWarn'].forEach(function(k){ var e=$(k); if(e) e.innerHTML=''; }); }
function lock(why){ wipe(); $('app').style.display='none'; $('lock').style.display='block'; $('lockWhy').textContent=why||''; }
function canOpen(role){ return !!role && role.status==='active' && !!role.sid && (role.isAdmin===true || role.isSubAdmin===true); }
async function staffRole(u){ try{ return (await fbDb.ref('uid_roles/'+u.uid).once('value')).val()||null; }catch(e){ return null; } }
function boot(){
  var t=lsGet('tab'); if(['case','base','hist'].indexOf(t)>=0) TAB=t;
  var qt=/[?&]tab=(case|base|hist)\b/.exec(location.search||''); if(qt) TAB=qt[1];
  if(lsGet('mode')==='full') MODE='full';
  var cu=lsGet('cur'); if(cu) CUR=cu;
  if(location.protocol==='file:'){ lock('file:// 로 열면 로그인할 수 없습니다 — 주소로 여십시오'); return; }
  if(typeof firebase==='undefined'){ lock('인터넷이 필요합니다'); return; }
  if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
  fbDb=firebase.database();
  try{ firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
  firebase.auth().onAuthStateChanged(async function(u){
    $('outBtn').style.display=u?'':'none';
    if(!u){ WHO=''; wipe(); $('app').style.display='none'; PuGate.show(); return; }
    if(WHO && WHO!==u.uid) wipe();
    WHO=u.uid; var gen=GEN;
    PuGate.hide();
    var role=await staffRole(u);
    var now=firebase.auth().currentUser;
    if(gen!==GEN || !now || now.uid!==u.uid) return;
    if(!canOpen(role)){ lock(role&&role.status==='active'?'대표·위임관리인 권한이 없는 계정입니다':'재직 중인 직원 계정이 아닙니다'); return; }
    ME.sid=String(role.sid); ME.isAdmin=role.isAdmin===true; if(!ME.isAdmin) purgeAdminPreview(); gate=PuOntologyWrite.createGateway({ mode:'enforce', actor:ME.sid });
    try{ PuOfficeStore.init({ db:fbDb, storage:firebase.app().storage('gs://pureun-erp-hrphotos'), uid:u.uid, name:String(role.name||'').slice(0,60), secretFetch:fetchSecret }); }catch(e){}
    $('lock').style.display='none'; $('app').style.display='';
    await reload();
  });
}
boot();
</script>
