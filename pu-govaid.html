<!-- ══════════════════════════════════════════════════════════════
     푸른노무법인 정부지원금 (pu-govaid.html) — 2026-10-11
     대표 지시 「정부지원금 프로그램 만들려고 한다」 · 「고객사 뿐 아니라 신규고객사에게도 검토후 지원받을 수 있는것 연계예정」
     설계: docs/superpowers/specs/2026-10-11-govaid-design.md · 계획: docs/superpowers/plans/2026-10-11-govaid.md

     ★ 하는 일: 지원사업 «사전»의 조건(확정된 것만)으로 기존·예비 고객사마다 «후보»를 계산해 보여 주고,
       노무사가 해당·보류·비해당을 누른다. 저장되는 것은 그 결정(govaid/reviews)뿐이다 — 판정은 매번 다시 계산한다.
     ★ 쓰는 자리(관문 강제 모드, PROGRAMS.govaid.writeContracts): govaid/programs · prospects · extras · reviews
     ★ 읽기만: data/companies(업체관리 원장) · pubdata/co(국민연금·고용보험 인원, 사업자번호 열쇠)
     ⚠ 이름으로 회사를 잇지 않는다 — 예비 고객 → 업체 연결은 사업자번호가 같을 때만 + PuOntology.validateCompanyLink.
     ⚠ 모르는 값은 «모름» — 0 으로 두지 않는다(엔진 js/pu-govaid-match.js).
     ⚠ 재직 직원 전원이 쓴다. 조건 확정도 누구나 — 누가 했는지(sid)가 남는다.
     ══════════════════════════════════════════════════════════════ -->
<style>
:root{
  --ink:#1e293b; --ink2:#475569; --mute:#64748b; --line:#e2e8f0; --line2:#cbd5e1; --bg:#f8fafc; --card:#ffffff;

  --green:#166534; --green-m:#16a34a; --green-bg:#f0fdf4; --green-line:#bbf7d0;
  --amber:#854d0e; --amber-m:#d97706; --amber-bg:#fffbeb; --amber-line:#fde68a;
  --red:#991b1b; --red-bg:#fef2f2; --red-line:#fecaca;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 11px;line-height:1.3;white-space:nowrap}
button:hover{border-color:var(--mute)}
button.pri{background:var(--blue);border-color:var(--blue);color:#ffffff}
button.sm{padding:3px 9px;font-size:12px}
button.on-yes{background:var(--green-m);border-color:var(--green-m);color:#ffffff}
button.on-hold{background:var(--amber-m);border-color:var(--amber-m);color:#ffffff}
button.on-no{background:var(--ink2);border-color:var(--ink2);color:#ffffff}
input,select,textarea{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line2);border-radius:7px;background:var(--card);color:var(--ink)}
@media (max-width:768px){ input,select,textarea{font-size:16px} }
#head{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:9px 16px;flex-wrap:wrap}
.top h1{font-size:17px;margin:0}
.top .sub{font-size:12px;color:var(--mute)}
.sp{flex:1}
#who{font-size:13px;color:var(--mute)}
.tabs{display:flex;gap:4px;padding:0 16px;flex-wrap:wrap}

.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--blue)}
main{padding:12px 16px 40px}
.pane{display:none}
.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}

.li:hover{background:var(--bg)}

table.t td.n,table.t th.n{width:36px;text-align:right;color:var(--mute)}
table.t tr[data-row]{cursor:pointer}
.chip{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--mute);margin-right:3px}
.c-blue{background:var(--blue-bg);color:var(--blue-d);border-color:var(--blue-line)}
.c-green{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.c-amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.cond{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;margin-right:3px;border:1px solid var(--line);white-space:nowrap}
.s-ok{color:var(--green);border-color:var(--green-line);background:var(--green-bg)}
.s-no{color:var(--red);border-color:var(--red-line);background:var(--red-bg)}
.s-unknown,.s-manual{color:var(--amber);border-color:var(--amber-line);background:var(--amber-bg)}
.sec{padding:8px 12px;font-weight:700;font-size:12.5px;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.sec.fold{cursor:pointer;color:var(--mute);font-weight:600}
.prof{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 12px;font-size:12.5px}
.prof b{color:var(--mute);font-weight:500;margin-right:4px}
.empty{padding:28px 12px;text-align:center;color:var(--mute)}
.hint{font-size:12px;color:var(--mute)}
.note{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:10px}
table.mx th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:150px;padding:6px 4px;font-size:11.5px;max-width:34px}
table.mx td.dot{text-align:center;font-size:14px;padding:5px 2px;cursor:pointer}
.d-candidate{color:var(--green-m)}
.d-unknown{color:var(--amber-m)}
.d-no,.d-unconfirmed{color:var(--line2)}
table.mx td.dot.yes{background:var(--green-bg)}
.ed{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 12px;padding:12px;align-items:center}
.ed label.k{color:var(--mute);font-size:12px}
.ed .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ck{display:inline-flex;gap:3px;align-items:center;font-size:12px;margin-right:8px;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
.mbox{background:var(--card);border-radius:12px;max-width:780px;width:100%}
.mhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:15px}
.mfoot{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line)}
.bulk{display:none;gap:6px;align-items:center;padding:6px 12px;background:var(--blue-bg);border-bottom:1px solid var(--blue-line);font-size:12.5px}
.bulk.on{display:flex}
#lock{display:none;max-width:460px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center}
#lock p{color:var(--mute);font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#ffffff;border-radius:10px;padding:10px 16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
</style>
</head>

<script>
var FB_CONFIG={apiKey:'AIzaSyDkZz5QlKSoqMOYByp5YGeMNLNDrIghliA',authDomain:'pureun-erp.firebaseapp.com',databaseURL:'https://pureun-erp-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'pureun-erp',appId:'1:936817166182:web:9bd31f70d0afdf5fca2aa7',messagingSenderId:'936817166182'};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('on'); },2800); }
function lsGet(k){ try{ return localStorage.getItem('govaid_'+k)||''; }catch(e){ return ''; } }
function lsSet(k,v){ try{ localStorage.setItem('govaid_'+k,v); }catch(e){} }
function ymd(t){ if(!t) return ''; var d=new Date(Number(t)+9*3600e3); return isFinite(d.getTime())?d.toISOString().slice(0,10):''; }
function nm(p){ return (p&&p.name||'')+(p&&p.nameCut?'…':''); }
function fieldsOf(p){ return GovaidMatch.list(p&&p.fields); }
function uniq(a){ return a.filter(function(x,i){ return a.indexOf(x)===i; }); }
function kindChip(pf){ return pf.kind==='co' ? '<span class="chip c-blue">기존</span>' : '<span class="chip c-amber">예비</span>'; }
function statusChip(p){
  if(!GovaidView.needsCheck(p,YEAR)) return '<span class="chip c-green">'+esc(p.baseYear)+' 확정</span>';
  return '<span class="chip c-amber">'+(p.status==='confirmed' ? esc(p.baseYear)+' 확정 · 올해 다시 확인' : '초안')+'</span>';

function condChips(items){ return (items||[]).map(function(i){ return '<span class="cond s-'+i.state+'">'+STATE_TXT[i.state]+' '+esc(i.label)+'</span>'; }).join(''); }
function decChip(r){
  if(!r) return '<span class="chip">미검토</span>';

  return '<span class="chip '+c+'" title="'+esc((r.reason?r.reason+' · ':'')+(r.by||'')+' '+ymd(r.at))+'">'+esc(DEC[r.decision]||'?')+'</span>';

function decBtns(key,pid,r){
  var cur=r&&r.decision;
  return ' '+['yes','hold','no'].map(function(d){ return '<button class="sm'+(cur===d?' on-'+d:'')+'" data-dec="'+d+'" data-k="'+esc(key)+'" data-p="'+esc(pid)+'">'+DEC[d]+'</button>'; }).join('');
}
function profileByKey(k){ for(var i=0;i<PROFILES.length;i++) if(PROFILES[i].key===k) return PROFILES[i]; return null; }
function progById(id){ for(var i=0;i<PROGS.length;i++) if(PROGS[i].id===id) return PROGS[i]; return null; }
function companyById(id){ var l=GovaidView.companies(D.companies); for(var i=0;i<l.length;i++) if(String(l[i].id)===String(id)) return l[i]; return null; }
function indOpts(){ var I=GovaidMatch.INDUSTRIES; return Object.keys(I).map(function(k){ return [k, k+' '+I[k]]; }); }
function kindOk(pf,sel){ return !sel || pf.kind===sel; }

/* ═══ 표 — 맨 왼쪽 ☐ + 보이는 순서 번호(저장 안 함). 고르기 묶음 띠는 표 바로 위 ═══ */
function tbl(name, head, rows){
  var on=rows.length && rows.every(function(r){ return SEL[name+'|'+r.id]; });
  return '<div class="bulk" data-bulk="'+name+'"></div><div class="scroll"><table class="t" data-name="'+name+'"><thead><tr><th class="c"><input type="checkbox" data-all="'+name+'"'+(on?' checked':'')+'></th><th class="n">번호</th>'
    + head.map(function(h){ return '<th>'+h+'</th>'; }).join('') + '</tr></thead><tbody>'
    + rows.map(function(r,i){ var k=name+'|'+r.id;
        return '<tr data-row="'+esc(r.id)+'"><td class="c"><input type="checkbox" data-ck="'+esc(k)+'"'+(SEL[k]?' checked':'')+'></td><td class="n">'+(i+1)+'</td>'
          + r.cells.map(function(c){ return '<td>'+c+'</td>'; }).join('') + '</tr>'; }).join('')
    + '</tbody></table></div>';
}
function picked(name){ return Object.keys(SEL).filter(function(k){ return k.indexOf(name+'|')===0; }).map(function(k){ return k.slice(name.length+1); }); }
function clearSel(name){ picked(name).forEach(function(id){ delete SEL[name+'|'+id]; }); draw(); }
function drawBulk(){
  document.querySelectorAll('[data-bulk]').forEach(function(el){
    var name=el.getAttribute('data-bulk'), n=picked(name).length, kind=BULK[name];
    el.className='bulk'+(n?' on':'');
    if(!n){ el.innerHTML=''; return; }
    var b = kind==='review' ? ['yes','hold','no'].map(function(d){ return '<button class="sm" data-bulkdo="'+name+'" data-d="'+d+'">'+DEC[d]+'</button>'; }).join('')
      : kind==='dropProspect' ? '<button class="sm" data-bulkdo="'+name+'">예비 고객 빼기</button>'
      : kind==='dropProgram' ? '<button class="sm" data-bulkdo="'+name+'">사전에서 빼기</button>'
      : '<button class="sm" data-bulkdo="'+name+'">확정('+YEAR+' 기준)</button>';
    el.innerHTML='고른 <b>'+n+'</b>건 '+b+' <button class="sm" data-bulkclear="'+name+'">고르기 풀기</button>';
  });
}

/* ═══ 창(모달) ═══ */
function openModal(html){ $('mbox').innerHTML=html; $('modal').style.display='flex'; }
function closeModal(){ $('modal').style.display='none'; $('mbox').innerHTML=''; SUBJ=null; JCTX=null; }

/* ═══ 불러오기 — 하나가 막혀도 나머지로 이어 간다. 못 읽은 자료에서 오는 값은 «모름» ═══ */
async function reload(){
  var names=['정부지원금 자료','업체관리','국민연금·고용보험 인원'], fail=[];
  var res=await Promise.allSettled([fbDb.ref('govaid').once('value'), fbDb.ref('data/companies/v').once('value'), fbDb.ref('pubdata/co').once('value')]);
  if(res[0].status==='fulfilled'){ var g=res[0].value.val()||{}; D.programs=g.programs||{}; D.prospects=g.prospects||{}; D.extras=g.extras||{}; D.reviews=g.reviews||{}; } else fail.push(names[0]);
  if(res[1].status==='fulfilled') D.companies=res[1].value.val(); else fail.push(names[1]);
  if(res[2].status==='fulfilled') D.pub=res[2].value.val()||{}; else fail.push(names[2]);
  $('loadNote').style.display=fail.length?'':'none';
  $('loadNote').textContent=fail.length?('읽지 못한 자료: '+fail.join('·')+' — 그 자료에서 오는 값은 «모름»으로 보입니다'):'';
  recompute(); draw();
}
async function reloadReviews(){ try{ D.reviews=(await fbDb.ref('govaid/reviews').once('value')).val()||{}; }catch(e){} draw(); }
function recompute(){ PROGS=GovaidView.programs(D.programs); PROFILES=GovaidView.subjects(D.companies, D.prospects, D.pub, D.extras); }

function draw(){
  document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-tab')===TAB); });
  ['co','grid','prog','dict','check'].forEach(function(k){ $('p-'+k).classList.toggle('on', k===TAB); });
  $('nDict').textContent=PROGS.length;
  $('nCheck').textContent=PROGS.filter(function(p){ return GovaidView.needsCheck(p,YEAR); }).length;
  ({co:drawCo, grid:drawGrid, prog:drawProg, dict:drawDict, check:drawCheck})[TAB]();
  drawBulk();
}

/* ═══ 📚 사업 사전 ═══ */
function fill(id, vals){ var el=$(id), cur=el.value, head=el.options[0].outerHTML;
  el.innerHTML=head+vals.slice().sort(function(a,b){ return a.localeCompare(b,'ko'); }).map(function(v){ return '<option>'+esc(v)+'</option>'; }).join(''); el.value=cur; }
/* 조건 요약 — 빈 사업장으로 판정해 «조건 글자»만 얻는다(판정 결과는 안 쓴다) */
function condSummary(p){
  var x=GovaidMatch.judge({vals:{},facts:{}}, Object.assign({}, p, {status:'confirmed', baseYear:YEAR}), YEAR);
  return x.items.length ? x.items.map(function(i){ return '<span class="cond">'+esc(i.label)+'</span>'; }).join('') : '<span class="chip c-amber">조건 없음</span>';
}
function missingSeeds(){ return GovaidSeed.records().filter(function(r){ return !D.programs[r.id]; }); }
function drawDict(){
  fill('dAgency', uniq(PROGS.map(function(p){ return p.agency||''; })).filter(Boolean));
  fill('dField', uniq([].concat.apply([], PROGS.map(fieldsOf))));
  var miss=missingSeeds().length;
  $('seedBtn').style.display=miss?'':'none'; $('seedBtn').textContent='📥 캡처 사업 넣기 ('+miss+')';
  var q=$('dQ').value.trim().toLowerCase(), ag=$('dAgency').value, fd=$('dField').value, st=$('dStatus').value;
  var view=PROGS.filter(function(p){ return (!q||nm(p).toLowerCase().indexOf(q)>=0) && (!ag||p.agency===ag)
    && (!fd||fieldsOf(p).indexOf(fd)>=0) && (!st || (st==='check')===GovaidView.needsCheck(p,YEAR)); });
  $('dBox').innerHTML = view.length ? tbl('dict',['사업명','분야','담당기관','조건','상태','확인'], view.map(function(p){
    return { id:p.id, cells:[ '<span title="'+esc(p.summary||'')+'">'+esc(nm(p))+'</span>', fieldsOf(p).map(function(f){ return '<span class="chip">'+esc(f)+'</span>'; }).join(''),
      esc(p.agency||'—'), condSummary(p), statusChip(p), p.confirmedBy ? esc(p.confirmedBy)+' · '+ymd(p.confirmedAt) : '—' ] }; }))
    : '<div class="empty">'+(PROGS.length?'조건에 맞는 사업이 없습니다':'사업 사전이 비어 있습니다 — 「📥 캡처 사업 넣기」를 누르세요')+'</div>';
}
/* 씨앗 — 빈 자리에만. 이미 있는(지운 표식 포함) id 는 건드리지 않는다(expectedRevision:-1) */
async function seed(){
  var todo=missingSeeds(); if(!todo.length) return;
  if(!confirm('정부 사이트 캡처의 지원사업 '+todo.length+'개를 «초안»으로 넣습니다(조건은 비어 있습니다). 이미 있는 사업은 건드리지 않습니다. 넣을까요?')) return;
  var res=await Promise.allSettled(todo.map(function(r){ return gate.save(fbDb.ref('govaid/programs/'+r.id), r, { entityType:'SupportProgram', expectedRevision:-1 }); }));
  var ok=res.filter(function(x){ return x.status==='fulfilled'; }).length;
  await reload(); toast(ok+'개를 넣었습니다'+(ok<todo.length?' · '+(todo.length-ok)+'개는 이미 있거나 실패':''));
}

/* ═══ 나머지 탭 — Task 7·8 에서 채운다 ═══ */
function drawCo(){ $('coList').innerHTML='<div class="empty">준비 중</div>'; }
function drawGrid(){ $('gBox').innerHTML='<div class="empty">준비 중</div>'; }
function drawProg(){ $('pList').innerHTML='<div class="empty">준비 중</div>'; }
function drawCheck(){ $('cList').innerHTML='<div class="empty">준비 중</div>'; }

/* ═══ 누르기·고르기 — 한 곳에서 받는다(인라인 onclick 에 열쇠를 넣지 않는다 — 따옴표가 깨진다) ═══ */
document.addEventListener('change', function(e){
  var t=e.target;
  if(t.matches('input[data-ck]')){ var k=t.getAttribute('data-ck'); if(t.checked) SEL[k]=1; else delete SEL[k]; drawBulk(); return; }
  if(t.matches('input[data-all]')){ t.closest('table').querySelectorAll('input[data-ck]').forEach(function(c){ c.checked=t.checked; var k=c.getAttribute('data-ck'); if(t.checked) SEL[k]=1; else delete SEL[k]; }); drawBulk(); }
});
document.addEventListener('click', function(e){
  var t=e.target, b;
  if(t.closest('input')) return;
  if((b=t.closest('#tabs button'))){ TAB=b.getAttribute('data-tab'); lsSet('tab',TAB); draw(); return; }
  if((b=t.closest('[data-close]'))){ closeModal(); return; }
  if((b=t.closest('[data-bulkclear]'))){ clearSel(b.getAttribute('data-bulkclear')); return; }
  if((b=t.closest('[data-bulkdo]'))){ bulkDo(b.getAttribute('data-bulkdo'), b.getAttribute('data-d')); return; }
  if((b=t.closest('[data-newprog]'))){ CUR_CHECK='__new'; TAB='check'; draw(); return; }
  if(clickMore(t)) return;   /* 단추가 줄 누르기보다 먼저 — 줄 안의 «해당» 단추가 검토 창으로 새지 않게 */
  if((b=t.closest('table[data-name] tr[data-row]'))){ rowClick(b.closest('table').getAttribute('data-name'), b.getAttribute('data-row')); return; }
});
/* Task 7·8 이 늘린다 — 처리했으면 true */
function clickMore(t){ return false; }
function rowClick(name,id){ if(name==='dict'){ CUR_CHECK=id; TAB='check'; draw(); } }
async function bulkDo(name){ toast('준비 중'); }

/* ═══ 로그인·잠금 — 모르면 잠근다 ═══ */
function lock(why){ $('app').style.display='none'; $('lock').style.display='block'; $('lockWhy').textContent=why||''; }
async function staffSid(u){ try{ var v=(await fbDb.ref('uid_roles/'+u.uid).once('value')).val()||{}; return v.status==='active' && v.sid ? String(v.sid) : ''; }catch(e){ return ''; } }
function boot(){
  ['coQ','pQ','dQ'].forEach(function(id){ $(id).addEventListener('input', draw); });
  ['coKind','gKind','dAgency','dField','dStatus'].forEach(function(id){ $(id).addEventListener('change', draw); });
  var t=lsGet('tab'); if(['co','grid','prog','dict','check'].indexOf(t)>=0) TAB=t;
  if(location.protocol==='file:'){ lock('file:// 로 열면 로그인할 수 없습니다 — 주소로 여세요'); return; }
  if(typeof firebase==='undefined'){ lock('인터넷이 필요합니다'); return; }
  if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
  fbDb=firebase.database();
  try{ firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
  firebase.auth().onAuthStateChanged(async function(u){
    $('outBtn').style.display=u?'':'none';
    if(!u){ PuGate.show(); return; }
    PuGate.hide();
    var sid=await staffSid(u);
    if(!sid){ lock('접속: '+(u.email||'-')+' — 사번이 없거나 재직 중이 아닙니다'); return; }
    ME.sid=sid; gate=PuOntologyWrite.createGateway({ mode:'enforce', actor:sid });
    $('lock').style.display='none'; $('app').style.display='';
    await reload();
  });
}
boot();
</script>
