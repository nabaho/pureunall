name: 권형하 휴대폰 하나문자 앱 만들기

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/hana-sms-bridge/**'
      - '.github/workflows/build-hana-sms-bridge.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/hana-sms-bridge/**'
      - '.github/workflows/build-hana-sms-bridge.yml'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/hana-sms-bridge
    # 서명키는 저장소에 두지 않는다 — 금고에서 꺼내 쓴다 (대표 결정 2026-08-29 「안전하게」).
    # 금고가 비어 있어도 빌드는 돌아간다(옛날처럼 임시 키). 다만 아래에서 크게 알린다.
    # ★ 보호된 main 브랜치 푸시·수동 실행에서만 서명키 시크릿을 주입하고, PR 검증은 아래 verify-pr 잡에서 시크릿 없이 돌린다.
    env:
      JAVA_TOOL_OPTIONS: -XX:-UseBASE64Intrinsics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Java 보안 패치 버전 확인 (17.0.21.1 이상)
        run: |
          VER=$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/^[[:space:]]*java\.version =/{print $2; exit}')
          echo "설치된 Java 버전: $VER"
          VER="$VER" node -e 'const v=(process.env.VER||String()).split(/[^0-9]+/).filter(Boolean).map(Number); const min=[17,0,21,1]; if(!v.length)process.exit(1); for(let i=0;i<4;i++){const a=v[i]||0,b=min[i]||0; if(a>b)process.exit(0); if(a<b)process.exit(1);}'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: 서명키 꺼내기 (금고에 있을 때만)
        env:
          HANA_KEYSTORE_B64: ${{ secrets.HANA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HANA_KEYSTORE_B64" ]; then
            umask 077
            printf '%s' "$HANA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hana.jks"
            echo "HANA_KEYSTORE_FILE=$RUNNER_TEMP/hana.jks" >> "$GITHUB_ENV"
            echo "고정 서명키를 꺼냈습니다 — 덮어쓰기 설치가 되는 APK 가 나옵니다."
          else
            echo "::warning::고정 서명키가 금고에 없습니다. 임시 키로 서명되어 «덮어쓰기 설치가 안 되는» APK 가 나옵니다 — 깔면 연결이 지워져 연결번호를 다시 넣어야 합니다."
          fi

      - name: APK 만들기
        env:
          HANA_KEYSTORE_PASSWORD: ${{ secrets.HANA_RELEASE_STORE_PASSWORD }}
          HANA_KEY_ALIAS: ${{ secrets.HANA_RELEASE_KEY_ALIAS }}
          HANA_KEY_PASSWORD: ${{ secrets.HANA_RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon

      - name: 임시 서명키 파일 삭제
        if: always()
        run: rm -f "$RUNNER_TEMP/hana.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: pureun-hana-message-android
          path: android/hana-sms-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  verify-pr:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/hana-sms-bridge
    env:
      JAVA_TOOL_OPTIONS: -XX:-UseBASE64Intrinsics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Java 보안 패치 버전 확인 (17.0.21.1 이상)
        run: |
          VER=$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/^[[:space:]]*java\.version =/{print $2; exit}')
          echo "설치된 Java 버전: $VER"
          VER="$VER" node -e 'const v=(process.env.VER||String()).split(/[^0-9]+/).filter(Boolean).map(Number); const min=[17,0,21,1]; if(!v.length)process.exit(1); for(let i=0;i<4;i++){const a=v[i]||0,b=min[i]||0; if(a>b)process.exit(0); if(a<b)process.exit(1);}'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: PR 컴파일·패키징 검증 (서명 시크릿 미주입)
        run: gradle :app:assembleDebug --no-daemon
