<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>공공 기업검색</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🔍</text></svg>">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:'Pretendard','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;background:#f8fafc;color:#1e293b;word-break:keep-all;overflow-wrap:anywhere}
#pubSearchRoot{min-height:100vh;display:flex;flex-direction:column}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
.ps-wrap{max-width:1240px;width:100%;margin:0 auto;padding-left:18px;padding-right:18px}
.ps-hd{background:#ffffff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.ps-hd-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.ps-hd-left{display:flex;align-items:center;gap:10px;min-width:0}
.ps-logo{font-size:24px;line-height:1}
.ps-hd h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.ps-sub{font-size:12px;color:#475569;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-hd-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ps-navbtn{display:inline-flex;align-items:center;gap:4px;padding:8px 12px;min-height:36px;border-radius:8px;border:1px solid #cbd5e1;background:#f8fafc;color:#1e293b;text-decoration:none;font-size:12px;font-weight:600}
.ps-navbtn:hover{background:#eff6ff;border-color:#2563eb;color:#1e40af}
.ps-hero{padding:16px 0;background:#ffffff;border-bottom:1px solid #e2e8f0}
.ps-form{display:flex;gap:8px;width:100%}
.ps-in{flex:1;min-width:0;font-size:16px;padding:12px 16px;border-radius:10px;border:1.5px solid #cbd5e1;background:#f8fafc;color:#1e293b}
.ps-in:focus{border-color:#2563eb;background:#ffffff}
.ps-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ps-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid #cbd5e1;background:#f8fafc;color:#475569}
.ps-chip.on{border-color:#16a34a;background:#f0fdf4;color:#166534}
.ps-layout{flex:1;display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;padding-top:18px;padding-bottom:24px;align-items:start}
.ps-sec-hd{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:10px;font-size:14px;color:#1e293b}
.ps-quick-box{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid #e2e8f0}
.ps-quick-list{display:flex;flex-wrap:wrap;gap:8px}
.ps-qchip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;min-height:36px;max-width:100%;border-radius:8px;border:1px solid #cbd5e1;background:#f8fafc;color:#1e293b;font-size:12px;cursor:pointer;overflow-wrap:anywhere}
.ps-qchip span{color:#475569;font-size:11px}
.ps-qchip:hover{background:#eff6ff;border-color:#2563eb;color:#1e40af}
.ps-api-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ps-api-card{padding:11px 13px;border-radius:10px;border:1px solid #e2e8f0;background:#f8fafc}
.ps-api-hd{display:flex;align-items:center;gap:6px;font-size:13px;color:#1e293b}
.ps-api-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:#cbd5e1}
.ps-api-dot.on{background:#16a34a}
.ps-api-st{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:#ffffff;border:1px solid #cbd5e1;color:#475569}
.ps-api-st.on{background:#f0fdf4;border-color:#16a34a;color:#166534}
.ps-api-desc{margin-top:5px;font-size:12px;color:#475569;line-height:1.45}
.ps-side{background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 180px);position:sticky;top:74px;overflow:hidden}
.ps-stabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #e2e8f0}
.ps-stab{padding:10px 8px;min-height:40px;border:none;background:#f8fafc;color:#475569;font-size:12px;font-weight:700;cursor:pointer}
.ps-stab.on{background:#ffffff;color:#1e40af;border-bottom:2px solid #2563eb}
.ps-sact{padding:6px 10px;text-align:right;border-bottom:1px solid #e2e8f0}
.ps-linkbtn{background:none;border:none;color:#475569;font-size:12px;min-height:36px;padding:6px 8px;cursor:pointer;text-decoration:underline}
.ps-slist{flex:1;overflow-y:auto;padding:6px}
.ps-hrow{display:flex;align-items:center;gap:4px;border-bottom:1px solid #e2e8f0}
.ps-hbtn{flex:1;min-width:0;text-align:left;padding:8px;min-height:40px;border:none;background:transparent;cursor:pointer;border-radius:8px}
.ps-hbtn:hover{background:#f8fafc}
.ps-hq{font-size:13px;font-weight:700;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-hmeta{font-size:11px;color:#475569;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-hdel{background:none;border:none;color:#475569;cursor:pointer;min-width:36px;min-height:36px;font-size:13px;border-radius:8px}
.ps-hdel:hover{color:#dc2626;background:#fef2f2}
.ps-empty-side{padding:18px 12px;font-size:12px;color:#475569;line-height:1.6;text-align:center}
.ps-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.ps-count{font-size:13px;color:#1e293b}
.ps-muted{color:#475569;font-size:12px}
.ps-card{background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(30,41,59,.06)}
.ps-card-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.ps-pin{background:#ffffff;border:1px solid #cbd5e1;border-radius:8px;min-width:36px;min-height:36px;font-size:16px;cursor:pointer;color:#475569;line-height:1}
.ps-pin.on{color:#b45309;border-color:#fbbf24;background:#fffbeb}
.ps-nm{margin:0;font-size:16px;font-weight:800;color:#1e293b;word-break:keep-all}
.ps-src{margin-left:auto;font-size:11px;color:#475569}
.ps-tag{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
.ps-tag.ok{background:#f0fdf4;border:1px solid #16a34a;color:#166534}
.ps-tag.soon{background:#fffbeb;border:1px solid #fbbf24;color:#b45309}
.ps-tag.gone,.ps-tag.none{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.ps-tag.dim{background:#f8fafc;border:1px solid #cbd5e1;color:#475569}
.ps-tag.our{background:#eff6ff;border:1px solid #2563eb;color:#1e40af}
.ps-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;font-size:13px}
.ps-kv{display:flex;gap:8px;min-width:0}
.ps-k{color:#475569;flex:0 0 auto;min-width:64px;font-weight:600}
.ps-v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1e293b}
.ps-v a{color:#1e40af;text-decoration:none}
.ps-v a:hover{text-decoration:underline}
.ps-det-box{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f8fafc;border:1px solid #e2e8f0;font-size:12.5px;line-height:1.55}
.ps-subrow{margin-top:4px;color:#1e293b}
.ps-tbl-wrap{overflow-x:auto;margin-top:6px}
.ps-tbl{width:100%;border-collapse:collapse;font-size:12px}
.ps-tbl th,.ps-tbl td{padding:6px 8px;border-bottom:1px solid #e2e8f0;text-align:right;white-space:nowrap}
.ps-tbl th:first-child,.ps-tbl td:first-child{text-align:left}
.ps-tbl th{background:#f8fafc;color:#1e293b;font-weight:700}
.ps-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid #e2e8f0}
.ps-btn{background:#f8fafc;color:#1e293b;border:1px solid #cbd5e1;border-radius:8px;padding:7px 11px;min-height:36px;font-size:12px;font-weight:600;cursor:pointer}
.ps-btn:hover:not(:disabled){background:#eff6ff;border-color:#2563eb;color:#1e40af}
.ps-btn:disabled{opacity:.5;cursor:not-allowed}
.ps-btn.primary{background:#2563eb;border-color:#2563eb;color:#ffffff;font-weight:700}
.ps-btn.primary:hover:not(:disabled){background:#1e40af;color:#ffffff}
.ps-btn.accent{background:#1e293b;border-color:#1e293b;color:#ffffff;font-weight:700}
.ps-btn.accent:hover:not(:disabled){background:#475569;color:#ffffff}
.ps-btn.ok{background:#166534;border-color:#166534;color:#ffffff}
.ps-submit{padding:10px 18px;font-size:14px}
.ps-welcome{background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;line-height:1.7;font-size:14px;color:#1e293b}
.ps-welcome h2{margin:0 0 8px;font-size:17px;color:#1e293b}
.ps-welcome ul{margin:10px 0 0;padding-left:18px}
.ps-welcome li{margin-bottom:6px}
.ps-loading,.ps-empty{background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:28px 16px;text-align:center;color:#475569;font-size:14px}
.ps-err{padding:12px 14px;border-radius:10px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;font-size:13px;font-weight:600}
.ps-warn{padding:10px 12px;border-radius:10px;background:#fffbeb;border:1px solid #fde68a;color:#b45309;font-size:12px}
.ps-toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9999;background:#1e293b;color:#ffffff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(30,41,59,.28);max-width:calc(100vw - 24px)}
@media (max-width:768px){
  input,select,textarea{font-size:16px}
  .ps-wrap{padding-left:12px;padding-right:12px}
  .ps-hd-in{padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
  .ps-sub{display:none}
  .ps-hero{padding:12px 0}
  .ps-form{flex-direction:column}
  .ps-layout{grid-template-columns:minmax(0,1fr);padding-top:12px;gap:12px}
  .ps-api-grid{grid-template-columns:minmax(0,1fr)}
  .ps-side{position:static;max-height:220px}
  .ps-grid{grid-template-columns:minmax(0,1fr)}
  .ps-v{white-space:normal;word-break:break-word}
  .ps-btn{min-height:38px}
}
</style>
