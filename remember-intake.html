<!--
  ══ 📇 리멤버 → 푸른사진첩·기업정보함 «받는 화면» (대표 「반드시 자동으로」 2026-10-24, 목업 승인) ══
  「리멤버에 받은 명함을 자동으로 푸른 사진첩과 기업정보함에 자동으로 저장되게」
  「이미 모든 자료 다 가지고 왔다 — 최근 자료는 계속 업데이트해야 되는데 귀찮아서 자동화」

  어떻게 도나
   ① 대표 크롬의 «푸른 리멤버 연결» 확장(tools/remember-ext)이 1시간마다 리멤버 탭을 새로 고친다.
   ② 리멤버 화면이 스스로 명함 목록을 부를 때 쓰는 머리를 그 자리에서 빌려, 수정순으로 지난번 뒤에 바뀐 명함만 받는다.
   ③ 확장이 그 명함들과 앞면 그림을 이 창(고정 탭)에 건넨다 — 이 창이 사진첩·기업정보함에 담는다.
      사진첩: PuPhotoStore.savePhoto (사진첩 「서류」, 판독 결과를 미리 적어 다시 판독하지 않음)
      기업정보함: PuDocFile.sendToCards — 사진첩에서 보낼 때와 «같은 문». 같은 사람(휴대폰·이메일)이면 빈 칸만 채운다.
  ⚠ 첫 회차는 «기준»만 잡는다 — 옛 명함은 대표가 이미 다 들여왔다(10/24).
  ⚠ 리멤버 쪽은 읽기만 한다. 리멤버 비밀번호·열쇠를 이 창도 확장도 저장하지 않는다.
  ⚠ 받는 메시지는 «같은 창(window) 안에서, 확장 표시가 붙은 것»만 믿는다.
  ⚠ 이 화면은 기업정보함의 «딸린 화면»이다(pu-ontology.js SATELLITES.remember_intake) — 쓰는 곳은 pucards/remember 와 위 두 문뿐.
-->
<style>
:root{--ink:#1e293b;--sub:#64748b;--line:#e2e8f0;--bg:#f8fafc;--card:#ffffff;--blue:#1e40af;--blue2:#2563eb;--bluebg:#eff6ff;
  --green:#166534;--greenbg:#f0fdf4;--amber:#854d0e;--amberbg:#fffbeb;--red:#991b1b;--redbg:#fef2f2;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:13px;min-height:100vh;}
.hd{background:linear-gradient(135deg,#1e40af,#2563eb);color:#ffffff;padding:14px 18px;}

.hd h1{font-size:16px;font-weight:800;margin-top:2px;}
.wrap{max-width:760px;margin:0 auto;padding:12px;}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(16,30,70,.05),0 6px 18px -10px rgba(16,30,70,.15);}
.band{border-radius:8px;padding:8px 12px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ok{background:var(--greenbg);color:var(--green);border:1px solid #bbf7d0;}
.wait{background:var(--bluebg);color:var(--blue);border:1px solid #bfdbfe;}

table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;table-layout:fixed;}

<body>
<div class="hd"><div class="org">푸른노무법인 · 기업정보함</div><h1>📇 리멤버 받기</h1></div>
<div class="wrap">
  <div class="card"><div id="state" class="band wait">준비 중…</div>
    <p class="muted" style="margin-top:8px">이 탭은 «푸른 리멤버 연결» 확장이 쓰는 받는 창입니다 — 닫지 말고 고정해 두세요.
      리멤버에서 새로 받거나 고친 명함이 1시간마다 사진첩과 기업정보함에 저절로 들어옵니다.
      푸른메일에 처음 보는 사람이 메일을 보내면 서명을 읽어 기업정보함 「📬 메일에서 온 명함」에도 넣습니다.</p></div>
  <div class="card"><b>최근에 받은 명함</b><table id="recent"><colgroup><col style="width:110px"><col style="width:90px"><col><col style="width:150px"></colgroup>
    <tr><th>받은 때</th><th>이름</th><th>회사</th><th>기업정보함</th></tr></table></div>
</div>
<script>
(function () {
  'use strict';
  var FIREBASE_CONFIG = {
    apiKey: 'AIzaSyDkZz5QlKSoqMOYByp5YGeMNLNDrIghliA',
    databaseURL: 'https://pureun-erp-default-rtdb.asia-southeast1.firebasedatabase.app',
    projectId: 'pureun-erp',
    storageBucket: 'pureun-erp-hrphotos',
    appId: '1:936817166182:web:9bd31f70d0afdf5fca2aa7',
    messagingSenderId: '936817166182'
  };
  var ROOT = 'pucards/remember';
  var RECENT_MAX = 20;
  var EXT = 'pu-remember-ext', PAGE = 'pu-remember-intake';
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  var db = firebase.database();
  var storage = null;
  try { storage = firebase.storage(); } catch (e) { storage = null; }
  PuPhotoStore.init({ db: db, storage: storage, auth: firebase.auth() });
  PuDocFile.init({ db: db });

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var S = { user: null, ready: false, status: null, busy: false };
  var day = function (t) { var d = new Date(Number(t) || 0); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); };

  function draw() {
    var st = S.status || {}, el = $('state');
    if (!S.user) { el.className = 'band bad'; el.textContent = '✕ 푸른 포털에 로그인되어 있지 않습니다 — 이 탭에서 로그인해 주세요'; return; }
    if (st.err === 'login') { el.className = 'band bad'; el.textContent = '✕ 리멤버 로그인이 풀렸습니다 — 크롬에서 리멤버(card.rememberapp.co.kr)에 다시 로그인해 주세요 · ' + day(st.errAt); }
    else if (st.at) { el.className = 'band ok'; el.textContent = '● 연결됨 — 마지막 확인 ' + day(st.at) + ' · 지난번 새로 ' + (st.newN || 0) + '장 · 고침 ' + (st.updN || 0) + '장' + (st.total ? ' · 리멤버 전체 ' + Number(st.total).toLocaleString() + '장' : ''); }
    else { el.className = 'band wait'; el.textContent = '확장이 첫 회차를 보낼 때까지 기다리는 중입니다 (첫 회차는 기준만 잡습니다)'; }
    var rows = (st.recent || []).map(function (r) {
      return '<tr><td>' + esc(day(r.at)) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.company) + '</td><td>' + esc(r.what) + '</td></tr>';
    }).join('');
    var tb = $('recent');
    tb.innerHTML = tb.rows[0].outerHTML + (rows || '<tr><td colspan="4" class="muted">아직 받은 명함이 없습니다</td></tr>');
  }

  function reply(msg) { window.postMessage(Object.assign({ __to: EXT, __from: PAGE }, msg), location.origin); }

  /* 그림 하나를 사진첩 크기로 줄인다 — 사진첩과 같은 잣대(uploadSpec) */
  function loadImg(dataUrl) {
    return new Promise(function (ok, no) { var im = new Image(); im.onload = function () { ok(im); }; im.onerror = no; im.src = dataUrl; });
  }
  function shrink(im, edge, q) {
    var sc = Math.min(1, edge / Math.max(im.naturalWidth, im.naturalHeight));
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(im.naturalWidth * sc)); c.height = Math.max(1, Math.round(im.naturalHeight * sc));
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    return { dataUrl: c.toDataURL('image/jpeg', q), w: c.width, h: c.height };
  }

  /* 명함 한 장 — 사진첩에 (처음이거나 그림이 바뀌었을 때만) · 기업정보함에 (같은 사람이면 빈 칸만) */
  function one(c, img, now) {
    var seenRef = db.ref(ROOT + '/seen/' + c.rid);
    return seenRef.once('value').then(function (snap) {
      var seen = snap.val();
      var photo = seen && seen.photo ? seen.photo : null;
      var pic = null;
      var addPhoto = PuRemember.needPhoto(c, seen) && /^data:image\/(jpeg|png|webp);base64,/.test(String(img || ''));
      var step = addPhoto ? loadImg(img).then(function (im) {
        var spec = PuPhotoStore.uploadSpec(true);
        var full = shrink(im, spec.maxEdge, spec.quality), thumb = shrink(im, spec.thumbEdge, 0.85);
        var id = PuPhotoStore.newId();
        var meta = { takenAt: Date.parse(c.createdAt) || now, upAt: now, seq: 0, by: S.user.uid,
          byName: PuPhotoStore.myName() || S.user.email || '', kind: 'doc', via: 'remember',
          w: full.w, h: full.h, size: full.dataUrl.length, company: c.company || '', note: '리멤버 명함',
          read: PuRemember.readOf(c, now, '리멤버') };
        pic = { full: full.dataUrl, thumb: thumb.dataUrl };
        return PuPhotoStore.savePhoto({ id: id, full: full.dataUrl, thumb: thumb.dataUrl, meta: meta })
          .then(function (r) { photo = { owner: S.user.uid, year: String((r && r.year) || PuPhotoStore.photoYear(meta)), id: id }; });
      }) : Promise.resolve();
      return step.then(function () {
        var fields = PuRemember.toFields(c);
        if (!fields.name && !fields.company) return { what: '이름·회사 없음 — 건너뜀' };
        return PuDocFile.sendToCards({ kind: 'card', fields: fields, takenAt: Date.parse(c.createdAt) || now, byName: '리멤버',
          photoId: photo ? photo.id : '', photoYear: photo ? photo.year : '', photoOwner: photo ? photo.owner : '',
          full: pic ? pic.full : '', thumb: pic ? pic.thumb : '' })
          .then(function (r) {
            return { what: r && r.created ? '새로 넣음' : (r && r.filled && r.filled.length ? '빈 칸 채움' : '이미 있음'), id: r && r.id };
          }, function (e) { return { what: '못 넣음: ' + String((e && e.message) || e).slice(0, 40), err: true }; });
      }).then(function (res) {
        var rec = { u: c.updatedAt, at: now, card: res.id || '' };
        if (c.front) rec.front = String(c.front).split('?')[0];
        if (photo) rec.photo = photo;
        return seenRef.set(rec).then(function () { return { name: c.name, company: c.company, what: res.what, at: now, isNew: !seen, err: !!res.err }; });
      });
    });
  }

  /* 확장이 건넨 한 회차 */
  function batch(m) {
    if (S.busy) return Promise.resolve();
    S.busy = true;
    var now = Date.now();
    var cards = (m.stacks || []).map(PuRemember.fromApi);
    var cp = (S.status && Number(S.status.cp)) || 0;
    var p = PuRemember.plan(cards, cp);
    var done = Promise.resolve([]);
    var lastOk = cp;
    if (!p.first) {
      done = p.todo.reduce(function (pr, c) {
        return pr.then(function (acc) {
          return one(c, (m.images || {})[c.rid], now).then(function (r) { if (!r.err) lastOk = Math.max(lastOk, c.updatedAt); acc.push(r); return acc; },
            function (e) { acc.push({ name: c.name, company: c.company, what: '못 넣음: ' + String((e && e.message) || e).slice(0, 40), at: now, err: true }); return acc; });
        });
      }, Promise.resolve([]));
    }
    return done.then(function (res) {
      /* 기준은 «다 넣은 데까지»만 나아간다 — 하나라도 못 넣었으면 그 앞에서 멈춰 다음 회차에 다시 */
      var failed = res.some(function (r) { return r.err; });
      var nextCp = p.first ? p.cp : (failed ? lastOk : Math.max(lastOk, cp));
      var recent = res.concat((S.status && S.status.recent) || []).slice(0, RECENT_MAX);
      var st = { cp: nextCp, at: now, total: Number(m.total) || 0, newN: res.filter(function (r) { return r.isNew && !r.err; }).length,
        updN: res.filter(function (r) { return !r.isNew && !r.err; }).length, errN: res.filter(function (r) { return r.err; }).length,
        first: p.first || null, err: null, errAt: null, recent: recent, by: S.user.uid };
      return db.ref(ROOT + '/status').set(st).then(function () { S.status = st; draw(); reply({ cmd: 'done', cp: nextCp, n: res.length }); });
    }).catch(function (e) { reply({ cmd: 'done', err: String((e && e.message) || e).slice(0, 80) }); })
      .then(function () { S.busy = false; });
  }

  /* ══ 📬 메일 서명 → 기업정보함 명함 (대표 「추천대로」 2026-10-24) ══
     서버(syncMailbox → mailCardRead)가 처음 보는 보낸 사람의 서명을 칸으로 읽어 pucards/mailcard/q 에 «read» 로 둔다.
     이 탭이 그것을 같은 문(sendToCards)으로 넣는다 — 같은 사람이면 빈 칸만, 새 명함은 「📬 메일에서 온 명함」 폴더.
     ⚠ 확장 없이도 이 탭이 열려 있으면 돈다(확장은 이 탭을 늘 열어 둘 뿐). 한 번에 한 줄씩. */
  var MAIL_Q = 'pucards/mailcard/q', MAIL_FOLDER = '📬 메일에서 온 명함';
  var mailBusy = false, mailWait = [], mailFolderId = null;
  function mailFolder() {
    if (mailFolderId) return Promise.resolve(mailFolderId);
    return db.ref('pucards/groups').once('value').then(function (s) {
      var gs = s.val() || {};
      var hit = Object.keys(gs).map(function (k) { return gs[k]; }).find(function (g) { return g && g.name === MAIL_FOLDER && (g.kind || 'card') === 'card'; });
      if (hit) { mailFolderId = hit.id; return hit.id; }
      var g = { id: db.ref('pucards/groups').push().key, name: MAIL_FOLDER, kind: 'card', order: Date.now() };
      return db.ref('pucards/groups/' + g.id).set(g).then(function () { mailFolderId = g.id; return g.id; });
    });
  }
  function mailOne(id, q) {
    var now = Date.now();
    var f = q.f || {};
    return PuDocFile.sendToCards({ kind: 'card', fields: f, takenAt: Number(q.d) || now, byName: '메일' }).then(function (r) {
      var what = r && r.created ? '📬 메일 서명에서 새 명함' : (r && r.filled && r.filled.length ? '📬 이미 있음 — 빈 칸 채움' : '📬 이미 있음');
      var step = (r && r.created && r.id) ? mailFolder().then(function (gid) {
        var u = {}; u['pucards/items/' + r.id + '/group'] = gid; u['pucards/items/' + r.id + '/updatedAt'] = Date.now();
        return db.ref().update(u);
      }) : Promise.resolve();
      return step.then(function () { return { what: what, id: (r && r.id) || '' }; });
    }, function (e) { return { what: '📬 못 넣음: ' + String((e && e.message) || e).slice(0, 40), err: true }; })
      .then(function (res) {
        return db.ref(MAIL_Q + '/' + id).update({ st: res.err ? 'fail' : 'done', card: res.id || '', what: res.what, doneAt: now }).then(function () {
          var rec = { name: f.name || '', company: f.company || '', what: res.what, at: now };
          var st = Object.assign({}, S.status || {}); st.recent = [rec].concat(st.recent || []).slice(0, RECENT_MAX);
          return db.ref(ROOT + '/status/recent').set(st.recent).then(function () { S.status = st; draw(); });
        });
      });
  }
  function mailPump() {
    if (mailBusy || !mailWait.length || !S.ready) return;
    mailBusy = true;
    var x = mailWait.shift();
    mailOne(x.id, x.q).catch(function () {}).then(function () { mailBusy = false; mailPump(); });
  }
  var mailOn = false;
  function mailWatch() {
    if (mailOn) return; mailOn = true;
    db.ref(MAIL_Q).orderByChild('st').equalTo('read').on('child_added', function (s) {
      var q = s.val(); if (!q || q.st !== 'read') return;
      if (mailWait.some(function (x) { return x.id === s.key; })) return;
      mailWait.push({ id: s.key, q: q }); mailPump();
    }, function () { mailOn = false; });
  }

  /* ══ 📄 메일 첨부 서류(사업자등록증·명함) → 사진첩 (대표 「추천대로」 2026-10-24) ══
     받은메일에 «사진첩으로 보낼 만한» 첨부(PuDocPick.보낼만한가 — 메일함 「한꺼번에 사진첩으로」와 같은 잣대)가 오면
     첨부를 받아(미리 보기 peek — 읽음으로 바꾸지 않는다) 사진첩의 올리기 문(addFiles)으로 넣는다:
     PuHandoff 에 두고 이 탭 안 숨은 창에 pu-photos.html?take=… 를 연다 — 판독·기업 상세·🧾 등록증 검토는 사진첩·서버가 지금처럼 한다.
     ⚠ 이 탭을 처음 켠 «뒤에» 온 메일만 — 옛 메일은 지금처럼 메일함 단추로. 같은 메일은 한 번만(doc/{칸_번호}).
     ⚠ 계약서는 빼고(보낼만한가가 뺀다) 메일함의 「→ 기업별 계약서」로. */
  var MB_FN = 'https://asia-northeast3-pureun-erp.cloudfunctions.net/';
  var DOC_ROOT = 'pucards/mailcard/doc', DOC_CP = 'pucards/mailcard/docCp';
  var docOn = false, docKeys = [], docTimer = null;
  function tok() { return firebase.auth().currentUser.getIdToken(); }
  function call(fn, body) {
    return tok().then(function (t) {
      return fetch(MB_FN + fn, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + t }, body: JSON.stringify(body) });
    }).then(function (r) { return r.json().catch(function () { return {}; }); });
  }
  function docOne(slug, row) {
    var id = String(slug).replace(/[.#$\/\[\]]/g, '_') + '_' + row.u;
    var ref = db.ref(DOC_ROOT + '/' + id);
    /* 먼저 차지한다 — 두 탭이 같은 메일을 두 번 담지 않게 */
    return ref.transaction(function (cur) { return cur ? undefined : { at: Date.now(), st: 'take' }; }).then(function (tx) {
      if (!tx.committed) return null;
      return call('readMailMessage', { slug: slug, uid: String(row.u), peek: 1 }).then(function (j) {
        if (!j.ok) throw new Error(j.error || '열지 못했습니다');
        var atts = j.atts || [], want = PuDocPick.보기(row).이름, at = -1;
        for (var k = 0; k < atts.length; k++) {
          var nm = String((atts[k] && atts[k].name) || '');
          if (want && nm === want) { at = k; break; }
          if (at < 0 && PuDocPick.이름갈래(nm)) at = k;
        }
        if (at < 0) throw new Error('서류 첨부를 못 찾음');
        return call('readMailAttachment', { slug: slug, uid: row.u, index: at, part: String((atts[at] && atts[at].part) || '') });
      }).then(function (j) {
        if (!j.ok) throw new Error(j.error || '첨부를 가져오지 못했습니다');
        var bin = atob(j.b64 || ''), buf = new Uint8Array(bin.length);
        for (var k = 0; k < bin.length; k++) buf[k] = bin.charCodeAt(k);
        return PuHandoff.put({ name: String(j.name || '첨부'), type: String(j.mime || ''), bytes: buf, from: '메일 · ' + String(row.f || row.e || '').slice(0, 40) });
      }).then(function (key) {
        docKeys.push(key);
        if (!docTimer) docTimer = setTimeout(docFlush, 20000);     /* 몇 통이 한꺼번에 오면 한 번에 */
        return ref.update({ st: 'photos', name: String(row.s || '').slice(0, 80) }).then(function () {
          note({ name: String(row.f || row.e || ''), company: '', what: '📄 첨부 → 사진첩', at: Date.now() });
        });
      }, function (e) { return ref.update({ st: 'fail', why: String((e && e.message) || e).slice(0, 80) }); });
    });
  }
  /* 숨은 창으로 사진첩을 열어 넘긴다 — 사진첩이 담고·판독하고·기업정보함으로 보낸다. 10분 뒤 닫는다 */
  function docFlush() {
    docTimer = null;
    var keys = docKeys.splice(0, PuDocPick.한번에 || 10);
    if (!keys.length) return;
    var fr = document.createElement('iframe');
    fr.style.cssText = 'position:fixed;width:1px;height:1px;left:-9999px;top:0;border:0';
    fr.src = 'pu-photos.html?take=' + keys.map(encodeURIComponent).join(',');
    document.body.appendChild(fr);
    setTimeout(function () { fr.remove(); }, 10 * 60000);
    if (docKeys.length) docTimer = setTimeout(docFlush, 11 * 60000);
  }
  function note(rec) {
    var st = Object.assign({}, S.status || {}); st.recent = [rec].concat(st.recent || []).slice(0, RECENT_MAX);
    S.status = st; draw();
    return db.ref(ROOT + '/status/recent').set(st.recent);
  }
  function docWatch() {
    if (docOn || typeof PuDocPick === 'undefined' || typeof PuHandoff === 'undefined') return;
    docOn = true;
    Promise.all([db.ref('mailbox/folders').once('value'), db.ref(DOC_CP).once('value')]).then(function (r) {
      var fs = r[0].val() || {};
      var inbox = Object.keys(fs).map(function (k) { return fs[k]; }).find(function (f) { return f && f.kind === 'inbox'; });
      if (!inbox) { docOn = false; return; }
      var base = Number(r[1].val()) || 0;
      if (!base) { base = Date.now(); db.ref(DOC_CP).set(base); }      /* 첫 회차: 지금부터 오는 메일만 */
      db.ref('mailbox/msgs/' + inbox.slug).orderByChild('d').startAt(base).on('child_added', function (s) {
        var row = s.val();
        if (!row || !row.u || !(Number(row.a) > 0) || !PuDocPick.보낼만한가(row)) return;
        docOne(inbox.slug, row).catch(function () {}).then(function () {
          db.ref(DOC_CP).transaction(function (cur) { return Math.max(Number(cur) || 0, Number(row.d) || 0); });
        });
      }, function () { docOn = false; });
    }, function () { docOn = false; });
  }

  /* 확장에서 온 말 — 같은 창 안에서, 확장 표시가 붙은 것만 */
  window.addEventListener('message', function (ev) {
    if (ev.source !== window || ev.origin !== location.origin) return;
    var m = ev.data;
    if (!m || m.__from !== EXT || m.__to !== PAGE) return;
    if (m.cmd === 'hello') {
      /* 확장이 «찾아왔다»는 흔적 — 회차가 어디까지 가는지 밖에서 볼 수 있게(개수·시각만) */
      if (S.user && S.ready) db.ref(ROOT + '/ping').set({ at: Date.now(), by: S.user.uid }).catch(function () {});
      reply({ cmd: 'cp', ready: S.ready, cp: (S.status && Number(S.status.cp)) || 0 }); return;
    }
    if (!S.ready) { reply({ cmd: 'done', err: 'not-ready' }); return; }
    if (m.cmd === 'batch') { batch(m); return; }
    if (m.cmd === 'login-lost') {
      db.ref(ROOT + '/status').update({ err: 'login', errAt: Date.now() }).then(function () {
        S.status = Object.assign({}, S.status, { err: 'login', errAt: Date.now() }); draw(); });
    }
  });

  firebase.auth().onAuthStateChanged(function (u) {
    S.user = (u && u.email) ? u : null;
    S.ready = false;
    if (!S.user) { draw(); return; }
    PuPhotoStore.signIn(u.uid, u.email, u.displayName).catch(function () {}).then(function () {
      return db.ref(ROOT + '/status').once('value');
    }).then(function (s) { S.status = s && s.val ? s.val() : null; S.ready = true; draw(); mailWatch(); mailPump(); docWatch(); reply({ cmd: 'cp', ready: true, cp: (S.status && Number(S.status.cp)) || 0 }); },
      function () { S.ready = true; draw(); });
  });
  draw();
})();
</script>
