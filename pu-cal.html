<style>
  :root{--acc:#2563eb;--acc2:#1e40af;--acc-soft:#eff6ff;--ink:#1e293b;--sub:#475569;--faint:#94a3b8;
    --line:#e2e8f0;--panel:#ffffff;--bg:#f8fafc;--ok:#166534;--warn:#854d0e;--warn-bg:#fffbeb;
    --danger:#dc2626;--radius:11px;
    /* 구글 캘린더의 글자·선 색 — 대표 지시 2026-09-27 「구글캘린더 화면과 완벽하게 같이」.
       구글이 쓰는 «바로 그 값»이다(팔레트 예외는 tests/color-palette-apps.test.js 에 까닭과 함께). */
    /* ★ 2026-09-28 — 구글 캘린더 «요즘 화면»(2024 새 단장) 값으로 한 번 더 맞췄다
         (대표 「색감이나 느낌 선명도 … 여전히 구글이 더 명확하다 … 글자의 색강도 등 구글과 똑같이」).
         두 캡처를 한 점씩 재서 찾은 차이 — 우리 글자가 «한 단계 옅었다»:
           본문 글자     3c4043 → 1f1f1f (거의 검정 — 「N개 더보기」·시각 일정·제목)
           날짜·요일     70757a → 444746
           칸 선         dadce0 → dde3ea (푸른 기가 도는 옅은 선)
           오늘 동그라미 1a73e8 → 0b57d0
           제목 「2026년 9월」 20px → 22px (구글과 같은 크기)
         음력은 구글에 없는 우리 것이라 한 단계 옅게(--gfaint) 둔다 — 날짜와 다투지 않게. */
    --gtext:#1f1f1f;--gsub:#444746;--gline:#dde3ea;--gtoday:#0b57d0;--gdate:#444746;--gfaint:#70757a}
  /* 어두운판 — 수동 전환(대표 지시 2026-09-19 「2번 수동」). 밝은판 값은 위 그대로 두고
     여기서 «덧씌운다». 색은 전부 이미 쓰는 27색 + 흰/검 안에서 고른다(팔레트 검사).
     ⚠ 판(--panel)이 바탕(--bg)보다 «밝다» — 밝은판의 관계(카드가 바탕보다 밝다)를
       그대로 뒤집어 지킨다. --acc·--acc2·--danger 는 검게 배경 위에서도 잘 읽혀
       그대로 둔다(실측: 대비 5.9~6.1:1). */
  /* ★ 2026-09-28 — 구글 캘린더 «어두운 화면» 값으로 바꿨다 (대표 「어둡게 바꿨는데 배경이 조금 불편하다
       … 편안하게」 → 견본 넷 → 「추천대로」=가). 불편했던 까닭 셋:
       ① 바깥 새까만 검정(#000)에 달력만 남색이라 테가 번쩍였다 → 바깥·달력을 같은 짙은 회색으로 잇는다
       ② 칸 선이 밝았다(#475569) → 한 단계 어둡게(#3c4043)
       ③ 앞으로의 칩이 원색 그대로라 부셨다 → 칩은 chipHtml 이 15% 눅인다(어두운판에서만)
     ⚠ 푸른 기 없는 회색이다 — 남색(#1e293b)으로 되돌리면 ①이 되살아난다. */
  :root[data-theme="dark"]{--ink:#e3e3e3;--sub:#9aa0a6;--faint:#80868b;--line:#3c4043;
    --panel:#1b1b1d;--bg:#131314;--acc-soft:rgba(138,180,248,.16);--ok:#4ade80;
    --warn:#fbbf24;--warn-bg:#1b1b1d;
    --gtext:#e3e3e3;--gsub:#9aa0a6;--gline:#3c4043;--gtoday:#8ab4f8;--gdate:#e3e3e3;--gfaint:#9aa0a6}
  *{box-sizing:border-box}
  /* ★ 화면 한 장에 담는다 (대표 지시 2026-09-19 「한화면에 나오게」).
     문서가 굴러가지 않게 몸통을 «세로 세 칸»으로 세운다 — 머리줄·탭줄·본문.
     본문만 제 안에서 굴러간다(달력 탭에서는 그것조차 안 굴러간다). */
  html,body{height:100%}
  body{margin:0;font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;color:var(--ink);
    background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;overflow:hidden}

  /* ── 머리줄 ──
     ⚠ 한 줄이다. 낱말 가운데서 잘려 두 줄이 되면 폰에서 화면을 갉아먹는다.
        넘치면 «줄이는» 것이지 «내리는» 것이 아니다. */
  /* sticky 가 필요 없어졌다 — 몸통이 안 굴러가므로 늘 맨 위다 */
  /* ★ 머리는 «한 줄»이다 (대표 지시 2026-09-27 「캡쳐3 이부분 1줄로 … 중복되는부분 합치고」).
     구글 캘린더 머리줄 차례 그대로: 이름 · 탭 · [오늘] ‹ › 2026년 9월 … 사람 칩 · 거르개 ·
     🔍 · 월|주|일 · 🌙 · 즐겨찾기 · (내 동그라미). 예전 세 줄(머리줄·탭줄·달 이동줄)을 합쳤다.
     ⚠ 좁으면 «줄이고»(음력 범위 → 탭 글자) 안 내린다 — 두 줄이 되면 달력이 그만큼 밀린다. */
  #topbar{flex:none;z-index:15;background:var(--panel);border-bottom:1px solid var(--gline);
    padding:6px 12px;display:flex;align-items:center;gap:8px;white-space:nowrap;position:relative}
  #topbar .brand{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;flex-shrink:0}
  #topbar .sp{margin-left:auto}
  #conn{font-size:12px;color:var(--sub)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#cbd5e1;margin-right:5px}
  .dot.on{background:#16a34a}
  /* 내 동그라미 — 구글처럼 이름 첫 글자. 초록 점 = 서버와 이어짐. 누르면 메일·로그아웃 창 */
  .avawrap{position:relative;flex-shrink:0;display:inline-flex;align-items:center;gap:7px}
  /* 로그인한 사람 이름 — 누르면 동그라미와 같은 창이 뜬다. 길면 … */
  #meName{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;max-width:120px;
    overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  #meName:empty{display:none}
  #me{width:32px;height:32px;border-radius:50%;border:none;background:#7986cb;color:#ffffff;font-weight:700;
    font-size:13px;cursor:pointer;font-family:inherit;position:relative;padding:0}
  #me::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;
    background:#cbd5e1;border:2px solid var(--panel)}
  #me.on::after{background:#16a34a}
  .avamenu{position:absolute;right:0;top:40px;min-width:250px;background:var(--panel);border-radius:10px;
    box-shadow:0 8px 28px rgba(0,0,0,.18);padding:8px 0;z-index:30;white-space:normal}
  .avamenu[hidden]{display:none}
  .avamenu .who{padding:6px 16px 8px;font-size:12.5px;color:var(--gtext)}
  .avamenu .who b{display:block;font-size:13px}
  .avamenu .who .role{color:var(--gsub);font-weight:400;margin-left:4px}
  .avamenu hr{border:none;border-top:1px solid var(--gline);margin:4px 0}
  .avamenu .mi{display:block;width:100%;text-align:left;border:none;background:transparent;padding:8px 16px;
    font-size:12.5px;color:var(--gtext);cursor:pointer;font-family:inherit}
  .avamenu .mi:hover{background:var(--bg)}
  /* 동그라미 단추(🔍·🌙) — 테두리 없이, 누르는 자리만 옅게 */
  .ib{width:34px;height:34px;border-radius:50%;border:none;background:transparent;color:var(--gtext);
    font-size:15px;cursor:pointer;flex-shrink:0;padding:0;font-family:inherit}
  .ib:hover{background:var(--bg)}
  /* 화면 밝기 고르기 — 지금 무엇인지 글자로 보인다(자동·밝게·어둡게) */
  .themebtn{border:1px solid var(--gline);background:var(--panel);color:var(--gtext);border-radius:999px;
    padding:0 11px;height:30px;font-size:12px;cursor:pointer;flex-shrink:0;white-space:nowrap;font-family:inherit}
  .themebtn:hover{background:var(--bg)}
  .lnk{font-size:12.5px;padding:5px 11px;border:1px solid var(--line);color:var(--sub);background:var(--panel);
    border-radius:8px;cursor:pointer;font-weight:700;flex-shrink:0}
  .lnk.go{border-color:#bfdbfe;color:var(--acc2)}

  /* ── 탭 · 달 이동 · 사람 칩 · 도구 — 머리줄 «안»에 든다(예전엔 따로 한 줄이었다) ──
     ⚠ 넘치면 옆으로 밀어 본다(두 줄로 안 내린다). */
  #tabs{flex:1;min-width:0;display:flex;align-items:center;gap:4px;overflow-x:auto;overflow-y:hidden;
    white-space:nowrap;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  .gl{font-size:10px;color:var(--faint);font-weight:700;margin:0 3px 0 0;flex-shrink:0}
  .tab{padding:6px 11px;border-radius:999px;font-size:12.5px;color:var(--gtext);cursor:pointer;
    border:none;background:transparent;font-family:inherit;flex-shrink:0}
  .tab:hover{background:var(--bg)}
  .tab.on{background:var(--acc-soft);color:var(--acc2);font-weight:700}
  .tsep{width:1px;height:18px;background:#cbd5e1;margin:0 7px;flex-shrink:0}
  /* 탭 줄에 얹은 사람 칩 — 오른쪽 끝에 붙는다(왼쪽 탭과 안 섞이게) */
  .tabchips{margin-left:auto;display:flex;align-items:center;flex-shrink:0;padding-left:12px}
  .tabchips .chips{margin-bottom:0;flex-wrap:nowrap}

  #app{flex:1;min-height:0;overflow-y:auto;width:100%;padding:14px 16px 90px;max-width:1500px;margin:0 auto}
  /* ★ 달력 탭 — 한 화면에 «딱» 맞춘다. 좌우도 꽉 채운다(1500px 뚜껑을 벗긴다).
     칸에 안 들어가는 일정은 「+N개 더」로 접고, 누르면 그 자리에서 펼쳐 보인다
     (대표 지시 「달력안에 모든 내용 안보여도 된다. 펼서 볼수 있게 하면 된다」). */
  #app.fit{overflow:hidden;display:flex;flex-direction:column;max-width:none;padding:10px 12px 12px}
  #app.fit .calwrap{flex:1;min-height:0;display:flex;flex-direction:column}
  #app.fit .calhead{flex:none}
  #app.fit .cal{flex:1;min-height:0;display:flex;flex-direction:column}
  #app.fit .calgrid{flex:1;min-height:0;grid-template-rows:repeat(6,1fr)}
  #app.fit .day{min-height:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
  .note{background:var(--warn-bg);border:1px solid #fde68a;border-radius:9px;padding:9px 13px;
    font-size:12px;color:var(--warn);margin-bottom:11px;display:flex;align-items:center;gap:9px}
  .note .sp{margin-left:auto}
  .btn{border:none;border-radius:7px;font-size:12px;font-weight:700;padding:6px 13px;cursor:pointer;
    font-family:inherit;background:var(--acc);color:#ffffff}
  .btn.ghost{background:var(--panel);color:var(--acc2);border:1px solid #bfdbfe}
  .muted{color:var(--sub)}

  /* ── 달력 — 치수는 이알피(법인 대시보드)에서 그대로 가져왔다 ──
     ⚠ 눈대중으로 고치지 말 것. 두 화면이 갈리면 대표님이 같은 것을 두 모양으로 보신다. */
  .calwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px 10px}

  /* 사람 칩 줄 — 색 동그라미 + 이름 두 글자 */
  .chips{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:7px}
  .allchip{padding:3px 9px;border:none;border-radius:10px;cursor:pointer;font-size:10.5px;font-weight:700;
    font-family:inherit;flex-shrink:0;background:var(--bg);color:#475569}
  .allchip.on{background:#1e293b;color:#ffffff}
  .pwrap{position:relative;flex-shrink:0;display:inline-flex}
  .pchip{width:26px;height:26px;border-radius:50%;border:2.5px solid transparent;color:#ffffff;
    font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;
    align-items:center;justify-content:center;box-sizing:border-box;padding:0;transition:transform .1s}
  .pchip.on{border-color:var(--ink);transform:scale(1.15)}
  /* 겹친 날 표 — 이알피와 같은 호박 바탕이다. 파랑이면 「좋은 소식」처럼 보인다.
     ⚠ 글자는 흰색이 아니라 «짙은 호박»이다 — 이알피는 흰 글자인데 호박 위 흰 글자는
       1.7:1 이라 사실상 안 읽힌다(색 검사가 잡았다). 뜻이 같은 색을 쓰되 읽히게 한다. */
  .pcount{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;
    background:#fbbf24;color:#854d0e;font-size:10px;font-weight:800;display:flex;align-items:center;
    justify-content:center;border:1.5px solid var(--panel);pointer-events:none;line-height:1;box-sizing:border-box}
  .chip{font-size:10.5px;border:1px solid #cbd5e1;border-radius:20px;padding:2px 10px;color:var(--sub);
    background:var(--panel);cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
  .chip.on{background:#1e40af;border-color:#1e40af;color:#ffffff;font-weight:700}
  .chip.warn{background:#fef2f2;border-color:#fecaca;color:#991b1b;font-weight:700}
  .chip[disabled]{opacity:.6;cursor:default}
  .srcsep{width:1px;height:18px;background:#cbd5e1;margin:0 4px;flex-shrink:0}

  /* 머리줄 — ◀ 2026-09 ▶ · 음력 · 오늘 · 월|주|일 · 사람 칩 … 검색(맨 오른쪽)
     ★ 셋을 «한 줄»에 둔다 (대표 지시 2026-09-19). 쌓으면 달력이 그만큼 아래로 밀린다. */
  .calhead{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;margin-bottom:0;flex-shrink:0}
  .calhead .monthbar,.calhead .chips{margin-bottom:0}
  .ctools{display:flex;align-items:center;gap:4px;flex-shrink:0}
  /* ⚠ 검색을 margin-left:auto 로 오른쪽 끝에 밀지 않는다 — 줄이 차면 그것만
       «둘째 줄로 떨어져» 도로 두 줄이 된다(2026-09-19 미리보기에서 그랬다).
       달바 바로 뒤에 붙여 두면 칩이 남는 자리를 먹고, 모자라면 칩부터 접힌다. */
  .monthbar{display:flex;align-items:center;gap:7px;white-space:nowrap;flex-wrap:wrap}
  /* ★ 구글 캘린더 머리줄 꼴 (대표 지시 2026-09-27) — [오늘] ‹ › 2026년 9월
     「오늘」은 둥근 알약, 화살표는 테두리 없는 동그라미, 달 이름은 굵지 않은 큰 글자. */
  .monthbar .ym{font-size:22px;font-weight:400;color:var(--gtext);font-variant-numeric:tabular-nums;margin:0 4px}
  .monthbar .lunrange{font-size:11px;color:var(--gsub)}
  .mv{border:none;background:transparent;border-radius:50%;width:30px;height:30px;
    cursor:pointer;color:var(--gtext);font-size:18px;line-height:1;font-family:inherit;padding:0;
    display:inline-flex;align-items:center;justify-content:center}
  .mv:hover{background:var(--bg)}
  .todaybtn{padding:0 16px;height:32px;border:1px solid var(--gline);background:var(--panel);border-radius:999px;
    cursor:pointer;font-size:13px;font-weight:500;color:var(--gtext);font-family:inherit}
  .todaybtn:hover{background:var(--bg)}
  .seg{display:inline-flex;border:1px solid var(--gline);border-radius:999px;overflow:hidden;margin-left:4px}
  .seg button{padding:0 14px;height:30px;font-size:12.5px;font-weight:500;background:var(--panel);color:var(--gtext);
    border:none;border-right:1px solid var(--gline);cursor:pointer;font-family:inherit}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--acc-soft);color:var(--acc2)}
  /* 검색 — 구글처럼 돋보기 하나. 누르면(또는 찾는 말이 있으면) 그 자리에서 칸이 펼쳐진다 */
  .srch{position:relative;display:inline-flex;align-items:center;flex-shrink:0}
  .srch .ic{position:absolute;left:7px;font-size:10px;pointer-events:none}
  .srch input{padding:4px 10px 4px 24px;font-size:11.5px;border:1px solid var(--line);border-radius:10px;
    width:130px;background:var(--panel);box-sizing:border-box;font-family:inherit;color:var(--ink)}

  /* 달력 몸통 */
  /* 구글처럼 — 판 둘레는 옅은 회색 한 줄, 요일은 작은 회색 글자(일·토도 색을 안 입힌다) */
  .cal{border:1px solid var(--gline);border-radius:9px;overflow:hidden;background:var(--panel)}
  .calhd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--panel);font-size:11px;
    font-weight:500;color:var(--gsub);text-align:center}
  .calhd div{padding:6px 0 2px;border-right:1px solid var(--gline)}
  .calhd div:last-child{border-right:none}
  /* 여섯 줄 고정 — 달마다 표 높이가 들썩이지 않게 */
  /* ★ 여섯 줄을 «남은 높이»로 똑같이 나눈다 (대표 지시 2026-09-19 「한화면에 나오게」).
     한때는 줄이 내용에 따라 늘어났는데, 그러면 바쁜 달이 화면 밖으로 내려갔다.
     이제 판의 높이가 먼저 정해지고, 칸은 «들어가는 만큼»만 보인다(나머지는 펼쳐 본다).
     ⚠ 바닥값(minmax)을 다시 두지 말 것 — 그 순간 여섯 줄이 화면을 넘긴다.
     ⚠ «세로 칸(열)»은 반대로 minmax(0,1fr) 여야 한다 — 그냥 1fr 이면 긴 제목·여러 날 막대가
       그 열을 밀어 넓혀, 일곱 칸 너비가 제각각이 된다(2026-09-27 미리보기에서 그랬다). */
  .calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,1fr)}
  /* ⚠ 옆으로는 «넘치게» 둔다(overflow-x:visible) — 여러 날 막대가 옆 칸 위로 건너가야 한다.
       아래로만 자른다(clip — hidden 과 달리 옆 방향까지 끌고 가지 않는다). */
  .day{min-height:104px;padding:2px 8px 2px 2px;overflow-x:visible;overflow-y:clip;box-sizing:border-box;position:relative}
  /* 날짜 줄 — 칸 «가운데»에 「25 (13)」 처럼 날짜와 음력을 나란히 */
  .dline{display:flex;justify-content:center;align-items:center;gap:2px;margin-bottom:2px;padding:0 2px;flex-wrap:wrap}
  /* 요일 — 구글처럼 따로 줄이 아니라 «첫 줄 칸 안» 날짜 위에 */
  .dline .wd{flex-basis:100%;text-align:center;font-size:11px;font-weight:500;color:var(--gsub);line-height:15px;margin-left:6px}
  /* 대표 지시 2026-09-20 「한글과 숫자가 좀더 진했으면」 — 400(보통)은 12px 에서
     연해 보인다. 600(약간 굵게)으로 올렸다. 색(--ink #1e293b)은 이미 짙어서 안 바꿨다. */
  .dnum{min-width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;
    padding:0 4px;font-size:12px;font-weight:500;cursor:pointer;color:var(--gdate);background:transparent}
  .dnum:hover{background:var(--bg)}
  /* 오늘 동그라미는 «숫자에만» — 음력까지 감싸면 알약처럼 길어진다 */
  .dnum.today{background:var(--gtoday);color:#ffffff;font-weight:500}
  .dnum.today:hover{background:var(--gtoday)}
  /* 구글은 앞뒤 달 날짜를 흐리게 안 한다 — 같은 색 그대로 */
  .dnum.other{color:var(--gdate)}
  .lun{font-size:10.5px;color:var(--gfaint);line-height:1}
  .lun.other{color:var(--gfaint)}
  .evs{display:flex;flex-direction:column;gap:2px}
  /* 한 칸은 «한 줄»이다 — 넘치면 … 로 줄이고 전문은 손대면 뜬다 */
  /* ★ 일정 칩 — 구글 캘린더 월 보기와 같은 꼴 (대표 지시 2026-09-27)
       종일 일정 = 색을 «꽉» 채운 둥근 네모 + 흰 글자 (지난 것은 옅게 + 회색 글자)
       시각 일정 = 바탕 없이 «색 점 · 시각 · 제목» (data-g="t")
     ⚠ 두 꼴의 높이가 같아야 한다 — 칸 용량을 첫 칩 하나로 재기 때문이다. */
  .ev{padding:1px 6px;border-radius:4px;font-size:12px;font-weight:500;line-height:18px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;flex:none}
  .ev[data-g="t"]{padding:1px 4px;font-weight:400;background:transparent}
  .ev[data-g="t"]:hover{background:var(--bg)}
  .ev .gdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
  .ev .gtm{margin-right:4px}
  /* 여러 날 막대가 지나가는 칸의 «빈 자리» — 막대 밑에 깔려 줄을 맞춘다 */
  .evph{height:20px;flex:none}
  /* ── 끌어 옮기기 (5걸음) ──
     ⚠ «잡을 수 있는 것»과 아닌 것이 손끝에서 갈려야 한다 — 잡히지도 않는 것을
       한참 끌어 보고서야 아는 것이 제일 나쁘다. */
  .ev[draggable="true"]{cursor:grab}
  .ev[draggable="true"]:active{cursor:grabbing}
  .ev.dragging{opacity:.4}
  /* 놓을 칸 — 테두리만 준다. 바탕을 칠하면 그 칸의 칩 색이 안 보인다. */
  .day.dropon,.wcol.dropon,.dayview.dropon{outline:2px solid #2563eb;outline-offset:-2px}
  /* 공휴일은 칸 맨 위에 «띠»로 — 구글은 둥근 칩이 아니라 칸 옆까지 꽉 채운 띠를 쓴다
     (대표 지시 2026-09-20 「구글과 완벽하게 같게」 — 실제 화면을 재서 확인했다).
     .day 의 좌우 여백(4px)을 음수 마진으로 지워 옆까지 닿게 한다. 색 값(#fecaca·
     #991b1b)은 그대로다 — 팔레트·tests/cal-same-as-erp.test.js 가 색만 못 박는다. */
  /* 공휴일도 구글처럼 «보통 칩»이다(대한민국의 휴일 달력 색). 색은 chipHtml 이 칠한다. */
  .ev.hol{cursor:default}
  .detailgrid.one{grid-template-columns:1fr}
  .lawcnt{font-size:12px;color:var(--sub)}
  .lawcnt b{color:var(--ink);font-size:12.5px}
  .notebtn{border:none;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;width:100%}
  .notebtn:hover .dash{color:var(--acc);text-decoration:underline}
  .modal textarea{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);color:var(--ink);resize:vertical}
  .pubmsg{font-size:11.5px;color:var(--ok);margin-left:9px}
  .pubat{font-size:11px;color:var(--faint);margin-left:9px}
  /* 계정 잇기 — 할 일이 있을 때만 머리줄에 뜬다(없으면 아예 안 그린다) */
  .glogin{font-size:11.5px;padding:4px 10px;border:1px solid #bfdbfe;background:var(--acc-soft);
    color:var(--acc2);border-radius:10px;cursor:pointer;font-family:inherit;font-weight:700;
    white-space:nowrap;flex-shrink:0;margin-left:auto}

  /* 구글 «늘 연결» 표시 — 초록 점(연결됨) · 빨간 점(안 됨·끊김·고장, 누르면 연결) */
  .gst{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 10px 3px 7px;
    border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--sub);
    white-space:nowrap;flex-shrink:0;font-family:inherit;max-width:260px;overflow:hidden;text-overflow:ellipsis}
  button.gst{cursor:pointer;font-weight:700;color:var(--danger);border-color:#fecaca}
  .gd{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none;display:inline-block}
  .gd.on{background:var(--ok)}
  .modal.glink .glt{font-size:16px;font-weight:700;color:var(--ink);margin:6px 0 4px}
  .modal.glink .gls{font-size:12.5px;color:var(--sub);line-height:1.6;margin-bottom:14px}
  .modal.glink .gbtn{border-radius:999px;padding:9px 20px;font-weight:700}
  /* 폰 — 머리줄이 숨어 있으니 ☰ 에 빨간 점(연결 안 됨·고장일 때만) */
  .mmenu{position:relative}
  .mmenu .gd{position:absolute;top:8px;right:2px;width:7px;height:7px}
  .linkacct{font-size:11.5px;padding:4px 10px;border:1px solid #fde68a;background:var(--warn-bg);
    color:var(--warn);border-radius:10px;cursor:pointer;font-family:inherit;font-weight:700;
    white-space:nowrap;flex-shrink:0}
  .linkacct:hover{background:#fde68a}
  /* 구글 칩 옆 자물쇠 — 로그인이 필요할 때만 뜬다(예전 「🔐 구글 로그인」 단추를 합쳤다) */
  .glock{border:none;background:transparent;cursor:pointer;font-size:11px;padding:0 2px;margin-left:-2px;flex-shrink:0}
  /* 검색칸이 맨 오른쪽 — 잇기 단추가 왼쪽으로 밀어 준다 */

  .mmnote{font-size:11.5px;color:var(--warn);background:var(--warn-bg);border:1px solid #fde68a;
    border-radius:8px;padding:7px 10px;margin-bottom:10px;line-height:1.5}
  .mmlist{max-height:52vh;overflow-y:auto;margin-bottom:4px}
  .mmrow{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid var(--line)}
  .mmwho{flex:1;min-width:0}
  .mmmail{display:block;font-size:12px;font-weight:700;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mmn{display:block;font-size:10.5px;color:var(--sub);margin-top:1px}
  .mmrow select{width:148px;flex-shrink:0;padding:5px 7px;font-size:11.5px;font-family:inherit;
    border:1px solid var(--line);border-radius:6px;background:var(--warn-bg);color:var(--ink)}
  .mmrow select.on{background:#f0fdf4}
  .mmempty{font-size:12.5px;color:var(--sub);padding:18px 4px;text-align:center}
  /* 사람 색 바꾸기 — 지금 색 동그라미 하나, 누르면 그 줄 아래에 색표가 펼쳐진다.
     ⚠ 색은 «구글이 준 것»을 그대로 칠한다(style 로 들어온다) — 여기서 색을 정하지 않는다. */
  .cdot{width:26px;height:26px;flex-shrink:0;border-radius:50%;border:2px solid var(--line);
    cursor:pointer;padding:0}
  .cdot.on{border-color:var(--ink)}
  .cdot:disabled{cursor:default;opacity:.5}
  .cpal{flex-basis:100%;display:flex;flex-wrap:wrap;gap:5px;padding:7px 0 3px}
  .cswatch{width:22px;height:22px;border-radius:5px;border:2px solid transparent;cursor:pointer;
    padding:0;line-height:1;position:relative}
  .cswatch:hover{border-color:var(--ink)}
  .cswatch.cur{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
  /* 남이 쓰는 색에 점 하나 — 막지는 않는다(같은 색을 일부러 줄 일도 있다) */
  .ctaken{color:#fff;font-size:15px;font-weight:900;text-shadow:0 0 2px rgba(0,0,0,.6)}
  /* ── 내 색 고르기 (2026-09-27) ──
     색이 서른다섯 가지라 줄로 나열하지 않고 격자로 둔다 — 줄로 두면 창이 길어진다. */
  /* ── 일정 상세 창 (2026-09-27) ──
     구글 달력의 상세 창 꼴 — 색 띄 · 제목 · 언제 · 줄줄이 항목 · 아래 단추. */
  .modal.det{padding:0;overflow:hidden}
  .dbar{height:5px}
  .dtop{padding:13px 16px 4px;display:flex;gap:9px;align-items:flex-start}
  .ddot{width:13px;height:13px;border-radius:3px;flex-shrink:0;margin-top:4px}
  .dttl{font-size:15px;font-weight:600;line-height:1.35;word-break:break-word}
  .dwhen{font-size:12.5px;color:var(--gsub);margin-top:2px}
  .drows{padding:6px 16px 10px}
  .drow{display:flex;gap:10px;font-size:12.5px;padding:4px 0;align-items:flex-start}
  .drow .di{width:16px;text-align:center;color:var(--gsub);flex-shrink:0}
  /* ⚠ 긴 설명이 창을 밀어 넘지지 않게 — 긴 영문 주소 한 줄이 들어오기도 한다 */
  .drow .dt{flex:1;min-width:0;word-break:break-word;white-space:pre-wrap}
  .dhint{font-size:11.5px;color:var(--gsub);background:var(--bg);border-radius:6px;
    padding:7px 10px;margin:0 16px 8px;line-height:1.5}
  .modal.det .mbtns{padding:9px 13px;border-top:1px solid var(--gline);background:var(--bg);margin:0}
  .mypal{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:8px 0 9px}
  .mysw{width:100%;aspect-ratio:1;border-radius:6px;border:2px solid transparent;cursor:pointer;
    padding:0;position:relative;font-family:inherit}
  .mysw:hover{border-color:var(--ink)}
  .mysw.cur{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
  /* 남이 쓰는 색 — 빗금을 치고 이름 두 글자를 올린다.
     ⚠ 숨기지 않는다 — 안 보이면 「왜 이 색은 없지」 하고 찾는다. */
  .mysw.taken{cursor:not-allowed}
  .mysw.taken::after{content:"";position:absolute;inset:0;border-radius:4px;
    background:repeating-linear-gradient(45deg,transparent 0 3px,rgba(255,255,255,.72) 3px 6px)}
  .myw{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:8px;font-weight:800;color:#ffffff;text-shadow:0 0 3px rgba(0,0,0,.85);z-index:2}
  /* 「이게 나」 — 칩에 파란 고리를 두른다. 거르개가 걸렸을 때(.on)와 안 섮이게
     테두리 대신 밖으로 한 겹 둘렀다. */
  .pchip[data-me="1"]{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px #2563eb}
  /* 접힌 것이 몇인지 — 누르면 그 자리에서 펼쳐 보인다 */
  /* 「N개 더보기」 — 구글처럼 바탕 없는 짙은 회색 글자 */
  .more{font-size:12px;color:var(--gtext);padding:0 6px;cursor:pointer;line-height:18px;
    font-weight:500;border-radius:4px;background:transparent;flex:none;white-space:nowrap}
  .more:hover{background:var(--bg)}
  /* 펼침 창 — 화면에 못 박아 띄운다(칸 안에 두면 달력 테두리에 잘린다) */
  /* 펼침 창 — 구글의 「더보기」 창 꼴: 위에 요일(작게)·날짜(크게), 오른쪽 위 ✕ */
  .pop{position:fixed;z-index:40;background:var(--panel);border:none;border-radius:8px;
    box-shadow:0 24px 38px 3px rgba(0,0,0,.14),0 9px 46px 8px rgba(0,0,0,.12),0 11px 15px -7px rgba(0,0,0,.2);
    padding:10px 10px 12px;min-width:236px;max-width:340px;max-height:62vh;overflow-y:auto}
  .pop .ph{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:8px}
  .pop .ph .wd{font-size:11px;font-weight:500;color:var(--gsub)}
  .pop .ph .big{font-size:26px;font-weight:400;color:var(--gtext);line-height:1.1}
  .pop .ph .n{color:var(--gsub);font-weight:400;font-size:11px}
  .pop .ph .x{position:absolute;right:0;top:0;border:none;background:transparent;cursor:pointer;color:var(--gsub);
    font-size:15px;line-height:1;padding:4px 6px;border-radius:50%;font-family:inherit}
  .pop .ph .x:hover{background:var(--bg)}
  .pop .evs{gap:2px}

  /* 주 보기 */
  .wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:420px}
  .wcol{border-right:1px solid var(--gline);padding:0 3px 6px;overflow-x:visible;overflow-y:clip}
  .wcol:last-child{border-right:none}
  .whd{text-align:center;font-size:11px;font-weight:500;color:var(--gsub);padding:5px 0 4px;border-bottom:1px solid var(--gline);
    margin-bottom:5px;display:flex;flex-direction:column;align-items:center;gap:1px}
  .whd .dnum{margin:0 auto}
  /* 일 보기 */
  .dayview{padding:12px;display:flex;flex-direction:column;gap:3px;min-height:320px}
  .dayview .ev{font-size:13px;line-height:24px;padding:2px 9px;border-radius:6px}
  .dayview .evph{display:none}

  /* ── 넣고 고치는 창 ── */
  .veil{position:fixed;inset:0;background:#1e293b;opacity:.45;z-index:40}
  .modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,92vw);
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;max-height:88vh;overflow:auto}
  .modal h3{margin:0 0 12px;font-size:15px}
  .fld{margin-bottom:10px}
  .fld label{display:block;font-size:11px;color:var(--sub);margin-bottom:3px;font-weight:700}
  /* ── 구글 꼴 넣기·고치기 창 (modalHtml 머리글) ── */
  .modal.gform{width:min(460px,94vw);border-radius:28px;padding:10px 20px 18px;background:var(--panel)}
  .gform .ghd{display:flex;align-items:center;gap:6px;margin:0 -6px 4px}
  .gform .sp{flex:1}
  .gform .ggrip{color:var(--gsub);font-size:14px;padding:0 6px}
  .gform .gx{border:none;background:transparent;color:var(--gtext);font-size:18px;width:36px;height:36px;border-radius:50%;cursor:pointer}
  .gform .gx:hover{background:var(--bg)}
  .gform .gtitle{display:block;width:100%;border:none;border-bottom:2px solid var(--gline);background:transparent;

  /* ── 어두운판 ② — CSS 변수로 못 옮기는 나머지 ──────────────────────
     탭·칸 배경 같은 큰 자리는 위 --panel/--bg 하나로 다 끌려간다. 여기는
     자기 색을 «직접 든» 자리만 손으로 하나씩 덧씌운다. */
  :root[data-theme="dark"] .allchip.on{background:var(--acc2)}
  :root[data-theme="dark"] .chip{border-color:var(--line)}
  :root[data-theme="dark"] .chip.warn{background:var(--panel);border-color:#991b1b;color:#f87171}
  :root[data-theme="dark"] .srcsep{background:var(--line)}
  :root[data-theme="dark"] .note{border-color:#854d0e}
  :root[data-theme="dark"] .werr{background:var(--panel);border-color:#991b1b;color:var(--ink)}
  :root[data-theme="dark"] .fld input,:root[data-theme="dark"] .fld select{border-color:var(--line);background:var(--panel);color:var(--ink)}
  :root[data-theme="dark"] .issued{color:var(--ok)}
  :root[data-theme="dark"] .linklike{color:#60a5fa}
  :root[data-theme="dark"] .dchip{background:rgba(37,99,235,.18);color:#60a5fa}
  :root[data-theme="dark"] .dchip.law{background:rgba(217,119,6,.18);color:var(--warn)}
  :root[data-theme="dark"] .dash{color:var(--faint)}
  /* 오늘 칸은 «칠하지 않는다» — 낮은판의 옅은 노랑칠(#fffbeb)은 어두운판에서 글자가
     안 읽힌다. 대신 칸 테두리를 살짝 파랗게 둘러 「오늘」을 표한다(파랑 원은 그대로). */
  /* 오늘은 구글처럼 숫자 동그라미만 — 칸 테두리를 두르지 않는다(2026-09-28). 동그라미가 옅은 하늘색이라
     숫자는 짙은 색으로(흰 숫자는 안 읽힌다) */
  :root[data-theme="dark"] .dnum.today{color:#131314}

  /* ── 폰 달력 — 구글 캘린더 위젯 꼴 (body.mob · 폰머리Html 머리글 참고) ── */
  .mhead{display:none}
  body.mob #topbar{display:none}
  body.mob.mobmenu #topbar{display:flex;overflow-x:auto}
  body.mob #app.fit{padding:0;background:var(--panel)}

  body.mob .mmenu{border:none;background:transparent;color:var(--gsub);font-size:16px;width:30px;height:40px;cursor:pointer}
  body.mob .cal{border:none;border-radius:0}
  body.mob .mhd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:none;border-bottom:1px solid var(--gline)}
  body.mob .mhd div{text-align:center;font-size:14px;font-weight:500;color:var(--gtext);padding:4px 0;
    border-right:1px solid var(--gline)}
  body.mob .mhd div:last-child{border-right:none}
  body.mob .day{padding:3px 2px 1px}
  body.mob .dline{margin-bottom:2px}
  body.mob .dnum{min-width:20px;height:20px;font-size:11.5px;padding:0 3px;font-weight:400}
  body.mob .lun{font-size:11px}
  body.mob .ev{font-size:11px;line-height:16px;padding:1px 3px;border-radius:3px;font-weight:500;text-overflow:clip}
  body.mob .evph{height:18px}
  body.mob .evs{gap:2px}
  body.mob .more{font-size:13px;letter-spacing:1px;padding:0 4px;line-height:14px;color:var(--gsub)}
  /* 오늘은 숫자 동그라미와 음력 글자만 파랗게 — 칸 테두리는 안 두른다(위젯과 같게) */
  /* ⚠ 어두운판의 :root[data-theme=dark] .day.today 테두리보다 «세게» 써야 이긴다 */
  html body.mob .cal .day.today{outline:none}
  body.mob .day.today .lun{color:var(--gtoday)}
  /* ── 폰 ㉮ — 칸은 «막대»만, 읽는 것은 아래 «그날 목록»에서 (대표 지시 2026-09-27
       「폰화면 ui도 구글처럼 사용이 같아야한다」) ──
     왜: 배포본을 폰 크기(375×812)로 재 보니 날짜 칸이 53px, 칩이 49px 이라
       한 칩에 «다섯~일곱 글자»만 보였다 — 9월 칩 91개 가운데 86개(95%)가 잘려 있었다.
       「1730 김현숙 산재 뇌출혈 -산재 상담 (권, 혜민)」이 화면에는 「1730 김」이었다.
     그래서 칸은 «얼마나 있는지·누구 것인지»만 색으로 알리고, 제목은 아래에서 읽는다.
   ⚠ 넓은 화면(PC)은 그대로다 — 거기서는 칸이 넓어 글자 칩이 낫다. */
  body.mob .mhead{flex:none}
  /* ⚠ #app.fit .cal 이 아이디라 더 세다 — 그것을 이기려면 여기도 #app.fit 을 짚어야 한다.
     안 짚으면 달력이 flex:1 로 남아 목록이 화면의 3분의 2를 먹는다(2026-09-27 실제로 그랬다). */
  body.mob #app.fit .cal{flex:3 1 0;min-height:180px}
  body.mob .ev{font-size:0;line-height:0;height:5px;padding:0;border-radius:3px;overflow:hidden}
  body.mob .ev > *{display:none}
  body.mob .evph{height:5px}
  body.mob .evs{gap:2px}
  body.mob .more{font-size:9px;line-height:7px;letter-spacing:0;padding:0;text-align:center}
  /* 고른 날 — 구글처럼 옅은 칠 한 겹(테두리를 두르면 칸이 들쭉날쭉해 보인다) */
  html body.mob .cal .day.pick{background:var(--acc-soft) !important}
  /* 그날 목록 — 제목이 안 잘리는 크기(12.5px)로 */
  body.mob .mlist{flex:2 1 0;min-height:110px;overflow-y:auto;border-top:8px solid var(--bg);
    padding:9px 12px 16px;background:var(--panel)}
  body.mob .mlday{font-size:12.5px;font-weight:700;color:var(--gtext);margin-bottom:6px}
  body.mob .mlday .n{font-weight:400;color:var(--gsub);margin-left:5px}
  body.mob .mrow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;
    border-bottom:1px solid var(--gline);cursor:pointer}
  body.mob .mrow:last-child{border-bottom:none}
  body.mob .mrow .bd{width:3px;border-radius:2px;flex:none;align-self:stretch;min-height:26px}

/* ── 구글 로그인 (지우기용) ──────────────────────────────────────────────
   캘린더 한 곳으로 모으기 3걸음-나. 「옮긴다」(대표 지시 2026-09-20).

   ★ 읽기와 쓰기는 «다른 자격»이다
     달력을 «읽는» 것은 열쇠 하나로 되고 로그인이 필요 없다. 그런데 이어진 구글
     일정을 «지우려면» 그 사람 자격이 있어야 한다 — 그래서 로그인이 따로 필요하다.
   ★ 그래서 단추는 «필요할 때만» 뜬다 — 이어진 건이 화면에 있는데 아직 로그인을
     안 했을 때. 늘 띄우면 아무도 안 누르고 머리줄만 좁아진다.
   ⚠ 되돌아올 주소가 구글 콘솔에 «등록»돼 있어야 한다(pu-cal.html).
     등록 전에는 구글이 redirect_uri_mismatch 로 막는다 — 그때는 이알피에서
     로그인하고 오면 같은 창의 토큰을 그대로 쓴다. */
var GCAL_OAUTH_ID = "30712196914-1qc61a41ptmo6u7hbk71i70g00k3a8lk.apps.googleusercontent.com";
var GCAL_SCOPE    = "https://www.googleapis.com/auth/calendar.events";
/* 예전 길 — 한 시간짜리 표를 주소 꼬리로 받는다. 서버 «늘 연결» 이 아직 없을 때(배포 전)만 쓴다 */
function 옛구글로그인(){
  location.href = PuGcalAuth.signInUrl({
    clientId: GCAL_OAUTH_ID, scope: GCAL_SCOPE,
    fallbackRedirect: "https://nabaho.github.io/pureunall/pu-cal.html"

}
/* ★ 구글 «늘 연결» (대표 지시 2026-10-04 「항상 구글로 로그인되어 있어야 한다 그래야 혼란이 없다」)
   사람마다 처음 한 번만 연결하면 서버(functions/gcal-link.js)가 갱신 열쇠를 들고,
   화면이 열릴 때마다·끝나기 5분 전마다 한 시간짜리 표를 다시 받는다 — 새로 고쳐도·폰에서도 이어진다.
   상태: ""(아직 모름) · on · need(연결 안 됨 — 처음이거나 구글에서 끊김) · off(서버 기능 없음·배포 전) · err(고장)
   ⚠ off 에서는 아무것도 띄우지 않는다 — 배포 전 모든 직원에게 헛 창이 뜨면 안 된다.
   ⚠ need 이면서 why 가 inactive(퇴사·휴직)면 창을 안 띄운다 — 연결해도 서버가 거절한다. */
var GLINK = { st:"", email:"", why:"", err:"", closed:false, busy:false };
function 구글로그인(){
  var u = null;
  try{ u = firebase.auth().currentUser; }catch(_){}
  if(!u || !PuGcalAuth.linkStart){ 옛구글로그인(); return; }
  GLINK.busy = true; render();
  u.getIdToken().then(function(t){ return PuGcalAuth.linkStart(t); })["catch"](function(e){
    GLINK.busy = false;
    var 말 = (e && e.message) || String(e);
    /* 서버 기능이 아직 없으면 예전 길로라도 — 한 시간은 쓸 수 있다 */
    if(/준비되지 않았/.test(말)){ 옛구글로그인(); return; }
    toast("⚠ " + 말); render();
  });
}
function 구글상태받기(r){
  if(!r) return;
  if(r.ok){ GLINK.st = "on"; GLINK.email = r.email || GLINK.email; GLINK.err = ""; GLINK.why = ""; }
  else if(r.need){ GLINK.st = "need"; GLINK.why = r.why || ""; GLINK.email = ""; }
  else if(r.off){ GLINK.st = "off"; }
  /* 다시 받다 실패해도 손에 쥔 표가 살아 있으면 «연결됨» 그대로 — 다음 번에 또 받는다 */
  else if(r.err){ if(!PuGcalAuth.hasToken()){ GLINK.st = "err"; GLINK.err = r.err; } }
  render();
}
function 구글이어가기(user){
  if(typeof PuGcalAuth === "undefined" || !PuGcalAuth.fromServer) return;
  var 증표 = function(){ return user.getIdToken(); };
  var 받기 = function(){ return 증표().then(function(t){ return PuGcalAuth.fromServer(t); }); };
  var 돌아옴 = PuGcalAuth.captureCode();
  var 처음;
  if(돌아옴 && 돌아옴.error){
    toast("구글 연결을 하지 않았습니다 — 맨 위 「구글 연결 안 됨」을 누르면 언제든 다시 할 수 있습니다");
    처음 = 받기();
  } else if(돌아옴){
    처음 = 증표().then(function(t){ return PuGcalAuth.linkFinish(t, 돌아옴.code, 돌아옴.state); })
      .then(function(r){ if(r && r.ok) toast("✅ 구글 캘린더와 연결됐습니다 — 이제 늘 이어져 있습니다"); return r; },
            function(e){ toast("⚠ " + ((e && e.message) || e)); return 받기(); });
  } else 처음 = 받기();
  처음.then(function(r){
    구글상태받기(r);
    PuGcalAuth.keepAlive(증표, 구글상태받기);
    /* 표가 생겼으니 구글 쪽 일을 다시 그린다(🔐 자물쇠가 사라진다) */
  }, function(e){ 구글상태받기({ err:(e && e.message) || String(e) }); });
}
function 구글끊기(){
  if(!confirm("구글 캘린더 연결을 끊을까요?\n끊으면 일정 옮기기·참석자 보기가 멈추고, 다시 연결해야 합니다.")) return;
  var u = null; try{ u = firebase.auth().currentUser; }catch(_){}
  if(!u) return;
  u.getIdToken().then(function(t){ return PuGcalAuth.unlink(t); }).then(function(){
    GLINK.st = "need"; GLINK.why = "none"; GLINK.email = ""; GLINK.closed = true;
    toast("구글 연결을 끊었습니다"); render();
  }, function(e){ toast("⚠ " + ((e && e.message) || e)); });
}
/* 머리줄 표시 — 연결됨(초록) · 안 됨/고장(빨강, 누르면 연결·다시) · 꺼짐이면 아무것도 */

/* ── 비고(개인 요구사항) 고치기 ──────────────────────────────────────────
   캘린더 한 곳으로 모으기 2걸음(다). 이알피로 보내던 마지막 자리다.

   ⚠ 담기는 자리가 둘이다 — 이알피가 그렇게 담아 온 것을 그대로 따른다.
     · 외부 인원: external_staff 레코드의 note 칸 → «레코드 표»라 칸별 저장 문(save)
     · 내부 직원: data/ieum_notes 의 { 사번: 글 } → 한 덩이 지도라 saveNotes
     옮겨서 한 자리로 합치고 싶어도 지금 하지 않는다 — 옮기다 옛 글을 잃는다.
   ⚠ 관리자만이 아니다. 서버 규칙이 «로그인한 직원 누구나»로 열려 있고,
     이알피도 「전 직원 수정 가능」이 확정 사양이었다. 같게 둔다. */
function openNote(pk){
  var p = ieumPeople().filter(function(x){ return x.pk === pk; })[0];
  if(!p) return;
  S.note = { pk:pk, kind:p.kind, name:p.name, text:p.note || "", busy:false, err:"" };
  render();
}
function closeNote(){ S.note = null; render(); }
function noteHtml(){
  var m = S.note; if(!m) return "";
  return '<div class="veil" data-close="1"></div><div class="modal" style="max-width:420px">'
    + '<h3>📝 비고 — ' + esc(m.name) + '</h3>'
    + '<div class="mmnote">그 사람에게만 해당하는 요구사항을 적습니다. '
    +   '예: 「2·4주 금요일만」·「오전만」. 달력 칩을 손대면 뜨는 설명에도 같이 보입니다.</div>'
    + (m.err ? '<div class="werr">' + esc(m.err) + '</div>' : '')
    + '<div class="fld"><textarea data-note="1" rows="3" placeholder="안 적어도 됩니다"'
    +   (m.busy ? ' disabled' : '') + '>' + esc(m.text) + '</textarea></div>'
    + '<div class="mbtns"><span class="sp"></span>'
    + '<button class="btn ghost" data-close="1">그만</button>'
    + '<button class="btn" data-noteact="save"' + (m.busy ? ' disabled' : '') + '>'
    +   (m.busy ? '저장 중…' : '저장') + '</button></div></div>';
}
function saveNote(){
  var m = S.note; if(!m || m.busy) return;
  var el = document.querySelector('[data-note]');
  var 글 = el ? String(el.value || "").trim() : m.text;
  m.busy = true; m.err = ""; render();
  var 끝 = function(r){
    m.busy = false;
    if(r && r.ok){
      closeNote(); toast("✅ 비고를 적었습니다");
      refreshOne(m.kind === "in" ? "ieum_notes" : "external_staff");
    } else {
      m.err = (r && r.message) || "저장하지 못했습니다"; render();
    }
  };
  if(m.kind === "in"){
    var 다음 = Object.assign({}, (D.ieum_notes && typeof D.ieum_notes === "object") ? D.ieum_notes : {});
    if(글) 다음[m.pk] = 글; else delete 다음[m.pk];
    PuCalWrite.saveNotes(다음).then(function(r){ if(r && r.ok) D.ieum_notes = 다음; 끝(r); })
      ["catch"](function(e){ 끝({ ok:false, message:(e && e.message) || String(e) }); });
  } else {
    var x = arr(D.external_staff).filter(function(e){ return e && e.id === m.pk; })[0];
    PuCalWrite.save("external_staff", { id:m.pk, note:글 }, x).then(function(r){
      if(r && r.ok && x) x.note = 글;
      끝(r);
    })["catch"](function(e){ 끝({ ok:false, message:(e && e.message) || String(e) }); });
  }
}

/* ── 외부 공유 뷰 «발행» ────────────────────────────────────────────────
   캘린더 한 곳으로 모으기 2걸음.

   ★ 여기서 고친 진짜 고장
     공개 일정(ieum_public)을 만드는 일이 이알피에만 걸려 있었다. 그런데 이음 근무를
     «푸른 캘린더에서도» 고치게 되면서(1걸음), 캘린더에서 고친 것은 공개 뷰에 안
     따라갔다 — 외부 변호사가 받은 링크에 옛 일정이 그대로 떠 있었다.
     이알피 이음센터 화면을 열어야만 다시 발행됐기 때문이다.

   ★ 만드는 셈은 js/pu-ieum-public.js «한 곳»이다 — 이알피도 그 파일을 부른다.
     여기서 다시 셈하지 말 것(두 벌이 되면 두 화면의 공개 일정이 갈린다).
   ⚠ 발행은 «덮어쓰기»다. 원본은 근태라 언제든 다시 만들 수 있다. */
function 발행자료(){
  return {
    attendance: arr(D.attendance_records),
    users: allUsers(),
    externals: arr(D.external_staff),
    year: new Date().getFullYear()
  };
}
function 발행하기(조용히){
  if(typeof PuIeumPublic === "undefined" || !fbDb) return;
  if(!조용히){ S.pub = { busy:true, msg:"" }; render(); }
  return PuIeumPublic.publish(fbDb, 발행자료()).then(function(만든것){
    var 날수 = Object.keys(만든것.roster || {}).length;
    S.pub = { busy:false, msg:"✅ 발행했습니다 — " + 날수 + "일치", at:Date.now() };
    if(!조용히) render();
  })["catch"](function(e){
    S.pub = { busy:false, msg:"발행하지 못했습니다: " + ((e && e.message) || e) };
    if(!조용히) render();
  });
}
/* 일정을 고치면 «저절로» 발행한다 — 이알피와 같은 요령(3초 모아서 한 번).
   ⚠ 고칠 때마다 바로 올리면 끌어놓기로 여러 건을 잇따라 고칠 때 그만큼 올라간다. */
var _발행타이머 = null;
function 발행예약(){
  if(typeof PuIeumPublic === "undefined" || !fbDb) return;
  clearTimeout(_발행타이머);
  _발행타이머 = setTimeout(function(){ 발행하기(true); }, 3000);
}
function 발행시각Html(){
  var at = (S.pub && S.pub.at) || 0;

  var d = new Date(at);
  return '<span class="pubat">마지막 발행 ' + String(d.getHours()).padStart(2,"0")
    + ":" + String(d.getMinutes()).padStart(2,"0") + '</span>';

/* ── 개인 공유 링크 발급·재발급 ──────────────────────────────────────────
   ⚠ 재발급하면 «지금 링크가 그때부터 안 열린다». 되돌릴 수 없으니 한 번 묻는다.
   ⚠ 외부 인원 표(external_staff)는 지도형이라 칸별 저장 문을 그대로 쓴다 —
     그 사람의 shareKey 칸 하나만 고친다(다른 칸·다른 사람을 안 건드린다). */
function 링크발급(extId){
  if(!잇기할수있나()) return;

    }
  })["catch"](function(e){ toast("발급하지 못했습니다: " + ((e && e.message) || e)); });

/* 실시간DB 열쇠에는 점(.)을 못 쓴다 — 이메일에는 점이 있어 쉼표로 바꿔 담는다.
   ⚠ 이알피와 «같은 셈»이어야 한다. 다르면 이어 둔 사람이 안 찾아진다. */
function gcalMailKey(m){ return String(m || "").trim().toLowerCase().replace(/[.#$\[\]\/]/g, ","); }
function gcalMailMap(){
  var v = D.gcal_mail_sid;
  return (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
}
/* 만든이 메일 → 직원 사번.
   ★ 사람이 «한 번 이어 준 것»이 가장 확실하다 — 명부 대조보다 먼저 본다.
     명부에는 gmail 이 없어(로그인아이디는 사번@… 꼴) 이 표가 없으면 맞출 길이 없다. */
function gcalSidByMail(mail){
  var k = gcalMailKey(mail);
  if(!k) return "";
  var mp = gcalMailMap();
  if(mp[k]) return mp[k];
  var us = users();
  for(var i = 0; i < us.length; i++){
    var u = us[i] || {};
    var cands = [u.loginId, u.email, u.gmail, u.googleEmail];
    for(var j = 0; j < cands.length; j++){
      if(cands[j] && gcalMailKey(cands[j]) === k) return u.sid;
    }
  }
  return "";
}
/* 이어 준 사람이 없을 때 — 메일로 «늘 같은» 색 하나를 고른다 */
function gcalMailColor(mail){
  var k = gcalMailKey(mail);
  if(!k) return "";
  var uniq = gcalPalette() || ["#2563eb","#16a34a","#dc2626","#d97706","#64748b","#1e40af"];
  var h = 0;
  for(var i = 0; i < k.length; i++){ h = (h * 131 + k.charCodeAt(i)) >>> 0; }
  return uniq[h % uniq.length];
}

/* ── 🗄 구글 일정 보관함 (data/gcal_archive) ─────────────────────────────
   대표 지시 2026-09-27 「푸른캘린더에서 별도로 보관」 → 추천대로(지운 일정은 평소 숨김 + 스위치).
   ★ 서버(gcalArchiveDaily)가 매일 새벽 3시 구글 공용 달력을 여기로 베낀다. 누가 구글에서 지워도
     보관함에는 남는다(googleDeleted 표). 2017년부터 10,585건.
   ★ 화면은 «보는 달»만 받는다(date 색인) — 보관함 통째(약 7MB)를 받지 않는다.
   ★ 쓰는 때 둘:  ① 「🗄 지운 일정」 스위치를 켰을 때 — 지워진 것을 점선·취소선으로
                  ② 구글에서 못 받았을 때 — 보관본으로 달력을 채운다(빈 달력은 거짓말이다) */
var ARCH = { key:"", list:[], loading:false };
function 보관받기(){
  if(!fbDb) return;
  var 칸 = monthGrid(S.ym);
  var 첫날 = 칸[0].date, 끝날 = 칸[칸.length-1].date;
  var 키 = 첫날 + "~" + 끝날;
  if(ARCH.key === 키 || ARCH.loading) return;
  ARCH.loading = true;
  fbDb.ref("data/gcal_archive").orderByChild("date").startAt(첫날).endAt(끝날).once("value").then(function(snap){
    var v = snap.val() || {};
    ARCH.list = Object.keys(v).map(function(k){ return v[k]; }).filter(function(r){ return r && r.date; });
    ARCH.key = 키; ARCH.loading = false; render();
  })["catch"](function(e){ ARCH.loading = false; console.warn("[보관함] 못 읽음", e && e.message); });
}
/* 보관함 한 건 → 칩. 지워진 것은 kind:"gone"(점선·취소선, 못 옮긴다) */
function 보관칩(r, 지워짐){
  var sid = gcalSidByMail(r.creator || "");
  return { kind: 지워짐 ? "gone" : "gcal", store:"", id:"arch:" + r.id, sid: sid || "GCAL",
    date:r.date, end:r.end || r.date, time: r.allDay ? "" : (제목시각(r.summary, r.time) || r.time || ""), endTime:r.endTime || "",
    text: r.summary || "(제목 없음)", movable:false,
    color: (sid ? colorOf(sid) : "") || gcalMailColor(r.creator || "") || "#94a3b8",
    tip: (지워짐 ? "🗄 구글에서 지워진 일정 (보관함)" + (r.googleDeletedSeenAt ? " · " + new Date(r.googleDeletedSeenAt).toISOString().slice(0,10) + " 무렵" : "") + "\n" : "🗄 보관본 (구글을 못 받아 보관함에서 보여 줍니다)\n")
      + (r.summary || "") + (r.location ? "\n📍 " + r.location : "") + (r.creator ? "\n✉ " + r.creator : "") };
}

/* 그 달(앞뒤 걸친 42칸)의 구글 일정을 받아 둔다.
   ⚠ 달이 바뀔 때만 받는다 — 다시 그릴 때마다 받으면 요금과 깜빡임이 는다. */
function gcalLoad(force){
  var 칸 = monthGrid(S.ym);
  var 첫날 = 칸[0].date, 끝날 = shiftDay(칸[칸.length-1].date, 1);
  var 키 = 첫날 + "~" + 끝날;
  if(!force && GCAL.ym === 키) return Promise.resolve();
  GCAL.ym = 키; GCAL.loading = true; GCAL.err = "";
  var url = "https://www.googleapis.com/calendar/v3/calendars/"
    + encodeURIComponent(GCAL_CAL_ID) + "/events?key=" + GCAL_API_KEY
    + "&timeMin=" + encodeURIComponent(첫날 + "T00:00:00+09:00")
    + "&timeMax=" + encodeURIComponent(끝날 + "T00:00:00+09:00")
    + "&singleEvents=true&orderBy=startTime&maxResults=500";
  return gcalLoadColors()
    .then(function(){ return fetch(url); })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.error){ throw new Error(d.error.message || "구글 달력 오류"); }
      GCAL.evs = (d.items || [])
        .filter(function(ev){ return ev.start && (ev.start.date || ev.start.dateTime); })
        .map(gcalToEvent);
      GCAL.loading = false; render();
      /* 색표가 이제 손에 있다 — 색이 없는 직원이 있으면 이때 채운다(1걸음).
         ⚠ 그리기가 끝난 «뒤»다. 색 채우다 실패해도 달력은 이미 떠 있다. */
      색채우기();
    })
    .catch(function(e){
      /* ⚠ 못 받았으면 «조용히» 비우지 않는다 — 빈 달력은 「일정이 없다」는 거짓말이다.
         보관함에서 그 달 것을 받아 대신 보여 준다(🗄 보관본이라고 말풍선에 적는다). */
      GCAL.loading = false; GCAL.err = (e && e.message) || String(e); render();
      보관받기();
    });
}

/* 구글 일정 한 건 → 우리 칩.
   ★ 색 고르는 차례 — 앞이 있으면 뒤로 안 넘어간다(이알피와 같다):
     ①구글에서 그 일정에 «고른» 색  ②만든이가 이어져 있으면 그 직원 색
     ③제목에 현직 이름이 있으면 그 직원 색  ④만든이 메일로 늘 같은 색  ⑤기본 */
/* ★ 제목에 적은 시각을 믿는 때 (대표 결정 2026-10-04 「추천대로」 — ㉮)
   왜: 직원들은 시각을 «제목 앞에» 적는다(「0930 가나상사 방문」). 구글 시각 칸은 아무렇게나 둔다.
     2026년 9월 공용 달력을 재 보니 시각 일정 41건 중 36건이 «새벽 0~5시»에 들어 있었고,
     제목 앞 시각과 구글 시각이 맞는 것은 0건이었다. 그래서 목록에 「00:30 · 0930 …」이 떴다.
   언제만: 구글 시각이 새벽(00:00~05:59) «이고» 제목이 네 자리 시각(0930·09:30)으로 시작할 때만.
     ⚠ 둘 중 하나라도 아니면 구글 시각 그대로다 — 낮 시각은 사람이 일부러 넣은 것이다.
     ⚠ 구글 원본은 안 고친다(보이는 것만). 옮기기(moveEvent)는 구글 시각을 그대로 지킨다.
   돌려주는 것: 「HH:MM」 또는 ""(믿을 것 없음) */
function 제목시각(title, 구글시각){
  var g = /^([01]\d|2[0-3]):[0-5]\d$/.exec(String(구글시각 || ""));
  if(!g || +g[1] > 5) return "";
  /* ⚠ 뒤에 「년 . /」나 「-10」(줄표 + 한두 자리)이 오면 연도·날짜다
       (「2026년 계획」「2026-10 점검」을 20:26 으로 읽으면 안 된다).
     ⚠ 「1300-1600」(줄표 + 네 자리)은 시각 범위다 — 실제 제목에 흔하다(10월에만 8건).
     띄어쓰기는 안 따진다 — 「1000가나…」처럼 붙여 쓴 것이 많다. */
  var m = /^\s*([01]\d|2[0-3]):?([0-5]\d)(?![\d년.\/]|-\d{1,2}(?!\d))/.exec(String(title || ""));
  return m ? m[1] + ":" + m[2] : "";
}
function gcalToEvent(ev){
  var date = (ev.start.date || ev.start.dateTime || "").slice(0,10);

  var 구글시각 = timeStr;
  var title = (ev.summary || "").trim()
    || (ev.description || "").replace(/<[^>]+>/g, "").slice(0,20).trim();
  if(!title && timeStr) title = timeStr + " 일정";
  if(!title) title = "일정";
  var gColor = (window._gcalColors && ev.colorId) ? (window._gcalColors[String(ev.colorId)] || "") : "";
  var mail = (ev.creator && ev.creator.email) || (ev.organizer && ev.organizer.email) || "";
  var mailSid = gcalSidByMail(mail);
  var color = gColor || (mailSid ? (colorOf(mailSid) || "") : "")
    || gcalMailColor(mail) || (ev.summary ? "#2563eb" : "#94a3b8");
  var sid = mailSid || "GCAL";
  var us = users();
  for(var ui = 0; ui < us.length; ui++){
    var u = us[ui];
    if(u.name && title.indexOf(u.name) >= 0){
      /* ⚠ 구글 색이 있으면 «그것이 이긴다» — 앱 색으로 덮으면 구글 화면과 달라진다.
         ⚠ 만든이가 이미 찾아졌으면 그것이 더 확실하다 — 제목의 이름은 「권형하에게
           보고」처럼 «남의 이름»일 수도 있다. */
      if(!gColor && !mailSid) color = colorOf(u.sid) || color;
      if(!mailSid) sid = u.sid;
      break;
    }
  }
  /* 끝날 — 구글처럼 여러 날 일정을 «한 줄 막대»로 잇는 데 쓴다(대표 지시 2026-09-27).
     ⚠ 종일 일정의 end.date 는 «다음 날»이다(끝 안 듦) — 하루 당겨야 마지막 날이 된다.
     ⚠ 시각 일정이 자정에 끝나면(…T00:00) 그 날은 안 든다 — 이것도 하루 당긴다. */
  var 끝 = date;
  if(ev.end && ev.end.date) 끝 = shiftDay(String(ev.end.date).slice(0,10), -1);
  else if(ev.end && ev.end.dateTime){
    끝 = String(ev.end.dateTime).slice(0,10);
    if(String(ev.end.dateTime).slice(11,16) === "00:00" && 끝 > date) 끝 = shiftDay(끝, -1);
  }
  if(!끝 || 끝 < date) 끝 = date;
  var 끝시각 = (ev.end && ev.end.dateTime) ? Date.parse(ev.end.dateTime) : 0;
  /* 제목 시각을 믿으면 «끝»도 같은 길이만큼 옮긴다 — 안 옮기면 새벽에 끝난 것으로 쳐서
     아침 6시에 벌써 «지난 일정»(옅은 색)이 된다 */
  var 제목에서 = ev.start.dateTime ? 제목시각(title, timeStr) : "";

  return { kind:"gcal", store:"gcal", id:ev.id, sid:sid, date:date, end:끝,
    endAt: 끝시각 > 0 ? 끝시각 : 0,
    /* 시각은 구글 화면처럼 「10:30」 — 제목에 사람이 적은 「1030」과 갈려 보여야 한다 */
    text:title, time: ev.start.dateTime ? timeStr : "",

    place: ev.location || "",
    desc: String(ev.description || "").replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, "").trim(),
    /* 언제 넣고 언제 고쳤나 — 열쇠로 읽어도 구글이 준다(2026-10-04 상세 창 🕒) */
    created: ev.created || "", updated: ev.updated || "",
    tip: title + (ev.location ? "\n📍 " + ev.location : "")
         /* 설명 앞 두 줄(담당자 등 — 이 앱이 넣은 미팅이면 「담당자: …」가 첫 줄이다) */
         + (ev.description ? "\n" + String(ev.description).replace(/<[^>]+>/g, "").split("\n").slice(0, 2).join("\n") : "")
         + (mail ? "\n✉ " + mail : "") };

/* 거르개 — 이알피와 같은 뜻으로 가른다.
     null      = 전체
     'pureun'  = 푸른 직원 것만 (구글·외부인 제외)
     'gcal'    = 구글 달력에서 온 것만
     'eumwork' = 이음센터 근무만
     사번      = 그 사람 것만 */
function passFilter(ev){
  var f = S.filter;
  if(!f) return true;
  if(f === 'pureun')  return ev.kind !== 'gcal' && !ev.externalId;
  if(f === 'gcal')    return ev.kind === 'gcal';
  if(f === 'eumwork') return ev.kind === 'eum';
  /* 🔒 개인 · 👥 공용 (대표 지시 2026-09-27 「폰에서도 개인과 공용으로 나눠달라」) */
  if(f === 'priv')    return ev.kind === 'priv' || ev.onlyMe === true;
  if(f === 'shared')  return ev.kind !== 'priv' && ev.onlyMe !== true;
  return ev.sid === f;
}

/* ── 달력 그리기 ───────────────────────────────────────────────────── */
/* ── 달력 — 이알피(법인 대시보드)와 «같은 꼴» ─────────────────────────
   대표 지시 2026-09-18 「대시보드 제외한 화면은 똑같이 만들어라」.
   그래서 여기서 정하는 것은 우리 취향이 아니라 «이알피가 하던 그대로»다:
     · 날짜 옆 괄호는 음력 날짜 — 구글 달력 위젯이 「25 (13)」로 붙여 주는 그 숫자
     · 오늘은 숫자에만 파란 동그라미(음력까지 감싸면 알약처럼 길어진다)
     · 공휴일은 칸 맨 위에 «칩»으로 (오른쪽 위 작은 글씨가 아니다)
     · 한 칸에 넷까지 보이고 나머지는 접는다 — 셋이면 더보기가 너무 자주 뜬다
     · 시각은 「1030」처럼 콜론 없이 붙여 쓴다 — 좁은 칸에서 제목이 두 글자쯤 더 보인다
     · 여섯 줄 고정(6×7) — 달마다 표 높이가 들썩이지 않게
   ⚠ 값을 바꾸고 싶으면 이알피부터 보라. 두 화면이 갈리는 것이 여기서 가장 나쁘다. */

/* 음력 — 표를 손으로 들고 있지 않는다. 브라우저에 든 단기(檀紀)력을 쓴다.
   ⚠ 42칸을 다시 그릴 때마다 새로 세면 느리다 — 한 번 센 것은 적어 둔다. */
var _lunar = {};
function lunarDay(ymd){
  if(!ymd) return "";
  if(_lunar[ymd] !== undefined) return _lunar[ymd];
  var out = "";
  try{
    out = new Intl.DateTimeFormat("ko-KR-u-ca-dangi", {day:"numeric", timeZone:"UTC"})
            .format(new Date(ymd + "T00:00:00Z")).replace(/[^0-9]/g, "");
  }catch(e){ out = ""; }
  _lunar[ymd] = out;
  return out;
}
/* 머리글의 「병오년8월 – 9월」 — 그 달 첫날·끝날의 음력 달.
   ⚠ 간지(병오)는 era:"long" 을 켜야 나온다. year:"numeric" 만 주면 2026 만 온다. */
function lunarRange(ym){
  try{
    var y = +String(ym).slice(0,4), m = +String(ym).slice(5,7);
    if(!y || !m) return "";
    var a = new Date(Date.UTC(y, m-1, 1)), b = new Date(Date.UTC(y, m, 0));
    var fm = new Intl.DateTimeFormat("ko-KR-u-ca-dangi", {era:"long", year:"numeric", month:"numeric", timeZone:"UTC"});
    function pick(d, t){ var ps = fm.formatToParts(d); for(var i=0;i<ps.length;i++) if(ps[i].type===t) return ps[i].value; return ""; }
    /* ⚠ 브라우저마다 꼴이 다르다 (2026-09-27 대표 폰 캡처 「년M07 – M08」).
         컴퓨터 크롬: 간지 「병오」 · 달 「8월」 / 폰 크롬(안드로이드): 간지 없음 · 달 「M07」(윤달 「M07L」).
       그래서 «숫자만» 꺼내 우리 꼴(「7월」·「윤7월」)로 다시 쓰고, 간지가 없으면 우리가 셈한다. */
    function 달글(v){
      v = String(v || "");
      var n = parseInt(v.replace(/[^0-9]/g, ""), 10);
      if(!n) return "";
      return (/L|윤/.test(v) ? "윤" : "") + n + "월";
    }
    var yn = pick(a,"yearName"), m1 = 달글(pick(a,"month")), m2 = 달글(pick(b,"month"));
    if(!m1) return "";
    if(!yn || /[0-9]/.test(yn)){
      /* 간지 셈 — 그 음력 해(relatedYear, 없으면 양력 해에서 음력 달이 더 크면 한 해 앞) */
      var ry = parseInt(pick(a,"relatedYear"), 10);
      if(!ry){ ry = y; if(parseInt(m1, 10) > m) ry = y - 1; }
      var 천간 = "갑을병정무기경신임계", 지지 = "자축인묘진사오미신유술해";
      yn = 천간.charAt(((ry - 4) % 10 + 10) % 10) + 지지.charAt(((ry - 4) % 12 + 12) % 12);
    }
    return yn + "년" + m1 + (m2 && m2 !== m1 ? " – " + m2 : "");
  }catch(e){ return ""; }
}

/* WCAG 상대밝기 — «글자가 읽히는가»를 재는 데 쓴다.
   ⚠ 사람 눈 어림(0.299/0.587/0.114)과 다르다. 그 어림으로 흰/검을 고르면
     초록(#51b749) 위에 짙은 글자가 붙어 2.55:1 까지 떨어진다 — 안 읽힌다.
     이알피 calTextOn 이 아직 그 셈이다(거기도 같은 구멍 — 따로 고칠 일). */
function 상대밝기(bg){
  var hex = String(bg || "").replace("#", "");
  if(hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  if(hex.length !== 6) return 1;
  var c = [0,2,4].map(function(i){
    var v = parseInt(hex.slice(i,i+2),16) / 255;
    return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  });
  return 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
}
function 대비(a, b){
  var x = 상대밝기(a), y = 상대밝기(b);
  return (Math.max(x,y) + 0.05) / (Math.min(x,y) + 0.05);
}
/* 바탕색 위에 어떤 글자색이 읽히나 — 흰·검 둘을 «실제로 재서» 나은 쪽을 고른다.
   ⚠ 고르는 두 색은 흰과 검뿐이다(팔레트 규율 — tests/color-palette-apps.test.js).
     실측 최악: 밝은판 4.76:1 · 어두운판 4.59:1(사람 색 22 + 붙박이 색 5). */
function textOn(bg){
  return 대비(bg, "#ffffff") >= 대비(bg, "#000000") ? "#ffffff" : "#000000";
}
/* 색 둘을 섞는다(t=0 이면 원색 그대로, t=1 이면 완전히 두번째 색) —
   일정 칩의 «옅은 바탕»을 만드는 데 쓴다. 사람 색 값 자체는 안 바꾼다(colorOf 그대로),
   여기서는 «그리는 방법»만 바꾼다. */
function mixHex(hexA, hexB, t){
  function rgb(h){
    h = String(h || "").replace("#", "");
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    if(h.length !== 6) h = "64748b";
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }
  var a = rgb(hexA), b = rgb(hexB), out = [0,1,2].map(function(i){
    return Math.round(Math.max(0, Math.min(255, a[i] + (b[i]-a[i]) * t)));
  });
  return "#" + out.map(function(v){ return v.toString(16).padStart(2,"0"); }).join("");
}

/* 여섯 줄 고정 격자 — 이알피 buildMonthGrid 와 같다 */
function monthGrid(ym){
  var year = parseInt(ym.slice(0,4),10), month = parseInt(ym.slice(5,7),10) - 1;
  var first = new Date(year, month, 1), startDay = first.getDay();
  var lastDate = new Date(year, month+1, 0).getDate();
  var prevLast = new Date(year, month, 0).getDate();
  var grid = [], k;
  for(k = startDay-1; k >= 0; k--){
    var pd = prevLast - k, pm = new Date(year, month-1, 1);
    grid.push({ date: ymdOf(pm.getFullYear(), pm.getMonth()+1, pd), day:pd, other:true });
  }
  for(k = 1; k <= lastDate; k++) grid.push({ date: ymdOf(year, month+1, k), day:k, other:false });
  var n = 1;
  while(grid.length < 42){
    var nm = new Date(year, month+1, 1);
    grid.push({ date: ymdOf(nm.getFullYear(), nm.getMonth()+1, n), day:n, other:true }); n++;
  }
  return grid;
}
function ymdOf(y, m, d){
  return y + "-" + String(m).padStart(2,"0") + "-" + String(d).padStart(2,"0");
}

/* 일정 칩 하나 — 월·주·일 보기가 «같은 규칙»을 쓴다(보기를 바꿀 때 색이 튀지 않게).
   ═══════════════════════════════════════════════════════════════════════════
   ★ 다섯 판을 거쳤다. 되돌리기 전에 먼저 읽을 것.
     ① 원색 채우기 — 하루에 대여섯 줄이 늘어서면 원색 띠가 부딪혀 눈이 시렸다.
     ② 옅게 칠하고 왼쪽에 띠(85% 흰섞기) — 색 자체가 지워졌다.
     ③ 글자 자체를 그 사람 색으로 — 색이 어두운 구석으로 뭉쳤다.
     ④ 내 일정은 채우고 남의 일정은 옅게+왼쪽 띠.
     ⑤ 지금 — 대표 지시 2026-09-27 「캘린더 ui 와 화면을 구글캘린더 화면과 글자색·테두리·
       글자형태로 완벽하게 같이」. 구글 캘린더 월 보기를 재서 그대로 옮겼다:
   ★ 규칙 (tests/cal-google-look.test.js)
     ㉮ 종일 일정은 그 사람 색으로 «꽉» 채우고 글자는 흰색, 테두리·왼쪽 띠가 없다.
     ㉯ 시각이 있는 일정은 바탕 없이 «색 점 · 시각(10:30) · 제목» — 글자는 짙은 회색.
     ㉰ 지난 일정은 구글처럼 옅게 — 바탕(점)을 판 색 쪽으로 70% 옮기고 글자는 회색.
        70% 는 구글 화면의 같은 색 칩(지난 것·올 것)을 픽셀로 견주어 얻은 값이다.
     ㉱ 「내 일정」을 따로 칠하지 않는다 — 구글 화면에 그런 구별이 없다.
     ㉲ 칩 머리의 그림글자(🏛️·🏖️ …)는 칩에 안 그린다 — 구글 화면에 없다(말풍선엔 남는다).
   ⚠ 사람 색 «값»은 여기서 안 바꾼다(colorOf). 여기서는 «그리는 법»만 정한다.
   ⚠ 여러 날 막대는 줄배치가 e._span(몇 칸)·e._gap(칸 사이 틈)·e._cutL/_cutR(주 끝에서
     잘렸나)을 얹어 부른다 — 부르는 모양(chipHtml(e, ymd))은 안 바꾼다. */
function chipHtml(e, ymd){
  var 어둡나 = S.theme === "dark";
  /* 지난 일정 — 밝은판 70%, 어두운판 60% 판색 쪽으로(어두운판에서 70% 는 너무 묻혔다) */
  var 옅게 = 어둡나 ? .6 : .7;
  /* 앞으로의 일정 — 어두운판에서만 원색을 15% 눅인다(원색 그대로는 어두운 바탕에서 부시다, 2026-09-28) */
  var 눅임 = 어둡나 ? .15 : 0;
  var 사람색 = e.color || "#64748b";
  var 어둠 = S.theme === "dark";
  var 판 = 어둠 ? "#1b1b1d" : "#ffffff";
  /* 지났나 — 시각이 있으면 «끝난 시각»으로, 없으면 «마지막 날»로 (구글과 같다) */
  var 지남 = e.endAt ? (e.endAt < Date.now()) : ((e.end || ymd) < todayYMD());
  var 공휴 = e.kind === "hol";
  var 지운것 = e.kind === "gone";
  var 막대 = (e._span || 1) > 1 || (e.end && e.end > e.date);
  /* 폰은 구글 위젯처럼 시각 일정도 색을 꽉 채운다(점 꼴은 좁은 칸에서 안 보인다) */
  var 시각칩 = !!e.time && !막대 && !(typeof 폰 === "function" && 폰());
  /* 칩 머리의 그림글자는 걷는다 — 구글 화면에는 없다 */
  var 제목 = String(e.text || "").replace(/^(?:[☀-➿️‍]|[\uD83C-\uDBFF][\uDC00-\uDFFF])+\s*/, "");
  /* 🔒 나만 보기 — 내 화면에만 오는 것이지만, 나도 «이건 남이 못 본다»를 알아야 한다 */
  if(e.kind === "priv") 제목 = "🔒 " + 제목;
  /* ★ 끌어 옮길 수 있는 것과 아닌 것 (5걸음, 대표 지시 2026-09-21)
       옮길 수 있다 — 우리 일정·근태(sch·att·eum)와 구글 일정(gcal)
       옮길 수 없다 — 공휴일 · 사건 마감일 · 단계 기한 · 휴직
     ⚠ 사건 기한은 «계산된 값»이고 휴직은 인사관리가 주인이다. 달력에서 옮기면
       그 화면과 어긋난다 — 그래서 아예 못 잡게 한다(잡히면 사람은 된다고 믿는다).
     ⚠ 잠긴 달은 «여기서» 막지 않는다. 막는 자리는 저장 문(pu-cal-write) 하나여야
       두 곳이 어긋나지 않는다 — 놓은 뒤에 「잠긴 달입니다」라고 분명히 말한다. */
  var 옮길수있나 = !공휴 && (e.movable !== false) && !!e.store && !!e.id;
  /* 지난 일정의 글자 — 구글은 «검정 글자를 38% 만» 올린다(캡처 실측: 옅은 칩 #e5e1dd 위 글자 #9a9795,
     흰 바탕 위 #aaaaaa). 회색 한 가지(#70757a)로 칠하면 칩마다 글자가 떠 보여 흐릿했다.
     바탕에 녹여 셈하므로 칩 색이 달라도 늘 같은 «옅기»다. 어두운판은 전처럼 회색 글자. */
  function 지난글자(바탕){ return 어둡나 ? "var(--gsub)" : mixHex("#1f1f1f", 바탕, .62); }
  var 꼴, 안;
  if(시각칩){
    꼴 = "color:" + (지남 ? 지난글자(판) : "var(--gtext)");
    안 = '<i class="gdot" style="background:' + esc(지남 ? mixHex(사람색, 판, 옅게) : 사람색) + '"></i>'
      + '<span class="gtm">' + esc(e.time) + '</span>' + esc(제목);
  } else {
    var 칩바탕 = 지남 ? mixHex(사람색, 판, 옅게) : (눅임 ? mixHex(사람색, 판, 눅임) : 사람색);
    꼴 = "background:" + esc(칩바탕) + ";color:" + (지남 ? 지난글자(칩바탕) : "#ffffff");
    var n = e._span || 1;
    /* 막대 — 칸 n 개를 건너간다. 100% 는 한 칸의 속 너비, 칸 사이 틈(여백·테두리)을 더한다.
       position+z-index 로 «옆 칸 위에» 그린다(옆 칸 바탕이 막대를 덮지 않게). */
    if(n > 1) 꼴 += ";width:calc(" + (n * 100) + "% + " + ((n - 1) * (e._gap || 0)) + "px);position:relative;z-index:1";
    if(e._cutL) 꼴 += ";border-top-left-radius:0;border-bottom-left-radius:0";
    if(e._cutR) 꼴 += ";border-top-right-radius:0;border-bottom-right-radius:0";
    /* 폰은 구글 위젯처럼 제목만 — 좁은 칸에 시각까지 넣으면 제목이 안 보인다 */
    안 = ((e.time && !(typeof 폰 === "function" && 폰())) ? esc(e.time) + " " : "") + esc(제목);
  }
  /* 🗄 구글에서 지워진 일정 — 바탕 없이 점선 테두리 + 취소선(평소엔 안 보인다, 스위치를 켰을 때만) */
  if(지운것){
    return '<div class="ev gone" title="' + esc(e.tip || 제목) + '" style="border:1px dashed ' + esc(사람색)
      + ';color:var(--gsub);background:transparent;text-decoration:line-through">' + esc(제목) + '</div>';
  }
  if(공휴){
    /* 눌러서 상세를 볼 수 있게 — 이름이 길어 칸에서 잘리는 날이 있다(대체공휴일 등) */
    return '<div class="ev hol" data-holday="' + esc(ymd) + '" title="' + esc(e.tip || 제목)
      + '" style="' + 꼴 + '">' + 안 + '</div>';
  }
  return '<div class="ev" data-ev="' + esc(e.store) + ':' + esc(e.id) + '"'
    + (시각칩 ? ' data-g="t"' : '')
    + (옮길수있나 ? ' draggable="true" data-drag="' + esc(e.store) + ':' + esc(e.id) + '"' : '')
    + ' title="' + esc(e.tip) + (옮길수있나 ? ' (끌어서 다른 날로 옮길 수 있습니다)' : '') + '"'
    + ' style="' + 꼴 + '">' + 안 + '</div>';
}

/* 공휴일 한 건 → 칩 자료. 구글 「대한민국의 휴일」 달력과 같은 색으로 «보통 칩»처럼 그린다
   (대표 지시 2026-09-27). 옮길 수 없다(movable:false). */
var 공휴색 = "#d81b60";
function 공휴칩(ymd){
  var h = holidayOf(ymd);
  return h ? { kind:"hol", store:"", id:"hol:" + ymd, date:ymd, end:ymd, text:h, tip:h,
               color:공휴색, time:"", movable:false } : null;
}

/* ── 한 주를 «구글처럼» 늘어놓는다 ──────────────────────────────────────
   대표 지시 2026-09-27 「구글캘린더 화면과 완벽하게 같이」.
   ★ 여러 날 일정(연차 사흘 등)은 칸마다 따로 찍지 않고 «한 줄 막대»로 칸을 가로지른다.
     그러려면 막대가 걸친 날들에서 «같은 높이(줄)»에 있어야 한다 — 그래서 한 주를
     통째로 보고 줄을 먼저 나눈다(아래 차례는 구글과 같다):
       ① 여러 날 막대 — 먼저 시작하는 것, 같으면 긴 것이 윗줄
       ② 하루짜리 — 공휴일 · 종일 · 시각 순(시각은 이른 것부터). 막대 사이 빈 줄을 먼저 메운다.
   ★ 칸이 모자라면 «용량»에서 한 줄을 「N개 더보기」에 내준다(칸용량 — 재서 나온 수).
     막대는 «보이는 날들»까지만 잇고, 가려진 날에서 끊는다(더보기 글자를 안 덮는다).
   날들: 날짜 7개(주 보기·월 보기 한 줄) · 일들: 날마다의 일 목록 · 용량: 한 칸 줄 수(없으면 안 접음)
   틈: 칸 사이 폭(좌우 여백 + 테두리 px) — 막대 너비 셈에 쓴다.
   돌려주는 것: 날마다 { html, 숨김 } */
function 줄배치(날들, 일들, 용량, 틈){
  if(!(용량 > 0)) 용량 = Infinity;
  var 여러 = [], 본 = {};
  일들.forEach(function(evs, di){
    evs.forEach(function(e){
      if(!(e.end && e.end > e.date)) return;
      var k = e.store + ":" + e.id;
      if(본[k]) return;
      본[k] = 1;
      var t = di;
      while(t + 1 < 날들.length && 날들[t + 1] <= e.end) t++;
      여러.push({ e:e, s:di, t:t, cutL: e.date < 날들[di], cutR: e.end > 날들[t] });
    });
  });
  여러.sort(function(a, b){ return (a.s - b.s) || ((b.t - b.s) - (a.t - a.s)); });
  var 점유 = [];
  여러.forEach(function(g){
    for(var l = 0; ; l++){
      점유[l] = 점유[l] || [];
      var 빔 = true;
      for(var d = g.s; d <= g.t; d++) if(점유[l][d]){ 빔 = false; break; }
      if(빔){ g.l = l; for(d = g.s; d <= g.t; d++) 점유[l][d] = g; break; }
    }
  });
  var 줄들 = 날들.map(function(ds, di){
    var 홑 = 일들[di].map(function(e, i){ return { e:e, i:i }; })
      .filter(function(x){ return !(x.e.end && x.e.end > x.e.date); });
    홑.sort(function(a, b){
      function 차(e){ return e.kind === "hol" ? 0 : e.time ? 2 : 1; }
      return (차(a.e) - 차(b.e)) || String(a.e.time || "").localeCompare(String(b.e.time || "")) || (a.i - b.i);
    });
    var 칸 = [], hi = 0, 끝줄 = -1, l;
    for(l = 0; l < 점유.length; l++) if(점유[l][di]) 끝줄 = l;
    for(l = 0; l <= 끝줄; l++){
      if(점유[l][di]) 칸.push({ g:점유[l][di] });
      else if(hi < 홑.length) 칸.push({ e:홑[hi++].e });
      else 칸.push(null);
    }
    while(hi < 홑.length) 칸.push({ e:홑[hi++].e });
    var 보임 = 칸.length <= 용량 ? 칸.length : Math.max(0, 용량 - 1);
    var 숨김 = 0;
    for(var p = 보임; p < 칸.length; p++) if(칸[p]) 숨김++;
    return { 칸:칸, 보임:보임, 숨김:숨김, 막대:{} };
  });
  /* 막대를 «보이는 날끼리» 이어 붙인다 — 가려진 날에서 끊고, 다시 보이면 새로 시작 */
  여러.forEach(function(g){
    var d = g.s;
    while(d <= g.t){
      if(g.l >= 줄들[d].보임){ d++; continue; }
      var a = d;
      while(d + 1 <= g.t && g.l < 줄들[d + 1].보임) d++;
      줄들[a].막대[g.l] = { n: d - a + 1, cutL: a > g.s || g.cutL, cutR: d < g.t || g.cutR };
      d++;
    }
  });
  return 줄들.map(function(z, di){
    var html = "";
    for(var p = 0; p < z.보임; p++){
      var x = z.칸[p];
      if(!x) { html += '<div class="evph"></div>'; continue; }
      if(x.e){ html += chipHtml(x.e, 날들[di]); continue; }
      var m = z.막대[p];
      if(!m){ html += '<div class="evph"></div>'; continue; }
      html += chipHtml(Object.assign({}, x.g.e, { _span:m.n, _gap:틈, _cutL:m.cutL, _cutR:m.cutR }), 날들[di]);
    }
    return { html: html, 숨김: z.숨김 };
  });
}

/* ── 한 칸에 «몇 개»가 들어가나 ──
   못 박은 수를 쓰지 않는다. 판이 화면에 맞춰 늘고 줄므로, 그려 놓고 «재서» 정한다.
   ⚠ 재기 전 첫 그림에는 어림값(5)을 쓴다. 그린 뒤 재서 달라졌으면 «한 번만» 다시 그린다
     — 값이 같아지면 다시 그리지 않으므로 돌고 돌지 않는다. */
var _칸용량 = 0;
var _첫줄용량 = 0;   /* 첫 줄(요일 글자가 얹힌 줄)의 칸 용량 — 용량재기가 잰다 */
function 칸용량(){
  if(_칸용량) return _칸용량;
  /* ⚠ 아직 «못 쟀을 때»의 어림이다. 한때 여기에 5 를 못 박아 두었더니,
     못 재는 판(창이 숨어 있을 때 등)에서는 그 5 가 그대로 남아 칸마다 넘쳤다.
     못 박은 수 대신 화면 높이에서 뽑는다 — 200 은 머리(위 띠·탭줄·머리줄·요일줄)와
     아래 여백이 먹는 몫, 30 은 칸 안의 날짜줄과 여백, 19.5 는 칩 하나와 틈이다.
     재고 나면 이 값은 곧 «잰 값»으로 바뀐다(용량재기). */
  var 남은 = (window.innerHeight || 800) - 200;
  return Math.max(2, Math.floor((남은 / 6 - 30) / 19.5));
}
function 용량재기(){
  var g = document.querySelector(".calgrid");
  if(!g || !g.clientHeight) return false;
  var 칸 = g.querySelector(".day");
  if(!칸) return false;
  /* ⚠ 높이를 «짐작»하지 않는다. 처음에 날짜줄 22·칩 17.5 로 어림했더니 칸마다 11px 씩
     넘쳐 「+N개 더」가 잘렸다 — 날짜 동그라미는 24px 이고 칩은 테두리까지 18px 이다.
     꾸밈을 한 줄만 고쳐도 어림값은 또 틀어진다. 그래서 그려 놓은 것을 실제로 잰다. */
  /* ⚠ 줄 수를 «그려진 칸»으로 센다 — 폰은 그 달에 필요한 줄만(5줄) 그린다. 6 으로 나누면
       한 줄 높이를 작게 재어 칸이 비어 있는데도 「•••」로 접는다(2026-09-27 대표 폰 캡처) */
  var 줄수 = Math.max(1, Math.round(g.querySelectorAll(".day").length / 7));
  var 줄 = g.clientHeight / 줄수;
  var cs = getComputedStyle(칸);
  var 여백 = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
  function 날짜줄(c){
    var dl = c && c.querySelector(".dline");
    return dl ? dl.offsetHeight + (parseFloat(getComputedStyle(dl).marginBottom) || 0) : 0;
  }
  var ev = g.querySelector(".ev");
  var 칩 = ev ? ev.offsetHeight + 2 : 22;          /* 칩 하나 + 사이 틈(gap 2px) */
  if(!칩) return false;
  /* ★ 첫 줄은 요일 글자가 얹혀 날짜줄이 높다 — 둘째 줄(8번째 칸)로 «보통 줄»을 잰다 */
  var 보통 = g.querySelectorAll(".day")[7] || 칸;
  var n = Math.max(1, Math.floor((줄 - 여백 - 날짜줄(보통)) / 칩));
  var n0 = Math.max(1, Math.floor((줄 - 여백 - 날짜줄(칸)) / 칩));
  if(n === _칸용량 && n0 === _첫줄용량) return false;
  _칸용량 = n; _첫줄용량 = n0;
  return true;
}

/* ★ 폰 화면 — 구글 캘린더 «위젯»과 같은 꼴 (대표 지시 2026-09-27 「구글 캘린더 같이 폰에 똑같이」,
     대표 폰의 구글 캘린더 위젯 캡처를 그대로 옮겼다):
       위에 「10월 / 병오년8월 – 9월」 · ‹ › · 파란 ＋  →  요일 줄  →  그 달에 필요한 줄만(5줄이면 5줄)
       칸마다 날짜 「27 (17)」, 칩은 모두 색을 «꽉» 채운다(점 꼴 없음), 넘치면 「•••」.
   ⚠ 폰인지는 여기 한 곳에서만 가른다. typeof 로 본다 — 검사가 함수만 떼어 상자에서 돌 때
     window.matchMedia 가 없다(그때는 넓은 화면으로 친다). */
function 폰(){
  /* 가로로 눕힌 폰(높이 500 이하 + 손가락 화면)도 폰 꼴 — 자동 회전(2026-09-27)으로 옆으로 돌리면
     넓은 화면 머리줄이 들어가 칸이 두세 줄로 줄어든다 */
  try{ return typeof window !== "undefined" && !!window.matchMedia
    && window.matchMedia("(max-width:700px), (max-height:500px) and (pointer:coarse)").matches; }
  catch(e){ return false; }
}
function 폰머리Html(){
  var 달 = parseInt(String(S.ym).slice(5,7), 10);
  var 음력 = lunarRange(S.ym);
  return '<div class="mhead">'
    + '<div class="mtt"><b>' + 달 + '월</b>' + (음력 ? '<span>' + esc(음력) + '</span>' : '') + '</div>'
    + '<button class="mfilt" data-mf="1" title="누르면 전체 → 공용 → 개인">'
    +   (S.filter === "priv" ? "🔒 개인" : S.filter === "shared" ? "👥 공용" : "전체") + '</button>'
    + '<button class="mnav" data-mv="-1" title="이전 달">‹</button>'
    + '<button class="mnav" data-mv="1" title="다음 달">›</button>'
    + '<button class="mplus" data-mnew="1" title="새로 넣기">＋</button>'
    + '<button class="mmenu" data-mmenu="1" title="메뉴">☰'
    +   ((GLINK.st === "need" && GLINK.why !== "inactive") || GLINK.st === "err" ? '<i class="gd" title="구글 연결 안 됨"></i>' : '')
    + '</button>'
    + '</div>';
}
/* ★ 폰에서 «고른 날» — 구글 폰 달력처럼 «날을 하나 골라 놓고» 그 날을 아래에서 읽는다.
   안 골랐으면 그 달의 오늘, 오늘이 다른 달이면 그 달 1일. 달을 넘기면 다시 이 셈으로 돌아간다. */
function 고른날(){
  if(S.pick && String(S.pick).slice(0,7) === S.ym) return S.pick;
  var 오늘 = todayYMD();
  return 오늘.slice(0,7) === S.ym ? 오늘 : S.ym + "-01";
}
/* 목록 차례 — 달 칸과 같다: 공휴일 → 여러 날 → 종일 → 시각(이른 것부터) */
function 목록순(e, ds){
  if(e.kind === "hol") return 0;
  if(e.end && e.end > ds) return 1;
  return e.time ? 3 : 2;
}
/* ★ 폰 «그날 목록» — 고른 날의 일을 «안 잘리는 크기»로 늘어놓는다 (대표 지시 2026-09-27
     「폰화면 ui도 구글처럼 사용이 같아야한다」).
   왜 있어야 하나: 폰 칸은 49px 이라 칩 글자가 다섯~일곱 자만 보였다(91개 중 86개가 잘림).
     칸에서 읽기를 포기하고 여기서 읽는다 — 구글 폰 달력이 그렇게 한다.
   ⚠ 여기서는 그림글자(⚖️·🏛️·🔒)를 «안 걷는다». 칩에서는 걷는다(구글 화면에 없으므로) —
     그러나 폰에서 칩은 글자 없는 막대라, 이 목록이 글자가 나오는 «유일한 자리»다.
   ⚠ 누르는 길은 칩과 같게 둔다(data-ev·data-holday) — 두 벌로 나뉘면 한쪽만 고쳐진다. */
function 폰목록Html(eumOnly){
  var ds = 고른날();
  var evs = eventsOn(ds, eumOnly).filter(passFilter).filter(matchSearch);
  var h = 공휴칩(ds);
  var 것들 = (h ? [h] : []).concat(evs);
  것들 = 것들.map(function(e, i){ return { e:e, i:i }; }).sort(function(a, b){
    return (목록순(a.e, ds) - 목록순(b.e, ds))
      || String(a.e.time || "").localeCompare(String(b.e.time || "")) || (a.i - b.i);
  }).map(function(x){ return x.e; });
  var d = new Date(ds + "T00:00:00");
  var 요일 = ["일","월","화","수","목","금","토"][d.getDay()];
  var 오늘 = todayYMD();
  var 줄 = 것들.map(function(e){
    var 지남 = e.endAt ? (e.endAt < Date.now()) : ((e.end || ds) < 오늘);
    var 언제 = e.time ? e.time : "종일";
    var 제목 = String(e.text || "");
    if(e.kind === "priv") 제목 = "🔒 " + 제목;
    if(e.end && e.end > ds) 제목 += " (~" + parseInt(e.end.slice(5,7), 10) + "/" + parseInt(e.end.slice(8,10), 10) + ")";
    return '<div class="mrow' + (지남 ? " past" : "") + '"'
      + (e.kind === "hol" ? ' data-holday="' + esc(ds) + '"'
                          : ' data-ev="' + esc(e.store) + ':' + esc(e.id) + '"')
      + '><i class="bd" style="background:' + esc(e.color || "#70757a") + '"></i>'
      + '<span class="tm">' + esc(언제) + '</span>'
      + '<span class="tx">' + esc(제목) + '</span></div>';
  }).join("");
  /* ⚠ data-day 를 목록 바깥틀에 둔다 — 「사건 기한·휴직」을 누르면 «어느 날 것인지»를
     타고 올라가 찾는다(칸에서도 같은 길이다). 빈 자리를 눌러 봐야 이미 고른 날이라 그대로다. */
  return '<div class="mlist" data-day="' + esc(ds) + '">'
    + '<div class="mlday">' + parseInt(ds.slice(5,7), 10) + '월 ' + parseInt(ds.slice(8,10), 10) + '일 (' + 요일 + ')'
    +   '<span class="n">· ' + 것들.length + '건</span></div>'
    + (줄 || '<div class="mnone">일정이 없습니다 · <b data-mnew="1">＋ 로 넣기</b></div>')
    + '</div>';
}
function calendarHtml(eumOnly){
  /* 🗄 스위치가 켜져 있거나 구글을 못 받았으면 보관함도 그 달 것을 받는다(같은 달이면 안 받는다) */
  if(fbDb && (S.showGone || GCAL.err) && typeof 보관받기 === "function") 보관받기();
  /* 보는 달이 바뀌었으면 구글을 다시 받는다 — 같은 달이면 아무 일도 안 한다(gcalLoad 안에서 가른다) */
  if(fbDb) gcalLoad();
  if(S.view === "week") return weekHtml(eumOnly);
  if(S.view === "day")  return dayHtml(eumOnly);
  var grid = monthGrid(S.ym), today = todayYMD();
  /* 폰은 그 달에 필요한 줄만 — 마지막 줄이 통째로 다음 달이면 뺀다(구글 위젯이 그렇다) */
  var 폰판 = typeof 폰 === "function" && 폰();
  if(폰판){ while(grid.length > 28 && grid.slice(grid.length - 7).every(function(c){ return c.other; })) grid = grid.slice(0, grid.length - 7); }
  /* ★ 한 칸에 «들어가는 만큼» 그린다 (대표 지시 2026-09-19
       「한화면에 나오게하고 달력안에 모든 내용 안보여도 된다. 펼서 볼수 있게 하면 된다」).
     넷이라는 «못 박은 수»가 아니다 — 판의 높이를 재서 나온 수다(칸용량).
     화면이 크면 여덟이 보이고 작으면 넷이 보인다. 남는 것은 「+N개 더」로 접고,
     누르면 그 자리에서 펼쳐 전부 보인다 — 다른 데로 데려가지 않는다.
   ⚠ 앞선 지시(「맞다 늘려라」)로 한때 아무것도 안 접었다. 그랬더니 바쁜 달이
     화면 밖으로 내려갔고(「너무 내려왔다」), 이 지시가 그것을 고친 것이다.
     되돌리려면 두 지시를 함께 볼 것 — tests/cal-cell-shows-all.test.js 가 막는다. */
  var 용량 = 칸용량();
  /* 날마다의 일 — 공휴일은 구글처럼 «보통 칩» 하나로 맨 앞에 든다(줄배치가 차례를 정한다) */
  var 일들 = grid.map(function(c){
    var evs = eventsOn(c.date, eumOnly).filter(passFilter).filter(matchSearch);
    var h = 공휴칩(c.date);
    return h ? [h].concat(evs) : evs;
  });
  /* 한 주씩(일곱 칸) 늘어놓는다 — 여러 날 막대가 한 주 안에서 이어진다.
     11 = 칸 왼쪽 여백(2) + 오른쪽 여백(8) + 오른쪽 테두리(1) — .day 의 padding 을 바꾸면 이것도 바꾼다.
     ★ 첫 줄은 요일 글자(일 월 화…)만큼 낮다 — 따로 잰 수(_첫줄용량)를 쓴다.
       ⚠ typeof 로 본다 — 검사가 calendarHtml 만 떼어 상자에 넣고 돌 때 이 값이 없다. */
  var 첫줄 = (typeof _첫줄용량 === "number" && _첫줄용량 > 0) ? _첫줄용량 : 용량;
  var 배치 = [];
  for(var w = 0; w < grid.length; w += 7){
    배치 = 배치.concat(줄배치(grid.slice(w, w + 7).map(function(c){ return c.date; }),
                          /* 폰은 칸 여백이 좌우 2px(+테두리 1) — 막대 너비 셈에 쓴다 */
                          일들.slice(w, w + 7), w === 0 ? 첫줄 : 용량, 폰판 ? 5 : 11));
  }
  var 요일 = ["일","월","화","수","목","금","토"];
  var cells = grid.map(function(c, idx){
    var evs = 일들[idx].filter(function(e){ return e.kind !== "hol"; });
    var 오늘 = c.date === today;
    var 찾음 = !!(S.q && evs.length);
    /* ⚠ 칸 전체를 칠하지 않는다 — 구글 실제 화면을 재 보니(대표 지시 2026-09-20)
       «오늘»도 «공휴일»도 «앞뒤 달»도 칸 배경은 흰색 그대로였다(픽셀로 확인: 255,255,255).
       「오늘」은 숫자의 파란 동그라미(.dnum.today)만, 「공휴일」은 공휴일 칩만 맡는다.
       「찾음」은 이 앱만의 기능이라(구글에 없다) outline+옅은 칠을 그대로 둔다. */
    var 어둠 = S.theme === "dark";
    var bg = 어둠 ? "#1b1b1d" : (찾음 ? "#fffbeb" : "#ffffff");
    var 테 = "var(--gline)";
    /* 구글처럼 그 달 첫날은 「9월 1일」 — 달이 바뀌는 자리가 눈에 띈다 */
    var 날글 = (c.day === 1 && !폰판) ? (parseInt(c.date.slice(5,7), 10) + "월 1일") : String(c.day);
    var 숨김 = 배치[idx].숨김;
    /* 폰에서 «고른 날»은 옅게 칠한다 — 아래 목록이 어느 날 것인지 눈으로 잇는다 */
    var 고름 = 폰판 && c.date === 고른날();
    return '<div class="day' + (오늘 ? " today" : "") + (고름 ? " pick" : "") + '" data-day="' + c.date + '"'
      + ' style="background:' + bg + ';border-right:1px solid ' + 테 + ';border-bottom:1px solid ' + 테
      + (찾음 ? ';outline:2px solid #fbbf24;outline-offset:-2px' : '') + '">'
      + '<div class="dline">'
      /* 요일은 구글처럼 «첫 줄 칸 안»에 — 따로 줄을 두면 그만큼 달력이 낮아진다 */
      +   (idx < 7 && !폰판 ? '<span class="wd">' + 요일[idx] + '</span>' : '')
      +   '<div class="dnum' + (오늘 ? " today" : "") + (c.other ? " other" : "") + '">' + 날글 + '</div>'
      +   '<span class="lun' + (c.other ? " other" : "") + '">(' + lunarDay(c.date) + ')</span>'
      + '</div>'
      + '<div class="evs">'
      +   배치[idx].html
      +   (숨김 > 0 ? '<div class="more" data-more="' + c.date + '" title="눌러서 그 날을 펼쳐 봅니다 (' + 숨김 + '개 더)">'
            + (폰판 ? '•••' : 숨김 + '개 더보기') + '</div>' : '')
      + '</div></div>';
  }).join("");
  if(폰판){
    return 폰머리Html() + '<div class="cal">'
      + '<div class="mhd">' + 요일.map(function(w){ return '<div>' + w + '</div>'; }).join("") + '</div>'
      + '<div class="calgrid" style="grid-template-rows:repeat(' + (grid.length / 7) + ',1fr)">' + cells + '</div></div>'
      /* 칸에서 못 읽는 것을 여기서 읽는다 — 구글 폰 달력과 같은 쓰임 */
      + 폰목록Html(eumOnly);
  }
  return '<div class="cal">'
    + '<div class="calgrid">' + cells + '</div></div>';
}

/* ── 펼침 창 ── 접힌 날을 «그 자리에서» 전부 보여 준다.
   ⚠ 다른 화면으로 데려가지 않는다 — 한 칸을 보려고 보던 달을 잃으면 안 된다.
     자리잡기는 그린 뒤에 한다(펼침자리) — 칸이 어디 있는지는 그려 봐야 안다. */
function 펼침Html(eumOnly){
  if(!S.open) return "";
  var evs = eventsOn(S.open, eumOnly).filter(passFilter).filter(matchSearch);
  var h = 공휴칩(S.open);
  var d = new Date(S.open + "T00:00:00");
  /* 차례는 달 칸과 같다(여러 날 → 공휴일 → 종일 → 시각) — 줄배치를 하루짜리로 부른다 */
  var 안 = 줄배치([S.open], [h ? [h].concat(evs) : evs], Infinity, 0)[0].html;
  /* 구글 「더보기」 창처럼 — 요일(작게) · 날짜(크게) · ✕ */
  return '<div class="pop" id="pop">'
    + '<div class="ph"><span class="wd">' + ["일","월","화","수","목","금","토"][d.getDay()] + '</span>'
    +   '<span class="big">' + d.getDate() + '</span>'
    +   '<span class="n">' + evs.length + '건</span>'
    +   '<button class="x" data-popclose="1" title="닫기">✕</button></div>'
    + '<div class="evs">'
    +   안
    +   (evs.length ? "" : '<div style="font-size:11.5px;color:var(--sub);padding:4px 2px">이 날은 비어 있습니다</div>')
    + '</div></div>';
}
function 펼침자리(){
  var p = document.getElementById("pop");
  if(!p) return;
  var 칸 = document.querySelector('.day[data-day="' + S.open + '"]');
  if(!칸){ S.open = null; p.parentNode.removeChild(p); return; }
  var r = 칸.getBoundingClientRect();
  var w = p.offsetWidth, h = p.offsetHeight;
  /* 칸 위에 겹쳐 띄우되, 화면 밖으로 나가면 안쪽으로 당긴다 */
  var x = r.left - 2, y = r.top - 2;
  if(x + w > window.innerWidth - 8) x = window.innerWidth - w - 8;
  if(y + h > window.innerHeight - 8) y = window.innerHeight - h - 8;
  p.style.left = Math.max(8, x) + "px";
  p.style.top  = Math.max(8, y) + "px";
}

/* ── 주 보기 ── 이레를 나란히, 하루씩 위에서 아래로. 여러 날 일정은 달 보기처럼 막대로 잇는다 */
function weekDays(ymd){
  var d = new Date(ymd + "T00:00:00"), out = [];
  d.setDate(d.getDate() - d.getDay());
  for(var i=0;i<7;i++){ out.push(ymdOf(d.getFullYear(), d.getMonth()+1, d.getDate())); d.setDate(d.getDate()+1); }
  return out;
}
function weekHtml(eumOnly){
  var days = weekDays(S.date), today = todayYMD();
  var 일들 = days.map(function(ds){
    var evs = eventsOn(ds, eumOnly).filter(passFilter).filter(matchSearch);
    var h = 공휴칩(ds);
    return h ? [h].concat(evs) : evs;
  });
  /* 7 = .wcol 좌우 여백(3+3) + 오른쪽 테두리(1). 주 보기는 접지 않는다(Infinity). */
  var 배치 = 줄배치(days, 일들, Infinity, 7);
  var cols = days.map(function(ds, i){
    var 오늘 = ds === today;
    var d = new Date(ds + "T00:00:00");
    var 어둠 = S.theme === "dark";
    /* 주 보기도 달 보기와 같은 잣대다 — 오늘·공휴일 모두 칸 배경은 흰색 그대로다 */
    var wbg = 어둠 ? "#1b1b1d" : "#ffffff";
    return '<div class="wcol' + (오늘 ? " today" : "") + '" data-day="' + ds + '" style="background:' + wbg + '">'
      + '<div class="whd">'
      +   ["일","월","화","수","목","금","토"][d.getDay()]
      +   '<div class="dnum' + (오늘 ? " today" : "") + '">' + d.getDate() + '</div>'
      +   '<span class="lun">(' + lunarDay(ds) + ')</span></div>'
      + '<div class="evs">' + 배치[i].html + '</div></div>';
  }).join("");
  return '<div class="cal"><div class="wgrid">' + cols + '</div></div>';
}

/* ── 일 보기 ── 하루치를 한 줄씩 크게 */
function dayHtml(eumOnly){
  var ds = S.date;
  var evs = eventsOn(ds, eumOnly).filter(passFilter).filter(matchSearch);
  var h = 공휴칩(ds);
  return '<div class="cal"><div class="dayview" data-day="' + ds + '">'
    + (h ? chipHtml(h, ds) : '')
    + (evs.length ? 줄배치([ds], [evs], Infinity, 0)[0].html
                  : '<div class="later"><p>이 날에는 아무것도 없습니다. 눌러서 넣으세요.</p></div>')
    + '</div></div>';
}

/* ── 위 줄 ── ◀ 2026-09 ▶ · 병오년8월 – 9월 · 오늘 · [월|주|일] · 🔍 일정 검색 */
/* 달력 머리줄 — 달 이동·보기·검색. «한 줄»이다 (대표 지시 2026-09-19 「한줄로 정리해라」).
   ★ 사람 칩은 여기 없다 — 탭 줄로 올렸다(대표 지시 「캡쳐1은 캡쳐2 줄에 넣어라」).
     탭 줄은 오른쪽이 통째로 비어 있었고, 칩을 한 줄 따로 두면 달력이 그만큼 내려간다.
   ⚠ 좁은 화면에서는 접힌다(flex-wrap). 못 들어가는 것을 우겨 넣으면 글자가 잘린다.
   ⚠ eumOnly 를 그대로 받는다 — 쓰지 않아도 부르는 쪽 모양을 바꾸지 않는다. */
/* 달 이동 — 머리줄 «안»에 든다(renderTabs). 달력 판 위에 따로 줄을 두지 않는다. */
function calheadHtml(eumOnly){
  return '<div class="calhead">' + monthbarHtml() + '</div>';
}
function monthbarHtml(){
  /* 구글 머리줄 꼴 (대표 지시 2026-09-27) — [오늘] ‹ › 2026년 9월 · 음력 · 월|주|일 */
  var 요일 = ["일","월","화","수","목","금","토"];
  function 달글(ymd){ return parseInt(ymd.slice(5,7),10) + "월 " + parseInt(ymd.slice(8,10),10) + "일"; }
  var 가운데 = S.view === "month" ? (S.ym.slice(0,4) + "년 " + parseInt(S.ym.slice(5,7),10) + "월")
    : S.view === "week" ? (function(){ var w = weekDays(S.date); return 달글(w[0]) + " – " + 달글(w[6]); })()
    : (S.date.slice(0,4) + "년 " + 달글(S.date) + " (" + 요일[new Date(S.date + "T00:00:00").getDay()] + ")");
  var 음력 = S.view === "month" ? lunarRange(S.ym) : "";
  return '<div class="monthbar">'
    + '<button class="todaybtn" data-mv="0">오늘</button>'
    + '<button class="mv" data-mv="-1" title="이전">‹</button>'
    + '<button class="mv" data-mv="1" title="다음">›</button>'
    + '<span class="ym">' + esc(가운데) + '</span>'
    + (음력 ? '<span class="lunrange">' + esc(음력) + '</span>' : '')
    + '</div>';
}
/* 월 | 주 | 일 — 구글처럼 머리줄 오른쪽 끝 */
function segHtml(){
  return '<span class="seg">'
    + [["month","월"],["week","주"],["day","일"]].map(function(v){
        return '<button data-view="' + v[0] + '"' + (S.view === v[0] ? ' class="on"' : '') + '>' + v[1] + '</button>';
