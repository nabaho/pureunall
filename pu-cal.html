<style>
  :root{--acc:#2563eb;--acc2:#1e40af;--acc-soft:#eff6ff;--ink:#1e293b;--sub:#475569;--faint:#94a3b8;
    --line:#e2e8f0;--panel:#ffffff;--bg:#f8fafc;--ok:#166534;--warn:#854d0e;--warn-bg:#fffbeb;
    --danger:#dc2626;--radius:11px}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;color:var(--ink);
    background:#f8fafc;font-size:14px;-webkit-font-smoothing:antialiased}

  /* ── 머리줄 ──
     ⚠ 한 줄이다. 낱말 가운데서 잘려 두 줄이 되면 폰에서 화면을 갉아먹는다.
        넘치면 «줄이는» 것이지 «내리는» 것이 아니다. */
  #topbar{position:sticky;top:0;z-index:15;background:#ffffff;border-bottom:1px solid var(--line);
    padding:8px 16px;display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden}
  #topbar .brand{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;flex-shrink:0}
  #topbar .sp{margin-left:auto}
  #conn{font-size:12px;color:var(--sub);flex-shrink:0}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#cbd5e1;margin-right:5px}
  .dot.on{background:#16a34a}
  #me{font-size:12.5px;font-weight:700;flex-shrink:0;overflow:hidden;text-overflow:ellipsis}
  #me .role{color:var(--sub);font-weight:500;margin-left:4px}
  .lnk{font-size:12.5px;padding:5px 11px;border:1px solid var(--line);color:var(--sub);background:#ffffff;
    border-radius:8px;cursor:pointer;font-weight:700;flex-shrink:0}
  .lnk.go{border-color:#bfdbfe;color:var(--acc2)}

  /* ── 탭 한 줄 — 법인 셋 · 이음 셋 ── */
  #tabs{display:flex;align-items:center;gap:3px;padding:7px 14px;background:#ffffff;
    border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
  .gl{font-size:10px;color:var(--faint);font-weight:700;margin:0 3px 0 0;flex-shrink:0}
  .tab{padding:5px 11px;border-radius:7px;font-size:12px;color:var(--sub);cursor:pointer;
    border:none;background:transparent;font-family:inherit;flex-shrink:0}
  .tab:hover{background:var(--bg)}
  .tab.eum{color:#2563eb}
  .tab.on{background:var(--acc2);color:#ffffff;font-weight:700}
  .tsep{width:1px;height:18px;background:#cbd5e1;margin:0 7px;flex-shrink:0}

  #app{padding:14px 16px 90px;max-width:1500px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
  .note{background:var(--warn-bg);border:1px solid #fde68a;border-radius:9px;padding:9px 13px;
    font-size:12px;color:var(--warn);margin-bottom:11px;display:flex;align-items:center;gap:9px}
  .note .sp{margin-left:auto}
  .btn{border:none;border-radius:7px;font-size:12px;font-weight:700;padding:6px 13px;cursor:pointer;
    font-family:inherit;background:var(--acc);color:#ffffff}
  .btn.ghost{background:#ffffff;color:var(--acc2);border:1px solid #bfdbfe}
  .muted{color:var(--sub)}

  /* ── 달 고르기 ── */
  .monthbar{display:flex;align-items:center;gap:8px;margin-bottom:9px;white-space:nowrap}
  .monthbar .ym{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
  .mv{border:1px solid var(--line);background:#ffffff;border-radius:7px;width:28px;height:28px;
    cursor:pointer;color:var(--sub);font-size:14px;font-family:inherit}

  /* ── 거르개 ── */
  .chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:9px}
  .chip{font-size:11px;border:1px solid #cbd5e1;border-radius:20px;padding:2px 10px;color:var(--sub);
    background:#ffffff;cursor:pointer;font-family:inherit;white-space:nowrap}
  .chip.on{background:var(--acc2);border-color:var(--acc2);color:#ffffff;font-weight:700}

  /* ── 달력 ── */
  .cal{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#ffffff}
  .calhd{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg);font-size:11px;
    color:var(--sub);text-align:center}
  .calhd div{padding:5px 0;border-right:1px solid var(--line)}
  .calhd div:last-child{border-right:none}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr)}
  .day{min-height:92px;border-right:1px solid var(--line);border-top:1px solid var(--line);padding:3px 4px;overflow:hidden}
  .day:nth-child(7n){border-right:none}
  .day.out{background:var(--bg)}
  .day.today{background:var(--acc-soft)}
  .dnum{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .dnum.sun,.dnum.hol{color:var(--danger);font-weight:700}
  .dnum.sat{color:var(--acc)}
  .holname{font-size:9.5px;color:var(--danger);margin-left:3px}
  /* 한 칸은 «한 줄»이다 — 넘치면 … 로 줄이고 전문은 title 에 담는다 */
  .ev{font-size:10.5px;border-radius:4px;padding:1px 5px;margin-top:2px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;cursor:default}
  .ev.sch{background:#eff6ff;color:#1e40af}
  .ev.eum{background:#bfdbfe;color:#1e40af}
  .ev.leave{background:#f0fdf4;color:#166534}
  .ev.off{background:#fef2f2;color:#991b1b}
  .ev.trip{background:#fffbeb;color:#854d0e}
  .more{font-size:9.5px;color:var(--faint);margin-top:1px}

  .legend{display:flex;gap:11px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:9px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

  /* ── 넣고 고치는 창 ── */
  .veil{position:fixed;inset:0;background:#1e293b;opacity:.45;z-index:40}
  .modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,92vw);
    background:#ffffff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;max-height:88vh;overflow:auto}
  .modal h3{margin:0 0 12px;font-size:15px}
  .fld{margin-bottom:10px}
  .fld label{display:block;font-size:11px;color:var(--sub);margin-bottom:3px;font-weight:700}
  .fld input,.fld select{width:100%;padding:7px 9px;border:1px solid #cbd5e1;border-radius:7px;
    font-size:13px;font-family:inherit;background:#ffffff;color:var(--ink)}
  .mbtns{display:flex;gap:7px;margin-top:14px;align-items:center}
  .mbtns .sp{margin-left:auto}
  .btn.danger{background:#dc2626}
  .btn[disabled]{opacity:.55;cursor:default}
  .werr{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:7px;
    padding:8px 11px;font-size:12px;margin-bottom:10px;white-space:pre-line}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;background:#1e293b;
    color:#ffffff;border-radius:9px;padding:9px 16px;font-size:12.5px;font-weight:700}
  /* ── 인원 현황 표 ── */
  .scope{display:flex;align-items:center;gap:6px;margin-bottom:9px;flex-wrap:wrap}
  .seg{display:inline-flex;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden}
  .seg button{border:none;background:#ffffff;color:var(--sub);font-family:inherit;font-size:11.5px;
    padding:4px 11px;cursor:pointer}
  .seg button.on{background:var(--acc2);color:#ffffff;font-weight:700}
  table.ppl{border-collapse:collapse;width:100%;font-size:12.5px}
  table.ppl th,table.ppl td{border-bottom:1px solid var(--line);padding:6px 9px;text-align:left;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.ppl th{background:var(--bg);font-weight:700;font-size:11.5px;color:var(--sub)}
  table.ppl td.n{text-align:right;font-variant-numeric:tabular-nums}
  table.ppl tr.left td{color:var(--faint)}
  .dot2{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  .kindtag{font-size:10px;font-weight:700;border-radius:9px;padding:1px 7px}
  .kindtag.in{background:#eff6ff;color:#1e40af}
  .kindtag.ex{background:#fffbeb;color:#854d0e}
  .kindtag.law{background:#f0fdf4;color:#166534}
  .days{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .lnkrow{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .lnkrow code{font-size:11px;color:var(--sub);background:var(--bg);border-radius:5px;padding:2px 7px;
    overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .later{text-align:center;padding:40px 18px;color:var(--sub)}
  .later h2{font-size:16px;margin:0 0 7px;color:var(--ink)}
  .later p{margin:0 0 16px;font-size:12.5px}

  @media (max-width:700px){
    #app{padding:10px 8px 80px}
    #topbar{padding:7px 10px;gap:7px}
    #topbar .brand{font-size:13px}
    #conn span.t{display:none}
    .day{min-height:66px}
    .ev{font-size:9.5px}
  }
</style>
</head>

<div id="topbar">
  <span class="brand">📅 푸른 캘린더</span>
  <button class="lnk go" id="goErp" title="푸른이알피로 갑니다">← 푸른이알피</button>
  <span class="sp"></span>
  <span id="conn"><span class="dot"></span><span class="t">연결 중…</span></span>
  <span id="me"></span>
  <button class="lnk" id="logout">로그아웃</button>
</div>

<div id="tabs"></div>
<div id="app"><div class="panel muted">불러오는 중…</div></div>

<script>
/* 푸른 캘린더 — 법인 대시보드 + 이음센터를 이알피에서 떼어 낸 앱 (1걸음)
   ────────────────────────────────────────────────────────────────────────
   대표 지시 2026-09-18 「법인대시보드와 이음센터만 완전히 따로 빼서 캘린더를 만들고 싶다」

   ⚠ 1걸음은 «읽기»까지다. 일정·근태를 넣고 고치는 것은 아직 이알피가 한다.
     까닭: 근태 저장은 마감 자물쇠·번호 규칙·안전 병합을 모두 지나야 하는데,
     그 문을 여기 다시 지으면 «두 벌»이 된다 — 그러면 마감한 달이 한쪽에서 뚫리고
     급여가 조용히 틀어진다. 그 문을 공용으로 빼낸 뒤에 붙인다(1걸음-나).
     그래서 이 화면은 고치는 자리마다 이알피로 보낸다 — «못 한다»가 아니라 «저기서 한다».

   ⚠ 이알피는 그대로 둔다. 한 달은 두 곳에서 같은 달력이 보인다(2걸음).
     새 앱에서만 생기는 문제를 잡은 뒤에야 이알피 쪽을 뺀다(3걸음). */
'use strict';

var FB_CONFIG={apiKey:'AIzaSyDkZz5QlKSoqMOYByp5YGeMNLNDrIghliA',databaseURL:'https://pureun-erp-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'pureun-erp',storageBucket:'pureun-erp.firebasestorage.app',appId:'1:936817166182:web:9bd31f70d0afdf5fca2aa7',messagingSenderId:'936817166182'};

var fbDb = null;
var D = {};              // 읽어 온 표들
var FAILED = {};         // 못 읽은 표 — «빈 것»과 갈라 둔다
var ME = null;           // 나 (직원 한 줄)
var S = { tab:'cal', ym:'', filter:null, unwatch:[], modal:null, busy:false, toast:'',
          scope:'month', showLeft:false };

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ymOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function todayYMD(){ var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function arr(v){ return Array.isArray(v) ? v : []; }

/* ── 어느 탭이 있는가 ──────────────────────────────────────────────────
   대표 결정 2026-09-18: 법인 셋과 이음 셋을 «한 줄»에 두 묶음으로 둔다.
   지금은 옆 메뉴를 갔다 와야 오가는데, 여기서는 한 번 누르면 된다 — 그것이 옮기는 뜻이다. */
var TABS = [
  { v:'cal',      g:'법인',    label:'📅 캘린더',      ready:true },
  { v:'workload', g:'법인',    label:'👥 직원별 업무', erp:'dash/corp' },
  { v:'analytics',g:'법인',    label:'📊 분석',        erp:'dash/corp', money:true },
  { v:'eumcal',   g:'이음센터', label:'📅 근무 캘린더', ready:true },
  { v:'eumppl',   g:'이음센터', label:'👤 인원 현황',   ready:true },
  { v:'eumshare', g:'이음센터', label:'🔗 외부 공유 뷰', ready:true }
];

/* 이 앱이 읽는 칸. 이알피가 주인이고 우리는 빌려 읽는다(온톨로지 sharedRoots).
   ⚠ 필요한 것만 읽는다 — 안 쓰는 큰 표를 받으면 요금과 깜빡임이 늘어난다. */
var KEYS = ['user_accounts','attendance_records','my_schedules','external_staff','holidays','staff_colors',
            'locked_attend_months','ieum_members','ieum_lectures','ieum_notes','ieum_caps'];

/* ── 사람 ──────────────────────────────────────────────────────────── */
/* ⚠ 직원 명부는 «배열»로도, «사번이 열쇠인 지도»로도 올 수 있다.
   배열만 받으면 지도로 왔을 때 조용히 빈 목록이 되고 화면에 이름 대신 사번(S001)이 뜬다 —
   틀린 화면이 아니라 «맞는 척하는» 화면이라 더 나쁘다. 그래서 두 꼴을 다 받는다. */
function users(){
  var v = D.user_accounts;
  var list = Array.isArray(v) ? v
    : (v && typeof v === "object") ? Object.keys(v).map(function(k){
        var u = v[k];
        return (u && typeof u === "object") ? (u.sid ? u : Object.assign({ sid:k }, u)) : null;
      })
    : [];
  return list.filter(function(u){ return u && u.sid; });
}
function userOf(sid){
  var us = users();
  for(var i=0;i<us.length;i++) if(us[i].sid===sid) return us[i];
  return null;
}
function nameOf(sid){ var u=userOf(sid); return u ? (u.name||sid) : sid; }
function externalOf(id){
  var xs = arr(D.external_staff);
  for(var i=0;i<xs.length;i++) if(xs[i] && xs[i].id===id) return xs[i];
  return null;
}
/* 직원 색 — 이알피가 정한 것을 그대로 쓴다. 여기서 새로 정하지 않는다
   (같은 사람이 두 앱에서 다른 색이면 그 색은 아무 뜻도 없어진다). */
function colorOf(sid){
  var m = D.staff_colors;
  if(m && typeof m==='object' && !Array.isArray(m) && m[sid]) return m[sid];
  return null;
}

/* ── 공휴일 ────────────────────────────────────────────────────────── */
function holidayOf(ymd){
  var hs = D.holidays;
  if(Array.isArray(hs)){
    for(var i=0;i<hs.length;i++){ if(hs[i] && hs[i].date===ymd) return hs[i].name||'공휴일'; }
    return '';
  }
  if(hs && typeof hs==='object' && hs[ymd]) return (hs[ymd].name||hs[ymd]) || '공휴일';
  return '';
}

/* ── 그 날의 일들 ──────────────────────────────────────────────────── */
function eventsOn(ymd, eumOnly){
  var out = [];
  // ① 일정
  arr(D.my_schedules).forEach(function(s){
    if(!s || s.date !== ymd) return;
    if(s.externalId) return;                       // 외부인 배정은 로스터 화면에만 (이알피와 같은 규칙)
    var t = s.title || '📅 일정';
    out.push({ kind:'sch', store:'my_schedules', id:s.id, sid:s.sid, text:t,
      tip:t + (s.note ? ' · '+s.note : '') });
  });
  // ② 근태 — 유형의 뜻은 js/pu-work-core.js 한 자리에서 받는다
  arr(D.attendance_records).forEach(function(r){
    if(!r || r.date !== ymd) return;
    var ty = PuWork.typeOf(r.type);
    var label = PuWork.labelFor(r.type, 'calendar');
    var who = r.externalId ? (externalOf(r.externalId)||{}).name : nameOf(r.sid);
    var text = PuWork.iconFor(r.type) + ' ' + (who||'') + ' ' + label;
    out.push({
      kind: r.type==='eum-work' ? 'eum' : (ty && ty.deductLeave) ? 'leave'
            : (r.type==='trip'||r.type==='telework') ? 'trip' : 'off',
      store:'attendance_records', id:r.id,
      sid:r.sid, externalId:r.externalId, type:r.type,
      text:text, tip:text + (r.note ? ' · '+r.note : '')
    });
  });
  if(eumOnly) out = out.filter(function(e){ return e.kind==='eum'; });
  return out;
}

/* 거르개 — null=전체 · 'pureun'=푸른 직원만 · 'eumwork'=이음 근무만 · sid=그 사람만 */
function passFilter(ev){
  var f = S.filter;
  if(!f) return true;
  if(f==='pureun')  return !ev.externalId;
  if(f==='eumwork') return ev.kind==='eum';
  return ev.sid === f;
}

/* ── 달력 그리기 ───────────────────────────────────────────────────── */
function calendarHtml(eumOnly){
  var ym = S.ym, y = +ym.slice(0,4), m = +ym.slice(5,7);
  var first = new Date(y, m-1, 1);
  var start = new Date(y, m-1, 1 - first.getDay());      // 그 주 일요일부터
  var today = todayYMD();
  var cells = '';
  for(var i=0;i<42;i++){
    var d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
    var ymd = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var out = (d.getMonth()+1) !== m;
    var hol = holidayOf(ymd);
    var dow = d.getDay();
    var cls = 'dnum' + (hol||dow===0 ? ' sun' : dow===6 ? ' sat' : '');
    var evs = eventsOn(ymd, eumOnly).filter(passFilter);
    var shown = evs.slice(0, 4), rest = evs.length - shown.length;
    cells += '<div class="day'+(out?' out':'')+(ymd===today?' today':'')+'" data-day="'+ymd+'">'
      + '<div class="'+cls+'">'+d.getDate()+(hol?'<span class="holname">'+esc(hol)+'</span>':'')+'</div>'
      + shown.map(function(e){
          var c = colorOf(e.sid);
          var st = (c && !e.externalId) ? ' style="border-left:3px solid '+esc(c)+'"' : '';
          /* 손대면 그 건을 연다. 빈 자리를 누르면 새로 넣는다(칸의 data-day). */
          return '<div class="ev '+e.kind+'"'+st+' title="'+esc(e.tip)+'" data-ev="'+esc(e.store)+':'+esc(e.id)+'">'+esc(e.text)+'</div>';
        }).join('')
      + (rest>0 ? '<div class="more">+'+rest+'건</div>' : '')
      + '</div>';
    if(i>=34 && (d.getMonth()+1)!==m && d.getDay()===6) break;   // 다음 달만 남은 줄은 안 그린다
  }
  return '<div class="cal">'
    + '<div class="calhd"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>'
    + '<div class="calgrid">'+cells+'</div></div>';
}

/* ── 이음센터 · 인원 현황 ─────────────────────────────────────────────
   「누가 몇 번 이음센터에 나갔나」를 사람별로 센다.
   ⚠ 이 화면은 «읽기»다. 한도·비고·강의 기록을 고치는 것은 아직 이알피에서 한다 —
     그 세 자리는 한 줄짜리 기록이 아니라 «표 통째»로 담겨 있어, 우리 저장 관문
     (칸별로 보내기)이 그대로 못 쓴다. 억지로 통째 저장을 흉내 내면 두 사람이
     같은 순간에 고칠 때 한쪽이 통째로 날아간다. */
var IEUM_START_YEAR = 2024;
/* 이알피의 같은 이름과 «같은 값»이어야 한다 — 다르면 밖으로 나간 링크가 갈린다.
   tests/cal-ieum-view.test.js 가 두 값을 맞대 본다. */
var IEUM_VIEW_BASE = 'https://nabaho.github.io/pureunall/ieum-view.html';

/* 사람 목록 — 내부 노무사 → 외부 노무사 → 변호사 → 그만둔 사람(기록이 있는 경우만).
   ⚠ 그만둔 사람을 지우지 않는다 — 지나간 근무 기록이 사라지면 셈이 틀어진다. */
function ieumPeople(){
  var ext = arr(D.external_staff);
  var att = arr(D.attendance_records);
  var 살아있는외부 = ext.filter(function(x){ return x && x.active !== false; });
  var 이음근무있나 = function(pred){ return att.some(function(r){ return r.type === "eum-work" && pred(r); }); };
  var 수동명단 = Array.isArray(D.ieum_members) ? D.ieum_members : null;
  var rows = [];
  /* 내부: 노무사는 늘 넣는다. 수동 명단이 있으면 그것을, 없으면 이음근무 기록이 있는 사람을. */
  users().forEach(function(u){
    var 노무사 = (String(u.title||"") + String(u.role||"")).indexOf("노무사") >= 0;
    var 수동 = 수동명단 && 수동명단.indexOf(u.sid) >= 0;
    var 기록 = !수동명단 && 이음근무있나(function(r){ return r.sid === u.sid && !r.externalId; });
    if(!(노무사 || 수동 || 기록)) return;
    /* ⚠ 현직만 이 줄에 넣는다 — 이알피와 같은 기준(status === "active").
       그만둔 사람은 아래에서 «회색으로» 따로 넣는다. 여기 섞으면 그만둔 노무사가
       현직처럼 보이고, 이음 근무를 배정할 사람 목록에까지 오른다.
       (검사 tests/cal-ieum-same-as-erp.test.js 가 실제로 돌려 본다 — 처음엔 섞여 있었다) */
    if(u.status !== "active") return;
    rows.push({ pk:u.sid, name:u.name||u.sid, kind:"in", roleLabel:"내부 노무사",
      color:colorOf(u.sid) || "#1e40af", note:(D.ieum_notes && D.ieum_notes[u.sid]) || "" });
  });
  var 변호사인가 = function(x){ return String(x.role||"").indexOf("변호사") >= 0; };
  살아있는외부.filter(function(x){ return !변호사인가(x); }).forEach(function(x){
    rows.push({ pk:x.id, name:x.name, kind:"ex", roleLabel:"외부 노무사", color:x.color||"#d97706", note:x.note||"" });
  });
  살아있는외부.filter(변호사인가).forEach(function(x){
    rows.push({ pk:x.id, name:x.name, kind:"law", roleLabel:"변호사", color:x.color||"#16a34a", note:x.note||"" });
  });
  /* 그만둔 사람 — 기록이 있을 때만, 회색으로 */
  var 이미 = {}; rows.forEach(function(r){ 이미[r.pk] = 1; });
  users().forEach(function(u){
    if(이미[u.sid] || u.status === "active") return;
    if(!이음근무있나(function(r){ return r.sid === u.sid && !r.externalId; })) return;
    rows.push({ pk:u.sid, name:u.name||u.sid, kind:"in", roleLabel:"내부 노무사", color:"#94a3b8", left:true, note:"" });
  });
  ext.filter(function(x){ return x && x.active === false; }).forEach(function(x){
    if(이미[x.id]) return;
    if(!이음근무있나(function(r){ return r.externalId === x.id; })) return;
    rows.push({ pk:x.id, name:x.name, kind:변호사인가(x)?"law":"ex", roleLabel:변호사인가(x)?"변호사":"외부 노무사",
      color:"#94a3b8", left:true, note:x.note||"" });
  });
  return rows;
}

/* 범위 안인가 — 월 / 연 / 전체 */
function inScope(ds){
  if(!ds) return false;
  if(S.scope === "year") return ds.slice(0,4) === S.ym.slice(0,4);
  if(S.scope === "all")  return true;
  return ds.slice(0,7) === S.ym;
}

function peopleHtml(){
  var rows = ieumPeople();
  /* 사람마다: 몇 번 나갔나 · 며칠에 나갔나 */
  var 근무 = {};
  arr(D.attendance_records).forEach(function(r){
    if(!r || r.type !== "eum-work" || !inScope(r.date)) return;
    var pk = r.externalId || r.sid; if(!pk) return;
    if(!근무[pk]) 근무[pk] = { 수:0, 날:[] };
    근무[pk].수++; 근무[pk].날.push(r.date);
  });
  Object.keys(근무).forEach(function(pk){ 근무[pk].날.sort(); });
  var 강의 = {};
  arr(D.ieum_lectures).forEach(function(l){
    if(!l || !inScope(l.date)) return;
    강의[l.personKey] = (강의[l.personKey]||0) + 1;
  });
  var 보일것 = S.showLeft ? rows : rows.filter(function(r){ return !r.left; });
  var 그만둔수 = rows.filter(function(r){ return r.left; }).length;
  var 합계 = 보일것.reduce(function(n,r){ return n + ((근무[r.pk]||{}).수 || 0); }, 0);
  var 범위말 = S.scope === "year" ? S.ym.slice(0,4)+"년" : S.scope === "all" ? "전체" : S.ym;

  var 표 = 보일것.map(function(p){
    var d = 근무[p.pk] || { 수:0, 날:[] };
    /* 한 칸은 «한 줄»이다 — 날짜가 많으면 … 로 줄이고 전문은 손대면 뜬다 */
    var 날말 = d.날.map(function(x){ return x.slice(5).replace("-","/"); }).join(", ");
    return "<tr" + (p.left ? " class=\"left\"" : "") + ">"
      + "<td><span class=\"dot2\" style=\"background:" + esc(p.color) + "\"></span>" + esc(p.name)
      + (p.left ? " <span class=\"muted\" style=\"font-size:10.5px\">(그만둠)</span>" : "") + "</td>"
      + "<td><span class=\"kindtag " + p.kind + "\">" + esc(p.roleLabel) + "</span></td>"
      + "<td class=\"n\">" + d.수 + "</td>"
      + "<td><div class=\"days\" title=\"" + esc(날말) + "\">" + esc(날말 || "—") + "</div></td>"
      + "<td class=\"n\">" + (강의[p.pk] || 0) + "</td>"
      + "<td><div class=\"days\" title=\"" + esc(p.note) + "\">" + esc(p.note || "—") + "</div></td>"
      + "</tr>";
  }).join("");

  return "<div class=\"note\"><span>✏️ 한도·비고·강의 기록을 고치는 것은 아직 푸른이알피에서 합니다.</span>"
    + "<span class=\"sp\"></span><button class=\"btn\" data-erp=\"dash/ieum\">이알피에서 고치기</button></div>"
    + "<div class=\"panel\">"
    + "<div class=\"scope\">"
    + "<button class=\"mv\" data-mv=\"-1\">‹</button>"
    + "<span class=\"monthbar\"><span class=\"ym\">" + esc(범위말) + "</span></span>"
    + "<button class=\"mv\" data-mv=\"1\">›</button>"
    + "<span class=\"seg\">"
    + ["month","year","all"].map(function(v){
        var 이름 = v === "month" ? "월" : v === "year" ? "연" : "전체";
        return "<button data-scope=\"" + v + "\"" + (S.scope === v ? " class=\"on\"" : "") + ">" + 이름 + "</button>";
      }).join("")
    + "</span>"
    + (그만둔수 ? "<button class=\"chip" + (S.showLeft ? " on" : "") + "\" data-left=\"1\">그만둔 사람 " + 그만둔수 + "명</button>" : "")
    + "<span class=\"sp\" style=\"margin-left:auto\"></span>"
    + "<span class=\"muted\" style=\"font-size:11.5px\">" + esc(범위말) + " 이음센터 근무 합계 <b>" + 합계 + "</b>회</span>"
    + "</div>"
    + (표
        ? "<table class=\"ppl\"><tr><th>이름</th><th>구분</th><th style=\"width:64px\">근무</th>"
          + "<th>나간 날</th><th style=\"width:56px\">강의</th><th>비고</th></tr>" + 표 + "</table>"
        : "<div class=\"later\"><p>이 범위에 이음센터 사람이 없습니다.</p></div>")
    + "</div>";
}

/* ── 이음센터 · 외부 공유 뷰 ──────────────────────────────────────────
   외부 노무사·변호사에게 «제 근무일만» 보여 주는 개인 링크다.
   ⚠ 링크를 «만드는» 것과 공개 일정을 «내보내는» 것은 아직 이알피에서 한다 —
     그 둘은 외부에 무엇이 나가는지를 정하는 일이라, 한 자리에서만 하는 것이 옳다. */
function shareHtml(){
  var ext = arr(D.external_staff).filter(function(x){ return x && x.active !== false; });
  var 있는것 = ext.filter(function(x){ return x.shareKey; });
  var 없는것 = ext.filter(function(x){ return !x.shareKey; });
  /* 주소를 짓는 자리 — 이알피와 «같은 규칙»이어야 한다.
     ⚠ https 가 아니면(파일로 열었을 때 등) location.origin 이 「null」이라
       nullxxx 같은 못 쓰는 주소가 나온다. 그때는 배포 주소로 물러선다.
     ⚠ 이 주소는 «밖으로» 나간다 — 그럴듯한데 안 열리는 주소가 가장 나쁘다
       (받은 사람은 우리가 아니라 제 폰을 탓한다). */
  var base = (location.protocol === "https:")
    ? location.origin + location.pathname.replace(/[^\/]*$/, "ieum-view.html")
    : IEUM_VIEW_BASE;
  var 줄 = 있는것.map(function(x){
    var url = base + "?k=" + encodeURIComponent(x.shareKey);
    return "<tr><td><span class=\"dot2\" style=\"background:" + esc(x.color||"#d97706") + "\"></span>" + esc(x.name) + "</td>"
      + "<td><span class=\"kindtag " + (String(x.role||"").indexOf("변호사")>=0 ? "law" : "ex") + "\">" + esc(x.role||"외부") + "</span></td>"
      + "<td><div class=\"lnkrow\"><code title=\"" + esc(url) + "\">" + esc(url) + "</code>"
      + "<button class=\"btn ghost\" data-copy=\"" + esc(url) + "\">복사</button>"
      + "<button class=\"btn ghost\" data-open=\"" + esc(url) + "\">열기</button></div></td></tr>";
  }).join("");
  return "<div class=\"note\"><span>🔗 링크 만들기와 공개 일정 내보내기는 푸른이알피에서 합니다 — 여기서는 보고 복사합니다.</span>"
    + "<span class=\"sp\"></span><button class=\"btn\" data-erp=\"dash/ieum\">이알피에서 하기</button></div>"
    + "<div class=\"panel\">"
    + (줄 ? "<table class=\"ppl\"><tr><th style=\"width:130px\">이름</th><th style=\"width:100px\">구분</th><th>개인 링크</th></tr>" + 줄 + "</table>"
          : "<div class=\"later\"><p>아직 만들어진 개인 링크가 없습니다.</p></div>")
    + (없는것.length
        ? "<div class=\"note\" style=\"margin-top:11px\"><span>링크가 아직 없는 사람 " + 없는것.length + "명: "
          + esc(없는것.map(function(x){ return x.name; }).join(" · ")) + "</span></div>"
        : "")
    + "</div>";
}

/* ── 넣고 고치기 ──────────────────────────────────────────────────────
   ⚠ 저장은 반드시 js/pu-cal-write.js 의 관문을 지난다. 여기서 질러가지 말 것 —
     마감된 달 · 번호 없는 항목 · 아직 배열인 표가 그 문에서만 걸린다. */
function recOf(store, id){
  var list = arr(D[store]);
  for(var i=0;i<list.length;i++) if(list[i] && list[i].id===id) return list[i];
  return null;
}
function openNew(ymd){
  S.modal = { mode:"new", kind:"sch", date:ymd, sid:(ME&&ME.sid)||"", type:"leave", title:"", note:"", hours:1 };
  render();
}
function openEdit(store, id){
  var r = recOf(store, id);
  if(!r){ toast("그 건을 못 찾았습니다 — 새로 받아 오는 중일 수 있습니다"); return; }
  S.modal = { mode:"edit", store:store, id:id, kind:(store==="my_schedules"?"sch":"att"),
    date:r.date||"", sid:r.sid||"", type:r.type||"leave", title:r.title||"", note:r.note||"",
    hours:r.hours||1, prev:r };
  render();
}
function closeModal(){ S.modal = null; S.busy = false; render(); }
function toast(t){ S.toast = t; render(); setTimeout(function(){ if(S.toast===t){ S.toast=""; render(); } }, 3200); }

    + (새것 ? "<div class=\"fld\"><label>무엇을</label><select data-m=\"kind\">"
        + "<option value=\"sch\""+(일정?" selected":"")+">📅 일정</option>"
        + "<option value=\"att\""+(일정?"":" selected")+">🏖️ 연차·근태</option></select></div>" : "")
    + "<div class=\"fld\"><label>날짜</label><input type=\"date\" data-m=\"date\" value=\""+esc(m.date)+"\"></div>"
    + "<div class=\"fld\"><label>누구</label><select data-m=\"sid\">"

            + esc(u.name||u.sid)+"</option>"; }).join("") + "</select></div>"
    + (일정
        ? "<div class=\"fld\"><label>무슨 일</label><input data-m=\"title\" value=\""+esc(m.title)+"\" placeholder=\"가나상사 컨설팅 2차\"></div>"
        : "<div class=\"fld\"><label>유형</label><select data-m=\"type\">"
            + 유형들.map(function(t){ return "<option value=\""+esc(t.code)+"\""+(t.code===m.type?" selected":"")+">"
                + esc(t.icon+" "+PuWork.labelFor(t.code,"calendar"))+"</option>"; }).join("")
            + "</select></div>"
          + (m.type==="leave-hour"
              ? "<div class=\"fld\"><label>몇 시간</label><input type=\"number\" min=\"1\" max=\"8\" data-m=\"hours\" value=\""+esc(m.hours)+"\"></div>"
              : ""))
    + "<div class=\"fld\"><label>메모</label><input data-m=\"note\" value=\""+esc(m.note)+"\" placeholder=\"안 적어도 됩니다\"></div>"
    + "<div class=\"mbtns\">"
    + (새것 ? "" : "<button class=\"btn danger\" data-act=\"del\""+(S.busy?" disabled":"")+">지우기</button>")
    + "<span class=\"sp\"></span>"
    + "<button class=\"btn ghost\" data-close=\"1\">그만</button>"
    + "<button class=\"btn\" data-act=\"save\""+(S.busy?" disabled":"")+">"+(S.busy?"저장 중…":"저장")+"</button>"
    + "</div></div>";
}

/* 창에서 무엇을 고쳤는지 그때그때 담아 둔다 — 다시 그려도 안 날아가게 */
function modalRead(){
  var m = S.modal; if(!m) return;
  ["kind","date","sid","type","title","note","hours"].forEach(function(f){
    var el = document.querySelector("[data-m='"+f+"']");
    if(el) m[f] = el.value;
  });
}

function doSave(){
  modalRead();
  var m = S.modal; if(!m || S.busy) return;
  var 일정 = m.kind==="sch";
  var store = 일정 ? "my_schedules" : "attendance_records";
  if(!m.date){ m.err = "날짜를 골라 주세요"; render(); return; }
  if(일정 && !String(m.title||"").trim()){ m.err = "무슨 일인지 적어 주세요"; render(); return; }
  var id = m.mode==="edit" ? m.id : PuCalWrite.newId(일정 ? "sch" : "att");
  var item = { id:id, date:m.date, sid:m.sid, note:String(m.note||"") };
  if(일정) item.title = String(m.title).trim();
  else { item.type = m.type; item.hours = PuWork.hoursOf(m.type, m.hours); }
  /* 고치는 것이면 «내가 보던 판»을 함께 넘긴다 — 바뀐 칸만 보내고,
     원래 있던 달이 잠겼는지도 그것으로 본다. */
  var prev = m.mode==="edit" ? (recOf(store, id) || m.prev) : null;
  S.busy = true; m.err = ""; render();
  PuCalWrite.save(store, item, prev).then(function(r){
    S.busy = false;
    if(!r.ok){ m.err = r.message; render(); return; }
    var 고침 = m.mode==="edit";
    closeModal();
    toast(고침 ? "✅ 고쳤습니다" : "✅ 넣었습니다");
    refreshOne(store);
  });
}

function doDelete(){
  var m = S.modal; if(!m || m.mode!=="edit" || S.busy) return;
  if(!confirm("이 건을 지울까요?")) return;
  var prev = recOf(m.store, m.id) || m.prev;
  S.busy = true; m.err = ""; render();
  PuCalWrite.remove(m.store, m.id, prev).then(function(r){
    S.busy = false;
    if(!r.ok){ m.err = r.message; render(); return; }
    var st = m.store;
    closeModal(); toast("🗑 지웠습니다"); refreshOne(st);
  });
}

/* 바뀐 표 하나만 다시 받는다 — 나머지는 그대로 둔다 */
function refreshOne(store){
  PuCalRead.readOnce(store).then(function(v){ D[store]=v; render(); }).catch(function(){});
}

/* ── 그리기 ────────────────────────────────────────────────────────── */
function renderTabs(){
  var last = '';
  $('tabs').innerHTML = TABS.map(function(t){
    var head = '';
    if(t.g !== last){ head = (last ? '<span class="tsep"></span>' : '') + '<span class="gl">'+esc(t.g)+'</span>'; last = t.g; }
    /* 이음 쪽은 글자를 파랗게 — 금 하나만으로는 어느 묶음인지 눈이 못 가른다 */
    var eum = t.g === '이음센터' ? ' eum' : '';
    return head + '<button class="tab'+eum+(S.tab===t.v?' on':'')+'" data-t="'+esc(t.v)+'">'+esc(t.label)+'</button>';
  }).join('');
}

function render(){
  renderTabs();
  var tab = TABS.filter(function(t){ return t.v===S.tab; })[0] || TABS[0];
  var html;
  if(tab.v==='cal' || tab.v==='eumcal'){
    var eumOnly = tab.v==='eumcal';
    html = failedHtml() + formNote() + lockNote()
      + '<div class="panel">' + monthbarHtml() + chipsHtml(eumOnly) + calendarHtml(eumOnly) + legendHtml()
      + '<div class="muted" style="font-size:11px;margin-top:7px">빈 칸을 누르면 새로 넣고, 일을 누르면 고칩니다.</div></div>';
  } else if(tab.v==='eumppl'){
    html = failedHtml() + peopleHtml();
  } else if(tab.v==='eumshare'){
    html = failedHtml() + shareHtml();
  } else {
    html = laterHtml(tab);
  }
  html += modalHtml();
  if(S.toast) html += '<div id="toast">' + esc(S.toast) + '</div>';
  $('app').innerHTML = html;
}

/* 누르는 것은 한 자리에서 받는다 — 단추마다 붙이면 다시 그릴 때 하나씩 샌다 */
document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-t],[data-mv],[data-f],[data-erp],[data-close],[data-act],[data-ev],[data-day],[data-scope],[data-left],[data-copy],[data-open]') : null;
  if(!t) return;
  if(t.hasAttribute('data-t')){ S.tab = t.getAttribute('data-t'); if(S.tab==='eumcal') S.filter=null; render(); return; }
  if(t.hasAttribute('data-mv')){
    var mv = +t.getAttribute('data-mv');
    if(mv===0){ S.ym = ymOf(new Date()); }
    else if(S.tab==='eumppl' && S.scope==='year'){
      var y=new Date(S.ym+'-01'); y.setFullYear(y.getFullYear()+mv); S.ym = ymOf(y);
    }
    else { var d=new Date(S.ym+'-01'); d.setMonth(d.getMonth()+mv); S.ym = ymOf(d); }
    render(); return;
  }
  if(t.hasAttribute('data-scope')){ S.scope = t.getAttribute('data-scope'); render(); return; }
  if(t.hasAttribute('data-left')){ S.showLeft = !S.showLeft; render(); return; }
  if(t.hasAttribute('data-copy')){ copyLink(t.getAttribute('data-copy')); return; }
  if(t.hasAttribute('data-open')){ window.open(t.getAttribute('data-open'), '_blank', 'noopener'); return; }
  if(t.hasAttribute('data-f')){ modalRead(); var f=t.getAttribute('data-f'); S.filter = f || null; render(); return; }
  if(t.hasAttribute('data-erp')){ goErp(t.getAttribute('data-erp')); return; }
  if(t.hasAttribute('data-close')){ closeModal(); return; }
  if(t.hasAttribute('data-act')){
    if(t.getAttribute('data-act')==='save') doSave(); else doDelete();
    return;
  }
  /* 일을 누르면 그 건을 연다. 칸의 빈 자리를 누르면 새로 넣는다.
     ⚠ 일 쪽을 «먼저» 본다 — 일은 칸 «안»에 있어 칸도 함께 걸린다. */
  if(t.hasAttribute('data-ev')){
    var ev = t.getAttribute('data-ev').split(':');
    openEdit(ev[0], ev.slice(1).join(':'));
    return;
  }
  if(t.hasAttribute('data-day')){ openNew(t.getAttribute('data-day')); return; }
});

/* 링크 복사 — 못 하는 자리(https 아님·권한 거절)에서는 «됐다»고 하지 않는다.
   「복사됐습니다」는 말만 뜨고 실제로는 안 붙는 것이 가장 나쁘다. */
function copyLink(url){
  function 실패(){ toast('복사가 안 됩니다 — 링크를 길게 눌러 직접 복사해 주세요'); }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ toast('📋 링크를 복사했습니다'); }, 실패);
      return;
    }
  }catch(e){}
  실패();
}

/* 이알피로 — 창은 «하나»만 쓴다(새 탭을 자꾸 만들지 않는다) */
function goErp(menu){
  var url = 'pu-erp.html?sso=1' + (menu ? '#menu='+encodeURIComponent(menu) : '');
  try { if(window.PuAppBar && PuAppBar.goApp){ PuAppBar.goApp(url, 'erp'); return; } } catch(e){}
  location.href = url;
}
/* 유형을 시간연차로 바꾸면 «몇 시간» 칸이 생긴다 — 바뀔 때 다시 그린다.
   ⚠ 다시 그리기 전에 지금 적힌 것을 먼저 담는다(안 그러면 적던 것이 날아간다). */
document.addEventListener('change', function(e){
  if(!S.modal || !e.target || !e.target.hasAttribute || !e.target.hasAttribute('data-m')) return;
  var f = e.target.getAttribute('data-m');
  if(f !== 'type' && f !== 'kind') return;
  modalRead(); render();
});
/* ESC 로 창을 닫는다 — 뒤로가기 층과 다투지 않게 여기서만 받는다 */
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && S.modal){ e.preventDefault(); closeModal(); }
});

$('goErp').onclick = function(){ goErp(''); };
$('logout').onclick = function(){ try{ firebase.auth().signOut(); }catch(e){} };

/* ── 시작 ──────────────────────────────────────────────────────────── */
function setConn(on, text){
  var c = $('conn');
  c.innerHTML = '<span class="dot'+(on?' on':'')+'"></span><span class="t">'+esc(text)+'</span>';
}

function start(user){
  PuCalRead.attach(fbDb);
  /* 저장 관문이 봐야 할 셋을 넘긴다 —
     ① 어느 달이 마감됐나 ② 그 표가 아직 배열인가 ③ 누가 고쳤나 */
  PuCalWrite.attach(fbDb, {
    lockedMonths: function(){ return arr(D.locked_attend_months); },
    formOf: function(k){ return PuCalRead.rawForm(k); },
    who: function(){ return (ME && ME.name) || (ME && ME.sid) || ''; }
  });
  S.ym = ymOf(new Date());
  setConn(true, '연결됨');
  PuCalRead.readMany(KEYS).then(function(r){
    D = r.data; FAILED = r.failed;
    ME = (function(){
      var us = users();
      for(var i=0;i<us.length;i++){ if(us[i].uid===user.uid || us[i].email===user.email) return us[i]; }
      return null;
    })();
    $('me').innerHTML = ME ? esc(ME.name||'') + '<span class="role">'+esc(ME.role||ME.position||'')+'</span>'
                           : '<span class="role">'+esc(user.email||'')+'</span>';
    render();
    /* 바뀐 한 건만 받아 다시 그린다 — 큰 표를 통째로 다시 받지 않는다 */
    ['attendance_records','my_schedules'].forEach(function(k){
      S.unwatch.push(PuCalRead.watch(k, function(){
        PuCalRead.readOnce(k).then(function(v){ D[k]=v; render(); }).catch(function(){});
      }));
    });
  }).catch(function(e){
    $('app').innerHTML = '<div class="panel"><h2 style="color:#dc2626">자료를 못 읽었습니다</h2>'
      + '<p class="muted">'+esc(e && e.message || e)+'</p>'
      + '<button class="btn" data-erp="dash/corp">푸른이알피에서 보기</button></div>';
  });
}

try{
  firebase.initializeApp(FB_CONFIG);
  fbDb = firebase.database();
  firebase.auth().onAuthStateChanged(function(u){
    if(u) start(u); else PuGate.show();
  });
}catch(e){
  $('app').innerHTML = '<div class="panel muted">초기화 실패: '+esc(e.message)+'</div>';
}
</script>
