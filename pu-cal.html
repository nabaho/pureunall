}

function doDelete(){
  var m = S.modal; if(!m || m.mode!=="edit" || S.busy) return;
  if(!confirm("이 건을 지울까요?")) return;
  var prev = recOf(m.store, m.id) || m.prev;
  S.busy = true; m.err = ""; render();
  /* 구글과 «이어진» 건이면 그쪽도 함께 지운다 — 우리만 지우면 구글에 남는다.
     ⚠ 이어진 근태가 지금 30건 있다(2026-09-20 실측). 이알피가 만들면서 이어 둔 것이다.
     ⚠ 구글부터 지운다. 우리 것을 먼저 지우면 «무엇을 지워야 하는지»를 잃는다.
     ⚠ 구글에서 못 지워도 우리 것은 지운다 — 그 대신 «못 지웠다»고 분명히 말한다
       (이알피가 여기서 데었다: 안 지워졌는데 「삭제됨」이라고 했다). */
  var 구글번호 = prev && prev.gcalEventId;
  var 구글말 = "";
  var 구글먼저 = (구글번호 && typeof PuGcalAuth !== "undefined")
    ? PuGcalAuth.deleteEvent(GCAL_CAL_ID, 구글번호)
        .then(function(){ 구글말 = ""; })
        ["catch"](function(e){
          구글말 = " ⚠ 구글 쪽은 못 지웠습니다(" + ((e && e.message) || "") + ")";
        })
    : Promise.resolve();

  구글먼저.then(function(){
    return PuCalWrite.remove(m.store, m.id, prev);
  }).then(function(r){
    S.busy = false;
    if(!r.ok){ m.err = r.message; render(); return; }
    var st = m.store;
    closeModal(); toast("🗑 지웠습니다" + 구글말); refreshOne(st);
    if(st === "attendance_records") 발행예약();
  });
}

/* ── 끌어서 다른 날로 옮기기 ─────────────────────────────────────────────
   대표 지시 2026-09-21 「둘다」 — 4걸음에서 법인 대시보드와 함께 사라진 것을 되살린다.

   ★ 어디에 손잡이를 다나 — 판(app) 한 곳이다. 칩마다 달면 다시 그릴 때마다 새로 달아야
     하고, 하나라도 빠지면 «어떤 것은 안 끌리는» 화면이 된다.
   ⚠ dragstart 는 거품처럼 위로 올라온다 — 바깥에서 preventDefault 를 하면 안쪽 끌기가
     통째로 죽는다(컨설팅일정이 이 덫에 일주일 걸렸다). 여기서는 바깥에서 막지 않는다.
   ⚠ 「놓을 수 있다」를 말해 주지 않으면 브라우저가 놓기를 아예 안 받는다 —
     dragover 에서 preventDefault 를 «해야» 놓을 수 있다. 헷갈리기 쉬운 반대다. */
var _끄는것 = null;
function 끌기손잡이(){
  var 판 = $('app'); if(!판 || 판._끌기달림) return;
  판._끌기달림 = true;
  판.addEventListener('dragstart', function(e){
    var t = e.target && e.target.closest ? e.target.closest('[data-drag]') : null;
    if(!t){ _끄는것 = null; return; }
    _끄는것 = t.getAttribute('data-drag');
    t.classList.add('dragging');
    try{ e.dataTransfer.setData('text/plain', _끄는것); e.dataTransfer.effectAllowed = 'move'; }catch(x){}
  });
  판.addEventListener('dragend', function(){
    _끄는것 = null;
    Array.prototype.forEach.call(판.querySelectorAll('.dragging,.dropon'),
      function(el){ el.classList.remove('dragging','dropon'); });
  });
  판.addEventListener('dragover', function(e){
    if(!_끄는것) return;
    var 칸 = e.target && e.target.closest ? e.target.closest('[data-day]') : null;
    if(!칸) return;
    e.preventDefault();                       /* ⚠ 이것이 있어야 놓을 수 있다 */
    try{ e.dataTransfer.dropEffect = 'move'; }catch(x){}
    if(!칸.classList.contains('dropon')){
      Array.prototype.forEach.call(판.querySelectorAll('.dropon'),
        function(el){ el.classList.remove('dropon'); });
      칸.classList.add('dropon');
    }
  });
  판.addEventListener('drop', function(e){
    var 칸 = e.target && e.target.closest ? e.target.closest('[data-day]') : null;
    var 끈것 = _끄는것;
    if(!칸 || !끈것) return;
    e.preventDefault();
    _끄는것 = null;
    옮기기(끈것, 칸.getAttribute('data-day'));
  });
}

/* 「store:id」와 새 날짜. 우리 것이면 저장 문으로, 구글 것이면 구글로. */
function 옮기기(끈것, 새날){
  if(S.busy) return;
  var i = String(끈것).indexOf(":");
  var store = String(끈것).slice(0, i), id = String(끈것).slice(i + 1);
  if(!store || !id || !새날) return;

  /* ── 구글 일정 ── */
  if(store === "gcal"){
    var ev = null;
    for(var k = 0; k < GCAL.evs.length; k++){ if(GCAL.evs[k].id === id){ ev = GCAL.evs[k]; break; } }
    if(!ev) return;
    if(ev.date === 새날) return;                    /* 제자리에 놓았다 */
    if(typeof PuGcalAuth === "undefined" || !PuGcalAuth.hasToken()){
      /* ⚠ 조용히 실패하지 않는다 — 안 옮겨졌는데 옮겨진 줄 알면 그날 사람이 안 온다 */
      toast("🔐 구글 로그인이 필요합니다 — 일정은 옮기지 못했습니다");
      return;
    }
    S.busy = true; render();
    PuGcalAuth.moveEvent(GCAL_CAL_ID, id, 새날).then(function(){
      S.busy = false;
      ev.date = 새날;                               /* 받아 둔 것을 고쳐 바로 보인다 */
      toast("✅ 구글 일정을 " + 새날 + " 로 옮겼습니다");
      render();
      gcalLoad(true);                               /* 진짜로 그리 됐는지 다시 받아 맞춘다 */
    })["catch"](function(err){
      S.busy = false;
      toast("❌ 구글 일정을 옮기지 못했습니다 — " + ((err && err.message) || ""));
      render();
    });
    return;
  }

  /* ── 우리 일정·근태 ── */
  var prev = recOf(store, id);
  if(!prev) return;
  if(prev.date === 새날) return;
  S.busy = true; render();
  /* ⚠ 바뀐 칸만 보낸다(date). 저장 문이 «옛 달·새 달»을 둘 다 보고 잠금을 판단한다. */
  PuCalWrite.save(store, { id:id, date:새날 }, prev).then(function(r){
    S.busy = false;
    if(!r.ok){ toast("❌ " + (r.message || "옮기지 못했습니다")); render(); return; }
    toast("✅ " + 새날 + " 로 옮겼습니다");
    refreshOne(store);
    if(store === "attendance_records") 발행예약();
  })["catch"](function(err){
    S.busy = false;
    toast("❌ 옮기지 못했습니다 — " + ((err && err.message) || ""));
    render();
  });
}

/* 바뀐 표 하나만 다시 받는다 — 나머지는 그대로 둔다 */
function refreshOne(store){
  PuCalRead.readOnce(store).then(function(v){ D[store]=v; render(); }).catch(function(){});
}

/* ── 그리기 ────────────────────────────────────────────────────────── */
function renderTabs(){
  var last = '';
  var 탭들 = TABS.map(function(t){
    var head = '';
    if(t.g !== last){ head = (last ? '<span class="tsep"></span>' : '') + '<span class="gl">'+esc(t.g)+'</span>'; last = t.g; }
    /* 이음 쪽은 글자를 파랗게 — 금 하나만으로는 어느 묶음인지 눈이 못 가른다 */
    var eum = t.g === '이음센터' ? ' eum' : '';
    return head + '<button class="tab'+eum+(S.tab===t.v?' on':'')+'" data-t="'+esc(t.v)+'">'+esc(t.label)+'</button>';
  }).join('');
  /* ★ 사람 칩을 탭 줄 «오른쪽 끝»에 얹는다 (대표 지시 2026-09-19 「캡쳐1은 캡쳐2 줄에 넣어라」).
     탭은 왼쪽 절반도 안 쓰는데 칩은 제 줄을 따로 차지하고 있었다 — 한 줄을 통째로 아낀다.
     ⚠ 달력을 보는 탭에서만 얹는다. 직원별 업무·분석에는 «걸러 낼 것»이 없어
       칩이 아무 일도 안 하면서 자리만 먹는다. */
  var 칩 = (S.tab === 'cal' || S.tab === 'eumcal')
    ? '<span class="tabchips">' + chipsHtml(S.tab === 'eumcal') + '</span>' : '';
  $('tabs').innerHTML = 탭들 + 칩;
}

function render(){
  renderTabs();
  var tab = TABS.filter(function(t){ return t.v===S.tab; })[0] || TABS[0];
  var html;
  if(tab.v==='cal' || tab.v==='eumcal'){
    var eumOnly = tab.v==='eumcal';
      /* ⚠ 맨 위 띠를 안 둔다 — 달력은 이알피와 «같아야» 한다(대표 지시 2026-09-18).
         못 고치는 까닭은 «고치려 할 때» 그 자리에서 말한다(창 안에서). */
    html = failedHtml() + lockNote()
      + '<div class="calwrap">' + calheadHtml(eumOnly) + calendarHtml(eumOnly) + '</div>';
  } else if(tab.v==='eumppl'){
    html = failedHtml() + peopleHtml();
  } else if(tab.v==='eumshare'){
    html = failedHtml() + shareHtml();
  }
  var 달력 = (tab.v === "cal" || tab.v === "eumcal");
  if(달력) html += 펼침Html(tab.v === "eumcal");
  html += modalHtml();
  html += mailmapHtml();
  html += colorsHtml();
  html += noteHtml();
  if(S.toast) html += '<div id="toast">' + esc(S.toast) + '</div>';
  $('app').innerHTML = html;
  끌기손잡이();   /* 판이 새로 그려져도 손잡이는 한 번만 달린다 */
  /* 달력 탭에서만 화면에 «딱» 맞춘다 — 다른 탭은 여느 때처럼 제 안에서 굴러간다 */
  $('app').className = 달력 ? 'fit' : '';
  if(달력){
    펼침자리();
    /* 그려 놓고 재서, 한 칸에 들어가는 수가 달라졌으면 «한 번만» 다시 그린다.
       ⚠ 용량재기() 는 값이 바뀔 때만 참이다 — 그래서 돌고 돌지 않는다.
         그래도 빗장을 하나 더 건다(창 크기가 계속 바뀌는 동안을 위해). */
    if(!_다시그리는중){
      if(용량재기()){
        _다시그리는중 = true;
        try{ render(); } finally{ _다시그리는중 = false; }
      } else if(!_칸용량){
        /* ⚠ «첫 그림»에서는 판의 높이가 아직 0 이라 못 잰다 — 그러면 어림값(5)이
           그대로 남아 칸이 넘친다(2026-09-19 에 실제로 그랬다).
           다음 칸에 한 번 더 재 본다. 그때는 자리가 잡혀 있다. */
        requestAnimationFrame(function(){ if(!_다시그리는중 && 용량재기()) render(); });
      }
    }
  }
}
var _다시그리는중 = false;

/* 창 크기가 바뀌면 한 칸에 들어가는 수도 바뀐다 — 잦은 신호라 한 박자 쉬고 그린다 */
var _크기타이머 = null;
window.addEventListener('resize', function(){
  if(_크기타이머) clearTimeout(_크기타이머);
  _크기타이머 = setTimeout(function(){ _크기타이머 = null; render(); }, 150);
});

/* 누르는 것은 한 자리에서 받는다 — 단추마다 붙이면 다시 그릴 때 하나씩 샌다 */
/* 자물쇠 없이 닫는 길 하나 더 — 창이 떠 있을 때 ESC */
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && S.open){ S.open = null; render(); }
});
document.addEventListener('click', function(e){
  /* 펼침 창은 «바깥을 누르면» 닫힌다 — 창 안을 누른 것은 그대로 둔다 */
  if(S.open && !(e.target.closest && e.target.closest(".pop"))
     && !(e.target.closest && e.target.closest("[data-more]"))){
    S.open = null; render();
  }
  var t = e.target.closest ? e.target.closest('[data-t],[data-mv],[data-f],[data-erp],[data-close],[data-mmopen],[data-copen-all],[data-copen],[data-cset],[data-pub],[data-newkey],[data-note-open],[data-noteact],[data-glogin],[data-act],[data-ev],[data-day],[data-scope],[data-left],[data-copy],[data-open],[data-view],[data-toggle],[data-more],[data-popclose]') : null;
  if(!t) return;
  if(t.hasAttribute('data-t')){ S.tab = t.getAttribute('data-t'); if(S.tab==='eumcal') S.filter=null; S.open = null; render(); return; }
  if(t.hasAttribute('data-mv')){
    var mv = +t.getAttribute('data-mv');
    if(mv===0){ S.ym = ymOf(new Date()); S.date = todayYMD(); }
    else if(S.tab==='eumppl' && S.scope==='year'){
      var y=new Date(S.ym+'-01'); y.setFullYear(y.getFullYear()+mv); S.ym = ymOf(y);
    }
    /* 달력에서는 보기에 따라 옮기는 폭이 다르다 — 월은 한 달, 주는 이레, 일은 하루 */
    else if((S.tab==='cal'||S.tab==='eumcal') && S.view!=='month'){
      S.date = shiftDay(S.date, S.view==='week' ? mv*7 : mv);
      S.ym = S.date.slice(0,7);
    }
    else { var d=new Date(S.ym+'-01'); d.setMonth(d.getMonth()+mv); S.ym = ymOf(d); }
    render(); return;
  }
  if(t.hasAttribute('data-gcalretry')){ gcalLoad(true); return; }
  if(t.hasAttribute('data-view')){
    S.view = t.getAttribute('data-view');
    if(!S.date) S.date = todayYMD();
    /* 주·일에서 월로 돌아오면 «보고 있던 날»의 달을 편다 — 엉뚱한 달로 튀지 않게 */
    if(S.view==='month') S.ym = S.date.slice(0,7);
    render(); return;
  }
  if(t.hasAttribute('data-scope')){ S.scope = t.getAttribute('data-scope'); render(); return; }
  if(t.hasAttribute('data-left')){ S.showLeft = !S.showLeft; render(); return; }
  /* 인원 현황 — 행을 누르면 그 사람의 월별 상세를 편다. 연락처·비고 칸 클릭은 걸러 준다 */
  if(t.hasAttribute('data-toggle')){
    var pk = t.getAttribute('data-toggle');
    var n2 = Object.assign({}, S.openRows); n2[pk] = !n2[pk]; S.openRows = n2;
    render(); return;
  }
  if(t.hasAttribute('data-copy')){ copyLink(t.getAttribute('data-copy')); return; }
  if(t.hasAttribute('data-open')){ window.open(t.getAttribute('data-open'), '_blank', 'noopener'); return; }
  if(t.hasAttribute('data-f')){ modalRead(); var f=t.getAttribute('data-f'); S.filter = f || null; render(); return; }
  if(t.hasAttribute('data-erp')){ goErp(t.getAttribute('data-erp')); return; }
  /* 비고는 줄 «안»의 단추다 — 줄 펼치기(data-toggle)보다 먼저 잡아야 한다 */
  if(t.hasAttribute('data-copen-all')){ openColors(); return; }
  if(t.hasAttribute('data-copen')){
    var _cs = t.getAttribute('data-copen');
    if(S.colors){ S.colors.pick = (S.colors.pick === _cs) ? "" : _cs; render(); }
    return;
  }
  if(t.hasAttribute('data-cset')){
    var _cv = String(t.getAttribute('data-cset')).split('|');
    색고르기(_cv[0], _cv[1]);
    return;
  }
  if(t.hasAttribute('data-note-open')){ e.stopPropagation(); openNote(t.getAttribute('data-note-open')); return; }
  if(t.hasAttribute('data-noteact')){ saveNote(); return; }
  if(t.hasAttribute('data-glogin')){ 구글로그인(); return; }
  if(t.hasAttribute('data-mmopen')){ openMailMap(); return; }
  if(t.hasAttribute('data-pub')){ 발행하기(false); return; }
  if(t.hasAttribute('data-newkey')){ 링크발급(t.getAttribute('data-newkey')); return; }
  /* 닫기 — 잇기 창이 열려 있으면 그것부터 닫는다(둘이 겹쳐 뜨지 않는다) */
  if(t.hasAttribute('data-close')){ if(S.note) closeNote(); else if(S.colors) closeColors(); else if(S.mailmap) closeMailMap(); else closeModal(); return; }
  if(t.hasAttribute('data-act')){
    if(t.getAttribute('data-act')==='save') doSave(); else doDelete();
    return;
  }
  /* 일을 누르면 그 건을 연다. 칸의 빈 자리를 누르면 새로 넣는다.
     ⚠ 일 쪽을 «먼저» 본다 — 일은 칸 «안»에 있어 칸도 함께 걸린다. */
  /* 「+N개 더」 — 그 날을 그 자리에서 펼친다(다른 화면으로 안 간다) */
  if(t.hasAttribute('data-more')){
    var 날 = t.getAttribute('data-more');
    S.open = (S.open === 날) ? null : 날;
    render(); return;
  }
  if(t.hasAttribute('data-popclose')){ S.open = null; render(); return; }
  if(t.hasAttribute('data-ev')){
    var ev = t.getAttribute('data-ev').split(':');
    /* 구글에서 온 일정은 «구글에서» 고친다 — 우리가 손대면 두 곳이 갈린다.
       ⚠ 열쇠로 읽기만 하는 길이라 우리에겐 고칠 권한이 아예 없다. */
    if(ev[0] === 'gcal'){ openGcal(ev.slice(1).join(':')); return; }
    openEdit(ev[0], ev.slice(1).join(':'));
    return;
  }
  if(t.hasAttribute('data-day')){ openNew(t.getAttribute('data-day')); return; }
});

/* 링크 복사 — 못 하는 자리(https 아님·권한 거절)에서는 «됐다»고 하지 않는다.
   「복사됐습니다」는 말만 뜨고 실제로는 안 붙는 것이 가장 나쁘다. */
function copyLink(url){
  function 실패(){ toast('복사가 안 됩니다 — 링크를 길게 눌러 직접 복사해 주세요'); }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ toast('📋 링크를 복사했습니다'); }, 실패);
      return;
    }
  }catch(e){}
  실패();
}

/* 이알피로 — 창은 «하나»만 쓴다(새 탭을 자꾸 만들지 않는다) */
function goErp(menu){
  var url = 'pu-erp.html?sso=1' + (menu ? '#menu='+encodeURIComponent(menu) : '');
  try { if(window.PuAppBar && PuAppBar.goApp){ PuAppBar.goApp(url, 'erp'); return; } } catch(e){}
  location.href = url;
}
/* 유형을 시간연차로 바꾸면 «몇 시간» 칸이 생긴다 — 바뀔 때 다시 그린다.
   ⚠ 다시 그리기 전에 지금 적힌 것을 먼저 담는다(안 그러면 적던 것이 날아간다). */
/* 일정 검색 — 치는 대로 거른다.
   ⚠ 다시 그리면 칸이 새로 생겨 «적던 글자와 커서»를 잃는다. 그래서 그린 뒤
     그 칸에 값을 도로 넣고 커서를 끝으로 돌려 준다. 안 그러면 한 글자마다 칸이 튄다. */
document.addEventListener('input', function(e){
  if(!e.target || e.target.id !== 'calq') return;
  S.q = e.target.value;
  render();
  var el = document.getElementById('calq');
  if(el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(_){} }
});

/* 계정 잇기 — 고르면 «바로» 저장한다(따로 저장 단추를 두지 않는다) */
document.addEventListener('change', function(e){
  if(!S.mailmap || !e.target || !e.target.hasAttribute || !e.target.hasAttribute('data-mm')) return;
  잇기저장(e.target.getAttribute('data-mm'), e.target.value);
});
document.addEventListener('change', function(e){
  if(!S.modal || !e.target || !e.target.hasAttribute || !e.target.hasAttribute('data-m')) return;
  var f = e.target.getAttribute('data-m');
  if(f !== 'type' && f !== 'kind') return;
  modalRead(); render();
});
/* ESC 로 창을 닫는다 — 뒤로가기 층과 다투지 않게 여기서만 받는다 */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  if(S.note){ e.preventDefault(); closeNote(); return; }
  if(S.mailmap){ e.preventDefault(); closeMailMap(); return; }
  if(S.modal){ e.preventDefault(); closeModal(); }
});

$('goErp').onclick = function(){ goErp(''); };
$('logout').onclick = function(){ try{ firebase.auth().signOut(); }catch(e){} };
$('themeToggle').onclick = themeToggle;
themeInit();

/* ── 시작 ──────────────────────────────────────────────────────────── */
function setConn(on, text){
  var c = $('conn');
  c.innerHTML = '<span class="dot'+(on?' on':'')+'"></span><span class="t">'+esc(text)+'</span>';
}

function start(user){
  PuCalRead.attach(fbDb);
  /* 저장 관문이 봐야 할 셋을 넘긴다 —
     ① 어느 달이 마감됐나 ② 그 표가 아직 배열인가 ③ 누가 고쳤나 */
  PuCalWrite.attach(fbDb, {
    lockedMonths: function(){ return arr(D.locked_attend_months); },
    formOf: function(k){ return PuCalRead.rawForm(k); },
    who: function(){ return (ME && ME.name) || (ME && ME.sid) || ''; }
  });
  /* 구글 로그인에서 돌아왔으면 주소 꼬리에서 토큰을 꺼낸다(주소는 깨끗이 지운다) */
  try{ if(typeof PuGcalAuth !== "undefined" && PuGcalAuth.capture()) toast("✅ 구글에 연결됐습니다"); }catch(e){}
  S.ym = ymOf(new Date()); S.date = todayYMD();
  setConn(true, '연결됨');
  PuCalRead.readMany(KEYS).then(function(r){
    D = r.data; FAILED = r.failed;
    ME = (function(){
      var us = users();
      for(var i=0;i<us.length;i++){ if(us[i].uid===user.uid || us[i].email===user.email) return us[i]; }
      return null;
    })();
    $('me').innerHTML = ME ? esc(ME.name||'') + '<span class="role">'+esc(ME.role||ME.position||'')+'</span>'
                           : '<span class="role">'+esc(user.email||'')+'</span>';
    render();
    /* 구글 달력도 받는다 — 이 달력을 채우는 것이 그쪽이다(9월 126건).
       ⚠ 우리 자료를 먼저 그리고 그 다음 받는다 — 구글이 늦어도 화면은 먼저 뜬다. */
    gcalLoad();
    /* 바뀐 한 건만 받아 다시 그린다 — 큰 표를 통째로 다시 받지 않는다 */
    ['attendance_records','my_schedules'].forEach(function(k){
      S.unwatch.push(PuCalRead.watch(k, function(){
        PuCalRead.readOnce(k).then(function(v){ D[k]=v; render(); }).catch(function(){});
      }));
    });
  }).catch(function(e){
    $('app').innerHTML = '<div class="panel"><h2 style="color:#dc2626">자료를 못 읽었습니다</h2>'
      + '<p class="muted">'+esc(e && e.message || e)+'</p>'
      + '<button class="btn" onclick="location.reload()">다시 열기</button></div>';
  });
}

try{
  firebase.initializeApp(FB_CONFIG);
  fbDb = firebase.database();
  firebase.auth().onAuthStateChanged(function(u){
    if(u) start(u); else PuGate.show();
  });
}catch(e){
  $('app').innerHTML = '<div class="panel muted">초기화 실패: '+esc(e.message)+'</div>';
}
