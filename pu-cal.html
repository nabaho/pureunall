<style>
  :root{--acc:#2563eb;--acc2:#1e40af;--acc-soft:#eff6ff;--ink:#1e293b;--sub:#475569;--faint:#94a3b8;
    --line:#e2e8f0;--panel:#ffffff;--bg:#f8fafc;--ok:#166534;--warn:#854d0e;--warn-bg:#fffbeb;
    --danger:#dc2626;--radius:11px}
  /* 어두운판 — 수동 전환(대표 지시 2026-09-19 「2번 수동」). 밝은판 값은 위 그대로 두고
     여기서 «덧씌운다». 색은 전부 이미 쓰는 27색 + 흰/검 안에서 고른다(팔레트 검사).
     ⚠ 판(--panel)이 바탕(--bg)보다 «밝다» — 밝은판의 관계(카드가 바탕보다 밝다)를
       그대로 뒤집어 지킨다. --acc·--acc2·--danger 는 검게 배경 위에서도 잘 읽혀
       그대로 둔다(실측: 대비 5.9~6.1:1). */
  :root[data-theme="dark"]{--ink:#f8fafc;--sub:#94a3b8;--faint:#64748b;--line:#475569;
    --panel:#1e293b;--bg:#000000;--acc-soft:rgba(37,99,235,.16);--ok:#4ade80;
    --warn:#fbbf24;--warn-bg:#1e293b}
  *{box-sizing:border-box}
  /* ★ 화면 한 장에 담는다 (대표 지시 2026-09-19 「한화면에 나오게」).
     문서가 굴러가지 않게 몸통을 «세로 세 칸»으로 세운다 — 머리줄·탭줄·본문.
     본문만 제 안에서 굴러간다(달력 탭에서는 그것조차 안 굴러간다). */
  html,body{height:100%}
  body{margin:0;font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;color:var(--ink);
    background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;overflow:hidden}

  /* ── 머리줄 ──
     ⚠ 한 줄이다. 낱말 가운데서 잘려 두 줄이 되면 폰에서 화면을 갉아먹는다.
        넘치면 «줄이는» 것이지 «내리는» 것이 아니다. */
  /* sticky 가 필요 없어졌다 — 몸통이 안 굴러가므로 늘 맨 위다 */
  #topbar{flex:none;z-index:15;background:var(--panel);border-bottom:1px solid var(--line);
    padding:8px 16px;display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden}
  #topbar .brand{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;flex-shrink:0}
  #topbar .sp{margin-left:auto}
  #conn{font-size:12px;color:var(--sub);flex-shrink:0}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#cbd5e1;margin-right:5px}
  .dot.on{background:#16a34a}
  #me{font-size:12.5px;font-weight:700;flex-shrink:0;overflow:hidden;text-overflow:ellipsis}
  #me .role{color:var(--sub);font-weight:500;margin-left:4px}
  .lnk{font-size:12.5px;padding:5px 11px;border:1px solid var(--line);color:var(--sub);background:var(--panel);
    border-radius:8px;cursor:pointer;font-weight:700;flex-shrink:0}
  .lnk.go{border-color:#bfdbfe;color:var(--acc2)}

  /* ── 탭 한 줄 — 법인 셋 · 이음 셋 ── */
  #tabs{flex:none;display:flex;align-items:center;gap:3px;padding:7px 14px;background:var(--panel);
    border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
  .gl{font-size:10px;color:var(--faint);font-weight:700;margin:0 3px 0 0;flex-shrink:0}
  .tab{padding:5px 11px;border-radius:7px;font-size:12px;color:var(--sub);cursor:pointer;
    border:none;background:transparent;font-family:inherit;flex-shrink:0}
  .tab:hover{background:var(--bg)}
  .tab.eum{color:#2563eb}
  .tab.on{background:var(--acc2);color:#ffffff;font-weight:700}
  .tsep{width:1px;height:18px;background:#cbd5e1;margin:0 7px;flex-shrink:0}
  /* 탭 줄에 얹은 사람 칩 — 오른쪽 끝에 붙는다(왼쪽 탭과 안 섞이게) */
  .tabchips{margin-left:auto;display:flex;align-items:center;flex-shrink:0;padding-left:16px}
  .tabchips .chips{margin-bottom:0;flex-wrap:nowrap}

  #app{flex:1;min-height:0;overflow-y:auto;width:100%;padding:14px 16px 90px;max-width:1500px;margin:0 auto}
  /* ★ 달력 탭 — 한 화면에 «딱» 맞춘다. 좌우도 꽉 채운다(1500px 뚜껑을 벗긴다).
     칸에 안 들어가는 일정은 「+N개 더」로 접고, 누르면 그 자리에서 펼쳐 보인다
     (대표 지시 「달력안에 모든 내용 안보여도 된다. 펼서 볼수 있게 하면 된다」). */
  #app.fit{overflow:hidden;display:flex;flex-direction:column;max-width:none;padding:10px 12px 12px}
  #app.fit .calwrap{flex:1;min-height:0;display:flex;flex-direction:column}
  #app.fit .calhead{flex:none}
  #app.fit .cal{flex:1;min-height:0;display:flex;flex-direction:column}
  #app.fit .calhd{flex:none}
  #app.fit .calgrid{flex:1;min-height:0;grid-template-rows:repeat(6,1fr)}
  #app.fit .day{min-height:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
  .note{background:var(--warn-bg);border:1px solid #fde68a;border-radius:9px;padding:9px 13px;
    font-size:12px;color:var(--warn);margin-bottom:11px;display:flex;align-items:center;gap:9px}
  .note .sp{margin-left:auto}
  .btn{border:none;border-radius:7px;font-size:12px;font-weight:700;padding:6px 13px;cursor:pointer;
    font-family:inherit;background:var(--acc);color:#ffffff}
  .btn.ghost{background:var(--panel);color:var(--acc2);border:1px solid #bfdbfe}
  .muted{color:var(--sub)}

  /* ── 달력 — 치수는 이알피(법인 대시보드)에서 그대로 가져왔다 ──
     ⚠ 눈대중으로 고치지 말 것. 두 화면이 갈리면 대표님이 같은 것을 두 모양으로 보신다. */
  .calwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px 10px}

  /* 사람 칩 줄 — 색 동그라미 + 이름 두 글자 */
  .chips{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:7px}
  .allchip{padding:3px 9px;border:none;border-radius:10px;cursor:pointer;font-size:10.5px;font-weight:700;
    font-family:inherit;flex-shrink:0;background:var(--bg);color:#475569}
  .allchip.on{background:#1e293b;color:#ffffff}
  .pwrap{position:relative;flex-shrink:0;display:inline-flex}
  .pchip{width:26px;height:26px;border-radius:50%;border:2.5px solid transparent;color:#ffffff;
    font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;
    align-items:center;justify-content:center;box-sizing:border-box;padding:0;transition:transform .1s}
  .pchip.on{border-color:var(--ink);transform:scale(1.15)}
  /* 겹친 날 표 — 이알피와 같은 호박 바탕이다. 파랑이면 「좋은 소식」처럼 보인다.
     ⚠ 글자는 흰색이 아니라 «짙은 호박»이다 — 이알피는 흰 글자인데 호박 위 흰 글자는
       1.7:1 이라 사실상 안 읽힌다(색 검사가 잡았다). 뜻이 같은 색을 쓰되 읽히게 한다. */
  .pcount{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;
    background:#fbbf24;color:#854d0e;font-size:10px;font-weight:800;display:flex;align-items:center;
    justify-content:center;border:1.5px solid var(--panel);pointer-events:none;line-height:1;box-sizing:border-box}
  .chip{font-size:10.5px;border:1px solid #cbd5e1;border-radius:20px;padding:2px 10px;color:var(--sub);
    background:var(--panel);cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
  .chip.on{background:#1e40af;border-color:#1e40af;color:#ffffff;font-weight:700}
  .chip.warn{background:#fef2f2;border-color:#fecaca;color:#991b1b;font-weight:700}
  .chip[disabled]{opacity:.6;cursor:default}
  .srcsep{width:1px;height:18px;background:#cbd5e1;margin:0 4px;flex-shrink:0}

  /* 머리줄 — ◀ 2026-09 ▶ · 음력 · 오늘 · 월|주|일 · 사람 칩 … 검색(맨 오른쪽)
     ★ 셋을 «한 줄»에 둔다 (대표 지시 2026-09-19). 쌓으면 달력이 그만큼 아래로 밀린다. */
  .calhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px}
  .calhead .monthbar,.calhead .chips{margin-bottom:0}
  /* ⚠ 검색을 margin-left:auto 로 오른쪽 끝에 밀지 않는다 — 줄이 차면 그것만
       «둘째 줄로 떨어져» 도로 두 줄이 된다(2026-09-19 미리보기에서 그랬다).
       달바 바로 뒤에 붙여 두면 칩이 남는 자리를 먹고, 모자라면 칩부터 접힌다. */
  .monthbar{display:flex;align-items:center;gap:7px;white-space:nowrap;flex-wrap:wrap}
  .monthbar .ym{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
  .monthbar .lunrange{font-size:11px;color:var(--faint)}
  .mv{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:26px;height:26px;
    cursor:pointer;color:var(--sub);font-size:11px;font-family:inherit;padding:0}
  .todaybtn{padding:4px 10px;border:1px solid var(--line);background:var(--panel);border-radius:10px;
    cursor:pointer;font-size:11.5px;font-weight:600;color:var(--sub);font-family:inherit}
  .seg{display:inline-flex;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden}
  .seg button{padding:4px 12px;font-size:11.5px;font-weight:700;background:var(--panel);color:var(--sub);
    border:none;border-right:1px solid var(--line);cursor:pointer;font-family:inherit}
  .seg button:last-child{border-right:none}
  .seg button.on{background:#1e40af;color:#ffffff}
  .srch{position:relative;display:inline-flex;align-items:center}
  .srch .ic{position:absolute;left:7px;font-size:10px;pointer-events:none}
  .srch input{padding:4px 10px 4px 24px;font-size:11.5px;border:1px solid var(--line);border-radius:10px;
    width:130px;background:var(--panel);box-sizing:border-box;font-family:inherit;color:var(--ink)}

  /* 달력 몸통 */
  .cal{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
  .calhd{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg);font-size:11px;
    color:var(--sub);text-align:center}
  .calhd div{padding:5px 0;border-right:1px solid var(--line)}
  .calhd div:last-child{border-right:none}
  .calhd .sun{color:var(--danger)}
  .calhd .sat{color:var(--acc)}
  /* 여섯 줄 고정 — 달마다 표 높이가 들썩이지 않게 */
  /* ★ 여섯 줄을 «남은 높이»로 똑같이 나눈다 (대표 지시 2026-09-19 「한화면에 나오게」).
     한때는 줄이 내용에 따라 늘어났는데, 그러면 바쁜 달이 화면 밖으로 내려갔다.
     이제 판의 높이가 먼저 정해지고, 칸은 «들어가는 만큼»만 보인다(나머지는 펼쳐 본다).
     ⚠ 바닥값(minmax)을 다시 두지 말 것 — 그 순간 여섯 줄이 화면을 넘긴다. */
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr)}
  .day{min-height:104px;padding:5px 4px 3px;overflow:hidden;box-sizing:border-box;position:relative}
  /* 날짜 줄 — 칸 «가운데»에 「25 (13)」 처럼 날짜와 음력을 나란히 */
  .dline{display:flex;justify-content:center;align-items:center;gap:2px;margin-bottom:4px;padding:0 2px}
  /* 대표 지시 2026-09-20 「한글과 숫자가 좀더 진했으면」 — 400(보통)은 12px 에서
     연해 보인다. 600(약간 굵게)으로 올렸다. 색(--ink #1e293b)은 이미 짙어서 안 바꿨다. */
  .dnum{min-width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;
    padding:0 3px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink);background:transparent}
  /* 오늘 동그라미는 «숫자에만» — 음력까지 감싸면 알약처럼 길어진다 */
  .dnum.today{background:#2563eb;color:#ffffff;font-weight:700}
  .dnum.other{color:#94a3b8}
  .lun{font-size:10.5px;color:#94a3b8;line-height:1}
  .lun.other{color:#cbd5e1}
  .evs{display:flex;flex-direction:column;gap:1.5px}
  /* 한 칸은 «한 줄»이다 — 넘치면 … 로 줄이고 전문은 손대면 뜬다 */
  .ev{padding:1px 5px;border-radius:4px;font-size:11px;font-weight:500;line-height:16px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .ev b{font-weight:700;margin-right:3px}
  /* ── 끌어 옮기기 (5걸음) ──
     ⚠ «잡을 수 있는 것»과 아닌 것이 손끝에서 갈려야 한다 — 잡히지도 않는 것을
       한참 끌어 보고서야 아는 것이 제일 나쁘다. */
  .ev[draggable="true"]{cursor:grab}
  .ev[draggable="true"]:active{cursor:grabbing}
  .ev.dragging{opacity:.4}
  /* 놓을 칸 — 테두리만 준다. 바탕을 칠하면 그 칸의 칩 색이 안 보인다. */
  .day.dropon,.wcol.dropon,.dayview.dropon{outline:2px solid #2563eb;outline-offset:-2px}
  /* 공휴일은 칸 맨 위에 «띠»로 — 구글은 둥근 칩이 아니라 칸 옆까지 꽉 채운 띠를 쓴다
     (대표 지시 2026-09-20 「구글과 완벽하게 같게」 — 실제 화면을 재서 확인했다).
     .day 의 좌우 여백(4px)을 음수 마진으로 지워 옆까지 닿게 한다. 색 값(#fecaca·
     #991b1b)은 그대로다 — 팔레트·tests/cal-same-as-erp.test.js 가 색만 못 박는다. */
  .ev.hol{background:#fecaca;color:#991b1b;font-weight:600;cursor:default;
    border-radius:0;margin:0 -4px}
  .detailgrid.one{grid-template-columns:1fr}
  .lawcnt{font-size:12px;color:var(--sub)}
  .lawcnt b{color:var(--ink);font-size:12.5px}
  .notebtn{border:none;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;width:100%}
  .notebtn:hover .dash{color:var(--acc);text-decoration:underline}
  .modal textarea{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);color:var(--ink);resize:vertical}
  .pubmsg{font-size:11.5px;color:var(--ok);margin-left:9px}
  .pubat{font-size:11px;color:var(--faint);margin-left:9px}
  /* 계정 잇기 — 할 일이 있을 때만 머리줄에 뜬다(없으면 아예 안 그린다) */
  .glogin{font-size:11.5px;padding:4px 10px;border:1px solid #bfdbfe;background:var(--acc-soft);
    color:var(--acc2);border-radius:10px;cursor:pointer;font-family:inherit;font-weight:700;
    white-space:nowrap;flex-shrink:0;margin-left:auto}
  .glogin + .linkacct{margin-left:6px}
  .linkacct{font-size:11.5px;padding:4px 10px;border:1px solid #fde68a;background:var(--warn-bg);
    color:var(--warn);border-radius:10px;cursor:pointer;font-family:inherit;font-weight:700;
    white-space:nowrap;flex-shrink:0;margin-left:auto}
  .linkacct:hover{background:#fde68a}
  /* 검색칸이 맨 오른쪽 — 잇기 단추가 왼쪽으로 밀어 준다 */
  .calhead .linkacct + .srch{margin-left:8px}
  .mmnote{font-size:11.5px;color:var(--warn);background:var(--warn-bg);border:1px solid #fde68a;
    border-radius:8px;padding:7px 10px;margin-bottom:10px;line-height:1.5}

/* ⚠ 직원 명부는 «배열»로도, «사번이 열쇠인 지도»로도 올 수 있다.
   배열만 받으면 지도로 왔을 때 조용히 빈 목록이 되고 화면에 이름 대신 사번(S001)이 뜬다 —
   틀린 화면이 아니라 «맞는 척하는» 화면이라 더 나쁘다. 그래서 두 꼴을 다 받는다. */
/* 명부 전부 — 그만둔 사람까지. «이름을 찾을 때»만 쓴다. */
function allUsers(){
  var v = D.user_accounts;
  var list = Array.isArray(v) ? v
    : (v && typeof v === "object") ? Object.keys(v).map(function(k){
        var u = v[k];
        return (u && typeof u === "object") ? (u.sid ? u : Object.assign({ sid:k }, u)) : null;
      })
    : [];
  return list.filter(function(u){ return u && u.sid; });
}
/* ★ 현직만 — 칩·고르는 목록은 «반드시» 이것을 쓴다 (이알피 getActiveUsers 와 같은 기준).
   ⚠ 2026-09-18 대표 화면에서 사람 칩이 «서른셋» 나왔다. 명부 32명 가운데 현직은
     열뿐인데 그만둔 스물둘이 다 섞였다 — 이알피는 늘 열만 보여 준다.
     그만둔 사람을 칩에 두면 고를 수는 있는데 아무것도 안 나오고, 줄이 넘쳐
     정작 현직을 못 찾는다. */
function users(){
  return allUsers().filter(function(u){ return u.status === "active"; });
}
function userOf(sid){
  var us = allUsers();
  for(var i=0;i<us.length;i++) if(us[i].sid===sid) return us[i];
  return null;
}
/* ⚠ 이름은 «그만둔 사람까지» 찾는다 — 이알피도 그렇게 한다.
     지나간 이음 근무에 「장한돌 이음센터」라고 적혀 있어야지, 사번만 뜨면 못 읽는다. */
function nameOf(sid){ var u=userOf(sid); return u ? (u.name||sid) : sid; }
function externalOf(id){
  var xs = arr(D.external_staff);
  for(var i=0;i<xs.length;i++) if(xs[i] && xs[i].id===id) return xs[i];
  return null;
}
/* 직원 색 — 이알피가 정한 것을 그대로 쓴다. 여기서 새로 정하지 않는다
   (같은 사람이 두 앱에서 다른 색이면 그 색은 아무 뜻도 없어진다). */
function colorOf(sid){
  var m = D.staff_colors;
  if(m && typeof m==='object' && !Array.isArray(m) && m[sid]) return m[sid];
  return null;
}

/* ── 공휴일 ────────────────────────────────────────────────────────── */
function holidayOf(ymd){
  var hs = D.holidays;
  if(Array.isArray(hs)){
    for(var i=0;i<hs.length;i++){ if(hs[i] && hs[i].date===ymd) return hs[i].name||'공휴일'; }
    return '';
  }
  if(hs && typeof hs==='object' && hs[ymd]) return (hs[ymd].name||hs[ymd]) || '공휴일';
  return '';
}

     tests/cal-gcal-same-as-erp.test.js 가 이알피 소스와 맞대 본다. */
var GCAL_API_KEY = "AIzaSyA0I_VD_dvFo9CPCDrPCiewcnuG0VeTkuo";

/* 구글이 쓰는 색표 — 사람이 구글에서 «고른» 색을 그대로 쓰려면 이 표가 있어야 한다.
   ⚠ 색표를 «먼저» 받고 일정을 받는다 — 순서가 뒤바뀌면 첫 그림에 색이 빠진다. */
function gcalLoadColors(){
  if(window._gcalColors) return Promise.resolve(window._gcalColors);
  return fetch("https://www.googleapis.com/calendar/v3/colors?key=" + GCAL_API_KEY)
    .then(function(r){ return r.json(); })
    .then(function(d){
      var m = {}, ev = (d && d.event) || {};
      Object.keys(ev).forEach(function(k){ if(ev[k] && ev[k].background) m[String(k)] = ev[k].background; });
      window._gcalColors = m; return m;
    })
    .catch(function(){ window._gcalColors = {}; return window._gcalColors; });
}
/* 색을 고를 때 쓰는 목록 — 구글 색표에서 중복을 뺀 것.
   ⚠ 새 색을 만들지 않는다. 같은 사람이 볼 때마다 색이 바뀌면 색으로 사람을 못 알아본다. */
function gcalPalette(){
  var m = window._gcalColors;
  if(!m) return null;
  var ks = Object.keys(m).sort(function(a,b){ return (parseInt(a,10)||0) - (parseInt(b,10)||0); });
  var out = [];
  ks.forEach(function(k){ if(m[k] && out.indexOf(m[k]) < 0) out.push(m[k]); });
  return out.length ? out : null;
}
/* ── 사람 색 «채워 넣기» ────────────────────────────────────────────────
   캘린더를 한 곳으로 모으기 1걸음 (대표 지시 2026-09-20 「0부터 순서대로」).

   ★ 왜 여기로 왔나
     data/staff_colors 를 «쓰는 곳»이 이알피 법인 대시보드 한 곳뿐이었다.
     그 화면을 걷어내면 새로 온 직원에게 색이 영영 안 생기고, 컨설팅일정도
     같은 자리를 읽으므로 두 앱이 함께 회색이 된다.

   ★ 이알피처럼 «다시 셈해 통째로» 올리지 않는다 — «빠진 사람만» 채운다.
     이알피는 그 PC 에만 있는 손수 고른 색(localStorage)을 섞어 셈한다.
     그것을 흉내 내 통째로 올리면 대표님이 다른 자리에서 고른 색을 덮는다.
     없는 칸만 채우면 남의 것을 건드릴 일이 없어, 두 앱이 함께 돌아도 안 싸운다.

   ★ 고르는 법 — «아직 아무도 안 쓰는» 색을 앞에서부터. 그래야 새로 온 사람이
     옆자리와 같은 색으로 뜨지 않는다. 색을 새로 만들지 않는다(구글 색표 안에서만).

   ⚠ 구글 색표가 아직 «안 왔으면» 아무것도 안 한다. 되돌아갈 색을 올리면 서버의
     진짜 색을 덮는다 — 이알피가 그 자리에서 한 번 데었다.
   ⚠ 관리자만 쓸 수 있다(서버 규칙). 명부의 role 로 가르므로 «위임관리인»은 여기서
     못 채운다 — 서버는 허락하지만 조용히 실패하느니 아예 안 한다. */
function 빠진색채우기(있는색, 사람들, 색표){
  var 쓰는색 = {};
  Object.keys(있는색 || {}).forEach(function(k){
    if(있는색[k]) 쓰는색[String(있는색[k]).toLowerCase()] = 1;
  });
  var 새로 = {};
  (사람들 || []).forEach(function(u){
    if(!u || !u.sid || (있는색 && 있는색[u.sid])) return;
    var 고름 = "";
    for(var i=0;i<색표.length;i++){
      if(!쓰는색[String(색표[i]).toLowerCase()]){ 고름 = 색표[i]; break; }
    }
    /* 색표를 다 썼으면 처음부터 다시 — 겹치더라도 «없는 것»보다 낫다 */
    if(!고름) 고름 = 색표[Object.keys(새로).length % 색표.length];
    if(!고름) return;
    새로[u.sid] = 고름;
    쓰는색[String(고름).toLowerCase()] = 1;
  });
  return 새로;
}
function 색채우기(){
  try{
    if(!(ME && ME.role === "admin")) return;            /* 관리자만 */
    var 색표 = gcalPalette();
    if(!색표 || !색표.length) return;                    /* 색표가 안 왔으면 손대지 않는다 */
    var 있는색 = (D.staff_colors && typeof D.staff_colors === "object"
                  && !Array.isArray(D.staff_colors)) ? D.staff_colors : {};
    var 현직 = users().filter(function(u){ return u && u.status === "active"; });
    if(!현직.length) return;                             /* 사람이 없으면 아무 일도 안 한다 */
    var 새로 = 빠진색채우기(있는색, 현직, 색표);
    if(!Object.keys(새로).length) return;                /* 채울 사람이 없으면 안 올린다 */
    var 합친것 = Object.assign({}, 있는색, 새로);
    PuCalWrite.saveColors(합친것).then(function(r){
      if(r && r.ok){
        D.staff_colors = 합친것;
        console.log("[사람색] 빠진 " + Object.keys(새로).length + "명을 채웠습니다: "
          + Object.keys(새로).map(function(s){ return nameOf(s) + "=" + 새로[s]; }).join(", "));
        render();
      }
    })["catch"](function(){});
  }catch(e){}
}

/* ── 사람 색 «바꾸기» ────────────────────────────────────────────────────
   캘린더를 한 곳으로 모으기 4걸음 (대표 지시 2026-09-20).

   ★ 왜 여기로 왔나 — 안 옮기면 «온 시스템에서» 색을 바꿀 길이 사라진다.
     색을 고르는 자리가 이알피 법인 대시보드 한 곳뿐이었다(사람 칩에 마우스를
     올리면 뜨던 팔레트). 그 화면을 걷어내는데 그대로 두면, 빠진 사람은
     채워지지만(색채우기) «이미 있는 색을 바꾸는 일»은 아무 데서도 못 한다.
     data/staff_colors 는 컨설팅일정도 읽는 자리라 손해가 이 앱에서 안 그친다.

   ★ 이알피와 다른 점 — «이 PC 에만» 담지 않는다.
     이알피는 고른 색을 그 PC 브라우저(localStorage)에 담고, 화면을 그릴 때마다
     다시 셈해 통째로 올렸다. 그래서 다른 PC 에서 열면 순번 색으로 돌아갔다.
     여기서는 고른 그 칸 하나만 서버에 적는다 — 담는 데가 한 곳이라 어긋날 수 없다.

   ⚠ 색을 «새로 만들지» 않는다 — 구글 색표 안에서만 고른다. 우리가 만든 색은
     구글 화면에서 다르게 보여, 같은 일정이 두 앱에서 다른 색이 된다.
   ⚠ 색표가 아직 안 왔으면 고르게 하지 않는다. 그때 고른 색은 «되돌아갈 색»이라
     서버의 진짜 색을 덮는다 — 이알피가 그 자리에서 한 번 데었다. */
function openColors(){ S.colors = { pick:"", busy:false, err:"" }; render(); }
function closeColors(){ S.colors = null; render(); }

              +   ' title="눌러서 색을 고릅니다" style="background:' + esc(지금 || "#cbd5e1") + '"></button>'

          }).join("") + '</div>')
    + '<div class="mbtns"><span class="sp"></span>'

function 색고르기(sid, 색){
  var m = S.colors; if(!m || m.busy) return;
  var 있는색 = (D.staff_colors && typeof D.staff_colors === "object"
                && !Array.isArray(D.staff_colors)) ? D.staff_colors : {};
  if(String(있는색[sid] || "").toLowerCase() === String(색).toLowerCase()){ m.pick = ""; render(); return; }
  /* ⚠ 고른 «그 칸 하나»만 바꾼다 — 통째로 다시 셈해 올리면 다른 자리에서 고른 색을 덮는다 */
  var 다음 = Object.assign({}, 있는색); 다음[sid] = 색;
  m.busy = true; m.err = ""; render();
  PuCalWrite.saveColors(다음).then(function(r){
    m.busy = false;
    if(r && r.ok){ D.staff_colors = 다음; m.pick = ""; }
    else m.err = (r && r.message) || "저장하지 못했습니다";
    render();
  })["catch"](function(e){
    m.busy = false; m.err = (e && e.message) || String(e); render();
  });
}

/* ── 구글 계정 ↔ 직원 잇기 ──────────────────────────────────────────────
   캘린더 한 곳으로 모으기 1걸음(나).

   ★ 왜 여기로 왔나
     구글 일정에는 «누가 만들었는지»(메일)만 남고 이름이 없다. 이어 주지 않으면
     그 사람 일정이 담당자·색 없이 뜬다(메일로 늘 같은 색을 주긴 하지만 대표님이
     고른 그 사람 색은 아니다). 이어 주는 화면이 이알피 법인 대시보드 한 곳뿐이라,
     그 화면을 걷어내면 남은 사람을 영영 못 잇는다.

   ★ 이알피와 «같은 열쇠»를 쓴다 — gcalMailKey(점 → 쉼표). 다르면 이어 둔 것을
     서로 못 찾는다. 그래서 그 함수를 그대로 쓴다(새로 짓지 않는다).
   ⚠ 관리자만 쓸 수 있다(서버 규칙). 색 채우기와 같은 잣대를 쓴다. */
/* ⚠ typeof 로 본다 — 검사가 머리줄만 떼어 상자에 넣고 돌 때 ME 가 없다(chipHtml 과 같은 까닭) */
/* 관리자·위임관리인인가 — 서버 규칙의 MGR 와 «같게» 맞춘다.
   data/gcal_mail_sid 와 data/staff_colors 둘 다 쓰기가 MGR 이라 잣대가 하나다.
   ⚠ 화면이 규칙보다 넓으면 눌러 놓고 조용히 거절당하고, 좁으면 될 사람이 못 한다.
   ⚠ 잣대를 두 벌로 만들지 말 것 — 한쪽만 고치면 어느 쪽이 맞는지 아무도 모른다. */
function 관리자인가(){
  if(typeof ME === "undefined" || !ME) return false;
  return ME.role === "admin" || ME.isAdmin === true || ME.isSubAdmin === true;
}
function 잇기할수있나(){
  return 관리자인가();
}
/* 지금 달력에 뜬 구글 일정에서 «만든이»를 모은다 — 많이 만든 사람부터 */
function 메일줄들(){
  var 셈 = {};
  (GCAL.evs || []).forEach(function(e){
    if(!e || !e.mail) return;
    var k = gcalMailKey(e.mail);
    if(!셈[k]) 셈[k] = { key:k, mail:e.mail, n:0 };
    셈[k].n++;
  });
  var mp = gcalMailMap();
  return Object.keys(셈).map(function(k){
    var r = 셈[k]; r.sid = mp[k] || ""; return r;
  }).sort(function(a,b){ return b.n - a.n; });
}
function 안이은수(){ return 메일줄들().filter(function(r){ return !r.sid; }).length; }
function openMailMap(){ S.mailmap = { busy:false, err:"" }; render(); }
function closeMailMap(){ S.mailmap = null; render(); }
function mailmapHtml(){
  var m = S.mailmap; if(!m) return "";
  var 줄 = 메일줄들();
  var 현직 = users().filter(function(u){ return u && u.status === "active"; });
  return '<div class="veil" data-close="1"></div><div class="modal" style="max-width:560px">'
    + '<h3>👤 구글 계정 ↔ 직원 잇기</h3>'
    + '<div class="mmnote">한 번 이어 주면 그 뒤로 담당자 색과 거르기가 정확해집니다. '
    +   '다른 PC 에서도 같이 보입니다.</div>'
    + (m.err ? '<div class="werr">' + esc(m.err) + '</div>' : '')
    + (줄.length
        ? '<div class="mmlist">' + 줄.map(function(r){
            return '<div class="mmrow">'
              + '<div class="mmwho"><span class="mmmail" title="' + esc(r.mail) + '">' + esc(r.mail) + '</span>'
              +   '<span class="mmn">' + r.n + '건 · ' + (r.sid ? esc(nameOf(r.sid)) + ' 이어짐' : '아직 안 이음') + '</span></div>'
              + '<select data-mm="' + esc(r.key) + '"' + (m.busy ? ' disabled' : '')
              +   ' class="' + (r.sid ? 'on' : '') + '">'
              +   '<option value="">— 고르세요 —</option>'
              +   현직.map(function(u){
                    return '<option value="' + esc(u.sid) + '"' + (u.sid === r.sid ? ' selected' : '') + '>'
                      + esc(u.name || u.sid) + '</option>';
                  }).join("")
              + '</select></div>';
          }).join("") + '</div>'
        : '<div class="mmempty">이 달에 구글 일정이 없습니다 — 달을 옮기면 그 달의 계정이 뜹니다.</div>')
    + '<div class="mbtns"><span class="sp"></span>'
    + '<button class="btn ghost" data-close="1">닫기</button></div></div>';
}
function 잇기저장(메일열쇠, sid){
  var m = S.mailmap; if(!m || m.busy) return;
  var 다음 = Object.assign({}, gcalMailMap());
  if(sid) 다음[메일열쇠] = sid; else delete 다음[메일열쇠];
  m.busy = true; m.err = ""; render();
  PuCalWrite.saveMailMap(다음).then(function(r){
    m.busy = false;
    if(r && r.ok){
      D.gcal_mail_sid = 다음;
      /* 색을 다시 칠하려면 일정을 다시 «해석»해야 한다 — 받아 둔 것을 다시 그린다 */
      gcalLoad(true);
    } else {
      m.err = (r && r.message) || "저장하지 못했습니다";
    }
    render();
  })["catch"](function(e){
    m.busy = false; m.err = (e && e.message) || String(e); render();
  });
}

/* ── 구글 로그인 (지우기용) ──────────────────────────────────────────────
   캘린더 한 곳으로 모으기 3걸음-나. 「옮긴다」(대표 지시 2026-09-20).

   ★ 읽기와 쓰기는 «다른 자격»이다
     달력을 «읽는» 것은 열쇠 하나로 되고 로그인이 필요 없다. 그런데 이어진 구글
     일정을 «지우려면» 그 사람 자격이 있어야 한다 — 그래서 로그인이 따로 필요하다.
   ★ 그래서 단추는 «필요할 때만» 뜬다 — 이어진 건이 화면에 있는데 아직 로그인을
     안 했을 때. 늘 띄우면 아무도 안 누르고 머리줄만 좁아진다.
   ⚠ 되돌아올 주소가 구글 콘솔에 «등록»돼 있어야 한다(pu-cal.html).

var GCAL_OAUTH_ID = "30712196914-1qc61a41ptmo6u7hbk71i70g00k3a8lk.apps.googleusercontent.com";

function 구글단추Html(){

/* ── 비고(개인 요구사항) 고치기 ──────────────────────────────────────────
   캘린더 한 곳으로 모으기 2걸음(다). 이알피로 보내던 마지막 자리다.

   ⚠ 담기는 자리가 둘이다 — 이알피가 그렇게 담아 온 것을 그대로 따른다.
     · 외부 인원: external_staff 레코드의 note 칸 → «레코드 표»라 칸별 저장 문(save)
     · 내부 직원: data/ieum_notes 의 { 사번: 글 } → 한 덩이 지도라 saveNotes
     옮겨서 한 자리로 합치고 싶어도 지금 하지 않는다 — 옮기다 옛 글을 잃는다.
   ⚠ 관리자만이 아니다. 서버 규칙이 «로그인한 직원 누구나»로 열려 있고,
     이알피도 「전 직원 수정 가능」이 확정 사양이었다. 같게 둔다. */
function openNote(pk){
  var p = ieumPeople().filter(function(x){ return x.pk === pk; })[0];
  if(!p) return;
  S.note = { pk:pk, kind:p.kind, name:p.name, text:p.note || "", busy:false, err:"" };
  render();
}
function closeNote(){ S.note = null; render(); }
function noteHtml(){
  var m = S.note; if(!m) return "";
  return '<div class="veil" data-close="1"></div><div class="modal" style="max-width:420px">'
    + '<h3>📝 비고 — ' + esc(m.name) + '</h3>'
    + '<div class="mmnote">그 사람에게만 해당하는 요구사항을 적습니다. '
    +   '예: 「2·4주 금요일만」·「오전만」. 달력 칩을 손대면 뜨는 설명에도 같이 보입니다.</div>'
    + (m.err ? '<div class="werr">' + esc(m.err) + '</div>' : '')
    + '<div class="fld"><textarea data-note="1" rows="3" placeholder="안 적어도 됩니다"'
    +   (m.busy ? ' disabled' : '') + '>' + esc(m.text) + '</textarea></div>'
    + '<div class="mbtns"><span class="sp"></span>'
    + '<button class="btn ghost" data-close="1">그만</button>'
    + '<button class="btn" data-noteact="save"' + (m.busy ? ' disabled' : '') + '>'
    +   (m.busy ? '저장 중…' : '저장') + '</button></div></div>';
}
function saveNote(){
  var m = S.note; if(!m || m.busy) return;
  var el = document.querySelector('[data-note]');
  var 글 = el ? String(el.value || "").trim() : m.text;
  m.busy = true; m.err = ""; render();
  var 끝 = function(r){
    m.busy = false;
    if(r && r.ok){
      closeNote(); toast("✅ 비고를 적었습니다");
      refreshOne(m.kind === "in" ? "ieum_notes" : "external_staff");
    } else {
      m.err = (r && r.message) || "저장하지 못했습니다"; render();
    }
  };
  if(m.kind === "in"){
    var 다음 = Object.assign({}, (D.ieum_notes && typeof D.ieum_notes === "object") ? D.ieum_notes : {});
    if(글) 다음[m.pk] = 글; else delete 다음[m.pk];
    PuCalWrite.saveNotes(다음).then(function(r){ if(r && r.ok) D.ieum_notes = 다음; 끝(r); })
      ["catch"](function(e){ 끝({ ok:false, message:(e && e.message) || String(e) }); });
  } else {
    var x = arr(D.external_staff).filter(function(e){ return e && e.id === m.pk; })[0];
    PuCalWrite.save("external_staff", { id:m.pk, note:글 }, x).then(function(r){
      if(r && r.ok && x) x.note = 글;
      끝(r);
    })["catch"](function(e){ 끝({ ok:false, message:(e && e.message) || String(e) }); });
  }
}

/* ── 외부 공유 뷰 «발행» ────────────────────────────────────────────────
   캘린더 한 곳으로 모으기 2걸음.

   ★ 여기서 고친 진짜 고장
     공개 일정(ieum_public)을 만드는 일이 이알피에만 걸려 있었다. 그런데 이음 근무를
     «푸른 캘린더에서도» 고치게 되면서(1걸음), 캘린더에서 고친 것은 공개 뷰에 안
     따라갔다 — 외부 변호사가 받은 링크에 옛 일정이 그대로 떠 있었다.
     이알피 이음센터 화면을 열어야만 다시 발행됐기 때문이다.

   ★ 만드는 셈은 js/pu-ieum-public.js «한 곳»이다 — 이알피도 그 파일을 부른다.
     여기서 다시 셈하지 말 것(두 벌이 되면 두 화면의 공개 일정이 갈린다).
   ⚠ 발행은 «덮어쓰기»다. 원본은 근태라 언제든 다시 만들 수 있다. */
function 발행자료(){
  return {
    attendance: arr(D.attendance_records),
    users: allUsers(),
    externals: arr(D.external_staff),
    year: new Date().getFullYear()
  };
}
function 발행하기(조용히){
  if(typeof PuIeumPublic === "undefined" || !fbDb) return;
  if(!조용히){ S.pub = { busy:true, msg:"" }; render(); }
  return PuIeumPublic.publish(fbDb, 발행자료()).then(function(만든것){
    var 날수 = Object.keys(만든것.roster || {}).length;
    S.pub = { busy:false, msg:"✅ 발행했습니다 — " + 날수 + "일치", at:Date.now() };
    if(!조용히) render();
  })["catch"](function(e){
    S.pub = { busy:false, msg:"발행하지 못했습니다: " + ((e && e.message) || e) };
    if(!조용히) render();
  });
}
/* 일정을 고치면 «저절로» 발행한다 — 이알피와 같은 요령(3초 모아서 한 번).
   ⚠ 고칠 때마다 바로 올리면 끌어놓기로 여러 건을 잇따라 고칠 때 그만큼 올라간다. */
var _발행타이머 = null;
function 발행예약(){
  if(typeof PuIeumPublic === "undefined" || !fbDb) return;
  clearTimeout(_발행타이머);
  _발행타이머 = setTimeout(function(){ 발행하기(true); }, 3000);
}
function 발행시각Html(){
  var at = (S.pub && S.pub.at) || 0;
  if(!at) return "";
  var d = new Date(at);
  return '<span class="pubat">마지막 발행 ' + String(d.getHours()).padStart(2,"0")
    + ":" + String(d.getMinutes()).padStart(2,"0") + '</span>';
}

/* ── 개인 공유 링크 발급·재발급 ──────────────────────────────────────────
   ⚠ 재발급하면 «지금 링크가 그때부터 안 열린다». 되돌릴 수 없으니 한 번 묻는다.
   ⚠ 외부 인원 표(external_staff)는 지도형이라 칸별 저장 문을 그대로 쓴다 —
     그 사람의 shareKey 칸 하나만 고친다(다른 칸·다른 사람을 안 건드린다). */
function 링크발급(extId){
  if(!잇기할수있나()) return;
  var x = arr(D.external_staff).filter(function(e){ return e && e.id === extId; })[0];
  if(!x) return;
  var 다시 = !!x.shareKey;
  if(다시 && !window.confirm(x.name + "님의 링크를 재발급할까요?\n지금 링크는 그때부터 열리지 않습니다."))
    return;
  var 새열쇠 = PuIeumPublic.newShareKey();
  PuCalWrite.save("external_staff", { id: extId, shareKey: 새열쇠 }, x).then(function(r){
    if(r && r.ok){
      x.shareKey = 새열쇠;                     /* 화면이 든 것도 함께 고친다 */
      toast(다시 ? "🔑 재발급했습니다 — 새 링크를 전해 주세요" : "🔑 발급했습니다");
      발행하기(true);                          /* people 목록이 바뀌었으니 다시 올린다 */
      render();
    } else {
      toast("발급하지 못했습니다: " + ((r && r.message) || ""));
    }
  })["catch"](function(e){ toast("발급하지 못했습니다: " + ((e && e.message) || e)); });
}

/* 실시간DB 열쇠에는 점(.)을 못 쓴다 — 이메일에는 점이 있어 쉼표로 바꿔 담는다.
   ⚠ 이알피와 «같은 셈»이어야 한다. 다르면 이어 둔 사람이 안 찾아진다. */
function gcalMailKey(m){ return String(m || "").trim().toLowerCase().replace(/[.#$\[\]\/]/g, ","); }
function gcalMailMap(){
  var v = D.gcal_mail_sid;
  return (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
}
/* 만든이 메일 → 직원 사번.
   ★ 사람이 «한 번 이어 준 것»이 가장 확실하다 — 명부 대조보다 먼저 본다.
     명부에는 gmail 이 없어(로그인아이디는 사번@… 꼴) 이 표가 없으면 맞출 길이 없다. */
function gcalSidByMail(mail){
  var k = gcalMailKey(mail);
  if(!k) return "";
  var mp = gcalMailMap();
  if(mp[k]) return mp[k];
  var us = users();
  for(var i = 0; i < us.length; i++){
    var u = us[i] || {};
    var cands = [u.loginId, u.email, u.gmail, u.googleEmail];
    for(var j = 0; j < cands.length; j++){
      if(cands[j] && gcalMailKey(cands[j]) === k) return u.sid;
    }
  }
  return "";
}
/* 이어 준 사람이 없을 때 — 메일로 «늘 같은» 색 하나를 고른다 */
function gcalMailColor(mail){
  var k = gcalMailKey(mail);
  if(!k) return "";
  var uniq = gcalPalette() || ["#2563eb","#16a34a","#dc2626","#d97706","#64748b","#1e40af"];
  var h = 0;
  for(var i = 0; i < k.length; i++){ h = (h * 131 + k.charCodeAt(i)) >>> 0; }
  return uniq[h % uniq.length];
}

/* 그 달(앞뒤 걸친 42칸)의 구글 일정을 받아 둔다.
   ⚠ 달이 바뀔 때만 받는다 — 다시 그릴 때마다 받으면 요금과 깜빡임이 는다. */
function gcalLoad(force){
  var 칸 = monthGrid(S.ym);
  var 첫날 = 칸[0].date, 끝날 = shiftDay(칸[칸.length-1].date, 1);
  var 키 = 첫날 + "~" + 끝날;
  if(!force && GCAL.ym === 키) return Promise.resolve();
  GCAL.ym = 키; GCAL.loading = true; GCAL.err = "";
  var url = "https://www.googleapis.com/calendar/v3/calendars/"
    + encodeURIComponent(GCAL_CAL_ID) + "/events?key=" + GCAL_API_KEY
    + "&timeMin=" + encodeURIComponent(첫날 + "T00:00:00+09:00")
    + "&timeMax=" + encodeURIComponent(끝날 + "T00:00:00+09:00")
    + "&singleEvents=true&orderBy=startTime&maxResults=500";
  return gcalLoadColors()
    .then(function(){ return fetch(url); })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.error){ throw new Error(d.error.message || "구글 달력 오류"); }
      GCAL.evs = (d.items || [])
        .filter(function(ev){ return ev.start && (ev.start.date || ev.start.dateTime); })
        .map(gcalToEvent);
      GCAL.loading = false; render();
      /* 색표가 이제 손에 있다 — 색이 없는 직원이 있으면 이때 채운다(1걸음).
         ⚠ 그리기가 끝난 «뒤»다. 색 채우다 실패해도 달력은 이미 떠 있다. */
      색채우기();
    })
    .catch(function(e){
      /* ⚠ 못 받았으면 «조용히» 비우지 않는다 — 빈 달력은 「일정이 없다」는 거짓말이다 */
      GCAL.loading = false; GCAL.err = (e && e.message) || String(e); render();
    });
}

/* 구글 일정 한 건 → 우리 칩.
   ★ 색 고르는 차례 — 앞이 있으면 뒤로 안 넘어간다(이알피와 같다):
     ①구글에서 그 일정에 «고른» 색  ②만든이가 이어져 있으면 그 직원 색
     ③제목에 현직 이름이 있으면 그 직원 색  ④만든이 메일로 늘 같은 색  ⑤기본 */
function gcalToEvent(ev){
  var date = (ev.start.date || ev.start.dateTime || "").slice(0,10);
  var timeStr = ev.start.dateTime ? ev.start.dateTime.slice(11,16) : "";
  var title = (ev.summary || "").trim()
    || (ev.description || "").replace(/<[^>]+>/g, "").slice(0,20).trim();
  if(!title && timeStr) title = timeStr + " 일정";
  if(!title) title = "일정";
  var gColor = (window._gcalColors && ev.colorId) ? (window._gcalColors[String(ev.colorId)] || "") : "";
  var mail = (ev.creator && ev.creator.email) || (ev.organizer && ev.organizer.email) || "";
  var mailSid = gcalSidByMail(mail);
  var color = gColor || (mailSid ? (colorOf(mailSid) || "") : "")
    || gcalMailColor(mail) || (ev.summary ? "#2563eb" : "#94a3b8");
  var sid = mailSid || "GCAL";
  var us = users();
  for(var ui = 0; ui < us.length; ui++){
    var u = us[ui];
    if(u.name && title.indexOf(u.name) >= 0){
      /* ⚠ 구글 색이 있으면 «그것이 이긴다» — 앱 색으로 덮으면 구글 화면과 달라진다.
         ⚠ 만든이가 이미 찾아졌으면 그것이 더 확실하다 — 제목의 이름은 「권형하에게
           보고」처럼 «남의 이름»일 수도 있다. */
      if(!gColor && !mailSid) color = colorOf(u.sid) || color;
      if(!mailSid) sid = u.sid;
      break;
    }
  }
  /* ⚠ 아이콘을 안 붙인다 — 구글 화면에는 없다(kind 로 이미 갈린다) */
  return { kind:"gcal", store:"gcal", id:ev.id, sid:sid, date:date,
    text:title, time: (timeStr && timeStr !== "00:00") ? timeStr.replace(":","") : "",
    /* 만든이 메일을 남긴다 — 「계정 잇기」 창이 «아직 안 이은 사람»을 여기서 센다 */
    mail:mail, mailSid:mailSid || "",
    color:color, gcalUrl:ev.htmlLink || "",
    tip: title + (ev.location ? "\n📍 " + ev.location : "")
         + (mail ? "\n✉ " + mail : "") };
}

/* 그 날의 일들 — 칩의 «글자와 색»은 이알피와 글자 하나까지 같다.
   ⚠ 여기서 예쁘게 바꾸지 말 것. 대표님이 두 화면을 나란히 놓고 보신다.
     고칠 일이 생기면 이알피부터 고치고 그 다음 여기를 맞춘다
     (tests/cal-same-as-erp.test.js 가 두 쪽을 맞대 본다). */
function eventsOn(ymd, eumOnly){
  var out = [];
  /* ① 일정 — 외부 협력자 일정은 ⚖️·🤝 를 앞에 붙이고 그 사람 색으로 */
  arr(D.my_schedules).forEach(function(s){
    if(!s || s.date !== ymd) return;
    if(s.externalId){
      var ext = externalOf(s.externalId);
      if(!ext || ext.active === false) return;
      var prefix = ext.role === "변호사" ? "⚖️" : "🤝";
      out.push({ kind:"sch", store:"my_schedules", id:s.id, sid:"EXT_"+s.externalId, externalId:s.externalId,
        text: prefix + " " + ext.name + (s.title ? " · " + s.title : ""),
        time:"", color: ext.color || "#2563eb",
        tip: ext.name + (ext.role ? " (" + ext.role + ")" : "") + (ext.contact ? "\n☎ " + ext.contact : "")
             + (ext.note ? "\n📝 요구사항: " + ext.note : "") });
      return;
    }
    var hm = String(s.time || "").slice(0,5);
    out.push({ kind:"sch", store:"my_schedules", id:s.id, sid:s.sid,
      text: s.title || "일정",
      /* 시각은 「1030」처럼 콜론 없이 — 좁은 칸에서 제목이 두 글자쯤 더 보인다 */
      time: (hm && hm !== "00:00") ? hm.replace(":","") : "",
      color: colorOf(s.sid) || "#64748b",
      tip: (s.title || "일정") + (s.note ? " · " + s.note : "") });
  });
  /* ② 근태 — 이알피와 같은 글자·같은 색 */
  arr(D.attendance_records).forEach(function(r){
    if(!r || r.date !== ymd) return;
    if(ATT_SHOW.indexOf(r.type) < 0) return;
    var who = nameOf(r.sid) ? " (" + nameOf(r.sid) + ")" : "";
    var 글 = r.type === "leave" ? "🏖️ 연차" + who
      : r.type === "halfday-am" ? "🌅 오전반차" + who
      : r.type === "halfday-pm" ? "🌇 오후반차" + who
      : r.type === "leave-hour" ? "⏱️ 시간연차" + who
      : r.type === "special-leave" ? "🎁 특별휴가" + who
      : r.type === "maternity" ? "🤱 출산휴가" + who
      : r.type === "parental-leave" ? "👶 육아휴직" + who
      : r.type === "sick" ? "🤒 병가" + who + (r.note ? " " + r.note : "")
      : r.type === "trip" ? "🚗 출장" + who + (r.note ? " " + r.note : "")
      : r.type === "telework" ? "🏠 재택" + who + (r.note ? " " + r.note : "")
      : r.type === "eum-work" ? (function(){
          var t = r.startTime ? r.startTime.replace(":","") + "-" + String(r.endTime||"").replace(":","") + " " : "";
          if(r.externalId){
            var ex = externalOf(r.externalId);
            if(ex) return "🏛️ " + t + ex.name + " 이음센터" + (r.note ? " " + r.note : "");
          }
          var nm = nameOf(r.sid);
          return "🏛️ " + t + (nm ? nm + " 이음센터" : "이음센터") + (r.note ? " " + r.note : "");
        })()
      : "";
    /* 색 — 이알피와 같은 차례. 이음센터는 «그 직원 색», 사람을 모르면 회색이다
       (외부 협력자의 이음 근무가 회색인 까닭 — 이알피도 그 사람 색을 쓰지 않는다). */
    var col = r.type === "trip" ? "#1e40af"
      : r.type === "telework" ? "#2563eb"
      : r.type === "eum-work" ? (colorOf(r.sid) || "#94a3b8")
      : r.type === "sick" ? "#dc2626"
      : (colorOf(r.sid) || "#64748b");
    var tip = 글;
    if(r.type === "eum-work" && r.externalId){
      var e2 = externalOf(r.externalId);
      if(e2) tip = e2.name + (e2.role ? " (" + e2.role + ")" : "")
        + (e2.contact ? "\n☎ " + e2.contact : "") + (e2.note ? "\n📝 요구사항: " + e2.note : "");
    }
    out.push({ kind: r.type === "eum-work" ? "eum" : "att", store:"attendance_records", id:r.id,
      sid:r.sid, externalId:r.externalId, type:r.type,
      text:글, time:"", color:col, tip:tip });
  });
  /* ③ 구글 캘린더 — 이알피 달력을 채우는 것이 이것이다(9월 126건).
     ⚠ 이음 보기에서는 안 보탠다 — 거기는 이음 근무만 보는 자리다.
     ⚠★ 거르개가 「전체」나 「구글」일 때만 섞는다 — 이알피와 «같은 규칙»이다
        (pu-erp.html: calFilter === null || calFilter === 'gcal').
        사람을 고른 채로 구글까지 섞으면 칩에 붙는 「겹친 날」 숫자가 두 앱에서 달라진다. */
  if(!eumOnly && (S.filter === null || S.filter === "gcal")){
    for(var gi = 0; gi < GCAL.evs.length; gi++){
      if(GCAL.evs[gi].date === ymd) out.push(GCAL.evs[gi]);
    }
  }
  /* ④ 사건 마감일 · 단계 기한 · 휴직 (5걸음에 되살린 층 셋)
     ⚠ 이음 보기에는 안 넣는다 — 거기는 이음 근무만 보는 자리다(구글과 같은 까닭).
     ⚠ 「구글만」 거르개일 때도 안 넣는다 — 구글에서 온 것만 보자는 뜻이다.
     ⚠ 셋 다 movable:false 다. 계산된 값이거나 다른 화면이 주인이라,
       여기서 끌어 옮기면 그 화면과 어긋난다. */
  /* ⚠ typeof 로 본다 — 검사가 eventsOn 만 떼어 상자에 넣고 도는 자리가 여럿 있다
     (chipHtml 의 ME 와 같은 까닭). 없으면 그 층만 안 그린다 — 나머지는 멀줦하다.
     진짜로 도는지는 tests/case-due-chips.test.js 가 따로 재서 본다. */
  if(!eumOnly && S.filter !== "gcal" && typeof 기한칩 === "function"){
    기한칩(ymd).forEach(function(c){
      /* 사람 거르개 — 담당자가 그 사람인 것만. 휴직은 그 사람 것만. */
      if(S.filter && S.filter !== "pureun" && S.filter !== "eumwork" && c.sid !== S.filter) return;
      if(S.filter === "eumwork") return;
      out.push({ kind:c.kind, store:"", id:c.kind + ":" + c.date + ":" + (c.sid || ""),
        sid:c.sid, text:c.text, time:"", color:c.color, tip:c.tip, movable:false });
    });
  }
  if(eumOnly) out = out.filter(function(e){ return e.kind === "eum"; });
  return out;
}
/* 달력에 그리는 근태 — 이알피와 같은 목록이다(지각·조퇴·결근·공가는 달력에 안 뜬다) */
var ATT_SHOW = ["leave","halfday-am","halfday-pm","leave-hour","special-leave","sick",
                "maternity","parental-leave","trip","telework","eum-work"];

/* 거르개 — null=전체 · 'pureun'=푸른 직원만 · 'eumwork'=이음 근무만 · sid=그 사람만 */
/* 거르개 — 이알피와 같은 뜻으로 가른다.
     null      = 전체
     'pureun'  = 푸른 직원 것만 (구글·외부인 제외)
     'gcal'    = 구글 달력에서 온 것만
     'eumwork' = 이음센터 근무만
     사번      = 그 사람 것만 */
function passFilter(ev){
  var f = S.filter;
  if(!f) return true;
  if(f === 'pureun')  return ev.kind !== 'gcal' && !ev.externalId;
  if(f === 'gcal')    return ev.kind === 'gcal';
  if(f === 'eumwork') return ev.kind === 'eum';
  return ev.sid === f;
}

/* ── 달력 그리기 ───────────────────────────────────────────────────── */
/* ── 달력 — 이알피(법인 대시보드)와 «같은 꼴» ─────────────────────────
   대표 지시 2026-09-18 「대시보드 제외한 화면은 똑같이 만들어라」.
   그래서 여기서 정하는 것은 우리 취향이 아니라 «이알피가 하던 그대로»다:
     · 날짜 옆 괄호는 음력 날짜 — 구글 달력 위젯이 「25 (13)」로 붙여 주는 그 숫자
     · 오늘은 숫자에만 파란 동그라미(음력까지 감싸면 알약처럼 길어진다)
     · 공휴일은 칸 맨 위에 «칩»으로 (오른쪽 위 작은 글씨가 아니다)
     · 한 칸에 넷까지 보이고 나머지는 접는다 — 셋이면 더보기가 너무 자주 뜬다
     · 시각은 「1030」처럼 콜론 없이 붙여 쓴다 — 좁은 칸에서 제목이 두 글자쯤 더 보인다
     · 여섯 줄 고정(6×7) — 달마다 표 높이가 들썩이지 않게
   ⚠ 값을 바꾸고 싶으면 이알피부터 보라. 두 화면이 갈리는 것이 여기서 가장 나쁘다. */

/* 음력 — 표를 손으로 들고 있지 않는다. 브라우저에 든 단기(檀紀)력을 쓴다.
   ⚠ 42칸을 다시 그릴 때마다 새로 세면 느리다 — 한 번 센 것은 적어 둔다. */
var _lunar = {};
function lunarDay(ymd){
  if(!ymd) return "";
  if(_lunar[ymd] !== undefined) return _lunar[ymd];
  var out = "";
  try{
    out = new Intl.DateTimeFormat("ko-KR-u-ca-dangi", {day:"numeric", timeZone:"UTC"})
            .format(new Date(ymd + "T00:00:00Z")).replace(/[^0-9]/g, "");
  }catch(e){ out = ""; }
  _lunar[ymd] = out;
  return out;
}
/* 머리글의 「병오년8월 – 9월」 — 그 달 첫날·끝날의 음력 달.
   ⚠ 간지(병오)는 era:"long" 을 켜야 나온다. year:"numeric" 만 주면 2026 만 온다. */
function lunarRange(ym){
  try{
    var y = +String(ym).slice(0,4), m = +String(ym).slice(5,7);
    if(!y || !m) return "";
    var a = new Date(Date.UTC(y, m-1, 1)), b = new Date(Date.UTC(y, m, 0));
    var fm = new Intl.DateTimeFormat("ko-KR-u-ca-dangi", {era:"long", year:"numeric", month:"numeric", timeZone:"UTC"});
    function pick(d, t){ var ps = fm.formatToParts(d); for(var i=0;i<ps.length;i++) if(ps[i].type===t) return ps[i].value; return ""; }
    var yn = pick(a,"yearName"), m1 = pick(a,"month"), m2 = pick(b,"month");
    if(!m1) return "";
    return yn + "년" + m1 + (m2 && m2 !== m1 ? " – " + m2 : "");
  }catch(e){ return ""; }
}

/* WCAG 상대밝기 — «글자가 읽히는가»를 재는 데 쓴다.
   ⚠ 사람 눈 어림(0.299/0.587/0.114)과 다르다. 그 어림으로 흰/검을 고르면
     초록(#51b749) 위에 짙은 글자가 붙어 2.55:1 까지 떨어진다 — 안 읽힌다.
     이알피 calTextOn 이 아직 그 셈이다(거기도 같은 구멍 — 따로 고칠 일). */
function 상대밝기(bg){
  var hex = String(bg || "").replace("#", "");
  if(hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  if(hex.length !== 6) return 1;
  var c = [0,2,4].map(function(i){
    var v = parseInt(hex.slice(i,i+2),16) / 255;
    return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  });
  return 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
}
function 대비(a, b){
  var x = 상대밝기(a), y = 상대밝기(b);
  return (Math.max(x,y) + 0.05) / (Math.min(x,y) + 0.05);
}
/* 바탕색 위에 어떤 글자색이 읽히나 — 흰·검 둘을 «실제로 재서» 나은 쪽을 고른다.
   ⚠ 고르는 두 색은 흰과 검뿐이다(팔레트 규율 — tests/color-palette-apps.test.js).
     실측 최악: 밝은판 4.76:1 · 어두운판 4.59:1(사람 색 22 + 붙박이 색 5). */
function textOn(bg){
  return 대비(bg, "#ffffff") >= 대비(bg, "#000000") ? "#ffffff" : "#000000";
}
/* 색 둘을 섞는다(t=0 이면 원색 그대로, t=1 이면 완전히 두번째 색) —
   일정 칩의 «옅은 바탕»을 만드는 데 쓴다. 사람 색 값 자체는 안 바꾼다(colorOf 그대로),
   여기서는 «그리는 방법»만 바꾼다. */
function mixHex(hexA, hexB, t){
  function rgb(h){
    h = String(h || "").replace("#", "");
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    if(h.length !== 6) h = "64748b";
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }
  var a = rgb(hexA), b = rgb(hexB), out = [0,1,2].map(function(i){
    return Math.round(Math.max(0, Math.min(255, a[i] + (b[i]-a[i]) * t)));
  });
  return "#" + out.map(function(v){ return v.toString(16).padStart(2,"0"); }).join("");
}

/* 여섯 줄 고정 격자 — 이알피 buildMonthGrid 와 같다 */
function monthGrid(ym){
  var year = parseInt(ym.slice(0,4),10), month = parseInt(ym.slice(5,7),10) - 1;
  var first = new Date(year, month, 1), startDay = first.getDay();
  var lastDate = new Date(year, month+1, 0).getDate();
  var prevLast = new Date(year, month, 0).getDate();
  var grid = [], k;
  for(k = startDay-1; k >= 0; k--){
    var pd = prevLast - k, pm = new Date(year, month-1, 1);
    grid.push({ date: ymdOf(pm.getFullYear(), pm.getMonth()+1, pd), day:pd, other:true });
  }
  for(k = 1; k <= lastDate; k++) grid.push({ date: ymdOf(year, month+1, k), day:k, other:false });
  var n = 1;
  while(grid.length < 42){
    var nm = new Date(year, month+1, 1);
    grid.push({ date: ymdOf(nm.getFullYear(), nm.getMonth()+1, n), day:n, other:true }); n++;
  }
  return grid;
}
function ymdOf(y, m, d){
  return y + "-" + String(m).padStart(2,"0") + "-" + String(d).padStart(2,"0");
}

/* 일정 칩 하나 — 월·주·일 보기가 «같은 규칙»을 쓴다(보기를 바꿀 때 색이 튀지 않게).
   ═══════════════════════════════════════════════════════════════════════════
   ★ 네 판을 거쳤다. 되돌리기 전에 먼저 읽을 것.
     ① 원색 채우기 — 하루에 대여섯 줄이 늘어서면 원색 띠가 부딪혀 눈이 시렸다.
     ② 옅게 칠하고 왼쪽에 띠(85% 흰섞기) — 대비를 채우려니 바탕이 거의 흰색이 되어
       색 자체가 지워졌다(대표 지시 2026-09-20 「너무연해서 … 색이 눈에 보이지 않는다」).
     ③ 글자 자체를 그 사람 색으로(74% 검정) — 색이 «어두운 구석으로 죄다 뭉쳤다».
       실측: 열여덟 사람 가운데 가장 닮은 둘(장한돌·박병훈)의 색 거리가
       ΔE 7.1 에서 2.7 로 주저앉았다. ②와 같은 잘못이다 — 대비만 재고
       «서로 갈라지는가»는 안 쟀다.
     ④ 지금 — 대표 지시 2026-09-20 「1」(견본 셋 가운데 «구글 그대로»).
       구글 캘린더처럼 채운다. 채우면 색 거리가 안 줄어든다(ΔE 23.4 그대로).
   ★ 규칙 — 숫자가 아니라 이것을 지킨다(tests/cal-dark-mode.test.js)
     ㉮ 칩은 그 사람 색으로 «채운다». 색을 글자에 눌러 담지 않는다.
     ㉯ 내 일정은 원색 그대로, 남의 일정은 옅게 깔고 왼쪽에 «원색 띠»를 남긴다.
        옅게 깐 바탕끼리는 ΔE 3.6 밖에 안 난다 — 누구인지는 «띠»가 알린다.
     ㉰ 글자색은 바탕과의 «실제 대비»로 고른다(textOn).
     ㉱ 어두운판은 바탕을 «조금만» 누른다. 절반까지 누르면 색끼리 ΔE 14 로 뭉친다.
   실측(사람 색 22 + 붙박이 색 5): 내 일정 4.76:1·4.59:1 · 남의 일정 5.86:1·5.07:1 */
var 칩_어둠_누름 = .14;   /* 어두운판에서 바탕을 누르는 양 — 더 누르면 색이 뭉친다 */
var 칩_옅게     = .84;   /* 남의 일정 바탕을 흰(어두운판은 판) 쪽으로 옮기는 양 */
function chipHtml(e, ymd){
  var 사람색 = e.color || "#64748b";
  var 어둠 = S.theme === "dark";
  /* «내 일»이 먼저 눈에 들어와야 한다(대표 지시) — 사번으로 가른다.
     ⚠ 이름으로 가르지 않는다(동명이인·개명). ME 가 없으면 아무것도 «내 것»이 아니다. */
  /* typeof 로 본다 — 검사가 chipHtml 만 떼어 상자에 넣고 도는데(ME 를 안 만든다),
     그때 ReferenceError 로 죽으면 안 된다. ME 가 아예 없으면 아무것도 «내 것»이 아니다. */
  var 내일 = !!(typeof ME !== "undefined" && ME && ME.sid && e.sid === ME.sid);
  var 지남 = ymd < todayYMD();
  var 시각 = e.time ? "<b>" + esc(e.time) + "</b> " : "";
  var 바탕, 글자, 띠 = "";
  if(내일){
    바탕 = 어둠 ? mixHex(사람색, "#000000", 칩_어둠_누름) : 사람색;
    글자 = textOn(바탕);
  } else {
    바탕 = 어둠 ? mixHex(사람색, "#1e293b", .80) : mixHex(사람색, "#ffffff", 칩_옅게);
    /* 대표 지시 2026-09-20 「한글이 좀더 진했으면」 — 밝은판만 .58 → .72 로 검정을
       더 섞었다(재 보니 대비가 오히려 더 좋아진다: 최악 5.86:1 → 9.15:1). 어두운판은
       이미 흰 쪽으로 옅어 안 바꿨다 — 더 섞으면 색이 지워진다. */
    글자 = 어둠 ? mixHex(사람색, "#ffffff", .50) : mixHex(사람색, "#000000", .72);
    띠   = ";border-left:3px solid " + esc(사람색) + ";border-radius:0 4px 4px 0";
  }
  /* ★ 끌어 옮길 수 있는 것과 아닌 것 (5걸음, 대표 지시 2026-09-21)
       옮길 수 있다 — 우리 일정·근태(sch·att·eum)와 구글 일정(gcal)
       옮길 수 없다 — 공휴일 · 사건 마감일 · 단계 기한 · 휴직
     ⚠ 사건 기한은 «계산된 값»이고 휴직은 인사관리가 주인이다. 달력에서 옮기면
       그 화면과 어긋난다 — 그래서 아예 못 잡게 한다(잡히면 사람은 된다고 믿는다).
     ⚠ 잠긴 달은 «여기서» 막지 않는다. 막는 자리는 저장 문(pu-cal-write) 하나여야
       두 곳이 어긋나지 않는다 — 놓은 뒤에 「잠긴 달입니다」라고 분명히 말한다. */
  var 옮길수있나 = (e.movable !== false) && !!e.store && !!e.id;
  return '<div class="ev" data-ev="' + esc(e.store) + ':' + esc(e.id) + '"'
    + (옮길수있나 ? ' draggable="true" data-drag="' + esc(e.store) + ':' + esc(e.id) + '"' : '')
    + ' title="' + esc(e.tip) + (옮길수있나 ? ' (끌어서 다른 날로 옮길 수 있습니다)' : '') + '"'
    + ' style="background:' + esc(바탕) + ';color:' + esc(글자)
    +   (내일 ? ";font-weight:700" : "") + 띠
    +   (지남 ? ";opacity:.65" : "") + '">'
    + 시각 + esc(e.text) + '</div>';
}

/* ── 한 칸에 «몇 개»가 들어가나 ──
   못 박은 수를 쓰지 않는다. 판이 화면에 맞춰 늘고 줄므로, 그려 놓고 «재서» 정한다.
   ⚠ 재기 전 첫 그림에는 어림값(5)을 쓴다. 그린 뒤 재서 달라졌으면 «한 번만» 다시 그린다
     — 값이 같아지면 다시 그리지 않으므로 돌고 돌지 않는다. */
var _칸용량 = 0;
function 칸용량(){
  if(_칸용량) return _칸용량;
  /* ⚠ 아직 «못 쟀을 때»의 어림이다. 한때 여기에 5 를 못 박아 두었더니,
     못 재는 판(창이 숨어 있을 때 등)에서는 그 5 가 그대로 남아 칸마다 넘쳤다.
     못 박은 수 대신 화면 높이에서 뽑는다 — 200 은 머리(위 띠·탭줄·머리줄·요일줄)와
     아래 여백이 먹는 몫, 30 은 칸 안의 날짜줄과 여백, 19.5 는 칩 하나와 틈이다.
     재고 나면 이 값은 곧 «잰 값»으로 바뀐다(용량재기). */
  var 남은 = (window.innerHeight || 800) - 200;
  return Math.max(2, Math.floor((남은 / 6 - 30) / 19.5));
}
function 용량재기(){
  var g = document.querySelector(".calgrid");
  if(!g || !g.clientHeight) return false;
  var 칸 = g.querySelector(".day");
  if(!칸) return false;
  /* ⚠ 높이를 «짐작»하지 않는다. 처음에 날짜줄 22·칩 17.5 로 어림했더니 칸마다 11px 씩
     넘쳐 「+N개 더」가 잘렸다 — 날짜 동그라미는 24px 이고 칩은 테두리까지 18px 이다.
     꾸밈을 한 줄만 고쳐도 어림값은 또 틀어진다. 그래서 그려 놓은 것을 실제로 잰다. */
  var 줄 = g.clientHeight / 6;
  var cs = getComputedStyle(칸);
  var 여백 = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
  var 날짜줄 = 0;
  var dl = 칸.querySelector(".dline");
  if(dl) 날짜줄 = dl.offsetHeight + (parseFloat(getComputedStyle(dl).marginBottom) || 0);
  var ev = g.querySelector(".ev");
  var 칩 = ev ? ev.offsetHeight + 1.5 : 19.5;      /* 칩 하나 + 사이 틈 */
  if(!칩) return false;
  var n = Math.max(1, Math.floor((줄 - 여백 - 날짜줄) / 칩));
  if(n === _칸용량) return false;
  _칸용량 = n;
  return true;
}

function calendarHtml(eumOnly){
  /* 보는 달이 바뀌었으면 구글을 다시 받는다 — 같은 달이면 아무 일도 안 한다(gcalLoad 안에서 가른다) */
  if(fbDb) gcalLoad();
  if(S.view === "week") return weekHtml(eumOnly);
  if(S.view === "day")  return dayHtml(eumOnly);
  var grid = monthGrid(S.ym), today = todayYMD();
  /* ★ 한 칸에 «들어가는 만큼» 그린다 (대표 지시 2026-09-19
       「한화면에 나오게하고 달력안에 모든 내용 안보여도 된다. 펼서 볼수 있게 하면 된다」).
     넷이라는 «못 박은 수»가 아니다 — 판의 높이를 재서 나온 수다(칸용량).
     화면이 크면 여덟이 보이고 작으면 넷이 보인다. 남는 것은 「+N개 더」로 접고,
     누르면 그 자리에서 펼쳐 전부 보인다 — 다른 데로 데려가지 않는다.
   ⚠ 앞선 지시(「맞다 늘려라」)로 한때 아무것도 안 접었다. 그랬더니 바쁜 달이
     화면 밖으로 내려갔고(「너무 내려왔다」), 이 지시가 그것을 고친 것이다.
     되돌리려면 두 지시를 함께 볼 것 — tests/cal-cell-shows-all.test.js 가 막는다. */
  var 용량 = 칸용량();
  var cells = grid.map(function(c, idx){
    var evs = eventsOn(c.date, eumOnly).filter(passFilter).filter(matchSearch);
    var hol = holidayOf(c.date);
    var 오늘 = c.date === today;
    var 찾음 = !!(S.q && evs.length);
    /* ⚠ 칸 전체를 칠하지 않는다 — 구글 실제 화면을 재 보니(대표 지시 2026-09-20)
       «오늘»도 «공휴일»도 칸 배경은 흰색 그대로였다(픽셀로 확인: 255,255,255).
       「오늘」은 숫자의 파란 동그라미(.dnum.today)만, 「공휴일」은 .ev.hol 띠만 맡는다.
       「찾음」은 이 앱만의 기능이라(구글에 없다) outline+옅은 칠을 그대로 둔다. */
    var 어둠 = S.theme === "dark";
    var bg = 어둠 ? (c.other ? "#000000" : "#1e293b")
      : (c.other ? "#f8fafc" : 찾음 ? "#fffbeb" : "#ffffff");
    var 테 = 어둠 ? "#475569" : (c.other ? "#e2e8f0" : "#f8fafc");
    /* 공휴일 칩도 한 줄을 먹는다. 그리고 「+N개 더」 자신도 한 줄이다 —
       그 둘을 안 빼면 접었는데도 칸이 넘친다. */
    var 칸 = 용량 - (hol ? 1 : 0);
    var 보임 = evs.length <= 칸 ? evs.length : Math.max(0, 칸 - 1);
    var 숨김 = evs.length - 보임;
    return '<div class="day' + (오늘 ? " today" : "") + '" data-day="' + c.date + '"'
      + ' style="background:' + bg + ';border-right:1px solid ' + 테 + ';border-bottom:1px solid ' + 테
      + (찾음 ? ';outline:2px solid #fbbf24;outline-offset:-2px' : '') + '">'
      + '<div class="dline">'
      +   '<div class="dnum' + (오늘 ? " today" : "") + (c.other ? " other" : "") + '">' + c.day + '</div>'
      +   '<span class="lun' + (c.other ? " other" : "") + '">(' + lunarDay(c.date) + ')</span>'
      + '</div>'
      + '<div class="evs">'
      +   (hol ? '<div class="ev hol" title="' + esc(hol) + '"' + (c.other ? ' style="opacity:.55"' : '') + '>' + esc(hol) + '</div>' : '')
      +   evs.slice(0, 보임).map(function(e){ return chipHtml(e, c.date); }).join("")
      +   (숨김 > 0 ? '<div class="more" data-more="' + c.date + '" title="눌러서 그 날을 펼쳐 봅니다">+'
            + 숨김 + '개 더</div>' : '')
      + '</div></div>';
  }).join("");
  return '<div class="cal">'
    + '<div class="calhd">' + ["일","월","화","수","목","금","토"].map(function(w,i){
        return '<div' + (i===0 ? ' class="sun"' : i===6 ? ' class="sat"' : '') + '>' + w + '</div>';
      }).join("") + '</div>'
    + '<div class="calgrid">' + cells + '</div></div>';
}

/* ── 펼침 창 ── 접힌 날을 «그 자리에서» 전부 보여 준다.
   ⚠ 다른 화면으로 데려가지 않는다 — 한 칸을 보려고 보던 달을 잃으면 안 된다.
     자리잡기는 그린 뒤에 한다(펼침자리) — 칸이 어디 있는지는 그려 봐야 안다. */
function 펼침Html(eumOnly){
  if(!S.open) return "";
  var evs = eventsOn(S.open, eumOnly).filter(passFilter).filter(matchSearch);
  var hol = holidayOf(S.open);
  var d = new Date(S.open + "T00:00:00");
  return '<div class="pop" id="pop">'
    + '<div class="ph">' + esc(S.open.slice(5).replace("-", "월 ")) + '일'
    +   ' (' + ["일","월","화","수","목","금","토"][d.getDay()] + ')'
    +   ' <span class="n">' + evs.length + '건</span>'
    +   '<button class="x" data-popclose="1" title="닫기">✕</button></div>'
    + '<div class="evs">'
    +   (hol ? '<div class="ev hol">' + esc(hol) + '</div>' : "")
    +   evs.map(function(e){ return chipHtml(e, S.open); }).join("")
    +   (evs.length ? "" : '<div style="font-size:11.5px;color:var(--sub);padding:4px 2px">이 날은 비어 있습니다</div>')
    + '</div></div>';
}
function 펼침자리(){
  var p = document.getElementById("pop");
  if(!p) return;
  var 칸 = document.querySelector('.day[data-day="' + S.open + '"]');
  if(!칸){ S.open = null; p.parentNode.removeChild(p); return; }
  var r = 칸.getBoundingClientRect();
  var w = p.offsetWidth, h = p.offsetHeight;
  /* 칸 위에 겹쳐 띄우되, 화면 밖으로 나가면 안쪽으로 당긴다 */
  var x = r.left - 2, y = r.top - 2;
  if(x + w > window.innerWidth - 8) x = window.innerWidth - w - 8;
  if(y + h > window.innerHeight - 8) y = window.innerHeight - h - 8;
  p.style.left = Math.max(8, x) + "px";
  p.style.top  = Math.max(8, y) + "px";
}

/* ── 주 보기 ── 이알피와 같게: 이레를 나란히, 하루씩 위에서 아래로 */
function weekDays(ymd){
  var d = new Date(ymd + "T00:00:00"), out = [];
  d.setDate(d.getDate() - d.getDay());
  for(var i=0;i<7;i++){ out.push(ymdOf(d.getFullYear(), d.getMonth()+1, d.getDate())); d.setDate(d.getDate()+1); }
  return out;
}
function weekHtml(eumOnly){
  var days = weekDays(S.date), today = todayYMD();
  var cols = days.map(function(ds){
    var evs = eventsOn(ds, eumOnly).filter(passFilter).filter(matchSearch);
    var hol = holidayOf(ds);
    var 오늘 = ds === today;
    var d = new Date(ds + "T00:00:00");
    var 어둠 = S.theme === "dark";
    /* 주 보기도 달 보기와 같은 잣대다 — 오늘·공휴일 모두 칸 배경은 흰색 그대로다 */
    var wbg = 어둠 ? "#1e293b" : "#ffffff";
    return '<div class="wcol' + (오늘 ? " today" : "") + '" data-day="' + ds + '" style="background:' + wbg + '">'
      + '<div class="whd' + (d.getDay()===0 ? " sun" : d.getDay()===6 ? " sat" : "") + '">'
      +   ["일","월","화","수","목","금","토"][d.getDay()]
      +   '<div class="dnum' + (오늘 ? " today" : "") + '">' + d.getDate() + '</div>'
      +   '<span class="lun">(' + lunarDay(ds) + ')</span></div>'
      + '<div class="evs">'
      +   (hol ? '<div class="ev hol">' + esc(hol) + '</div>' : '')
      +   evs.map(function(e){ return chipHtml(e, ds); }).join("")
      + '</div></div>';
  }).join("");
  return '<div class="cal"><div class="wgrid">' + cols + '</div></div>';
}

/* ── 일 보기 ── 하루치를 한 줄씩 크게 */
function dayHtml(eumOnly){
  var ds = S.date;
  var evs = eventsOn(ds, eumOnly).filter(passFilter).filter(matchSearch);
  var hol = holidayOf(ds);
  return '<div class="cal"><div class="dayview" data-day="' + ds + '">'
    + (hol ? '<div class="ev hol">' + esc(hol) + '</div>' : '')
    + (evs.length ? evs.map(function(e){ return chipHtml(e, ds); }).join("")
                  : '<div class="later"><p>이 날에는 아무것도 없습니다. 눌러서 넣으세요.</p></div>')
    + '</div></div>';
}

/* ── 위 줄 ── ◀ 2026-09 ▶ · 병오년8월 – 9월 · 오늘 · [월|주|일] · 🔍 일정 검색 */
/* 달력 머리줄 — 달 이동·보기·검색. «한 줄»이다 (대표 지시 2026-09-19 「한줄로 정리해라」).
   ★ 사람 칩은 여기 없다 — 탭 줄로 올렸다(대표 지시 「캡쳐1은 캡쳐2 줄에 넣어라」).
     탭 줄은 오른쪽이 통째로 비어 있었고, 칩을 한 줄 따로 두면 달력이 그만큼 내려간다.
   ⚠ 좁은 화면에서는 접힌다(flex-wrap). 못 들어가는 것을 우겨 넣으면 글자가 잘린다.
   ⚠ eumOnly 를 그대로 받는다 — 쓰지 않아도 부르는 쪽 모양을 바꾸지 않는다. */
function calheadHtml(eumOnly){
  return '<div class="calhead">' + monthbarHtml() + srchHtml() + '</div>';
}
function monthbarHtml(){
  var 가운데 = S.view === "month" ? S.ym
    : S.view === "week" ? (function(){ var w = weekDays(S.date); return w[0].slice(5) + " ~ " + w[6].slice(5); })()
    : (S.date.slice(5) + " (" + ["일","월","화","수","목","금","토"][new Date(S.date + "T00:00:00").getDay()] + ")");
  var 음력 = S.view === "month" ? lunarRange(S.ym) : "";
  return '<div class="monthbar">'
    + '<button class="mv" data-mv="-1">◀</button>'
    + '<span class="ym">' + esc(가운데) + '</span>'
    + '<button class="mv" data-mv="1">▶</button>'
    + (음력 ? '<span class="lunrange">' + esc(음력) + '</span>' : '')
    + '<button class="todaybtn" data-mv="0">오늘</button>'
    + '<span class="seg">'
    + [["month","월"],["week","주"],["day","일"]].map(function(v){
        return '<button data-view="' + v[0] + '"' + (S.view === v[0] ? ' class="on"' : '') + '>' + v[1] + '</button>';
      }).join("")
    + '</span>'
    + '</div>';
}

/* 검색칸 — 줄 맨 오른쪽 끝에 붙는다(.calhead .srch 의 margin-left:auto).
   ⚠ 달바 안에 두면 월|주|일 바로 옆에 붙어 오른쪽이 통째로 빈다. */
function srchHtml(){
  return 구글단추Html() + 색단추Html() + 잇기단추Html()
    + '<span class="srch"><span class="ic">🔍</span>'
    + '<input type="search" id="calq" placeholder="일정 검색" value="' + esc(S.q) + '"></span>';
}
/* 「계정 잇기」 단추 — 아직 안 이은 사람이 있을 때만, 관리자에게만 보인다.
   ⚠ 할 일이 없으면 안 보인다. 늘 떠 있으면 머리줄만 좁아지고 아무도 안 누른다. */
function 잇기단추Html(){
  if(!잇기할수있나()) return "";
  var 남음 = 안이은수();
  if(!남음) return "";
  return '<button class="linkacct" data-mmopen="1" title="구글 일정에는 «누가 만들었는지»만 남습니다.'
    + ' 한 번 이어 주면 그 뒤로 담당자 색이 정확해집니다.">👤 계정 잇기 ' + 남음 + '명</button>';
}

/* 검색 — 제목·메모·사람 이름 어디에 걸려도 남긴다 */
function matchSearch(e){
  if(!S.q) return true;
  return String(e.tip || e.text || "").toLowerCase().indexOf(S.q.toLowerCase()) >= 0;
}

/* ── 사람 칩 ── 이알피처럼 «색 동그라미 + 이름 두 글자».
   ⚠ 색은 이알피가 정한 것을 그대로 쓴다 — 같은 사람이 두 앱에서 다른 색이면
     그 색은 아무 뜻도 없어진다. 여기서 새로 정하지 않는다. */
function chipsHtml(eumOnly){
  var 사람 = eumOnly ? ieumPeople().filter(function(p){ return !p.left; }) : users().map(function(u){
    return { pk:u.sid, name:u.name || u.sid, color: colorOf(u.sid) || "#64748b" };
  });
  /* 배지 숫자의 «뜻» — 이알피와 같다: 총 건수가 아니라 «같은 날에 두 건 넘게 잡힌 날이 며칠인가».
     ⚠ 총 건수를 적으면 바쁜 사람일수록 큰 숫자가 붙어 아무 뜻도 없다.
       겹친 날을 세면 「이 사람 그날 두 탕이다」가 눈에 띈다 — 그게 봐야 할 것이다. */
  var 겹침 = {};
  monthDates().forEach(function(ds){
    var 하루 = {};
    eventsOn(ds, eumOnly).forEach(function(e){
      var k = e.externalId || e.sid; if(!k) return;
      하루[k] = (하루[k] || 0) + 1;
    });
    Object.keys(하루).forEach(function(k){ if(하루[k] >= 2) 겹침[k] = (겹침[k] || 0) + 1; });
  });
  /* 원천 칩 — 이알피 머리줄의 「푸른 · 이음 · 구글(126)」과 같은 뜻.
     ⚠ 구글 칩에 «몇 건인지»를 적는다. 0 이면 못 받은 것인지 없는 것인지 갈라 적는다 —
       빈 달력을 말없이 보여 주는 것이 가장 나쁘다(2026-09-18 에 그래서 텅 비어 보였다). */
  /* 이알피와 «같은 수»를 적는다 — 이알피는 받아 온 것 전부를 센다(앞뒤 달에 걸친
     42칸 어치). 이 달 것만 세면 이알피 화면과 숫자가 달라 보인다. */
  var 구글수 = GCAL.evs.length;
  var 앞 = '<button class="allchip' + (S.filter === null ? " on" : "") + '" data-f="">전체</button>';
  var 뒤 = eumOnly ? '' : (
      '<span class="srcsep"></span>'
    + '<button class="chip' + (S.filter === "pureun" ? " on" : "") + '" data-f="pureun">푸른</button>'
    + '<button class="chip' + (S.filter === "eumwork" ? " on" : "") + '" data-f="eumwork">이음</button>'
    + (GCAL.err
        ? '<button class="chip warn" data-gcalretry="1" title="' + esc(GCAL.err) + '">⚠ 구글 못 받음 — 다시</button>'
        : GCAL.loading
          ? '<button class="chip" disabled>⏳ 구글 받는 중</button>'
          : '<button class="chip' + (S.filter === "gcal" ? " on" : "") + '" data-f="gcal">구글 (' + 구글수 + ')</button>')
  );
  return '<div class="chips">' + 앞
    + 사람.map(function(p){
        var on = S.filter === p.pk;
        var n = 겹침[p.pk] || 0;
        return '<span class="pwrap">'
          + '<button class="pchip' + (on ? " on" : "") + '" data-f="' + esc(p.pk) + '"'
          + ' title="' + esc(p.name) + '" style="background:' + esc(p.color) + '">'
          + esc(String(p.name).slice(0,2)) + '</button>'
          + (n ? '<span class="pcount" title="' + esc(p.name) + ' 같은 날 겹친 일정 ' + n + '일">'
                 + (n > 9 ? "9+" : n) + '</span>' : '')
          + '</span>';
      }).join("")
    + 뒤 + '</div>';
}

/* 지금 보고 있는 범위의 날짜들 — 칩 옆 건수를 그 범위로만 센다 */
/* 지금 «보이는» 첫 날과 마지막 날 — 앞뒤 달에 걸친 줄까지 넣는다.
   ⚠ 그 달의 1일~말일로 자르면, 달력 첫 줄·끝 줄에 걸친 앞뒤 달 날짜가 빈 채로 뜬다. */
function 보이는범위(){
  if(S.view === "day") return { from:S.date, to:S.date };
  if(S.view === "week"){ var w = weekDays(S.date); return { from:w[0], to:w[w.length-1] }; }
  var g = monthGrid(S.ym);
  return { from:g[0].date, to:g[g.length-1].date };
}
/* 사건 기한·휴직 칩 — 한 번 셈해 날짜별로 모아 둔다(칸마다 다시 셈하면 42번 돈다).
   ⚠ 셈은 js/pu-case-due.js 한 곳이다. 여기서 다시 짜지 말 것 —
     이알피 「나의 업무」의 D-day 도 같은 셈을 쓴다. */
var _기한칩 = { 열쇠:"", 표:{} };
function 기한칩(ymd){
  var r = 보이는범위();
  var 열쇠 = r.from + "~" + r.to + "|" + (D.cases ? arr(D.cases).length : 0)
    + "|" + (D.leave_of_absence ? arr(D.leave_of_absence).length : 0);
  if(_기한칩.열쇠 !== 열쇠){
    var 표 = {};
    if(typeof PuCaseDue !== "undefined"){
      PuCaseDue.chips({
        cases: arr(D.cases), stageCatalog: arr(D.biz_case_stages),
        loa: arr(D.leave_of_absence), users: users(),
        from: r.from, to: r.to
      }).forEach(function(c){ (표[c.date] = 표[c.date] || []).push(c); });
    }
    _기한칩 = { 열쇠:열쇠, 표:표 };
  }
  return _기한칩.표[ymd] || [];
}

function monthDates(){
  if(S.view === "day") return [S.date];
  if(S.view === "week") return weekDays(S.date);
  return monthGrid(S.ym).filter(function(c){ return !c.other; }).map(function(c){ return c.date; });
}

/* 못 읽은 칸이 있으면 숨기지 않는다 — 빈 달력은 「일정이 없다」는 거짓말이 된다. */
function failedHtml(){
  var ks = Object.keys(FAILED);
  if(!ks.length) return '';
  return '<div class="note"><span>⚠ 못 읽은 자료가 있습니다 — 달력이 다 차 보이지 않을 수 있습니다: '
    + esc(ks.join(' · ')) + '</span></div>';
}

/* 어느 표가 아직 «배열»이면 그 표는 여기서 못 고친다 — 쓰면 표가 깨진다.
   ⚠ 이 말을 달력 «맨 위»에 띠로 두지 않는다 — 달력은 이알피와 같아야 하고,
     아직 아무것도 안 하려는 사람에게 못 하는 것부터 말하면 화면만 좁아진다.
     대신 «고치려고 창을 연 그 순간» 그 자리에서 말한다(못 한다가 아니라 저기서 한다).
     (대표 지시 2026-09-18 「대시보드 제외한 화면은 똑같이 만들어라」) */
function 옛방식표(store){
  return !PuCalWrite.isMapForm(PuCalRead.rawForm(store));
}
function 옛방식안내(store){
  var 이름 = store === 'my_schedules' ? '일정' : '근태';
  return '⚠ ' + 이름 + '은(는) 아직 옛 방식(배열)으로 담겨 있어 여기서 못 고칩니다.\n'
    + '푸른이알피에서 고쳐 주세요 — 여기서 쓰면 표가 깨집니다.';
}
/* 마감된 달을 보고 있으면 미리 알린다 — 눌러 보고 나서 거절당하는 것보다 낫다 */
function lockNote(){
  if(arr(D.locked_attend_months).indexOf(S.ym) < 0) return '';
  return '<div class="note"><span>🔒 '+esc(S.ym)+' 근태·휴가는 마감됐습니다 — 연차·근태는 고칠 수 없습니다'
    + ' (일정은 됩니다).</span></div>';
}

/* ── 이음센터 · 인원 현황 ─────────────────────────────────────────────
   「누가 몇 번 이음센터에 나갔나」를 사람별로 센다.
   ⚠ 이 화면은 «읽기»다. 한도·비고·강의 기록을 고치는 것은 아직 이알피에서 한다 —
     그 세 자리는 한 줄짜리 기록이 아니라 «표 통째»로 담겨 있어, 우리 저장 관문
     (칸별로 보내기)이 그대로 못 쓴다. 억지로 통째 저장을 흉내 내면 두 사람이
     같은 순간에 고칠 때 한쪽이 통째로 날아간다. */
var IEUM_START_YEAR = 2024;
/* 이알피의 같은 이름과 «같은 값»이어야 한다 — 다르면 밖으로 나간 링크가 갈린다.
   tests/cal-ieum-view.test.js 가 두 값을 맞대 본다. */
var IEUM_VIEW_BASE = 'https://nabaho.github.io/pureunall/ieum-view.html';

/* 사람 목록 — 내부 노무사 → 외부 노무사 → 변호사 → 그만둔 사람(기록이 있는 경우만).
   ⚠ 그만둔 사람을 지우지 않는다 — 지나간 근무 기록이 사라지면 셈이 틀어진다. */
function ieumPeople(){
  var ext = arr(D.external_staff);
  var att = arr(D.attendance_records);
  var 살아있는외부 = ext.filter(function(x){ return x && x.active !== false; });
  var 이음근무있나 = function(pred){ return att.some(function(r){ return r.type === "eum-work" && pred(r); }); };
  var 수동명단 = Array.isArray(D.ieum_members) ? D.ieum_members : null;
  var rows = [];
  /* 내부: 노무사는 늘 넣는다. 수동 명단이 있으면 그것을, 없으면 이음근무 기록이 있는 사람을. */
  users().forEach(function(u){
    var 노무사 = (String(u.title||"") + String(u.role||"")).indexOf("노무사") >= 0;
    var 수동 = 수동명단 && 수동명단.indexOf(u.sid) >= 0;
    var 기록 = !수동명단 && 이음근무있나(function(r){ return r.sid === u.sid && !r.externalId; });
    if(!(노무사 || 수동 || 기록)) return;
    /* ⚠ 현직만 이 줄에 넣는다 — 이알피와 같은 기준(status === "active").
       그만둔 사람은 아래에서 «회색으로» 따로 넣는다. 여기 섞으면 그만둔 노무사가
       현직처럼 보이고, 이음 근무를 배정할 사람 목록에까지 오른다.
       (검사 tests/cal-ieum-same-as-erp.test.js 가 실제로 돌려 본다 — 처음엔 섞여 있었다) */
    if(u.status !== "active") return;
    rows.push({ pk:u.sid, name:u.name||u.sid, kind:"in", roleLabel:"내부 노무사",
      color:colorOf(u.sid) || "#1e40af", note:(D.ieum_notes && D.ieum_notes[u.sid]) || "",
      phone:u.phone||u.contact||"" });
  });
  var 변호사인가 = function(x){ return String(x.role||"").indexOf("변호사") >= 0; };
  살아있는외부.filter(function(x){ return !변호사인가(x); }).forEach(function(x){
    rows.push({ pk:x.id, name:x.name, kind:"ex", roleLabel:"외부 노무사", color:x.color||"#d97706", note:x.note||"", phone:x.contact||"" });
  });
  살아있는외부.filter(변호사인가).forEach(function(x){
    rows.push({ pk:x.id, name:x.name, kind:"law", roleLabel:"변호사", color:x.color||"#16a34a", note:x.note||"", phone:x.contact||"" });
  });
  /* 그만둔 사람 — 기록이 있을 때만, 회색으로 */
  var 이미 = {}; rows.forEach(function(r){ 이미[r.pk] = 1; });
  users().forEach(function(u){
    if(이미[u.sid] || u.status === "active") return;
    if(!이음근무있나(function(r){ return r.sid === u.sid && !r.externalId; })) return;
    rows.push({ pk:u.sid, name:u.name||u.sid, kind:"in", roleLabel:"내부 노무사", color:"#94a3b8", left:true, note:"" });
  });
  ext.filter(function(x){ return x && x.active === false; }).forEach(function(x){
    if(이미[x.id]) return;
    if(!이음근무있나(function(r){ return r.externalId === x.id; })) return;
    rows.push({ pk:x.id, name:x.name, kind:변호사인가(x)?"law":"ex", roleLabel:변호사인가(x)?"변호사":"외부 노무사",
      color:"#94a3b8", left:true, note:x.note||"" });
  });
  return rows;
}

/* 범위 안인가 — 월 / 연 / 전체 */
function inScope(ds){
  if(!ds) return false;
  if(S.scope === "year") return ds.slice(0,4) === S.ym.slice(0,4);
  if(S.scope === "all")  return true;
  return ds.slice(0,7) === S.ym;
}

/* ── 이음센터 · 인원 현황 ─────────────────────────────────────────────────
   대표 지시 2026-09-18 (/goal) 「대시보드 제외한 화면은 똑같이 만들어라」로
   이알피(IeumPeopleTab)와 같은 꼴로 지었다.

   ★ 2026-09-20 «연간 한도»와 «이음강의 기록»을 걷어냈다 (대표 지시 「정리 지워라」).
     두 기능은 만들어만 두고 **아무도 한 번도 안 썼다** — 서버의 ieum_caps ·
     ieum_lectures 가 둘 다 비어 있었다(실측). 안 쓰는 칸이 표에 넉 줄(법률상담 잔여 ·
     이음강의 · 이음강의 잔여 · 강의 이력)을 차지하고 늘 「—」만 뜨고 있었다.
     ⚠ 되살리지 말 것. 다시 필요해지면 «쓸 사람과 함께» 새로 짓는다.
   ⚠ 비고를 «고치는» 것은 아직 이알피에서 한다(다음 걸음). 여기서는 보여만 준다. */
var ROLE_CHIP = { in:{bg:"#eff6ff",fg:"#2563eb"}, ex:{bg:"#eff6ff",fg:"#2563eb"}, law:{bg:"#fffbeb",fg:"#d97706"} };
function ieumKcell(color, label, val, unit, last){
  return '<div class="kcell"' + (last ? ' style="border-right:none"' : '') + '>'
    + '<span class="kdot" style="background:' + color + '"></span>'
    + '<span class="klabel">' + esc(label) + '</span>'
    + '<span class="kval">' + esc(String(val)) + '<small>' + esc(unit) + '</small></span></div>';
}

function peopleHtml(){
  var rows = ieumPeople();
  var att = arr(D.attendance_records);
  var duty = {};
  att.forEach(function(r){
    if(!r || r.type !== "eum-work" || !inScope(r.date)) return;
    var pk = r.externalId || r.sid; if(!pk) return;
    var mm = r.date.slice(0,7), dd = parseInt(r.date.slice(8,10),10);
    if(!duty[pk]) duty[pk] = { total:0, byMonth:{} };
    if(!duty[pk].byMonth[mm]) duty[pk].byMonth[mm] = [];
    duty[pk].byMonth[mm].push(dd); duty[pk].total++;
  });
  Object.keys(duty).forEach(function(pk){ Object.keys(duty[pk].byMonth).forEach(function(mm){ duty[pk].byMonth[mm].sort(function(a,b){return a-b;}); }); });
  var dutyTotal = 0, lawUsedTotal = 0;
  rows.forEach(function(p){
    var t = (duty[p.pk]||{}).total || 0;
    if(p.kind === "law") lawUsedTotal += t; else dutyTotal += t;
  });
  var visible = S.showLeft ? rows : rows.filter(function(p){ return !p.left; });
  var maxDuty = 1; rows.forEach(function(p){ var t=(duty[p.pk]||{}).total||0; if(t>maxDuty) maxDuty=t; });
  var scopeSfx = S.scope === "month" ? "(" + parseInt(S.ym.slice(5,7),10) + "월)" : S.scope === "year" ? "(" + S.ym.slice(0,4) + ")" : "(전체)";
  var 범위말 = S.scope === "year" ? S.ym.slice(0,4) + "년" : S.scope === "all" ? "전체 (" + IEUM_START_YEAR + "~)" : S.ym;
  var 그만둔수 = rows.filter(function(p){ return p.left; }).length;

  var 행들 = visible.map(function(p, idx){
    var d = duty[p.pk] || { total:0, byMonth:{} };
    var isLaw = p.kind === "law";
    var open = S.openRows && S.openRows[p.pk];
    var chip = ROLE_CHIP[p.kind] || ROLE_CHIP.in;
    var dutyPct = Math.round((d.total||0) / maxDuty * 100);
    var 줄 = '<tr class="prow' + (open ? " open" : "") + '" data-toggle="' + esc(p.pk) + '" style="opacity:' + (p.left ? ".55" : "1") + '">'
      + '<td class="no">' + (idx+1) + '</td>'
      + '<td><div class="pname"><span class="avatar" style="background:' + esc(p.color) + '">' + esc(String(p.name||"?").charAt(0)) + '</span>'
      +   '<span class="nm">' + esc(p.name) + '</span>'
      +   (p.left ? '<span class="leftbadge">🚪 ' + (p.kind==="in"?"퇴사":"종료") + '</span>' : "") + '</div></td>'
      + '<td><span class="rolechip" style="background:' + chip.bg + ';color:' + chip.fg + '">' + esc(p.roleLabel) + '</span></td>'
      + '<td>' + ((!isLaw && d.total) ? ('<div class="barwrap"><span class="barnum">' + d.total + '<small>일</small></span>'
          + '<div class="bartrack"><span class="barfill" style="width:' + dutyPct + '%;background:' + p.color + '"></span></div></div>')
          : '<span class="dash">—</span>') + '</td>'
      /* 법률상담 — 변호사의 이음 근무를 센 것이다(한도는 2026-09-20 에 걷어냈다) */
      + '<td>' + (isLaw

function doSave(){
  modalRead();

  var store = 일정 ? "my_schedules" : "attendance_records";
  if(!m.date){ m.err = "날짜를 골라 주세요"; render(); return; }
  if(일정 && !String(m.title||"").trim()){ m.err = "무슨 일인지 적어 주세요"; render(); return; }
  var id = m.mode==="edit" ? m.id : PuCalWrite.newId(일정 ? "sch" : "att");
  var item = { id:id, date:m.date, sid:m.sid, note:String(m.note||"") };
  if(일정) item.title = String(m.title).trim();
  else { item.type = m.type; item.hours = PuWork.hoursOf(m.type, m.hours); }
  /* 고치는 것이면 «내가 보던 판»을 함께 넘긴다 — 바뀐 칸만 보내고,
     원래 있던 달이 잠겼는지도 그것으로 본다. */
  var prev = m.mode==="edit" ? (recOf(store, id) || m.prev) : null;
  S.busy = true; m.err = ""; render();
  PuCalWrite.save(store, item, prev).then(function(r){

    if(store === "attendance_records") 발행예약();
