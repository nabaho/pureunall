/* 검색칸 — 줄 맨 오른쪽 끝에 붙는다(.calhead .srch 의 margin-left:auto).
   ⚠ 달바 안에 두면 월|주|일 바로 옆에 붙어 오른쪽이 통째로 빈다. */
function srchHtml(){
  /* ★ 구글 로그인·사람 색 단추는 «내 동그라미» 창으로 옮겼다(창도구Html) — 겹치던 것을 합쳤다.
     계정 잇기는 «할 일이 있을 때만» 뜨는 알림이라 여기 그대로 둔다. */
  var 열림 = !!(S.srch || S.q);
  return 잇기단추Html()
    + (열림
        ? '<span class="srch"><span class="ic">🔍</span>'
          + '<input type="search" id="calq" placeholder="일정 검색" value="' + esc(S.q) + '"></span>'
        : '<button class="ib" data-srch="1" title="일정 검색">🔍</button>');
}
/* 「계정 잇기」 단추 — 아직 안 이은 사람이 있을 때만, 관리자에게만 보인다.
   ⚠ 할 일이 없으면 안 보인다. 늘 떠 있으면 머리줄만 좁아지고 아무도 안 누른다. */
function 잇기단추Html(){
  if(!잇기할수있나()) return "";
  var 남음 = 안이은수();
  if(!남음) return "";
  return '<button class="linkacct" data-mmopen="1" title="구글 일정에는 «누가 만들었는지»만 남습니다.'
    + ' 한 번 이어 주면 그 뒤로 담당자 색이 정확해집니다.">👤 계정 잇기 ' + 남음 + '명</button>';
}

/* 검색 — 제목·메모·사람 이름 어디에 걸려도 남긴다 */
function matchSearch(e){
  if(!S.q) return true;
  return String(e.tip || e.text || "").toLowerCase().indexOf(S.q.toLowerCase()) >= 0;
}

/* ── 사람 칩 ── 이알피처럼 «색 동그라미 + 이름 두 글자».
   ⚠ 색은 이알피가 정한 것을 그대로 쓴다 — 같은 사람이 두 앱에서 다른 색이면
     그 색은 아무 뜻도 없어진다. 여기서 새로 정하지 않는다. */
function chipsHtml(eumOnly){
  var 사람 = eumOnly ? ieumPeople().filter(function(p){ return !p.left; }) : users().map(function(u){
    return { pk:u.sid, name:u.name || u.sid, color: colorOf(u.sid) || "#64748b" };
  });
  /* 배지 숫자의 «뜻» — 이알피와 같다: 총 건수가 아니라 «같은 날에 두 건 넘게 잡힌 날이 며칠인가».
     ⚠ 총 건수를 적으면 바쁜 사람일수록 큰 숫자가 붙어 아무 뜻도 없다.
       겹친 날을 세면 「이 사람 그날 두 탕이다」가 눈에 띈다 — 그게 봐야 할 것이다. */
  var 겹침 = {};
  monthDates().forEach(function(ds){
    var 하루 = {};
    eventsOn(ds, eumOnly).forEach(function(e){
      var k = e.externalId || e.sid; if(!k) return;
      하루[k] = (하루[k] || 0) + 1;
    });
    Object.keys(하루).forEach(function(k){ if(하루[k] >= 2) 겹침[k] = (겹침[k] || 0) + 1; });
  });
  /* 원천 칩 — 이알피 머리줄의 「푸른 · 이음 · 구글(126)」과 같은 뜻.
     ⚠ 구글 칩에 «몇 건인지»를 적는다. 0 이면 못 받은 것인지 없는 것인지 갈라 적는다 —
       빈 달력을 말없이 보여 주는 것이 가장 나쁘다(2026-09-18 에 그래서 텅 비어 보였다). */
  /* 이알피와 «같은 수»를 적는다 — 이알피는 받아 온 것 전부를 센다(앞뒤 달에 걸친
     42칸 어치). 이 달 것만 세면 이알피 화면과 숫자가 달라 보인다. */
  var 구글수 = GCAL.evs.length;
  var 앞 = '<button class="allchip' + (S.filter === null ? " on" : "") + '" data-f="">전체</button>';
  var 뒤 = eumOnly ? '' : (
      '<span class="srcsep"></span>'
    + '<button class="chip' + (S.filter === "pureun" ? " on" : "") + '" data-f="pureun">푸른</button>'
    + '<button class="chip' + (S.filter === "priv" ? " on" : "") + '" data-f="priv" title="나만 보는 일정만">🔒 개인</button>'
    + (GCAL.err
        ? '<button class="chip warn" data-gcalretry="1" title="' + esc(GCAL.err) + '">⚠ 구글 못 받음 — 다시</button>'
        : GCAL.loading
          ? '<button class="chip" disabled>⏳ 구글 받는 중</button>'
          : '<button class="chip' + (S.filter === "gcal" ? " on" : "") + '" data-f="gcal">구글 ' + 구글수 + '</button>'
            + '<button class="chip' + (S.showGone ? " on" : "") + '" data-gone="1" title="구글에서 지워진 일정도 보관함에서 꺼내 보여 줍니다">🗄 지운 일정</button>'
            /* 로그인이 필요할 때만 자물쇠 — 누르면 구글 로그인(예전 「🔐 구글 로그인」 단추) */
            + (구글단추Html() ? '<button class="glock" data-glogin="1" title="구글과 이어진 일정을 지우려면 구글 로그인이 필요합니다">🔐</button>' : ''))
  );
  return '<div class="chips">' + 앞
    + 사람.map(function(p){
        var on = S.filter === p.pk;
        var n = 겹침[p.pk] || 0;
        /* 「이게 나」를 테두리로 알린다 — 안 알리면 눌러 보기 전까지 모른다 */
        var 내칩 = !!(typeof ME !== "undefined" && ME && ME.sid && p.pk === ME.sid);
        return '<span class="pwrap">'
          + '<button class="pchip' + (on ? " on" : "") + '" data-f="' + esc(p.pk) + '"'
          /* ★ 이음 근무 탭에서는 칩을 날짜 칸으로 «끌어 놓으면» 그날 이음센터 근무가 들어간다
               (대표 지시 2026-09-27 「이음근무를 마우스로 드레그해서 넣을 수 있게」) */
          + (eumOnly ? ' draggable="true" data-dragp="' + esc(p.pk) + '"' : '')
          + (내칩 ? ' data-me="1"' : '')
          + ' title="' + esc(p.name)
          +   (내칩 ? ' (나) — 눌러서 내 색을 고릅니다' : '')
          +   (eumOnly ? ' — 끌어서 날짜 칸에 놓으면 그날 이음센터 근무가 들어갑니다' : '')
          + '" style="background:' + esc(p.color) + '">'
          + esc(String(p.name).slice(0,2)) + '</button>'
          + (n ? '<span class="pcount" title="' + esc(p.name) + ' 같은 날 겹친 일정 ' + n + '일">'
                 + (n > 9 ? "9+" : n) + '</span>' : '')
          + '</span>';
      }).join("")
    + 뒤 + '</div>';
}

/* 지금 보고 있는 범위의 날짜들 — 칩 옆 건수를 그 범위로만 센다 */
/* 지금 «보이는» 첫 날과 마지막 날 — 앞뒤 달에 걸친 줄까지 넣는다.
   ⚠ 그 달의 1일~말일로 자르면, 달력 첫 줄·끝 줄에 걸친 앞뒤 달 날짜가 빈 채로 뜬다. */
function 보이는범위(){
  if(S.view === "day") return { from:S.date, to:S.date };
  if(S.view === "week"){ var w = weekDays(S.date); return { from:w[0], to:w[w.length-1] }; }
  var g = monthGrid(S.ym);
  return { from:g[0].date, to:g[g.length-1].date };
}
/* 사건 기한·휴직 칩 — 한 번 셈해 날짜별로 모아 둔다(칸마다 다시 셈하면 42번 돈다).
   ⚠ 셈은 js/pu-case-due.js 한 곳이다. 여기서 다시 짜지 말 것 —
     이알피 「나의 업무」의 D-day 도 같은 셈을 쓴다. */
var _기한칩 = { 열쇠:"", 표:{} };
function 기한칩(ymd){
  var r = 보이는범위();
  var 열쇠 = r.from + "~" + r.to + "|" + (D.cases ? arr(D.cases).length : 0)
    + "|" + (D.leave_of_absence ? arr(D.leave_of_absence).length : 0);
  if(_기한칩.열쇠 !== 열쇠){
    var 표 = {};
    if(typeof PuCaseDue !== "undefined"){
      PuCaseDue.chips({
        cases: arr(D.cases), stageCatalog: arr(D.biz_case_stages),
        loa: arr(D.leave_of_absence), users: users(),
        from: r.from, to: r.to
      }).forEach(function(c){ (표[c.date] = 표[c.date] || []).push(c); });
    }
    _기한칩 = { 열쇠:열쇠, 표:표 };
  }
  return _기한칩.표[ymd] || [];
}
/* 🧑‍💼 컨설턴트 모집 칩 — 대표 개인 클라우드(gov/{uid}/recruit)를 «읽기만» 한다.
   ⚠ 기관 묶기·모집 달·준비 날 셈은 GovRecruit(js/gov-recruit.js) 한 곳이다 —
     PuCalRecruit 는 그것을 불러 칩으로 바꿀 뿐이다. 여기서 다시 셈하지 말 것.
   ⚠ 대표가 아니면 읽지도 않는다. 못 읽으면(권한·그물) 조용히 빈 층 — 달력은 멀쩡해야 한다. */
var RECRUIT = { data:null, rev:0 };
var _모집칩 = { 열쇠:"", 표:{} };
function 모집칩(ymd){
  if(!RECRUIT.data || typeof PuCalRecruit === "undefined" || typeof GovRecruit === "undefined") return [];
  var r = 보이는범위();
  var 열쇠 = r.from + "~" + r.to + "|" + RECRUIT.rev;
  if(_모집칩.열쇠 !== 열쇠){
    var 표 = {};
    try{
      PuCalRecruit.chips({ recruit:RECRUIT.data, GovRecruit:GovRecruit, from:r.from, to:r.to,
        sid:(typeof ME !== "undefined" && ME && ME.sid) || "" })
        .forEach(function(c){ (표[c.date] = 표[c.date] || []).push(c); });
    }catch(e){ console.warn("[모집 일정] 셈 실패", e && e.message); }
    _모집칩 = { 열쇠:열쇠, 표:표 };
  }
  return _모집칩.표[ymd] || [];
}
function 모집받기(){
  if(!fbDb || !S.uid || typeof PuCalRecruit === "undefined") return Promise.resolve();
  if(!PuCalRecruit.isOwner(typeof ME !== "undefined" ? ME : null)) return Promise.resolve();
  return fbDb.ref("gov/" + S.uid + "/recruit").once("value").then(function(snap){
    RECRUIT.data = snap.val() || null; RECRUIT.rev++;
    render();
  })["catch"](function(e){ console.warn("[모집 일정] 못 읽음", e && e.message); });
}

function monthDates(){
  if(S.view === "day") return [S.date];
  if(S.view === "week") return weekDays(S.date);
  return monthGrid(S.ym).filter(function(c){ return !c.other; }).map(function(c){ return c.date; });
}

/* 못 읽은 칸이 있으면 숨기지 않는다 — 빈 달력은 「일정이 없다」는 거짓말이 된다. */
function failedHtml(){
  var ks = Object.keys(FAILED);
  if(!ks.length) return '';
  return '<div class="note"><span>⚠ 못 읽은 자료가 있습니다 — 달력이 다 차 보이지 않을 수 있습니다: '
    + esc(ks.join(' · ')) + '</span></div>';
}

/* 어느 표가 아직 «배열»이면 그 표는 여기서 못 고친다 — 쓰면 표가 깨진다.
   ⚠ 이 말을 달력 «맨 위»에 띠로 두지 않는다 — 달력은 이알피와 같아야 하고,
     아직 아무것도 안 하려는 사람에게 못 하는 것부터 말하면 화면만 좁아진다.
     대신 «고치려고 창을 연 그 순간» 그 자리에서 말한다(못 한다가 아니라 저기서 한다).
     (대표 지시 2026-09-18 「대시보드 제외한 화면은 똑같이 만들어라」) */
function 옛방식표(store){
  return !PuCalWrite.isMapForm(PuCalRead.rawForm(store));
}
function 옛방식안내(store){
  var 이름 = store === 'my_schedules' ? '일정' : '근태';
  return '⚠ ' + 이름 + '은(는) 아직 옛 방식(배열)으로 담겨 있어 여기서 못 고칩니다.\n'
    + '푸른이알피에서 고쳐 주세요 — 여기서 쓰면 표가 깨집니다.';
}
/* 마감된 달을 보고 있으면 미리 알린다 — 눌러 보고 나서 거절당하는 것보다 낫다 */
function lockNote(){
  if(arr(D.locked_attend_months).indexOf(S.ym) < 0) return '';
  return '<div class="note"><span>🔒 '+esc(S.ym)+' 근태·휴가는 마감됐습니다 — 연차·근태는 고칠 수 없습니다'
    + ' (일정은 됩니다).</span></div>';
}

/* ── 이음센터 · 인원 현황 ─────────────────────────────────────────────
   「누가 몇 번 이음센터에 나갔나」를 사람별로 센다.
   ⚠ 이 화면은 «읽기»다. 한도·비고·강의 기록을 고치는 것은 아직 이알피에서 한다 —
     그 세 자리는 한 줄짜리 기록이 아니라 «표 통째»로 담겨 있어, 우리 저장 관문
     (칸별로 보내기)이 그대로 못 쓴다. 억지로 통째 저장을 흉내 내면 두 사람이
     같은 순간에 고칠 때 한쪽이 통째로 날아간다. */
var IEUM_START_YEAR = 2024;
/* 이알피의 같은 이름과 «같은 값»이어야 한다 — 다르면 밖으로 나간 링크가 갈린다.
   tests/cal-ieum-view.test.js 가 두 값을 맞대 본다. */
var IEUM_VIEW_BASE = 'https://nabaho.github.io/pureunall/ieum-view.html';

/* 사람 목록 — 내부 노무사 → 외부 노무사 → 변호사 → 그만둔 사람(기록이 있는 경우만).
   ⚠ 그만둔 사람을 지우지 않는다 — 지나간 근무 기록이 사라지면 셈이 틀어진다. */
function ieumPeople(){
  var ext = arr(D.external_staff);
  var att = arr(D.attendance_records);
  var 살아있는외부 = ext.filter(function(x){ return x && x.active !== false; });
  var 이음근무있나 = function(pred){ return att.some(function(r){ return r.type === "eum-work" && pred(r); }); };
  var 수동명단 = Array.isArray(D.ieum_members) ? D.ieum_members : null;
  var rows = [];
  /* 내부: 노무사는 늘 넣는다. 수동 명단이 있으면 그것을, 없으면 이음근무 기록이 있는 사람을. */
  users().forEach(function(u){
    var 노무사 = (String(u.title||"") + String(u.role||"")).indexOf("노무사") >= 0;
    var 수동 = 수동명단 && 수동명단.indexOf(u.sid) >= 0;
    var 기록 = !수동명단 && 이음근무있나(function(r){ return r.sid === u.sid && !r.externalId; });
    if(!(노무사 || 수동 || 기록)) return;
    /* ⚠ 현직만 이 줄에 넣는다 — 이알피와 같은 기준(status === "active").
       그만둔 사람은 아래에서 «회색으로» 따로 넣는다. 여기 섞으면 그만둔 노무사가
       현직처럼 보이고, 이음 근무를 배정할 사람 목록에까지 오른다.
       (검사 tests/cal-ieum-same-as-erp.test.js 가 실제로 돌려 본다 — 처음엔 섞여 있었다) */
    if(u.status !== "active") return;
    rows.push({ pk:u.sid, name:u.name||u.sid, kind:"in", roleLabel:"내부 노무사",
      color:colorOf(u.sid) || "#1e40af", note:(D.ieum_notes && D.ieum_notes[u.sid]) || "",
      phone:u.phone||u.contact||"" });
  });
  var 변호사인가 = function(x){ return String(x.role||"").indexOf("변호사") >= 0; };
  살아있는외부.filter(function(x){ return !변호사인가(x); }).forEach(function(x){
    rows.push({ pk:x.id, name:x.name, kind:"ex", roleLabel:"외부 노무사", color:x.color||"#d97706", note:x.note||"", phone:x.contact||"" });
  });
  살아있는외부.filter(변호사인가).forEach(function(x){
    rows.push({ pk:x.id, name:x.name, kind:"law", roleLabel:"변호사", color:x.color||"#16a34a", note:x.note||"", phone:x.contact||"" });
  });
  /* 그만둔 사람 — 기록이 있을 때만, 회색으로 */
  var 이미 = {}; rows.forEach(function(r){ 이미[r.pk] = 1; });
  users().forEach(function(u){
    if(이미[u.sid] || u.status === "active") return;
    if(!이음근무있나(function(r){ return r.sid === u.sid && !r.externalId; })) return;
    rows.push({ pk:u.sid, name:u.name||u.sid, kind:"in", roleLabel:"내부 노무사", color:"#94a3b8", left:true, note:"" });
  });
  ext.filter(function(x){ return x && x.active === false; }).forEach(function(x){
    if(이미[x.id]) return;
    if(!이음근무있나(function(r){ return r.externalId === x.id; })) return;
    rows.push({ pk:x.id, name:x.name, kind:변호사인가(x)?"law":"ex", roleLabel:변호사인가(x)?"변호사":"외부 노무사",
      color:"#94a3b8", left:true, note:x.note||"" });
  });
  return rows;
}

/* 범위 안인가 — 월 / 연 / 전체 */
function inScope(ds){
  if(!ds) return false;
  if(S.scope === "year") return ds.slice(0,4) === S.ym.slice(0,4);
  if(S.scope === "all")  return true;
  return ds.slice(0,7) === S.ym;
}

/* ── 이음센터 · 인원 현황 ─────────────────────────────────────────────────
   대표 지시 2026-09-18 (/goal) 「대시보드 제외한 화면은 똑같이 만들어라」로
   이알피(IeumPeopleTab)와 같은 꼴로 지었다.

   ★ 2026-09-20 «연간 한도»와 «이음강의 기록»을 걷어냈다 (대표 지시 「정리 지워라」).
     두 기능은 만들어만 두고 **아무도 한 번도 안 썼다** — 서버의 ieum_caps ·
     ieum_lectures 가 둘 다 비어 있었다(실측). 안 쓰는 칸이 표에 넉 줄(법률상담 잔여 ·
     이음강의 · 이음강의 잔여 · 강의 이력)을 차지하고 늘 「—」만 뜨고 있었다.
     ⚠ 되살리지 말 것. 다시 필요해지면 «쓸 사람과 함께» 새로 짓는다.
   ⚠ 비고를 «고치는» 것은 아직 이알피에서 한다(다음 걸음). 여기서는 보여만 준다. */
var ROLE_CHIP = { in:{bg:"#eff6ff",fg:"#2563eb"}, ex:{bg:"#eff6ff",fg:"#2563eb"}, law:{bg:"#fffbeb",fg:"#d97706"} };
function ieumKcell(color, label, val, unit, last){
  return '<div class="kcell"' + (last ? ' style="border-right:none"' : '') + '>'
    + '<span class="kdot" style="background:' + color + '"></span>'
    + '<span class="klabel">' + esc(label) + '</span>'
    + '<span class="kval">' + esc(String(val)) + '<small>' + esc(unit) + '</small></span></div>';
}

function peopleHtml(){
  var rows = ieumPeople();
  var att = arr(D.attendance_records);
  var duty = {};
  att.forEach(function(r){
    if(!r || r.type !== "eum-work" || !inScope(r.date)) return;
    var pk = r.externalId || r.sid; if(!pk) return;
    var mm = r.date.slice(0,7), dd = parseInt(r.date.slice(8,10),10);
    if(!duty[pk]) duty[pk] = { total:0, byMonth:{} };
    if(!duty[pk].byMonth[mm]) duty[pk].byMonth[mm] = [];
    duty[pk].byMonth[mm].push(dd); duty[pk].total++;
  });
  Object.keys(duty).forEach(function(pk){ Object.keys(duty[pk].byMonth).forEach(function(mm){ duty[pk].byMonth[mm].sort(function(a,b){return a-b;}); }); });
  var dutyTotal = 0, lawUsedTotal = 0;
  rows.forEach(function(p){
    var t = (duty[p.pk]||{}).total || 0;
    if(p.kind === "law") lawUsedTotal += t; else dutyTotal += t;
  });
  var visible = S.showLeft ? rows : rows.filter(function(p){ return !p.left; });
  var maxDuty = 1; rows.forEach(function(p){ var t=(duty[p.pk]||{}).total||0; if(t>maxDuty) maxDuty=t; });
  var scopeSfx = S.scope === "month" ? "(" + parseInt(S.ym.slice(5,7),10) + "월)" : S.scope === "year" ? "(" + S.ym.slice(0,4) + ")" : "(전체)";
  var 범위말 = S.scope === "year" ? S.ym.slice(0,4) + "년" : S.scope === "all" ? "전체 (" + IEUM_START_YEAR + "~)" : S.ym;
  var 그만둔수 = rows.filter(function(p){ return p.left; }).length;

  var 행들 = visible.map(function(p, idx){
    var d = duty[p.pk] || { total:0, byMonth:{} };
    var isLaw = p.kind === "law";
    var open = S.openRows && S.openRows[p.pk];
    var chip = ROLE_CHIP[p.kind] || ROLE_CHIP.in;
    var dutyPct = Math.round((d.total||0) / maxDuty * 100);
    var 줄 = '<tr class="prow' + (open ? " open" : "") + '" data-toggle="' + esc(p.pk) + '" style="opacity:' + (p.left ? ".55" : "1") + '">'
      + '<td class="no">' + (idx+1) + '</td>'
      + '<td><div class="pname"><span class="avatar" style="background:' + esc(p.color) + '">' + esc(String(p.name||"?").charAt(0)) + '</span>'
      +   '<span class="nm">' + esc(p.name) + '</span>'
      +   (p.left ? '<span class="leftbadge">🚪 ' + (p.kind==="in"?"퇴사":"종료") + '</span>' : "") + '</div></td>'
      + '<td><span class="rolechip" style="background:' + chip.bg + ';color:' + chip.fg + '">' + esc(p.roleLabel) + '</span></td>'
      + '<td>' + ((!isLaw && d.total) ? ('<div class="barwrap"><span class="barnum">' + d.total + '<small>일</small></span>'
          + '<div class="bartrack"><span class="barfill" style="width:' + dutyPct + '%;background:' + p.color + '"></span></div></div>')
          : '<span class="dash">—</span>') + '</td>'
      /* 법률상담 — 변호사의 이음 근무를 센 것이다(한도는 2026-09-20 에 걷어냈다) */
      + '<td>' + (isLaw
          ? ('<span class="lawcnt"><b>' + (d.total || 0) + '</b>회</span>')
          : '<span class="dash">—</span>') + '</td>'
      + '<td>' + (p.phone ? ('<a class="tel" href="tel:' + esc(String(p.phone).replace(/[^0-9]/g,"")) + '" onclick="event.stopPropagation()">📞</a> ' + esc(p.phone)) : '<span class="dash">—</span>') + '</td>'
      /* 비고 — 눌러서 그 자리에서 고친다(2걸음까지는 이알피로 보내던 자리다).
         ⚠ 줄 전체를 누르면 «펼치기»라, 여기서는 퍼짐을 멈춘다(끌리는 것 안의 끌기와 같은 덫). */
      + '<td class="notecell"><button class="notebtn" data-note-open="' + esc(p.pk) + '" title="눌러서 고칩니다">'
      +   (p.note ? '<span title="' + esc(p.note) + '">' + esc(p.note) + '</span>' : '<span class="dash">＋ 입력</span>')
      +   '</button></td>'
      + '<td class="chev">›</td></tr>';
    if(open){
      var months = Object.keys(d.byMonth).sort();
      줄 += '<tr class="detail"><td colspan="8"><div class="detailgrid one">'
        + '<div><div class="dtitle">' + (isLaw ? "월별 법률상담 일자" : "월별 이음근무 일자") + '</div>'
        + (months.length ? months.map(function(mm){
            var lbl = parseInt(mm.slice(5),10) + "월";
            return '<div class="drow"><span class="dm">' + lbl + '</span><span class="dchips">'
              + d.byMonth[mm].map(function(dd){ return '<span class="dchip ' + (isLaw ? "law" : "") + '">' + dd + '</span>'; }).join("")
              + '</span><span class="dcnt">' + d.byMonth[mm].length + '회</span></div>';
          }).join("") : '<div class="dnone">' + 범위말 + ' 기록 없음</div>')
        + '</div></div></td></tr>';
    }
    return 줄;
  }).join("");

  return '<div class="ieumbar">'
    + '<div class="scopepilot">'
    + '<div class="scopenav">'
    + '<button class="mv" data-mv="-1">‹</button>'
    + '<span class="scopetitle">' + esc(범위말) + '</span>'
    + '<button class="mv" data-mv="1">›</button>'
    + '</div>'
    + '<div class="segpill">' + ["month","year","all"].map(function(v){
        var 이름 = v === "month" ? "월" : v === "year" ? "연" : "전체";
        return '<button data-scope="' + v + '"' + (S.scope === v ? ' class="on"' : '') + '>' + 이름 + '</button>';
      }).join("") + '</div></div>'
    + ieumKcell("#2563eb","이음근무",dutyTotal,"일")
    + ieumKcell("#d97706","법률상담",lawUsedTotal,"회")
    + ieumKcell("#16a34a","활동 인원",rows.filter(function(p){return !p.left;}).length,"명",true)
    + '</div>'
    + (그만둔수 ? '<button class="chip' + (S.showLeft ? " on" : "") + '" data-left="1">🚪 퇴사·종료 ' + 그만둔수 + '명 ' + (S.showLeft ? "숨기기" : "포함") + '</button>' : "")
    + '<div class="ppltable">'
    + (행들
        ? '<table><thead><tr><th class="no">No.</th><th>인원</th><th>구분</th>'
          + '<th class="ublue">이음근무 ' + esc(scopeSfx) + '</th><th class="uamber">법률상담 ' + esc(scopeSfx) + '</th>'
          + '<th>연락처</th><th>비고</th></tr></thead>'
          + '<tbody>' + 행들 + '</tbody></table>'
        : '<div class="later"><p>이 범위에 이음센터 사람이 없습니다.</p></div>')
    + '</div>';

/* ── 기업정보함 명함 불러오기 ────────────────────────────────────────────
   ★ 기업정보함의 «가벼운 색인»(pucards/idx — 이름·회사·전화·주소만, 약 1MB)을 읽는다.
     푸른이알피 계약창이 회사·담당자를 찾을 때 쓰는 바로 그것이다. 명함 본문·사진은 안 받는다.
   ⚠ 읽기만 한다 — 기업정보함 자료를 고치지 않는다.
   ⚠ 창에서 처음 칠 때 «한 번만» 받는다(요금). 같은 창·다음 창은 받아 둔 것을 쓴다.
   ⚠ 보는 사람이 늘지 않는다 — 이 색인은 원래 로그인한 직원 누구나 읽는 자리다(서버 규칙). */
var 명함 = { list:null, loading:false, err:"" };
function 명함받기(){
  if(명함.list || 명함.loading || !fbDb) return;
  명함.loading = true; 명함.err = "";
  fbDb.ref("pucards/idx").once("value").then(function(s){
    var v = s.val() || {};
    명함.list = Object.keys(v).map(function(k){
      var x = v[k] || {};
      return { k:k, c:x.c||"", n:x.n||"", ti:x.ti||"", m:x.m||"", t:x.t||"", ct:x.ct||"", ad:x.ad||"" };
    }).filter(function(x){ return x.c || x.n; });
    명함.loading = false; 명함목록고침();
  })["catch"](function(e){
    명함.loading = false; 명함.err = (e && e.message) || String(e); 명함목록고침();
  });
}
/* 회사·이름·전화 어디에 걸려도 — 회사 이름이 앞에서 맞는 것을 먼저 */
function 명함찾기(q){
  q = String(q || "").trim().toLowerCase();
  if(!q || !명함.list) return [];
  var 숫자 = q.replace(/[^0-9]/g, "");
  var out = [];
  명함.list.forEach(function(x){
    var 회사 = x.c.toLowerCase(), 이름 = x.n.toLowerCase();
    var 점 = 회사.indexOf(q) === 0 ? 0 : 회사.indexOf(q) > 0 ? 1 : 이름.indexOf(q) >= 0 ? 2
      : (숫자.length >= 4 && (x.m + x.t + x.ct).replace(/[^0-9]/g, "").indexOf(숫자) >= 0) ? 3 : -1;
    if(점 >= 0) out.push({ x:x, 점:점 });
  });
  out.sort(function(a, b){ return a.점 - b.점 || a.x.c.localeCompare(b.x.c); });
  return out.slice(0, 8).map(function(o){ return o.x; });
}

/* 명함 하나를 고르면 무슨 일·장소·담당자를 한꺼번에 채운다.

/* ── 🔒 나만 보기 일정 (cal_private/{uid}) ──────────────────────────────

      + (이어짐 ? " · 내 구글 달력에도" : " · 구글 로그인하면 내 폰 구글 캘린더에도 뜹니다"));

/* ── 🔒 나만 보기 → «본인» 구글 달력(primary)에도 (대표 지시 2026-09-27 「개인일정도 추천대로」)
     ★ 회사 공용 달력이 아니라 로그인한 그 사람의 구글 달력이다 — 그 사람 폰 구글 위젯에만 뜬다.
       visibility:'private' 로 넣어, 그 달력을 누구와 나눠 보더라도 내용은 «바쁨»으로만 보인다.
     ★ 이어 둔 구글 번호(ownGcalId)를 내 칸 기록에 남겨 고치기·지우기를 따라가게 한다.
     ⚠ 구글 로그인이 안 돼 있으면 우리 쪽에만 둔다(그렇다고 말한다). 구글이 실패해도 우리 기록은 남는다.

    location:item.place || "", description:[item.contact ? "담당자: " + item.contact : "", item.note || ""].filter(Boolean).join("\n"),

function 내구글에(item, prev){

  var 일 = 옛번호 ? PuGcalAuth.updateEvent("primary", 옛번호, 내구글몸(item))
                 : PuGcalAuth.createEvent("primary", 내구글몸(item));
  일.then(function(r){
    if(!옛번호 && r && r.id){
      /* 이어 둔 번호를 내 칸에 적는다 — 다음에 고치거나 지울 때 구글도 따라간다 */
      var 지금 = 개인하나(item.id) || item;
      PuCalWrite.savePrivate(S.uid, { id:item.id, ownGcalId:r.id }, 지금).then(function(){ 개인받기(); });
    }
  })["catch"](function(e){ toast("⚠ 내 구글 달력에는 못 넣었습니다 — " + ((e && e.message) || "") + " (푸른 캘린더에는 들어 있습니다)"); });
  return true;
}
function 내구글에서지우기(옛것){
  if(!옛것 || !옛것.ownGcalId || typeof PuGcalAuth === "undefined" || !PuGcalAuth.hasToken()) return;
  PuGcalAuth.deleteEvent("primary", 옛것.ownGcalId)["catch"](function(e){

/* 시작 ~ 끝 맞추기 — { start, end, err }. 시각이 없으면 종일(둘 다 비움). */
function 시각범위(시작, 끝){
  시작 = String(시작 || "").slice(0,5); 끝 = String(끝 || "").slice(0,5);
  var 꼴 = /^\d{2}:\d{2}$/;
  if(!시작 && !끝) return { start:"", end:"" };
  if(!꼴.test(시작)) return { err:"시작 시각을 적어 주세요(끝만 적을 수는 없습니다)" };
  if(!끝){
    var h = (parseInt(시작.slice(0,2), 10) + 1) % 24;
    끝 = (h < 10 ? "0" : "") + h + ":" + 시작.slice(3,5);
    if(끝 < 시작) 끝 = "23:59";               /* 밤 11시 넘어 시작 — 그날 안에서 끝낸다 */
    return { start:시작, end:끝 };
  }
  if(!꼴.test(끝)) return { err:"끝 시각이 올바르지 않습니다" };
  if(끝 <= 시작) return { err:"끝 시각이 시작보다 늦어야 합니다" };
  return { start:시작, end:끝 };
}

/* 창에서 무엇을 고쳤는지 그때그때 담아 둔다 — 다시 그려도 안 날아가게 */
function modalRead(){

function doSave(){
  modalRead();
  var m = S.modal; if(!m || S.busy) return;
  var 일정 = m.kind==="sch";
  var store = 일정 ? "my_schedules" : "attendance_records";
  if(!m.date){ m.err = "날짜를 골라 주세요"; render(); return; }
  if(일정 && !String(m.title||"").trim()){ m.err = "무슨 일인지 적어 주세요"; render(); return; }
  /* 시작 ~ 끝: 끝만 적고 시작이 없으면 묻는다, 끝이 비면 한 시간 뒤, 끝이 시작보다 이르면 막는다 */
  if(일정){
    var 시끝 = 시각범위(m.time, m.endTime);
    if(시끝.err){ m.err = 시끝.err; render(); return; }
    m.time = 시끝.start; m.endTime = 시끝.end;
  }
  /* ★ 새 일정은 구글 로그인돼 있으면 «구글 공용 달력»에 넣는다 (대표 지시 2026-09-27
       「구글캘린더와 같이 우선」 — 폰은 구글 캘린더 위젯으로 본다). 이 달력도 그것을 읽어
       그리므로 두 곳에 똑같이 뜨고, 두 번 들어가지도 않는다.
     ⚠ 로그인이 안 돼 있으면 우리 표(my_schedules)에 넣고 «폰 위젯에는 안 뜬다»고 말한다. */
  if(일정 && !m.timed){ m.time = ""; m.endTime = ""; }
  /* 🔒 나만 보기 — 구글에도 우리 공용 표에도 안 넣고 «내 칸»에만(PuCalWrite.savePrivate) */
  if(일정 && m.vis === "private"){ 개인에넣기(m); return; }
  /* 나만 보기였던 것을 «모두 보기»로 바꿨다 — 공용으로 새로 넣고 내 칸의 것은 지운다 */
  if(일정 && m.mode === "edit" && m.store === "cal_private"){ m.mode = "new"; m.옮김 = m.id; }
  if(일정 && m.mode === "new" && typeof PuGcalAuth !== "undefined" && PuGcalAuth.hasToken()){
    구글에넣기(m); return;
  }
  var id = m.mode==="edit" ? m.id : PuCalWrite.newId(일정 ? "sch" : "att");
  var item = { id:id, date:m.date, sid:m.sid, note:String(m.note||"") };
  if(일정){
    item.title = String(m.title).trim();
    item.time = String(m.time||"");
    item.endTime = String(m.endTime||"");
    item.place = String(m.place||"").trim();
    item.contact = String(m.contact||"").trim();
    /* 어느 명함에서 왔는지 — 이름이 아니라 명함 번호로 잇는다(온톨로지: sourceKind·sourceId 함께) */
    if(m.card && m.card.k){ item.sourceKind = "card"; item.sourceId = m.card.k; }
  }
  else { item.type = m.type; item.hours = PuWork.hoursOf(m.type, m.hours); }
  /* 고치는 것이면 «내가 보던 판»을 함께 넘긴다 — 바뀐 칸만 보내고,
     원래 있던 달이 잠겼는지도 그것으로 본다. */
  var prev = m.mode==="edit" ? (recOf(store, id) || m.prev) : null;
  S.busy = true; m.err = ""; render();
  PuCalWrite.save(store, item, prev).then(function(r){
    S.busy = false;
    if(!r.ok){ m.err = r.message; render(); return; }
    var 고침 = m.mode==="edit";
    if(m.옮김) 개인지우기조용히(m.옮김);
    closeModal();
    toast(고침 ? "✅ 고쳤습니다"
      : (일정 ? "✅ 넣었습니다 — 구글 로그인하면 다음부터 폰 구글 캘린더에도 뜹니다" : "✅ 넣었습니다"));
    refreshOne(store);
    /* 이음 근무가 바뀌면 외부 공유 뷰도 따라가야 한다 — 안 걸면 옛 일정이 그대로 뜬다 */
    if(store === "attendance_records") 발행예약();
  });
}

function doDelete(){
  var m = S.modal; if(!m || m.mode!=="edit" || S.busy) return;
  if(!confirm("이 건을 지울까요?")) return;
  if(m.store === "cal_private"){
    S.busy = true; m.err = ""; render();
    var 옛것 = 개인하나(m.id);
    PuCalWrite.removePrivate(S.uid, m.id, 옛것).then(function(r){
      S.busy = false;

      closeModal(); toast("🗑 지웠습니다" + (옛것 && 옛것.ownGcalId ? " (내 구글 달력에서도)" : "")); 개인받기();
    });

  var prev = recOf(m.store, m.id) || m.prev;

     ⚠ 이어진 근태가 지금 30건 있다(2026-09-20 실측). 이알피가 만들면서 이어 둔 것이다.
     ⚠ 구글부터 지운다. 우리 것을 먼저 지우면 «무엇을 지워야 하는지»를 잃는다.
     ⚠ 구글에서 못 지워도 우리 것은 지운다 — 그 대신 «못 지웠다»고 분명히 말한다
       (이알피가 여기서 데었다: 안 지워졌는데 「삭제됨」이라고 했다). */
  var 구글번호 = prev && prev.gcalEventId;

    ? PuGcalAuth.deleteEvent(GCAL_CAL_ID, 구글번호)
        .then(function(){ 구글말 = ""; })
        ["catch"](function(e){
          구글말 = " ⚠ 구글 쪽은 못 지웠습니다(" + ((e && e.message) || "") + ")";
        })
    : Promise.resolve();

  구글먼저.then(function(){
    return PuCalWrite.remove(m.store, m.id, prev);
  }).then(function(r){
    S.busy = false;

    var st = m.store;

    if(st === "attendance_records") 발행예약();

}

/* ── 끌어서 다른 날로 옮기기 ─────────────────────────────────────────────
   대표 지시 2026-09-21 「둘다」 — 4걸음에서 법인 대시보드와 함께 사라진 것을 되살린다.

   ★ 어디에 손잡이를 다나 — 판(app) 한 곳이다. 칩마다 달면 다시 그릴 때마다 새로 달아야
     하고, 하나라도 빠지면 «어떤 것은 안 끌리는» 화면이 된다.
   ⚠ dragstart 는 거품처럼 위로 올라온다 — 바깥에서 preventDefault 를 하면 안쪽 끌기가
     통째로 죽는다(컨설팅일정이 이 덫에 일주일 걸렸다). 여기서는 바깥에서 막지 않는다.
   ⚠ 「놓을 수 있다」를 말해 주지 않으면 브라우저가 놓기를 아예 안 받는다 —
     dragover 에서 preventDefault 를 «해야» 놓을 수 있다. 헷갈리기 쉬운 반대다. */
var _끄는것 = null;
/* 사람 칩(머리줄)을 끌기 시작 — «새로 넣기»다(옮기기와 갈라 둔다: "eumnew:사람") */
document.addEventListener('dragstart', function(e){
  var p = e.target && e.target.closest ? e.target.closest('[data-dragp]') : null;
  if(!p) return;
  _끄는것 = 'eumnew:' + p.getAttribute('data-dragp');
  try{ e.dataTransfer.setData('text/plain', _끄는것); e.dataTransfer.effectAllowed = 'copy'; }catch(x){}
});
document.addEventListener('dragend', function(e){
  if(!(e.target && e.target.closest && e.target.closest('[data-dragp]'))) return;
  _끄는것 = null;
  Array.prototype.forEach.call(document.querySelectorAll('.dropon'), function(el){ el.classList.remove('dropon'); });
});
function 끌기손잡이(){
  var 판 = $('app'); if(!판 || 판._끌기달림) return;
  판._끌기달림 = true;
  판.addEventListener('dragstart', function(e){
    var t = e.target && e.target.closest ? e.target.closest('[data-drag]') : null;
    if(!t){ _끄는것 = null; return; }
    _끄는것 = t.getAttribute('data-drag');
    t.classList.add('dragging');
    try{ e.dataTransfer.setData('text/plain', _끄는것); e.dataTransfer.effectAllowed = 'move'; }catch(x){}
  });
  판.addEventListener('dragend', function(){
    _끄는것 = null;
    Array.prototype.forEach.call(판.querySelectorAll('.dragging,.dropon'),
      function(el){ el.classList.remove('dragging','dropon'); });
  });
  판.addEventListener('dragover', function(e){
    if(!_끄는것) return;
    var 칸 = e.target && e.target.closest ? e.target.closest('[data-day]') : null;
    if(!칸) return;
    e.preventDefault();                       /* ⚠ 이것이 있어야 놓을 수 있다 */
    try{ e.dataTransfer.dropEffect = String(_끄는것).indexOf('eumnew:') === 0 ? 'copy' : 'move'; }catch(x){}
    if(!칸.classList.contains('dropon')){
      Array.prototype.forEach.call(판.querySelectorAll('.dropon'),
        function(el){ el.classList.remove('dropon'); });
      칸.classList.add('dropon');
    }
  });
  판.addEventListener('drop', function(e){
    var 칸 = e.target && e.target.closest ? e.target.closest('[data-day]') : null;
    var 끈것 = _끄는것;
    if(!칸 || !끈것) return;
    e.preventDefault();
    _끄는것 = null;
    Array.prototype.forEach.call(document.querySelectorAll('.dropon'), function(el){ el.classList.remove('dropon'); });
    if(String(끈것).indexOf('eumnew:') === 0){ 이음넣기(String(끈것).slice(7), 칸.getAttribute('data-day')); return; }
    옮기기(끈것, 칸.getAttribute('data-day'));
  });
}

/* 사람 칩을 날짜 칸에 놓았다 — 그 사람의 그날 «이음센터 근무»를 넣는다.
   ★ 이알피·이 앱이 담아 온 꼴 그대로: 내부 직원은 sid, 외부 노무사·변호사는 externalId(sid 없음),
     type:'eum-work', hours 는 PuWork 가 정한 수(하루 근무).
   ⚠ 저장은 반드시 관문(PuCalWrite.save) — 마감된 달은 거기서 막히고, 막히면 그대로 말한다.
   ⚠ 같은 사람·같은 날이 이미 있으면 안 넣는다 — 두 번 들어가면 근무일이 두 배로 센다.
   ⚠ 구글 달력에는 안 만든다(로그인이 필요하다) — 달력에는 우리 기록으로 바로 뜬다. */
function 이음넣기(pk, 날){
  if(S.busy || !pk || !날) return;
  var p = ieumPeople().filter(function(x){ return x.pk === pk && !x.left; })[0];
  if(!p){ toast("그 사람을 명단에서 못 찾았습니다"); return; }
  var 외부 = p.kind !== "in";
  var 이미 = arr(D.attendance_records).some(function(r){
    return r && r.type === "eum-work" && r.date === 날
      && (외부 ? r.externalId === pk : (r.sid === pk && !r.externalId));
  });
  if(이미){ toast("ℹ " + p.name + " 님은 " + 날 + " 에 이미 이음센터 근무가 있습니다"); return; }
  var item = { id: PuCalWrite.newId("att"), date: 날, type: "eum-work",
               hours: PuWork.hoursOf("eum-work", 8), note: "" };
  if(외부) item.externalId = pk; else item.sid = pk;
  S.busy = true; render();
  PuCalWrite.save("attendance_records", item, null).then(function(r){
    S.busy = false;
    if(!r.ok){ toast("❌ " + (r.message || "넣지 못했습니다")); render(); return; }
    toast("✅ " + p.name + " · " + 날.slice(5).replace("-", "/") + " 이음센터 근무를 넣었습니다");
    refreshOne("attendance_records");
    발행예약();
  })["catch"](function(err){
    S.busy = false;
    toast("❌ 넣지 못했습니다 — " + ((err && err.message) || ""));
    render();
  });
}

/* 「store:id」와 새 날짜. 우리 것이면 저장 문으로, 구글 것이면 구글로. */
function 옮기기(끈것, 새날){
  if(S.busy) return;
  var i = String(끈것).indexOf(":");
  var store = String(끈것).slice(0, i), id = String(끈것).slice(i + 1);
  if(!store || !id || !새날) return;

  /* ── 구글 일정 ── */
  if(store === "gcal"){
    var ev = null;
    for(var k = 0; k < GCAL.evs.length; k++){ if(GCAL.evs[k].id === id){ ev = GCAL.evs[k]; break; } }
    if(!ev) return;
    if(ev.date === 새날) return;                    /* 제자리에 놓았다 */
    if(typeof PuGcalAuth === "undefined" || !PuGcalAuth.hasToken()){
      /* ⚠ 조용히 실패하지 않는다 — 안 옮겨졌는데 옮겨진 줄 알면 그날 사람이 안 온다 */
      toast("🔐 구글 로그인이 필요합니다 — 일정은 옮기지 못했습니다");
      return;
    }
    S.busy = true; render();
    PuGcalAuth.moveEvent(GCAL_CAL_ID, id, 새날).then(function(){
      S.busy = false;
      /* 받아 둔 것을 고쳐 바로 보인다 — 여러 날 일정은 «길이 그대로» 끝날도 민다 */
      if(ev.end && ev.end > ev.date){
        var 길이 = Math.round((Date.parse(ev.end + "T00:00:00Z") - Date.parse(ev.date + "T00:00:00Z")) / 86400000);
        ev.end = shiftDay(새날, 길이);
      } else ev.end = 새날;
      ev.date = 새날;
      toast("✅ 구글 일정을 " + 새날 + " 로 옮겼습니다");
      render();
      gcalLoad(true);                               /* 진짜로 그리 됐는지 다시 받아 맞춘다 */
    })["catch"](function(err){
      S.busy = false;
      toast("❌ 구글 일정을 옮기지 못했습니다 — " + ((err && err.message) || ""));
      render();
    });
    return;
  }

  /* ── 우리 일정·근태 ── */
  var prev = recOf(store, id);
  if(!prev) return;
  if(prev.date === 새날) return;
  S.busy = true; render();
  /* ⚠ 바뀐 칸만 보낸다(date). 저장 문이 «옛 달·새 달»을 둘 다 보고 잠금을 판단한다. */
  PuCalWrite.save(store, { id:id, date:새날 }, prev).then(function(r){

  if(t.hasAttribute('data-pub')){ 발행하기(false); return; }
  if(t.hasAttribute('data-newkey')){ 링크발급(t.getAttribute('data-newkey')); return; }
  /* 닫기 — 잇기 창이 열려 있으면 그것부터 닫는다(둘이 겹쳐 뜨지 않는다) */
  if(t.hasAttribute('data-close')){
    if(S.mycolor && S.mycolor.겹침){ S.mycolor.겹침 = null; render(); return; }
    if(S.detail) closeDetail();
    else if(S.note) closeNote();
    else if(S.mycolor) closeMyColor();
    else if(S.colors) closeColors();
    else if(S.mailmap) closeMailMap();
    else closeModal();
    return;
  }
  if(t.hasAttribute('data-act')){
    if(t.getAttribute('data-act')==='save') doSave(); else doDelete();
    return;
  }
  /* 일을 누르면 그 건을 연다. 칸의 빈 자리를 누르면 새로 넣는다.
     ⚠ 일 쪽을 «먼저» 본다 — 일은 칸 «안»에 있어 칸도 함께 걸린다. */
  /* 「+N개 더」 — 그 날을 그 자리에서 펼친다(다른 화면으로 안 간다) */
  if(t.hasAttribute('data-more')){
    var 날 = t.getAttribute('data-more');
    /* 폰은 「•••」도 «그 날을 고르는» 것이다 — 읽는 자리가 아래 목록 하나여야 한다.
       작은 화면에서 펼침 창까지 겹쳐 띄우면 달력이 통째로 가려진다. */
    if(폰() && S.view === 'month'){ S.pick = 날; render(); return; }
    S.open = (S.open === 날) ? null : 날;
    render(); return;
  }
  if(t.hasAttribute('data-popclose')){ S.open = null; render(); return; }
  if(t.hasAttribute('data-ev')){
    var ev = t.getAttribute('data-ev').split(':');
    var _id = ev.slice(1).join(':');
    /* 구글에서 온 일정은 «구글에서» 고친다 — 우리가 손대면 두 곳이 갈린다.
       ⚠ 열쇠로 읽기만 하는 길이라 우리에겐 고칠 권한이 아예 없다.
       ★ 2026-09-27 — 그래도 «무엇인지»는 여기서 보여 준다. 예전에는 새 탭으로
         구글 달력을 열어, 일정 하나 보려다 앱을 떠나고 보던 달을 잃었다. */
    if(ev[0] === 'gcal'){ openDetail(구글상세(_id)); 구글더받기(_id); return; }
    /* 사건 기한·마감·휴직 — 여기서 못 고치는 것들이라 상세만 보여 준다(전엔 아무 일도 없었다) */
    if(ev[0] === ''){
      var _d = t.closest ? t.closest('[data-day]') : null;
      openDetail(층상세(_d ? _d.getAttribute('data-day') : S.date, _id));
      return;
    }
    openEdit(ev[0], _id);
    return;
  }
  /* 공휴일 — 이름이 길어 칸에서 잘리는 날이 있다(대체공휴일 등) */
  if(t.hasAttribute('data-holday')){ openDetail(공휴일상세(t.getAttribute('data-holday'))); return; }
  /* ★ 날을 누르면 — 폰은 «그 날을 본다»(구글 폰 달력과 같다), 넓은 화면은 여느 때처럼 «새로 넣기».
     ⚠ 폰에서 예전에는 날을 누르면 바로 새 일정 창이 떴다 — 읽으려고 눌렀는데 쓰는 창이 떠서,
       일정을 보려면 칸 안의 다섯 글자를 들여다보는 수밖에 없었다(대표 지시 2026-09-27).
       폰에서 넣는 길은 ＋ 하나다 — 고른 날에 넣는다. */
  if(t.hasAttribute('data-day')){
    var 날짜 = t.getAttribute('data-day');
    if(폰() && S.view === 'month'){ S.pick = 날짜; render(); return; }
    openNew(날짜); return;
  }
});

/* 링크 복사 — 못 하는 자리(https 아님·권한 거절)에서는 «됐다»고 하지 않는다.
   「복사됐습니다」는 말만 뜨고 실제로는 안 붙는 것이 가장 나쁘다. */
function copyLink(url){
  function 실패(){ toast('복사가 안 됩니다 — 링크를 길게 눌러 직접 복사해 주세요'); }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ toast('📋 링크를 복사했습니다'); }, 실패);
      return;
    }
  }catch(e){}
  실패();
}

/* 이알피로 — 창은 «하나»만 쓴다(새 탭을 자꾸 만들지 않는다) */
function goErp(menu){
  var url = 'pu-erp.html?sso=1' + (menu ? '#menu='+encodeURIComponent(menu) : '');
  try { if(window.PuAppBar && PuAppBar.goApp){ PuAppBar.goApp(url, 'erp'); return; } } catch(e){}
  location.href = url;
}
/* 유형을 시간연차로 바꾸면 «몇 시간» 칸이 생긴다 — 바뀔 때 다시 그린다.
   ⚠ 다시 그리기 전에 지금 적힌 것을 먼저 담는다(안 그러면 적던 것이 날아간다). */
/* 일정 검색 — 치는 대로 거른다.
   ⚠ 다시 그리면 칸이 새로 생겨 «적던 글자와 커서»를 잃는다. 그래서 그린 뒤
     그 칸에 값을 도로 넣고 커서를 끝으로 돌려 준다. 안 그러면 한 글자마다 칸이 튄다. */
document.addEventListener('input', function(e){
  if(!e.target || e.target.id !== 'calq') return;
  /* ⚠ 한글 조합 중(ㄱ+ㅏ)에는 다시 그리지 않는다 — 입력칸이 바뀌면 조합이 끊겨 한글이 안 쳐진다.
     조합이 끝나면(compositionend) 아래 손잡이가 한 번 그린다. */
  if(e.isComposing) return;
  S.q = e.target.value;
  render();
  var el = document.getElementById('calq');
  if(el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(_){} }
});

document.addEventListener('compositionend', function(e){
  if(!e.target || e.target.id !== 'calq') return;
  S.q = e.target.value;
  render();
  var el = document.getElementById('calq');
  if(el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(_){} }
});

/* 명함 찾기 칸 — 치는 대로 찾는다(처음 칠 때 색인을 한 번 받는다) */
document.addEventListener('input', function(e){
  if(!e.target || e.target.id !== 'cardq' || !S.modal) return;
  /* ⚠ 창 전체를 다시 그리지 않는다 — 한글 조합이 끊긴다(명함결과Html 머리글) */
  S.modal.cq = e.target.value;
  명함받기();
  명함목록고침();
});

/* 계정 잇기 — 고르면 «바로» 저장한다(따로 저장 단추를 두지 않는다) */
document.addEventListener('change', function(e){
  if(!S.mailmap || !e.target || !e.target.hasAttribute || !e.target.hasAttribute('data-mm')) return;
  잇기저장(e.target.getAttribute('data-mm'), e.target.value);
});
document.addEventListener('change', function(e){
  if(!S.modal || !e.target || !e.target.hasAttribute || !e.target.hasAttribute('data-m')) return;
  var f = e.target.getAttribute('data-m');
  if(f !== 'type' && f !== 'kind') return;
  modalRead(); render();
});
/* ESC 로 창을 닫는다 — 뒤로가기 층과 다투지 않게 여기서만 받는다 */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  if(S.detail){ e.preventDefault(); closeDetail(); return; }
  if(S.mycolor){ e.preventDefault(); if(S.mycolor.겹침){ S.mycolor.겹침 = null; render(); } else closeMyColor(); return; }
  if(S.note){ e.preventDefault(); closeNote(); return; }
  if(S.mailmap){ e.preventDefault(); closeMailMap(); return; }
  if(S.modal){ e.preventDefault(); closeModal(); }
});

/* ── 시작 ──────────────────────────────────────────────────────────── */
function setConn(on, text){
  var c = $('conn');
  c.innerHTML = '<span class="dot'+(on?' on':'')+'"></span><span class="t">'+esc(text)+'</span>';
  /* 동그라미의 초록 점 — 예전 「● 연결됨」 글자를 합쳤다 */
  var m = $('me'); if(m) m.className = on ? 'on' : '';
}

function start(user){
  PuCalRead.attach(fbDb);
  /* 저장 관문이 봐야 할 셋을 넘긴다 —
     ① 어느 달이 마감됐나 ② 그 표가 아직 배열인가 ③ 누가 고쳤나 */
  PuCalWrite.attach(fbDb, {
    lockedMonths: function(){ return arr(D.locked_attend_months); },
    formOf: function(k){ return PuCalRead.rawForm(k); },
    who: function(){ return (ME && ME.name) || (ME && ME.sid) || ''; }
  });
  /* 구글 로그인에서 돌아왔으면 주소 꼬리에서 토큰을 꺼낸다(주소는 깨끗이 지운다) */
  try{ if(typeof PuGcalAuth !== "undefined" && PuGcalAuth.capture()) toast("✅ 구글에 연결됐습니다"); }catch(e){}
  /* ★ 구글 «늘 연결» — 서버에서 한 시간짜리 표를 받아 두고, 끝나기 전에 또 받는다(2026-10-04) */
  try{ 구글이어가기(user); }catch(e){ console.warn("[구글 연결]", e && e.message); }
  S.ym = ymOf(new Date()); S.date = todayYMD();
  setConn(true, '연결됨');
  PuCalRead.readMany(KEYS).then(function(r){
    D = r.data; FAILED = r.failed;
    /* 재무 권한이 없어 계정 명부를 못 읽은 것은 «고장»이 아니다 — 공개 명부로 사람을 찾았으면 띠를 띄우지 않는다 */
    if(FAILED.user_accounts && !FAILED.user_dir && D.user_dir && typeof D.user_dir === 'object'
       && Object.keys(D.user_dir).length) delete FAILED.user_accounts;
    /* 공개 명부만 읽혔으면 거기엔 uid·메일이 없다 — 로그인 메일(p001@pureun.kr)의 사번으로 찾는다 */
    ME = (function(){
      var us = users(), i;
      for(i=0;i<us.length;i++){ if(us[i].uid===user.uid || (us[i].email && us[i].email===user.email)) return us[i]; }
      var m = String(user.email || '').toLowerCase().match(/^([a-z]+)(\d+)@/);
      var want = m ? (m[1] + m[2]).toUpperCase() : '';
      if(!want) return null;
      var all = allUsers();
      for(i=0;i<all.length;i++){ if(String(all[i].sid).toUpperCase().replace(/[^A-Z0-9]/g, '') === want) return all[i]; }
      return null;
    })();
    /* 구글처럼 이름 첫 글자 동그라미 — 이름·직함·메일은 누르면 뜨는 창에 (예전엔 머리줄에 늘 떠 있었다) */
    var 이름 = (ME && ME.name) || (user.email || '?');
    $('me').textContent = String(이름).slice(0, 1);
    /* ★ 동그라미만으로는 누구인지 모른다 — 이름을 글자로 옆에 둔다 (대표 지시 2026-09-29) */
    var 이름칸 = $('meName');
    if(이름칸){ 이름칸.textContent = ME ? ((ME.name || ME.sid) + (ME.title ? ' ' + ME.title : '')) : ''; 이름칸.title = 이름; }
    $('me').title = 이름 + (user.email ? ' · ' + user.email : '');
    $('whoName').innerHTML = '<b>' + esc(ME ? (ME.name||'') : '')
      + (ME ? '<span class="role">'+esc(ME.role||ME.position||'')+'</span>' : '') + '</b>'
      + esc(user.email||'') + ' · ';
    render();
    S.uid = user.uid;
    try{ S.showGone = localStorage.getItem("pu_cal_gone") === "1"; }catch(_){}
    개인받기();
    모집받기();
    /* 정부사업신청에서 고치고 돌아오면 다시 받는다(대표일 때만 — 모집받기 안에서 거른다) */
    if(!RECRUIT.bound){ RECRUIT.bound = true;
      document.addEventListener("visibilitychange", function(){ if(!document.hidden) 모집받기(); }); }
    /* 구글 달력도 받는다 — 이 달력을 채우는 것이 그쪽이다(9월 126건).
       ⚠ 우리 자료를 먼저 그리고 그 다음 받는다 — 구글이 늦어도 화면은 먼저 뜬다. */
    gcalLoad();
    /* 바뀐 한 건만 받아 다시 그린다 — 큰 표를 통째로 다시 받지 않는다 */
    ['attendance_records','my_schedules'].forEach(function(k){
      S.unwatch.push(PuCalRead.watch(k, function(){
        PuCalRead.readOnce(k).then(function(v){ D[k]=v; render(); }).catch(function(){});
      }));
    });
  }).catch(function(e){
    $('app').innerHTML = '<div class="panel"><h2 style="color:#dc2626">자료를 못 읽었습니다</h2>'
      + '<p class="muted">'+esc(e && e.message || e)+'</p>'
      + '<button class="btn" onclick="location.reload()">다시 열기</button></div>';
  });
}

try{
  firebase.initializeApp(FB_CONFIG);
  fbDb = firebase.database();
  firebase.auth().onAuthStateChanged(function(u){
    if(u) start(u); else PuGate.show();
  });
}catch(e){
  $('app').innerHTML = '<div class="panel muted">초기화 실패: '+esc(e.message)+'</div>';
}
</script>
