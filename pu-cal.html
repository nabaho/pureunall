<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>푸른 캘린더</title>
<link rel="manifest" href="pu-cal-manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>⏰</text></svg>">
<!-- 아이폰 홈화면 아이콘 — 탭 아이콘과 다른 것이다. 여기는 PNG 여야 한다(SVG 를 안 읽는다) -->
<link rel="apple-touch-icon" href="icon-cal-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="푸른 캘린더">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="js/pu-ontology.js?v=29"></script>
<script src="js/pu-ontology-write.js?v=2" data-mode="observe"></script>
<script src="js/pu-resilience.js?v=3"></script>
<script src="js/pu-gate.js?v=2"></script>
<script src="js/pu-health.js?v=4"></script>
<script src="js/pu-version.js?v=8"></script>
<script src="js/pu-back.js?v=2"></script>
<script src="js/pu-work-core.js?v=1"></script>
<script src="js/pu-cal-read.js?v=2"></script>
<script src="js/pu-cal-write.js?v=1"></script>
<style>
  :root{--acc:#2563eb;--acc2:#1e40af;--acc-soft:#eff6ff;--ink:#1e293b;--sub:#475569;--faint:#94a3b8;
    --line:#e2e8f0;--panel:#ffffff;--bg:#f8fafc;--ok:#166534;--warn:#854d0e;--warn-bg:#fffbeb;
    --danger:#dc2626;--radius:11px}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;color:var(--ink);
    background:#f8fafc;font-size:14px;-webkit-font-smoothing:antialiased}

  /* ── 머리줄 ──
     ⚠ 한 줄이다. 낱말 가운데서 잘려 두 줄이 되면 폰에서 화면을 갉아먹는다.
        넘치면 «줄이는» 것이지 «내리는» 것이 아니다. */
  #topbar{position:sticky;top:0;z-index:15;background:#ffffff;border-bottom:1px solid var(--line);
    padding:8px 16px;display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden}
  #topbar .brand{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;flex-shrink:0}
  #topbar .sp{margin-left:auto}
  #conn{font-size:12px;color:var(--sub);flex-shrink:0}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#cbd5e1;margin-right:5px}
  .dot.on{background:#16a34a}
  #me{font-size:12.5px;font-weight:700;flex-shrink:0;overflow:hidden;text-overflow:ellipsis}
  #me .role{color:var(--sub);font-weight:500;margin-left:4px}
  .lnk{font-size:12.5px;padding:5px 11px;border:1px solid var(--line);color:var(--sub);background:#ffffff;
    border-radius:8px;cursor:pointer;font-weight:700;flex-shrink:0}
  .lnk.go{border-color:#bfdbfe;color:var(--acc2)}

  /* ── 탭 한 줄 — 법인 셋 · 이음 셋 ── */
  #tabs{display:flex;align-items:center;gap:3px;padding:7px 14px;background:#ffffff;
    border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
  .gl{font-size:10px;color:var(--faint);font-weight:700;margin:0 3px 0 0;flex-shrink:0}
  .tab{padding:5px 11px;border-radius:7px;font-size:12px;color:var(--sub);cursor:pointer;
    border:none;background:transparent;font-family:inherit;flex-shrink:0}
  .tab:hover{background:var(--bg)}
  .tab.eum{color:#2563eb}
  .tab.on{background:var(--acc2);color:#ffffff;font-weight:700}
  .tsep{width:1px;height:18px;background:#cbd5e1;margin:0 7px;flex-shrink:0}
  /* 탭 줄에 얹은 사람 칩 — 오른쪽 끝에 붙는다(왼쪽 탭과 안 섞이게) */
  .tabchips{margin-left:auto;display:flex;align-items:center;flex-shrink:0;padding-left:16px}
  .tabchips .chips{margin-bottom:0;flex-wrap:nowrap}

  #app{padding:14px 16px 90px;max-width:1500px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
  .note{background:var(--warn-bg);border:1px solid #fde68a;border-radius:9px;padding:9px 13px;
    font-size:12px;color:var(--warn);margin-bottom:11px;display:flex;align-items:center;gap:9px}
  .note .sp{margin-left:auto}
  .btn{border:none;border-radius:7px;font-size:12px;font-weight:700;padding:6px 13px;cursor:pointer;
    font-family:inherit;background:var(--acc);color:#ffffff}
  .btn.ghost{background:#ffffff;color:var(--acc2);border:1px solid #bfdbfe}
  .muted{color:var(--sub)}

  /* ── 달력 — 치수는 이알피(법인 대시보드)에서 그대로 가져왔다 ──
     ⚠ 눈대중으로 고치지 말 것. 두 화면이 갈리면 대표님이 같은 것을 두 모양으로 보신다. */
  .calwrap{background:#ffffff;border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px 10px}

  /* 사람 칩 줄 — 색 동그라미 + 이름 두 글자 */
  .chips{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:7px}
  .allchip{padding:3px 9px;border:none;border-radius:10px;cursor:pointer;font-size:10.5px;font-weight:700;
    font-family:inherit;flex-shrink:0;background:#f8fafc;color:#475569}
  .allchip.on{background:#1e293b;color:#ffffff}
  .pwrap{position:relative;flex-shrink:0;display:inline-flex}
  .pchip{width:26px;height:26px;border-radius:50%;border:2.5px solid transparent;color:#ffffff;
    font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;
    align-items:center;justify-content:center;box-sizing:border-box;padding:0;transition:transform .1s}
  .pchip.on{border-color:#1e293b;transform:scale(1.15)}
  /* 겹친 날 표 — 이알피와 같은 호박 바탕이다. 파랑이면 「좋은 소식」처럼 보인다.
     ⚠ 글자는 흰색이 아니라 «짙은 호박»이다 — 이알피는 흰 글자인데 호박 위 흰 글자는
       1.7:1 이라 사실상 안 읽힌다(색 검사가 잡았다). 뜻이 같은 색을 쓰되 읽히게 한다. */
  .pcount{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;
    background:#fbbf24;color:#854d0e;font-size:10px;font-weight:800;display:flex;align-items:center;
    justify-content:center;border:1.5px solid #ffffff;pointer-events:none;line-height:1;box-sizing:border-box}
  .chip{font-size:10.5px;border:1px solid #cbd5e1;border-radius:20px;padding:2px 10px;color:var(--sub);
    background:#ffffff;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
  .chip.on{background:#1e40af;border-color:#1e40af;color:#ffffff;font-weight:700}
  .chip.warn{background:#fef2f2;border-color:#fecaca;color:#991b1b;font-weight:700}
  .chip[disabled]{opacity:.6;cursor:default}
  .srcsep{width:1px;height:18px;background:#cbd5e1;margin:0 4px;flex-shrink:0}

  /* 머리줄 — ◀ 2026-09 ▶ · 음력 · 오늘 · 월|주|일 · 사람 칩 … 검색(맨 오른쪽)
     ★ 셋을 «한 줄»에 둔다 (대표 지시 2026-09-19). 쌓으면 달력이 그만큼 아래로 밀린다. */
  .calhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px}
  .calhead .monthbar,.calhead .chips{margin-bottom:0}
  /* ⚠ 검색을 margin-left:auto 로 오른쪽 끝에 밀지 않는다 — 줄이 차면 그것만
       «둘째 줄로 떨어져» 도로 두 줄이 된다(2026-09-19 미리보기에서 그랬다).
       달바 바로 뒤에 붙여 두면 칩이 남는 자리를 먹고, 모자라면 칩부터 접힌다. */
  .monthbar{display:flex;align-items:center;gap:7px;white-space:nowrap;flex-wrap:wrap}
  .monthbar .ym{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
  .monthbar .lunrange{font-size:11px;color:var(--faint)}
  .mv{border:1px solid var(--line);background:#ffffff;border-radius:8px;width:26px;height:26px;
    cursor:pointer;color:var(--sub);font-size:11px;font-family:inherit;padding:0}
  .todaybtn{padding:4px 10px;border:1px solid var(--line);background:#ffffff;border-radius:10px;
    cursor:pointer;font-size:11.5px;font-weight:600;color:var(--sub);font-family:inherit}
  .seg{display:inline-flex;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden}
  .seg button{padding:4px 12px;font-size:11.5px;font-weight:700;background:#ffffff;color:var(--sub);
    border:none;border-right:1px solid var(--line);cursor:pointer;font-family:inherit}
  .seg button:last-child{border-right:none}
  .seg button.on{background:#1e40af;color:#ffffff}
  .srch{position:relative;display:inline-flex;align-items:center}
  .srch .ic{position:absolute;left:7px;font-size:10px;pointer-events:none}
  .srch input{padding:4px 10px 4px 24px;font-size:11.5px;border:1px solid var(--line);border-radius:10px;
    width:130px;background:#ffffff;box-sizing:border-box;font-family:inherit;color:var(--ink)}

  /* 달력 몸통 */
  .cal{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#ffffff}
  .calhd{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg);font-size:11px;
    color:var(--sub);text-align:center}
  .calhd div{padding:5px 0;border-right:1px solid var(--line)}
  .calhd div:last-child{border-right:none}
  .calhd .sun{color:var(--danger)}
  .calhd .sat{color:var(--acc)}
  /* 여섯 줄 고정 — 달마다 표 높이가 들썩이지 않게 */
  /* ★ 줄 높이는 «그 주에서 가장 바쁜 날»에 맞춰 늘어난다 (대표 지시 2026-09-19 「맞다 늘려라」).
     여태는 repeat(6,1fr) 로 여섯 줄을 똑같이 눌러 두고 한 칸에 넷까지만 보였다.
     2026년 9월을 진짜 자료로 재 보니 42칸 가운데 18칸이 넷을 넘었고 «56건»이 접혀 있었다.
   ★ 바닥값은 «화면 높이»를 따른다 (대표 지시 2026-09-19 「달력 늘려라」).
     240px 는 머리(위 띠·탭·머리줄·요일줄)와 아래 여백이 먹는 몫이다 — 그만큼 빼고
     남은 것을 여섯으로 나누면 한가한 달이 화면을 «가득» 채운다.
     ⚠ 104px 아래로는 안 내려간다(작은 화면에서 칸이 글자보다 낮아지면 못 읽는다).
       바쁜 주는 여기서 더 늘어난다 — 바닥값이지 뚜껑이 아니다. */
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);
    grid-auto-rows:minmax(max(104px,calc((100vh - 240px) / 6)),auto)}
  .day{min-height:104px;padding:5px 4px 3px;overflow:hidden;box-sizing:border-box;position:relative}
  /* 날짜 줄 — 칸 «가운데»에 「25 (13)」 처럼 날짜와 음력을 나란히 */
  .dline{display:flex;justify-content:center;align-items:center;gap:2px;margin-bottom:4px;padding:0 2px}
  .dnum{min-width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;
    padding:0 3px;font-size:12px;font-weight:400;cursor:pointer;color:var(--ink);background:transparent}
  /* 오늘 동그라미는 «숫자에만» — 음력까지 감싸면 알약처럼 길어진다 */
  .dnum.today{background:#2563eb;color:#ffffff;font-weight:700}
  .dnum.other{color:#94a3b8}
  .lun{font-size:10.5px;color:#94a3b8;line-height:1}
  .lun.other{color:#cbd5e1}
  .evs{display:flex;flex-direction:column;gap:1.5px}
  /* 한 칸은 «한 줄»이다 — 넘치면 … 로 줄이고 전문은 손대면 뜬다 */
  .ev{padding:1px 5px;border-radius:4px;font-size:11px;font-weight:500;line-height:16px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .ev b{font-weight:700;margin-right:3px}
  /* 공휴일은 칸 맨 위에 «칩»으로 — 일정 칩과 같은 치수여야 한 줄만 도드라지지 않는다 */
  .ev.hol{background:#fecaca;color:#991b1b;font-weight:600;cursor:default}

  /* 주 보기 */
  .wgrid{display:grid;grid-template-columns:repeat(7,1fr);min-height:420px}
  .wcol{border-right:1px solid var(--line);padding:0 3px 6px;overflow:hidden}
  .wcol:last-child{border-right:none}
  .whd{text-align:center;font-size:11px;color:var(--sub);padding:5px 0 4px;border-bottom:1px solid var(--line);
    margin-bottom:5px;display:flex;flex-direction:column;align-items:center;gap:1px}
  .whd.sun{color:var(--danger)}
  .whd.sat{color:var(--acc)}
  .whd .dnum{margin:0 auto}
  /* 일 보기 */
  .dayview{padding:12px;display:flex;flex-direction:column;gap:3px;min-height:320px}
  .dayview .ev{font-size:13px;line-height:24px;padding:2px 9px;border-radius:6px}

  /* ── 넣고 고치는 창 ── */
  .veil{position:fixed;inset:0;background:#1e293b;opacity:.45;z-index:40}
  .modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,92vw);
    background:#ffffff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;max-height:88vh;overflow:auto}
  .modal h3{margin:0 0 12px;font-size:15px}
  .fld{margin-bottom:10px}
  .fld label{display:block;font-size:11px;color:var(--sub);margin-bottom:3px;font-weight:700}
  .fld input,.fld select{width:100%;padding:7px 9px;border:1px solid #cbd5e1;border-radius:7px;
    font-size:13px;font-family:inherit;background:#ffffff;color:var(--ink)}
  .mbtns{display:flex;gap:7px;margin-top:14px;align-items:center}
  .mbtns .sp{margin-left:auto}
  .btn.danger{background:#dc2626}
  .btn[disabled]{opacity:.55;cursor:default}
  .werr{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:7px;
    padding:8px 11px;font-size:12px;margin-bottom:10px;white-space:pre-line}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;background:#1e293b;
    color:#ffffff;border-radius:9px;padding:9px 16px;font-size:12.5px;font-weight:700}
  /* ── 이음센터 인원 현황 — 이알피(IeumPeopleTab)와 같은 치수 ── */
  .ieumbar{display:flex;align-items:stretch;background:#ffffff;border:1px solid var(--line);
    border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(16,30,70,.04);flex-wrap:wrap}
  .scopepilot{display:flex;flex-direction:column;justify-content:center;gap:7px;padding:10px 14px;
    background:var(--bg);border-right:1px solid var(--bg);flex-shrink:0;min-width:196px}
  .scopenav{display:flex;align-items:center;gap:7px;justify-content:center}
  .scopetitle{font-size:13px;font-weight:800;min-width:96px;text-align:center;color:var(--ink);letter-spacing:-0.01em}
  .segpill{display:inline-flex;background:var(--bg);border-radius:8px;padding:2px;gap:2px;justify-content:center}
  .segpill button{flex:1;padding:3px 9px;font-size:10.5px;font-weight:600;border:none;border-radius:6px;
    cursor:pointer;background:transparent;color:var(--sub);font-family:inherit;white-space:nowrap}
  .segpill button.on{background:#ffffff;font-weight:800;color:#1e40af;box-shadow:0 1px 2px rgba(16,30,70,.10)}
  .kcell{flex:1;display:flex;align-items:center;gap:10px;padding:12px 16px;border-right:1px solid var(--bg);min-width:140px}
  .kdot{width:8px;height:8px;border-radius:3px;flex-shrink:0}
  .klabel{font-size:11.5px;font-weight:600;color:var(--sub);white-space:nowrap}
  .kval{margin-left:auto;font-size:17px;font-weight:800;white-space:nowrap;letter-spacing:-0.02em;color:var(--ink)}
  .kval small{font-size:10.5px;color:var(--faint);font-weight:600;margin-left:1px}
  .ppltable{background:#ffffff;border:1px solid var(--line);border-radius:10px;overflow-x:auto}
  .ppltable table{width:100%;border-collapse:collapse;min-width:640px}
  .ppltable th{text-align:left;font-size:10.5px;font-weight:800;color:var(--faint);letter-spacing:0.04em;
    padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg)}
  .ppltable th.no{width:34px;text-align:center}
  .ppltable th.ublue{box-shadow:inset 0 -2px 0 #2563eb}
  .ppltable th.uamber{box-shadow:inset 0 -2px 0 #d97706}
  .ppltable td{padding:8px 10px;border-bottom:1px solid var(--bg);vertical-align:middle;white-space:nowrap;font-size:12px}
  .ppltable td.no{text-align:center;color:var(--faint);font-weight:700;font-size:11px}
  .ppltable tr.prow{cursor:pointer}
  .ppltable tr.prow:hover{background:var(--bg)}
  .ppltable tr.prow.open{background:var(--acc-soft)}
  .pname{display:flex;align-items:center;gap:8px}
  .avatar{width:26px;height:26px;border-radius:8px;color:#ffffff;display:inline-flex;align-items:center;
    justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
  .avatar.sm{width:22px;height:22px;border-radius:6px;font-size:10px;margin-right:7px;vertical-align:middle}
  .nm{font-weight:800;font-size:12.5px}
  .leftbadge{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:5px;background:var(--bg);
    color:var(--faint);border:1px dashed #cbd5e1;white-space:nowrap}
  .rolechip{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:5px;white-space:nowrap}
  .dash{color:#cbd5e1}
  .barwrap{display:flex;align-items:center;gap:7px;min-width:110px}
  .barnum{font-size:12.5px;font-weight:800;white-space:nowrap}
  .barnum small{font-size:10px;color:var(--faint);font-weight:600}
  .bartrack{flex:1;height:7px;border-radius:20px;background:var(--bg);overflow:hidden;min-width:46px}
  .barfill{display:block;height:100%;border-radius:20px}
  .tel{text-decoration:none;margin-right:6px}
  .notecell span{font-size:11px;color:var(--sub);max-width:170px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;display:inline-block}
  .chev{color:var(--faint);font-size:11px}
  tr.prow.open .chev{transform:rotate(90deg);display:inline-block}
  tr.detail td{background:var(--bg);padding:13px 18px;border-bottom:1px solid var(--line);white-space:normal}
  .detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:880px}
  .dtitle{font-size:10.5px;font-weight:800;color:var(--faint);margin-bottom:7px}
  .drow{display:flex;align-items:flex-start;gap:8px;padding:3px 0;font-size:11.5px}
  .dm{width:40px;font-weight:700;flex-shrink:0}
  .dchips{display:flex;flex-wrap:wrap;gap:4px;flex:1}
  .dchip{background:#eff6ff;color:#2563eb;font-weight:700;border-radius:4px;padding:1px 6px;font-size:10.5px}
  .dchip.law{background:#fffbeb;color:#d97706}
  .dcnt{font-weight:800;flex-shrink:0}

            /* 구글 만든이 메일 → 사번. 이것이 있어야 구글 일정이 «그 사람 색»으로 칠해진다 */

/* ⚠ 직원 명부는 «배열»로도, «사번이 열쇠인 지도»로도 올 수 있다.

/* 명부 전부 — 그만둔 사람까지. «이름을 찾을 때»만 쓴다. */
function allUsers(){

/* ★ 현직만 — 칩·고르는 목록은 «반드시» 이것을 쓴다 (이알피 getActiveUsers 와 같은 기준).
   ⚠ 2026-09-18 대표 화면에서 사람 칩이 «서른셋» 나왔다. 명부 32명 가운데 현직은

function users(){

}
function userOf(sid){

/* ── 그 날의 일들 ──────────────────────────────────────────────────── */
/* ── 구글 캘린더 ──────────────────────────────────────────────────────
   ★ 이알피 달력을 «채우는 것»이 바로 이것이다. 2026-09 에만 126건이 있고,

     그것은 아직 이알피에서 한다.
   ⚠ 값은 이알피와 «같은 것»이어야 한다. 달력 주소가 다르면 다른 달력을 보게 된다.
     tests/cal-gcal-same-as-erp.test.js 가 이알피 소스와 맞대 본다. */
var GCAL_API_KEY = "AIzaSyA0I_VD_dvFo9CPCDrPCiewcnuG0VeTkuo";
var GCAL_CAL_ID  = "euh07th7tvlco9corqen9lqpts@group.calendar.google.com";
var GCAL = { evs:[], ym:"", loading:false, err:"" };

/* 구글이 쓰는 색표 — 사람이 구글에서 «고른» 색을 그대로 쓰려면 이 표가 있어야 한다.
   ⚠ 색표를 «먼저» 받고 일정을 받는다 — 순서가 뒤바뀌면 첫 그림에 색이 빠진다. */
function gcalLoadColors(){
  if(window._gcalColors) return Promise.resolve(window._gcalColors);
  return fetch("https://www.googleapis.com/calendar/v3/colors?key=" + GCAL_API_KEY)
    .then(function(r){ return r.json(); })
    .then(function(d){
      var m = {}, ev = (d && d.event) || {};
      Object.keys(ev).forEach(function(k){ if(ev[k] && ev[k].background) m[String(k)] = ev[k].background; });
      window._gcalColors = m; return m;
    })
    .catch(function(){ window._gcalColors = {}; return window._gcalColors; });
}
/* 색을 고를 때 쓰는 목록 — 구글 색표에서 중복을 뺀 것.
   ⚠ 새 색을 만들지 않는다. 같은 사람이 볼 때마다 색이 바뀌면 색으로 사람을 못 알아본다. */
function gcalPalette(){
  var m = window._gcalColors;
  if(!m) return null;
  var ks = Object.keys(m).sort(function(a,b){ return (parseInt(a,10)||0) - (parseInt(b,10)||0); });
  var out = [];
  ks.forEach(function(k){ if(m[k] && out.indexOf(m[k]) < 0) out.push(m[k]); });
  return out.length ? out : null;
}
/* 실시간DB 열쇠에는 점(.)을 못 쓴다 — 이메일에는 점이 있어 쉼표로 바꿔 담는다.
   ⚠ 이알피와 «같은 셈»이어야 한다. 다르면 이어 둔 사람이 안 찾아진다. */
function gcalMailKey(m){ return String(m || "").trim().toLowerCase().replace(/[.#$\[\]\/]/g, ","); }
function gcalMailMap(){
  var v = D.gcal_mail_sid;
  return (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
}
/* 만든이 메일 → 직원 사번.
   ★ 사람이 «한 번 이어 준 것»이 가장 확실하다 — 명부 대조보다 먼저 본다.
     명부에는 gmail 이 없어(로그인아이디는 사번@… 꼴) 이 표가 없으면 맞출 길이 없다. */
function gcalSidByMail(mail){
  var k = gcalMailKey(mail);
  if(!k) return "";
  var mp = gcalMailMap();
  if(mp[k]) return mp[k];
  var us = users();
  for(var i = 0; i < us.length; i++){
    var u = us[i] || {};
    var cands = [u.loginId, u.email, u.gmail, u.googleEmail];
    for(var j = 0; j < cands.length; j++){
      if(cands[j] && gcalMailKey(cands[j]) === k) return u.sid;
    }
  }
  return "";
}
/* 이어 준 사람이 없을 때 — 메일로 «늘 같은» 색 하나를 고른다 */
function gcalMailColor(mail){
  var k = gcalMailKey(mail);
  if(!k) return "";
  var uniq = gcalPalette() || ["#2563eb","#16a34a","#dc2626","#d97706","#64748b","#1e40af"];
  var h = 0;
  for(var i = 0; i < k.length; i++){ h = (h * 131 + k.charCodeAt(i)) >>> 0; }
  return uniq[h % uniq.length];
}

/* 그 달(앞뒤 걸친 42칸)의 구글 일정을 받아 둔다.
   ⚠ 달이 바뀔 때만 받는다 — 다시 그릴 때마다 받으면 요금과 깜빡임이 는다. */
function gcalLoad(force){
  var 칸 = monthGrid(S.ym);
  var 첫날 = 칸[0].date, 끝날 = shiftDay(칸[칸.length-1].date, 1);
  var 키 = 첫날 + "~" + 끝날;
  if(!force && GCAL.ym === 키) return Promise.resolve();
  GCAL.ym = 키; GCAL.loading = true; GCAL.err = "";
  var url = "https://www.googleapis.com/calendar/v3/calendars/"
    + encodeURIComponent(GCAL_CAL_ID) + "/events?key=" + GCAL_API_KEY
    + "&timeMin=" + encodeURIComponent(첫날 + "T00:00:00+09:00")
    + "&timeMax=" + encodeURIComponent(끝날 + "T00:00:00+09:00")
    + "&singleEvents=true&orderBy=startTime&maxResults=500";
  return gcalLoadColors()
    .then(function(){ return fetch(url); })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.error){ throw new Error(d.error.message || "구글 달력 오류"); }
      GCAL.evs = (d.items || [])
        .filter(function(ev){ return ev.start && (ev.start.date || ev.start.dateTime); })
        .map(gcalToEvent);
      GCAL.loading = false; render();
    })
    .catch(function(e){
      /* ⚠ 못 받았으면 «조용히» 비우지 않는다 — 빈 달력은 「일정이 없다」는 거짓말이다 */
      GCAL.loading = false; GCAL.err = (e && e.message) || String(e); render();
    });
}

/* 구글 일정 한 건 → 우리 칩.
   ★ 색 고르는 차례 — 앞이 있으면 뒤로 안 넘어간다(이알피와 같다):
     ①구글에서 그 일정에 «고른» 색  ②만든이가 이어져 있으면 그 직원 색
     ③제목에 현직 이름이 있으면 그 직원 색  ④만든이 메일로 늘 같은 색  ⑤기본 */
function gcalToEvent(ev){
  var date = (ev.start.date || ev.start.dateTime || "").slice(0,10);
  var timeStr = ev.start.dateTime ? ev.start.dateTime.slice(11,16) : "";
  var title = (ev.summary || "").trim()
    || (ev.description || "").replace(/<[^>]+>/g, "").slice(0,20).trim();
  if(!title && timeStr) title = timeStr + " 일정";
  if(!title) title = "일정";
  var gColor = (window._gcalColors && ev.colorId) ? (window._gcalColors[String(ev.colorId)] || "") : "";
  var mail = (ev.creator && ev.creator.email) || (ev.organizer && ev.organizer.email) || "";
  var mailSid = gcalSidByMail(mail);
  var color = gColor || (mailSid ? (colorOf(mailSid) || "") : "")
    || gcalMailColor(mail) || (ev.summary ? "#2563eb" : "#94a3b8");
  var sid = mailSid || "GCAL";
  var us = users();
  for(var ui = 0; ui < us.length; ui++){
    var u = us[ui];
    if(u.name && title.indexOf(u.name) >= 0){
      /* ⚠ 구글 색이 있으면 «그것이 이긴다» — 앱 색으로 덮으면 구글 화면과 달라진다.
         ⚠ 만든이가 이미 찾아졌으면 그것이 더 확실하다 — 제목의 이름은 「권형하에게
           보고」처럼 «남의 이름»일 수도 있다. */
      if(!gColor && !mailSid) color = colorOf(u.sid) || color;
      if(!mailSid) sid = u.sid;
      break;
    }
  }
  /* ⚠ 아이콘을 안 붙인다 — 구글 화면에는 없다(kind 로 이미 갈린다) */
  return { kind:"gcal", store:"gcal", id:ev.id, sid:sid, date:date,
    text:title, time: (timeStr && timeStr !== "00:00") ? timeStr.replace(":","") : "",
    color:color, gcalUrl:ev.htmlLink || "",
    tip: title + (ev.location ? "\n📍 " + ev.location : "")
         + (mail ? "\n✉ " + mail : "") };
}

/* 그 날의 일들 — 칩의 «글자와 색»은 이알피와 글자 하나까지 같다.
   ⚠ 여기서 예쁘게 바꾸지 말 것. 대표님이 두 화면을 나란히 놓고 보신다.
     고칠 일이 생기면 이알피부터 고치고 그 다음 여기를 맞춘다
     (tests/cal-same-as-erp.test.js 가 두 쪽을 맞대 본다). */
function eventsOn(ymd, eumOnly){
  var out = [];
  /* ① 일정 — 외부 협력자 일정은 ⚖️·🤝 를 앞에 붙이고 그 사람 색으로 */
  arr(D.my_schedules).forEach(function(s){
    if(!s || s.date !== ymd) return;
    if(s.externalId){
      var ext = externalOf(s.externalId);
      if(!ext || ext.active === false) return;
      var prefix = ext.role === "변호사" ? "⚖️" : "🤝";
      out.push({ kind:"sch", store:"my_schedules", id:s.id, sid:"EXT_"+s.externalId, externalId:s.externalId,
        text: prefix + " " + ext.name + (s.title ? " · " + s.title : ""),
        time:"", color: ext.color || "#2563eb",
        tip: ext.name + (ext.role ? " (" + ext.role + ")" : "") + (ext.contact ? "\n☎ " + ext.contact : "")
             + (ext.note ? "\n📝 요구사항: " + ext.note : "") });
      return;
    }
    var hm = String(s.time || "").slice(0,5);
    out.push({ kind:"sch", store:"my_schedules", id:s.id, sid:s.sid,
      text: s.title || "일정",
      /* 시각은 「1030」처럼 콜론 없이 — 좁은 칸에서 제목이 두 글자쯤 더 보인다 */
      time: (hm && hm !== "00:00") ? hm.replace(":","") : "",
      color: colorOf(s.sid) || "#64748b",
      tip: (s.title || "일정") + (s.note ? " · " + s.note : "") });
  });
  /* ② 근태 — 이알피와 같은 글자·같은 색 */
  arr(D.attendance_records).forEach(function(r){
    if(!r || r.date !== ymd) return;
    if(ATT_SHOW.indexOf(r.type) < 0) return;
    var who = nameOf(r.sid) ? " (" + nameOf(r.sid) + ")" : "";
    var 글 = r.type === "leave" ? "🏖️ 연차" + who
      : r.type === "halfday-am" ? "🌅 오전반차" + who
      : r.type === "halfday-pm" ? "🌇 오후반차" + who
      : r.type === "leave-hour" ? "⏱️ 시간연차" + who
      : r.type === "special-leave" ? "🎁 특별휴가" + who
      : r.type === "maternity" ? "🤱 출산휴가" + who
      : r.type === "parental-leave" ? "👶 육아휴직" + who
      : r.type === "sick" ? "🤒 병가" + who + (r.note ? " " + r.note : "")
      : r.type === "trip" ? "🚗 출장" + who + (r.note ? " " + r.note : "")
      : r.type === "telework" ? "🏠 재택" + who + (r.note ? " " + r.note : "")
      : r.type === "eum-work" ? (function(){
          var t = r.startTime ? r.startTime.replace(":","") + "-" + String(r.endTime||"").replace(":","") + " " : "";
          if(r.externalId){
            var ex = externalOf(r.externalId);
            if(ex) return "🏛️ " + t + ex.name + " 이음센터" + (r.note ? " " + r.note : "");
          }
          var nm = nameOf(r.sid);
          return "🏛️ " + t + (nm ? nm + " 이음센터" : "이음센터") + (r.note ? " " + r.note : "");
        })()
      : "";
    /* 색 — 이알피와 같은 차례. 이음센터는 «그 직원 색», 사람을 모르면 회색이다
       (외부 협력자의 이음 근무가 회색인 까닭 — 이알피도 그 사람 색을 쓰지 않는다). */
    var col = r.type === "trip" ? "#1e40af"
      : r.type === "telework" ? "#2563eb"
      : r.type === "eum-work" ? (colorOf(r.sid) || "#94a3b8")
      : r.type === "sick" ? "#dc2626"
      : (colorOf(r.sid) || "#64748b");
    var tip = 글;
    if(r.type === "eum-work" && r.externalId){
      var e2 = externalOf(r.externalId);
      if(e2) tip = e2.name + (e2.role ? " (" + e2.role + ")" : "")
        + (e2.contact ? "\n☎ " + e2.contact : "") + (e2.note ? "\n📝 요구사항: " + e2.note : "");
    }
    out.push({ kind: r.type === "eum-work" ? "eum" : "att", store:"attendance_records", id:r.id,
      sid:r.sid, externalId:r.externalId, type:r.type,
      text:글, time:"", color:col, tip:tip });
  });
  /* ③ 구글 캘린더 — 이알피 달력을 채우는 것이 이것이다(9월 126건).
     ⚠ 이음 보기에서는 안 보탠다 — 거기는 이음 근무만 보는 자리다.
     ⚠★ 거르개가 「전체」나 「구글」일 때만 섞는다 — 이알피와 «같은 규칙»이다
        (pu-erp.html: calFilter === null || calFilter === 'gcal').
        사람을 고른 채로 구글까지 섞으면 칩에 붙는 「겹친 날」 숫자가 두 앱에서 달라진다. */
  if(!eumOnly && (S.filter === null || S.filter === "gcal")){
    for(var gi = 0; gi < GCAL.evs.length; gi++){
      if(GCAL.evs[gi].date === ymd) out.push(GCAL.evs[gi]);
    }
  }
  if(eumOnly) out = out.filter(function(e){ return e.kind === "eum"; });
  return out;
}
/* 달력에 그리는 근태 — 이알피와 같은 목록이다(지각·조퇴·결근·공가는 달력에 안 뜬다) */
var ATT_SHOW = ["leave","halfday-am","halfday-pm","leave-hour","special-leave","sick",
                "maternity","parental-leave","trip","telework","eum-work"];

/* 거르개 — null=전체 · 'pureun'=푸른 직원만 · 'eumwork'=이음 근무만 · sid=그 사람만 */
/* 거르개 — 이알피와 같은 뜻으로 가른다.
     null      = 전체
     'pureun'  = 푸른 직원 것만 (구글·외부인 제외)
     'gcal'    = 구글 달력에서 온 것만
     'eumwork' = 이음센터 근무만
     사번      = 그 사람 것만 */
function passFilter(ev){
  var f = S.filter;
  if(!f) return true;
  if(f === 'pureun')  return ev.kind !== 'gcal' && !ev.externalId;
  if(f === 'gcal')    return ev.kind === 'gcal';
  if(f === 'eumwork') return ev.kind === 'eum';
  return ev.sid === f;
}

/* ── 달력 그리기 ───────────────────────────────────────────────────── */
/* ── 달력 — 이알피(법인 대시보드)와 «같은 꼴» ─────────────────────────
   대표 지시 2026-09-18 「대시보드 제외한 화면은 똑같이 만들어라」.
   그래서 여기서 정하는 것은 우리 취향이 아니라 «이알피가 하던 그대로»다:
     · 날짜 옆 괄호는 음력 날짜 — 구글 달력 위젯이 「25 (13)」로 붙여 주는 그 숫자
     · 오늘은 숫자에만 파란 동그라미(음력까지 감싸면 알약처럼 길어진다)
     · 공휴일은 칸 맨 위에 «칩»으로 (오른쪽 위 작은 글씨가 아니다)
     · 한 칸에 넷까지 보이고 나머지는 접는다 — 셋이면 더보기가 너무 자주 뜬다
     · 시각은 「1030」처럼 콜론 없이 붙여 쓴다 — 좁은 칸에서 제목이 두 글자쯤 더 보인다
     · 여섯 줄 고정(6×7) — 달마다 표 높이가 들썩이지 않게
   ⚠ 값을 바꾸고 싶으면 이알피부터 보라. 두 화면이 갈리는 것이 여기서 가장 나쁘다. */

/* 음력 — 표를 손으로 들고 있지 않는다. 브라우저에 든 단기(檀紀)력을 쓴다.
   ⚠ 42칸을 다시 그릴 때마다 새로 세면 느리다 — 한 번 센 것은 적어 둔다. */
var _lunar = {};
function lunarDay(ymd){
  if(!ymd) return "";
  if(_lunar[ymd] !== undefined) return _lunar[ymd];
  var out = "";
  try{
    out = new Intl.DateTimeFormat("ko-KR-u-ca-dangi", {day:"numeric", timeZone:"UTC"})
            .format(new Date(ymd + "T00:00:00Z")).replace(/[^0-9]/g, "");
  }catch(e){ out = ""; }
  _lunar[ymd] = out;
  return out;
}
/* 머리글의 「병오년8월 – 9월」 — 그 달 첫날·끝날의 음력 달.
   ⚠ 간지(병오)는 era:"long" 을 켜야 나온다. year:"numeric" 만 주면 2026 만 온다. */
function lunarRange(ym){
  try{
    var y = +String(ym).slice(0,4), m = +String(ym).slice(5,7);
    if(!y || !m) return "";
    var a = new Date(Date.UTC(y, m-1, 1)), b = new Date(Date.UTC(y, m, 0));
    var fm = new Intl.DateTimeFormat("ko-KR-u-ca-dangi", {era:"long", year:"numeric", month:"numeric", timeZone:"UTC"});
    function pick(d, t){ var ps = fm.formatToParts(d); for(var i=0;i<ps.length;i++) if(ps[i].type===t) return ps[i].value; return ""; }
    var yn = pick(a,"yearName"), m1 = pick(a,"month"), m2 = pick(b,"month");
    if(!m1) return "";
    return yn + "년" + m1 + (m2 && m2 !== m1 ? " – " + m2 : "");
  }catch(e){ return ""; }
}

/* 바탕색 위에 어떤 글자색이 읽히나 — 이알피의 calTextOn 과 같은 셈이어야 한다.
   초록이 가장 밝게 느껴지므로 사람 눈 기준(0.299/0.587/0.114)으로 잰다. */
function textOn(bg){
  var hex = String(bg || "").replace("#", "");
  if(hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  if(hex.length !== 6) return "#ffffff";
  var r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
  var lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.62 ? "#1e293b" : "#ffffff";
}

/* 여섯 줄 고정 격자 — 이알피 buildMonthGrid 와 같다 */
function monthGrid(ym){
  var year = parseInt(ym.slice(0,4),10), month = parseInt(ym.slice(5,7),10) - 1;
  var first = new Date(year, month, 1), startDay = first.getDay();
  var lastDate = new Date(year, month+1, 0).getDate();
  var prevLast = new Date(year, month, 0).getDate();
  var grid = [], k;
  for(k = startDay-1; k >= 0; k--){
    var pd = prevLast - k, pm = new Date(year, month-1, 1);
    grid.push({ date: ymdOf(pm.getFullYear(), pm.getMonth()+1, pd), day:pd, other:true });
  }
  for(k = 1; k <= lastDate; k++) grid.push({ date: ymdOf(year, month+1, k), day:k, other:false });
  var n = 1;
  while(grid.length < 42){
    var nm = new Date(year, month+1, 1);
    grid.push({ date: ymdOf(nm.getFullYear(), nm.getMonth()+1, n), day:n, other:true }); n++;
  }
  return grid;
}
function ymdOf(y, m, d){
  return y + "-" + String(m).padStart(2,"0") + "-" + String(d).padStart(2,"0");
}

/* 일정 칩 하나 — 월·주·일 보기가 «같은 규칙»을 쓴다(보기를 바꿀 때 색이 튀지 않게) */
function chipHtml(e, ymd){
  var bg = e.color || "#64748b";
  var 지남 = ymd < todayYMD();
  var 시각 = e.time ? "<b>" + esc(e.time) + "</b> " : "";
  return '<div class="ev" data-ev="' + esc(e.store) + ':' + esc(e.id) + '"'
    + ' title="' + esc(e.tip) + '"'
    + ' style="background:' + esc(bg) + ';color:' + textOn(bg) + (지남 ? ';opacity:.65' : '') + '">'
    + 시각 + esc(e.text) + '</div>';
}

function calendarHtml(eumOnly){
  /* 보는 달이 바뀌었으면 구글을 다시 받는다 — 같은 달이면 아무 일도 안 한다(gcalLoad 안에서 가른다) */
  if(fbDb) gcalLoad();
  if(S.view === "week") return weekHtml(eumOnly);
  if(S.view === "day")  return dayHtml(eumOnly);
  var grid = monthGrid(S.ym), today = todayYMD();
  /* ★ 한 칸에 «다» 보인다 — 접지 않는다 (대표 지시 2026-09-19 「맞다 늘려라」).
     여태는 넷까지 보이고 나머지를 「N개 더보기」로 접었다(구글이 그렇고 이알피도 그렇다).
     2026년 9월을 진짜 자료로 재 보니 42칸 가운데 18칸이 넷을 넘었고 «56건»이 접혀 있었다 —
     달력을 펴는 까닭이 바로 그 56건인데, 그걸 보려면 칸마다 한 번 더 눌러야 했다.
     ⚠ 이 «한 가지»는 이알피와 다르다(그쪽은 아직 MAX_SHOW=4 에서 접는다).
       「대시보드 제외한 화면은 똑같이」 뒤에 온 지시라 이것이 이긴다.
       되돌리려면 그 지시부터 확인할 것 — tests/cal-cell-shows-all.test.js 가 막는다. */
  var cells = grid.map(function(c, idx){
    var evs = eventsOn(c.date, eumOnly).filter(passFilter).filter(matchSearch);
    var hol = holidayOf(c.date);
    var 오늘 = c.date === today;
    var 찾음 = !!(S.q && evs.length);
    var bg = 오늘 ? "#fffbeb" : c.other ? "#f8fafc" : hol ? "#fef2f2" : 찾음 ? "#fffbeb" : "#ffffff";
    var 테 = c.other ? "#e2e8f0" : "#f8fafc";
    return '<div class="day" data-day="' + c.date + '"'
      + ' style="background:' + bg + ';border-right:1px solid ' + 테 + ';border-bottom:1px solid ' + 테
      + (찾음 ? ';outline:2px solid #fbbf24;outline-offset:-2px' : '') + '">'
      + '<div class="dline">'
      +   '<div class="dnum' + (오늘 ? " today" : "") + (c.other ? " other" : "") + '">' + c.day + '</div>'
      +   '<span class="lun' + (c.other ? " other" : "") + '">(' + lunarDay(c.date) + ')</span>'
      + '</div>'
      + '<div class="evs">'
      +   (hol ? '<div class="ev hol" title="' + esc(hol) + '"' + (c.other ? ' style="opacity:.55"' : '') + '>' + esc(hol) + '</div>' : '')
      +   evs.map(function(e){ return chipHtml(e, c.date); }).join("")
      + '</div></div>';
  }).join("");
  return '<div class="cal">'
    + '<div class="calhd">' + ["일","월","화","수","목","금","토"].map(function(w,i){
        return '<div' + (i===0 ? ' class="sun"' : i===6 ? ' class="sat"' : '') + '>' + w + '</div>';
      }).join("") + '</div>'
    + '<div class="calgrid">' + cells + '</div></div>';
}

/* ── 주 보기 ── 이알피와 같게: 이레를 나란히, 하루씩 위에서 아래로 */
function weekDays(ymd){
  var d = new Date(ymd + "T00:00:00"), out = [];
  d.setDate(d.getDate() - d.getDay());
  for(var i=0;i<7;i++){ out.push(ymdOf(d.getFullYear(), d.getMonth()+1, d.getDate())); d.setDate(d.getDate()+1); }
  return out;
}
function weekHtml(eumOnly){
  var days = weekDays(S.date), today = todayYMD();
  var cols = days.map(function(ds){
    var evs = eventsOn(ds, eumOnly).filter(passFilter).filter(matchSearch);
    var hol = holidayOf(ds);
    var 오늘 = ds === today;
    var d = new Date(ds + "T00:00:00");
    return '<div class="wcol" data-day="' + ds + '" style="background:' + (오늘 ? "#fffbeb" : hol ? "#fef2f2" : "#ffffff") + '">'
      + '<div class="whd' + (d.getDay()===0 ? " sun" : d.getDay()===6 ? " sat" : "") + '">'
      +   ["일","월","화","수","목","금","토"][d.getDay()]
      +   '<div class="dnum' + (오늘 ? " today" : "") + '">' + d.getDate() + '</div>'
      +   '<span class="lun">(' + lunarDay(ds) + ')</span></div>'
      + '<div class="evs">'
      +   (hol ? '<div class="ev hol">' + esc(hol) + '</div>' : '')
      +   evs.map(function(e){ return chipHtml(e, ds); }).join("")
      + '</div></div>';
  }).join("");
  return '<div class="cal"><div class="wgrid">' + cols + '</div></div>';
}

/* ── 일 보기 ── 하루치를 한 줄씩 크게 */
function dayHtml(eumOnly){
  var ds = S.date;
  var evs = eventsOn(ds, eumOnly).filter(passFilter).filter(matchSearch);
  var hol = holidayOf(ds);
  return '<div class="cal"><div class="dayview" data-day="' + ds + '">'
    + (hol ? '<div class="ev hol">' + esc(hol) + '</div>' : '')
    + (evs.length ? evs.map(function(e){ return chipHtml(e, ds); }).join("")
                  : '<div class="later"><p>이 날에는 아무것도 없습니다. 눌러서 넣으세요.</p></div>')
    + '</div></div>';
}

/* ── 위 줄 ── ◀ 2026-09 ▶ · 병오년8월 – 9월 · 오늘 · [월|주|일] · 🔍 일정 검색 */
/* 달력 머리줄 — 달 이동·보기·검색. «한 줄»이다 (대표 지시 2026-09-19 「한줄로 정리해라」).
   ★ 사람 칩은 여기 없다 — 탭 줄로 올렸다(대표 지시 「캡쳐1은 캡쳐2 줄에 넣어라」).
     탭 줄은 오른쪽이 통째로 비어 있었고, 칩을 한 줄 따로 두면 달력이 그만큼 내려간다.
   ⚠ 좁은 화면에서는 접힌다(flex-wrap). 못 들어가는 것을 우겨 넣으면 글자가 잘린다.
   ⚠ eumOnly 를 그대로 받는다 — 쓰지 않아도 부르는 쪽 모양을 바꾸지 않는다. */
function calheadHtml(eumOnly){
  return '<div class="calhead">' + monthbarHtml() + srchHtml() + '</div>';
}
function monthbarHtml(){
  var 가운데 = S.view === "month" ? S.ym
    : S.view === "week" ? (function(){ var w = weekDays(S.date); return w[0].slice(5) + " ~ " + w[6].slice(5); })()
    : (S.date.slice(5) + " (" + ["일","월","화","수","목","금","토"][new Date(S.date + "T00:00:00").getDay()] + ")");
  var 음력 = S.view === "month" ? lunarRange(S.ym) : "";
  return '<div class="monthbar">'
    + '<button class="mv" data-mv="-1">◀</button>'
    + '<span class="ym">' + esc(가운데) + '</span>'
    + '<button class="mv" data-mv="1">▶</button>'
    + (음력 ? '<span class="lunrange">' + esc(음력) + '</span>' : '')
    + '<button class="todaybtn" data-mv="0">오늘</button>'
    + '<span class="seg">'
    + [["month","월"],["week","주"],["day","일"]].map(function(v){
        return '<button data-view="' + v[0] + '"' + (S.view === v[0] ? ' class="on"' : '') + '>' + v[1] + '</button>';
      }).join("")
    + '</span>'
    + '</div>';
}

/* 검색칸 — 줄 맨 오른쪽 끝에 붙는다(.calhead .srch 의 margin-left:auto).
   ⚠ 달바 안에 두면 월|주|일 바로 옆에 붙어 오른쪽이 통째로 빈다. */
function srchHtml(){
  return '<span class="srch"><span class="ic">🔍</span>'
    + '<input type="search" id="calq" placeholder="일정 검색" value="' + esc(S.q) + '"></span>';
}

/* 검색 — 제목·메모·사람 이름 어디에 걸려도 남긴다 */
function matchSearch(e){
  if(!S.q) return true;
  return String(e.tip || e.text || "").toLowerCase().indexOf(S.q.toLowerCase()) >= 0;
}

/* ── 사람 칩 ── 이알피처럼 «색 동그라미 + 이름 두 글자».
   ⚠ 색은 이알피가 정한 것을 그대로 쓴다 — 같은 사람이 두 앱에서 다른 색이면
     그 색은 아무 뜻도 없어진다. 여기서 새로 정하지 않는다. */
function chipsHtml(eumOnly){
  var 사람 = eumOnly ? ieumPeople().filter(function(p){ return !p.left; }) : users().map(function(u){
    return { pk:u.sid, name:u.name || u.sid, color: colorOf(u.sid) || "#64748b" };
  });
  /* 배지 숫자의 «뜻» — 이알피와 같다: 총 건수가 아니라 «같은 날에 두 건 넘게 잡힌 날이 며칠인가».
     ⚠ 총 건수를 적으면 바쁜 사람일수록 큰 숫자가 붙어 아무 뜻도 없다.
       겹친 날을 세면 「이 사람 그날 두 탕이다」가 눈에 띈다 — 그게 봐야 할 것이다. */
  var 겹침 = {};
  monthDates().forEach(function(ds){
    var 하루 = {};
    eventsOn(ds, eumOnly).forEach(function(e){
      var k = e.externalId || e.sid; if(!k) return;
      하루[k] = (하루[k] || 0) + 1;
    });
    Object.keys(하루).forEach(function(k){ if(하루[k] >= 2) 겹침[k] = (겹침[k] || 0) + 1; });
  });
  /* 원천 칩 — 이알피 머리줄의 「푸른 · 이음 · 구글(126)」과 같은 뜻.
     ⚠ 구글 칩에 «몇 건인지»를 적는다. 0 이면 못 받은 것인지 없는 것인지 갈라 적는다 —
       빈 달력을 말없이 보여 주는 것이 가장 나쁘다(2026-09-18 에 그래서 텅 비어 보였다). */
  /* 이알피와 «같은 수»를 적는다 — 이알피는 받아 온 것 전부를 센다(앞뒤 달에 걸친
     42칸 어치). 이 달 것만 세면 이알피 화면과 숫자가 달라 보인다. */
  var 구글수 = GCAL.evs.length;
  var 앞 = '<button class="allchip' + (S.filter === null ? " on" : "") + '" data-f="">전체</button>';
  var 뒤 = eumOnly ? '' : (
      '<span class="srcsep"></span>'
    + '<button class="chip' + (S.filter === "pureun" ? " on" : "") + '" data-f="pureun">푸른</button>'
    + '<button class="chip' + (S.filter === "eumwork" ? " on" : "") + '" data-f="eumwork">이음</button>'
    + (GCAL.err
        ? '<button class="chip warn" data-gcalretry="1" title="' + esc(GCAL.err) + '">⚠ 구글 못 받음 — 다시</button>'
        : GCAL.loading
          ? '<button class="chip" disabled>⏳ 구글 받는 중</button>'
          : '<button class="chip' + (S.filter === "gcal" ? " on" : "") + '" data-f="gcal">구글 (' + 구글수 + ')</button>')
  );
  return '<div class="chips">' + 앞
    + 사람.map(function(p){
        var on = S.filter === p.pk;
        var n = 겹침[p.pk] || 0;
        return '<span class="pwrap">'
          + '<button class="pchip' + (on ? " on" : "") + '" data-f="' + esc(p.pk) + '"'
          + ' title="' + esc(p.name) + '" style="background:' + esc(p.color) + '">'
          + esc(String(p.name).slice(0,2)) + '</button>'
          + (n ? '<span class="pcount" title="' + esc(p.name) + ' 같은 날 겹친 일정 ' + n + '일">'
                 + (n > 9 ? "9+" : n) + '</span>' : '')
          + '</span>';
      }).join("")
    + 뒤 + '</div>';
}

/* 지금 보고 있는 범위의 날짜들 — 칩 옆 건수를 그 범위로만 센다 */
function monthDates(){
  if(S.view === "day") return [S.date];
  if(S.view === "week") return weekDays(S.date);
  return monthGrid(S.ym).filter(function(c){ return !c.other; }).map(function(c){ return c.date; });
}

/* 못 읽은 칸이 있으면 숨기지 않는다 — 빈 달력은 「일정이 없다」는 거짓말이 된다. */
function failedHtml(){
  var ks = Object.keys(FAILED);
  if(!ks.length) return '';
  return '<div class="note"><span>⚠ 못 읽은 자료가 있습니다 — 달력이 다 차 보이지 않을 수 있습니다: '
    + esc(ks.join(' · ')) + '</span></div>';
}

/* 어느 표가 아직 «배열»이면 그 표는 여기서 못 고친다 — 쓰면 표가 깨진다.
   ⚠ 이 말을 달력 «맨 위»에 띠로 두지 않는다 — 달력은 이알피와 같아야 하고,
     아직 아무것도 안 하려는 사람에게 못 하는 것부터 말하면 화면만 좁아진다.
     대신 «고치려고 창을 연 그 순간» 그 자리에서 말한다(못 한다가 아니라 저기서 한다).
     (대표 지시 2026-09-18 「대시보드 제외한 화면은 똑같이 만들어라」) */
function 옛방식표(store){
  return !PuCalWrite.isMapForm(PuCalRead.rawForm(store));
}
function 옛방식안내(store){
  var 이름 = store === 'my_schedules' ? '일정' : '근태';
  return '⚠ ' + 이름 + '은(는) 아직 옛 방식(배열)으로 담겨 있어 여기서 못 고칩니다.\n'
    + '푸른이알피에서 고쳐 주세요 — 여기서 쓰면 표가 깨집니다.';
}
/* 마감된 달을 보고 있으면 미리 알린다 — 눌러 보고 나서 거절당하는 것보다 낫다 */
function lockNote(){
  if(arr(D.locked_attend_months).indexOf(S.ym) < 0) return '';
  return '<div class="note"><span>🔒 '+esc(S.ym)+' 근태·휴가는 마감됐습니다 — 연차·근태는 고칠 수 없습니다'
    + ' (일정은 됩니다).</span></div>';
}

function laterHtml(tab){
  return '<div class="panel later">'
    + '<h2>'+esc(tab.label)+' — 아직 이알피에 있습니다</h2>'
    + '<p>이 화면은 다음 걸음에 옮깁니다. 지금은 푸른이알피에서 그대로 쓰실 수 있습니다.'
    + (tab.money ? '<br>금액이 보이는 화면이라 옮길 때 권한을 함께 옮깁니다(관리자만).' : '')
    + '</p>'
    + '<button class="btn" data-erp="'+esc(tab.erp)+'">푸른이알피에서 열기</button></div>';
}

/* ── 이음센터 · 인원 현황 ─────────────────────────────────────────────
   「누가 몇 번 이음센터에 나갔나」를 사람별로 센다.
   ⚠ 이 화면은 «읽기»다. 한도·비고·강의 기록을 고치는 것은 아직 이알피에서 한다 —
     그 세 자리는 한 줄짜리 기록이 아니라 «표 통째»로 담겨 있어, 우리 저장 관문
     (칸별로 보내기)이 그대로 못 쓴다. 억지로 통째 저장을 흉내 내면 두 사람이
     같은 순간에 고칠 때 한쪽이 통째로 날아간다. */
var IEUM_START_YEAR = 2024;
/* 이알피의 같은 이름과 «같은 값»이어야 한다 — 다르면 밖으로 나간 링크가 갈린다.
   tests/cal-ieum-view.test.js 가 두 값을 맞대 본다. */
var IEUM_VIEW_BASE = 'https://nabaho.github.io/pureunall/ieum-view.html';

/* 사람 목록 — 내부 노무사 → 외부 노무사 → 변호사 → 그만둔 사람(기록이 있는 경우만).
   ⚠ 그만둔 사람을 지우지 않는다 — 지나간 근무 기록이 사라지면 셈이 틀어진다. */
function ieumPeople(){
  var ext = arr(D.external_staff);
  var att = arr(D.attendance_records);
  var 살아있는외부 = ext.filter(function(x){ return x && x.active !== false; });
  var 이음근무있나 = function(pred){ return att.some(function(r){ return r.type === "eum-work" && pred(r); }); };
  var 수동명단 = Array.isArray(D.ieum_members) ? D.ieum_members : null;
  var rows = [];
  /* 내부: 노무사는 늘 넣는다. 수동 명단이 있으면 그것을, 없으면 이음근무 기록이 있는 사람을. */
  users().forEach(function(u){
    var 노무사 = (String(u.title||"") + String(u.role||"")).indexOf("노무사") >= 0;
    var 수동 = 수동명단 && 수동명단.indexOf(u.sid) >= 0;
    var 기록 = !수동명단 && 이음근무있나(function(r){ return r.sid === u.sid && !r.externalId; });
    if(!(노무사 || 수동 || 기록)) return;
    /* ⚠ 현직만 이 줄에 넣는다 — 이알피와 같은 기준(status === "active").
       그만둔 사람은 아래에서 «회색으로» 따로 넣는다. 여기 섞으면 그만둔 노무사가
       현직처럼 보이고, 이음 근무를 배정할 사람 목록에까지 오른다.
       (검사 tests/cal-ieum-same-as-erp.test.js 가 실제로 돌려 본다 — 처음엔 섞여 있었다) */
    if(u.status !== "active") return;
    rows.push({ pk:u.sid, name:u.name||u.sid, kind:"in", roleLabel:"내부 노무사",
      color:colorOf(u.sid) || "#1e40af", note:(D.ieum_notes && D.ieum_notes[u.sid]) || "",
      phone:u.phone||u.contact||"" });
  });
  var 변호사인가 = function(x){ return String(x.role||"").indexOf("변호사") >= 0; };
  살아있는외부.filter(function(x){ return !변호사인가(x); }).forEach(function(x){
    rows.push({ pk:x.id, name:x.name, kind:"ex", roleLabel:"외부 노무사", color:x.color||"#d97706", note:x.note||"", phone:x.contact||"" });
  });
  살아있는외부.filter(변호사인가).forEach(function(x){
    rows.push({ pk:x.id, name:x.name, kind:"law", roleLabel:"변호사", color:x.color||"#16a34a", note:x.note||"", phone:x.contact||"" });
  });
  /* 그만둔 사람 — 기록이 있을 때만, 회색으로 */
  var 이미 = {}; rows.forEach(function(r){ 이미[r.pk] = 1; });
  users().forEach(function(u){
    if(이미[u.sid] || u.status === "active") return;
    if(!이음근무있나(function(r){ return r.sid === u.sid && !r.externalId; })) return;
    rows.push({ pk:u.sid, name:u.name||u.sid, kind:"in", roleLabel:"내부 노무사", color:"#94a3b8", left:true, note:"" });
  });
  ext.filter(function(x){ return x && x.active === false; }).forEach(function(x){
    if(이미[x.id]) return;
    if(!이음근무있나(function(r){ return r.externalId === x.id; })) return;
    rows.push({ pk:x.id, name:x.name, kind:변호사인가(x)?"law":"ex", roleLabel:변호사인가(x)?"변호사":"외부 노무사",
      color:"#94a3b8", left:true, note:x.note||"" });
  });
  return rows;
}

/* 범위 안인가 — 월 / 연 / 전체 */
function inScope(ds){
  if(!ds) return false;
  if(S.scope === "year") return ds.slice(0,4) === S.ym.slice(0,4);
  if(S.scope === "all")  return true;
  return ds.slice(0,7) === S.ym;
}

/* ── 이음센터 · 인원 현황 — 이알피(IeumPeopleTab)와 «똑같은 꼴» ───────────
   대표 지시 2026-09-18 (/goal) 「대시보드 제외한 화면은 똑같이 만들어라」.
   KPI 스트립(이음근무·법률상담·이음강의·활동 인원) + 표(No.·인원·구분·근무 막대·
   잔여·연락처·비고·펼치기)를 이알피와 같은 열·같은 색으로 짓는다.
   ⚠ 한도·비고·강의 기록을 «고치는» 것은 아직 이알피에서 한다 — 그 세 자리는
     표 통째로 담겨 있어 우리 저장 관문(칸별 보내기)이 그대로 못 쓴다. 그래서
     여기서는 값을 «보여만» 주고, 손대면 이알피로 보낸다. 링크 복사처럼 서버에
     아무것도 안 쓰는 것은 바로 된다. */
var ROLE_CHIP = { in:{bg:"#eff6ff",fg:"#2563eb"}, ex:{bg:"#eff6ff",fg:"#2563eb"}, law:{bg:"#fffbeb",fg:"#d97706"} };
function remBadgeHtml(used, cap){
  if(!cap) return '<span style="color:#cbd5e1">—</span>';
  var rem = cap - used, pct = used / cap;
  var bg = pct >= 0.85 ? "#fef2f2" : pct <= 0.4 ? "#f0fdf4" : "#fffbeb";
  var fg = pct >= 0.85 ? "#dc2626" : pct <= 0.4 ? "#16a34a" : "#d97706";
  return '<span style="font-size:11px;font-weight:800;background:' + bg + ';color:' + fg + ';border-radius:5px;padding:2px 8px">' + rem + '</span>';
}
function barCellHtml(used, cap, color){
  if(!cap && !used) return '<span style="color:#cbd5e1">—</span>';
  var pct = cap ? Math.min(100, Math.round(used/cap*100)) : 0;
  var c = (cap && used/cap >= 0.85) ? "#dc2626" : color;
  var head = '<div style="display:flex;align-items:center;gap:7px;min-width:110px">'
    + '<span style="font-size:11.5px;font-weight:700;color:#64748b;white-space:nowrap">'
    + '<b style="color:#1e293b;font-size:12.5px">' + used + '</b>' + (cap ? " / " + cap + "회" : "회") + '</span>';
  var bar = cap ? ('<div style="flex:1;height:7px;border-radius:20px;background:#f8fafc;overflow:hidden;min-width:46px">'
    + '<span style="display:block;height:100%;border-radius:20px;width:' + pct + '%;background:' + c + '"></span></div>') : "";
  return head + bar + '</div>';
}
function ieumKcell(color, label, val, unit, last){
  return '<div class="kcell"' + (last ? ' style="border-right:none"' : '') + '>'
    + '<span class="kdot" style="background:' + color + '"></span>'
    + '<span class="klabel">' + esc(label) + '</span>'
    + '<span class="kval">' + esc(String(val)) + '<small>' + esc(unit) + '</small></span></div>';
}

function peopleHtml(){
  var rows = ieumPeople();
  var att = arr(D.attendance_records);
  var duty = {};
  att.forEach(function(r){
    if(!r || r.type !== "eum-work" || !inScope(r.date)) return;
    var pk = r.externalId || r.sid; if(!pk) return;
    var mm = r.date.slice(0,7), dd = parseInt(r.date.slice(8,10),10);
    if(!duty[pk]) duty[pk] = { total:0, byMonth:{} };
    if(!duty[pk].byMonth[mm]) duty[pk].byMonth[mm] = [];
    duty[pk].byMonth[mm].push(dd); duty[pk].total++;
  });
  Object.keys(duty).forEach(function(pk){ Object.keys(duty[pk].byMonth).forEach(function(mm){ duty[pk].byMonth[mm].sort(function(a,b){return a-b;}); }); });
  var lectures = arr(D.ieum_lectures).filter(function(l){ return l && inScope(l.date); });
  var caps = (S.scope === "year") ? ((D.ieum_caps && D.ieum_caps[S.ym.slice(0,4)]) || {}) : {};
  function capOf(pk, kind){ return (caps[pk] && caps[pk][kind]) || 0; }
  function lecUsed(pk){ return lectures.filter(function(l){ return l.personKey === pk; }).length; }

  var dutyTotal = 0, lawUsedTotal = 0, lawCapTotal = 0, eduUsedTotal = 0, eduCapTotal = 0;
  rows.forEach(function(p){
    var t = (duty[p.pk]||{}).total || 0;
    if(p.kind === "law"){ lawUsedTotal += t; lawCapTotal += capOf(p.pk,"law"); }
    else dutyTotal += t;
    eduUsedTotal += lecUsed(p.pk); eduCapTotal += capOf(p.pk,"edu");
  });
  var visible = S.showLeft ? rows : rows.filter(function(p){ return !p.left; });
  var maxDuty = 1; rows.forEach(function(p){ var t=(duty[p.pk]||{}).total||0; if(t>maxDuty) maxDuty=t; });
  var isYearMode = S.scope === "year";
  var scopeSfx = S.scope === "month" ? "(" + parseInt(S.ym.slice(5,7),10) + "월)" : S.scope === "year" ? "(" + S.ym.slice(0,4) + ")" : "(전체)";
  var 범위말 = S.scope === "year" ? S.ym.slice(0,4) + "년" : S.scope === "all" ? "전체 (" + IEUM_START_YEAR + "~)" : S.ym;
  var 그만둔수 = rows.filter(function(p){ return p.left; }).length;

  var 행들 = visible.map(function(p, idx){
    var d = duty[p.pk] || { total:0, byMonth:{} };
    var isLaw = p.kind === "law";
    var cUsed = isLaw ? (d.total || 0) : 0;
    var cCap = capOf(p.pk,"law");
    var eUsed = lecUsed(p.pk), eCap = capOf(p.pk,"edu");
    var open = S.openRows && S.openRows[p.pk];
    var chip = ROLE_CHIP[p.kind] || ROLE_CHIP.in;
    var dutyPct = Math.round((d.total||0) / maxDuty * 100);
    var 줄 = '<tr class="prow' + (open ? " open" : "") + '" data-toggle="' + esc(p.pk) + '" style="opacity:' + (p.left ? ".55" : "1") + '">'
      + '<td class="no">' + (idx+1) + '</td>'
      + '<td><div class="pname"><span class="avatar" style="background:' + esc(p.color) + '">' + esc(String(p.name||"?").charAt(0)) + '</span>'
      +   '<span class="nm">' + esc(p.name) + '</span>'
      +   (p.left ? '<span class="leftbadge">🚪 ' + (p.kind==="in"?"퇴사":"종료") + '</span>' : "") + '</div></td>'
      + '<td><span class="rolechip" style="background:' + chip.bg + ';color:' + chip.fg + '">' + esc(p.roleLabel) + '</span></td>'
      + '<td>' + ((!isLaw && d.total) ? ('<div class="barwrap"><span class="barnum">' + d.total + '<small>일</small></span>'
          + '<div class="bartrack"><span class="barfill" style="width:' + dutyPct + '%;background:' + p.color + '"></span></div></div>')
          : '<span class="dash">—</span>') + '</td>'
      + '<td>' + (isLaw ? barCellHtml(cUsed, cCap, "#d97706") : '<span class="dash">—</span>') + '</td>'
      + '<td>' + (isLaw ? remBadgeHtml(cUsed, cCap) : '<span class="dash">—</span>') + '</td>'
      + '<td>' + ((eUsed||eCap) ? barCellHtml(eUsed, eCap, "#2563eb") : '<span class="dash">—</span>') + '</td>'

}

  render();
}
function openEdit(store, id){

    date:r.date||"", sid:r.sid||"", type:r.type||"leave", title:r.title||"", note:r.note||"",

}

/* 창에서 무엇을 고쳤는지 그때그때 담아 둔다 — 다시 그려도 안 날아가게 */
function modalRead(){
  var m = S.modal; if(!m) return;
  ["kind","date","sid","type","title","note","hours"].forEach(function(f){
    var el = document.querySelector("[data-m='"+f+"']");
    if(el) m[f] = el.value;
  });
}

function doSave(){
  modalRead();
  var m = S.modal; if(!m || S.busy) return;
  var 일정 = m.kind==="sch";
  var store = 일정 ? "my_schedules" : "attendance_records";
  if(!m.date){ m.err = "날짜를 골라 주세요"; render(); return; }
  if(일정 && !String(m.title||"").trim()){ m.err = "무슨 일인지 적어 주세요"; render(); return; }
  var id = m.mode==="edit" ? m.id : PuCalWrite.newId(일정 ? "sch" : "att");
  var item = { id:id, date:m.date, sid:m.sid, note:String(m.note||"") };
  if(일정) item.title = String(m.title).trim();
  else { item.type = m.type; item.hours = PuWork.hoursOf(m.type, m.hours); }
  /* 고치는 것이면 «내가 보던 판»을 함께 넘긴다 — 바뀐 칸만 보내고,
     원래 있던 달이 잠겼는지도 그것으로 본다. */
  var prev = m.mode==="edit" ? (recOf(store, id) || m.prev) : null;
  S.busy = true; m.err = ""; render();
  PuCalWrite.save(store, item, prev).then(function(r){
    S.busy = false;
    if(!r.ok){ m.err = r.message; render(); return; }
    var 고침 = m.mode==="edit";
    closeModal();
    toast(고침 ? "✅ 고쳤습니다" : "✅ 넣었습니다");
    refreshOne(store);
  });
}

function doDelete(){
  var m = S.modal; if(!m || m.mode!=="edit" || S.busy) return;
  if(!confirm("이 건을 지울까요?")) return;
  var prev = recOf(m.store, m.id) || m.prev;
  S.busy = true; m.err = ""; render();
  PuCalWrite.remove(m.store, m.id, prev).then(function(r){
    S.busy = false;
    if(!r.ok){ m.err = r.message; render(); return; }
    var st = m.store;
    closeModal(); toast("🗑 지웠습니다"); refreshOne(st);
  });
}

/* 바뀐 표 하나만 다시 받는다 — 나머지는 그대로 둔다 */
function refreshOne(store){

}

/* ── 그리기 ────────────────────────────────────────────────────────── */
function renderTabs(){
  var last = '';
  var 탭들 = TABS.map(function(t){
    var head = '';
    if(t.g !== last){ head = (last ? '<span class="tsep"></span>' : '') + '<span class="gl">'+esc(t.g)+'</span>'; last = t.g; }
    /* 이음 쪽은 글자를 파랗게 — 금 하나만으로는 어느 묶음인지 눈이 못 가른다 */
    var eum = t.g === '이음센터' ? ' eum' : '';
    return head + '<button class="tab'+eum+(S.tab===t.v?' on':'')+'" data-t="'+esc(t.v)+'">'+esc(t.label)+'</button>';
  }).join('');
  /* ★ 사람 칩을 탭 줄 «오른쪽 끝»에 얹는다 (대표 지시 2026-09-19 「캡쳐1은 캡쳐2 줄에 넣어라」).
     탭은 왼쪽 절반도 안 쓰는데 칩은 제 줄을 따로 차지하고 있었다 — 한 줄을 통째로 아낀다.
     ⚠ 달력을 보는 탭에서만 얹는다. 직원별 업무·분석에는 «걸러 낼 것»이 없어
       칩이 아무 일도 안 하면서 자리만 먹는다. */
  var 칩 = (S.tab === 'cal' || S.tab === 'eumcal')
    ? '<span class="tabchips">' + chipsHtml(S.tab === 'eumcal') + '</span>' : '';
  $('tabs').innerHTML = 탭들 + 칩;
}

function render(){
  renderTabs();
  var tab = TABS.filter(function(t){ return t.v===S.tab; })[0] || TABS[0];
  var html;
  if(tab.v==='cal' || tab.v==='eumcal'){
    var eumOnly = tab.v==='eumcal';
      /* ⚠ 맨 위 띠를 안 둔다 — 달력은 이알피와 «같아야» 한다(대표 지시 2026-09-18).
         못 고치는 까닭은 «고치려 할 때» 그 자리에서 말한다(창 안에서). */
    html = failedHtml() + lockNote()
      + '<div class="calwrap">' + calheadHtml(eumOnly) + calendarHtml(eumOnly) + '</div>';
  } else if(tab.v==='eumppl'){
    html = failedHtml() + peopleHtml();
  } else if(tab.v==='eumshare'){
    html = failedHtml() + shareHtml();
  } else {
    html = laterHtml(tab);
  }
  html += modalHtml();
  if(S.toast) html += '<div id="toast">' + esc(S.toast) + '</div>';
  $('app').innerHTML = html;
}

/* 누르는 것은 한 자리에서 받는다 — 단추마다 붙이면 다시 그릴 때 하나씩 샌다 */
document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-t],[data-mv],[data-f],[data-erp],[data-close],[data-act],[data-ev],[data-day],[data-scope],[data-left],[data-copy],[data-open],[data-view],[data-toggle]') : null;
  if(!t) return;
  if(t.hasAttribute('data-t')){ S.tab = t.getAttribute('data-t'); if(S.tab==='eumcal') S.filter=null; render(); return; }
  if(t.hasAttribute('data-mv')){
    var mv = +t.getAttribute('data-mv');
    if(mv===0){ S.ym = ymOf(new Date()); S.date = todayYMD(); }
    else if(S.tab==='eumppl' && S.scope==='year'){
      var y=new Date(S.ym+'-01'); y.setFullYear(y.getFullYear()+mv); S.ym = ymOf(y);
    }
    /* 달력에서는 보기에 따라 옮기는 폭이 다르다 — 월은 한 달, 주는 이레, 일은 하루 */
    else if((S.tab==='cal'||S.tab==='eumcal') && S.view!=='month'){
      S.date = shiftDay(S.date, S.view==='week' ? mv*7 : mv);
      S.ym = S.date.slice(0,7);
    }
    else { var d=new Date(S.ym+'-01'); d.setMonth(d.getMonth()+mv); S.ym = ymOf(d); }
    render(); return;
  }
  if(t.hasAttribute('data-gcalretry')){ gcalLoad(true); return; }
  if(t.hasAttribute('data-view')){
    S.view = t.getAttribute('data-view');
    if(!S.date) S.date = todayYMD();
    /* 주·일에서 월로 돌아오면 «보고 있던 날»의 달을 편다 — 엉뚱한 달로 튀지 않게 */
    if(S.view==='month') S.ym = S.date.slice(0,7);
    render(); return;
  }
  if(t.hasAttribute('data-scope')){ S.scope = t.getAttribute('data-scope'); render(); return; }
  if(t.hasAttribute('data-left')){ S.showLeft = !S.showLeft; render(); return; }
  /* 인원 현황 — 행을 누르면 그 사람의 월별 상세를 편다. 연락처·비고 칸 클릭은 걸러 준다 */
  if(t.hasAttribute('data-toggle')){
    var pk = t.getAttribute('data-toggle');
    var n2 = Object.assign({}, S.openRows); n2[pk] = !n2[pk]; S.openRows = n2;
    render(); return;
  }
  if(t.hasAttribute('data-copy')){ copyLink(t.getAttribute('data-copy')); return; }
  if(t.hasAttribute('data-open')){ window.open(t.getAttribute('data-open'), '_blank', 'noopener'); return; }
  if(t.hasAttribute('data-f')){ modalRead(); var f=t.getAttribute('data-f'); S.filter = f || null; render(); return; }
  if(t.hasAttribute('data-erp')){ goErp(t.getAttribute('data-erp')); return; }
  if(t.hasAttribute('data-close')){ closeModal(); return; }
  if(t.hasAttribute('data-act')){
    if(t.getAttribute('data-act')==='save') doSave(); else doDelete();
    return;
  }
  /* 일을 누르면 그 건을 연다. 칸의 빈 자리를 누르면 새로 넣는다.
     ⚠ 일 쪽을 «먼저» 본다 — 일은 칸 «안»에 있어 칸도 함께 걸린다. */
  if(t.hasAttribute('data-ev')){
    var ev = t.getAttribute('data-ev').split(':');
    /* 구글에서 온 일정은 «구글에서» 고친다 — 우리가 손대면 두 곳이 갈린다.
       ⚠ 열쇠로 읽기만 하는 길이라 우리에겐 고칠 권한이 아예 없다. */
    if(ev[0] === 'gcal'){ openGcal(ev.slice(1).join(':')); return; }
    openEdit(ev[0], ev.slice(1).join(':'));
    return;
  }
  if(t.hasAttribute('data-day')){ openNew(t.getAttribute('data-day')); return; }
});

/* 링크 복사 — 못 하는 자리(https 아님·권한 거절)에서는 «됐다»고 하지 않는다.
   「복사됐습니다」는 말만 뜨고 실제로는 안 붙는 것이 가장 나쁘다. */
function copyLink(url){
  function 실패(){ toast('복사가 안 됩니다 — 링크를 길게 눌러 직접 복사해 주세요'); }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ toast('📋 링크를 복사했습니다'); }, 실패);
      return;
    }
  }catch(e){}
  실패();
}

/* 이알피로 — 창은 «하나»만 쓴다(새 탭을 자꾸 만들지 않는다) */
function goErp(menu){
  var url = 'pu-erp.html?sso=1' + (menu ? '#menu='+encodeURIComponent(menu) : '');
  try { if(window.PuAppBar && PuAppBar.goApp){ PuAppBar.goApp(url, 'erp'); return; } } catch(e){}
  location.href = url;
}
/* 유형을 시간연차로 바꾸면 «몇 시간» 칸이 생긴다 — 바뀔 때 다시 그린다.
   ⚠ 다시 그리기 전에 지금 적힌 것을 먼저 담는다(안 그러면 적던 것이 날아간다). */
/* 일정 검색 — 치는 대로 거른다.
   ⚠ 다시 그리면 칸이 새로 생겨 «적던 글자와 커서»를 잃는다. 그래서 그린 뒤
     그 칸에 값을 도로 넣고 커서를 끝으로 돌려 준다. 안 그러면 한 글자마다 칸이 튄다. */
document.addEventListener('input', function(e){
  if(!e.target || e.target.id !== 'calq') return;
  S.q = e.target.value;
  render();
  var el = document.getElementById('calq');
  if(el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(_){} }
});

document.addEventListener('change', function(e){
  if(!S.modal || !e.target || !e.target.hasAttribute || !e.target.hasAttribute('data-m')) return;
  var f = e.target.getAttribute('data-m');
  if(f !== 'type' && f !== 'kind') return;
  modalRead(); render();
});
/* ESC 로 창을 닫는다 — 뒤로가기 층과 다투지 않게 여기서만 받는다 */
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && S.modal){ e.preventDefault(); closeModal(); }
});

$('goErp').onclick = function(){ goErp(''); };
$('logout').onclick = function(){ try{ firebase.auth().signOut(); }catch(e){} };

/* ── 시작 ──────────────────────────────────────────────────────────── */
function setConn(on, text){
  var c = $('conn');
  c.innerHTML = '<span class="dot'+(on?' on':'')+'"></span><span class="t">'+esc(text)+'</span>';
}

function start(user){
  PuCalRead.attach(fbDb);
  /* 저장 관문이 봐야 할 셋을 넘긴다 —
     ① 어느 달이 마감됐나 ② 그 표가 아직 배열인가 ③ 누가 고쳤나 */
  PuCalWrite.attach(fbDb, {
    lockedMonths: function(){ return arr(D.locked_attend_months); },
    formOf: function(k){ return PuCalRead.rawForm(k); },
    who: function(){ return (ME && ME.name) || (ME && ME.sid) || ''; }
  });
  S.ym = ymOf(new Date()); S.date = todayYMD();
  setConn(true, '연결됨');
  PuCalRead.readMany(KEYS).then(function(r){
    D = r.data; FAILED = r.failed;
    ME = (function(){
      var us = users();
      for(var i=0;i<us.length;i++){ if(us[i].uid===user.uid || us[i].email===user.email) return us[i]; }
      return null;
    })();
    $('me').innerHTML = ME ? esc(ME.name||'') + '<span class="role">'+esc(ME.role||ME.position||'')+'</span>'
                           : '<span class="role">'+esc(user.email||'')+'</span>';
    render();
    /* 구글 달력도 받는다 — 이 달력을 채우는 것이 그쪽이다(9월 126건).
       ⚠ 우리 자료를 먼저 그리고 그 다음 받는다 — 구글이 늦어도 화면은 먼저 뜬다. */
    gcalLoad();
    /* 바뀐 한 건만 받아 다시 그린다 — 큰 표를 통째로 다시 받지 않는다 */
    ['attendance_records','my_schedules'].forEach(function(k){
      S.unwatch.push(PuCalRead.watch(k, function(){
        PuCalRead.readOnce(k).then(function(v){ D[k]=v; render(); }).catch(function(){});
      }));
    });
  }).catch(function(e){
    $('app').innerHTML = '<div class="panel"><h2 style="color:#dc2626">자료를 못 읽었습니다</h2>'
      + '<p class="muted">'+esc(e && e.message || e)+'</p>'
      + '<button class="btn" data-erp="dash/corp">푸른이알피에서 보기</button></div>';
  });
}

try{
  firebase.initializeApp(FB_CONFIG);
  fbDb = firebase.database();
  firebase.auth().onAuthStateChanged(function(u){
    if(u) start(u); else PuGate.show();
  });
}catch(e){
  $('app').innerHTML = '<div class="panel muted">초기화 실패: '+esc(e.message)+'</div>';
}
</script>
