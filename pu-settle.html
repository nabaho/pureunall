<title>푸른노무법인 컨설팅정산</title>
<!-- ═══════════════════════════════════════════════════════
     푸른노무법인 컨설팅정산 (pu-settle.html) — 2026-10-31
     대표 지시 「내부관리에 컨설팅정산 항목을 만들고 프로그램 만들어달라 … 개인입금되는 것들 중 개별정산이 필요한 것은 프로그램에서 정리」
     설계: docs/superpowers/specs/2026-10-31-consult-settle-design.md · 계획: docs/superpowers/plans/2026-10-31-consult-settle-app.md

     ★ 하는 일: 운영기관이 보낸 «비용지급 안내» 엑셀을 읽어, 사업장마다 주관(대표)과 담당노무사 사이의 지급월 정산표를 만든다
       (사업장 세후 합계 × 담당 요율 = 담당 몫, 차액 양방향). 확정하면 송금 목록과 담당노무사별 카톡 문구가 나온다.
     ★ 쓰는 자리(관문 강제 모드, PROGRAMS.settle.writeContracts): settle/rules · links · notices · runs · adjusts
     ★ 읽기만: data/user_dir(이름) · data/user_accounts(재직 판정 — 고르는 목록은 재직자만) · data/biz_cons_types(사업 이름) · data/consultings(업체 연결 후보 — 2026년만) · uid_roles(권한·사번)
       · data/ledger_batches(입금 대조 «재무관리에서 당겨오기» — 재무권한이 있어야 읽힌다)
     ★ 입금 대조(대표 지시 2026-10-31 「개개인에게 입금된 금액을 비교 … 복사 붙여넣기 … 당겨오기」): 통장 거래내역을 붙여 넣거나
       재무관리에서 당겨와 사람별 예상 세후와 맞춘다. 금액이 같아도 «저장»을 눌러야 통장 실입금이 된다.
     ★ 임시저장(대표 지시 2026-10-31 「임시저장기능 만들어 달라」): 확정 전 정산표(draft = «임시저장»)의 통장 실입금은 쳐도 바로 저장하지 않고
       노란 칸으로 두었다가 «임시저장 (n)» 한 번에 저장한다. 저장 안 한 칸이 있으면 확정·기록만을 막고, 창을 닫을 때 묻는다.
     ★ 연도별 관리(대표 지시 2026-10-31 「매년 관리할 수 있게 해라」): 맨 위 «‹ 해 ›»로 그 해 정산표·안내 파일·카톡 문구만 보고, «한 해 합계» 탭에 그 해 사람별·달마다 합계.
       요율표·이월·조정은 해와 상관없이 하나다.
     ★ 실수령액 → 세전 역계산(대표 지시 2026-10-31 「3.3 8.8 퍼로 역계산」): 설정 › 계산기 위 상자 · 직접 입력의 «실수령액» 칸 · 계산기 줄(세전을 비우면).
       세율은 사람·줄마다 3.3%(사업소득) / 8.8%(기타소득), 컨설팅마다 기본값(규칙 «자세히»).
     ★ 직접 입력(대표 선택 2026-10-31): 안내 엑셀이 없는 컨설팅(예: 산업일자리전환 능률협회)은 «📥 자료 넣기»의 «✍️ 직접 입력»으로 사업장·지급월·세전을 넣는다
       → settle/notices/M_<종류>(source 'manual')에 쌓고 정산표는 같은 길로 만든다.
     ★ 월별 화면(대표 지시 2026-11-07 「정산표나 카톡문구를 월별 년도별관리 … ui 너무 불편하다 쉽고 직관적으로」 → 목업 「이대로 만들기」):
       탭은 «월별 정산 · 한 해 합계 · 설정» 셋. 월별 정산은 해 넘기기 + 열두 달 줄(할 일 점) + 고른 달의 ① 입금 확인 ② 정산 확인 ③ 카톡 보내기.
       ① 입금 확인은 재무관리 거래내역을 «읽기만» 해서 그 달 임시저장 정산표들의 주관 몫과 자동으로 맞춘다(같은 금액만 미리 ☐, 저장은 «체크한 줄 저장»).
       ③ «n개 정산표 확정하고 카톡 보내기»는 확인 창 한 번 뒤에 확정 → (대표면) 카톡 대기열. 보낸 카톡은 되돌릴 수 없다는 말을 확인 창에 넣는다.
     ⚠ 대표·위임관리인·재무권한자만 연다(규칙 settle = 같은 사람) — 대표 선택 2026-10-31. 타일 감춤은 화면일 뿐, 진짜 잠금은 규칙이다.
     ⚠ 업체·사람은 «사람이 한 번 확정한 연결»로만 ID 를 붙인다 — 이름이 비슷해도 저절로 잇지 않는다(온톨로지 규칙).
     ⚠ 확정된 달은 새 안내가 와도 덮지 않는다 — «바뀜»만 표시한다. 돈 기록은 지우지 않는다(_deleted 표식).
     ═══════════════════════════════════════════════════════ -->
<style>
:root{
  --ink:#1e293b; --ink2:#475569; --mute:#64748b; --line:#e2e8f0; --line2:#cbd5e1; --bg:#f8fafc; --card:#ffffff;
  --blue:#2563eb; --blue-d:#1e40af; --blue-bg:#eff6ff; --blue-line:#bfdbfe;
  --green:#166534; --green-m:#16a34a; --green-bg:#f0fdf4; --green-line:#bbf7d0;
  --amber:#854d0e; --amber-m:#d97706; --amber-bg:#fffbeb; --amber-line:#fde68a;
  --red:#991b1b; --red-bg:#fef2f2; --red-line:#fecaca;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 11px;line-height:1.3;white-space:nowrap}
button:hover{border-color:var(--mute)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--blue);border-color:var(--blue);color:#ffffff}
button.sm{padding:3px 9px;font-size:12px}
input,select,textarea{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line2);border-radius:7px;background:var(--card);color:var(--ink)}
textarea{width:100%;resize:vertical;font-family:inherit}
@media (max-width:768px){ input,select,textarea{font-size:16px} }
a{color:var(--blue-d);text-decoration:none}
#head{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:9px 16px;flex-wrap:wrap}
.top h1{font-size:17px;margin:0}
.top .sub{font-size:12px;color:var(--mute)}
.sp{flex:1}
#who{font-size:13px;color:var(--mute)}
.tabs{display:flex;gap:4px;padding:0 16px;flex-wrap:wrap;align-items:center}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mute);padding:8px 12px}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--blue)}
.chip{display:inline-block;min-width:18px;text-align:center;border-radius:9px;padding:0 6px;font-size:11px;background:var(--blue-bg);color:var(--blue-d);border:1px solid var(--blue-line)}
main{padding:12px 16px 40px}
.pane{display:none}
.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:8px 10px}
.scroll{overflow:auto}
.t{border-collapse:collapse;width:100%}
.t th,.t td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.t th{background:var(--bg);color:var(--ink2);font-size:12px;position:sticky;top:0}
.t td.ti{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.t td.nw{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.t .c{width:34px;text-align:center}
.t .n{width:44px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.t .r{text-align:right;font-variant-numeric:tabular-nums}
.t .b{font-weight:700}
.t tr.grp td{background:var(--blue-bg);color:var(--blue-d);font-weight:700;max-width:none;overflow:hidden;text-overflow:ellipsis}
.t input.amt{width:110px;text-align:right}
.t input.pct{width:70px;text-align:right}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11.5px;border:1px solid var(--line2);background:var(--bg);color:var(--ink2)}
.st-confirmed{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}
.st-draft,.st-chg{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.ck{display:inline-flex;gap:3px;align-items:center;font-size:12px;white-space:nowrap}
.bulk{display:none;gap:6px;align-items:center;padding:6px 12px;background:var(--blue-bg);border-bottom:1px solid var(--blue-line);font-size:12.5px}
.bulk.on{display:flex}
.empty{padding:28px;text-align:center;color:var(--mute)}
.hint{font-size:12px;color:var(--mute)}
.sec{padding:10px 14px 2px;font-weight:700;color:var(--ink2)}
.warn{margin:8px 10px;padding:8px 10px;border-radius:8px;background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber);font-size:12.5px}
.bad{color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:12px;color:var(--mute)}
.kpi b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.bad b{color:var(--red)}
.fr{display:flex;gap:10px;padding:7px 14px;align-items:center}
.fr>label{width:110px;flex:none;color:var(--ink2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv{flex:1;min-width:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fv input[type=text]{flex:1;min-width:0}
.drop{border:2px dashed var(--line2);border-radius:10px;padding:18px;text-align:center;color:var(--ink2);margin:10px}
.drop.on{border-color:var(--blue);background:var(--blue-bg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
/* 규칙·요율 — 칸이 내용만큼만 차지하게(대표 지시 2026-10-31 「불필요하게 화면을 넓게 많이 사용한다」) */
#sub-rules{max-width:920px}
.t.mx{width:auto}
.t.mx th,.t.mx td{padding:5px 8px}
.t.mx th.mxc{text-align:center}
.t.mx td.mxc{text-align:center}
.t.mx td.ti{max-width:140px}
.t.mx tr.cfg td{background:var(--bg);color:var(--ink2)}
.t.mx select{max-width:130px}
.t.mx input.pct{width:64px}
#sub-rules .fr>label{width:64px}
#sub-rules .fv input[type=text]{max-width:460px}
#sub-rules .t.sr{width:auto}
#sub-rules .t select{max-width:200px}
#sub-rules .t[data-name=adjusts] td.nw{max-width:170px}
#sub-rules .t[data-name=adjusts] input.amt{width:100px}
#sub-rules .t[data-name=adjusts] #a_memo{width:140px}
/* 정산표 뜻 풀이 줄 */
.bar.legend{gap:5px;padding-top:2px;padding-bottom:2px}
/* 월별 정산(대표 지시 2026-11-07 「월별 년도별관리 … ui 너무 불편하다 쉽고 직관적으로」) — 해 넘기기 · 열두 달 줄 · 고른 달의 ①②③ 단계 */
#pane-month,#pane-year{max-width:1200px}
.yearbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;max-width:1200px}
.yearbar #yearPick{font-size:16px;font-weight:700;border:none;background:none;padding:2px 4px}
.mstrip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.mo{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;font-size:12.5px;border-radius:8px}
.mo.on{border:2px solid var(--blue);font-weight:700;padding:6px 1px}
.mo.mo-none{color:var(--mute)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line2)}
.mo-todo .dot,.dot.dot-todo{background:var(--amber-m)}
.mo-done .dot,.dot.dot-done{background:var(--green-m)}
.mleg{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:5px 2px 12px}
.mleg .dot{margin-left:8px}
.mleg .dot:first-child{margin-left:0}
.mhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 2px 8px}
.mhead b{font-size:16px}
.stephd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px}
.stephd .num{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--blue-bg);color:var(--blue-d);border:1px solid var(--blue-line)}
.mrun{border-top:1px solid var(--line)}
.mrun-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px}
.mrun-h b{max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrun.on>.mrun-h{background:var(--blue-bg)}
.mtr{padding:0 12px 8px}
.mtr-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0}
.mtr-r .amt{font-variant-numeric:tabular-nums}
.mtr-r .co{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mdet{border-top:1px dashed var(--line2)}
.kcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;padding:0 12px 12px}
.kcard{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.kh,.kst,.kroom{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.kh .hint{max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kroom input{flex:1 1 180px;min-width:0}
.msg{background:var(--bg);border-radius:8px;padding:9px 11px;font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-all}
details.why>summary{cursor:pointer;font-size:12px;color:var(--mute);padding:6px 2px}
#inbox{display:none}
#inbox.on{display:block}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.subtabs button.on{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue-d);font-weight:700}
.sub{display:none}
.sub.on{display:block}
/* 정산표 — 임시저장 안 한 칸은 노랗게(대표 지시 2026-10-31 「임시저장기능 … 깔끔하게 볼수 있게」) */
.t input.amt[data-m]{width:118px}
/* 정산표 — 사업장마다 상자 하나(사람별 금액 + 송금 줄). 폰에서는 상자 한 겹(옆 테두리 걷음) */
.site{border:1px solid var(--line);border-radius:10px;margin:10px;overflow:hidden;background:var(--card)}
.site .sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--blue-bg);color:var(--blue-d)}
.site .sh b{max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site .t.tr1 td{background:var(--bg);border-bottom:0}
.site .trow{padding:8px 12px;background:var(--bg)}

.kqline{padding-top:0}
.t input.room{width:300px}
.pill.dir-back{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.pill.dir-more{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}

details.rd>summary{cursor:pointer;padding:10px 14px}
details.dep{margin:12px 10px 4px}
details.dep>summary{cursor:pointer;padding:10px 14px}

.cardp{padding:4px 10px 10px}

   표는 줄마다 «두 줄 카드» — ☐·번호는 왼쪽 끝 고정, 1줄 이름·핵심 금액, 2줄 나머지(칸 이름을 앞에 붙인다). 칸 손잡이는 js/pu-settle-view.js 의 data-k. */

/* 재직자 고르기 — 이알피 getActiveUsers 와 같은 잣대(대표 지시 2026-10-31 「사람은 현재 푸른노무법인에 재직중인 사람만」):
   전체 직원계정(user_accounts, 재무권한이 읽는다)의 status==='active' → 못 읽으면 공개 명부(user_dir)의 active(또는 status 없음).
   ⚠ 이름표(NAMES)는 재직·퇴직 모두 — 지난 정산표·요율에 남은 사람도 이름으로 보이게. 고르는 목록(ERP.people)만 재직자. */
function activeStaff(accounts, dir){
  var act=(accounts||[]).filter(function(u){ return u && u.sid && u.name && u.status==='active'; });
  /* 공개 명부로 물러설 때도 «재직 표시가 있는 사람»만 — 표시가 빈 옛 줄이 섞여 퇴사자가 나오던 것(대표 지적 2026-10-31 「여전히 기존사람 다나온다」).
     명부 전체에 재직 표시가 하나도 없을 때만 빈 표시를 받아 준다(아무도 못 고르는 화면을 막는다). */
  if(!act.length) act=(dir||[]).filter(function(u){ return u && u.sid && u.name && u.status==='active'; });
  if(!act.length) act=(dir||[]).filter(function(u){ return u && u.sid && u.name && !u.status; });
  var seen={}, out=[];
  act.forEach(function(u){ var s=String(u.sid); if(!seen[s]){ seen[s]=1; out.push({ sid:s, name:String(u.name) }); } });
  return out.sort(function(a,b){ return a.name<b.name?-1:a.name>b.name?1:0; });
}
async function loadErp(){
  var r=await Promise.all(['data/user_dir','data/biz_cons_types','data/consultings','data/user_accounts'].map(function(p){ return fbDb.ref(p).once('value').catch(function(){ return { val:function(){ return null; } }; }); }));
  var dir=unwrap(r[0].val()), accts=unwrap(r[3].val());
  NAMES={};
  dir.concat(accts).forEach(function(u){ if(u && u.sid && u.name && !NAMES[u.sid]) NAMES[u.sid]=String(u.name); });
  ERP.people=activeStaff(accts, dir);
  ERP.biz=unwrap(r[1].val()).filter(function(b){ return b && b.code && !b.hidden && !b.mergedInto; })
    .sort(function(a,b){ return (Number(a.sortOrder)||999)-(Number(b.sortOrder)||999); })
    .map(function(b){ return { code:String(b.code), name:String(b.name||b.code)+(b.agency?' ('+b.agency+')':'') }; });
  ERP.consultings=unwrap(r[2].val()).filter(function(c){ return c && c.id && !c._deleted; });
}
async function reload(){
  try{
    var r=await Promise.all(['rules','links','notices','runs','adjusts','rooms','kakaoQueue','agent'].map(function(k){ return fbDb.ref('settle/'+k).once('value'); }));
    D.rules=r[0].val()||{}; var lk=r[1].val()||{}; D.links={ company:lk.company||{}, person:lk.person||{} };
    D.notices=r[2].val()||{}; D.runs=r[3].val()||{}; D.adjusts=r[4].val()||{};
    D.rooms=r[5].val()||{}; D.kq=r[6].val()||{}; D.agent=r[7].val()||null;
    draw();
  }catch(e){ toast('불러오지 못했습니다: '+errMsg(e)); }
}
function typeOf(c){ return String(c.typeCode||(c.typeCodes&&c.typeCodes.consulting)||''); }
/* 업체 연결 후보 — 그 사업 종류 + 수행기간이 2026년에 걸친 컨설팅만 */
function sitesFor(typeCode){
  return ERP.consultings.filter(function(c){
    return (!typeCode || typeOf(c)===typeCode) && String(c.startDate||'')<=yearTo() && String(c.endDate||'9999-12-31')>=yearFrom();
  }).map(function(c){ return { consultingId:String(c.id), companyId:String(c.companyId||''), companyName:String(c.companyName||''),
    label:String(c.companyName||'(업체 이름 없음)')+(c.no?' · '+c.no:'')+(c.startDate?' · '+c.startDate+'~'+(c.endDate||''):'') }; });
}
function siteNames(){ var o={}; ERP.consultings.forEach(function(c){ o[c.id]=String(c.companyName||''); }); return o; }
function bizName(code){ var r=D.rules[code]; if(r&&r.title) return r.title; var b=ERP.biz.filter(function(x){ return x.code===code; })[0]; return b?b.name:code; }
function bizNames(){ var o={}; ERP.biz.forEach(function(b){ o[b.code]=bizName(b.code); }); Object.keys(D.rules).forEach(function(k){ o[k]=bizName(k); }); return o; }

/* ═══ 계산 ═══ */
function ruleObj(r){
  var rates={}, siteRates={};
  Object.keys(r.rates||{}).forEach(function(s){ rates[s]=Number(r.rates[s]); });
  Object.keys(r.siteRates||{}).forEach(function(cid){ siteRates[cid]={}; Object.keys(r.siteRates[cid]||{}).forEach(function(s){ siteRates[cid][s]=Number(r.siteRates[cid][s]); }); });
  return { typeCode:r.typeCode, title:r.title||bizName(r.typeCode), mode:'pool', tax:C.taxOf(r.tax), leadSid:r.leadSid||'', rates:rates, siteRates:siteRates, msgHead:r.msgHead||'', msgFoot:r.msgFoot||'' };
}
function ctxFor(rid, actuals){
  var cl={}, pl={};
  Object.keys(D.links.company).forEach(function(k){ var l=D.links.company[k]; if(l && !l._deleted && l.consultingId) cl[k]={ consultingId:l.consultingId, companyId:l.companyId||'' }; });
  Object.keys(D.links.person).forEach(function(k){ var l=D.links.person[k]; if(l && !l._deleted && l.sid) pl[k]=l.sid; });
  var adjusts=vals(D.adjusts).filter(function(a){ return !a.appliedRunId || a.appliedRunId===rid; });
  return { companyLinks:cl, personLinks:pl, actuals:actuals||{}, adjusts:adjusts, names:NAMES };
}
function compute(notice, monthKey, rule, rid, actuals){ return C.settleMonth(notice, monthKey, ruleObj(rule), ctxFor(rid, actuals)); }
function monthLabel(notice, key){ var m=notice.months.filter(function(x){ return x.key===key; })[0]; return key.slice(0,4)+'년 '+(m?m.label:key.slice(5)+'월'); }

/* ═══ 그리기 ═══ */
function draw(){ drawTabs(); drawCalc(); drawMonth(); drawYear(); drawRules(); drawRooms(); }
/* ═══ 계산기 ═══ (대표 지시 2026-10-31 「컨설팅종류, 사업장 수행자 요율 등 각각 선택하게 하고 그부분만 반영하게 간단하게」) */
function loadCalc(){ try{ var v=JSON.parse(lsGet('calc')||'null'); if(v && Array.isArray(v.rows)) return v; }catch(e){} return calcDefault(); }
function saveCalc(){ lsSet('calc', JSON.stringify(CALC)); }
function calcRows(){ return CALC.rows.map(function(r){
  var pre=r.pre; if((pre==null || String(pre).trim()==='') && C.won(r.actual)>0) pre=C.preFromNet(r.actual, r.tax).pre;   /* 세전을 비우면 실입금에서 거꾸로 */
  return { sid:r.sid||'', name:NAMES[r.sid]||'', role:r.role, tax:r.tax, pre:pre, rate:r.rate, actual:r.actual }; }); }
function drawCalc(){
  $('revBox').innerHTML=V.revBox(REV);
  $('calcBox').innerHTML=V.calcBox(CALC, { bizList:ERP.biz, sites:CALC.type?sitesFor(CALC.type):[], staff:ERP.people, names:NAMES, sel:SEL.calc });
  drawCalcOut(); drawBulks();
}
function drawCalcOut(){ $('calcOut').innerHTML=V.calcResult(C.calcSite(calcRows()), NAMES); }
/* 고른 컨설팅 종류에 저장된 규칙이 있으면 주관·요율을 «빈 칸에만» 먼저 채운다(고칠 수 있다) */
function calcPrefill(){
  var rule=CALC.type && D.rules[CALC.type]; if(!rule) return;
  CALC.rows.forEach(function(r){
    if(r.role==='lead' && !r.sid && rule.leadSid) r.sid=rule.leadSid;
    if(r.role==='staff' && r.sid && (r.rate==null || r.rate==='')){
      var cr=rule.rates && rule.rates[r.sid]!=null ? rule.rates[r.sid] : C.existingRate(D.rules, r.sid, CALC.type);   /* 그 컨설팅에 없으면 기존 % */
      if(cr!=null) r.rate=String(cr);
    }
    if(!r.tax) r.tax=C.taxOf(rule.tax);
  });
}
function drawTabs(){
  [].forEach.call(document.querySelectorAll('#tabs button'), function(b){ b.className=b.getAttribute('data-tab')===TAB?'on':''; });
  ['month','year','setup'].forEach(function(t){ $('pane-'+t).className='pane'+(t===TAB?' on':''); });
  [].forEach.call(document.querySelectorAll('#subtabs button'), function(b){ b.className=b.getAttribute('data-sub')===SUB?'on':''; });
  ['rules','kakao','calc'].forEach(function(s){ $('sub-'+s).className='sub'+(s===SUB?' on':''); });
  $('yearBar').style.display=TAB==='setup'?'none':'';
  $('inboxBtn').style.display=TAB==='month'?'':'none';
  $('yearPick').innerHTML=yearOptions().map(function(y){ return '<option value="'+y+'"'+(y===YEAR?' selected':'')+'>'+y+'년</option>'; }).join('');
}
function runsList(){ return vals(D.runs).map(C.normalizeRun); }
function yearRuns(){ return runsList().filter(function(r){ return C.yearOf(r.monthKey)===YEAR; }); }
/* 고를 수 있는 해 — 자료가 있는 해 + 올해 + 내년 */
function yearOptions(){
  var o={}; o[nowYear()]=1; o[String(Number(nowYear())+1)]=1; o[YEAR]=1;
  vals(D.runs).forEach(function(r){ var y=C.yearOf(r.monthKey); if(y) o[y]=1; });
  vals(D.notices).forEach(function(n){ C.toArr(n.months).forEach(function(m){ if(m && m.key) o[C.yearOf(m.key)]=1; }); });
  return Object.keys(o).filter(function(y){ return /^\d{4}$/.test(y); }).sort().reverse();
}
function noticeInYear(n){
  var ms=C.toArr(n.months).filter(Boolean);
  return ms.length ? ms.some(function(m){ return C.yearOf(m.key)===YEAR; }) : new Date(Number(n.receivedAt||0)+9*3600e3).toISOString().slice(0,4)===YEAR;
}
function ruleTypes(){ return Object.keys(D.rules).filter(function(k){ return D.rules[k] && !D.rules[k]._deleted; }); }
/* ═══ 월별 정산 — 대표 지시 2026-11-07 「정산표나 카톡문구를 월별 년도별관리 … ui 너무 불편하다 쉽고 직관적으로」 → 목업 「이대로 만들기」 ═══
   열두 달 줄에서 달을 고르면 그 달 정산표들의 ① 입금 확인 ② 정산 확인 ③ 카톡 보내기가 한 화면에 이어진다 */
function monthRunsOf(key){ return yearRuns().filter(function(r){ return r.monthKey===key; }).sort(function(a,b){ var x=bizName(a.typeCode), y=bizName(b.typeCode); return x<y?-1:x>y?1:0; }); }
function monthInfo(){ var by={}, o={}; yearRuns().forEach(function(r){ (by[r.monthKey]=by[r.monthKey]||[]).push(r); }); Object.keys(by).forEach(function(k){ o[k]=C.monthState(by[k]); }); return o; }
/* 고른 달 — 기억한 달이 그 해면 그대로, 아니면 할 일이 남은 가장 최근 달 → 정산표가 있는 가장 최근 달 → 올해면 이번 달, 아니면 1월 */
function pickMonth(){
  if(/^\d{4}-\d{2}$/.test(CUR_MONTH) && C.yearOf(CUR_MONTH)===YEAR) return CUR_MONTH;
  var info=monthInfo(), ks=Object.keys(info).sort().reverse(), k=ks.filter(function(x){ return info[x].state==='todo'; })[0]||ks[0];
  if(k) return k;
  var m=nowMonth(); return m.slice(0,4)===YEAR?m:YEAR+'-01';
}
function drawMonth(){
  CUR_MONTH=pickMonth();
  var runs=monthRunsOf(CUR_MONTH), biz=bizNames();
  $('monthStrip').innerHTML=V.monthStrip(YEAR, monthInfo(), CUR_MONTH);
  $('inbox').className='card'+(INBOX.open||MANUAL.open?' on':'');
  $('manualBox').innerHTML=MANUAL.open?V.manualBox(MANUAL, manualOpt()):'';
  drawNotices();
  $('monthHead').innerHTML='<b>'+YEAR+'년 '+Number(CUR_MONTH.slice(5))+'월</b><span class="hint">'+(runs.length
    ? '정산표 '+runs.length+'개 · '+V.esc(runs.map(function(r){ return biz[r.typeCode]||r.typeCode; }).join(' · '))
    : '정산표가 없습니다 — 위 «📥 자료 넣기»로 비용지급 안내를 올리거나 직접 입력하세요')+'</span>';
  ['step1','step2','step3'].forEach(function(id){ $(id).style.display=runs.length?'':'none'; });
  if(runs.length){
    drawAuto(runs);
    var cur=CUR_RUN && runs.some(function(r){ return r.id===CUR_RUN; }) ? C.normalizeRun(D.runs[CUR_RUN]) : null;
    $('step2').innerHTML=V.monthRuns(runs, { names:NAMES, biz:biz, cur:cur?cur.id:'', detail:cur
      ? V.runDetail(cur, NAMES, Object.assign({}, SEL.members, SEL.transfers), { biz:bizName(cur.typeCode), pend:cur.status==='draft'?(PEND[cur.id]||{}):{} })+(cur.status==='draft'?V.depositBox(depState(cur)):'') : '' });
    drawSend(runs);
  }
  drawBulks();
}
/* ① 입금 확인 — 그 달에 임시저장 정산표가 있으면 재무관리 거래내역을 (한 번) 읽어 주관 몫과 맞춘다 */
function leadMap(){ var o={}; ruleTypes().forEach(function(k){ if(D.rules[k].leadSid) o[k]=String(D.rules[k].leadSid); }); return o; }
function autoFound(){
  if(AUTO.src==='paste') return AUTO.pasted;
  if(!AUTO.batches) return [];
  var w=C.depositWindow(CUR_MONTH); return C.ledgerDeposits(AUTO.batches, w.from, w.to);
}
function drawAuto(runs){
  var drafts=runs.filter(function(r){ return r.status==='draft'; });
  $('step1').style.display=drafts.length?'':'none';
  if(!drafts.length) return;
  if(AUTO.src==='ledger' && !AUTO.batches && !AUTO.loading && !AUTO.err) loadLedger();
  var lead=leadMap(), found=autoFound(), rev=C.reviewMonth(drafts, lead, found);
  /* 고른 달·읽은 자료·넣은 실입금이 바뀌면 «후보»를 다시 고른다 — 같은 금액만 미리 ☐, 저장은 단추로만 */
  var sig=CUR_MONTH+'|'+AUTO.src+'|'+AUTO.at+'|'+rev.rows.map(function(r){ return r.id+(r.kind==='saved'?'+':''); }).join(',');
  if(AUTO.primed!==sig){
    AUTO.primed=sig; AUTO.pick={}; SEL.auto={};
    rev.rows.forEach(function(r){ if(r.found){ AUTO.pick[r.id]=r.found.id; if(r.kind==='exact') SEL.auto[r.id]=1; } });
  }
  $('step1').innerHTML=V.reviewBox(rev, { biz:bizNames(), found:found, sel:SEL.auto, pick:AUTO.pick, leadName:NAMES[lead[drafts[0].typeCode]]||'',
    src:AUTO.src, at:AUTO.at, err:AUTO.err, loading:AUTO.loading, win:C.depositWindow(CUR_MONTH), text:AUTO.text, pasteOpen:AUTO.pasteOpen });
}
/* 재무관리 거래내역 읽기 — 읽기만(쓰지 않는다). 한 번 읽어 두고 «다시 읽기»로만 다시 읽는다. 권한이 없으면 붙여넣기로 */
async function loadLedger(){
  AUTO.loading=true; AUTO.err='';
  try{ AUTO.batches=unwrap((await fbDb.ref('data/ledger_batches').once('value')).val()); AUTO.at=Date.now(); }
  catch(e){ AUTO.batches=null; AUTO.err='재무관리 거래내역을 읽지 못했습니다 — 재무관리 권한이 필요합니다. 아래 «통장 글 붙여넣기»로도 맞출 수 있습니다'; }
  AUTO.loading=false; drawMonth();
}
/* «체크한 줄 저장» — 고른 입금 금액을 정산표마다 통장 실입금으로 한 번에 넣고 다시 계산(임시저장인 정산표만) */
async function saveAuto(){
  var byId={}, by={}, n=0, done=0;
  autoFound().forEach(function(f){ byId[f.id]=f; });
  Object.keys(SEL.auto).forEach(function(id){ var f=byId[AUTO.pick[id]], cut=id.indexOf('::'); if(!f || cut<0) return;
    var rid=id.slice(0,cut); (by[rid]=by[rid]||{})[id.slice(cut+2)]=f.amount; n++; });
  if(!n){ toast('저장할 줄을 고르세요(☐ 와 «찾은 입금»)'); return; }
  var rids=Object.keys(by);
  for(var i=0;i<rids.length;i++){
    var rid=rids[i], known=D.runs[rid]; if(!known || known.status!=='draft') continue;
    var notice=C.normalizeNotice(D.notices[known.noticeId]), rule=D.rules[known.typeCode]; if(!notice || !rule) continue;
    var a=Object.assign({}, known.actuals||{}, by[rid]), res=compute(notice, known.monthKey, rule, rid, a);
    try{ await patchRecord('settle/runs/'+rid, 'SettleRun', known, { actuals:a, sites:res.sites, issues:res.issues }); }
    catch(e){ toast('저장하지 못했습니다('+done+'건 저장됨): '+errMsg(e)); await reload(); return; }
    /* 같은 칸이 노란 칸(임시저장 안 한 글)으로 남아 있었으면 버린다 — 방금 저장한 입금이 맞는 값이다 */
    Object.keys(by[rid]).forEach(function(k){ if(PEND[rid]) delete PEND[rid][k]; }); done+=Object.keys(by[rid]).length;
  }
  SEL.auto={}; await reload();
  toast('통장 실입금 '+done+'건을 저장하고 다시 계산했습니다');
}
/* ③ 카톡 보내기 — 확정한 정산표의 문구(보낼 수 있음) 먼저, 임시저장은 미리보기. 기록만은 문구가 없다 */
function msgsOf(run){ var rule=D.rules[run.typeCode]; return rule ? C.buildMessages(run, ruleObj(rule), NAMES) : []; }
function monthItems(runs){
  var out=[];
  runs.filter(function(r){ return r.status==='confirmed'; }).concat(runs.filter(function(r){ return r.status==='draft'; })).forEach(function(r){
    msgsOf(r).forEach(function(m, i){ out.push({ rid:r.id, i:i, sid:m.sid, name:m.name, text:m.text, biz:bizName(r.typeCode), preview:r.status!=='confirmed' }); });
  });
  return out;
}
/* 아직 안 보낸 문구 — 확정 · 방 있음 · 대기 중도 아니고 보냄(시험 방 말고)도 아님 */
function openPicks(runs){
  var out=[];
  runs.filter(function(r){ return r.status==='confirmed'; }).forEach(function(r){ var last=kqLast(r.id);
    msgsOf(r).forEach(function(m, i){ var k=last[m.sid]; if(roomOf(m.sid) && !(k && (k.status==='pending' || (k.status==='sent' && !k.redirect)))) out.push({ rid:r.id, i:i }); }); });
  return out;
}
function drawSend(runs){
  var last={}; runs.forEach(function(r){ last[r.id]=kqLast(r.id); });
  var ready=runs.filter(function(r){ return r.status==='draft' && confirmable(r.id); }).length, open=ME.isAdmin?openPicks(runs).length:0;
  var go=ready ? { label:ready+'개 정산표 확정'+(ME.isAdmin?'하고 카톡 보내기':'') } : open ? { label:'카톡 '+open+'통 보내기' } : null;
  $('step3').innerHTML=V.monthMsgs(monthItems(runs), { rooms:roomMap(), last:last, isAdmin:!!ME.isAdmin, agent:V.agentLine(D.agent, Date.now()), go:go, multi:runs.length>1 });
}
/* ═══ 한 해 합계 탭 — 담당별 반환·추가 지급 · 달마다 한 줄 · 카톡 보낸 기록 ═══ */
function drawYear(){
  $('yearBox').innerHTML=V.yearBox(C.yearSummary(runsList(), YEAR), NAMES);
  var by={}; yearRuns().forEach(function(r){ (by[r.monthKey]=by[r.monthKey]||[]).push(r); });
  $('yearMonths').innerHTML=V.yearMonths(Object.keys(by).sort().map(function(k){
    var rs=by[k], kq={ sent:0, all:0 };
    rs.forEach(function(r){ if(r.status!=='confirmed') return; var last=kqLast(r.id);
      msgsOf(r).forEach(function(m){ kq.all++; var q=last[m.sid]; if(q && q.status==='sent' && !q.redirect) kq.sent++; }); });
    return { key:k, names:rs.map(function(r){ return bizName(r.typeCode); }), state:C.monthState(rs), kq:kq };
  }));
  var labels={}; Object.keys(D.runs).forEach(function(k){ labels[k]=(D.runs[k].label||k)+' · '+bizName(D.runs[k].typeCode); });
  $('kqBox').innerHTML=V.kqTable(kqList().filter(function(k){ var r=D.runs[k.runId]; return !r || C.yearOf(r.monthKey)===YEAR; }), NAMES, labels, SEL.kq);
}
/* 설정 › 카톡 연결 — PC 카톡 연결 상태 · 담당마다 카톡 방 */
function drawRooms(){
  $('kqAgent').innerHTML=V.agentLine(D.agent, Date.now());

/* ═══ 직접 입력 — 안내 엑셀이 없는 컨설팅(대표 선택 2026-10-31 「직접 입력 기능 추가」, 예: 산업일자리전환 능률협회) ═══

   사업장 글은 «업체명 (컨설팅 번호)» — 같은 업체가 여러 컨설팅에 있어도 연결이 섞이지 않게. 업체·사람 연결은 화면에서 고른 것으로 바로 잇는다(사람이 확정한 연결).
   ⚠ 안내 파일로 만든 달과는 섞지 않는다 — 같은 종류·같은 달에 엑셀 안내가 있으면 저장하지 않는다(buildRuns 도 출처가 다른 정산표는 덮지 않는다). */
var MANUAL={ open:false, type:'', siteId:'', month:'', rows:[] };

function manualDefaultRows(type, siteId, leadPre){
  var rule=D.rules[type]||{}, tax=C.taxOf(rule.tax), rows=[{ sid:rule.leadSid||'', role:'lead', tax:tax, net:'', pre:leadPre||'' }], c=siteId&&manualCons(siteId);
  var subs=c?(Array.isArray(c.managerSubs)?c.managerSubs:[]).map(sidOfAny).filter(function(s){ return s && s!==rule.leadSid && ERP.people.some(function(p){ return p.sid===s; }); }):[];
  subs.forEach(function(s){ rows.push({ sid:s, role:'staff', tax:tax, net:'', pre:'0' }); });

  var pl=D.links.person;
  for(var i=0;i<people.length;i++){ var lk=pl[C.linkKey(people[i].name)]; if(lk && !lk._deleted && lk.sid && lk.sid!==people[i].sid){ toast(people[i].name+' — 같은 이름이 다른 사람에게 연결돼 있습니다. 확인이 필요합니다'); return; } }
  var id=manualId(type), company=manualSiteText(c), merged=C.manualAdd(D.notices[id], { monthKey:mk, company:company, people:people });
  var rec={ id:id, entityType:'SettleNotice', typeCode:type, fileName:'직접 입력', receivedAt:Date.now(), source:'manual', hash:C.noticeHash(merged.rows), months:merged.months, rows:merged.rows };
  try{
    /* 이 컨설팅 요율표에 없던 담당은 기존 %를 요율표에 넣는다(정산표가 «요율 없음»으로 막히지 않게) */
    if(Object.keys(addRates).length) await patchRecord('settle/rules/'+type, 'SettleRule', rule, { rates:Object.assign({}, rule.rates||{}, addRates) });

  }catch(e){ toast('저장하지 못했습니다: '+errMsg(e)); await reload(); return; }
  MANUAL.open=false; await reload(); await buildRuns(id);
  YEAR=mk.slice(0,4); lsSet('year', YEAR); CUR_RUN=C.runId(type, mk); CUR_MONTH=mk; INBOX.open=false;

/* 통장 실입금 여럿을 한 번에 넣고 다시 계산(직접 입력의 실수령액) */
async function setActuals(rid, map){
  var known=D.runs[rid]; if(!known || known.status!=='draft') return;
  var n=C.normalizeNotice(D.notices[known.noticeId]), rule=D.rules[known.typeCode]; if(!n || !rule) return;
  var a=Object.assign({}, known.actuals||{}, map), res=compute(n, known.monthKey, rule, rid, a);
  try{ await patchRecord('settle/runs/'+rid, 'SettleRun', known, { actuals:a, sites:res.sites, issues:res.issues }); }catch(e){ toast('통장 실입금을 넣지 못했습니다: '+errMsg(e)); return; }
  await reload();
}
/* 고른 입력 빼기 — 그 달·그 사업장 입력을 지우고, 비게 된 «임시저장» 정산표는 _deleted 표식(돈 기록은 지우지 않는다) */
async function removeManual(){
  var type=MANUAL.type, id=manualId(type), n=D.notices[id]; if(!n) return;
  var picks=C.manualEntries(n).filter(function(e){ return SEL.mentries[e.key]; });
  if(!picks.length || !window.confirm('직접 넣은 것 '+picks.length+'건을 뺄까요?\n그 달 정산표를 다시 계산합니다.')) return;
  var merged=C.manualRemove(n, picks);
  try{
    await patchRecord('settle/notices/'+id, 'SettleNotice', n, { months:merged.months, rows:merged.rows, hash:C.noticeHash(merged.rows), receivedAt:Date.now() });
    var left={}; merged.rows.forEach(function(r){ Object.keys(r.amounts).forEach(function(k){ if(Number(r.amounts[k])>0) left[k]=1; }); });
    for(var i=0;i<picks.length;i++){ var rid=C.runId(type, picks[i].monthKey), run=D.runs[rid];
      if(run && !run._deleted && run.status==='draft' && run.noticeId===id && !left[picks[i].monthKey]) await softDelete('settle/runs/'+rid, 'SettleRun', run); }
  }catch(e){ toast('빼지 못했습니다: '+errMsg(e)); await reload(); return; }
  SEL.mentries={}; await reload();
  if(merged.rows.length) await buildRuns(id);
  MANUAL.open=true; TAB='month'; draw();
}
/* ═══ 임시저장 — 통장 실입금은 쳐도 바로 저장하지 않는다(대표 지시 2026-10-31 「임시저장기능 만들어 달라」) ═══
   친 글은 PEND(정산표마다 {'consultingId|sid': 글})에만 두고 노란 칸으로 보인다 → «임시저장 (n)» 한 번에 서버로, 다시 계산.
   ⚠ 저장 안 한 칸이 있으면 확정·기록만을 막고, 창을 닫거나 새로고침할 때 묻는다(요율표의 저장 안 한 변경도). */
var PEND={};
function pendCount(rid){ return Object.keys(PEND[rid]||{}).length; }
function pendSame(rid, key, raw){
  var saved=((D.runs[rid]||{}).actuals||{})[key], v=String(raw||'').trim();
  return v==='' ? saved==null : (saved!=null && C.won(v)===Number(saved));
}
/* 글을 칠 때마다 다시 그리지 않는다(치던 글이 끊긴다) — 단추 글과 안내 줄만 고친다 */
function paintPending(){
  var n=pendCount(CUR_RUN), b=$('draftSave'), note=$('pendNote');
  if(b){ b.textContent='임시저장'+(n?' ('+n+')':''); b.classList.toggle('pend', n>0); }
  if(note){ note.style.display=n?'':'none'; note.textContent='저장 안 한 칸 '+n+'개 — «임시저장»을 누르면 다른 PC에서도 이어서 할 수 있습니다'; }
}
async function saveDraft(rid){
  var known=D.runs[rid]; if(!known || known.status!=='draft') return;
  var p=PEND[rid]||{}, keys=Object.keys(p);
  if(!keys.length){ toast('고친 칸이 없습니다 — 이미 임시저장돼 있습니다'); return; }
  var a=Object.assign({}, known.actuals||{});
  for(var i=0;i<keys.length;i++){
    var v=String(p[keys[i]]||'').trim();
    if(v===''){ delete a[keys[i]]; continue; }
    var w=C.won(v); if(!(w>0)){ toast('금액을 숫자로 적어 주세요 — '+v+' (아무것도 저장하지 않았습니다)'); return; }
    a[keys[i]]=w;
  }
  var n=C.normalizeNotice(D.notices[known.noticeId]), rule=D.rules[known.typeCode];
  if(!n || !rule){ toast('안내 파일과 규칙을 확인하세요'); return; }
  var res=compute(n, known.monthKey, rule, rid, a);
  try{ await patchRecord('settle/runs/'+rid, 'SettleRun', known, { actuals:a, sites:res.sites, issues:res.issues }); }catch(e){ toast('저장하지 못했습니다: '+errMsg(e)); return; }
  delete PEND[rid]; await reload();
  toast('임시저장했습니다 — '+keys.length+'칸. 다시 계산했습니다');
}
window.addEventListener('beforeunload', function(e){
  if(Object.keys(PEND).some(function(r){ return pendCount(r)>0; }) || (WORK && WORK.dirty)){ e.preventDefault(); e.returnValue=''; }
});
function depPeople(run){
  var seen={}, out=[];
  run.sites.forEach(function(s){ s.members.forEach(function(m){ if(m.sid && m.pre>0 && !seen[m.sid]){ seen[m.sid]=1; out.push({ sid:m.sid, name:NAMES[m.sid]||m.name }); } }); });
  return out;
}
function depState(run){
  var matches=DEP.sid?C.matchDeposits(C.expectedFor(run, DEP.sid), DEP.found):[];
  return { open:DEP.open, people:depPeople(run), sid:DEP.sid, found:DEP.found, source:DEP.source, text:DEP.text, matches:matches, pick:DEP.pick, sel:SEL.deposits };
}
/* 찾은 입금이 바뀌면(읽기·당겨오기·사람 바꿈) 맞춘 결과로 «후보»를 다시 고른다 — 같은 금액만 미리 ☐ 해 두고, 저장은 단추로만 */
function depRematch(run){
  DEP.pick={}; SEL.deposits={};
  if(!DEP.sid) return;
  C.matchDeposits(C.expectedFor(run, DEP.sid), DEP.found).forEach(function(o){ if(o.found){ DEP.pick[o.key]=o.found.id; if(o.kind==='exact') SEL.deposits[o.key]=1; } });
}
function curDraft(){ var r=CUR_RUN && D.runs[CUR_RUN] ? C.normalizeRun(D.runs[CUR_RUN]) : null; return r && r.status==='draft' ? r : null; }
async function pullLedger(){
  var run=curDraft(); if(!run) return;
  if(!DEP.sid){ toast('누구 통장인지 먼저 고르세요'); return; }
  var w=C.depositWindow(run.monthKey), v;
  try{ v=(await fbDb.ref('data/ledger_batches').once('value')).val(); }
  catch(e){ toast('재무관리 거래내역을 읽지 못했습니다 — 재무관리 권한이 필요합니다'); return; }
  DEP.found=C.ledgerDeposits(unwrap(v), w.from, w.to); DEP.source='ledger'; DEP.open=true;
  depRematch(run); drawMonth();
  toast('재무관리에서 '+w.from+' ~ '+w.to+' 입금 '+DEP.found.length+'건을 가져왔습니다'+(DEP.found.length?'':' — 이 기간에 올린 거래내역이 없습니다'));
}
async function applyDeposits(){
  var run=curDraft(); if(!run){ toast('임시저장인(확정 전) 정산표에서만 저장할 수 있습니다'); return; }
  var keys=Object.keys(SEL.deposits).filter(function(k){ return DEP.pick[k]; });
  if(!keys.length){ toast('저장할 줄을 고르세요(☐ 와 «찾은 입금»)'); return; }
  var a=Object.assign({}, run.actuals), n=0;
  keys.forEach(function(k){ var f=DEP.found.filter(function(x){ return x.id===DEP.pick[k]; })[0]; if(f){ a[k]=f.amount; n++; } });
  var notice=C.normalizeNotice(D.notices[run.noticeId]), rule=D.rules[run.typeCode];
  if(!notice || !rule){ toast('안내 파일과 규칙을 확인하세요'); return; }
  var res=compute(notice, run.monthKey, rule, run.id, a);
  try{ await patchRecord('settle/runs/'+run.id, 'SettleRun', D.runs[run.id], { actuals:a, sites:res.sites, issues:res.issues }); }
  catch(e){ toast('저장하지 못했습니다: '+errMsg(e)); return; }
  /* 저장한 칸이 노란 칸(임시저장 안 한 글)으로 남아 있었으면 그 글은 버린다 — 방금 저장한 입금이 맞는 값이다 */
  keys.forEach(function(k){ if(PEND[run.id]) delete PEND[run.id][k]; });
  SEL.deposits={}; await reload();
  toast('통장 실입금 '+n+'건을 저장하고 다시 계산했습니다');

function ruleOptions(sel){
  var keys=Object.keys(D.rules).filter(function(k){ return D.rules[k] && !D.rules[k]._deleted; });
  return keys.map(function(k){ return '<option value="'+V.esc(k)+'"'+(k===sel?' selected':'')+'>'+V.esc(bizName(k))+'</option>'; }).join('');
}
function drawNotices(){
  var cur=$('upType').value||lsGet('upType')||'';
  $('upType').innerHTML=ruleOptions(cur)||'<option value="">규칙을 먼저 만드세요</option>';
  $('noticesBox').innerHTML=V.noticesTable(vals(D.notices).filter(noticeInYear).map(C.normalizeNotice), SEL.notices, bizNames());
  var n=CUR_NOTICE && D.notices[CUR_NOTICE] ? C.normalizeNotice(D.notices[CUR_NOTICE]) : null;
  $('linkBox').innerHTML=n?V.linkBox(unlinkedOf(n)):'';
  drawBulks();
}
function unlinkedOf(n){
  var companies=[], people=[], seenC={}, seenP={};
  n.rows.forEach(function(r){
    if(!(r.totalPre>0 || Object.keys(r.amounts).length)) return;
    var ck=C.linkKey(r.company), pk=C.linkKey(r.name);
    if(!seenC[ck] && !(D.links.company[ck] && !D.links.company[ck]._deleted)){
      seenC[ck]=1; var b=bareName(r.company);
      var cands=sitesFor(n.typeCode).map(function(s){ var sb=bareName(s.companyName); return Object.assign({ score: sb===b?2:(sb&&b&&(sb.indexOf(b)>=0||b.indexOf(sb)>=0))?1:0 }, s); })
        .sort(function(x,y){ return y.score-x.score || (x.label<y.label?-1:1); });
      companies.push({ key:ck, text:r.company, candidates:cands });
    }
    if(!seenP[pk] && !(D.links.person[pk] && !D.links.person[pk]._deleted)){
      seenP[pk]=1;
      var pc=ERP.people.slice().sort(function(x,y){ return (y.name===r.name)-(x.name===r.name); }).map(function(p){ return { sid:p.sid, label:p.name }; });
      people.push({ key:pk, text:r.name, candidates:pc });
    }
  });
  return { companies:companies, people:people };
}
/* 요율표 사본 만들기 — 서버의 규칙(D.rules)을 사업 종류 칸 · 사람 줄로 편다. 사람 줄 = 어느 사업에든 요율이 있는 사람(이름순) */
function buildWork(){
  var types=Object.keys(D.rules).filter(function(k){ return D.rules[k] && !D.rules[k]._deleted; });
  var order={}; ERP.biz.forEach(function(b, i){ order[b.code]=i; });
  types.sort(function(a,b){ return (order[a]==null?999:order[a])-(order[b]==null?999:order[b]); });
  var rules={}, seen={}, people=[];
  types.forEach(function(k){
    var r=D.rules[k], rates={};
    Object.keys(r.rates||{}).forEach(function(s){ rates[s]=String(r.rates[s]); if(!seen[s]){ seen[s]=1; people.push(s); } });
    rules[k]={ typeCode:k, title:r.title||'', tax:C.taxOf(r.tax), leadSid:r.leadSid||'', rates:rates, siteRates:JSON.parse(JSON.stringify(r.siteRates||{})), msgHead:r.msgHead||'', msgFoot:r.msgFoot||'', active:r.active!==false };
  });
  people.sort(function(a,b){ var x=NAMES[a]||'', y=NAMES[b]||''; return x<y?-1:x>y?1:0; });
  return { types:types, rules:rules, people:people, dirty:false, open:(WORK&&WORK.open)||'' };
}
/* 기존 % — 대표 지시 2026-10-31 「퍼센트는 가급적 기존에 있던 퍼센트를 가지고 오도록」.
   요율표(고치는 사본 WORK)의 빈 칸마다 그 사람이 다른 컨설팅에서 쓰는 % → {'종류|사번': %}. 넣지는 않고 흐리게 보여 준다 */
function rateSuggest(){
  var out={}; if(!WORK) return out;
  WORK.types.forEach(function(c){ WORK.people.forEach(function(sid){
    var v=(WORK.rules[c].rates||{})[sid]; if(v!=null && String(v).trim()!=='') return;
    var e=C.existingRate(WORK.rules, sid, c); if(e!=null) out[c+'|'+sid]=e;
  }); });
  return out;
}
function drawRules(){
  if(!WORK || !WORK.dirty) WORK=buildWork();
  var addTypes=ERP.biz.filter(function(b){ return WORK.types.indexOf(b.code)<0; });
  var sitesByType={}; WORK.types.forEach(function(k){ sitesByType[k]=sitesFor(k); });
  var opt={ bizNames:bizNames(), addTypes:addTypes, staff:ERP.people, names:NAMES, sitesByType:sitesByType, sel:SEL.mxpeople, suggest:rateSuggest() };
  $('ruleBox').innerHTML=V.rateMatrix(WORK, opt);
  $('ruleDetBox').innerHTML=V.ruleDetails(WORK, opt);
  var allSites=[]; WORK.types.forEach(function(k){ allSites=allSites.concat(sitesByType[k]); });
  $('adjBox').innerHTML=V.adjustsTable(vals(D.adjusts), siteNames(), NAMES, SEL.adjusts, { sites:allSites, people:ERP.people });
  drawBulks();
}
function markDirty(){ if(!WORK) return; WORK.dirty=true; var b=$('mx_save'); if(b) b.disabled=false; }
/* 요율표 «저장» — 바뀐 사업 종류만, 한 사업씩 관문으로. 주관이 없거나 요율이 0~100 숫자가 아니면 아무것도 저장하지 않는다 */
async function saveRules(){
  if(!WORK || !WORK.dirty) return;
  var recs=[], bad='';
  WORK.types.forEach(function(k){
    var w=WORK.rules[k], rates={};
    if(!w.leadSid && !bad) bad=bizName(k)+' — 주관을 고르세요';
    Object.keys(w.rates).forEach(function(s){
      var t=String(w.rates[s]).replace(/[%\s]/g,''); if(t==='') return;
      var v=Number(t); if(!(v>=0 && v<=100) && !bad) bad=bizName(k)+' · '+(NAMES[s]||'(이름 없음)')+' — 요율은 0~100 숫자'; else rates[s]=v;
    });
    var rec={ id:k, entityType:'SettleRule', typeCode:k, mode:'pool', title:w.title||bizName(k), tax:C.taxOf(w.tax), leadSid:w.leadSid, rates:rates, siteRates:w.siteRates||{}, msgHead:w.msgHead||'', msgFoot:w.msgFoot||'', active:w.active!==false };
    var old=D.rules[k], pick=function(o){ return o?JSON.stringify([o.title||'', C.taxOf(o.tax), o.leadSid||'', o.rates||{}, o.siteRates||{}, o.msgHead||'', o.msgFoot||'', o.active!==false]):''; };
    if(!old || pick(old)!==pick(rec)) recs.push({ k:k, rec:rec, isNew:!old });
  });
  if(bad){ toast(bad); return; }
  if(!recs.length){ WORK.dirty=false; drawRules(); toast('바뀐 것이 없습니다'); return; }
  var done=0;
  try{
    for(var i=0;i<recs.length;i++){
      var x=recs[i];
      if(x.isNew) await save('settle/rules/'+x.k, 'SettleRule', function(){ return x.rec; }, { expectedRevision:-1 });
      else await patchRecord('settle/rules/'+x.k, 'SettleRule', D.rules[x.k], x.rec);
      done++;
    }
  }catch(e){ toast('저장하지 못했습니다('+done+'/'+recs.length+'건 저장됨): '+errMsg(e)); await reload(); return; }
  WORK=null; await reload(); toast('요율표를 저장했습니다 — 사업 '+done+'개. 임시저장인 정산표는 «다시 계산»을 눌러 주세요');
}
function setTab(t){ TAB=t; lsSet('tab', t); Object.keys(SEL).forEach(function(k){ SEL[k]={}; }); AUTO.primed=''; draw(); }
/* 해 바꾸기(‹ › · 고르기) — 그 해 것만 보이게. 열어 둔 정산표가 다른 해면 닫고, 고른 달은 그 해에서 다시 고른다 */
function setYear(y){
  if(!/^\d{4}$/.test(y||'')) return;
  YEAR=y; lsSet('year', YEAR); if(CUR_RUN && D.runs[CUR_RUN] && C.yearOf(D.runs[CUR_RUN].monthKey)!==YEAR) CUR_RUN='';
  MANUAL.open=false; SEL.notices={}; CALC.siteId=''; AUTO.primed=''; draw();
}

/* ═══ 저장 — 모두 관문(gate)으로. 지우기는 _deleted 표식을 gate.save 한다 ═══
   ⚠ 고칠 때 expectedRevision 을 쓰지 않는다 — 찬 자리 거래는 먼저 null 로 불리는데 그때 «판이 다르다»며 접어 버린다(전광판 선례).
     남이 먼저 고쳤는지는 «진짜 값이 올 때만» 직접 견준다. */
function save(path, entityType, fn, opts){ return gate.save(fbDb.ref(path), fn, Object.assign({ entityType:entityType }, opts||{})); }
function patchRecord(path, entityType, known, patch){
  return save(path, entityType, function(prev){ return Object.assign({}, prev||known||{}, patch); });
}

/* 엑셀 도구(vendor/xlsx.full.min.js, 1MB)는 처음부터 싣지 않는다 — 올리기·내려받기를 누를 때만(폰 첫 화면이 느려지지 않게, 정부사업 보고서 앱 grLib 선례) */
var XLSX_SRC='vendor/xlsx.full.min.js?v=1', xlsxP=null;
function needXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(!xlsxP) xlsxP=new Promise(function(ok, no){ var s=document.createElement('script'); s.src=XLSX_SRC; s.onload=function(){ window.XLSX?ok(window.XLSX):no(new Error('엑셀 도구를 싣지 못했습니다')); }; s.onerror=function(){ xlsxP=null; no(new Error('엑셀 도구를 내려받지 못했습니다')); }; document.head.appendChild(s); });
  return xlsxP;
}
/* 안내 파일 올리기 */
function readFileBuf(f){ return new Promise(function(ok, no){ var r=new FileReader(); r.onload=function(){ ok(r.result); }; r.onerror=function(){ no(r.error); }; r.readAsArrayBuffer(f); }); }
async function onFile(f){
  if(!f) return;
  var typeCode=$('upType').value;
  if(!typeCode || !D.rules[typeCode]){ toast('사업 종류 규칙을 먼저 만드세요 — «⚙️ 규칙·요율»'); return; }
  var parsed;
  try{
    await needXlsx();
    var wb=XLSX.read(new Uint8Array(await readFileBuf(f)), { type:'array' }), ws=wb.Sheets[wb.SheetNames[0]];
    var grid=XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:null, blankrows:true });
    parsed=C.parseNotice(grid, ws['!merges']||[], { fileName:f.name, receivedAt:Date.now(), ref:ws['!ref'] });
  }catch(e){ toast('엑셀을 읽지 못했습니다: '+errMsg(e)); return; }
  if(!parsed.ok){ toast('읽지 못했습니다 — '+parsed.error+' (아무것도 저장하지 않았습니다)'); return; }
  var hash=C.noticeHash(parsed.rows);
  var dup=vals(D.notices).filter(function(n){ return n.hash===hash && n.typeCode===typeCode; })[0];
  if(dup){ CUR_NOTICE=dup.id; drawNotices(); toast('이미 올린 파일과 내용이 같습니다 — 그 파일을 엽니다'); return; }
  var id=newId('N'), rec={ id:id, entityType:'SettleNotice', typeCode:typeCode, fileName:parsed.fileName, receivedAt:parsed.receivedAt, source:'upload', hash:hash, months:parsed.months, rows:parsed.rows };
  try{ await save('settle/notices/'+id, 'SettleNotice', function(){ return rec; }, { expectedRevision:-1 }); }
  catch(e){ toast('저장하지 못했습니다: '+errMsg(e)); return; }
  lsSet('upType', typeCode); CUR_NOTICE=id; await reload();
  toast('읽었습니다 — 지급월 '+parsed.months.length+'개 · '+parsed.rows.length+'줄. 연결을 확정한 뒤 «정산표 만들기»를 누르세요');
}
async function saveLink(kind, key){
  var selEl=document.querySelector('select[data-link="'+kind+'"][data-key="'+CSS.escape(key)+'"]'); if(!selEl||!selEl.value){ toast('고를 것을 먼저 고르세요'); return; }
  var n=C.normalizeNotice(D.notices[CUR_NOTICE]), text='';
  n.rows.forEach(function(r){ if(kind==='company' && C.linkKey(r.company)===key) text=r.company; if(kind==='person' && C.linkKey(r.name)===key) text=r.name; });
  var rec={ id:key, entityType:'SettleLink', kind:kind, text:text };
  if(kind==='company'){ var p=selEl.value.split('|'); rec.consultingId=p[0]; rec.companyId=p[1]||''; } else rec.sid=selEl.value;
  try{ await patchRecord('settle/links/'+kind+'/'+key, 'SettleLink', null, rec); }catch(e){ toast('저장하지 못했습니다: '+errMsg(e)); return; }
  await reload(); toast('연결했습니다 — 다음 파일부터 저절로 씁니다');
}
/* 안내 하나 → 지급월마다 정산표. 임시저장(확정 전)이면 다시 계산, 확정·기록만이면 덮지 않고 «바뀜»만 */
async function buildRuns(noticeId, jump){
  var n=C.normalizeNotice(D.notices[noticeId]), rule=n&&D.rules[n.typeCode];
  if(!rule){ toast('이 사업 종류의 규칙이 없습니다 — «⚙️ 규칙·요율»에서 먼저 만드세요'); return; }
  var made=0, again=0, changed=0, skipped=0;
  try{
    for(var i=0;i<n.months.length;i++){
      var key=n.months[i].key, rid=C.runId(n.typeCode, key), known=D.runs[rid];
      /* 직접 입력으로 만든 달과 안내 파일로 만든 달은 서로 덮지 않는다(한쪽 사업장이 통째로 사라진다) */
      var kn=known && !known._deleted && known.noticeId!==noticeId ? D.notices[known.noticeId] : null;
      if(kn && !kn._deleted && (kn.source==='manual')!==(n.source==='manual')){ skipped++; continue; }
      var res=compute(n, key, rule, rid, known&&known.actuals);
      if(!res.sites.length) continue;
      var outcome='';
      await save('settle/runs/'+rid, 'SettleRun', function(prev){
        var base=prev||known||null;
        if(base && base.status && base.status!=='draft'){
          var ch=C.diffRun(C.normalizeRun(base).sites, res.sites);
          outcome=ch?'changed':'same';
          return Object.assign({}, base, { changed:!!(ch || base.changed) });
        }
        outcome=base?'again':'made';
        return { id:rid, entityType:'SettleRun', typeCode:n.typeCode, monthKey:key, label:monthLabel(n, key), noticeId:noticeId, status:'draft',
          sites:res.sites, issues:res.issues, actuals:(base&&base.actuals)||{}, transfers:[], changed:false };
      });
      if(outcome==='made') made++; else if(outcome==='again') again++; else if(outcome==='changed') changed++;
    }
  }catch(e){ toast('정산표를 만들지 못했습니다: '+errMsg(e)); await reload(); return; }
  /* «정산표 만들기»로 만들었으면 그 안내의 가장 늦은 지급월로 옮겨 방금 만든 정산표가 보이게(다시 계산·직접 입력은 보던 달 그대로) */
  var ks=n.months.map(function(m){ return m.key; }).sort();
  if(jump && ks.length){ CUR_MONTH=ks[ks.length-1]; YEAR=C.yearOf(CUR_MONTH); lsSet('year', YEAR); INBOX.open=false; }
  await reload(); TAB='month'; draw();
  toast('정산표 새로 '+made+' · 다시 계산 '+again+(changed?' · 확정된 달 바뀜 '+changed:'')+(skipped?' · 출처가 다른 달 '+skipped+'개는 건드리지 않음':''));
}
async function recalc(rid){
  var run=D.runs[rid]; if(!run || run.status!=='draft') return;
  if(!D.notices[run.noticeId]){ toast('이 정산표를 만든 안내 파일이 없습니다'); return; }
  await buildRuns(run.noticeId); CUR_RUN=rid; drawMonth();
}
/* 확정할 수 있나 — 저장 안 한 칸이 없고, 다시 계산한 검산이 통과해야 한다(«확정» 단추와 «한꺼번에» 단추가 같은 잣대) */
function prepConfirm(rid){
  var known=D.runs[rid], n=known&&C.normalizeNotice(D.notices[known.noticeId]), rule=n&&D.rules[known.typeCode];
  if(!known || known.status!=='draft' || !n || !rule) return { why:'확정할 수 없습니다 — 안내 파일과 규칙을 확인하세요' };
  if(pendCount(rid)) return { why:'저장 안 한 칸이 있습니다 — 먼저 «임시저장»을 누르세요' };
  var res=compute(n, known.monthKey, rule, rid, known.actuals), chk=C.checkRun(res.sites, res.issues);
  if(!chk.ok) return { why:'확인 필요: '+chk.issues[0] };
  return { known:known, rule:rule, res:res, transfers:C.transfersOf(res.sites, rule.leadSid).map(function(t){ return Object.assign({ paid:false }, t); }), adjIds:C.appliedAdjustIds(res.sites) };
}
function confirmable(rid){ return !prepConfirm(rid).why; }
/* 확정 저장 — 남이 먼저 고쳤으면 접는다. 이월·조정을 이 달에 붙이고, 못 붙인 건수를 돌려준다 */
async function doConfirm(rid, p){
  var rev=Number(p.known.revision||0), lost=false;
  try{
    await save('settle/runs/'+rid, 'SettleRun', function(prev){
      if(prev && Number(prev.revision||0)!==rev){ lost=true; return undefined; }
      lost=false;
      return Object.assign({}, prev||p.known, { sites:p.res.sites, issues:p.res.issues, transfers:p.transfers, status:'confirmed', confirmedAt:Date.now(), confirmedBy:ME.sid, changed:false });
    });
  }catch(e){ throw new Error(lost?'다른 분이 먼저 고쳤습니다 — 다시 불러옵니다':'확정하지 못했습니다: '+errMsg(e)); }
  var failed=0;
  for(var i=0;i<p.adjIds.length;i++){
    try{ await patchRecord('settle/adjusts/'+p.adjIds[i], 'SettleAdjust', D.adjusts[p.adjIds[i]], { appliedRunId:rid }); }catch(e){ failed++; }
  }
  return failed;
}
async function confirmRun(rid){
  var p=prepConfirm(rid);
  if(p.why){ toast(p.why); return; }
  var sum=p.transfers.reduce(function(s, t){ return s+t.amount; }, 0);
  if(!window.confirm(p.known.label+' · '+bizName(p.known.typeCode)+' 정산표를 확정할까요?\n송금 '+p.transfers.length+'건 · '+C.fmt(sum)+'원'+(p.adjIds.length?'\n이월·조정 '+p.adjIds.length+'건이 이 달에 붙습니다':''))) return;
  var failed=0;
  try{ failed=await doConfirm(rid, p); }catch(e){ toast(errMsg(e)); await reload(); return; }
  await reload();
  toast(failed?'확정했지만 이월·조정 '+failed+'건을 붙이지 못했습니다 — «확정 풀기» 후 다시 확정하세요':'확정했습니다 — 송금 '+p.transfers.length+'건');
}
/* 한꺼번에(③ 머리 단추) — 그 달 확정할 수 있는 정산표를 모두 확정하고, 대표면 그 문구를 카톡 대기열에 넣는다.
   확인 창은 한 번: 무엇을 확정하나 · 송금 합계 · 누구에게 어느 방으로 보내나 · 보낸 카톡은 되돌릴 수 없다. 확정할 것이 없으면 안 보낸 문구만 보낸다 */
async function confirmMonth(){
  var runs=monthRunsOf(CUR_MONTH), ps=[], skip=[];
  runs.forEach(function(r){ if(r.status!=='draft') return; var p=prepConfirm(r.id); if(p.why) skip.push(bizName(r.typeCode)+' — '+p.why); else ps.push({ rid:r.id, p:p }); });
  if(!ps.length){ if(skip.length && !openPicks(runs).length){ toast(skip[0]); return; } await kqSend(openPicks(runs)); return; }
  var sum=0, ntr=0, who=[], noRoom=[];
  ps.forEach(function(x){
    x.p.transfers.forEach(function(t){ sum+=t.amount; ntr++; });
    if(ME.isAdmin) msgsOf(C.normalizeRun(Object.assign({}, x.p.known, { sites:x.p.res.sites }))).forEach(function(m){ var room=roomOf(m.sid); if(room) who.push(m.name+' → «'+room+'»'); else noRoom.push(m.name); });
  });
  if(!window.confirm('정산표 '+ps.length+'개를 확정할까요?\n'+ps.map(function(x){ return '· '+x.p.known.label+' · '+bizName(x.p.known.typeCode); }).join('\n')
    +'\n송금 '+ntr+'건 · '+C.fmt(sum)+'원'
    +(ME.isAdmin ? (who.length ? '\n\n카톡 '+who.length+'통을 대표 PC 카톡으로 보냅니다\n'+who.map(function(w){ return '· '+w; }).join('\n') : '\n\n카톡 방이 등록된 사람이 없어 카톡은 보내지 않습니다')
      +(noRoom.length ? '\n방 없음(안 보냄): '+noRoom.join(', ') : '')+(who.length ? '\n⚠ 보낸 카톡은 되돌릴 수 없습니다' : '') : '')

/* ═══ 카톡 자동 발송 — 대표 지시 2026-11-02 「카카오톡에 자동으로 보내는 기능 만들 수 없나」 → 「만들기」 ═══
   «카톡 보내기»는 settle/kakaoQueue 에 줄을 «새로 만들기만» 한다 → 대표 PC 의 카톡 심부름꾼(scripts/kakao-agent)이 1분마다 가져가 PC 카톡으로 보내고 상태를 고친다.
   ⚠ 대표(관리자)만 · 확정한 정산표만 · 카톡 방 이름이 등록된 사람만. 방 이름은 PC 카톡 창 제목과 똑같아야 심부름꾼이 보낸다(설계서 §7). */
function roomOf(sid){ var r=D.rooms[sid]; return r && !r._deleted ? String(r.room||'').trim() : ''; }
function roomMap(){ var o={}; Object.keys(D.rooms).forEach(function(s){ var r=roomOf(s); if(r) o[s]=r; }); return o; }
function kqList(){ return vals(D.kq); }
function kqLast(runId){ var o={}; kqList().filter(function(k){ return k.runId===runId; }).sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); }).forEach(function(k){ o[k.sid]=k; }); return o; }
/* 요율표에 담당으로 든 사람(재직·퇴직 모두 — 지난 정산표 사람도 방을 등록할 수 있게) */
function roomPeople(){ var seen={}, out=[]; ruleTypes().forEach(function(k){ Object.keys(D.rules[k].rates||{}).forEach(function(s){ if(!seen[s]){ seen[s]=1; out.push(s); } }); });
  return out.sort(function(a,b){ var x=NAMES[a]||'', y=NAMES[b]||''; return x<y?-1:x>y?1:0; }); }
async function saveRoom(sid, el){
  if(!ME.isAdmin){ toast('카톡 방은 대표(관리자)만 고칩니다'); return; }

  await reload(); toast((NAMES[sid]||'')+' 카톡 방을 저장했습니다');

/* 보낼 줄 고르기 — picks=[{rid, i(그 정산표 문구 번호)}]. 확정한 정산표만 · 방 이름이 있는 사람만 · 대기 중이면 다시 넣지 않는다 */
function kqPlan(picks){
  var todo=[], skip=[], msgs={}, last={};
  (picks||[]).forEach(function(p){
    var run=D.runs[p.rid];
    if(!run || run.status!=='confirmed'){ skip.push('확정 전 정산표'); return; }
    if(!msgs[p.rid]){ msgs[p.rid]=msgsOf(C.normalizeRun(run)); last[p.rid]=kqLast(p.rid); }
    var m=msgs[p.rid][p.i]; if(!m) return;
    var room=roomOf(m.sid), k=last[p.rid][m.sid];
    if(!room){ skip.push(m.name+'(방 이름 없음)'); return; }
    if(k && k.status==='pending'){ skip.push(m.name+'(이미 대기 중)'); return; }
    todo.push({ rid:p.rid, m:m, room:room, again:!!(k && k.status==='sent' && !k.redirect) });
  });
  return { todo:todo, skip:skip };
}
/* 대기열에 «새로 만들기만» — 대표 PC 의 카톡 심부름꾼이 가져가 보낸다. 대표만, 넣는 순간에도 확정인지 다시 본다 */
async function kqPut(todo){
  if(!ME.isAdmin) return { n:0, err:'카톡 보내기는 대표(관리자)만 합니다' };
  var n=0;
  try{
    for(var i=0;i<todo.length;i++){ var x=todo[i], id=newId('K');
      if(!D.runs[x.rid] || D.runs[x.rid].status!=='confirmed') continue;
      await save('settle/kakaoQueue/'+id, 'SettleKakao', function(){ return { id:id, entityType:'SettleKakao', runId:x.rid, sid:x.m.sid, room:x.room, text:x.m.text, status:'pending', tries:0, createdBy:ME.sid }; }, { expectedRevision:-1 });
      n++; }
  }catch(e){ return { n:n, err:errMsg(e) }; }
  return { n:n, err:'' };
}
async function kqSend(picks){
  if(!ME.isAdmin){ toast('카톡 보내기는 대표(관리자)만 합니다'); return; }
  var pl=kqPlan(picks), todo=pl.todo, skip=pl.skip;
  if(!todo.length){ toast('보낼 것이 없습니다'+(skip.length?' — '+skip.join(', '):'')); return; }
  var again=todo.filter(function(x){ return x.again; }).map(function(x){ return x.m.name; });
  if(!window.confirm(todo.length+'통을 대표 PC 카톡으로 보낼까요?\n'+todo.map(function(x){ return '· '+x.m.name+' → «'+x.room+'»'; }).join('\n')
    +(again.length?'\n\n⚠ 이미 보낸 사람: '+again.join(', ')+' — 한 번 더 보냅니다':'')+'\n⚠ 보낸 카톡은 되돌릴 수 없습니다')) return;
  var put=await kqPut(todo);
  await reload();
  toast(put.err ? '대기열에 넣지 못했습니다('+put.n+'/'+todo.length+'): '+put.err
    : put.n+'통을 대기열에 넣었습니다 — '+(D.agent && D.agent.agentSeenAt ? '대표 PC 카톡이 1분 안에 보냅니다' : '대표 PC 카톡이 연결되면 보냅니다')+(skip.length?' · 뺀 것: '+skip.join(', '):''));
}
function refPick(ref){ var s=String(ref||''), cut=s.lastIndexOf('|'); return { rid:s.slice(0, cut), i:Number(s.slice(cut+1)) }; }

function copyMsg(ref){

  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(m.text).then(done, function(){ fallbackCopy(m.text, done); });

function fallbackCopy(text, done){
  var ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly', ''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('복사하지 못했습니다 — 글을 길게 눌러 복사하세요'); }
  document.body.removeChild(ta);
}

    if(d==='delNotice'||d==='delAdjust'){
      var kind=d==='delNotice'?'notices':'adjusts', ids=Object.keys(SEL[kind]);
      if(d==='delAdjust') ids=ids.filter(function(id){ return D.adjusts[id] && !D.adjusts[id].appliedRunId; });
      if(!ids.length || !window.confirm(ids.length+'건을 지울까요? (기록은 남고 목록에서만 빠집니다)')) return;
      try{ for(var i=0;i<ids.length;i++) await softDelete('settle/'+kind+'/'+ids[i], d==='delNotice'?'SettleNotice':'SettleAdjust', D[kind][ids[i]]); }catch(e){ toast('지우지 못했습니다: '+errMsg(e)); }
      SEL[kind]={}; await reload(); return;
    }
    return;
  }
  if(t.closest('#pickBtn')){ $('file').click(); return; }
  if((b=t.closest('[data-notice]'))){ CUR_NOTICE=b.getAttribute('data-notice'); var un=unlinkedOf(C.normalizeNotice(D.notices[CUR_NOTICE]));
    if(un.companies.length||un.people.length){ drawNotices(); toast('먼저 아래 «연결 확정»을 끝내 주세요 — 업체 '+un.companies.length+' · 사람 '+un.people.length); $('linkBox').scrollIntoView({ behavior:'smooth' }); return; }
    await buildRuns(CUR_NOTICE, true); return; }
  if((b=t.closest('[data-link-save]'))){ var p=b.getAttribute('data-link-save'), cut=p.indexOf('|'); await saveLink(p.slice(0,cut), p.slice(cut+1)); return; }
  /* 계산기 — 이 기기에만 기억, 서버에 쓰지 않는다 */
  if(t.closest('#c_add')){ CALC.rows.push({ sid:'', role:'staff', pre:'', rate:'' }); saveCalc(); drawCalc(); return; }
  if((b=t.closest('[data-c-del]'))){ CALC.rows.splice(Number(b.getAttribute('data-c-del')), 1); SEL.calc={}; saveCalc(); drawCalc(); return; }
  if(t.closest('#c_reset')){ CALC=calcDefault(); SEL.calc={}; saveCalc(); drawCalc(); return; }
  /* 요율표 — 고치는 것은 사본(WORK)만, 서버에는 «저장»에서 한 번에 */
  if(t.closest('#mx_save')){ await saveRules(); return; }
  if(t.closest('#mx_fill')){ var sg=rateSuggest(), sk=Object.keys(sg); if(!sk.length) return;
    sk.forEach(function(k){ var q=k.split('|'); WORK.rules[q[0]].rates[q[1]]=String(sg[k]); }); markDirty(); drawRules();
    toast('빈 칸 '+sk.length+'개에 기존 %를 넣었습니다 — 확인하고 «저장»을 누르세요'); return; }
  if((b=t.closest('[data-srate-add]'))){ var sc=b.getAttribute('data-srate-add'), box=b.closest('[data-rd]');
    var scid=box.querySelector('[data-sr-site]').value, ssid=box.querySelector('[data-sr-sid]').value, spv=Number(String(box.querySelector('[data-sr-pct]').value).replace(/[%\s]/g,''));
    if(!scid||!ssid||!(spv>=0&&spv<=100)){ toast('사업장·사람·요율(0~100)을 적어 주세요'); return; }
    var srr=WORK.rules[sc].siteRates; srr[scid]=srr[scid]||{}; srr[scid][ssid]=spv; WORK.open=sc; markDirty(); drawRules(); return; }
  if((b=t.closest('[data-srate-del]'))){ var q=b.getAttribute('data-srate-del').split('|'), sr0=WORK.rules[q[0]].siteRates;
    if(sr0[q[1]]){ delete sr0[q[1]][q[2]]; if(!Object.keys(sr0[q[1]]).length) delete sr0[q[1]]; } WORK.open=q[0]; markDirty(); drawRules(); return; }
  if(t.closest('#a_add')){ await addAdjust(); return; }
  if((b=t.closest('[data-adj-del]'))){ var aid=b.getAttribute('data-adj-del'); if(!window.confirm('이 이월·조정을 지울까요?')) return; try{ await softDelete('settle/adjusts/'+aid, 'SettleAdjust', D.adjusts[aid]); }catch(e){ toast('지우지 못했습니다: '+errMsg(e)); } await reload(); return; }
  if((b=t.closest('[data-copy]'))){ copyMsg(b.getAttribute('data-copy')); return; }
  if((b=t.closest('[data-kq]'))){ await kqSend([refPick(b.getAttribute('data-kq'))]); return; }
  /* 방 저장 — 누른 단추 옆 칸의 글(같은 사람 칸이 여러 곳에 있어도 그 칸) */
  if((b=t.closest('[data-room-save]'))){ var rb=b.closest('.kroom')||b.closest('tr'); await saveRoom(b.getAttribute('data-room-save'), rb&&rb.querySelector('input[data-room]')); return; }
});
document.addEventListener('change', async function(ev){
  var t=ev.target;
  if(t.matches('input[data-all]')){ var k=t.getAttribute('data-all'); [].forEach.call(t.closest('table').querySelectorAll('input[data-ck]'), function(c){ c.checked=t.checked; var id=c.getAttribute('data-ck'); if(t.checked) SEL[k][id]=1; else delete SEL[k][id]; }); drawBulks(); return; }
  if(t.id==='dep_sid'){ var ds=curDraft(); DEP.sid=t.value; DEP.open=true; if(ds) depRematch(ds); drawMonth(); return; }
  if(t.matches('select[data-dep]')){ DEP.pick[t.getAttribute('data-dep')]=t.value; if(!t.value) delete DEP.pick[t.getAttribute('data-dep')]; drawMonth(); return; }
  /* 입금 자동 검토 — 줄마다 고른 입금(화면에만). 고르면 ☐, 비우면 ☐ 뗌 */
  if(t.matches('select[data-auto-pick]')){ var ap=t.getAttribute('data-auto-pick'); if(t.value){ AUTO.pick[ap]=t.value; SEL.auto[ap]=1; } else { delete AUTO.pick[ap]; delete SEL.auto[ap]; } drawMonth(); return; }
  /* 직접 입력 — 종류·사업장을 바꾸면 담당 줄을 이알피 부담당으로 다시 채운다(주관 세전은 지킨다) */
  if(t.id==='m_type'||t.id==='m_site'){ var lp0=(MANUAL.rows[0]||{}).pre; if(t.id==='m_type'){ MANUAL.type=t.value; MANUAL.siteId=''; } else MANUAL.siteId=t.value;
    MANUAL.rows=manualDefaultRows(MANUAL.type, MANUAL.siteId, lp0); SEL.manual={}; SEL.mentries={}; drawMonth(); return; }
  if(t.id==='m_month'){ MANUAL.month=t.value; return; }
  if(t.matches('select[data-m]')){ var mp=t.getAttribute('data-m').split('|'), mr=MANUAL.rows[+mp[0]]; if(!mr) return;
    mr[mp[1]]=t.value; if(mp[1]==='tax' && C.won(mr.net)>0) mr.pre=String(C.preFromNet(mr.net, mr.tax).pre); drawMonth(); return; }
  /* 연도 — 그 해 것만 보이게. 열어 둔 정산표가 다른 해면 닫는다 */
  if(t.id==='yearPick'){ setYear(t.value); return; }
  if(t.id==='r_tax'){ REV.tax=t.value; lsSet('rev', JSON.stringify(REV)); $('revOut').innerHTML=V.revResult(REV); return; }
  if(t.matches('select[data-rf]')){ var rq=t.getAttribute('data-rf').split('|'); WORK.rules[rq[0]][rq[1]]=t.value; markDirty(); return; }
  if(t.id==='c_type'){ CALC.type=t.value; CALC.siteId=''; calcPrefill(); saveCalc(); drawCalc(); return; }
  if(t.id==='c_site'){ CALC.siteId=t.value; saveCalc(); return; }
  if(t.matches('select[data-c]')){ var cp=t.getAttribute('data-c').split('|'), cr=CALC.rows[+cp[0]]; if(!cr) return;
    cr[cp[1]]=t.value; if(cp[1]==='role' && t.value==='lead') delete cr.rate; calcPrefill(); saveCalc(); drawCalc(); return; }
  if(t.matches('input[data-ck]')){ var tb=t.closest('table'), kind=tb?(tb.hasAttribute('data-mx-table')?'mx':tb.getAttribute('data-name')):''; kind={ run:'members', transfers:'transfers', notices:'notices', adjusts:'adjusts', deposits:'deposits', mx:'mxpeople', calc:'calc', manual:'manual', mentries:'mentries', rooms:'rooms', kq:'kq', auto:'auto' }[kind]; if(!kind) return;
    var id=t.getAttribute('data-ck'); if(t.checked) SEL[kind][id]=1; else delete SEL[kind][id]; drawBulks(); return; }
  if(t.id==='file'){ var f=t.files&&t.files[0]; t.value=''; await onFile(f); return; }
  if(t.id==='upType'){ lsSet('upType', t.value); return; }
  if(t.id==='mx_addType' && t.value){ var nt=t.value; WORK.types.push(nt);
    var leads={}; WORK.types.forEach(function(k){ var l=WORK.rules[k]&&WORK.rules[k].leadSid; if(l) leads[l]=(leads[l]||0)+1; });
    var lead0=Object.keys(leads).sort(function(a,b){ return leads[b]-leads[a]; })[0]||'';   /* 주관은 다른 사업에서 가장 많이 맡은 사람으로 먼저 채운다(고칠 수 있다) */
    /* 새 칸은 사람마다 기존 %로 먼저 채운다(고칠 수 있다, «저장»을 눌러야 반영) */
    var nr={}; WORK.people.forEach(function(s){ var e=C.existingRate(WORK.rules, s, nt); if(e!=null) nr[s]=String(e); });
    WORK.rules[nt]={ typeCode:nt, title:'', tax:'3.3', leadSid:lead0, rates:nr, siteRates:{}, msgHead:'', msgFoot:'', active:true }; markDirty(); drawRules();
    if(Object.keys(nr).length) toast('새 칸에 기존 %를 '+Object.keys(nr).length+'명 넣었습니다 — 확인하고 «저장»을 누르세요'); return; }
  if(t.id==='mx_addSid' && t.value){ WORK.people.push(t.value); markDirty(); drawRules(); return; }
  if(t.matches('select[data-lead]')){ WORK.rules[t.getAttribute('data-lead')].leadSid=t.value; markDirty(); return; }
  if(t.matches('input[data-on]')){ WORK.rules[t.getAttribute('data-on')].active=t.checked; markDirty(); return; }
});
document.addEventListener('input', function(ev){
  var t=ev.target;
  if(t.id==='dep_text'){ DEP.text=t.value; return; }
  if(t.id==='auto_text'){ AUTO.text=t.value; return; }
  /* 직접 입력 세전 — 친 글은 기억만 하고 세후 칸만 고친다(입력칸을 다시 그리지 않는다) */
  if(t.matches('input[data-m]')){ var mq=t.getAttribute('data-m').split('|'), mrow=MANUAL.rows[+mq[0]]; if(!mrow) return;
    mrow[mq[1]]=t.value;
    /* 실수령액을 치면 세율로 세전을 거꾸로 계산해 세전 칸을 채운다 */
    if(mq[1]==='net' && C.won(t.value)>0){ var rv=C.preFromNet(t.value, mrow.tax), pin=document.querySelector('input[data-m="'+mq[0]+'|pre"]'); mrow.pre=C.fmt(rv.pre); if(pin) pin.value=mrow.pre; }
    var mpre=C.won(mrow.pre), mnet=document.querySelector('[data-m-net="'+mq[0]+'"]'), mv=mpre-C.withholding(mpre, mrow.tax).total;
    if(mnet) mnet.textContent=C.fmt(mv)+(C.won(mrow.net)>0 && mv!==C.won(mrow.net)?' ≠ 실수령액':''); return; }
  if(t.id==='r_net'){ REV.net=t.value; lsSet('rev', JSON.stringify(REV)); $('revOut').innerHTML=V.revResult(REV); return; }
  /* 통장 실입금 — 친 글은 PEND 에만(저장 X). 저장된 값과 같아지면 노란 표시를 뗀다 */
  if(t.matches('input[data-actual]')){ var ak=t.getAttribute('data-actual'), pp=PEND[CUR_RUN]=PEND[CUR_RUN]||{};
    if(pendSame(CUR_RUN, ak, t.value)){ delete pp[ak]; t.classList.remove('dirty'); } else { pp[ak]=t.value; t.classList.add('dirty'); }
    var cmp=t.parentNode.querySelector('[data-k="cmp"]'); if(cmp) cmp.style.display=t.classList.contains('dirty')?'none':'';
    paintPending(); return; }
  /* 계산기 칸 — 친 글은 기억만 하고 결과만 다시 그린다(입력칸을 다시 그리지 않아 글이 끊기지 않는다) */
  if(t.matches('input[data-c]')){ var cq=t.getAttribute('data-c').split('|'), crow=CALC.rows[+cq[0]]; if(!crow) return; crow[cq[1]]=t.value; saveCalc(); drawCalcOut(); return; }
  /* 요율표 칸·자세히 칸 — 글을 칠 때마다 사본만 고친다(다시 그리지 않아 입력이 끊기지 않는다) */
  if(t.matches('input[data-mx]')){ var p=t.getAttribute('data-mx').split('|'), v=t.value.trim(); if(v==='') delete WORK.rules[p[0]].rates[p[1]]; else WORK.rules[p[0]].rates[p[1]]=v; markDirty(); return; }
  if(t.matches('input[data-rf]')){ var q=t.getAttribute('data-rf').split('|'); WORK.rules[q[0]][q[1]]=t.value.trim(); markDirty(); return; }
});
document.addEventListener('toggle', function(ev){
  var t=ev.target; if(!t.matches) return;
  if(t.matches('[data-dep-box]')) DEP.open=t.open;
  if(t.matches('[data-auto-paste]')) AUTO.pasteOpen=t.open;
  if(t.matches('[data-rd]') && WORK) WORK.open=t.open?t.getAttribute('data-rd'):(WORK.open===t.getAttribute('data-rd')?'':WORK.open);
}, true);
(function(){
  var dz=$('drop');
  ['dragenter','dragover'].forEach(function(e){ dz.addEventListener(e, function(ev){ ev.preventDefault(); dz.className='drop on'; }); });
  ['dragleave','drop'].forEach(function(e){ dz.addEventListener(e, function(ev){ ev.preventDefault(); dz.className='drop'; }); });
  dz.addEventListener('drop', function(ev){ var f=ev.dataTransfer&&ev.dataTransfer.files&&ev.dataTransfer.files[0]; onFile(f); });
})();

/* ═══ 로그인·잠금 — 모르면 잠근다 ═══
   대표·위임관리인·재무권한자(재무관리와 같은 사람)만 연다 — 대표 선택 2026-10-31. 로그인 안 함·퇴사·권한 없음은 잠근다. */
function lock(why){ $('app').style.display='none'; $('lock').style.display='block'; $('lockWhy').textContent=why||''; }
function canOpen(role){ return !!role && role.status==='active' && !!role.sid && (role.isAdmin===true || role.isSubAdmin===true || role.fin===true); }
async function staffRole(u){ try{ return (await fbDb.ref('uid_roles/'+u.uid).once('value')).val()||null; }catch(e){ return null; } }
function boot(){
  var t=lsGet('tab'); if(['month','year','setup'].indexOf(t)>=0) TAB=t;
  var s=lsGet('sub'); if(['rules','kakao','calc'].indexOf(s)>=0) SUB=s;
  var mo=lsGet('month'); if(/^[0-9]{4}-[0-9]{2}$/.test(mo||'')) CUR_MONTH=mo;
  CALC=loadCalc();
  if(location.protocol==='file:'){ lock('file:// 로 열면 로그인할 수 없습니다 — 주소로 여세요'); return; }
  if(typeof firebase==='undefined'){ lock('인터넷이 필요합니다'); return; }
  if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
  fbDb=firebase.database();
  try{ firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
  firebase.auth().onAuthStateChanged(async function(u){
    $('outBtn').style.display=u?'':'none';
    if(!u){ PuGate.show(); return; }
    PuGate.hide();
    var role=await staffRole(u);
    if(!canOpen(role)){ lock(role&&role.status==='active'?'재무관리 권한이 없는 계정입니다':'재직 중인 직원 계정이 아닙니다'); return; }
    ME.sid=String(role.sid); ME.isAdmin=role.isAdmin===true; gate=PuOntologyWrite.createGateway({ mode:'enforce', actor:ME.sid });
    $('lock').style.display='none'; $('app').style.display='';
    await loadErp();
    await reload(); setTab(TAB);
  });
}
boot();
</script>
