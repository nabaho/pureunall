<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>푸른노무법인 민간노조·단체교섭</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🫂</text></svg>">
<style>
:root{
  --ink:#1e293b; --ink2:#475569; --mute:#475569; --line:#e2e8f0; --line2:#cbd5e1; --bg:#f8fafc; --card:#ffffff;
  --blue:#2563eb; --blue-d:#1e40af; --blue-bg:#eff6ff; --blue-line:#bfdbfe;
  --green:#166534; --green-m:#16a34a; --green-bg:#f0fdf4; --green-line:#bbf7d0;
  --amber:#854d0e; --amber-m:#d97706; --amber-bg:#fffbeb; --amber-line:#fde68a;
  --red:#991b1b; --red-m:#dc2626; --red-bg:#fef2f2; --red-line:#fecaca;
  --pri-bg:#1e40af; --ok-bg:#166534;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#f8fafc; --ink2:#e2e8f0; --mute:#cbd5e1; --line:#475569; --line2:#64748b; --bg:#000000; --card:#1e293b;
    --blue:#60a5fa; --blue-d:#bfdbfe; --blue-bg:#1e293b; --blue-line:#2563eb;
    --green:#4ade80; --green-m:#16a34a; --green-bg:#1e293b; --green-line:#16a34a;
    --amber:#fde68a; --amber-m:#d97706; --amber-bg:#1e293b; --amber-line:#d97706;
    --red:#fecaca; --red-m:#dc2626; --red-bg:#1e293b; --red-line:#dc2626;
    --pri-bg:#2563eb; --ok-bg:#166534;
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 11px;line-height:1.3;white-space:nowrap}
button:hover{border-color:var(--mute)}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.drop-zone:focus-visible,.kpi[role="button"]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button[data-quiz],button[data-hqz],.wrap-btn{white-space:normal;text-align:left;max-width:100%;height:auto;line-height:1.4}
code{overflow-wrap:anywhere;word-break:break-all;max-width:100%}
button.pri{background:var(--pri-bg);border-color:var(--pri-bg);color:#ffffff;font-weight:600}
button.ok{background:var(--ok-bg);border-color:var(--ok-bg);color:#ffffff;font-weight:600}
button.warn-btn{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber);font-weight:600}
button.danger{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
button.sm{padding:4px 10px;min-height:29px;font-size:12px}
input,select,textarea{font:inherit;font-size:12.5px;padding:4px 8px;border:1px solid var(--line2);border-radius:7px;background:var(--card);color:var(--ink)}
input:not([type=checkbox]):not([type=radio]),select{min-height:29px}
textarea{width:100%;resize:vertical;font-family:inherit;line-height:1.55}
a{color:var(--blue-d);text-decoration:none}
a.act-link{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border:1px solid var(--blue-line);border-radius:7px;background:var(--blue-bg);color:var(--blue-d);font-size:12px;font-weight:600;white-space:nowrap}
.code-diff-box{border:2px solid var(--blue);background:var(--blue-bg)}
#head{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:6px;padding:5px 14px;flex-wrap:wrap}
.top h1{font-size:15.5px;margin:0;white-space:nowrap}
.top .sub{font-size:11.5px;color:var(--mute)}
#head .top button.sm{padding:3px 8px;min-height:26px;font-size:11.5px}
.sp{flex:1}
#who{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:3px;padding:0 14px;flex-wrap:wrap;align-items:center}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mute);padding:6px 11px;font-size:12.5px}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--blue)}
.chip{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--ink2)}
.c-blue{background:var(--blue-bg);color:var(--blue-d);border-color:var(--blue-line)}
.c-green{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.c-amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.c-red{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.c-direct{background:var(--ok-bg);color:#ffffff;border-color:var(--ok-bg);font-weight:700}
.c-direct-ing{background:var(--pri-bg);color:#ffffff;border-color:var(--pri-bg);font-weight:600}
.chip.wrap-chip,.wrap-chip{white-space:normal;overflow-wrap:anywhere;word-break:keep-all;max-width:100%;text-align:left}
main{padding:8px 24px 48px 12px;width:100%;max-width:none;margin:0}
.pane{display:none}
.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:7px;min-width:0;max-width:100%}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 10px;min-width:0;max-width:100%}
.bar>*{min-width:0;max-width:100%}
.sec{padding:8px 12px;font-weight:700;font-size:13px;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card>.sec:first-child{border-top:0;border-radius:10px 10px 0 0}
.note{background:var(--blue-bg);border:1px solid var(--blue-line);color:var(--blue-d);border-radius:10px;padding:7px 11px;font-size:12px;margin-bottom:7px;max-width:100%}
.warn{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:8px;max-width:100%}
.ok-banner{background:var(--green-bg);border:1px solid var(--green-line);color:var(--green);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:8px;max-width:100%}
/* ── 상단 통합 트랙 + 초소형 1줄 KPI 배지 바 (pu-harass.html 규격 통일) ── */
.hi-top-strip{display:flex;flex-direction:column;gap:5px;padding:7px 11px;margin-bottom:7px}
.hi-top-strip .scope-bar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:0;padding:0}
.hi-top-strip .scope-lbl{font-weight:700;font-size:12px;color:var(--ink2);white-space:nowrap;margin-right:2px}
.hi-top-strip .scope-btn{padding:4px 9px;min-height:27px;border-radius:8px;font-weight:600;font-size:12px;border:1px solid var(--line2);background:var(--card);color:var(--ink)}
.hi-top-strip .scope-btn:hover{border-color:var(--blue)}
.hi-top-strip .scope-btn.on{background:var(--pri-bg);border-color:var(--pri-bg);color:#ffffff}
.hi-top-strip .scope-btn.ok{background:var(--ok-bg);border-color:var(--ok-bg);color:#ffffff}
.hi-top-strip .kpis,.kpis{display:flex;flex-wrap:wrap;width:auto;gap:5px;margin:0;align-items:center}
.hi-top-strip .kpi,.kpi{display:inline-flex;flex-direction:row;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;background:var(--bg);border:1px solid var(--line);box-shadow:none;min-width:0}
.hi-top-strip .kpi span,.kpi span{font-size:11.5px;font-weight:700;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi-top-strip .kpi b,.kpi b{font-size:12.5px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi-top-strip .kpi.k-blue b,.kpi.k-blue b{color:var(--blue-d)}
.hi-top-strip .kpi.k-green b,.kpi.k-green b{color:var(--green)}
.hi-top-strip .kpi.k-amber b,.kpi.k-amber b{color:var(--amber)}
.hi-top-strip .kpi[data-act],.kpi[data-act]{cursor:pointer}
.hi-top-strip .kpi[data-act]:hover,.kpi[data-act]:hover{border-color:var(--blue)}
.hi-top-strip .kpi.k-on,.kpi.k-on{border-color:var(--green-m);background:var(--green-bg)}
.prof{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 12px;font-size:12.5px;border-bottom:1px solid var(--line)}
.prof span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof b{color:var(--mute);font-weight:500;margin-right:4px}
.pbar{display:inline-flex;gap:2px;align-items:center;vertical-align:middle;margin-right:4px}
.pdot{display:inline-block;width:7.5px;height:8.5px;border-radius:2px;background:var(--line2)}
.pdot.done{background:var(--green-m)}
.pdot.cur{background:var(--blue)}
.bulk{display:none;gap:6px;align-items:center;padding:6px 12px;background:var(--blue-bg);border-bottom:1px solid var(--blue-line);font-size:12.5px;flex-wrap:wrap}
.bulk.on{display:flex}
.scroll{overflow:auto}
table.t{width:100%;border-collapse:collapse}
table.t th,table.t td{padding:7px 7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{background:var(--bg);color:var(--ink2);font-size:12px;font-weight:600}
table.t td{overflow:hidden;text-overflow:ellipsis;max-width:240px}
table.t td.ti{font-weight:600;max-width:205px}
table.t[data-name="cases"] td{max-width:215px}
table.t[data-name^="yr_"] td{max-width:200px}
table.t[data-name^="yr_"] td.ti{max-width:220px}
table.t td.wide{max-width:360px}
table.t td[data-k="act"]{max-width:none;overflow:visible;text-overflow:clip}
.ws-split:not(.focus-doc) table.t th,.ws-split:not(.focus-doc) table.t td{padding:6px 5px}
table.t th.c,table.t td.c{width:34px;text-align:center}
input[type=checkbox],input[type=radio]{width:24px;height:24px;min-width:24px;min-height:24px;margin:0;cursor:pointer;vertical-align:middle}
table.t input[type=checkbox]{width:24px;height:24px;margin:0;cursor:pointer;vertical-align:middle}
table.t th.n,table.t td.n{width:38px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
table.t tr[data-row]{cursor:pointer}
table.t tr[data-row]:hover>td{background:var(--bg)}
table.t tr.cur>td{background:var(--blue-bg)}
table.t tr.cur>td.n{color:var(--ink2)}
table.t tr.perf-direct>td:first-child{box-shadow:inset 3px 0 0 var(--green-m)}
.empty{padding:28px 12px;text-align:center;color:var(--mute)}
.hint{font-size:12px;color:var(--mute)}
.fr{display:flex;gap:10px;padding:7px 14px;align-items:center}
.fr>label{width:110px;flex:none;color:var(--ink2);font-size:12.5px;font-weight:600;white-space:nowrap}
.fv{flex:1;min-width:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fv input[type=text],.fv input[type=email],.fv input[type=number],.fv select{flex:1;min-width:140px}
.rpt-sec-list{display:flex;flex-direction:column;gap:8px;padding:10px 12px}
.rpt-sec-card{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.rpt-sec-hd{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
.rpt-sec-body{padding:8px 12px}
.rpt-sec-body textarea{min-height:96px;font-size:13px;line-height:1.6}
.rpt-paper{padding:12px;background:var(--bg);border-top:1px solid var(--line)}
.rpt-paper textarea{min-height:380px;font-size:13px;line-height:1.65;background:var(--card)}
.mail-body{max-height:52vh;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.55}
.pv-doc{max-width:none;width:100%;margin:0;padding:14px 16px;border:1px solid var(--line2);border-radius:10px;background:var(--card);color:var(--ink)}
.pv-banner{border:2px solid var(--pri-bg);border-radius:8px;overflow:hidden;margin-bottom:12px;text-align:center}
.pv-top{background:var(--pri-bg);color:#ffffff;padding:6px 12px;font-weight:700;font-size:12px}
.pv-banner h2{margin:10px 12px 4px;font-size:16px;color:var(--ink)}
.pv-banner p{margin:0 12px 10px;color:var(--ink2);font-size:12px}
.pv-sec-hd{margin:12px 0 6px;padding:5px 10px;background:var(--blue-bg);border-left:4px solid var(--blue-d);color:var(--blue-d);font-weight:700;font-size:13px}
.pv-para{white-space:pre-wrap;margin-bottom:8px;color:var(--ink);font-size:12.5px;line-height:1.6}
.pv-tbl{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:11.5px}
.pv-tbl th,.pv-tbl td{border:1px solid var(--line2);padding:5px 7px;text-align:left;vertical-align:top}
.pv-tbl th{background:var(--bg);font-weight:700;text-align:center;color:var(--ink)}
.guide-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:8px}
.ind-card{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ind-hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ind-hd b{font-size:13px}
.ind-ul{margin:0;padding-left:18px;font-size:12px;color:var(--ink2);line-height:1.55}
#lock{display:none;max-width:460px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center}
#lock p{color:var(--mute);font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e293b;color:#ffffff;border-radius:10px;padding:10px 16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70;max-width:90vw}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(30,41,59,.42);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:12px;width:100%;max-width:640px;overflow:hidden}
.mbox.wide{max-width:860px}
.mhd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--bg);font-weight:700}
.mbd{padding:12px 14px;max-height:76vh;overflow:auto}
.mft{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
/* ── 상단 1줄 6단계 진행흐름 · 보조메뉴(act-menu) · 선택접기(sub-fold) · 좌우 2단 작업실 ── */
.ws-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:7px 12px;background:var(--bg);border-top:1px solid var(--line)}
.ws-step{display:flex;align-items:center;justify-content:center;gap:4px;min-height:32px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--mute);text-align:center;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-step b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-step.done{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}
.ws-step.cur{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue-d);font-weight:700}
.act-menu{position:relative;display:inline-block}
.act-menu>summary{list-style:none;display:inline-flex;align-items:center;gap:4px;min-height:29px;padding:4px 10px;font-size:12px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;user-select:none;white-space:nowrap}
.act-menu>summary::-webkit-details-marker{display:none}
.act-menu>summary:hover{border-color:var(--mute)}
.act-menu[open]>summary{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d)}
.act-pop{position:absolute;right:0;top:calc(100% + 4px);z-index:35;min-width:205px;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:3px}
.act-pop button,.act-pop a{width:100%;text-align:left;justify-content:flex-start;border-color:transparent;background:transparent;padding:6px 10px;min-height:32px;font-size:12.5px;border-radius:7px;color:var(--ink);display:flex;align-items:center;gap:6px}
.act-pop button:hover,.act-pop a:hover{background:var(--bg);border-color:var(--line)}
.sub-fold{border-top:1px solid var(--line);background:var(--bg)}
.sub-fold>summary{list-style:none;display:flex;align-items:center;gap:6px;min-height:34px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;user-select:none}
.sub-fold>summary::-webkit-details-marker{display:none}
.sub-fold>summary::before{content:'▸';font-size:11px;color:var(--mute)}
.sub-fold[open]>summary::before{content:'▾'}
.sub-fold>summary:hover{color:var(--ink)}
.sub-fold-bd{padding:8px 12px 10px;background:var(--card);border-top:1px solid var(--line)}
.ws-split{display:grid;grid-template-columns:minmax(360px,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.ws-split.focus-coach{grid-template-columns:1fr}
.ws-split.focus-coach .ws-col-right{display:none}
.ws-split.focus-doc{grid-template-columns:1fr}
.ws-split.focus-doc .ws-col-left{display:none}
.ws-col-left,.ws-col-right{min-width:0}
.drop-zone{border:1px dashed var(--line2);background:var(--bg);color:var(--ink2);border-radius:8px;padding:9px 12px;text-align:center;cursor:pointer;font-size:12px;transition:border-color .15s}
.drop-zone:hover,.drop-zone.drag{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d)}
#printArea{display:none}
.phone-only{display:none}
@media (min-width:1520px){
  main{padding:12px 30px 48px 20px}
  table.t th,table.t td{padding:7px 9px}
  table.t td,table.t[data-name="cases"] td{max-width:340px}
  table.t td.ti,table.t[data-name^="yr_"] td.ti{max-width:370px}
  table.t[data-name^="yr_"] td{max-width:300px}
  table.t td.wide{max-width:580px}
  table.t td[data-k="act"]{max-width:none}
}
@media (max-width:1180px){.guide-grid{grid-template-columns:1fr}}
@media (max-width:1024px){
  .ws-steps{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ws-split{grid-template-columns:1fr}
}
/* ── 폰 화면: 가로 밀기 없이 2줄 카드 (docs/규칙/폰화면.md · 고르기칸-번호.md) ── */
@media (max-width:768px){
  button.sm,#head .top button.sm,.hi-top-strip .scope-btn,.hi-top-strip .kpi[role="button"],.act-menu>summary,.sub-fold>summary{min-height:36px;padding:6px 10px}
  .act-pop button,.act-pop a{min-height:36px}
  input,select,textarea,.rpt-paper textarea,.rpt-sec-body textarea{font-size:16px}
  input[type=checkbox],input[type=radio]{width:24px;height:24px;min-width:24px;min-height:24px;margin:0;vertical-align:middle}
  .modal{padding:0}
  .mbox,.mbox.wide{max-width:100vw;border-left:0;border-right:0;border-radius:0}
  .mbd{padding:10px;max-height:84vh}
  .phone-only{display:inline}
  .wide-only{display:none}
  .top{padding:6px 8px;gap:5px;flex-wrap:nowrap}
  .top h1{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
  .top .sub{display:none}
  #who{flex:0 1 auto;min-width:0;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:0;padding:0 6px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;padding:8px 8px;font-size:13px}
  main{padding:8px 0 64px}
  .card,.ind-card{border-left:0;border-right:0;border-radius:0}
  .note,.warn,.ok-banner,#recentDiffBarWrap{margin:0 10px 8px}
  .hi-top-strip{padding:7px 10px;gap:6px}
  .hi-top-strip .scope-bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:100%}
  .hi-top-strip .scope-bar::-webkit-scrollbar{display:none}
  .hi-top-strip .scope-btn{flex:0 0 auto}
  .hi-top-strip .kpis{display:flex;flex-wrap:wrap;gap:4px;padding:0;width:100%}
  .bar{padding:7px 10px;gap:5px}
