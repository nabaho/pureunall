<!-- ══════════════════════════════════════════════════════════════
     푸른노무법인 공공임단협 (pu-alio-union.html)
     푸른통합시스템의 별개 독립 프로그램(창 이름 pureun-aliounion).
     대한민국 기획재정부 공공기관 경영정보 공개시스템(ALIO 355개 중앙공공기관),
     행정안전부 산하 지방유관기관(지방공기업평가원·한국지역정보개발원 등 6곳) 및
     지방공공기관 클린아이(Cleaneye 1,332개 지방공사·지방공단·지방직영기업·지방출자출연기관 산하단체)
     총 1,693개 공공기관·산하단체를 「기관 중심(1기관=1통합뷰)」으로 분류하고,
     기관 내부 6대 핵심 영역(노조·임금·단협13대쟁점·별도합의·내부규정·연혁/신구대비) 한눈에 보기 및
     다중 기관 SVG 그래프(레이더·산점도·그룹막대·분포)·정량표·히트맵 비교분석을 제공한다.
     포털(enter.html) 자료함의 「🤝 공공임단협」 타일 또는 오른쪽 앱바(pu-appbar.js)에서 바로 열린다.
     ══════════════════════════════════════════════════════════════ -->
<style>

<script>
(function(){
  'use strict';
  var FB_CONFIG={
    apiKey:'AIzaSyDkZz5QlKSoqMOYByp5YGeMNLNDrIghliA',
    authDomain:'pureun-erp.firebaseapp.com',
    databaseURL:'https://pureun-erp-default-rtdb.asia-southeast1.firebasedatabase.app',
    projectId:'pureun-erp',
    appId:'1:936817166182:web:9bd31f70d0afdf5fca2aa7',

  };
  var rootEl = document.getElementById('alioAppRoot');
  if(rootEl && window.PuAlioUnion){
    window.PuAlioUnion.mount(rootEl, { isModal: false });
  }
  function mountWho(){
    try{
      if(window.PuWhoami && document.getElementById('who')){
        PuWhoami.mount('#who');
        return true;
      }
    }catch(e){}
    return false;
  }
  if(!mountWho()) document.addEventListener('DOMContentLoaded', mountWho);

  try{
    if(location.protocol !== 'file:' && typeof firebase !== 'undefined' && firebase.auth){
      if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(FB_CONFIG);
      try{ firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
      firebase.auth().onAuthStateChanged(function(u){
        var outBtn = document.getElementById('outBtn');
        if(outBtn) outBtn.style.display = u ? '' : 'none';
        if(window.PuAlioUnion && typeof window.PuAlioUnion.setAuthUser === 'function'){
          window.PuAlioUnion.setAuthUser(u || null);
        }
        if(!u){
          PuGate.show();
          return;
        }
        PuGate.hide();
      });
    }
  }catch(e){}
