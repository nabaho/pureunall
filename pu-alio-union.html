  if(rootEl && window.PuAlioUnion){

      if(window.PuWhoami && document.getElementById('who')){
        PuWhoami.mount('#who');

      }
    }catch(e){}
    return false;
  }
  if(!mountWho()) document.addEventListener('DOMContentLoaded', mountWho);

      try{ firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
      firebase.auth().onAuthStateChanged(function(u){
        var outBtn = document.getElementById('outBtn');
        if(outBtn) outBtn.style.display = u ? '' : 'none';
        if(!u){
          PuGate.show();
          return;
        }
        PuGate.hide();
      });
    }
  }catch(e){}
