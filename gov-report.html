<!-- ══════════════════════════════════════════════════════════════
     푸른노무법인 컨설팅보고서 (gov-report.html) — 2026-10-10
     대표 지시 「포털 의뢰인 업무에 별도 앱을 만들어 진행」 · 시안 확인 후 「진행」.
     설계 docs/superpowers/specs/2026-10-10-gov-report-app-design.md · 계획 docs/superpowers/plans/2026-10-10-gov-report-app.md

     ★ 보고서는 «읽기만» 한다 — 모든 사업장·사업의 보고서 상태를 보고, 쓰는 일은
       정부사업일정의 보고서 창(gov-consulting.html#rpt=업체|사업)으로 건너가서 한다.
     ★ 이 화면이 쓰는 곳은 «하나»다 — 서류 진행 기록(③서명본·④별첨·⑤제출) 줄 하나씩:
       scal_docs/{업체}/{rid}/items/{줄 키} 를 .set (grSaveCell). 설계 docs/superpowers/specs/2026-10-10-gov-report-track-design.md
       scal_docs 규칙은 2026-10-11 부터 게시되어 돈다. 읽기가 거절되면(권한 없음) 읽기 전용으로 돈다(「기록을 못 불러왔습니다 — 규칙 게시 또는 권한 확인」).
       게시를 기다리는 것은 줄 안의 link 가지뿐 — 그 전에는 link 가 든 저장만 거절된다.
     ★ 받은 서류함(2026-10-11, 설계 docs/superpowers/specs/2026-10-11-gov-report-inbox-design.md) — 칸 창에 그 업체 «주소»로 오간
       첨부 메일 후보(메일함 거울 mailbox/* 머리글만 읽음). 「연결」은 위 줄 하나 .set 안의 link 한 칸 — 쓰는 곳은 여전히 하나.
       「열어 보기」는 서버 함수로 한 번에 한 건씩 받아 이 화면에서만 보고 버린다(저장·업로드·내려받기 없음).
     ★ 계산은 현황판 계산 모듈(순수 함수, 아래 script 로 싣는다)이 한다. 이 파일은 읽고 그린다.
     ⚠ 목록에는 업체·사업·담당 이름과 상태만 — 보고서 본문을 그리지 않는다(기술보호도 같다).
     ⚠ scal_cos 등은 GR_NODES 로 부른다(정부사업일정 FB_NODES 꼴) — 등록부 js/pu-ontology.js govreport 주석.
     ══════════════════════════════════════════════════════════════ -->
<style>
:root{
  --navy:#1e293b; --mute:#64748b; --line:#e2e8f0; --bg:#f8fafc; --card:#ffffff;

*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--navy);font-size:14px}
#head{position:sticky;top:0;z-index:20;background:var(--card);box-shadow:0 1px 3px rgba(15,23,42,.06)}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.top h1{font-size:17px;margin:0}

#who{font-size:13px;color:var(--mute)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--navy);border-radius:8px;padding:6px 12px}

main{max-width:1280px;margin:0 auto;padding:14px 16px 60px}
#lock{display:none;max-width:460px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center}
#lock p{color:var(--mute);font-size:13px}
.loading{padding:30px;text-align:center;color:var(--mute)}
.grid{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:14px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpi{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mute)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters select,.filters input[type=search]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card)}
.filters label{font-size:13px;display:flex;align-items:center;gap:4px}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{background:var(--bg);font-size:12px;color:var(--mute);font-weight:600}
td.co{font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis}
td.ty{max-width:220px;overflow:hidden;text-overflow:ellipsis}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.st{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px}
.st-todo{background:var(--red-bg);color:var(--red)}
.st-wait{background:var(--line);color:#475569}
.st-draft{background:var(--amber-bg);color:var(--amber)}
.st-done{background:var(--green-bg);color:var(--green)}
.tag,.tag-ai{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11px;border:1px solid var(--line);color:var(--mute)}
.tag-ai{background:var(--blue-bg);color:var(--blue-ink);border-color:var(--blue-line)}
.days{font-size:12px;color:var(--mute)}
.steps{display:inline-flex;gap:3px}
.stp{width:14px;height:6px;border-radius:3px;background:var(--line)}

.act{display:inline-block;font-size:12px;border:1px solid var(--blue-line);background:var(--blue-bg);color:var(--blue-ink);border-radius:8px;padding:4px 10px;text-decoration:none}

.tocb{margin-left:4px}

.toc-top{display:flex;align-items:center;gap:6px;margin-bottom:8px}

.toc-t{width:100%;min-height:160px;margin-top:8px;font:inherit;font-size:12px}
.cellb{border:0;background:none;padding:0;cursor:pointer}
.cw-f{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:13px}
.cw-f input,.cw-f select,.cw-f textarea{font-family:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card)}
.cw-c{display:flex;align-items:center;gap:6px;font-size:13px;margin:8px 0}
.cw-b{display:flex;justify-content:flex-end;margin-top:10px}
.ib{list-style:none;margin:6px 0 0;padding:0;max-height:320px;overflow:auto}
.ib>li{padding:6px 0;border-bottom:1px solid var(--line)}
.ib-h{font-size:12px;color:var(--mute)}
.ib-s{font-size:13px;margin:2px 0}
.ib-a{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;margin-top:3px}
.ib-a>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib-l{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;background:var(--blue-bg);border:1px solid var(--blue-line);border-radius:8px;padding:6px 8px;margin:4px 0}
.av-box{max-width:980px}

.av-img,.av-pdf{display:block;max-width:100%;margin:0 auto;background:var(--card)}

.av-stage td,.av-stage th{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.fm{padding:6px 0;border-bottom:1px solid var(--line)}

.yr.none{color:var(--mute)}

.err-s{font-size:12px;color:var(--red)}
.al-h{font-size:13px;margin:8px 0 4px}

@media (max-width:1100px){ .grid{grid-template-columns:220px minmax(0,1fr)} .side{grid-column:1 / -1} }

@media (max-width:640px){ input,select{font-size:16px} }
/* 폰에서 입력칸을 누를 때 화면이 확대되지 않게(tests/phone-input-zoom) */
@media (max-width:768px){ input,select,textarea{font-size:16px} }
</style>

/* 숫자 칸 — 누르면 그 상태로, 같은 칸을 다시 누르면 풀린다. 「전체」는 풀기. 「서명」「제출」은 서류 진행 기록으로 거른다(grView) */

/* 서류 체크표 — 고른 사업의 업체들. 간단형 셋(충남북부·서산·기술보호)만 ①② 를 현황판 상태로 채우고
   ③④⑤ 는 서류 진행 기록(scal_docs) — 칸을 누르면 칸 창(grOpenCell). 기록을 못 읽었으면 「—」이고 누를 수 없다
   (남의 기록을 모른 채 덮지 않게). 다른 틀은 근거 자료가 아직 없어 «서류 목차 보기» 줄만 둔다(설계서 §4) */
function grRenderDocs(){
  var D=PuGovReportDocs, T=PuGovReportTrack, el=$('docs');
  if(!GR.f.biz||!GR.docs.loaded||GR.docs.err){ el.style.display='none'; el.innerHTML=''; return; }
  var erp=grErp(GR.f.biz), tid=grBizType();
  var t=D.docsTable({erp:erp,typeId:tid,input:GR.input,rows:GR.rows,year:GR.f.year,consultings:GR.docs.cons,tmap:GR.docs.tmap,biz:GR.docs.biz,
    track:GR.track||undefined,today:GR.today});
  var btn=function(x,label){ return '<button type="button" class="act tocb" data-toc="1" data-co="'+grEsc(x.coId)+'" data-ty="'+grEsc(x.typeId)+'">'+label+'</button>'; };
  var chip=function(c){ return c.key?'<span class="st st-'+c.key+'">'+grEsc(c.txt)+'</span>':grEsc(c.txt); };
  var cell=function(x,c){
    return c.step?'<button type="button" class="cellb" data-cell="1" data-co="'+grEsc(x.coId)+'" data-ty="'+grEsc(x.typeId)+'" data-step="'+grEsc(c.step)+'" title="눌러서 기록">'+chip(c)+'</button>':chip(c);
  };
  var head='<div class="dc-h"><b>📋 서류 — '+grEsc(erp?erp.name:'')+'</b><span class="tag">'+grEsc(D.KIND_KO[t.plan.kind])+'</span>'
    +(t.plan.check?'<span class="tag-chk">[확인 필요: '+grEsc(t.plan.check)+']</span>':'')
    +((t.auto||t.big)&&GR.trackErr?'<span class="err-s">'+grEsc(T.LOAD_FAIL)+'</span>':'')+'</div>';
  var body;
  if(!tid) body='<div class="empty">'+grEsc(D.UNLINKED)+' — 사업 잇기는 정부사업일정의 ERP 연결에서</div>';
  else if(!t.lines.length) body='<div class="empty">'+grEsc(GR.f.year)+'년에 이 사업 업체가 없습니다</div>';
  else if(t.big){
    /* 대형 — 단계(항목)마다 한 열. 단계 칸은 칩이 있을 때만 단추(칸 창) · 키가 없으면 「—」 · 기록을 못 읽었으면 「?」 */
    var bcell=function(x,c){
      if(GR.trackErr) return '?';
      if(!c.chip) return '—';
      return '<button type="button" class="cellb" data-cell="1" data-co="'+grEsc(x.coId)+'" data-ty="'+grEsc(x.typeId)+'" data-step="'+grEsc(c.step)+'" data-item="'+grEsc(c.id)+'" title="눌러서 기록">'+chip(c.chip)+'</button>';
    };
    body='<div class="dc-wide"><table><thead><tr><th>업체</th>'+t.cols.map(function(c){ return '<th>'+grEsc(c)+'</th>'; }).join('')+'<th>다음 단계</th><th>기한</th><th></th></tr></thead><tbody>'
      +t.lines.map(function(x){
        return '<tr><td class="co" title="'+grEsc(x.coName)+'">'+grEsc(x.coName)+'</td>'+x.cells.map(function(c){ return '<td>'+bcell(x,c)+'</td>'; }).join('')
          +'<td>'+(GR.trackErr?'?':(x.next===undefined?'—':(x.next?grEsc(x.next.name):'모두 끝')))+'</td><td>'+grEsc(x.due||'—')+'</td><td>'+btn(x,'목차')+'</td></tr>';
      }).join('')+'</tbody></table></div>';
  }
  else if(t.auto) body='<table><thead><tr><th>업체</th>'+t.cols.map(function(c){ return '<th>'+grEsc(c)+'</th>'; }).join('')+'<th>기한</th><th></th></tr></thead><tbody>'
    +t.lines.map(function(x){
      return '<tr><td class="co" title="'+grEsc(x.coName)+'">'+grEsc(x.coName)+'</td>'+x.cells.map(function(c){ return '<td>'+cell(x,c)+'</td>'; }).join('')
        +'<td>'+grEsc(x.due||'—')+'</td><td>'+btn(x,'목차')+'</td></tr>';
    }).join('')+'</tbody></table>';
  else body=t.lines.map(function(x){ return '<div class="dc-l"><span>'+grEsc(x.coName)+'</span>'+btn(x,'서류 목차 보기')+'</div>'; }).join('');
  el.innerHTML=head+body; el.style.display='';
}
/* 목차 창 — 업체 한 곳·사업 하나. 이알피 사업은 왼쪽에서 고른 것, 안 골랐으면 이음표를 거꾸로 찾는다 */
function grOpenToc(coId,typeId){
  var D=PuGovReportDocs, d=GR.docs||{};
  var p=D.pairs(GR.input,typeId,GR.f.year).filter(function(x){ return x.coId===coId; })[0];
  if(!p) return;
  var erp=(GR.f.biz&&grBizType()===typeId)?grErp(GR.f.biz):D.erpTypeFor(typeId,d.biz,d.tmap);
  var row=GR.rows.filter(function(r){ return r.coId===coId&&r.typeId===typeId&&r.year===p.year; })[0]||null;
  var cons=D.consFor({consultings:d.cons,co:p.co,code:erp?erp.code:'',typeId:typeId,tmap:d.tmap,biz:d.biz});
  GR.toc=D.tocFor({pair:p,row:row,erp:erp,cons:cons,dir:d.dir,rec:GR.track?PuGovReportTrack.recOf(GR.track,coId,p.rid):undefined,today:GR.today});
  GR.tocMsg=''; GR.tocFail=false;
  grRenderToc();
}
function grRenderToc(){
  var D=PuGovReportDocs, t=GR.toc, el=$('toc');
  if(!t){ el.style.display='none'; el.innerHTML=''; return; }
  var h=t.head;
  var list=t.items.length?'<ol class="toc-l">'+t.items.map(function(x){
      return '<li><span>'+grEsc(x.name)+'</span> '
        +(x.chip.key?'<span class="st st-'+x.chip.key+'">'+grEsc(x.chip.txt)+'</span>':'<span class="days">'+grEsc(x.chip.txt)+'</span>')
        +(x.check?' <span class="tag-chk">'+grEsc(x.check)+'</span>':'')
        +(x.subs.length?'<ul>'+x.subs.map(function(s){ return '<li>'+grEsc(s)+'</li>'; }).join('')+'</ul>':'')+'</li>';
    }).join('')+'</ol>':'<div class="empty">'+grEsc(D.NO_PLAN)+' — 목차는 머리말만</div>';
  el.innerHTML='<div class="toc-box" role="dialog" aria-label="서류 목차">'
    +'<div class="toc-top"><b>목차 — '+grEsc(h.coName)+'</b><span class="sp"></span>'
    +'<button type="button" onclick="grCopyToc()">복사</button><button type="button" data-close onclick="grCloseToc()">닫기</button></div>'
    +'<div class="toc-h">사업: '+grEsc(h.bizName)+(h.agency?' ('+grEsc(h.agency)+')':'')+' · '+grEsc(D.KIND_KO[h.kind])
    +'<br>계약 기간: '+grEsc(h.period||'—')+' · 담당: '+grEsc(h.manager||'—')+' · 회차 '+grEsc(h.rounds)+'</div>'
    +h.warn.map(function(w){ return '<div class="tag-chk">'+grEsc(w)+'</div>'; }).join('')
    +list
    +(GR.tocMsg?'<div class="days">'+grEsc(GR.tocMsg)+'</div>':'')
    +(GR.tocFail?'<textarea class="toc-t" readonly>'+grEsc(D.tocText(t))+'</textarea>':'')
    +'</div>';
  el.style.display='';
}
/* 「복사」 — 보고서 별첨 목록·메일에 붙이기용 글. 못 하면 글 상자를 띄워 직접 고르게 한다 */
function grCopyToc(){
  if(!GR.toc) return Promise.resolve();
  var txt=PuGovReportDocs.tocText(GR.toc);
  var done=function(ok){ GR.tocMsg=ok?'복사했습니다 — 붙여 넣으세요':'복사하지 못했습니다 — 아래 글을 골라 복사해 주세요'; GR.tocFail=!ok; grRenderToc(); };
  try{ return navigator.clipboard.writeText(txt).then(function(){ done(true); },function(){ done(false); }); }
  catch(e){ done(false); return Promise.resolve(); }
}
function grCloseToc(){ GR.toc=null; GR.tocMsg=''; GR.tocFail=false; grRenderToc(); }
/* 칸 창 — 체크표 ③④⑤ 칸 하나. 그 칸의 서류가 여럿이면(기술보호 ④ = 자문 일지 회차 + 서약서·여비·만족도) 서류를 고른다.
   저장은 고른 줄 키 하나만. 기록을 못 읽었으면 열지 않는다 */
function grOpenCell(coId,typeId,step,itemId){
  var D=PuGovReportDocs, T=PuGovReportTrack, d=GR.docs||{};
  if(!GR.track||GR.trackErr) return;
  var p=D.pairs(GR.input,typeId,GR.f.year).filter(function(x){ return x.coId===coId; })[0];
  var erp=grErp(GR.f.biz);
  if(!p||!erp) return;
  var cons=D.consFor({consultings:d.cons,co:p.co,code:erp.code,typeId:typeId,tmap:d.tmap,biz:d.biz});
  var plan=D.planFor(erp.name), n=Math.max(+p.rounds||0,+p.planned||0);
  /* 대형 — 항목(itemId) 하나의 줄 키들(월별은 계약 기간의 달) · 간단형은 그 단계의 모든 서류 */
  var keys=itemId?T.keysForItem(plan,itemId,n,D.monthsFor(cons,p)):T.keysFor(plan,step,n);
  if(!keys.length) return;
  GR.cw={coId:coId,coName:p.coName,bizNo:String((p.co&&p.co.bizNo)||''),typeId:typeId,rid:p.rid,step:step,item:itemId||'',keys:keys,key:keys[0].key,draft:null,msg:'',err:false,busy:false,
    win:PuGovReportInbox.windowOf(p.firstDate,p.lastDate),cons:cons,biz:erp.name,tech:plan.key==='techguard',cands:[]};
  GR.avMsg=''; GR.avErr=false;
  grRenderCell();
  grLoadInbox();
}
function grPickCell(key){
  if(!GR.cw||!GR.cw.keys.some(function(k){ return k.key===key; })) return;
  GR.cw.key=key; GR.cw.draft=null; GR.cw.msg=''; GR.cw.err=false;
  grRenderCell();
}
/* 쓰기 자리에 들어갈 이름 점검 — 경로 글자·프로토타입 이름을 막는다(줄 키는 모듈 KEY_RE) */
function grOkId(k){ return typeof k==='string'&&!!k&&k.length<=100&&!/[\/.#$\[\]\s]/.test(k)&&k!=='__proto__'&&k!=='constructor'&&k!=='prototype'; }
function grCloseCell(){ GR.cw=null; grRenderCell(); }
function grRenderCell(){
  var T=PuGovReportTrack, L=PuGovReportList, c=GR.cw, el=$('cellw');
  if(!c){ el.style.display='none'; el.innerHTML=''; return; }
  var rec=T.recOf(GR.track||{},c.coId,c.rid)[c.key]||null, v=c.draft||rec||{st:'none'};
  var item=c.keys.filter(function(k){ return k.key===c.key; })[0]||c.keys[0];
  var opt=function(val,txt,cur){ return '<option value="'+grEsc(val)+'"'+(val===cur?' selected':'')+'>'+grEsc(txt)+'</option>'; };
  var field=function(name,inner){ return '<label class="cw-f"><span>'+name+'</span>'+inner+'</label>'; };
  var date=function(id,val){ return '<input type="date" id="'+id+'" value="'+grEsc(val||'')+'">'; };
  var h='<div class="toc-box" role="dialog" aria-label="서류 진행 기록">'
    +'<div class="toc-top"><b>'+grEsc(T.COL_KO[c.step])+(c.item?' · '+grEsc(item.name):'')+' — '+grEsc(c.coName)+'</b><span class="sp"></span>'
    +'<button type="button" data-close onclick="grCloseCell()">닫기</button></div>';
  if(c.keys.length>1) h+=field('서류','<select id="cwKey" onchange="grPickCell(this.value)">'+c.keys.map(function(k){ return opt(k.key,k.name,c.key); }).join('')+'</select>');
  else h+='<div class="toc-h">서류: '+grEsc(item.name)+'</div>';
  h+=field('상태','<select id="cwSt">'+T.ALLOWED[c.step].map(function(s){ return opt(s,T.label(c.step,s),v.st); }).join('')+'</select>');
  if(c.step==='sign') h+=field('발송일',date('cwSent',v.sentAt))+field('회신(스캔 받음)일',date('cwGot',v.gotAt));
  if(c.step==='plat'||c.step==='report') h+=field('완료일',date('cwGot',v.gotAt));
  if(c.step==='submit') h+=field('제출일',date('cwGot',v.gotAt))
    +field('제출 방식','<select id="cwHow">'+opt('','고르기',v.how||'')+Object.keys(T.HOW).map(function(k){ return opt(k,T.HOW[k],v.how||''); }).join('')+'</select>')
    +'<label class="cw-c"><input type="checkbox" id="cwAck"'+(v.ack?' checked':'')+'> 접수 확인</label>';
  /* ③ 서명본 칸만 — 받은 한글 파일(.hwp·.hwpx)을 «이 브라우저 안에서만» 열어 본다. 올리지도 저장하지도 않는다(grOpenHwp) */
  if(c.step==='sign') h+='<div class="cw-f"><span>받은 한글 파일</span><button type="button" onclick="grPickHwp()">📂 받은 한글 파일 열어 보기</button>'
    +'<input type="file" id="cwHwp" accept=".hwp,.hwpx" style="display:none" onchange="grOpenHwp(this)">'
    +'<div class="days" id="cwHwpMsg">고른 파일은 이 화면에서만 읽습니다 — 올리지도 저장하지도 않습니다</div></div>';
  if(c.step==='sign'||c.step==='submit'||c.step==='plat'||c.step==='report') h+='<div id="cwSend"></div>';
  h+=field('메모(200자)','<textarea id="cwNote" maxlength="200" rows="3">'+grEsc(v.note||'')+'</textarea>')
    +'<div class="days">메모에 연락처·주민번호 같은 개인정보를 적지 마세요</div>'
    +(rec&&rec.at?'<div class="days">고친 사람 '+grEsc(rec.by||'—')+' · '+grEsc(L.dayOf(rec.at))+'</div>':'')
    +(c.msg?'<div class="'+(c.err?'err-s':'days')+'">'+grEsc(c.msg)+'</div>':'')
    +'<div class="cw-b"><button type="button" onclick="grSaveCell()"'+(c.busy?' disabled':'')+'>저장</button></div><div id="cwInbox"></div></div>';
  el.innerHTML=h; el.style.display='';
  grRenderSend();
  grRenderInbox();
}
/* 저장 — 그 줄 키 하나만 .set(scal_docs/{업체}/{rid}/items/{키}). update 는 저장 관문이 «부분 update» 로 막는다.
   op 없음(「저장」) = 옛 link 를 이어 받는다 · op.link 가 있으면 그것(「연결」) · op.link 가 null 이면 뺀다(「연결 지우기」) — 받은 서류함 2026-10-11.
   거절되면(규칙 게시 전·권한 없음) 창에 알리고 값은 그대로 둔다. 되면 다시 읽지 않고 로컬 값으로 다시 그린다 */
async function grSaveCell(op){
  var T=PuGovReportTrack, c=GR.cw;
  if(!c||c.busy) return;
  var pk=c.coId+'/'+c.rid+'/'+c.key;
  if(!grOkId(c.coId)||!grOkId(c.rid)||!T.KEY_RE.test(c.key)||c.key.length>20||!c.keys.some(function(k){ return k.key===c.key; })){ c.msg=T.SAVE_FAIL; c.err=true; grRenderCell(); return; }
  if(GR.saving[pk]){ c.msg='같은 칸을 저장하는 중입니다 — 잠시 뒤에 다시 눌러 주세요'; c.err=true; grRenderCell(); return; }
  var entry={st:$('cwSt').value,note:$('cwNote').value,
    sentAt:c.step==='sign'?$('cwSent').value:'',gotAt:c.step==='attach'?'':$('cwGot').value,
    how:c.step==='submit'?$('cwHow').value:'',ack:c.step==='submit'&&!!$('cwAck').checked};
  entry.link=T.nextLink(T.recOf(GR.track||{},c.coId,c.rid)[c.key]||null,op);
  c.draft=entry;
  var bad=T.validate(entry,c.step);
  if(bad){ c.msg=bad; c.err=true; grRenderCell(); return; }
  var rec=T.patchFor(entry,GR.staffMap[GR.me]||'',Date.now());
  var base=GR.track;
  c.busy=true; GR.saving[pk]=true; c.msg='저장하는 중…'; c.err=false; grRenderCell();
  try{ await fbDb.ref(GR_TRACK_NODES.docs+'/'+c.coId+'/'+c.rid+'/items/'+c.key).set(rec); }
  catch(e){
    console.warn('[컨설팅보고서] 저장 못 함',e);
    delete GR.saving[pk];
    c.busy=false; c.msg=T.SAVE_FAIL; c.err=true;
    if(GR.cw===c) grRenderCell();
    return;
  }
  delete GR.saving[pk];
  var done=!op?'저장했습니다':(op.link?'연결했습니다':'연결을 지웠습니다');
  /* 저장하는 사이 다시 읽기가 시작·끝났거나 못 읽은 상태면(옛 기록 위에 덮지 않게) 로컬 표는 건드리지 않는다 */
  if(base&&GR.track===base&&!GR.trackErr){
    GR.track=T.put(GR.track,c.coId,c.rid,c.key,rec);
    c.busy=false; c.draft=null; c.msg=done; c.err=false;
    grApplyTrack(); grRender();
  }else{
    c.busy=false; c.msg=done+' — 목록을 다시 불러온 뒤 확인해 주세요'; c.err=false;
  }
  if(GR.cw===c) grRenderCell();
}
/* 📂 받은 한글 파일 열어 보기 — 고른 파일은 브라우저 안에서만 읽어 미리보기 창(PuHwpPreview)에 넘긴다. 어디에도 올리지·쓰지 않는다.
   안내는 글자(textContent)로만 — 파일 이름은 사람이 정한 데이터. 칸 창은 다시 그리지 않는다(적던 값 보존)
   ★ 파일을 잡자마자(await 전에) 고르기 칸을 비운다 — 불러오는 사이 창을 닫고 같은 파일을 다시 골라도 change 가 뜬다.
     잡아 둔 File 은 칸을 비워도 그대로 읽힌다.
   ★ 창을 닫았거나 다른 파일에 밀려 취소된 것(e.cancelled)은 실패가 아니다 — 안내 줄을 건드리지 않는다. */
function grPickHwp(){ var el=$('cwHwp'); if(el&&el.click) el.click(); }
async function grOpenHwp(input){
  var say=function(m,bad){ var e=$('cwHwpMsg'); if(e){ e.textContent=m; e.className=bad?'err-s':'days'; } return {ok:!bad,msg:m}; };
  var f=input&&input.files&&input.files[0];
  try{ if(input) input.value=''; }catch(e){}
  if(!f) return {ok:false};
  if(!/\.hwpx?$/i.test(String(f.name||''))) return say('한글(.hwp·.hwpx) 파일만 열 수 있습니다',true);
  if(!window.PuHwpPreview) return say('한글 미리보기를 불러오지 못했습니다 — 새로 고친 뒤 다시 눌러 주세요',true);
  try{
    var buf=await f.arrayBuffer();
    await window.PuHwpPreview.open(buf,f.name);
    return say('열었습니다 — '+f.name);
  }catch(e){
    if(e&&e.cancelled) return {ok:false,cancelled:true};
    console.warn('[컨설팅보고서] 한글 미리보기 실패',e);
    return say((e&&e.message)||'미리보기를 열지 못했습니다',true);
  }
}
/* ═══ 받은 서류함 — 칸 창 「📥 받은 서류 후보」·「연결」·「열어 보기」 (설계 docs/superpowers/specs/2026-10-11-gov-report-inbox-design.md) ═══
   ★ 칸 창을 다시 그리지 않는다 — #cwInbox 만 고친다(적던 값 보존). 쓰기는 grSaveCell 한 곳뿐(link 를 실어 보낸다).
   ★ 열어 보기는 한 번에 하나(GR.avBusy) — 지난 메일 POP3 가 동시 호출에 막힌다. 받은 바이트는 지역 변수로만, 저장·업로드 없음. */

/* 메일함 거울(폴더 표 + 폴더마다 최근 GR_MAIL.per 통의 머리글)과 업체관리를 «한 번» 읽는다. 본문·첨부는 읽지 않는다.
   업체관리를 못 읽은 것은 실패로 치지 않는다(이알피 계약 연락처로만 찾는다). 폴더를 못 읽으면 칸 창 안에 다시 시도 */
function grLoadInbox(force){
  if(!force&&GR.inboxP) return GR.inboxP;
  var seq=++GR.iseq;
  GR.inbox={st:'loading',rows:[],cos:null,clipped:false}; grRenderSend(); grRenderInbox();
  GR.inboxP=grReadInbox(seq);
  return GR.inboxP;
}
async function grReadInbox(seq){
  var I=PuGovReportInbox, N=GR_INBOX_NODES;
  try{
    var got=await Promise.all([fbDb.ref(N.folders).once('value').then(function(s){ return s.val(); }),
      fbDb.ref(N.cos).once('value').then(function(s){ return s.val(); },function(e){ console.warn('[컨설팅보고서] 못 읽음 '+N.cos,e); return null; })]);
    var folders=got[0]||{}, slugs=I.boxesOf(folders);
    var boxes=await Promise.all(slugs.map(function(s){
      return fbDb.ref(N.msgs+'/'+s).orderByKey().limitToLast(GR_MAIL.per).once('value').then(function(x){ return x.val()||{}; });
    }));
    if(seq!==GR.iseq) return;
    var msgs={}, clipped=false;
    slugs.forEach(function(s,i){ msgs[s]=boxes[i]; if(Object.keys(boxes[i]).length>=GR_MAIL.per) clipped=true; });
    GR.inbox={st:'ok',rows:I.mailRows(folders,msgs),cos:got[1],clipped:clipped};
  }catch(e){
    if(seq!==GR.iseq) return;
    console.warn('[컨설팅보고서] 메일함 못 읽음',e);
    GR.inbox={st:'err',rows:[],cos:null,clipped:false}; GR.inboxP=null;
  }
  grRenderSend(); grRenderInbox();
}
function grRetryInbox(){ return grLoadInbox(true); }
/* 칸 창 안 후보 자리 — 연결된 서류 · 후보 줄(받음/보냄·날짜·제목·딱지·첨부마다 열어 보기/연결) · 안내 */
function grRenderInbox(){
  var I=PuGovReportInbox, T=PuGovReportTrack, c=GR.cw, el=$('cwInbox'), ib=GR.inbox||{};
  if(!el) return;
  if(!c){ el.innerHTML=''; return; }
  var rec=T.recOf(GR.track||{},c.coId,c.rid)[c.key]||null, lk=rec&&rec.link, busy=!!GR.avBusy;
  var h='<div class="cw-f"><span>📥 받은 서류 후보</span><div class="days">'+grEsc(I.MSG.NAME_NOTE)+'</div>';
  if(lk) h+='<div class="ib-l"><b>연결된 서류</b><span>'+grEsc(lk.name||'(이름 없음)')+(lk.date?' · '+grEsc(lk.date):'')+'</span>'
    +'<button type="button" class="act" onclick="grOpenLinked()"'+(busy?' disabled':'')+'>열어 보기</button>'
    +'<button type="button" class="act" onclick="grUnlink()"'+(c.busy?' disabled':'')+'>연결 지우기</button></div>';
  if(ib.st==='err') h+='<div class="err-s">'+grEsc(I.MSG.LOAD_FAIL)+'</div><button type="button" onclick="grRetryInbox()">다시 시도</button>';
  else if(ib.st!=='ok') h+='<div class="days">메일함을 불러오는 중…</div>';
  else{
    var r=I.candidates(ib.rows,{addrs:I.addrsFor({companies:ib.cos,cons:c.cons,name:c.coName,bizNo:c.bizNo}),win:c.win,tech:c.tech});
    var list=(c.step==='sign'&&rec&&rec.sentAt)?PuGovReportSend.rankReplies(r.list,rec.sentAt):r.list;
    c.cands=list;
    if(r.noAddr) h+='<div class="days">'+grEsc(I.MSG.NO_ADDR)+'</div>';
    else if(!list.length) h+='<div class="days">'+grEsc(I.MSG.NONE)+'</div>';
    else h+='<ul class="ib">'+list.map(function(m,i){
      var tags=I.badges(m).map(function(b){ return ' <span class="st st-'+b.key+'">'+grEsc(b.txt)+'</span>'; }).join('')+(m.reply?' <span class="st st-draft">'+grEsc(PuGovReportSend.MSG.REPLY)+'</span>':'');
      var atts=m.atts.length?m.atts.map(function(a,j){
        return '<div class="ib-a"><span>📎 '+grEsc(a.name)+'</span>'+(m.priv?'':
          '<button type="button" class="act" onclick="grOpenCand('+i+','+j+')"'+(busy?' disabled':'')+(a.kind||a.cut?'':' title="'+grEsc(I.MSG.CANT)+'"')+'>열어 보기</button>'
          +'<button type="button" class="act" onclick="grLinkCand('+i+','+j+')"'+(c.busy||!m.key?' disabled':'')+'>연결</button>'
          +(m.reply&&c.step==='sign'?'<button type="button" class="act" onclick="grLinkReply('+i+','+j+')"'+(c.busy||!m.key?' disabled':'')+'>서명본으로 연결</button>':''))+'</div>';
      }).join(''):'<div class="days">첨부 '+grEsc(m.a)+'개 — 이름이 없어 메일함에서 받아 주세요</div>';
      return '<li><div class="ib-h">'+(m.out?'보냄 → ':'받음 ← ')+grEsc(m.who)+' · '+grEsc(m.day)+tags+'</div>'
        +'<div class="ib-s">'+grEsc(m.s||'(제목 없음)')+'</div>'+atts+'</li>';
    }).join('')+'</ul>'+(r.more?'<div class="days">'+grEsc(I.MSG.MORE)+'</div>':'');
    if(ib.clipped) h+='<div class="days">'+grEsc(I.MSG.CLIPPED)+'</div>';
  }
  if(GR.avMsg) h+='<div class="'+(GR.avErr?'err-s':'days')+'">'+grEsc(GR.avMsg)+'</div>';
  el.innerHTML=h+'</div>';
}
/* 「연결」 — 고른 후보의 첨부 하나를 지금 칸 창의 서류 줄에. 저장은 기존 한 곳(grSaveCell)이 칸 창 값과 함께 줄 하나 .set.
   규칙 게시 전에는 거절되어 「저장하지 못했습니다 — 규칙 게시 또는 권한 확인」(값은 그대로) */
function grLinkCand(i,j){
  var c=GR.cw, m=c&&c.cands?c.cands[i]:null, a=m?m.atts[j]:null;
  if(!m||!a||m.priv) return Promise.resolve();
  var lk=PuGovReportInbox.linkFrom(m,a.name);
  return lk?grSaveCell({link:lk}):Promise.resolve();
}
/* 「연결 지우기」 — link 만 뺀 줄을 같은 길로 다시 쓴다(서류 줄 상태는 칸 창 값 그대로) */
function grUnlink(){ return GR.cw?grSaveCell({link:null}):Promise.resolve(); }
/* ═══ 서명 요청·제출 메일 — 칸 창 #cwSend (설계 docs/superpowers/specs/2026-10-11-gov-report-sign-submit-design.md)
   ★ 쓰기는 grSaveCell 한 곳뿐 — 여기서는 칸 창 입력값을 채우고 그 길을 부른다. 메일은 «쓰기 창에 값을 채워 열기»까지(보내기는 사람). ═══ */
function grSendCtx(){
  var c=GR.cw; if(!c) return null;
  var D=PuGovReportDocs, T=PuGovReportTrack, S=PuGovReportSend, I=PuGovReportInbox, ib=GR.inbox||{};
  var item=c.keys.filter(function(k){ return k.key===c.key; })[0]||c.keys[0]||{};
  var plan=(D.planFor(c.biz).items||[]).filter(function(x){ return x.id===item.id; })[0]||{};
  var rec=T.recOf(GR.track||{},c.coId,c.rid)[c.key]||null;
  var addrs=(ib.st==='ok')?I.addrsFor({companies:ib.cos,cons:c.cons,name:c.coName,bizNo:c.bizNo}):null;
  return {c:c,item:item,plan:plan,rec:rec,ib:ib,addrs:addrs,tag:S.tagOf(c.step,c.rid)};
}
function grSay(m,bad){ var e=$('cwSendMsg'); if(e){ e.textContent=m; e.className=bad?'err-s':'days'; } }
function grRenderSend(){
  var x=grSendCtx(), el=$('cwSend');
  if(!el) return;
  if(!x||(x.c.step!=='sign'&&x.c.step!=='submit'&&x.c.step!=='plat'&&x.c.step!=='report')){ el.innerHTML=''; return; }
  var S=PuGovReportSend, c=x.c, v=c.draft||x.rec||{st:'none'}, done=v.st==='done', dayOk=function(d){ return /^\d{4}-\d{2}-\d{2}$/.test(d); };
  var h='<div class="cw-f"><span>'+(c.step==='sign'?'✉ 서명 요청':(c.step==='submit'?'✉ 제출 메일':'📝 단계 안내'))+'</span>';
  if(c.step==='sign'){
    if(x.ib.st==='ok'&&x.addrs&&!Object.keys(x.addrs).length) h+='<div class="days">'+grEsc(S.MSG.NO_ADDR)+'</div>';
    else if(!done) h+='<button type="button" onclick="grWriteMail()"'+(x.ib.st==='ok'?'':' disabled')+'>✉ 서명 요청 메일 쓰기</button>';
    var f=x.ib.st==='ok'?S.findSent(x.ib.rows,x.tag):null;
    if(!done&&x.ib.st==='ok'){
      if(f&&dayOk(f.day)&&(!x.rec||x.rec.sentAt!==f.day)) h+=' <button type="button" class="act" onclick="grMarkSent(\''+grEsc(f.day)+'\')">보낸 메일을 찾았습니다 — '+grEsc(f.day)+(f.count>1?' ('+f.count+'건 중 가장 이른 것)':'')+' · 보낸 날로 기록</button>';
      else if(!f&&(!x.rec||!x.rec.sentAt)) h+=' <button type="button" class="act" onclick="grMarkSent(\'\')">보냈음 기록(오늘)</button>';
    }
    h+='<div class="days">'+grEsc(S.MSG.ATTACH)+'</div><div class="days">'+grEsc(S.MSG.DL_NOTE)+'</div>'
      +'<div class="days"><a href="'+grEsc(PuGovReportList.reportHref(c.coId,c.typeId))+'" target="_blank" rel="noopener">보고서 창 열기(확정본 내려받기)</a></div>';
  }
  if(c.step==='submit'){
    if(x.plan.how==='mail'){
      var okIb=x.ib.st==='ok';
      if(!done) h+='<button type="button" onclick="grWriteSubmit()"'+(okIb?'':' disabled')+'>✉ 제출 메일 쓰기</button>';
      var fs=okIb?S.findSent(x.ib.rows,x.tag):null;
      if(!done&&okIb){
        if(fs&&dayOk(fs.day)&&(!x.rec||x.rec.gotAt!==fs.day)) h+=' <button type="button" class="act" onclick="grMarkSent(\''+grEsc(fs.day)+'\')">보낸 메일을 찾았습니다 — '+grEsc(fs.day)+(fs.count>1?' ('+fs.count+'건 중 가장 이른 것)':'')+' · 제출일로 기록</button>';
        else if(!fs&&(!x.rec||!x.rec.gotAt)) h+=' <button type="button" class="act" onclick="grMarkSent(\'\')">제출 보냄 기록(오늘)</button>';
      }
      h+='<div class="days">'+grEsc(S.MSG.ATTACH)+'</div><div class="days">'+grEsc(S.MSG.DL_NOTE)+'</div>';
    }else if(x.plan.how==='platform'&&Array.isArray(x.plan.steps)){
      h+='<ol class="days">'+x.plan.steps.map(function(t){ return '<li>'+grEsc(t)+'</li>'; }).join('')+'</ol>'
        +'<div class="days">로그인과 «제출» 단추는 사람이 합니다 — 접수 화면을 캡처해 두고 «접수 확인»에 표시하세요</div>';
    }else h+='<div class="days">제출 방식 확인 필요 — 운영지침 도착 뒤 정합니다</div>';
  }

/* 서버 부르기 — 취업규칙 화면과 같은 손(PuRulesMailOrig.makeCall: POST · Bearer 로그인 증표 · ok 가 아니면 status 를 단 오류).
   GR_MAIL.wait 안에 답이 없으면 TimeoutError(「메일 서버 응답이 없습니다」) — 그때 보낸 요청은 AbortController 로 끊는다(뒤에서 계속 받지 않게) */
function grMailFetch(url,init){
  var ac=(typeof AbortController==='function')?new AbortController():null;
  var opt=Object.assign({},init||{});
  if(ac) opt.signal=ac.signal;
  return new Promise(function(ok,no){
    var t=setTimeout(function(){ var e=new Error('응답이 없습니다'); e.name='TimeoutError'; no(e); if(ac){ try{ ac.abort(); }catch(x){} } },GR_MAIL.wait);
    fetch(url,opt).then(function(r){ clearTimeout(t); ok(r); },function(e){ clearTimeout(t); no(e); });
  });
}
function grMailCall(){
  return PuRulesMailOrig.makeCall({base:GR_MAIL.fn,fetch:grMailFetch,getToken:function(){
    var u=firebase.auth().currentUser;
    if(!u){ var e=new Error('로그인이 필요합니다'); e.status=401; throw e; }
    return u.getIdToken();
  }});
}
/* 「열어 보기」 — 후보 줄의 첨부 / 연결된 서류. 개인 자료는 열지 않는다 */

/* 한 건 받아 연다 — 한 번에 하나(GR.avBusy). 실패해도 칸 창은 그대로, 안내는 #cwInbox 에만.
   안내 줄은 «누른 그 칸 창»에만 — 받는 사이 다른 칸 창을 열었으면 그 창에는 적지 않는다(c=GR.cw).
   형식은 서버가 준 온 이름으로 정한다 — 거울 이름은 60자로 잘려 확장자가 없을 수 있다(PuGovReportInbox.findAtt).
   창이 닫혀 취소된 것(e.cancelled — 한글 미리보기)은 실패가 아니다 */
async function grOpenAtt(ref,name){
  var I=PuGovReportInbox, c=GR.cw, kind=I.kindOf(name), noHwp='한글 미리보기를 불러오지 못했습니다 — 새로 고친 뒤 다시 눌러 주세요';
  var say=function(m,bad){ if(GR.cw!==c) return; GR.avMsg=m; GR.avErr=!!bad; grRenderInbox(); };
  if(GR.avBusy) return {ok:false,busy:true};
  if(!ref||!name){ say(I.MSG.GONE,true); return {ok:false}; }
  if(!kind&&!I.mayBeCut(name)){ say(I.MSG.CANT,true); return {ok:false}; }
  if(kind==='hwp'&&!window.PuHwpPreview){ say(noHwp,true); return {ok:false}; }
  GR.avBusy=true; say(ref.kind==='pop'?I.MSG.WAIT_OLD:I.MSG.WAIT);
  try{
    var call=grMailCall();
    var f=await I.findAtt({call:call,ref:ref,name:name});
    kind=I.kindOf(f.name);
    if(!kind){ GR.avBusy=false; say(I.MSG.CANT,true); return {ok:false}; }
    if(kind==='hwp'&&!window.PuHwpPreview){ GR.avBusy=false; say(noHwp,true); return {ok:false}; }
    var got=await I.readAtt({call:call,ref:ref,att:f});
    await grShowAtt(kind,PuRulesMailOrig.b64ToBytes(got.b64),f.name);
    GR.avBusy=false; say('열었습니다 — '+f.name);
    return {ok:true};
  }catch(e){
    GR.avBusy=false;
    if(e&&e.cancelled){ say(''); return {ok:false,cancelled:true}; }
    console.warn('[컨설팅보고서] 받은 서류 열기 실패',e);
    say(I.errText(e),true);
    return {ok:false};
  }
}
/* 판독기를 «그때» 저장소 vendor/ 에서 싣는다 — 화면을 열 때 싣지 않는다 */
function grLib(src,ready){
  if(ready()) return Promise.resolve();
  return new Promise(function(ok,no){
    var s=document.createElement('script'); s.src=src;
    s.onload=function(){ if(ready()) ok(); else no(new Error('판독기를 쓸 수 없습니다')); };
    s.onerror=function(){ no(new Error('판독기를 불러오지 못했습니다')); };
    document.head.appendChild(s);
  });
}
/* 받은 바이트를 보여 준다 — 한글은 한글 미리보기 창, PDF 는 캔버스 그림(스크립트가 돌지 않게), 그림은 확장자로 정한 종류의 blob, 표는 첫 시트 앞 줄 */
async function grShowAtt(kind,bytes,name){
  var I=PuGovReportInbox;
  if(kind==='hwp'){ await window.PuHwpPreview.open(bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength),name); return; }
  grCloseAv();
  var a={kind:kind,name:name,url:'',pdf:null,page:1,pages:0,grid:null,sheet:'',sheets:0};
  if(kind==='img') a.url=URL.createObjectURL(new Blob([bytes],{type:I.imgType(name)}));
  else if(kind==='pdf'){
    await grLib('vendor/pdf.min.js?v=1',function(){ return !!window.pdfjsLib; });
    try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js?v=1'; }catch(e){}
    a.pdf=await window.pdfjsLib.getDocument({data:bytes,isEvalSupported:false}).promise;
    a.pages=Number(a.pdf.numPages||1);
  }else{
    await grLib('vendor/xlsx.full.min.js?v=1',function(){ return !!window.XLSX; });
    var wb=window.XLSX.read(bytes,{type:'array',sheetRows:I.SHEET_ROWS+1}), sh=wb.Sheets[wb.SheetNames[0]];
    a.grid=window.XLSX.utils.sheet_to_json(sh,{header:1,defval:''}).slice(0,I.SHEET_ROWS);
    a.sheet=String(wb.SheetNames[0]||''); a.sheets=wb.SheetNames.length;
  }

}
function grRenderAv(){

  }).join('')+'</table>';

/* PDF 한 쪽을 캔버스에 — 그린 «뒤»에 부른다. 그사이 창이 바뀌었으면 그리지 않는다 */
function grPdfDraw(){
  var a=GR.av, cv=$('avCanvas');
  if(!a||a.kind!=='pdf'||!a.pdf||!cv||!cv.getContext) return Promise.resolve();
  var want=a.page;
  return a.pdf.getPage(want).then(function(pg){
    if(GR.av!==a||a.page!==want) return;
    var box=((cv.parentNode&&cv.parentNode.clientWidth)||900)-28, v0=pg.getViewport({scale:1});
    var vp=pg.getViewport({scale:Math.min(2.2,Math.max(0.5,box/(v0.width||600)))});
    cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height);
    return pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  }).catch(function(e){ console.warn('[컨설팅보고서] PDF 쪽 그리기 실패',e); });
}
function grPdfPage(step){
  var a=GR.av;
  if(!a||!a.pages) return;
  var n=Math.min(a.pages,Math.max(1,a.page+step));

  a.page=n; grRenderAv();

    await Promise.all(L.reportKeys(input).map(function(x){
      return fbDb.ref('scal_reports/'+x.coId+'/'+x.rid).once('value').then(function(s){
        var v=s.val(); if(v){ reps[x.coId]=reps[x.coId]||{}; reps[x.coId][x.rid]=v; }
      });
    }));
    if(seq!==GR.seq) return;
    input.reports=reps;
    GR.rows=L.buildRows(input);
    GR.input=input;
    GR.staffMap=L.staffNames(input.staff);
    if(!GR.f.year) GR.f.year=GR.today.slice(0,4);
  }catch(e){ if(seq!==GR.seq) return; console.warn('[컨설팅보고서] 못 읽음',e); GR.err=String((e&&e.message)||e); GR.rows=[]; GR.input=null; }
  var idx=null, idxErr=false;
  try{ idx=(await fbDb.ref('scal_rptFormsIndex').once('value')).val()||{}; }
  catch(e){ idx=null; idxErr=true; }
  if(seq!==GR.seq) return;
  GR.index=idx; GR.indexErr=idxErr;
  GR.me='';
  if(!GR.err&&GR.email){
    var me='';
    try{ me=L.staffIdFor(input.staff,(await fbDb.ref('data/user_dir').once('value')).val(),GR.email); }catch(e){ me=''; }
    if(seq!==GR.seq) return;
    GR.me=me;
  }
  await grLoadDocs();
  if(seq!==GR.seq) return;
  await grLoadTrack();
  if(seq!==GR.seq) return;
  grApplyTrack();
  GR.loaded=true;
  grRender();
}
/* 왼쪽 패널 자료 — 하나라도 못 읽어도 오른쪽 목록은 돈다. 사업 목록을 못 읽은 것만 «오류»로 친다 */
async function grLoadDocs(){
  var seq=++GR.dseq, keys=Object.keys(GR_DOC_NODES);
  var got=await Promise.all(keys.map(function(k){
    return fbDb.ref(GR_DOC_NODES[k]).once('value').then(function(s){ return {ok:true,v:s.val()}; },
      function(e){ console.warn('[컨설팅보고서] 못 읽음 '+GR_DOC_NODES[k],e); return {ok:false,v:null}; });
  }));
  if(seq!==GR.dseq) return;
  var d={loaded:true,err:!got[keys.indexOf('biz')].ok};
  keys.forEach(function(k,i){ d[k]=got[i].v; });
  GR.docs=d;
}
async function grRetryDocs(){
  GR.docs={loaded:false,err:false}; grRenderBiz();
  await grLoadDocs();
  grApplyTrack();
  grRender();
}
/* 서류 진행 기록 — 통째로 한 번(once). 못 읽으면(규칙 게시 전·권한 없음) 체크표 ③④⑤ 만 읽기 전용 「—」, 나머지는 그대로 돈다 */
async function grLoadTrack(){
  var seq=++GR.tseq;
  try{ var t=PuGovReportTrack.normalize((await fbDb.ref(GR_TRACK_NODES.docs).once('value')).val()); if(seq!==GR.tseq) return; GR.track=t; GR.trackErr=false; }
  catch(e){ if(seq!==GR.tseq) return; console.warn('[컨설팅보고서] 못 읽음 '+GR_TRACK_NODES.docs,e); GR.track=null; GR.trackErr=true; }
}
/* 현황판 줄에 기록을 붙인다(r.trk · ③④ 막대) — 읽은 뒤 · 저장한 뒤 · 왼쪽 자료를 다시 읽은 뒤 */
function grApplyTrack(){
  var d=GR.docs||{};
  PuGovReportDocs.trackRows(GR.rows,{track:GR.track,input:GR.input,biz:d.biz,tmap:d.tmap,consultings:d.cons,today:GR.today});
}

/* ═══ 로그인 — 포털 앱과 같은 문 ═══ */
function grBoot(){
  $('kpis').addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('[data-st]'):null;
    if(!b||b.disabled) return;
    grSetStatus(b.getAttribute('data-st'));
  });
  Object.keys(GR_FIELDS).forEach(function(id){ $(id).addEventListener('change',function(){ GR.f[GR_FIELDS[id]]=this.value; grRender(); }); });
  $('fCo').addEventListener('input',function(){ GR.f.co=this.value; grRender(); });
  $('fMine').addEventListener('change',function(){ GR.f.mine=this.checked; grRender(); });
  $('fReset').addEventListener('click',grReset);
  $('biz').addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('[data-biz]'):null;
    if(b) grSetBiz(b.getAttribute('data-biz'));
  });
  ['rows','docs'].forEach(function(id){ $(id).addEventListener('click',function(e){
    var c=e.target&&e.target.closest?e.target.closest('[data-cell]'):null;
    if(c){ grOpenCell(c.getAttribute('data-co'),c.getAttribute('data-ty'),c.getAttribute('data-step'),c.getAttribute('data-item')||''); return; }
    var b=e.target&&e.target.closest?e.target.closest('[data-toc]'):null;
    if(b) grOpenToc(b.getAttribute('data-co'),b.getAttribute('data-ty'));
  }); });
  $('toc').addEventListener('click',function(e){ if(e.target===this) grCloseToc(); });
  $('cellw').addEventListener('click',function(e){ if(e.target===this) grCloseCell(); });
  $('attv').addEventListener('click',function(e){ if(e.target===this) grCloseAv(); });
  if(location.protocol==='file:'){ lock('file:// 로 열면 로그인할 수 없습니다 — 주소로 여세요'); return; }
  if(typeof firebase==='undefined'){ lock('인터넷이 필요합니다'); return; }
  if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
  fbDb=firebase.database();
  try{ firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
  firebase.auth().onAuthStateChanged(function(u){
    $('outBtn').style.display=u?'':'none';
    if(!u||u.isAnonymous){ PuGate.show(); return; }
    PuGate.hide();
    GR.email=String(u.email||'').toLowerCase();
    $('lock').style.display='none'; $('app').style.display='';
    grLoad();
  });
}
grBoot();
</script>
