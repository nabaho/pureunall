<!-- ══════════════════════════════════════════════════════════════
     푸른노무법인 컨설팅보고서 (gov-report.html) — 2026-10-10
     대표 지시 「포털 의뢰인 업무에 별도 앱을 만들어 진행」 · 시안 확인 후 「진행」.
     설계 docs/superpowers/specs/2026-10-10-gov-report-app-design.md · 계획 docs/superpowers/plans/2026-10-10-gov-report-app.md

     ★ 보고서는 «읽기만» 한다 — 모든 사업장·사업의 보고서 상태를 보고, 쓰는 일은
       정부사업일정의 보고서 창(gov-consulting.html#rpt=업체|사업)으로 건너가서 한다.
     ★ 사업 종결(2026-10-12, 계획 docs/superpowers/plans/2026-10-12-gov-report-nav-closed.md) — 쓰는 곳이 하나 더 있다: scal_bizState/{이알피 사업 코드}
       (종결 = 그 칸 .set grCloseBiz, 되돌리기 = 같은 칸에 closedFrom '9999' 표시 .set grReopenBiz — 저장 관문이 물리적 삭제(.remove)를 막으므로 지우지 않는다).
       규칙은 관리자·위임관리인만 허락한다. 읽기가 거절되면 «종결 없음»으로 돈다.
     ★ 서류 줄 쓰기는 «하나»다 — 서류 진행 기록(③서명본·④별첨·⑤제출) 줄 하나씩:
       scal_docs/{업체}/{rid}/items/{줄 키} 를 .set (grSaveCell). 설계 docs/superpowers/specs/2026-10-10-gov-report-track-design.md
       scal_docs 규칙은 2026-10-11 부터 게시되어 돈다. 읽기가 거절되면(권한 없음) 읽기 전용으로 돈다(「기록을 못 불러왔습니다 — 규칙 게시 또는 권한 확인」).
       게시를 기다리는 것은 줄 안의 link 가지뿐 — 그 전에는 link 가 든 저장만 거절된다.
     ★ 받은 서류함(2026-10-11, 설계 docs/superpowers/specs/2026-10-11-gov-report-inbox-design.md) — 칸 창에 그 업체 «주소»로 오간
       첨부 메일 후보(메일함 거울 mailbox/* 머리글만 읽음). 「연결」은 위 줄 하나 .set 안의 link 한 칸 — 쓰는 곳은 여전히 하나.
       「열어 보기」는 서버 함수로 한 번에 한 건씩 받아 이 화면에서만 보고 버린다(저장·업로드·내려받기 없음).
     ★ 계산은 현황판 계산 모듈(순수 함수, 아래 script 로 싣는다)이 한다. 이 파일은 읽고 그린다.
     ⚠ 목록에는 업체·사업·담당 이름과 상태만 — 보고서 본문을 그리지 않는다(기술보호도 같다).
     ⚠ scal_cos 등은 GR_NODES 로 부른다(정부사업일정 FB_NODES 꼴) — 등록부 js/pu-ontology.js govreport 주석.
     ══════════════════════════════════════════════════════════════ -->
<style>
:root{
  --navy:#1e293b; --mute:#64748b; --line:#e2e8f0; --bg:#f8fafc; --card:#ffffff;
  --blue:#2563eb; --blue-bg:#eff6ff; --blue-line:#bfdbfe; --blue-ink:#1e40af;
  --green:#166534; --green-bg:#f0fdf4; --amber:#854d0e; --amber-bg:#fffbeb; --red:#991b1b; --red-bg:#fef2f2;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--navy);font-size:14px}
#head{position:sticky;top:0;z-index:20;background:var(--card);box-shadow:0 1px 3px rgba(15,23,42,.06)}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.top h1{font-size:17px;margin:0}
.top .sp{flex:1}
#who{font-size:13px;color:var(--mute)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--navy);border-radius:8px;padding:6px 12px}
button:disabled{opacity:.5;cursor:default}
main{max-width:1280px;margin:0 auto;padding:14px 16px 60px}
#lock{display:none;max-width:460px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center}
#lock p{color:var(--mute);font-size:13px}
.loading{padding:30px;text-align:center;color:var(--mute)}
.grid{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:14px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpi{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mute)}
.kpi.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters select,.filters input[type=search]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card)}
.filters label{font-size:13px;display:flex;align-items:center;gap:4px}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{background:var(--bg);font-size:12px;color:var(--mute);font-weight:600}
td.co{font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis}
td.ty{max-width:220px;overflow:hidden;text-overflow:ellipsis}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.st{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px}
.st-todo{background:var(--red-bg);color:var(--red)}
.st-wait{background:var(--line);color:#475569}
.st-draft{background:var(--amber-bg);color:var(--amber)}
.st-done{background:var(--green-bg);color:var(--green)}
.tag,.tag-ai{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11px;border:1px solid var(--line);color:var(--mute)}
.tag-ai{background:var(--blue-bg);color:var(--blue-ink);border-color:var(--blue-line)}
.days{font-size:12px;color:var(--mute)}
.steps{display:inline-flex;gap:3px}
.stp{width:14px;height:6px;border-radius:3px;background:var(--line)}
.stp.on{background:var(--blue)}
.act{display:inline-block;font-size:12px;border:1px solid var(--blue-line);background:var(--blue-bg);color:var(--blue-ink);border-radius:8px;padding:4px 10px;text-decoration:none}
button.act{border-color:var(--line);background:var(--card);color:var(--mute)}
.empty{padding:30px;text-align:center;color:var(--mute)}

.bz-k{font-size:11px;color:var(--mute)}
.bz b{font-size:12px;font-variant-numeric:tabular-nums}
.bz-nm{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.bz-ag{display:block;font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.bz.on .bz-ag{color:var(--blue-ink)}
.bz.cl{color:var(--mute)}
.bz-d{font-size:12px;color:var(--mute);white-space:nowrap}
.bz-t{cursor:pointer;font-size:12px;font-weight:600;color:var(--mute);padding:4px 2px}
.yrs{display:flex;gap:4px;flex-wrap:wrap;background:var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.yrs button{flex:1;min-width:64px;border:0;background:transparent;color:var(--mute);border-radius:8px;padding:6px 0}

.yrs small{display:block;font-weight:400;font-size:12px;line-height:1.2}
.cl-bn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border:1px dashed var(--mute);border-radius:12px;padding:10px 14px;margin-bottom:10px}

.dc-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.dc-wide{overflow-x:auto}
/* 사업 대시보드 — 숫자 4칸(.dsh-k) · 단계 막대(.dsh-p) · 업체 점 줄(.dsh-l) · 대형 보드(.bd) — 색은 위 변수만 */
.dsh{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--bg)}
.dsh-v{display:flex;gap:4px;justify-content:flex-end;margin-bottom:8px}

.dsh-un{font-size:13px;color:var(--mute);padding:4px 0}
.dsh-ks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.dsh-k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.dsh-k b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.dsh-k span{font-size:12px;color:var(--mute)}
.dsh-k.bad{background:var(--red-bg);border-color:var(--red)}

.dsh-k.warn{background:var(--amber-bg);border-color:var(--amber)}
.dsh-k.warn b{color:var(--amber)}
.dsh-p{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:10px}
.dsh-pc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.dsh-pn{display:block;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsh-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin:4px 0}
.dsh-sd{background:var(--green)}
.dsh-sg{background:var(--amber)}
.dsh-sb{background:var(--red)}
.dsh-sn{background:var(--line)}
.dsh-pt{font-size:11px;color:var(--mute)}
.dsh-l{max-height:240px;overflow:auto;border-top:1px solid var(--line)}
.dsh-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.dsh-c{font-weight:600;min-width:90px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsh-d{display:inline-flex;gap:4px}
.dsh-m{font-size:12px;color:var(--mute)}
.dsh-b{border-radius:999px;padding:1px 8px;font-size:11px;background:var(--red-bg);color:var(--red)}
.dp{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--mute);background:var(--card)}
.dp-done{background:var(--green);border-color:var(--green)}
.dp-doing{background:var(--amber);border-color:var(--amber)}
.dp-blocked{background:var(--red);border-color:var(--red)}
.dp-na{border-style:dashed;border-color:var(--line)}
.dp-unknown{background:var(--line)}
.bd{display:flex;gap:8px;overflow-x:auto;align-items:flex-start;padding-bottom:6px}
.bd-col{flex:0 0 190px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px}
.bd-h{display:flex;justify-content:space-between;gap:4px;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px}
button.bd-card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:6px}
button.bd-card.bd-blk{border-left-color:var(--red)}
.bd-nm{display:block;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-sub{display:block;font-size:12px;color:var(--mute)}
.bz-al{min-width:18px;text-align:center;border-radius:999px;padding:0 6px;font-size:11px;font-weight:700;background:var(--red);color:var(--card)}

/* 오늘 할 일 첫 화면 — 탭 .td-tab · 사업 카드 띠 .td-strip/.td-biz · 할 일 묶음 .td-sec 와 줄 .td-task — 색은 위 변수만 */

.td-sh{font-size:12px;font-weight:600;color:var(--mute);margin:0 0 4px}

<div id="head">
  <div class="top">

function grRenderDocs(){

      }).join('')+'</tbody></table></div>';

    +t.lines.map(function(x){

/* 사업 대시보드 카드 — 숫자 4칸 · 단계 막대 · 업체 점 줄(대형은 표/보드 단추도). 읽어서 그리기만 한다(쓰기 없음).

function grDashHtml(t,S){

/* 왼쪽 「🎯 오늘 할 일」 — 같은 사업을 다시 누르면 풀리는 grSetBiz 와 헷갈리지 않게 사업을 직접 비운다 */

/* 할 일 목록·사업 카드 띠 — 결과는 GR.td = {model, strip, known, why:[안내 글], stripErr:''|'docs'|'tmap', skipped}. 못 만들면 null(첫 화면은 안내 한 줄, 나머지 화면은 그대로)
   known = 기록·사업 목록·이음표·계약을 모두 읽었는가(하나라도 못 읽었으면 기록이 있어야 아는 줄은 만들지 않는다). 사업 하나가 던지면 그 사업만 건너뛰고 known 은 그대로 — 대신 안내 한 줄.
   캐시 — 열쇠 = 연도 · 오늘 · 자료 버전(GR.dver: 불러오기·기록 저장·종결 때 오른다). 거르개·탭·사업 선택·검색은 열쇠에 없다(렌더마다 다시 세지 않는다) */
function grTodayCalc(){
  var L=PuGovReportList, T=PuGovReportTrack, D=PuGovReportDocs, N=PuGovReportNav, Dh=PuGovReportDash;
  if(!GR.loaded||!GR.input||typeof PuGovReportToday==='undefined'){ GR.td=null; GR.tdKey=''; return; }
  var key=GR.f.year+'|'+GR.today+'|'+GR.dver;
  if(GR.td&&GR.tdKey===key) return;
  GR.td=null; GR.tdKey='';
  try{
    var d=GR.docs||{}, bad=d.bad||{}, cl=grClosedTypes(GR.f.year,false), live=function(r){ return !cl[r.typeId]; };
    var docsOk=!!d.loaded&&!d.err, trackOk=!GR.trackErr&&!!GR.track, tmapOk=!bad.tmap, consOk=!bad.cons;
    var known=docsOk&&trackOk&&tmapOk&&consOk, skipped=0, why=[];
    if(!trackOk) why.push('기록을 못 불러와 일부 할 일을 알 수 없습니다 — 서명 회신·기한·막힌 단계는 기록을 읽어야 나옵니다');
    if(!docsOk) why.push('사업 목록을 못 불러와 일부 할 일을 알 수 없습니다 — 막힌 단계·기한은 사업 목록을 읽어야 나옵니다');
    else if(!tmapOk) why.push('푸른이알피 사업 연결(이음표)을 못 불러와 일부 할 일을 알 수 없습니다 — 사업별 줄을 만들 수 없습니다');
    else if(!consOk) why.push('계약 정보를 못 불러와 일부 할 일을 알 수 없습니다 — 기한을 알 수 없습니다');
    var rows=L.filterRows(GR.rows,{year:GR.f.year}).filter(live);
    var a=L.alerts(rows,GR.today), x=T.alertsExtra(rows,GR.today);
    var blocked=known?D.blockedAlerts({input:GR.input,year:GR.f.year,track:GR.track,biz:d.biz,tmap:d.tmap,consultings:d.cons}).filter(live):[];
    var lines=[], strip=[];
    if(docsOk&&tmapOk) N.build({biz:d.biz,tmap:d.tmap,input:GR.input,year:GR.f.year,state:GR.bizState}).open.forEach(function(it){
      var S=null, tn='';
      try{
        var ps=D.pairs(GR.input,it.typeId,GR.f.year);
        tn=ps.length?ps[0].typeName:'';
        var t=D.docsTable({erp:it,typeId:it.typeId,input:GR.input,rows:GR.rows,year:GR.f.year,consultings:d.cons,tmap:d.tmap,biz:d.biz,track:GR.track||undefined,today:GR.today});
        S=((t.big||t.auto)&&t.lines.length)?Dh.summarize(t,{trackKnown:known,today:GR.today}):null;
      }catch(e){ console.warn('[컨설팅보고서] 오늘 할 일 — 사업 하나를 건너뜀',e); S=null; skipped++; }
      if(S) S.lines.forEach(function(l){ lines.push({coId:l.coId,typeId:l.typeId,coName:l.coName,typeName:tn,bizName:it.name,due:l.due,dueDays:l.dueDays,finished:l.finished}); });
      else lines.push({coId:'',typeId:it.typeId,coName:'',typeName:tn,bizName:it.name,due:'',dueDays:null,finished:false});   /* 사업 이름만 알려 주는 자리 — 할 일이 되지는 않는다 */
      strip.push({code:it.code,name:it.label.name,agency:it.label.agency,kind:it.kind,n:it.count,cols:S?S.cols:[],blockedN:S?S.kpi.blocked:0,soonN:S?S.kpi.soon:0,known:S?S.known:false,hasPlan:!!S});
    });
    if(skipped) why.push('일부 사업을 읽지 못했습니다 — 그 사업의 단계·기한 줄은 목록에 나오지 않습니다('+skipped+'곳)');
    GR.td={model:PuGovReportToday.build({alerts:a,extra:x,blocked:blocked,lines:lines,known:known,today:GR.today,soonDays:7}),strip:PuGovReportToday.stripOf(strip),known:known,why:why,stripErr:!docsOk?'docs':(!tmapOk?'tmap':''),skipped:skipped};
    GR.tdKey=key;
  }catch(e){ console.warn('[컨설팅보고서] 오늘 할 일을 못 셈',e); GR.td=null; GR.tdKey=''; }
}
/* 탭 줄·첫 화면·숫자 칸·거르개·표·오른쪽 챙길 것의 보임/숨김 — 사업을 고르면(GR.f.biz) 탭 줄도 숨는다. 렌더는 그대로, 보이기만 바꾼다 */
function grApplyTodayView(){
  var home=GR.f.biz==='', today=home&&GR.tab==='today';
  $('tdTabs').style.display=home?'':'none';
  $('today').style.display=today?'':'none';
  ['kpis','filters','tbl'].forEach(function(id){ $(id).style.display=today?'none':''; });
  if(today) $('docs').style.display='none';
  $('alertsSec').style.display=today?'none':'';
}
function grRenderToday(){
  var t=GR.td, d=GR.docs||{}, el=$('today');
  var head={hot:'🔥 급함',mid:'⏳ 챙기기',low:'📝 이번 주'};
  $('tdTabs').innerHTML=[['today','🎯 오늘 할 일'+(t?' <b>'+grEsc(t.model.total)+'</b>':'')],['all','📋 전체 현황']].map(function(v){
    var on=GR.tab===v[0];
    return '<button type="button" role="tab" class="td-tab'+(on?' on':'')+'" data-tab="'+v[0]+'" aria-selected="'+on+'">'+v[1]+'</button>';
  }).join('');
  if(!t){
    el.innerHTML='<div class="days">'+(GR.loaded?'오늘 할 일을 계산하지 못했습니다 — 「📋 전체 현황」에서 확인해 주세요':'불러오는 중…')+'</div>';
    grApplyTodayView(); return;
  }
  var m=t.model, me=GR.staffMap[GR.me];
  var sec=function(lv){
    var r=PuGovReportToday.more(m[lv],8,GR.todayMore[lv]);
    if(!r.rows.length) return '';
    return '<div class="td-sec '+lv+'"><div class="td-h">'+head[lv]+' <b>'+grEsc(m[lv].length)+'</b></div>'
      +r.rows.map(function(x){ return grTodayTask(x,!!grErpFor(x.typeId)); }).join('')
      +(r.rest>0?'<div class="td-mo"><button type="button" class="act" data-td-more="'+lv+'">더 보기 (+'+grEsc(r.rest)+')</button></div>':'')+'</div>';
  };
  el.innerHTML='<p class="td-lead">오늘 '+grEsc(GR.today)+(me?' · '+grEsc(me):'')+' — 급한 것부터</p>'
    +(t.why||[]).map(function(w){ return '<div class="td-note">'+grEsc(w)+'</div>'; }).join('')
    +'<div class="td-sh">📂 사업별 진행 — 눌러서 열기</div>'+grTodayStrip(t.strip,t.stripErr)
    +((m.total===0&&t.known&&!t.skipped)?'<div class="td-empty">오늘 급한 일이 없습니다</div>':'')
    +sec('hot')+sec('mid')
    +'<div class="td-sec inbox"><div class="td-h">📬 받은 서류</div><div class="td-ib" id="tdInbox">'+grTodayInboxHtml()+'</div></div>'
    +sec('low');
  grApplyTodayView();
}
/* 할 일 한 줄 — 아이콘 칸 + 본문(문장·근거·딱지) + 단추. 이알피 사업을 찾으면 「서류 열기」 단추, 못 찾으면 정부사업일정 보고서 창 링크 */
function grTodayTask(t,erp){
  var ic={hot:'🔥',mid:'⏳',low:'📝'}[t.level]||'•';
  var go=erp
    ?'<button type="button" class="act" data-td-open="1" data-co="'+grEsc(t.coId)+'" data-ty="'+grEsc(t.typeId)+'">서류 열기</button>'
    :'<a class="act" href="'+grEsc(PuGovReportList.reportHref(t.coId,t.typeId))+'" title="푸른이알피 사업 연결이 없어 정부사업일정의 보고서 창으로 갑니다">서류 열기</a>';

    +(t.meta?'<div class="td-me">'+grEsc(t.meta)+'</div>':'')
    +'<div class="td-tg">'+t.tags.map(function(g){ return '<span class="tag">'+grEsc(g)+'</span>'; }).join(' ')+'</div></div>'+go+'</div>';

/* 사업 카드 띠 — 사업 이름 · (수행기관) · 단계 누적 막대(기록을 읽었고 서류 틀이 있을 때만) · 한 줄. 누르면 그 사업(data-biz) */
function grTodayStrip(strip,err){
  /* 사업 목록·이음표를 못 읽으면 «진행 사업이 없습니다» 가 아니라 못 읽었다고 말한다 — 다시 시도는 기존 grRetryDocs */
  if(err) return '<div class="td-note">'+(err==='tmap'?'푸른이알피 사업 연결을 못 불러와 사업 카드를 만들 수 없습니다':'사업 목록을 못 불러왔습니다')+'</div>'
    +'<div class="td-mo"><button type="button" onclick="grRetryDocs()">다시 시도</button></div>';
  if(!strip.length) return '<div class="days">'+grEsc(GR.f.year)+'년에 업체가 있는 진행 사업이 없습니다</div>';
  return '<div class="td-strip">'+strip.map(function(s){
    var b=s.bar, bar='';
    if(b) bar='<div class="dsh-bar" title="'+grEsc('단계 칸 — 완료 '+b.done+'% · 진행 '+b.doing+'% · 막힘 '+b.blocked+'% · 미착수 '+b.none+'%')+'">'
      +[['done','dsh-sd'],['doing','dsh-sg'],['blocked','dsh-sb'],['none','dsh-sn']].map(function(p){ return b[p[0]]?'<i class="'+p[1]+'" style="flex:'+grEsc(b[p[0]])+'"></i>':''; }).join('')+'</div>';
    return '<button type="button" class="td-biz td-'+grEsc(s.tone)+'" data-biz="'+grEsc(s.code)+'" title="'+grEsc(s.label.name+' ('+s.label.agency+')')+'">'
      +'<span class="td-bn">'+grEsc(s.label.name)+'</span><span class="td-ba">('+grEsc(s.label.agency)+')</span>'+bar
      +'<span class="td-bt">'+grEsc(b?'업체 '+s.n+'곳 · '+s.note:s.note)+'</span></button>';
  }).join('')+'</div>';
}
/* 받은 서류 묶음 — 전역 받은 서류 확인(GR.gi)의 상태를 따른다. 읽지 않았으면 안내 + 「📥 확인」(누를 때만 읽는다), 읽었으면 건수 + 처음 5건 */
function grTodayInboxHtml(){
  var I=PuGovReportInbox, g=GR.gi||{};
  var btn=function(label){ return '<button type="button" onclick="grGlobalInbox()"'+(GR.loaded?'':' disabled')+'>'+label+'</button>'; };
  if(g.st==='loading') return '<div class="days">불러오는 중…</div>';
  if(g.st!=='ok'){
    return (g.msg?'<div class="err-s">'+grEsc(g.msg)+'</div>':'')
      +'<div class="days">최근 '+I.GLOBAL_DAYS+'일 안에 받은 첨부 메일 가운데 아직 서류 줄에 연결하지 않은 것을 찾습니다</div>'+btn('📥 확인');
  }
  var list=g.list||[], h='<div class="days">연결 안 된 받은 서류 '+list.length+'건 · 최근 '+I.GLOBAL_DAYS+'일 · '+grEsc(g.year)+'년 사업 기준</div>';
  if(!list.length) return h+'<div class="days">연결할 새 받은 서류가 없습니다</div>';
  h+='<ul class="ib">'+list.slice(0,5).map(function(m,i){
    var who=String(m.who||'').indexOf('@')>=0?'(보낸이 이름 없음)':m.who;   /* 거울이 주소를 대신 넣으면 그리지 않는다 */
    return '<li><div class="ib-h">받음 ← '+grEsc(who)+' · '+grEsc(m.day)+' · '+grEsc(m.coName)+' · '+grEsc(m.typeName)+'</div><div class="ib-s">'+grEsc(m.s||'(제목 없음)')+'</div>'
      +(m.step?'<div class="ib-a"><button type="button" class="act" onclick="grOpenFromInbox('+i+')">서류 칸 열기</button></div>':'')+'</li>';
  }).join('')+'</ul>';
  if(list.length>5) h+='<div class="days">처음 5건만 보입니다 — 전체는 오른쪽 📥 받은 서류 확인</div>';
  return h;
}
/* 받은 서류 확인 상태가 바뀔 때(불러오는 중·결과·오류) 첫 화면 묶음만 다시 그린다 */

/* 「더 보기」 — 그 묶음을 전부 보인다 */

/* 이 일정 사업에 이어진 이알피 사업 — 이 해에 종결되지 않은 첫째. 없으면(모두 종결) erpTypeFor 의 첫째(그때는 종결 배너가 정상). 줄 그리기와 「서류 열기」가 같은 판정을 쓴다 */
function grErpFor(typeId){
  var D=PuGovReportDocs, N=PuGovReportNav, d=GR.docs||{}, first=D.erpTypeFor(typeId,d.biz,d.tmap);
  if(!first) return null;
  var live=D.visibleTypes(d.biz).filter(function(t){ return String(d.tmap[t.code]==null?'':d.tmap[t.code]).trim()===typeId&&!N.closedFor(GR.bizState,t.code,GR.f.year); })[0];
  return live||first;
}
/* 「서류 열기」 — 그 사업을 왼쪽에서 고르고(이미 고른 사업은 grSetBiz 가 다시 누르면 푸니 건드리지 않는다) 그 업체의 목차 창을 연다. 이알피 사업을 못 찾으면 아무것도 안 한다(그런 줄은 링크로 그린다) */
function grOpenTask(coId,typeId){
  var erp=grErpFor(typeId);
  if(!erp) return;
  if(GR.f.biz!==erp.code) grSetBiz(erp.code);
  grOpenToc(coId,typeId);
}
/* 종결된 사업(고른 해 기준)을 골랐을 때 서류 패널 위 배너 — 종결일·사유·처리자 + 「↩ 되돌리기」 */
function grClosedBanner(){
  var st=grBizState(GR.f.biz);
  if(!st) return '';
  return '<div class="cl-bn">🗄 <div class="cl-bt"><b>종결된 사업입니다.</b> '+grEsc(grClosedText(st))
    +(st.reason?' · 사유: '+grEsc(st.reason):'')+(st.by?' · 종결 처리: '+grEsc(st.by):'')
    +'<div class="days">다른 사업의 숫자·알림에서는 빠져 있습니다 — 이 사업은 골라서 보는 동안 행·숫자가 보이고, 기록은 그대로 읽고 고칠 수 있습니다.</div>'
    +(GR.bmsg?'<div class="err-s">'+grEsc(GR.bmsg)+'</div>':'')+'</div>'
    +'<button type="button" class="act" data-cm="reopen"'+(GR.bbusy?' disabled':'')+'>↩ 진행 사업으로 되돌리기</button></div>';

/* 목차 창 — 업체 한 곳·사업 하나. 이알피 사업은 왼쪽에서 고른 것, 안 골랐으면 이음표를 거꾸로 찾는다 */
function grOpenToc(coId,typeId){
  var D=PuGovReportDocs, d=GR.docs||{};
  var p=D.pairs(GR.input,typeId,GR.f.year).filter(function(x){ return x.coId===coId; })[0];
  if(!p) return;
  var erp=(GR.f.biz&&grBizType()===typeId)?grErp(GR.f.biz):D.erpTypeFor(typeId,d.biz,d.tmap);
  var row=GR.rows.filter(function(r){ return r.coId===coId&&r.typeId===typeId&&r.year===p.year; })[0]||null;
  var cons=D.consFor({consultings:d.cons,co:p.co,code:erp?erp.code:'',typeId:typeId,tmap:d.tmap,biz:d.biz});
  GR.toc=D.tocFor({pair:p,row:row,erp:erp,cons:cons,dir:d.dir,rec:GR.track?PuGovReportTrack.recOf(GR.track,coId,p.rid):undefined,today:GR.today});
  GR.tocMsg=''; GR.tocFail=false;
  grRenderToc();
}
function grRenderToc(){
  var D=PuGovReportDocs, t=GR.toc, el=$('toc');
  if(!t){ el.style.display='none'; el.innerHTML=''; return; }
  var h=t.head;
  var list=t.items.length?'<ol class="toc-l">'+t.items.map(function(x){
      return '<li><span>'+grEsc(x.name)+'</span> '
        +(x.chip.key?'<span class="st st-'+x.chip.key+'">'+grEsc(x.chip.txt)+'</span>':'<span class="days">'+grEsc(x.chip.txt)+'</span>')
        +(x.check?' <span class="tag-chk">'+grEsc(x.check)+'</span>':'')
        +(x.subs.length?'<ul>'+x.subs.map(function(s){ return '<li>'+grEsc(s)+'</li>'; }).join('')+'</ul>':'')+'</li>';
    }).join('')+'</ol>':'<div class="empty">'+grEsc(D.NO_PLAN)+' — 목차는 머리말만</div>';
  el.innerHTML='<div class="toc-box" role="dialog" aria-label="서류 목차">'
    +'<div class="toc-top"><b>목차 — '+grEsc(h.coName)+'</b><span class="sp"></span>'
    +'<button type="button" onclick="grCopyToc()">복사</button><button type="button" data-close onclick="grCloseToc()">닫기</button></div>'
    +'<div class="toc-h">사업: '+grEsc(h.bizName)+(h.agency?' ('+grEsc(h.agency)+')':'')+' · '+grEsc(D.KIND_KO[h.kind])
    +'<br>계약 기간: '+grEsc(h.period||'—')+' · 담당: '+grEsc(h.manager||'—')+' · 회차 '+grEsc(h.rounds)+'</div>'
    +h.warn.map(function(w){ return '<div class="tag-chk">'+grEsc(w)+'</div>'; }).join('')
    +list
    +(GR.tocMsg?'<div class="days">'+grEsc(GR.tocMsg)+'</div>':'')
    +(GR.tocFail?'<textarea class="toc-t" readonly>'+grEsc(D.tocText(t))+'</textarea>':'')
    +'</div>';
  el.style.display='';
}
/* 「복사」 — 보고서 별첨 목록·메일에 붙이기용 글. 못 하면 글 상자를 띄워 직접 고르게 한다 */
function grCopyToc(){
  if(!GR.toc) return Promise.resolve();
  var txt=PuGovReportDocs.tocText(GR.toc);
  var done=function(ok){ GR.tocMsg=ok?'복사했습니다 — 붙여 넣으세요':'복사하지 못했습니다 — 아래 글을 골라 복사해 주세요'; GR.tocFail=!ok; grRenderToc(); };
  try{ return navigator.clipboard.writeText(txt).then(function(){ done(true); },function(){ done(false); }); }
  catch(e){ done(false); return Promise.resolve(); }
}

  var ok=grChapAsk('✨ AI 초안\n\n업체 자료가 외부 AI(Google Gemini)로 전송됩니다 — 가림 처리 후\n'
    +'(업체 이름은 자리 표시로 바꾸고, 이알피 계약이 연결된 업체는 대표자·담당자 이름도 자리 표시로 바꿉니다. 전화·메일·주민번호·계좌·사업자번호는 [가림]으로 지웁니다. '
    +'급여·명부 같은 개인 자료와 첨부 원본은 보내지 않습니다.)\n\n계속할까요? (이 브라우저에서 한 번만 묻습니다)');
  if(ok){ try{ localStorage.setItem(GR_AI.ok,'1'); }catch(e){} }
  return !!ok;
}
/* 보내기부터 답 글자까지 한 덩어리로 90초 안에 — 본문이 멈춰도 끊긴다. 모델 대체는 서버가 한다 */
function grChapCall(system,messages){
  var noLogin=function(){ var e=new Error(GR_AI.msg.login); e.noLogin=true; return Promise.reject(e); };
  if(typeof PuAiCall==='undefined'||!PuAiCall||typeof PuAiCall.ask!=='function') return noLogin();
  var auth=null;
  try{ auth=(typeof firebase!=='undefined'&&firebase&&firebase.auth)?firebase.auth():null; }catch(e){ auth=null; }
  if(!auth||!auth.currentUser) return noLogin();
  var user=String((messages&&messages[0]&&messages[0].content)||'');
  var parts=[{text:String(system||'')},{text:user}];
  var timer=null;
  var limit=new Promise(function(_,rej){ timer=setTimeout(function(){ var t=new Error(GR_AI.msg.net+' ('+Math.round(GR_AI.wait/1000)+'초)'); t.timeout=true; rej(t); },GR_AI.wait); });
  var work=Promise.resolve().then(function(){
    return PuAiCall.ask(parts,{auth:auth,app:'erp',generationConfig:{temperature:0.2,maxOutputTokens:8192}});
  }).then(function(reply){
    var t=PuAiCall.textOf(reply);
    if(!t) throw new Error('AI 응답이 비어 있습니다');
    return t;
  });
  work.catch(function(){});
  return Promise.race([work,limit]).then(function(t){ clearTimeout(timer); return t; },
    function(e){ clearTimeout(timer); throw e; });
}
/* 실패 문구 — 로그인·월 한도·못 읽음·그 밖(끊김·망) */
function grChapErrMsg(e){
  if(e&&e.noLogin) return GR_AI.msg.login;
  if(e&&e.overBudget) return GR_AI.msg.budget;
  if(e&&(e.status===401||e.status===403)) return GR_AI.msg.login;
  if(e&&e.parse) return GR_AI.msg.parse;
  return GR_AI.msg.net;
}
/* 자리 표시로 바꿀 이름 — 이알피 계약의 업체명(두 곳)·대표자·담당자(주담당은 [담당자], 다른 사람은 [담당자2]…). 사업장 이름은 모듈이 company.name 으로 넣는다.
   gov-consulting 의 grpAiNames 와 같은 규칙인데, 거기서는 주담당을 보고서 모듈이 가려 주므로 여기서는 주담당도 직접 넣는다 */
function grChapNames(c){
  var cons=(c&&c.cons)||{}, cc=(cons.company&&typeof cons.company==='object')?cons.company:{}, out=[];
  var add=function(v,as){ var s=String(v==null?'':v).trim(); if(s) out.push({v:s,as:as}); };
  add(cc.name,'[해당 기업]'); add(cons.companyName,'[해당 기업]'); add(cc.ceo,'[대표자]');
  var ct=Array.isArray(cc.contacts)?cc.contacts:[], prim=null;
  ct.forEach(function(x){ if(!prim&&x&&x.isPrimary) prim=x; });
  if(!prim&&ct.length) prim=ct[0];
  var pn=String((prim&&prim.name)||'').trim();
  add(pn,'[담당자]');
  var n=1;
  ct.forEach(function(x){
    var nm=String((x&&x.name)||'').trim();
    if(!nm||nm===pn) return;
    n++; add(nm,'[담당자'+n+']');
  });
  return out;
}
/* 이알피 계약이 연결돼 대표자·담당자 이름을 «알고» 있는가 — 모르면 사업장 이름만 가려진다(메모 속 사람 이름은 못 가린다) */
function grChapLinked(c){
  var cons=(c&&c.cons)||null;
  if(!cons) return false;
  var cc=(cons.company&&typeof cons.company==='object')?cons.company:{};
  var ct=Array.isArray(cc.contacts)?cc.contacts:[];
  return !!String(cc.ceo||'').trim()||ct.some(function(x){ return !!String((x&&x.name)||'').trim(); });
}
/* 재료 — 회차는 목록이 «보는» 그 회차들(D.pairs 와 같은 거름: 그 업체·사업의 사전진단 아닌 일정 중 날짜 꼴인 것, 날짜순),
   회차 기록(rd)은 이 rid 의 rd 항목(round·mdlog) 줄 round:N·mdlog:N 의 저장된 rd 를 회차 번호 순서대로(없으면 생략), 서류 메모는 칸 창 입력칸(#cwNote)의 «지금 값»(저장 전이어도) — 입력칸이 없으면 저장된 메모.
   급여·명부·첨부·메일은 읽지 않는다 */
function grChapInput(c){
  var D=PuGovReportDocs, T=PuGovReportTrack;
  var recs=T.recOf(GR.track||{},c.coId,c.rid), plan=D.planFor(c.biz);
  var rdItem=((plan&&plan.items)||[]).filter(function(x){ return x&&x.rd&&x.per==='round'; })[0]||null;
  var raw=GR.input&&GR.input.scheds;
  var all=Array.isArray(raw)?raw:(raw&&typeof raw==='object'?Object.keys(raw).map(function(k){ return raw[k]; }):[]);
  var day=function(s){ return String(s.date==null?'':s.date).trim(); };
  var sc=all.filter(function(s){ return s&&typeof s==='object'&&s.id&&s.coId===c.coId&&s.typeId===c.typeId&&s.phase!=='pre'&&/^\d{4}-\d{2}-\d{2}$/.test(day(s)); })
    .sort(function(a,b){ return day(a)<day(b)?-1:(day(a)>day(b)?1:0); });
  var rounds=sc.map(function(s,i){
    var r={date:day(s),visit:s.isField===true?true:(s.isField===false?false:null),memo:String(s.memo||'')};
    var rec=rdItem?recs[T.keyOf(rdItem,i+1)]:null;
    if(rec&&rec.rd) r.rd=rec.rd;
    return r;
  });
  var k=c.keys.filter(function(x){ return x.key===c.key; })[0]||c.keys[0], saved=recs[c.key]||null, live=$('cwNote');
  var note=(live&&typeof live.value==='string')?live.value:String((saved&&saved.note)||'');
  var cons=c.cons||{}, cc=(cons.company&&typeof cons.company==='object')?cons.company:{};
  var company={name:c.coName};
  var bt=String(cc.bizType||cc.bizCategory||'').trim();
  if(bt) company.bizType=bt;                       // 근로자수는 이알피에 없다(보고서 창과 같다) — 보내지 않는다
  return {itemName:k.name,company:company,rounds:rounds,notes:[{label:k.name,text:note}]};
}
/* 안내·오류 줄(#cwChapMsg) — 칸 창을 다시 그리지 않는다 */
function grChapSay(m,bad){

function grRenderChap(){
  var C=(typeof PuGovReportChapters!=='undefined')?PuGovReportChapters:null, c=GR.cw, el=$('cwChap');
  if(!C||!c||!c.chap||!c.chaps||!c.chaps.length||!el) return;
  var ch=c.chap, own=function(k){ return Object.prototype.hasOwnProperty.call(ch.draft,k); }, any=false;

    +'<div class="days">'+grEsc(C.MSG.NOT_SAVED)+'</div>'

    +(grChapLinked(c)?'':'<div id="cwChapNoCons" class="err-s">'+grEsc(GR_AI.msg.noCons)+'</div>')
    +'<div class="cw-b"><button type="button" id="cwChapGo" onclick="grChapAi()"'+(ch.busy?' disabled':'')+'>'+(ch.busy?'쓰는 중…':'AI 초안 만들기')+'</button></div>'
    +'<div id="cwChapMsg" class="'+(ch.err?'err-s':'days')+'">'+grEsc(ch.msg||'')+'</div>';
  c.chaps.forEach(function(x){
    if(!grOkChapKey(x.k)||!own(x.k)) return;
    any=true;
    var w=ch.warn&&Object.prototype.hasOwnProperty.call(ch.warn,x.k)?ch.warn[x.k]:null;
    h+='<div class="cw-f"><span>'+grEsc(x.t)+'</span>'
      +'<textarea id="cwChapK_'+x.k+'" rows="8" oninput="grChapEdit(\''+x.k+'\')">'+grEsc(ch.draft[x.k])+'</textarea>'
      +'<div id="cwChapW_'+x.k+'" class="'+(w&&w.length?'err-s':'days')+'">'+(w&&w.length?grEsc(C.MSG.CHECK+w.join(', ')):'')+'</div>'
      +'<div class="cw-b"><button type="button" onclick="grChapCopy(\''+x.k+'\')">이 장 복사</button></div></div>';
  });
  if(any) h+='<div class="cw-b"><button type="button" onclick="grChapCopyAll()">전체 복사</button></div>';
  el.innerHTML=h;
}
/* 글칸을 고치면 — 값만 옮기고 그 장의 경고 줄만 다시 계산한다(글칸은 다시 그리지 않는다: 입력·초점 보존). 비교 대상은 «보낸 글을 되돌린 것»(chap.sent) */
function grChapEdit(k){
  var C=(typeof PuGovReportChapters!=='undefined')?PuGovReportChapters:null, c=GR.cw;
  if(!C||!c||!c.chap||!c.chaps||!grOkChapKey(k)||!c.chaps.some(function(x){ return x.k===k; })) return;
  var t=$('cwChapK_'+k);
  if(!t) return;
  var v=String(t.value==null?'':t.value);
  c.chap.draft[k]=v;
  var one={}; one[k]=v;
  var r=C.checkDraft(one,c.chap.sent);
  c.chap.warn=c.chap.warn||{};
  var w=Object.prototype.hasOwnProperty.call(r,k)?r[k]:null;
  if(w&&w.length) c.chap.warn[k]=w; else delete c.chap.warn[k];
  var e=$('cwChapW_'+k);
  if(e){ e.textContent=w&&w.length?C.MSG.CHECK+w.join(', '):''; e.className=w&&w.length?'err-s':'days'; }
}
function grChapCopyText(c,t,okMsg){
  if(!String(t).trim()){ grChapSay('복사할 글이 없습니다',true); return Promise.resolve(false); }
  return grCopy(t).then(function(ok){
    if(GR.cw===c) grChapSay(ok?okMsg:GR_AI.msg.copyFail,!ok);
    return ok;
  });
}
function grChapCopy(k){
  var c=GR.cw;
  if(!c||!c.chap||!c.chaps||!grOkChapKey(k)||!c.chaps.some(function(x){ return x.k===k; })) return Promise.resolve(false);
  var d=c.chap.draft;
  return grChapCopyText(c,Object.prototype.hasOwnProperty.call(d,k)?String(d[k]):'','이 장을 복사했습니다 — 붙여 넣으세요');
}
function grChapCopyAll(){
  var c=GR.cw;
  if(!c||!c.chap||!c.chaps) return Promise.resolve(false);
  var d=c.chap.draft, parts=[];
  c.chaps.forEach(function(x){
    if(Object.prototype.hasOwnProperty.call(d,x.k)&&String(d[x.k]).trim()) parts.push(x.t+'\n'+String(d[x.k]));
  });
  return grChapCopyText(c,parts.join('\n\n'),'전체를 복사했습니다 — 붙여 넣으세요');
}
/* 「AI 초안 만들기」 — 재료 모으기 → 가리기(모듈) → 재료 없으면 끝(부르지도 묻지도 않음) → 동의 → 부르기(못 읽으면 한 번 더) → 숫자 점검 → 그리기.
   칸 창이 닫히거나 다른 칸으로 바뀌면(GR.cw !== c) 받은 것은 버린다 */
async function grChapAi(){
  var c=GR.cw;
  if(!c||!c.chap||!c.chaps||c.chap.busy) return;
  if(typeof PuGovReportChapters==='undefined'||!PuGovReportChapters||typeof PuGovReportAi==='undefined'||!PuGovReportAi){ grChapSay(GR_AI.msg.noMod,true); return; }   // 스크립트를 못 불렀다 — 던지지 않고 알린다
  var C=PuGovReportChapters, A=PuGovReportAi;
  var ch=c.chap, inp=grChapInput(c);
  var req=C.buildRequest({bizName:c.biz,itemName:inp.itemName,chapters:c.chaps,company:inp.company,names:grChapNames(c),rounds:inp.rounds,notes:inp.notes});
  if(req.empty){ grChapSay(req.noChapters?GR_AI.msg.noChap:C.MSG.NO_MATERIAL,false); return; }
  if(!grChapConsent()) return;                                           // 동의 안 하면 아무것도 보내지 않는다
  if(!grChapLinked(c)&&!grChapAsk(GR_AI.msg.noConsAsk)) return;           // 이알피 계약이 없으면 사람 이름이 가려지지 않는다 — 한 번 더 묻는다
  if(Object.keys(ch.draft).length&&!grChapAsk(GR_AI.msg.overwrite)) return;
  var sent=A.unmask(req.sent,req.back);                                  // 숫자 점검은 «가리지 않은» 보낸 글과 견준다(업체 이름 속 숫자가 경고로 잡히지 않게)
  ch.busy=true; ch.msg=''; ch.err=false; grRenderChap();
  var draft=null, err=null;
  try{
    for(var i=0;i<2&&!draft;i++){                                        // 못 읽으면 한 번 더 묻는다
      var text=await grChapCall(req.system,req.messages);
      try{ draft=C.parseDraft(text,req.back,c.chaps); }catch(e){ if(!e.parse) throw e; err=e; }
    }
  }catch(e){ err=e; }
  ch.busy=false;
  if(GR.cw!==c) return;                                                  // 칸 창이 바뀌었다 — 버린다
  if(!draft){
    console.warn('[컨설팅보고서] 장별 AI 초안 실패',err);
    ch.msg=grChapErrMsg(err); ch.err=true; grRenderChap();
    return;
  }
  ch.draft=draft; ch.sent=sent; ch.warn=C.checkDraft(draft,sent);
  var miss=c.chaps.filter(function(x){ return !Object.prototype.hasOwnProperty.call(draft,x.k); }).map(function(x){ return x.t; });
  ch.msg='초안을 만들었습니다 — 읽고 고친 뒤 복사하세요'+(miss.length?' (채우지 못한 장: '+miss.join(' · ')+')':''); ch.err=false;
  grRenderChap();
}
/* 📂 받은 한글 파일 열어 보기 — 고른 파일은 브라우저 안에서만 읽어 미리보기 창(PuHwpPreview)에 넘긴다. 어디에도 올리지·쓰지 않는다.
   안내는 글자(textContent)로만 — 파일 이름은 사람이 정한 데이터. 칸 창은 다시 그리지 않는다(적던 값 보존)
   ★ 파일을 잡자마자(await 전에) 고르기 칸을 비운다 — 불러오는 사이 창을 닫고 같은 파일을 다시 골라도 change 가 뜬다.
     잡아 둔 File 은 칸을 비워도 그대로 읽힌다.
   ★ 창을 닫았거나 다른 파일에 밀려 취소된 것(e.cancelled)은 실패가 아니다 — 안내 줄을 건드리지 않는다. */
function grPickHwp(){ var el=$('cwHwp'); if(el&&el.click) el.click(); }
async function grOpenHwp(input){
  var say=function(m,bad){ var e=$('cwHwpMsg'); if(e){ e.textContent=m; e.className=bad?'err-s':'days'; } return {ok:!bad,msg:m}; };
  var f=input&&input.files&&input.files[0];
  try{ if(input) input.value=''; }catch(e){}
  if(!f) return {ok:false};
  if(!/\.hwpx?$/i.test(String(f.name||''))) return say('한글(.hwp·.hwpx) 파일만 열 수 있습니다',true);
  if(!window.PuHwpPreview) return say('한글 미리보기를 불러오지 못했습니다 — 새로 고친 뒤 다시 눌러 주세요',true);
  try{
    var buf=await f.arrayBuffer();
    await window.PuHwpPreview.open(buf,f.name);
    return say('열었습니다 — '+f.name);
  }catch(e){
    if(e&&e.cancelled) return {ok:false,cancelled:true};
    console.warn('[컨설팅보고서] 한글 미리보기 실패',e);
    return say((e&&e.message)||'미리보기를 열지 못했습니다',true);
  }
}
/* ═══ 받은 서류함 — 칸 창 「📥 받은 서류 후보」·「연결」·「열어 보기」 (설계 docs/superpowers/specs/2026-10-11-gov-report-inbox-design.md) ═══
   ★ 칸 창을 다시 그리지 않는다 — #cwInbox 만 고친다(적던 값 보존). 쓰기는 grSaveCell 한 곳뿐(link 를 실어 보낸다).
   ★ 열어 보기는 한 번에 하나(GR.avBusy) — 지난 메일 POP3 가 동시 호출에 막힌다. 받은 바이트는 지역 변수로만, 저장·업로드 없음. */

/* 메일함 거울(폴더 표 + 폴더마다 최근 GR_MAIL.per 통의 머리글)과 업체관리를 «한 번» 읽는다. 본문·첨부는 읽지 않는다.
   업체관리를 못 읽은 것은 실패로 치지 않는다(이알피 계약 연락처로만 찾는다). 폴더를 못 읽으면 칸 창 안에 다시 시도 */
function grLoadInbox(force){
  if(!force&&GR.inboxP) return GR.inboxP;
  var seq=++GR.iseq;
  GR.inbox={st:'loading',rows:[],cos:null,clipped:false}; grRenderSend(); grRenderInbox();
  GR.inboxP=grReadInbox(seq);
  return GR.inboxP;
}
async function grReadInbox(seq){
  var I=PuGovReportInbox, N=GR_INBOX_NODES;
  try{
    var got=await Promise.all([fbDb.ref(N.folders).once('value').then(function(s){ return s.val(); }),
      fbDb.ref(N.cos).once('value').then(function(s){ return s.val(); },function(e){ console.warn('[컨설팅보고서] 못 읽음 '+N.cos,e); return null; })]);
    var folders=got[0]||{}, slugs=I.boxesOf(folders);
    var boxes=await Promise.all(slugs.map(function(s){
      return fbDb.ref(N.msgs+'/'+s).orderByKey().limitToLast(GR_MAIL.per).once('value').then(function(x){ return x.val()||{}; });
    }));
    if(seq!==GR.iseq) return;
    var msgs={}, clipped=false;
    slugs.forEach(function(s,i){ msgs[s]=boxes[i]; if(Object.keys(boxes[i]).length>=GR_MAIL.per) clipped=true; });
    GR.inbox={st:'ok',rows:I.mailRows(folders,msgs),cos:got[1],clipped:clipped};
  }catch(e){
    if(seq!==GR.iseq) return;
    console.warn('[컨설팅보고서] 메일함 못 읽음',e);
    GR.inbox={st:'err',rows:[],cos:null,clipped:false}; GR.inboxP=null;
  }
  grRenderSend(); grRenderInbox();
}
function grRetryInbox(){ return grLoadInbox(true); }
/* 칸 창 안 후보 자리 — 연결된 서류 · 후보 줄(받음/보냄·날짜·제목·딱지·첨부마다 열어 보기/연결) · 안내 */
function grRenderInbox(){
  var I=PuGovReportInbox, T=PuGovReportTrack, c=GR.cw, el=$('cwInbox'), ib=GR.inbox||{};
  if(!el) return;
  if(!c){ el.innerHTML=''; return; }
  var rec=T.recOf(GR.track||{},c.coId,c.rid)[c.key]||null, lk=rec&&rec.link, busy=!!GR.avBusy;

    else h+='<ul class="ib">'+list.map(function(m,i){

      var atts=m.atts.length?m.atts.map(function(a,j){
        return '<div class="ib-a"><span>📎 '+grEsc(a.name)+'</span>'+(m.priv?'':
          '<button type="button" class="act" onclick="grOpenCand('+i+','+j+')"'+(busy?' disabled':'')+(a.kind||a.cut?'':' title="'+grEsc(I.MSG.CANT)+'"')+'>열어 보기</button>'
          +'<button type="button" class="act" onclick="grLinkCand('+i+','+j+')"'+(c.busy||!m.key?' disabled':'')+'>연결</button>'
          +(m.reply&&c.step==='sign'?'<button type="button" class="act" onclick="grLinkReply('+i+','+j+')"'+(c.busy||!m.key?' disabled':'')+'>서명본으로 연결</button>':''))+'</div>';
      }).join(''):'<div class="days">첨부 '+grEsc(m.a)+'개 — 이름이 없어 메일함에서 받아 주세요</div>';
      return '<li><div class="ib-h">'+(m.out?'보냄 → ':'받음 ← ')+grEsc(m.who)+' · '+grEsc(m.day)+tags+'</div>'
        +'<div class="ib-s">'+grEsc(m.s||'(제목 없음)')+'</div>'+atts+'</li>';
    }).join('')+'</ul>'+(r.more?'<div class="days">'+grEsc(I.MSG.MORE)+'</div>':'');
    if(ib.clipped) h+='<div class="days">'+grEsc(I.MSG.CLIPPED)+'</div>';
  }
  if(GR.avMsg) h+='<div class="'+(GR.avErr?'err-s':'days')+'">'+grEsc(GR.avMsg)+'</div>';

}
/* 「연결」 — 고른 후보의 첨부 하나를 지금 칸 창의 서류 줄에. 저장은 기존 한 곳(grSaveCell)이 칸 창 값과 함께 줄 하나 .set.
   규칙 게시 전에는 거절되어 「저장하지 못했습니다 — 규칙 게시 또는 권한 확인」(값은 그대로) */
function grLinkCand(i,j){
  var c=GR.cw, m=c&&c.cands?c.cands[i]:null, a=m?m.atts[j]:null;
  if(!m||!a||m.priv) return Promise.resolve();

}
/* 「연결 지우기」 — link 만 뺀 줄을 같은 길로 다시 쓴다(서류 줄 상태는 칸 창 값 그대로) */
function grUnlink(){ return GR.cw?grSaveCell({link:null}):Promise.resolve(); }
/* ═══ 서명 요청·제출 메일 — 칸 창 #cwSend (설계 docs/superpowers/specs/2026-10-11-gov-report-sign-submit-design.md)
   ★ 쓰기는 grSaveCell 한 곳뿐 — 여기서는 칸 창 입력값을 채우고 그 길을 부른다. 메일은 «쓰기 창에 값을 채워 열기»까지(보내기는 사람). ═══ */
function grSendCtx(){
  var c=GR.cw; if(!c) return null;
  var D=PuGovReportDocs, T=PuGovReportTrack, S=PuGovReportSend, I=PuGovReportInbox, ib=GR.inbox||{};
  var item=c.keys.filter(function(k){ return k.key===c.key; })[0]||c.keys[0]||{};
  var plan=(D.planFor(c.biz).items||[]).filter(function(x){ return x.id===item.id; })[0]||{};
  var rec=T.recOf(GR.track||{},c.coId,c.rid)[c.key]||null;
  var addrs=(ib.st==='ok')?I.addrsFor({companies:ib.cos,cons:c.cons,name:c.coName,bizNo:c.bizNo}):null;
  return {c:c,item:item,plan:plan,rec:rec,ib:ib,addrs:addrs,tag:S.tagOf(c.step,c.rid)};
}
function grSay(m,bad){ var e=$('cwSendMsg'); if(e){ e.textContent=m; e.className=bad?'err-s':'days'; } }
function grRenderSend(){
  var x=grSendCtx(), el=$('cwSend');
  if(!el) return;
  if(!x||(x.c.step!=='sign'&&x.c.step!=='submit'&&x.c.step!=='plat'&&x.c.step!=='report')){ el.innerHTML=''; return; }
  var S=PuGovReportSend, c=x.c, v=c.draft||x.rec||{st:'none'}, done=v.st==='done', dayOk=function(d){ return /^\d{4}-\d{2}-\d{2}$/.test(d); };
  var h='<div class="cw-f"><span>'+(c.step==='sign'?'✉ 서명 요청':(c.step==='submit'?'✉ 제출 메일':'📝 단계 안내'))+'</span>';
  if(c.step==='sign'){
    if(x.ib.st==='ok'&&x.addrs&&!Object.keys(x.addrs).length) h+='<div class="days">'+grEsc(S.MSG.NO_ADDR)+'</div>';
    else if(!done) h+='<button type="button" onclick="grWriteMail()"'+(x.ib.st==='ok'?'':' disabled')+'>✉ 서명 요청 메일 쓰기</button>';
    var f=x.ib.st==='ok'?S.findSent(x.ib.rows,x.tag):null;
    if(!done&&x.ib.st==='ok'){
      if(f&&dayOk(f.day)&&(!x.rec||x.rec.sentAt!==f.day)) h+=' <button type="button" class="act" onclick="grMarkSent(\''+grEsc(f.day)+'\')">보낸 메일을 찾았습니다 — '+grEsc(f.day)+(f.count>1?' ('+f.count+'건 중 가장 이른 것)':'')+' · 보낸 날로 기록</button>';
      else if(!f&&(!x.rec||!x.rec.sentAt)) h+=' <button type="button" class="act" onclick="grMarkSent(\'\')">보냈음 기록(오늘)</button>';
    }
    h+='<div class="days">'+grEsc(S.MSG.ATTACH)+'</div><div class="days">'+grEsc(S.MSG.DL_NOTE)+'</div>'
      +'<div class="days"><a href="'+grEsc(PuGovReportList.reportHref(c.coId,c.typeId))+'" target="_blank" rel="noopener">보고서 창 열기(확정본 내려받기)</a></div>';
  }
  if(c.step==='submit'){
    if(x.plan.how==='mail'){
      var okIb=x.ib.st==='ok';
      if(!done) h+='<button type="button" onclick="grWriteSubmit()"'+(okIb?'':' disabled')+'>✉ 제출 메일 쓰기</button>';
      var fs=okIb?S.findSent(x.ib.rows,x.tag):null;
      if(!done&&okIb){
        if(fs&&dayOk(fs.day)&&(!x.rec||x.rec.gotAt!==fs.day)) h+=' <button type="button" class="act" onclick="grMarkSent(\''+grEsc(fs.day)+'\')">보낸 메일을 찾았습니다 — '+grEsc(fs.day)+(fs.count>1?' ('+fs.count+'건 중 가장 이른 것)':'')+' · 제출일로 기록</button>';
        else if(!fs&&(!x.rec||!x.rec.gotAt)) h+=' <button type="button" class="act" onclick="grMarkSent(\'\')">제출 보냄 기록(오늘)</button>';
      }
      h+='<div class="days">'+grEsc(S.MSG.ATTACH)+'</div><div class="days">'+grEsc(S.MSG.DL_NOTE)+'</div>';
    }else if(x.plan.how==='platform'&&Array.isArray(x.plan.steps)){
      h+='<ol class="days">'+x.plan.steps.map(function(t){ return '<li>'+grEsc(t)+'</li>'; }).join('')+'</ol>'
        +'<div class="days">로그인과 «제출» 단추는 사람이 합니다 — 접수 화면을 캡처해 두고 «접수 확인»에 표시하세요</div>';
    }else h+='<div class="days">제출 방식 확인 필요 — 운영지침 도착 뒤 정합니다</div>';
  }
  /* 대형 단계 안내 — 입력 순서(plat)와 안내 글(plat·report·sign). 값은 항목 틀(DOC_PLANS)의 글자 — 모두 grEsc, 배열은 읽기만 */
  var guide=false;
  if(c.step==='plat'&&Array.isArray(x.plan.steps)&&x.plan.steps.length){
    guide=true;
    h+='<div class="days">입력 순서</div><ol class="days">'+x.plan.steps.map(function(s){ return '<li>'+grEsc(s)+'</li>'; }).join('')+'</ol>'
      +'<div class="days">로그인과 최종 제출은 사람이 합니다 — 접수 화면을 캡처해 두세요</div>';
  }
  if((c.step==='plat'||c.step==='report'||c.step==='sign')&&typeof x.plan.note==='string'&&x.plan.note){ guide=true; h+='<div class="days">안내: '+grEsc(x.plan.note)+'</div>'; }
  if((c.step==='plat'||c.step==='report')&&!guide){ el.innerHTML=''; return; }
  h+='<div class="days" id="cwSendMsg"></div></div>';
  el.innerHTML=h;
}
/* 칸 창 입력값(상태·발송일·회신일·제출 방식)을 채운 뒤 저장 — 새 쓰기 길을 만들지 않는다 */
function grApplyFields(f){
  var set=function(id,val){ var e=$(id); if(e&&val!==undefined) e.value=val; };
  if(!f) return false;
  set('cwSt',f.st); set('cwSent',f.sentAt); set('cwGot',f.gotAt); set('cwHow',f.how);
  return true;
}
/* 「보낸 날로 기록」 — day 가 비면 오늘. 상태·발송일만 채운다(메모·회신일·연결은 칸 창 값 그대로) */
function grMarkSent(day){
  var S=PuGovReportSend, c=GR.cw;
  if(!c||c.busy) return Promise.resolve();
  if(!grApplyFields(S.sentFields(c.step,day||GR.today))) return Promise.resolve();
  return grSaveCell();
}
/* 「서명본으로 연결」 — 회신 후보 첨부 하나: 연결 + 회신일(그 메일 날짜) + 완료, 한 번의 저장 */
function grLinkReply(i,j){
  var S=PuGovReportSend, c=GR.cw, m=c&&c.cands?c.cands[i]:null, a=m?m.atts[j]:null;
  if(!c||c.busy||c.step!=='sign'||!m||!a||m.priv||!m.reply) return Promise.resolve();
  var lk=PuGovReportInbox.linkFrom(m,a.name);
  if(!lk||!grApplyFields(S.gotFields('sign',m.day))) return Promise.resolve();
  return grSaveCell({link:lk});
}
/* 「메일 쓰기」 — 푸른메일함 쓰기 창(puMailComposeTo)에 값을 채워 연다. 안 되면 주소(받는이·참조·제목만)로, 본문은 클립보드로.
   ★ 복사는 창을 열기 «전에» 시작한다 — 열고 나면 이 쪽이 초점을 잃어 크롬이 복사를 거절한다(처음 누를 때는 늘 «안 되는» 길). 값 채우기가 되어도 복사는 해 둔다 */
function grCopy(txt){ try{ return navigator.clipboard.writeText(txt).then(function(){ return true; },function(){ return false; }); }catch(e){ return Promise.resolve(false); } }
function grOpenMail(p){
  var S=PuGovReportSend, w=null, ok=false, c0=GR.cw, url=S.composeUrl('pu-cards.html',p);
  var copyP=grCopy(url?p.body:(p.subject+'\n\n'+p.body));
  try{ w=window.open('','puMailWrite'); }catch(e){ w=null; }
  if(!w){ grSay('쓰기 창이 막혔습니다 — 팝업을 허용해 주세요',true); return Promise.resolve(false); }
  try{ if(w!==window&&typeof w.puMailComposeTo==='function') ok=!!w.puMailComposeTo({card:'',to:p.to,cc:p.cc,subject:p.subject,body:p.body}); }catch(e){ ok=false; }
  if(!ok){
    try{ w.location.href=url||'pu-cards.html?view=mail'; }catch(e){ try{ w=window.open(url||'pu-cards.html?view=mail','puMailWrite')||w; }catch(x){} }
    try{ w.focus(); }catch(e){}
    return copyP.then(function(copied){
      if(GR.cw===c0) grSay(copied?(url?S.MSG.BODY_COPIED:S.MSG.COPIED_ALL):'쓰기 창을 열었습니다 — 본문은 복사하지 못했습니다',!copied);
      return true;
    });
  }
  try{ w.focus(); }catch(e){}
  grSay('쓰기 창을 열었습니다 — 첨부를 붙이고 보내 주세요');
  return Promise.resolve(true);
}
function grWriteMail(){
  var x=grSendCtx(), S=PuGovReportSend;
  if(!x||x.c.step!=='sign') return Promise.resolve(false);
  var d=S.draft('sign',{rid:x.c.rid,co:x.c.coName,biz:x.c.biz,reportName:x.item.name});
  if(!d){ grSay(S.MSG.NO_TAG,true); return Promise.resolve(false); }
  var a=S.toCc(x.addrs);
  if(!a.to){ grSay(S.MSG.NO_ADDR,true); return Promise.resolve(false); }
  return grOpenMail(S.composeParts(d,a.to,a.cc));
}
/* 「제출 메일 쓰기」 — 지난 제출 메일에서 받는이를 따라 오고, 못 찾으면 빈 쓰기 창 + 제목·본문 복사. 안내 문구는 grOpenMail 이 끝난 뒤 다시 쓴다 */
function grWriteSubmit(){
  var x=grSendCtx(), S=PuGovReportSend, D=PuGovReportDocs;
  if(!x||x.c.step!=='submit'||x.plan.how!=='mail') return Promise.resolve(false);
  var d=S.draft('submit',{rid:x.c.rid,co:x.c.coName,biz:x.c.biz,reportName:x.item.name});
  if(!d){ grSay(S.MSG.NO_TAG,true); return Promise.resolve(false); }
  var f=S.submitTo(x.ib.rows||[],{words:D.planFor(x.c.biz).words,addrs:x.addrs||{}});
  var to=f?f.to[0]:'', cc=f?f.to.slice(1):[];
  var note=f?'지난 제출 메일('+f.day+')에서 받는 사람을 따라 왔습니다 — 확인하세요':S.MSG.NO_SUBMIT_TO;
  grSay(note,!f);
  return grOpenMail(S.composeParts(d,to,cc)).then(function(r){
    var e=$('cwSendMsg'), cur=e?e.textContent:'', bad=!!e&&e.className==='err-s';
    if(r&&GR.cw===x.c) grSay(note+(cur?' / '+cur:''),bad||!f);
    return r;
  });
}
/* 서버 부르기 — 취업규칙 화면과 같은 손(PuRulesMailOrig.makeCall: POST · Bearer 로그인 증표 · ok 가 아니면 status 를 단 오류).
   GR_MAIL.wait 안에 답이 없으면 TimeoutError(「메일 서버 응답이 없습니다」) — 그때 보낸 요청은 AbortController 로 끊는다(뒤에서 계속 받지 않게) */
function grMailFetch(url,init){
  var ac=(typeof AbortController==='function')?new AbortController():null;
  var opt=Object.assign({},init||{});
  if(ac) opt.signal=ac.signal;
  return new Promise(function(ok,no){
    var t=setTimeout(function(){ var e=new Error('응답이 없습니다'); e.name='TimeoutError'; no(e); if(ac){ try{ ac.abort(); }catch(x){} } },GR_MAIL.wait);
    fetch(url,opt).then(function(r){ clearTimeout(t); ok(r); },function(e){ clearTimeout(t); no(e); });
  });
}
function grMailCall(){
  return PuRulesMailOrig.makeCall({base:GR_MAIL.fn,fetch:grMailFetch,getToken:function(){
    var u=firebase.auth().currentUser;
    if(!u){ var e=new Error('로그인이 필요합니다'); e.status=401; throw e; }
    return u.getIdToken();
  }});
}
/* 「열어 보기」 — 후보 줄의 첨부 / 연결된 서류. 개인 자료는 열지 않는다 */
function grOpenCand(i,j){
  var c=GR.cw, m=c&&c.cands?c.cands[i]:null, a=m?m.atts[j]:null;
  if(!m||!a||m.priv) return Promise.resolve({ok:false});
  return grOpenAtt({kind:'imap',slug:m.slug,uid:m.uid},a.name);
}
function grOpenLinked(){
  var c=GR.cw, rec=c?PuGovReportTrack.recOf(GR.track||{},c.coId,c.rid)[c.key]:null, lk=rec&&rec.link;
  if(!lk) return Promise.resolve({ok:false});
  return grOpenAtt(PuGovReportInbox.linkKey.parse(lk.key),lk.name||'');
}
/* 한 건 받아 연다 — 한 번에 하나(GR.avBusy). 실패해도 칸 창은 그대로, 안내는 #cwInbox 에만.
   안내 줄은 «누른 그 칸 창»에만 — 받는 사이 다른 칸 창을 열었으면 그 창에는 적지 않는다(c=GR.cw).
   형식은 서버가 준 온 이름으로 정한다 — 거울 이름은 60자로 잘려 확장자가 없을 수 있다(PuGovReportInbox.findAtt).
   창이 닫혀 취소된 것(e.cancelled — 한글 미리보기)은 실패가 아니다 */
async function grOpenAtt(ref,name){
  var I=PuGovReportInbox, c=GR.cw, kind=I.kindOf(name), noHwp='한글 미리보기를 불러오지 못했습니다 — 새로 고친 뒤 다시 눌러 주세요';
  var say=function(m,bad){ if(GR.cw!==c) return; GR.avMsg=m; GR.avErr=!!bad; grRenderInbox(); };
  if(GR.avBusy) return {ok:false,busy:true};
  if(!ref||!name){ say(I.MSG.GONE,true); return {ok:false}; }
  if(!kind&&!I.mayBeCut(name)){ say(I.MSG.CANT,true); return {ok:false}; }
  if(kind==='hwp'&&!window.PuHwpPreview){ say(noHwp,true); return {ok:false}; }
  GR.avBusy=true; say(ref.kind==='pop'?I.MSG.WAIT_OLD:I.MSG.WAIT);
  try{
    var call=grMailCall();
    var f=await I.findAtt({call:call,ref:ref,name:name});
    kind=I.kindOf(f.name);
    if(!kind){ GR.avBusy=false; say(I.MSG.CANT,true); return {ok:false}; }
    if(kind==='hwp'&&!window.PuHwpPreview){ GR.avBusy=false; say(noHwp,true); return {ok:false}; }
    var got=await I.readAtt({call:call,ref:ref,att:f});
    await grShowAtt(kind,PuRulesMailOrig.b64ToBytes(got.b64),f.name);
    GR.avBusy=false; say('열었습니다 — '+f.name);
    return {ok:true};
  }catch(e){
    GR.avBusy=false;
    if(e&&e.cancelled){ say(''); return {ok:false,cancelled:true}; }
    console.warn('[컨설팅보고서] 받은 서류 열기 실패',e);
    say(I.errText(e),true);
    return {ok:false};
  }
}
/* 판독기를 «그때» 저장소 vendor/ 에서 싣는다 — 화면을 열 때 싣지 않는다 */
function grLib(src,ready){
  if(ready()) return Promise.resolve();
  return new Promise(function(ok,no){
    var s=document.createElement('script'); s.src=src;
    s.onload=function(){ if(ready()) ok(); else no(new Error('판독기를 쓸 수 없습니다')); };
    s.onerror=function(){ no(new Error('판독기를 불러오지 못했습니다')); };
    document.head.appendChild(s);
  });
}

/* PDF 한 쪽을 캔버스에 — 그린 «뒤»에 부른다. 그사이 창이 바뀌었으면 그리지 않는다 */
function grPdfDraw(){
  var a=GR.av, cv=$('avCanvas');
  if(!a||a.kind!=='pdf'||!a.pdf||!cv||!cv.getContext) return Promise.resolve();
  var want=a.page;
  return a.pdf.getPage(want).then(function(pg){
    if(GR.av!==a||a.page!==want) return;
    var box=((cv.parentNode&&cv.parentNode.clientWidth)||900)-28, v0=pg.getViewport({scale:1});
    var vp=pg.getViewport({scale:Math.min(2.2,Math.max(0.5,box/(v0.width||600)))});
    cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height);
    return pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  }).catch(function(e){ console.warn('[컨설팅보고서] PDF 쪽 그리기 실패',e); });
}
function grPdfPage(step){
  var a=GR.av;
  if(!a||!a.pages) return;
  var n=Math.min(a.pages,Math.max(1,a.page+step));
  if(n===a.page) return;
  a.page=n; grRenderAv();
}
/* 닫으면 그 파일은 사라진다 — blob 주소를 버리고 PDF 를 닫는다 */
function grCloseAv(){
  var a=GR.av; GR.av=null;
  if(a&&a.url){ try{ URL.revokeObjectURL(a.url); }catch(e){} }
  if(a&&a.pdf&&a.pdf.destroy){ try{ a.pdf.destroy(); }catch(e){} }
  grRenderAv();
}

/* ═══ 전역 「📥 받은 서류 확인」 — 오른쪽 패널 #ginbox (계획 docs/superpowers/plans/2026-10-12-gov-report-global-inbox.md)
   모든 업체에서 «최근 GLOBAL_DAYS 일 안에 받은 · 아직 어느 서류 줄에도 연결 안 된 첨부 메일»을 한 목록으로. 단추를 눌렀을 때만 메일함을 읽는다(grLoadInbox 재사용 — 한 번).
   ★ 읽기만 — 저장·새 규칙 없음. 연결·열어 보기는 여기서 하지 않고 «서류 칸 열기»로 기존 칸 창(grOpenCell)에서 한다.
   ★ 목록은 «누른 때의 연도(GR.f.year)» 기준 — 연도를 바꾸면 처음 상태로 돌아가고(grGiReset), 칸 창에서 연결·지운 뒤에는 메일함을 다시 읽지 않고 목록만 다시 계산한다(grGlobalRefresh).
   업체·사업 쌍은 D.erpTypeFor 와 같은 짝(일정 사업마다 먼저 보이는 이알피 사업) · 틀이 없는 사업은 뺀다 · 업체 귀속은 주소로만(addrsFor) · 같은 메일은 먼저 적힌 쌍(업체 이름 → 사업 이름 차례) 한 곳에만 */
function grGiReset(msg){
  if(GR.gi.st==='loading') return;
  GR.gi={st:'idle',list:[],noAddr:0,more:false,clipped:false,year:'',msg:msg||''};
}
/* 계산 — GR.inbox(읽은 메일 줄)·GR.track·GR.input·GR.docs 만 본다(읽기·쓰기 없음). 던질 수 있으니 부르는 쪽이 잡는다 */
function grGlobalCompute(){
  var I=PuGovReportInbox, D=PuGovReportDocs, T=PuGovReportTrack, ib=GR.inbox, d=GR.docs, year=GR.f.year, ps=[], used=[], closed=grClosedTypes(year,false);
  var win=I.sinceWindow(GR.today,I.GLOBAL_DAYS);
  if(!win) throw new Error('오늘 날짜를 알 수 없다');
  D.visibleTypes(d.biz).forEach(function(erp){
    var typeId=D.linkOf(erp.code,d.tmap,GR.input.types);
    if(!typeId||used.indexOf(typeId)>=0) return;
    used.push(typeId);
    if(closed[typeId]) return;   /* 종결 사업은 받은 서류 확인에서 뺀다 */
    var plan=D.planFor(erp.name);
    if(plan===D.NONE) return;
    D.pairs(GR.input,typeId,year).forEach(function(p){ ps.push({p:p,erp:erp,plan:plan,i:ps.length}); });
  });
  ps.sort(function(a,b){ return a.p.coName.localeCompare(b.p.coName,'ko')||a.p.typeName.localeCompare(b.p.typeName,'ko')||(a.i-b.i); });
  /* 연결된 메일 — 어느 업체·어느 줄이든 link.key 가 같으면 연결된 것(기록 GR.track = {업체:{rid:{줄 키:줄}}}) */
  var linked={};
  Object.keys(GR.track).forEach(function(co){ var rs=GR.track[co]||{}; Object.keys(rs).forEach(function(rid){ var its=rs[rid]||{};
    Object.keys(its).forEach(function(key){ var lk=its[key]&&its[key].link; if(lk&&typeof lk.key==='string'&&lk.key) linked[lk.key]=1; }); }); });
  var seen={}, got=[], more=false, miss=[], hit=[];
  ps.forEach(function(x){
    var p=x.p, cons=D.consFor({consultings:d.cons,co:p.co,code:x.erp.code,typeId:p.typeId,tmap:d.tmap,biz:d.biz});
    var addrs=I.addrsFor({companies:ib.cos,cons:cons,name:p.coName,bizNo:String((p.co&&p.co.bizNo)||'')});
    if(!Object.keys(addrs).length){ if(miss.indexOf(p.coId)<0) miss.push(p.coId); return; }
    if(hit.indexOf(p.coId)<0) hit.push(p.coId);
    /* 칸 창으로 갈 단계 — 서명이 있으면 서명, 없으면 제출, 없으면 별첨, 다 없으면 ''(단추 없음) */
    var n=Math.max(+p.rounds||0,+p.planned||0);
    var step=['sign','submit','attach'].filter(function(s){ return T.keysFor(x.plan,s,n).length>0; })[0]||'';
    var r=I.pending(I.candidates(ib.rows,{addrs:addrs,win:win,tech:false}).list,linked,seen);
    if(r.more) more=true;
    r.list.forEach(function(m){ got.push(Object.assign({},m,{coId:p.coId,coName:p.coName,typeId:p.typeId,typeName:p.typeName,erpCode:x.erp.code,step:step,year:year})); });
  });
  got.sort(function(a,b){ return (b.d-a.d)||(a.key<b.key?-1:(a.key>b.key?1:0)); });
  if(got.length>I.GLOBAL_MAX){ more=true; got=got.slice(0,I.GLOBAL_MAX); }
  return {st:'ok',list:got,noAddr:miss.filter(function(id){ return hit.indexOf(id)<0; }).length,more:more,clipped:!!ib.clipped,year:year,msg:''};
}
/* 단추 — force(「다시 확인」)면 메일함을 새로 읽는다, 아니면 이미 읽은 것을 쓴다. 어떤 일이 생겨도 «불러오는 중»에 멈추지 않는다 */
async function grGlobalInbox(force){
  var I=PuGovReportInbox;
  if(GR.gi.st==='loading') return;
  var stop=function(msg){ GR.gi={st:'err',list:[],noAddr:0,more:false,clipped:false,year:'',msg:msg}; grRenderGlobalInbox(); };
  var NOTRK='기록을 못 불러와 연결 여부를 알 수 없습니다 — 화면을 새로 열어 주세요';
  var NODOC='사업 목록을 불러오지 못해 확인할 수 없습니다 — 화면을 새로 열어 주세요';
  var ready=function(){ return !!GR.docs&&GR.docs.loaded&&!GR.docs.err&&!!GR.input; };
  if(!GR.track||GR.trackErr) return stop(NOTRK);
  if(!ready()) return stop(NODOC);
  GR.gi={st:'loading',list:[],noAddr:0,more:false,clipped:false,year:'',msg:''}; grRenderGlobalInbox();
  try{
    await grLoadInbox(force===true);
    for(var k=0;k<3&&GR.inbox.st==='loading'&&GR.inboxP;k++) await GR.inboxP;
    if(GR.inbox.st!=='ok') return stop(I.MSG.LOAD_FAIL);
    if(!GR.track||GR.trackErr) return stop(NOTRK);
    if(!ready()) return stop(NODOC);
    GR.gi=grGlobalCompute();
  }catch(e){
    console.warn('[컨설팅보고서] 받은 서류 확인 못 함',e);
    return stop('받은 서류를 확인하지 못했습니다 — 다시 시도해 주세요');
  }
  grRenderGlobalInbox();
}
/* 칸 창에서 연결·연결 지우기를 저장한 뒤 — 메일함은 다시 읽지 않고 목록만 다시 계산한다(그릴 곳 grRender 가 바로 뒤에 온다) */
function grGlobalRefresh(){
  if(GR.gi.st!=='ok'||!GR.inbox||GR.inbox.st!=='ok'||!GR.track||GR.trackErr) return;

/* 「서류 칸 열기」 — 그 사업을 왼쪽에서 골라 주고(grOpenCell 이 고른 사업을 읽는다 · 이미 고른 사업은 grSetBiz 가 다시 누르면 푸니 건드리지 않는다) 기존 칸 창을 연다.
   목록을 만든 뒤 연도를 바꿨으면 열지 않는다(칸 창은 지금 고른 연도의 줄을 연다 — 엉뚱한 해의 창이 열리지 않게) */
function grOpenFromInbox(i){
  var m=GR.gi&&GR.gi.list?GR.gi.list[i]:null;
  if(!m||!m.step) return;
  if(m.year!==GR.f.year){ grGiReset('연도를 바꿨습니다 — 다시 확인해 주세요'); grRenderGlobalInbox(); return; }
  if(GR.f.biz!==m.erpCode) grSetBiz(m.erpCode);
  grOpenCell(m.coId,m.typeId,m.step,'');
  /* 칸 창 후보는 그 쌍의 회차 기간(첫 회차 −30일 ~ 끝 회차 +90일)만 본다 — 목록의 메일이 그 밖이면 이 창에서만 기간을 넓혀 같은 메일이 보이게 한다(보통 열기의 기본 기간은 그대로) */
  var c=GR.cw, w=c&&c.win;
  if(!c||c.coId!==m.coId||c.typeId!==m.typeId||!m.day||!w||(m.day>=w.from&&m.day<=w.to)) return;
  c.win={from:m.day<w.from?m.day:w.from,to:m.day>w.to?m.day:w.to};

function grRender(){
  $('loading').style.display=GR.loaded?'none':'';
  if(GR.err){
    $('err').innerHTML='<div>불러오지 못했습니다 — 연결을 확인해 주세요</div><button type="button" onclick="grLoad()">다시 시도</button>';
    $('err').style.display=''; $('board').style.display='none'; return;
  }
  $('err').style.display='none'; $('board').style.display=GR.loaded?'':'none';
  grTodayCalc(); grRenderYearBar(); grRenderBiz(); grRenderFilters(); grRenderKpis(); grRenderDocs(); grRenderRows(); grRenderToday(); grRenderForms(); grRenderAlerts(); grRenderGlobalInbox();
}
function grReset(){
  var y0=GR.f.year;
  GR.f.year=GR.today.slice(0,4); GR.f.type=''; GR.f.att=''; GR.f.status=''; GR.f.co=''; GR.f.mine=false; GR.f.biz='';
  $('fCo').value=''; $('fMine').checked=false; GR.todayMore={};
  if(GR.f.year!==y0) grGiReset();
  grRender();
}

/* ═══ 읽기 — 일정 넷을 한 번씩, 보고서는 줄마다 한 자리씩(확정본 사본 _v 는 안 읽는다) ═══ */
async function grLoad(){
  var L=PuGovReportList, input={}, keys=Object.keys(GR_NODES);
  var seq=++GR.seq;
  GR.err=''; GR.today=grToday(); grRender();
  try{
    var vals=await Promise.all(keys.map(function(k){ return fbDb.ref(GR_NODES[k]).once('value').then(function(s){ return s.val(); }); }));
    keys.forEach(function(k,i){ input[k]=vals[i]; });
    input.today=GR.today;
    var reps={};
    await Promise.all(L.reportKeys(input).map(function(x){
      return fbDb.ref('scal_reports/'+x.coId+'/'+x.rid).once('value').then(function(s){
        var v=s.val(); if(v){ reps[x.coId]=reps[x.coId]||{}; reps[x.coId][x.rid]=v; }
      });
    }));
    if(seq!==GR.seq) return;
    input.reports=reps;
    GR.rows=L.buildRows(input); GR.dver++;
    GR.input=input;
    GR.staffMap=L.staffNames(input.staff);
    if(!GR.f.year) GR.f.year=GR.today.slice(0,4);
  }catch(e){ if(seq!==GR.seq) return; console.warn('[컨설팅보고서] 못 읽음',e); GR.err=String((e&&e.message)||e); GR.rows=[]; GR.input=null; GR.dver++; }
  var idx=null, idxErr=false;
  try{ idx=(await fbDb.ref('scal_rptFormsIndex').once('value')).val()||{}; }
  catch(e){ idx=null; idxErr=true; }
  if(seq!==GR.seq) return;
  GR.index=idx; GR.indexErr=idxErr;
  GR.me='';
  if(!GR.err&&GR.email){
    var me='';
    try{ me=L.staffIdFor(input.staff,(await fbDb.ref('data/user_dir').once('value')).val(),GR.email); }catch(e){ me=''; }
    if(seq!==GR.seq) return;
    GR.me=me;
  }
  await grLoadDocs();
  if(seq!==GR.seq) return;
  await grLoadBizState();
  if(seq!==GR.seq) return;
  await grLoadTrack();
  if(seq!==GR.seq) return;
  grApplyTrack();
  GR.loaded=true; GR.dver++;
  grRender();
}
/* 왼쪽 패널 자료 — 하나라도 못 읽어도 오른쪽 목록은 돈다. 사업 목록을 못 읽은 것만 «오류»로 친다 */
async function grLoadDocs(){
  var seq=++GR.dseq, keys=Object.keys(GR_DOC_NODES);
  var got=await Promise.all(keys.map(function(k){
    return fbDb.ref(GR_DOC_NODES[k]).once('value').then(function(s){ return {ok:true,v:s.val()}; },
      function(e){ console.warn('[컨설팅보고서] 못 읽음 '+GR_DOC_NODES[k],e); return {ok:false,v:null}; });
  }));
  if(seq!==GR.dseq) return;
  var d={loaded:true,err:!got[keys.indexOf('biz')].ok,bad:{}};
  keys.forEach(function(k,i){ d[k]=got[i].v; if(!got[i].ok) d.bad[k]=true; });   /* 못 읽은 노드 표시 — 빈 노드(읽었는데 값이 없음)와 구분한다 */
  GR.docs=d; GR.dver++;
}
async function grRetryDocs(){
  GR.docs={loaded:false,err:false}; GR.dver++; grRenderBiz();
  await grLoadDocs();
  grApplyTrack();
  grRender();
}
/* 서류 진행 기록 — 통째로 한 번(once). 못 읽으면(규칙 게시 전·권한 없음) 체크표 ③④⑤ 만 읽기 전용 「—」, 나머지는 그대로 돈다 */
async function grLoadTrack(){
  var seq=++GR.tseq;
  try{ var t=PuGovReportTrack.normalize((await fbDb.ref(GR_TRACK_NODES.docs).once('value')).val()); if(seq!==GR.tseq) return; GR.track=t; GR.trackErr=false; GR.dver++; }
  catch(e){ if(seq!==GR.tseq) return; console.warn('[컨설팅보고서] 못 읽음 '+GR_TRACK_NODES.docs,e); GR.track=null; GR.trackErr=true; GR.dver++; }
}
/* 현황판 줄에 기록을 붙인다(r.trk · ③④ 막대) — 읽은 뒤 · 저장한 뒤 · 왼쪽 자료를 다시 읽은 뒤 */
function grApplyTrack(){
  var d=GR.docs||{};
  PuGovReportDocs.trackRows(GR.rows,{track:GR.track,input:GR.input,biz:d.biz,tmap:d.tmap,consultings:d.cons,today:GR.today});
}

/* ═══ 사업 종결 — 계획 docs/superpowers/plans/2026-10-12-gov-report-nav-closed.md (UI 재정리 1단계) ═══
   ★ 새 쓰기 길은 «scal_bizState/{이알피 사업 코드}» 한 곳 — 종결(grCloseBiz: 그 사업 기록 하나를 쓴다)·되돌리기(grReopenBiz: 같은 기록을 closedFrom 9999 로 고쳐 쓴다 — 지우지 않는다).
     규칙은 관리자·위임관리인만 허락한다 — 직원이 눌러 거절되면 창에 알리고 값은 그대로 둔다. 서류 줄 쓰기(grSaveCell)는 그대로.
   ★ 종결 = 고른 해 >= closedFrom(「사업 전체」는 2000). 종결 사업은 숫자·챙길 것·받은 서류 확인에서 빠진다(grClosedTypes) — 눌러 고르면 행·서류가 그대로 보인다.
   ★ 상태를 못 읽어도(규칙 게시 전·권한) «종결 없음»으로 돌고 오류 줄은 없다 */
async function grLoadBizState(){
  var seq=++GR.bseq;
  try{ var v=(await fbDb.ref(GR_BIZ.node).once('value')).val(); if(seq!==GR.bseq) return; GR.bizState=(v&&typeof v==='object'&&!Array.isArray(v))?v:{}; GR.dver++; }
  catch(e){ if(seq!==GR.bseq) return; console.warn('[컨설팅보고서] 못 읽음 '+GR_BIZ.node,e); GR.bizState={}; GR.dver++; }
}
/* 쓰기 자리에 들어갈 사업 코드 점검 — 규칙 열쇠 꼴 + 프로토타입 이름 막기 */
function grOkBizCode(k){ return typeof k==='string'&&GR_BIZ.code.test(k)&&k!=='__proto__'&&k!=='constructor'&&k!=='prototype'; }
/* 「⋯ 사업 종결」 — 서류 패널 머리 단추. 창을 연다(아직 쓰지 않는다) */
function grCloseOpen(){
  var code=GR.f.biz;
  if(!code||!grErp(code)) return;
  GR.cm={code:code,day:GR.today,reason:PuGovReportNav.REASONS[0],from:'year',msg:'',err:false,busy:false};
  grRenderCm();
}
function grCloseCm(){ GR.cm=null; grRenderCm(); }
function grRenderCm(){
  var N=PuGovReportNav, D=PuGovReportDocs, c=GR.cm, el=$('cm');
  if(!c){ el.style.display='none'; el.innerHTML=''; return; }
  var lab=N.label(grErp(c.code)||{name:c.code}), yr=/^[0-9]{4}$/.test(GR.f.year)?GR.f.year:'', all=c.from==='all'||!yr;
  var tid=D.linkOf(c.code,(GR.docs||{}).tmap,GR.input&&GR.input.types), n=tid?D.pairs(GR.input,tid,all?'':yr).length:0;
  var opt=function(val,txt,cur){ return '<option value="'+grEsc(val)+'"'+(val===cur?' selected':'')+'>'+grEsc(txt)+'</option>'; };
  el.innerHTML='<div class="toc-box" role="dialog" aria-label="사업 종결">'
    +'<div class="toc-top"><b>사업 종결</b><span class="sp"></span><button type="button" data-close onclick="grCloseCm()">닫기</button></div>'
    +'<div class="toc-h">'+grEsc(lab.text)+' 을(를) 종결 사업으로 옮깁니다. 기록은 지워지지 않고, 목록·숫자·챙길 것·받은 서류 확인에서만 빠집니다.</div>'
    +'<label class="cw-f"><span>종결일</span><input type="date" id="cmDay" value="'+grEsc(c.day)+'"></label>'
    +'<label class="cw-f"><span>사유 (선택)</span><select id="cmWhy">'+N.REASONS.map(function(r){ return opt(r,r,c.reason); }).join('')+'</select></label>'
    +'<label class="cw-c"><input type="radio" name="cmFrom" id="cmFromY"'+(all?'':' checked')+(yr?'':' disabled')+'> '
      +(yr?'<b>'+grEsc(yr)+'년</b>부터 종결 — 그 앞 연도의 업체는 그대로 보입니다':'이 연도부터 종결 — 연도를 고르지 않아 쓸 수 없습니다')+'</label>'
    +'<label class="cw-c"><input type="radio" name="cmFrom" id="cmFromA"'+(all?' checked':'')+'> 사업 전체 — 모든 연도에서 종결</label>'
    +(n?'<div class="tag-chk">⚠ '+(all?'모든 연도 합쳐':grEsc(yr)+'년')+' 업체 '+n+'곳이 걸려 있습니다 — 종결해도 «종결 사업»에서 열어 기록할 수 있습니다</div>':'')
    +(c.msg?'<div class="'+(c.err?'err-s':'days')+'">'+grEsc(c.msg)+'</div>':'')
    +'<div class="cw-b"><button type="button" onclick="grCloseBiz()"'+(c.busy?' disabled':'')+'>종결 사업으로 옮기기</button></div></div>';
  el.style.display='';
}
/* 종결 — scal_bizState/{사업 코드} 한 칸을 쓴다 { closedFrom, closedAt, reason, by, at }. 거절되면(권한 없음·규칙 게시 전) 창에 알리고 목록은 그대로 */
async function grCloseBiz(){
  var N=PuGovReportNav, c=GR.cm;
  if(!c||c.busy) return;
  c.day=String($('cmDay').value||''); c.reason=String($('cmWhy').value||''); c.from=$('cmFromA').checked?'all':'year';
  var code=c.code, yr=/^[0-9]{4}$/.test(GR.f.year)?GR.f.year:'';
  var entry=(grOkBizCode(code)&&grErp(code))?N.closeEntry({from:c.from==='all'?N.ALL_FROM:yr,at:c.day,reason:c.reason,by:GR.staffMap[GR.me]||'',now:Date.now()}):null;
  if(!entry){ c.msg=(grOkBizCode(code)&&grErp(code))?'종결 연도를 정할 수 없습니다 — 연도를 고르거나 「사업 전체」를 골라 주세요':'사업 코드를 확인할 수 없어 종결하지 않았습니다'; c.err=true; grRenderCm(); return; }
  c.busy=true; c.msg='저장하는 중…'; c.err=false; grRenderCm();
  try{ await fbDb.ref(GR_BIZ.node+'/'+code).set(entry); }
  catch(e){ console.warn('[컨설팅보고서] 종결 저장 못 함',e); c.busy=false; c.msg=GR_BIZ.fail; c.err=true; if(GR.cm===c) grRenderCm(); return; }
  var next=Object.assign({},GR.bizState); next[code]=entry; GR.bizState=next; GR.dver++;
  if(GR.cm===c){ GR.cm=null; grRenderCm(); }
  grGlobalRefresh(); grRender();
}
/* 되돌리기 — 그 사업의 같은 칸에 «되돌림 표시»(closedFrom 9999 · 되돌린 날 · 처리자)를 쓴다(모든 연도가 진행으로 — 지우지 않는다: 저장 관문이 물리적 삭제를 막고, 누가 언제 되돌렸는지 남는다).
   다시 종결하면 같은 칸을 새 종결 기록이 덮는다. 거절되면 배너에 알리고 상태는 그대로 */
async function grReopenBiz(){
  var N=PuGovReportNav, code=GR.f.biz;
  if(!code||GR.bbusy||!N.closedFor(GR.bizState,code,GR.f.year)) return;
  if(!grOkBizCode(code)){ GR.bmsg='사업 코드를 확인할 수 없어 되돌리지 않았습니다'; grRenderDocs(); return; }
  var entry=N.closeEntry({from:N.NEVER_FROM,at:GR.today,reason:GR_BIZ.reopen,by:GR.staffMap[GR.me]||'',now:Date.now()});
  if(!entry){ GR.bmsg=GR_BIZ.fail; grRenderDocs(); return; }
  GR.bbusy=true; GR.bmsg=''; grRenderDocs();
  try{ await fbDb.ref(GR_BIZ.node+'/'+code).set(entry); }
  catch(e){ console.warn('[컨설팅보고서] 되돌리기 못 함',e); GR.bbusy=false; GR.bmsg=GR_BIZ.fail; grRenderDocs(); return; }
  GR.bbusy=false; GR.bmsg='';
  var next=Object.assign({},GR.bizState); next[code]=entry; GR.bizState=next; GR.dver++;
  grGlobalRefresh(); grRender();
}

/* ═══ 로그인 — 포털 앱과 같은 문 ═══ */
function grBoot(){
  grLoadDashView();
  grLoadTab();
  $('tdTabs').addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('[data-tab]'):null;
    if(b&&!b.disabled) grSetTab(b.getAttribute('data-tab'));
  });
  $('today').addEventListener('click',function(e){
    var o=e.target&&e.target.closest?e.target.closest('[data-td-open]'):null;
    if(o&&!o.disabled){ grOpenTask(o.getAttribute('data-co'),o.getAttribute('data-ty')); return; }
    var m=e.target&&e.target.closest?e.target.closest('[data-td-more]'):null;
    if(m&&!m.disabled){ grTodayMore(m.getAttribute('data-td-more')); return; }
    var b=e.target&&e.target.closest?e.target.closest('[data-biz]'):null;
    if(b&&!b.disabled) grSetBiz(b.getAttribute('data-biz'));
  });
  $('kpis').addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('[data-st]'):null;
    if(!b||b.disabled) return;
    grSetStatus(b.getAttribute('data-st'));
  });
  Object.keys(GR_FIELDS).forEach(function(id){ $(id).addEventListener('change',function(){ var y0=GR.f.year; GR.f[GR_FIELDS[id]]=this.value; if(GR.f.year!==y0) grGiReset(); grRender(); }); });
  $('fCo').addEventListener('input',function(){ GR.f.co=this.value; grRender(); });
  $('fMine').addEventListener('change',function(){ GR.f.mine=this.checked; grRender(); });
  $('fReset').addEventListener('click',grReset);
  $('biz').addEventListener('click',function(e){
    var hm=e.target&&e.target.closest?e.target.closest('[data-home]'):null;
    if(hm){ grGoHome(); return; }
    var g=e.target&&e.target.closest?e.target.closest('[data-grp]'):null;
    if(g){ if(e.preventDefault) e.preventDefault(); grToggleBizGrp(g.getAttribute('data-grp')); return; }
    var b=e.target&&e.target.closest?e.target.closest('[data-biz]'):null;
    if(b) grSetBiz(b.getAttribute('data-biz'));
  });
  $('yrbar').addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('[data-yr]'):null;
    if(b&&!b.disabled) grSetYear(b.getAttribute('data-yr'));
  });
  $('docs').addEventListener('click',function(e){
    var v=e.target&&e.target.closest?e.target.closest('[data-dv]'):null;
    if(v&&!v.disabled){ grSetDashView(v.getAttribute('data-dv')); return; }
    var b=e.target&&e.target.closest?e.target.closest('[data-cm]'):null;
    if(!b||b.disabled) return;
    if(b.getAttribute('data-cm')==='open') grCloseOpen(); else if(b.getAttribute('data-cm')==='reopen') grReopenBiz();
  });
  ['rows','docs'].forEach(function(id){ $(id).addEventListener('click',function(e){
    var c=e.target&&e.target.closest?e.target.closest('[data-cell]'):null;
    if(c){ grOpenCell(c.getAttribute('data-co'),c.getAttribute('data-ty'),c.getAttribute('data-step'),c.getAttribute('data-item')||''); return; }
    var b=e.target&&e.target.closest?e.target.closest('[data-toc]'):null;
    if(b) grOpenToc(b.getAttribute('data-co'),b.getAttribute('data-ty'));
  }); });
  $('toc').addEventListener('click',function(e){ if(e.target===this) grCloseToc(); });
  $('cellw').addEventListener('click',function(e){ if(e.target===this) grCloseCell(); });
  $('attv').addEventListener('click',function(e){ if(e.target===this) grCloseAv(); });
  $('cm').addEventListener('click',function(e){ if(e.target===this) grCloseCm(); });
  if(location.protocol==='file:'){ lock('file:// 로 열면 로그인할 수 없습니다 — 주소로 여세요'); return; }
  if(typeof firebase==='undefined'){ lock('인터넷이 필요합니다'); return; }
  if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
  fbDb=firebase.database();
  try{ firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
  firebase.auth().onAuthStateChanged(function(u){
    $('outBtn').style.display=u?'':'none';
    if(!u||u.isAnonymous){ PuGate.show(); return; }
    PuGate.hide();
    GR.email=String(u.email||'').toLowerCase();
    $('lock').style.display='none'; $('app').style.display='';
    grLoad();
  });
}
grBoot();
</script>
