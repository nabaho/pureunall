<!-- ══════════════════════════════════════════════════════════════
     푸른노무법인 컨설팅보고서 (gov-report.html) — 2026-10-10
     대표 지시 「포털 의뢰인 업무에 별도 앱을 만들어 진행」 · 시안 확인 후 「진행」.
     설계 docs/superpowers/specs/2026-10-10-gov-report-app-design.md · 계획 docs/superpowers/plans/2026-10-10-gov-report-app.md

     ★ 보고서는 «읽기만» 한다 — 모든 사업장·사업의 보고서 상태를 보고, 쓰는 일은
       정부사업일정의 보고서 창(gov-consulting.html#rpt=업체|사업)으로 건너가서 한다.
     ★ 이 화면이 쓰는 곳은 «하나»다 — 서류 진행 기록(③서명본·④별첨·⑤제출) 줄 하나씩:
       scal_docs/{업체}/{rid}/items/{줄 키} 를 .set (grSaveCell). 설계 docs/superpowers/specs/2026-10-10-gov-report-track-design.md
       규칙 게시 전에는 읽기·쓰기가 거절되어 읽기 전용으로 돈다(「기록을 못 불러왔습니다 — 규칙 게시 또는 권한 확인」).
     ★ 계산은 현황판 계산 모듈(순수 함수, 아래 script 로 싣는다)이 한다. 이 파일은 읽고 그린다.
     ⚠ 목록에는 업체·사업·담당 이름과 상태만 — 보고서 본문을 그리지 않는다(기술보호도 같다).
     ⚠ scal_cos 등은 GR_NODES 로 부른다(정부사업일정 FB_NODES 꼴) — 등록부 js/pu-ontology.js govreport 주석.
     ══════════════════════════════════════════════════════════════ -->
<style>
:root{
  --navy:#1e293b; --mute:#64748b; --line:#e2e8f0; --bg:#f8fafc; --card:#ffffff;
  --blue:#2563eb; --blue-bg:#eff6ff; --blue-line:#bfdbfe; --blue-ink:#1e40af;
  --green:#166534; --green-bg:#f0fdf4; --amber:#854d0e; --amber-bg:#fffbeb; --red:#991b1b; --red-bg:#fef2f2;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--navy);font-size:14px}
#head{position:sticky;top:0;z-index:20;background:var(--card);box-shadow:0 1px 3px rgba(15,23,42,.06)}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.top h1{font-size:17px;margin:0}
.top .sp{flex:1}
#who{font-size:13px;color:var(--mute)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--navy);border-radius:8px;padding:6px 12px}
button:disabled{opacity:.5;cursor:default}
main{max-width:1280px;margin:0 auto;padding:14px 16px 60px}
#lock{display:none;max-width:460px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center}
#lock p{color:var(--mute);font-size:13px}
.loading{padding:30px;text-align:center;color:var(--mute)}
.grid{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:14px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpi{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mute)}
.kpi.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters select,.filters input[type=search]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card)}
.filters label{font-size:13px;display:flex;align-items:center;gap:4px}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{background:var(--bg);font-size:12px;color:var(--mute);font-weight:600}
td.co{font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis}
td.ty{max-width:220px;overflow:hidden;text-overflow:ellipsis}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.st{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px}
.st-todo{background:var(--red-bg);color:var(--red)}
.st-wait{background:var(--line);color:#475569}
.st-draft{background:var(--amber-bg);color:var(--amber)}
.st-done{background:var(--green-bg);color:var(--green)}
.tag,.tag-ai{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11px;border:1px solid var(--line);color:var(--mute)}
.tag-ai{background:var(--blue-bg);color:var(--blue-ink);border-color:var(--blue-line)}
.days{font-size:12px;color:var(--mute)}
.steps{display:inline-flex;gap:3px}
.stp{width:14px;height:6px;border-radius:3px;background:var(--line)}
.stp.on{background:var(--blue)}
.act{display:inline-block;font-size:12px;border:1px solid var(--blue-line);background:var(--blue-bg);color:var(--blue-ink);border-radius:8px;padding:4px 10px;text-decoration:none}
button.act{border-color:var(--line);background:var(--card);color:var(--mute)}
.empty{padding:30px;text-align:center;color:var(--mute)}
#err{background:var(--red-bg);border:1px solid #fecaca;color:var(--red);border-radius:10px;padding:16px;text-align:center}
#err button{margin-top:8px}
.side section,.bizp section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.side h2,.bizp h2{font-size:14px;margin:0 0 8px}
.bz-g{margin-bottom:10px}
.bz-g.off .bz-n{color:var(--mute)}
.bz-h{font-size:12px;color:var(--mute);font-weight:600;margin:6px 0 4px}
.bz{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:1px solid transparent;background:var(--card);padding:5px 8px;margin-bottom:2px}
.bz:hover{background:var(--bg)}
.bz.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-ink)}
.bz-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.bz-k{font-size:11px;color:var(--mute)}
.bz b{font-size:12px;font-variant-numeric:tabular-nums}
.docs{background:var(--card);border:1px solid var(--blue-line);border-radius:10px;padding:10px;margin-bottom:10px;overflow:auto}
.dc-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.dc-l{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.tag-chk{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11px;background:var(--amber-bg);color:var(--amber);border:1px solid #fde68a}
.tocb{margin-left:4px}
.toc{position:fixed;inset:0;z-index:30;background:rgba(15,23,42,.4);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.toc-box{background:var(--card);border-radius:12px;max-width:560px;width:100%;padding:16px}
.toc-top{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.toc-top .sp{flex:1}
.toc-h{font-size:13px;color:var(--mute);margin-bottom:8px;line-height:1.6}
.toc-box>.tag-chk{display:block;margin-bottom:4px}
.toc-l{margin:8px 0 0;padding-left:22px}
.toc-l>li{padding:4px 0;border-bottom:1px solid var(--line)}
.toc-l ul{margin:2px 0 0;padding-left:16px;font-size:12px;color:var(--mute)}
.toc-t{width:100%;min-height:160px;margin-top:8px;font:inherit;font-size:12px}
.cellb{border:0;background:none;padding:0;cursor:pointer}
.cw-f{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:13px}
.cw-f input,.cw-f select,.cw-f textarea{font-family:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card)}
.cw-c{display:flex;align-items:center;gap:6px;font-size:13px;margin:8px 0}
.cw-b{display:flex;justify-content:flex-end;margin-top:10px}
.fm{padding:6px 0;border-bottom:1px solid var(--line)}
.fm-n{font-size:13px;font-weight:600}
.fm-f{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:2px 0}
.yr.none{color:var(--mute)}
.more{display:block;margin-top:8px;font-size:12px;color:var(--blue-ink)}
.err-s{font-size:12px;color:var(--red)}
.al-h{font-size:13px;margin:8px 0 4px}
#alerts ul{margin:0;padding-left:18px;font-size:12px}
#alerts a{color:var(--blue-ink)}
@media (max-width:1100px){ .grid{grid-template-columns:220px minmax(0,1fr)} .side{grid-column:1 / -1} }
@media (max-width:900px){ .grid{grid-template-columns:1fr} .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:640px){ input,select{font-size:16px} }
/* 폰에서 입력칸을 누를 때 화면이 확대되지 않게(tests/phone-input-zoom) */
@media (max-width:768px){ input,select,textarea{font-size:16px} }
</style>
</head>
<body>
<div id="head">
  <div class="top">
    <h1>📑 컨설팅보고서</h1>

<script>
var FB_CONFIG={apiKey:'AIzaSyDkZz5QlKSoqMOYByp5YGeMNLNDrIghliA',authDomain:'pureun-erp.firebaseapp.com',databaseURL:'https://pureun-erp-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'pureun-erp',appId:'1:936817166182:web:9bd31f70d0afdf5fca2aa7',messagingSenderId:'936817166182'};
var fbDb=null;
/* 정부사업일정이 FB_NODES 로 부르는 그 자리 — 읽기만, 한 번씩 */
var GR_NODES={cos:'scal_cos',types:'scal_types',scheds:'scal_scheds',staff:'scal_staff'};
var GR_FIELDS={fYear:'year',fType:'type',fAtt:'att',fStatus:'status'};
/* 서류 관리(왼쪽 패널)가 빌려 읽는 자리 — 이알피 컨설팅 사업 · 이알피 컨설팅 · ERP 연결(정부사업일정이 FB_NODES 로 부르는 그 자리) · 명부
   ⚠ 이름 표로 부른다 — 글자 그대로 ref('scal_…') 를 쓰면 등록부 검사가 주인 없는 자리로 잡는다. 읽기만, 한 번씩 */
var GR_DOC_NODES={biz:'data/biz_cons_types',cons:'data/consultings',tmap:'scal_erpTypeMap',dir:'data/user_dir'};
/* 서류 진행 기록(③서명본·④별첨·⑤제출) — 이 앱의 자리. 읽기는 통째 한 번, 쓰기는 줄 하나(grSaveCell)
   ⚠ 이름 표로 부른다 — 글자 그대로 ref('scal_docs…') 를 쓰지 않는다(화면 검사가 막는다) */
var GR_TRACK_NODES={docs:'scal_docs'};
var GR={seq:0,dseq:0,rows:[],input:null,staffMap:{},index:null,indexErr:false,err:'',loaded:false,me:'',email:'',today:'',docs:{loaded:false,err:false},toc:null,tocMsg:'',tocFail:false,track:null,trackErr:false,tseq:0,saving:{},cw:null,f:{year:'',type:'',att:'',status:'',co:'',mine:false,biz:''}};

function $(id){ return document.getElementById(id); }
function lock(why){ $('app').style.display='none'; $('lock').style.display='block'; $('lockWhy').textContent=why||''; }
function grEsc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return '&#'+c.charCodeAt(0)+';'; }); }
function grToday(){ return new Date(Date.now()+9*3600e3).toISOString().slice(0,10); }
/* 왼쪽에서 고른 이알피 사업 → 정부사업일정 사업 번호(없으면 '') */
function grBizType(){ return GR.f.biz?PuGovReportDocs.linkOf(GR.f.biz,GR.docs.tmap,GR.input&&GR.input.types):''; }
function grErp(code){ return PuGovReportDocs.visibleTypes(GR.docs.biz).filter(function(t){ return t.code===code; })[0]||null; }
/* 사업을 고르면 위 「사업」 거르개 대신 그 번호로 거른다 — 연결이 없으면 아무 줄도 안 맞는 '-' */
function grFilter(){ var f=GR.f; return {year:f.year,type:f.biz?(grBizType()||'-'):f.type,att:f.att,status:f.status,co:f.co,mine:f.mine?GR.me:''}; }

/* ═══ 그리기 ═══ */
function grRenderFilters(){
  var L=PuGovReportList, seenT={}, seenA={};
  $('fYear').innerHTML=L.yearsOf(GR.rows,GR.today).map(function(y){ return '<option value="'+y+'"'+(y===GR.f.year?' selected':'')+'>'+y+'년</option>'; }).join('');
  GR.rows.forEach(function(r){ seenT[r.typeId]=r.typeName; r.attIds.forEach(function(id){ if(GR.staffMap[id]) seenA[id]=GR.staffMap[id]; }); });
  var opts=function(all,seen,cur){ return '<option value="">'+all+'</option>'+Object.keys(seen).sort(function(a,b){ return seen[a].localeCompare(seen[b],'ko'); })
    .map(function(id){ return '<option value="'+grEsc(id)+'"'+(id===cur?' selected':'')+'>'+grEsc(seen[id])+'</option>'; }).join(''); };
  $('fType').innerHTML=opts('모든 사업',seenT,GR.f.type);
  $('fType').disabled=!!GR.f.biz; $('fType').title=GR.f.biz?'왼쪽 컨설팅 사업으로 거르는 중입니다':'';
  $('fAtt').innerHTML=opts('모든 담당',seenA,GR.f.att);
  $('fStatus').value=GR.f.status;
  $('mineWrap').style.display=GR.me?'':'none';
}
function grRenderKpis(){
  var L=PuGovReportList, T=PuGovReportTrack, base=grFilter(); base.status='';
  var view=L.filterRows(GR.rows,base), k=L.kpis(view), x=T.kpiExtra(view);
  var cells=[['','전체',k.all],['todo','미작성',k.todo],['draft','초안',k.draft],['done','검토완료',k.done],['signed','서명',x.signed],['submitted','제출',x.submitted]];
  var tip={signed:' title="③ 업체 서명본이 진행(발송)·완료인 줄"',submitted:' title="⑤ 기관 제출을 마친 줄"'};
  if(GR.trackErr){ tip.signed=tip.submitted=' title="기록을 못 불러왔습니다"'; cells[4][2]=cells[5][2]='?'; }
  $('kpis').innerHTML=cells.map(function(c){
    return '<button type="button" class="kpi'+(c[0]&&GR.f.status===c[0]?' on':'')+'" data-st="'+c[0]+'"'+(tip[c[0]]||'')+'><b>'+c[2]+'</b><span>'+c[1]+'</span></button>';
  }).join('');
}

}

/* 왼쪽 패널 — 이알피 「환경설정 → 컨설팅관리 → 컨설팅 사업」을 기관별로. 숫자는 고른 해의 업체 수 */

/* 서류 체크표 — 고른 사업의 업체들. 간단형 셋(충남북부·서산·기술보호)만 ①② 를 현황판 상태로 채우고
   ③④⑤ 는 서류 진행 기록(scal_docs) — 칸을 누르면 칸 창(grOpenCell). 기록을 못 읽었으면 「—」이고 누를 수 없다
   (남의 기록을 모른 채 덮지 않게). 다른 틀은 근거 자료가 아직 없어 «서류 목차 보기» 줄만 둔다(설계서 §4) */

  el.innerHTML=head+body; el.style.display='';

/* 목차 창 — 업체 한 곳·사업 하나. 이알피 사업은 왼쪽에서 고른 것, 안 골랐으면 이음표를 거꾸로 찾는다 */
function grOpenToc(coId,typeId){
  var D=PuGovReportDocs, d=GR.docs||{};
  var p=D.pairs(GR.input,typeId,GR.f.year).filter(function(x){ return x.coId===coId; })[0];
  if(!p) return;
  var erp=(GR.f.biz&&grBizType()===typeId)?grErp(GR.f.biz):D.erpTypeFor(typeId,d.biz,d.tmap);
  var row=GR.rows.filter(function(r){ return r.coId===coId&&r.typeId===typeId&&r.year===p.year; })[0]||null;
  var cons=D.consFor({consultings:d.cons,co:p.co,code:erp?erp.code:'',typeId:typeId,tmap:d.tmap,biz:d.biz});
  GR.toc=D.tocFor({pair:p,row:row,erp:erp,cons:cons,dir:d.dir,rec:GR.track?PuGovReportTrack.recOf(GR.track,coId,p.rid):undefined,today:GR.today});
  GR.tocMsg=''; GR.tocFail=false;
  grRenderToc();
}
function grRenderToc(){
  var D=PuGovReportDocs, t=GR.toc, el=$('toc');
  if(!t){ el.style.display='none'; el.innerHTML=''; return; }
  var h=t.head;
  var list=t.items.length?'<ol class="toc-l">'+t.items.map(function(x){
      return '<li><span>'+grEsc(x.name)+'</span> '
        +(x.chip.key?'<span class="st st-'+x.chip.key+'">'+grEsc(x.chip.txt)+'</span>':'<span class="days">'+grEsc(x.chip.txt)+'</span>')
        +(x.check?' <span class="tag-chk">'+grEsc(x.check)+'</span>':'')
        +(x.subs.length?'<ul>'+x.subs.map(function(s){ return '<li>'+grEsc(s)+'</li>'; }).join('')+'</ul>':'')+'</li>';
    }).join('')+'</ol>':'<div class="empty">'+grEsc(D.NO_PLAN)+' — 목차는 머리말만</div>';
  el.innerHTML='<div class="toc-box" role="dialog" aria-label="서류 목차">'
    +'<div class="toc-top"><b>목차 — '+grEsc(h.coName)+'</b><span class="sp"></span>'
    +'<button type="button" onclick="grCopyToc()">복사</button><button type="button" data-close onclick="grCloseToc()">닫기</button></div>'
    +'<div class="toc-h">사업: '+grEsc(h.bizName)+(h.agency?' ('+grEsc(h.agency)+')':'')+' · '+grEsc(D.KIND_KO[h.kind])
    +'<br>계약 기간: '+grEsc(h.period||'—')+' · 담당: '+grEsc(h.manager||'—')+' · 회차 '+grEsc(h.rounds)+'</div>'
    +h.warn.map(function(w){ return '<div class="tag-chk">'+grEsc(w)+'</div>'; }).join('')
    +list
    +(GR.tocMsg?'<div class="days">'+grEsc(GR.tocMsg)+'</div>':'')
    +(GR.tocFail?'<textarea class="toc-t" readonly>'+grEsc(D.tocText(t))+'</textarea>':'')
    +'</div>';
  el.style.display='';
}
/* 「복사」 — 보고서 별첨 목록·메일에 붙이기용 글. 못 하면 글 상자를 띄워 직접 고르게 한다 */
function grCopyToc(){
  if(!GR.toc) return Promise.resolve();
  var txt=PuGovReportDocs.tocText(GR.toc);
  var done=function(ok){ GR.tocMsg=ok?'복사했습니다 — 붙여 넣으세요':'복사하지 못했습니다 — 아래 글을 골라 복사해 주세요'; GR.tocFail=!ok; grRenderToc(); };
  try{ return navigator.clipboard.writeText(txt).then(function(){ done(true); },function(){ done(false); }); }
  catch(e){ done(false); return Promise.resolve(); }
}
function grCloseToc(){ GR.toc=null; GR.tocMsg=''; GR.tocFail=false; grRenderToc(); }
/* 칸 창 — 체크표 ③④⑤ 칸 하나. 그 칸의 서류가 여럿이면(기술보호 ④ = 자문 일지 회차 + 서약서·여비·만족도) 서류를 고른다.
   저장은 고른 줄 키 하나만. 기록을 못 읽었으면 열지 않는다 */
function grOpenCell(coId,typeId,step){
  var D=PuGovReportDocs, T=PuGovReportTrack;
  if(!GR.track||GR.trackErr) return;
  var p=D.pairs(GR.input,typeId,GR.f.year).filter(function(x){ return x.coId===coId; })[0];
  var erp=grErp(GR.f.biz);
  if(!p||!erp) return;
  var keys=T.keysFor(D.planFor(erp.name),step,Math.max(+p.rounds||0,+p.planned||0));
  if(!keys.length) return;
  GR.cw={coId:coId,coName:p.coName,typeId:typeId,rid:p.rid,step:step,keys:keys,key:keys[0].key,draft:null,msg:'',err:false,busy:false};
  grRenderCell();
}
function grPickCell(key){
  if(!GR.cw||!GR.cw.keys.some(function(k){ return k.key===key; })) return;
  GR.cw.key=key; GR.cw.draft=null; GR.cw.msg=''; GR.cw.err=false;
  grRenderCell();
}
/* 쓰기 자리에 들어갈 이름 점검 — 경로 글자·프로토타입 이름을 막는다(줄 키는 모듈 KEY_RE) */
function grOkId(k){ return typeof k==='string'&&!!k&&k.length<=100&&!/[\/.#$\[\]\s]/.test(k)&&k!=='__proto__'&&k!=='constructor'&&k!=='prototype'; }
function grCloseCell(){ GR.cw=null; grRenderCell(); }
function grRenderCell(){
  var T=PuGovReportTrack, L=PuGovReportList, c=GR.cw, el=$('cellw');
  if(!c){ el.style.display='none'; el.innerHTML=''; return; }
  var rec=T.recOf(GR.track||{},c.coId,c.rid)[c.key]||null, v=c.draft||rec||{st:'none'};
  var item=c.keys.filter(function(k){ return k.key===c.key; })[0]||c.keys[0];
  var opt=function(val,txt,cur){ return '<option value="'+grEsc(val)+'"'+(val===cur?' selected':'')+'>'+grEsc(txt)+'</option>'; };
  var field=function(name,inner){ return '<label class="cw-f"><span>'+name+'</span>'+inner+'</label>'; };
  var date=function(id,val){ return '<input type="date" id="'+id+'" value="'+grEsc(val||'')+'">'; };
  var h='<div class="toc-box" role="dialog" aria-label="서류 진행 기록">'
    +'<div class="toc-top"><b>'+grEsc(T.COL_KO[c.step])+' — '+grEsc(c.coName)+'</b><span class="sp"></span>'
    +'<button type="button" data-close onclick="grCloseCell()">닫기</button></div>';
  if(c.keys.length>1) h+=field('서류','<select id="cwKey" onchange="grPickCell(this.value)">'+c.keys.map(function(k){ return opt(k.key,k.name,c.key); }).join('')+'</select>');
  else h+='<div class="toc-h">서류: '+grEsc(item.name)+'</div>';
  h+=field('상태','<select id="cwSt">'+T.ALLOWED[c.step].map(function(s){ return opt(s,T.label(c.step,s),v.st); }).join('')+'</select>');
  if(c.step==='sign') h+=field('발송일',date('cwSent',v.sentAt))+field('회신(스캔 받음)일',date('cwGot',v.gotAt));
  if(c.step==='submit') h+=field('제출일',date('cwGot',v.gotAt))
    +field('제출 방식','<select id="cwHow">'+opt('','고르기',v.how||'')+Object.keys(T.HOW).map(function(k){ return opt(k,T.HOW[k],v.how||''); }).join('')+'</select>')
    +'<label class="cw-c"><input type="checkbox" id="cwAck"'+(v.ack?' checked':'')+'> 접수 확인</label>';
  /* ③ 서명본 칸만 — 받은 한글 파일(.hwp·.hwpx)을 «이 브라우저 안에서만» 열어 본다. 올리지도 저장하지도 않는다(grOpenHwp) */
  if(c.step==='sign') h+='<div class="cw-f"><span>받은 한글 파일</span><button type="button" onclick="grPickHwp()">📂 받은 한글 파일 열어 보기</button>'
    +'<input type="file" id="cwHwp" accept=".hwp,.hwpx" style="display:none" onchange="grOpenHwp(this)">'
    +'<div class="days" id="cwHwpMsg">고른 파일은 이 화면에서만 읽습니다 — 올리지도 저장하지도 않습니다</div></div>';
  h+=field('메모(200자)','<textarea id="cwNote" maxlength="200" rows="3">'+grEsc(v.note||'')+'</textarea>')
    +'<div class="days">메모에 연락처·주민번호 같은 개인정보를 적지 마세요</div>'
    +(rec&&rec.at?'<div class="days">고친 사람 '+grEsc(rec.by||'—')+' · '+grEsc(L.dayOf(rec.at))+'</div>':'')
    +(c.msg?'<div class="'+(c.err?'err-s':'days')+'">'+grEsc(c.msg)+'</div>':'')
    +'<div class="cw-b"><button type="button" onclick="grSaveCell()"'+(c.busy?' disabled':'')+'>저장</button></div></div>';
  el.innerHTML=h; el.style.display='';
}
/* 저장 — 그 줄 키 하나만 .set(scal_docs/{업체}/{rid}/items/{키}). update 는 저장 관문이 «부분 update» 로 막는다.
   거절되면(규칙 게시 전·권한 없음) 창에 알리고 값은 그대로 둔다. 되면 다시 읽지 않고 로컬 값으로 다시 그린다 */
async function grSaveCell(){
  var T=PuGovReportTrack, c=GR.cw;
  if(!c||c.busy) return;
  var pk=c.coId+'/'+c.rid+'/'+c.key;
  if(!grOkId(c.coId)||!grOkId(c.rid)||!T.KEY_RE.test(c.key)||c.key.length>20||!c.keys.some(function(k){ return k.key===c.key; })){ c.msg=T.SAVE_FAIL; c.err=true; grRenderCell(); return; }
  if(GR.saving[pk]){ c.msg='같은 칸을 저장하는 중입니다 — 잠시 뒤에 다시 눌러 주세요'; c.err=true; grRenderCell(); return; }
  var entry={st:$('cwSt').value,note:$('cwNote').value,
    sentAt:c.step==='sign'?$('cwSent').value:'',gotAt:c.step==='attach'?'':$('cwGot').value,
    how:c.step==='submit'?$('cwHow').value:'',ack:c.step==='submit'&&!!$('cwAck').checked};
  c.draft=entry;
  var bad=T.validate(entry,c.step);
  if(bad){ c.msg=bad; c.err=true; grRenderCell(); return; }
  var rec=T.patchFor(entry,GR.staffMap[GR.me]||'',Date.now());
  var base=GR.track;
  c.busy=true; GR.saving[pk]=true; c.msg='저장하는 중…'; c.err=false; grRenderCell();
  try{ await fbDb.ref(GR_TRACK_NODES.docs+'/'+c.coId+'/'+c.rid+'/items/'+c.key).set(rec); }
  catch(e){
    console.warn('[컨설팅보고서] 저장 못 함',e);
    delete GR.saving[pk];
    c.busy=false; c.msg=T.SAVE_FAIL; c.err=true;
    if(GR.cw===c) grRenderCell();
    return;
  }
  delete GR.saving[pk];
  /* 저장하는 사이 다시 읽기가 시작·끝났거나 못 읽은 상태면(옛 기록 위에 덮지 않게) 로컬 표는 건드리지 않는다 */
  if(base&&GR.track===base&&!GR.trackErr){
    GR.track=T.put(GR.track,c.coId,c.rid,c.key,rec);
    c.busy=false; c.draft=null; c.msg='저장했습니다'; c.err=false;
    grApplyTrack(); grRender();
  }else{
    c.busy=false; c.msg='저장했습니다 — 목록을 다시 불러온 뒤 확인해 주세요'; c.err=false;
  }
  if(GR.cw===c) grRenderCell();
}
/* 📂 받은 한글 파일 열어 보기 — 고른 파일은 브라우저 안에서만 읽어 미리보기 창(PuHwpPreview)에 넘긴다. 어디에도 올리지·쓰지 않는다.
   안내는 글자(textContent)로만 — 파일 이름은 사람이 정한 데이터. 칸 창은 다시 그리지 않는다(적던 값 보존)
   ★ 파일을 잡자마자(await 전에) 고르기 칸을 비운다 — 불러오는 사이 창을 닫고 같은 파일을 다시 골라도 change 가 뜬다.
     잡아 둔 File 은 칸을 비워도 그대로 읽힌다.
   ★ 창을 닫았거나 다른 파일에 밀려 취소된 것(e.cancelled)은 실패가 아니다 — 안내 줄을 건드리지 않는다. */
function grPickHwp(){ var el=$('cwHwp'); if(el&&el.click) el.click(); }
async function grOpenHwp(input){
  var say=function(m,bad){ var e=$('cwHwpMsg'); if(e){ e.textContent=m; e.className=bad?'err-s':'days'; } return {ok:!bad,msg:m}; };
  var f=input&&input.files&&input.files[0];
  try{ if(input) input.value=''; }catch(e){}
  if(!f) return {ok:false};
  if(!/\.hwpx?$/i.test(String(f.name||''))) return say('한글(.hwp·.hwpx) 파일만 열 수 있습니다',true);
  if(!window.PuHwpPreview) return say('한글 미리보기를 불러오지 못했습니다 — 새로 고친 뒤 다시 눌러 주세요',true);
  try{
    var buf=await f.arrayBuffer();
    await window.PuHwpPreview.open(buf,f.name);
    return say('열었습니다 — '+f.name);
  }catch(e){
    if(e&&e.cancelled) return {ok:false,cancelled:true};
    console.warn('[컨설팅보고서] 한글 미리보기 실패',e);
    return say((e&&e.message)||'미리보기를 열지 못했습니다',true);
  }
}
/* 양식 서고 — 읽기만. 등록·바꾸기는 정부사업일정의 ⚙ 양식 서고(#forms, 관리자) */
function grRenderForms(){
  var L=PuGovReportList, FORMS=(window.PuGovReport&&window.PuGovReport.FORMS)||{};
  var head=GR.indexErr?'<div class="err-s">서고 색인을 못 읽었습니다 — 연결을 확인해 주세요</div>':'';
  $('forms').innerHTML=head+L.formsStatus(GR.index,FORMS).map(function(f){
    return '<div class="fm"><div class="fm-n">'+(f.ready?'✅ ':'⚠ ')+grEsc(f.name)+'</div>'+f.files.map(function(x){
      return '<div class="fm-f"><span>'+grEsc(x.label)+'</span><span class="yr'+(x.latest?'':' none')+'">'+(x.latest?grEsc(x.years.join(' · ')):'등록된 양식 없음')+'</span></div>';
    }).join('')+'</div>';
  }).join('')+'<a class="more" href="'+L.FORMS_HREF+'">⚙ 등록·바꾸기 — 정부사업일정 양식 서고</a>';
}
function grRenderAlerts(){
  var L=PuGovReportList, T=PuGovReportTrack, rows=L.filterRows(GR.rows,{year:GR.f.year});
  var a=L.alerts(rows,GR.today), x=T.alertsExtra(rows,GR.today);
  var line=function(r,txt){ return '<li><a href="'+grEsc(L.reportHref(r.coId,r.typeId))+'">'+grEsc(r.coName)+' · '+grEsc(r.typeName)+'</a> <span class="days">'+grEsc(txt)+'</span></li>'; };
  $('alerts').innerHTML='<div class="al-h">종료 후 '+L.UNWRITTEN_DAYS+'일 넘은 미작성 <b>'+a.unwritten.length+'</b></div><ul>'
    +a.unwritten.map(function(r){ return line(r,'종료 '+r.st.days+'일'); }).join('')+'</ul>'
    +'<div class="al-h">초안 '+L.DRAFT_DAYS+'일 넘음 <b>'+a.staleDraft.length+'</b></div><ul>'
    +a.staleDraft.map(function(r){ return line(r,r.st.days+'일 전 고침'); }).join('')+'</ul>'
    +'<div class="al-h">서명 회신 기다림 ('+T.WAIT_SIGN_DAYS+'일 넘음) <b>'+x.waitSign.length+'</b></div><ul>'
    +x.waitSign.map(function(e){ return line(e.row,'회신 '+e.days+'일째'); }).join('')+'</ul>'
    +'<div class="al-h">제출 기한 지남 <b>'+x.overdue.length+'</b></div><ul>'
    +x.overdue.map(function(e){ return line(e.row,'기한 '+e.due); }).join('')+'</ul>'
    +(GR.trackErr?'<div class="err-s">'+grEsc(T.LOAD_FAIL)+'</div>':'');
}
function grRender(){
  $('loading').style.display=GR.loaded?'none':'';
  if(GR.err){
    $('err').innerHTML='<div>불러오지 못했습니다 — 연결을 확인해 주세요</div><button type="button" onclick="grLoad()">다시 시도</button>';
    $('err').style.display=''; $('board').style.display='none'; return;
  }
  $('err').style.display='none'; $('board').style.display=GR.loaded?'':'none';
  grRenderBiz(); grRenderFilters(); grRenderKpis(); grRenderDocs(); grRenderRows(); grRenderForms(); grRenderAlerts();
}
function grReset(){
  GR.f.year=GR.today.slice(0,4); GR.f.type=''; GR.f.att=''; GR.f.status=''; GR.f.co=''; GR.f.mine=false; GR.f.biz='';
  $('fCo').value=''; $('fMine').checked=false;
  grRender();
}

/* ═══ 읽기 — 일정 넷을 한 번씩, 보고서는 줄마다 한 자리씩(확정본 사본 _v 는 안 읽는다) ═══ */
async function grLoad(){
  var L=PuGovReportList, input={}, keys=Object.keys(GR_NODES);
  var seq=++GR.seq;
  GR.err=''; GR.today=grToday(); grRender();
  try{
    var vals=await Promise.all(keys.map(function(k){ return fbDb.ref(GR_NODES[k]).once('value').then(function(s){ return s.val(); }); }));
    keys.forEach(function(k,i){ input[k]=vals[i]; });
    input.today=GR.today;
    var reps={};
    await Promise.all(L.reportKeys(input).map(function(x){
      return fbDb.ref('scal_reports/'+x.coId+'/'+x.rid).once('value').then(function(s){
        var v=s.val(); if(v){ reps[x.coId]=reps[x.coId]||{}; reps[x.coId][x.rid]=v; }
      });
    }));
    if(seq!==GR.seq) return;
    input.reports=reps;
    GR.rows=L.buildRows(input);
    GR.input=input;
    GR.staffMap=L.staffNames(input.staff);
    if(!GR.f.year) GR.f.year=GR.today.slice(0,4);
  }catch(e){ if(seq!==GR.seq) return; console.warn('[컨설팅보고서] 못 읽음',e); GR.err=String((e&&e.message)||e); GR.rows=[]; GR.input=null; }
  var idx=null, idxErr=false;
  try{ idx=(await fbDb.ref('scal_rptFormsIndex').once('value')).val()||{}; }
  catch(e){ idx=null; idxErr=true; }
  if(seq!==GR.seq) return;
  GR.index=idx; GR.indexErr=idxErr;
  GR.me='';
  if(!GR.err&&GR.email){
    var me='';
    try{ me=L.staffIdFor(input.staff,(await fbDb.ref('data/user_dir').once('value')).val(),GR.email); }catch(e){ me=''; }
    if(seq!==GR.seq) return;
    GR.me=me;
  }
  await grLoadDocs();
  if(seq!==GR.seq) return;
  await grLoadTrack();
  if(seq!==GR.seq) return;
  grApplyTrack();
  GR.loaded=true;
  grRender();
}
/* 왼쪽 패널 자료 — 하나라도 못 읽어도 오른쪽 목록은 돈다. 사업 목록을 못 읽은 것만 «오류»로 친다 */
async function grLoadDocs(){
  var seq=++GR.dseq, keys=Object.keys(GR_DOC_NODES);
  var got=await Promise.all(keys.map(function(k){
    return fbDb.ref(GR_DOC_NODES[k]).once('value').then(function(s){ return {ok:true,v:s.val()}; },
      function(e){ console.warn('[컨설팅보고서] 못 읽음 '+GR_DOC_NODES[k],e); return {ok:false,v:null}; });
  }));
  if(seq!==GR.dseq) return;
  var d={loaded:true,err:!got[keys.indexOf('biz')].ok};
  keys.forEach(function(k,i){ d[k]=got[i].v; });
  GR.docs=d;
}
async function grRetryDocs(){
  GR.docs={loaded:false,err:false}; grRenderBiz();
  await grLoadDocs();
  grApplyTrack();
  grRender();
}
/* 서류 진행 기록 — 통째로 한 번(once). 못 읽으면(규칙 게시 전·권한 없음) 체크표 ③④⑤ 만 읽기 전용 「—」, 나머지는 그대로 돈다 */
async function grLoadTrack(){
  var seq=++GR.tseq;
  try{ var t=PuGovReportTrack.normalize((await fbDb.ref(GR_TRACK_NODES.docs).once('value')).val()); if(seq!==GR.tseq) return; GR.track=t; GR.trackErr=false; }
  catch(e){ if(seq!==GR.tseq) return; console.warn('[컨설팅보고서] 못 읽음 '+GR_TRACK_NODES.docs,e); GR.track=null; GR.trackErr=true; }
}
/* 현황판 줄에 기록을 붙인다(r.trk · ③④ 막대) — 읽은 뒤 · 저장한 뒤 · 왼쪽 자료를 다시 읽은 뒤 */
function grApplyTrack(){
  var d=GR.docs||{};
  PuGovReportDocs.trackRows(GR.rows,{track:GR.track,input:GR.input,biz:d.biz,tmap:d.tmap,consultings:d.cons,today:GR.today});
}

/* ═══ 로그인 — 포털 앱과 같은 문 ═══ */
function grBoot(){
  $('kpis').addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('[data-st]'):null;
    if(!b||b.disabled) return;
    grSetStatus(b.getAttribute('data-st'));
  });
  Object.keys(GR_FIELDS).forEach(function(id){ $(id).addEventListener('change',function(){ GR.f[GR_FIELDS[id]]=this.value; grRender(); }); });
  $('fCo').addEventListener('input',function(){ GR.f.co=this.value; grRender(); });
  $('fMine').addEventListener('change',function(){ GR.f.mine=this.checked; grRender(); });
  $('fReset').addEventListener('click',grReset);
  $('biz').addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('[data-biz]'):null;
    if(b) grSetBiz(b.getAttribute('data-biz'));
  });
  ['rows','docs'].forEach(function(id){ $(id).addEventListener('click',function(e){
    var c=e.target&&e.target.closest?e.target.closest('[data-cell]'):null;
    if(c){ grOpenCell(c.getAttribute('data-co'),c.getAttribute('data-ty'),c.getAttribute('data-step')); return; }
    var b=e.target&&e.target.closest?e.target.closest('[data-toc]'):null;
    if(b) grOpenToc(b.getAttribute('data-co'),b.getAttribute('data-ty'));
  }); });
  $('toc').addEventListener('click',function(e){ if(e.target===this) grCloseToc(); });
  $('cellw').addEventListener('click',function(e){ if(e.target===this) grCloseCell(); });
  if(location.protocol==='file:'){ lock('file:// 로 열면 로그인할 수 없습니다 — 주소로 여세요'); return; }
  if(typeof firebase==='undefined'){ lock('인터넷이 필요합니다'); return; }
  if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
  fbDb=firebase.database();
  try{ firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
  firebase.auth().onAuthStateChanged(function(u){
    $('outBtn').style.display=u?'':'none';
    if(!u||u.isAnonymous){ PuGate.show(); return; }
    PuGate.hide();
    GR.email=String(u.email||'').toLowerCase();
    $('lock').style.display='none'; $('app').style.display='';
    grLoad();
  });
}
grBoot();
</script>
</body>
