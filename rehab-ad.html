<!-- ══════════════════════════════════════════════════════════════
     푸른노무법인 회생광고 (rehab-ad.html) — 2026-10-10
     대표 지시 「법인회생이 발생하면 재기지원컨설팅으로 연결 … 포괄금지명령 나온 기업들만 모아서
     홍보물 보내고 … 푸른통합시스템에 앱 만든다. 회생광고로」
     · 「UI 깔끔하고 구체적으로 정리」 · 「대법원 정보 한 달 치」 · 「주소가 있으면 홈페이지를 찾아 연락처·메일·팩스를 정렬해서」
     방식 결정 「추천대로」 = ① 서버가 매일 모은다 ② 사람이 고른다 ③ 우편으로 보낸다.

     ★ 자료가 오는 길
       서버 rehabWatch(functions/rehab-watch.js, 매일 07:40)가 전국 회생 관할 법원 공고에서
       «법인회생 · 포괄적 금지명령» 사건을 rehab_ad/notices 에 담고, 같은 사건의 개시결정·인가 같은 공고는 «이력(events)»과
       «단계(stage)»로 붙인다. 회사 연락처는 rehab_ad/info 에 담긴다(functions/rehab-contact.js — 홈페이지·업체 정보에서만).
       이 화면은 notices·info 를 «읽기만» 한다. 사람이 정하는 것(상태·메모·손으로 고친 연락처)만 rehab_ad/marks 에 쓴다.

     ⚠ 이메일·문자 발송 단추를 넣지 말 것 — 정보통신망법 제50조: 영리 목적 광고성 정보를
       전자적으로 보내려면 «받는 사람의 사전 동의»가 있어야 한다. 이 기업들은 동의한 적이 없다.
       우편(서면)은 그 조항의 대상이 아니다. 찾은 이메일은 «복사해 두는» 용도다(상담 때 동의를 받은 뒤 푸른 메일로).
     ⚠ 혁신바우처 관리지침 제37조 — 수요기업에게 «과도한 영업»은 참여제한 사유다. 노무(대지급금·고용조정·임금 정리) 안내가 중심이다.
     ⚠ 라벨은 «본점 주소»로 만든다. 법원 송달주소는 대리인 법률사무소인 일이 많아 따로 보여 주기만 한다.
     ⚠ 회사명은 «보이는 이름»이다. 기업정보함과 이름으로 잇지 않는다(사업자번호가 없다 — 온톨로지 규칙).
     ⚠ 대표 전용(uid_roles 의 isAdmin). 모르면 잠근다(fail-closed).
     ══════════════════════════════════════════════════════════════ -->

function statusOf(id){ var m=MARKS[id]; return (m && !m._deleted && STATUS[m.status]) ? m.status : 'new'; }

/* ── 연락처 합치기: 사람이 손으로 적은 것(marks.contact)이 서버가 찾은 것(info)보다 앞선다 ── */
function contactOf(id){
  var i=INFO[id]||{}, m=(MARKS[id]&&MARKS[id].contact)||{};
  var phones=uniq([m.phone].concat(i.phones||[]));
  var faxes=uniq([m.fax].concat(i.faxes||[]));
  var emails=uniq([m.email].concat(i.emails||[]));
  var homepage=m.homepage||i.homepage||'';
  var manual=!!(m.phone||m.fax||m.email||m.homepage);
  var any=phones.length||faxes.length||emails.length;
  return { phones:phones, faxes:faxes, emails:emails, homepage:homepage, manual:manual, any:!!any,
    check: !manual && i.confidence==='low' && !!(any||homepage), conf:i.confidence||'', note:i.note||'', refs:i.refs||[],
    sources:i.sources||[], checkedAt:i.checkedAt||0, status:i.status||'', searched:!!INFO[id] };
}

/* ═══ 거르기·정렬 ═══ */
function baseList(){
  var days=Number($('fDays').value), court=$('fCourt').value, sido=$('fSido').value, type=$('fType').value, stage=$('fStage').value,
      ct=$('fContact').value, q=$('fText').value.trim().toLowerCase(), since=days?daysAgo(days):'';
  return Object.keys(NOTICES).map(function(k){ return NOTICES[k]; }).filter(function(n){
    if(!n || n._deleted) return false;
    if(since && (n.noticeDate||'')<since) return false;
    if(court && n.courtCode!==court) return false;
    if(sido && n.sido!==sido) return false;
    if(type && n.caseType!==type) return false;
    if(stage && n.stage!==stage) return false;
    if(ct){ var c=contactOf(n.id); if(ct==='has' && !c.any) return false; if(ct==='none' && c.any) return false; if(ct==='check' && !c.check) return false; }
    if(q && ((n.debtorName||'')+' '+(n.address||'')+' '+(n.counsel||'')+' '+(n.dlvAddress||'')).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function sortList(list){
  var s=$('fSort').value;
  return list.slice().sort(function(a,b){
    if(s==='name') return (a.debtorName||'').localeCompare(b.debtorName||'','ko');
    if(s==='region') return ((a.sido||'')+(a.sigungu||'')).localeCompare((b.sido||'')+(b.sigungu||''),'ko') || (b.noticeDate||'').localeCompare(a.noticeDate||'');
    if(s==='contact'){ var d=(contactOf(b.id).any?1:0)-(contactOf(a.id).any?1:0); if(d) return d; }
    return (b.noticeDate||'').localeCompare(a.noticeDate||'') || (a.courtName||'').localeCompare(b.courtName||'');
  });
}

/* ═══ 그리기 ═══ */
function drawTabs(base){
  var c={all:base.length,new:0,send:0,hold:0,skip:0,sent:0};
  base.forEach(function(n){ c[statusOf(n.id)]++; });
  var names={all:'전체',new:'미검토',send:'발송 예정',hold:'보류',skip:'제외',sent:'발송 완료'};
  $('tabs').innerHTML=['all','new','send','hold','skip','sent'].map(function(k){
    return '<div class="tab'+(TAB===k?' on':'')+'" data-tab="'+k+'"><b>'+c[k]+'</b><span>'+names[k]+'</span></div>';
  }).join('');
}
function iconsOf(c){
  function ic(on,ch,t){ return '<span class="ico'+(on?'':' off')+'" title="'+esc(t)+'">'+ch+'</span>'; }
  return ic(c.phones.length,'☎',c.phones[0]||'전화 없음')+ic(c.faxes.length,'📠',c.faxes[0]||'팩스 없음')+

  if(r && r.contactNote) bits.push('⚠ '+r.contactNote);

function fillFilters(){
  var courts={}, sidos={}, stages={};
  Object.keys(NOTICES).forEach(function(k){ var n=NOTICES[k]; if(!n) return; if(n.courtCode) courts[n.courtCode]=n.courtName; if(n.sido) sidos[n.sido]=1; if(n.stage) stages[n.stage]=1; });
  function fill(id,first,items,labels){
    var cur=$(id).value;
    $(id).innerHTML='<option value="">'+first+'</option>'+items.map(function(v){ return '<option value="'+esc(v)+'">'+esc(labels?labels[v]:v)+'</option>'; }).join('');

  fill('fCourt','모든 법원',Object.keys(courts).sort(function(a,b){ return courts[a].localeCompare(courts[b],'ko'); }),courts);
  fill('fSido','모든 지역',Object.keys(sidos).sort(function(a,b){ return a.localeCompare(b,'ko'); }));

/* ═══ 표시 저장 — 건수를 묻고 한 번에 저장한다 ═══ */
function saveMark(id, patch){
  var ref=fbDb.ref('rehab_ad/marks/'+id), now=Date.now();
  return gate.save(ref, function(prev){
    prev=prev||{};
    return Object.assign({}, prev, { id:id, entityType:'Task', taskKind:'rehabOutreach', sourceKind:'rehabNotice', sourceId:id }, patch(prev,now));
  }, { entityType:'Task' });
}
async function loadMarks(){ MARKS=(await fbDb.ref('rehab_ad/marks').once('value')).val()||{}; }
async function loadInfo(){ INFO=(await fbDb.ref('rehab_ad/info').once('value')).val()||{}; }
async function setStatus(id, st){
  try{ await saveMark(id, function(prev,now){ return { status:st, statusAt:now, sentAt: st==='sent'?now:(prev.sentAt||null) }; }); await loadMarks(); draw(); toast('「'+STATUS[st]+'」(으)로 표시했습니다'); }
  catch(e){ toast('저장하지 못했습니다: '+(e&&e.message||e)); }
}
async function bulk(st){
  var list=VIEW.filter(function(n){ return SEL[n.id]; }); if(!list.length) return;
  if(!confirm(list.length+'곳을 「'+STATUS[st]+'」(으)로 표시할까요?')) return;
  var res=await Promise.allSettled(list.map(function(n){ return saveMark(n.id, function(prev,now){ return { status:st, statusAt:now, sentAt: st==='sent'?now:(prev.sentAt||null) }; }); }));
  var fail=res.filter(function(r){ return r.status==='rejected'; });
  await loadMarks(); SEL={}; draw();
  toast(fail.length ? ((list.length-fail.length)+'곳 저장 · '+fail.length+'곳 실패: '+String(fail[0].reason&&fail[0].reason.message||fail[0].reason)) : list.length+'곳을 「'+STATUS[st]+'」(으)로 표시했습니다');
}
async function saveManual(){

  var c={ phone:$('mcPhone').value.trim(), fax:$('mcFax').value.trim(), email:$('mcEmail').value.trim(), homepage:$('mcHome').value.trim() };

}

/* ═══ 연락처 찾기 — 서버(rehabEnrich)가 홈페이지·업체 정보에서 찾는다 ═══ */
function setProg(t){ var p=$('prog'); p.style.display=t?'block':'none'; p.textContent=t||''; }
async function enrich(ids, hints){
  if(!ids.length){ toast('찾을 회사가 없습니다'); return; }
  var tok; try{ tok=await firebase.auth().currentUser.getIdToken(); }catch(e){ toast('로그인이 필요합니다'); return; }
  var done=0, found=0, refused=0, failed=0, errMsg='';
  setProg('연락처 찾는 중 0/'+ids.length+' …');
  for(var i=0;i<ids.length;i+=4){
    var batch=ids.slice(i,i+4);
    try{
      var r=await fetch(ENRICH_URL,{ method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+tok }, body:JSON.stringify({ ids:batch, hints:hints||{} }) });
      var j={}; try{ j=await r.json(); }catch(e){}
      if(r.status===404 || r.status===0) throw new Error('서버 함수(rehabEnrich)가 아직 올라가지 않았습니다');
      if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
      (j.results||[]).forEach(function(x){ if(x.refused) refused++; else if(x.status==='found') found++; });
      done+=batch.length;
      if(j.providers==='없음'){ errMsg='서버에 검색 열쇠(KAKAO_REST_KEY)가 없습니다'; break; }
    }catch(e){ failed+=batch.length; errMsg=String(e&&e.message||e); if(/올라가지/.test(errMsg)) break; }
    setProg('연락처 찾는 중 '+Math.min(i+4,ids.length)+'/'+ids.length+' … 찾음 '+found+'곳');
  }
  try{ await loadInfo(); }catch(e){}
  setProg(''); draw();
  var msg='연락처 찾기 끝 — '+found+'곳에서 찾음';
  if(refused) msg+=' · 검색 서비스가 거절한 '+refused+'곳은 다음에 다시';
  if(failed) msg+=' · 실패 '+failed+'곳'+(errMsg?'('+errMsg+')':'');
  else if(errMsg) msg+=' · '+errMsg;
  toast(msg);
}
function findContacts(onlySel, oneId){
  if(oneId){ enrich([oneId]); return; }
  var ids = (onlySel || Object.keys(SEL).length) ? Object.keys(SEL)
    : VIEW.filter(function(n){ return !INFO[n.id]; }).map(function(n){ return n.id; });
  if(ids.length>12 && !confirm(ids.length+'곳의 연락처를 찾습니다. 한 곳에 몇 초씩 걸립니다. 계속할까요?')) return;
  enrich(ids);
}
function readHome(){
  var hp=$('mcHome').value.trim();
  if(!safeHref(hp)){ toast('홈페이지 주소를 https:// 로 먼저 입력하세요'); return; }
  var h={}; h[CUR]={ homepage:hp }; enrich([CUR], h);
}

/* ═══ 인쇄·CSV ═══ */
function printList(list, what){
  if(!list.length) return;
  var w=window.open('', '_blank');
  if(!w){ toast('팝업이 막혀 있습니다 — 이 사이트의 팝업을 허용해 주세요'); return; }
  w.document.write(RehabLetter.buildDocument(list, what, { draft: $('draftCk') ? $('draftCk').checked : true })); w.document.close();
}
function printDocs(what){ printList(VIEW.filter(function(n){ return SEL[n.id]; }), what); }
function printOne(what){ var n=NOTICES[CUR]; if(n) printList([n], what); }
function downloadCsv(){
  var list=VIEW.filter(function(n){ return SEL[n.id]; }); if(!list.length) return;
  var head=['공고일','법원','사건번호','종류','단계','회사명','우편번호','본점 주소','송달주소','대리인','전화','팩스','이메일','홈페이지','상태','메모'];
  var q=function(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  var body=list.map(function(n){ var c=contactOf(n.id), m=MARKS[n.id]||{};
    return [n.noticeDate,n.courtName,n.caseNo,n.caseType,n.stage,n.debtorName,n.zip,n.address,n.dlvAddress,n.counsel,c.phones.join(' / '),c.faxes.join(' / '),c.emails.join(' / '),c.homepage,STATUS[statusOf(n.id)],m.memo].map(q).join(','); });
  var blob=new Blob(['﻿'+[head.join(',')].concat(body).join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='회생광고_'+seoulToday()+'_'+list.length+'곳.csv';
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
}

/* ═══ 불러오기 ═══ */
async function reload(){
  try{
    var r=await Promise.all([fbDb.ref('rehab_ad/notices').once('value'), loadMarks(), loadInfo(), fbDb.ref('rehab_ad/runs').orderByKey().limitToLast(1).once('value')]);
    NOTICES=r[0].val()||{};
    var runs=r[3].val()||{}, k=Object.keys(runs).pop(); LASTRUN=k?Object.assign({date:k},runs[k]):null;
    fillFilters(); draw();
  }catch(e){ toast('불러오지 못했습니다: '+(e&&e.message||e)); }
}
function resetFilters(){ $('fDays').value='31'; $('fCourt').value=''; $('fSido').value=''; $('fType').value=''; $('fStage').value=''; $('fContact').value=''; $('fSort').value='date'; $('fText').value=''; TAB='all'; draw(); }
function clearSel(){ SEL={}; draw(); }

/* ═══ 로그인·잠금 — 모르면 잠근다 ═══ */
async function isAdmin(u){
  try{ var v=(await fbDb.ref('uid_roles/'+u.uid).once('value')).val()||{}; return v.isAdmin===true; }catch(e){ return false; }
}
function lock(why){ $('app').style.display='none'; $('lock').style.display='block'; $('lockWhy').textContent=why||''; }
function copyText(t){
  function fb(){ var a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); }catch(e){} a.remove(); }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(fb); else fb();
  toast('복사했습니다');
}
function boot(){
  ['fDays','fCourt','fSido','fType','fStage','fContact','fSort'].forEach(function(id){ $(id).addEventListener('change',function(){ lsSet(id,$(id).value); draw(); }); });
  $('fText').addEventListener('input',draw);
  $('tabs').addEventListener('click',function(e){ var t=e.target.closest('.tab'); if(!t) return; TAB=t.getAttribute('data-tab'); draw(); });
  $('rows').addEventListener('click',function(e){
    if(e.target.matches('input[data-ck]')){ var id=e.target.getAttribute('data-ck'); if(e.target.checked) SEL[id]=1; else delete SEL[id]; drawSel(); return; }
    var tr=e.target.closest('tr[data-id]'); if(tr) openDetail(tr.getAttribute('data-id'));
  });
  $('ckAll').addEventListener('change',function(){ SEL={}; if(this.checked) VIEW.forEach(function(n){ SEL[n.id]=1; }); draw(); });
  $('detail').addEventListener('click',function(e){ var b=e.target.closest('button[data-copy]'); if(b) copyText(b.getAttribute('data-copy')); });
  window.addEventListener('pagehide',function(){ SEL={}; });
  ['fDays','fSort'].forEach(function(id){ var v=lsGet(id); if(v) $(id).value=v; });
  if(location.protocol==='file:'){ lock('file:// 로 열면 로그인할 수 없습니다 — 주소로 여세요'); return; }
  if(typeof firebase==='undefined'){ lock('인터넷이 필요합니다'); return; }
  if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
  fbDb=firebase.database();
  try{ firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
  firebase.auth().onAuthStateChanged(async function(u){
    $('outBtn').style.display=u?'':'none';
    if(!u){ $('who').textContent=''; PuGate.show(); return; }
    PuGate.hide();
    if(!(await isAdmin(u))){ lock('접속: '+(u.email||'-')); return; }
    gate=PuOntologyWrite.createGateway({ mode:'enforce', actor:u.uid });
    $('lock').style.display='none'; $('app').style.display='';
    await reload();
  });
}
boot();
</script>
