<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>푸른노무법인 정부사업신청</title>
<!-- ══════════════════════════════════════════════════════════════
     푸른노무법인 정부사업신청 (gov.html)
     대표 지시 2026-09-05 「공모신청으로 하지말고 별도 프로그램 … 정부사업신청 으로」

     ⚠★ 경력관리(kcareer.html)와 «다른 집»이다.
        여기 담기는 것은 «아직 안 한 일»(공고·기회)이고,
        경력관리에 담기는 것은 «이미 한 일»(실적)이다.
        섞으면 지원서에 안 한 일이 실적으로 들어간다 — 그래서 앱을 갈랐다.

     ⚠ 로그인은 포털·경력관리와 «같은 계정»이다(LOCAL 지속 → 한 번 로그인하면 공유).
     ⚠ 대표 전용이다. 경력관리와 같은 잣대(uid_roles 의 isAdmin, 또는 P-001·권형하).
     ══════════════════════════════════════════════════════════════ -->
<style>
:root{
  --navy:#1e293b; --teal:#166534; --red:#dc2626;
  --border:#e2e8f0; --text:#1e293b; --text-mute:#64748b;
  --bg:#f8fafc; --amber:#d97706; --blue:#2563eb; --card:#FFFFFF;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--text);font-size:14px}
#top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);
  border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:0;z-index:20}
#top .ttl{font-size:16px;font-weight:700;color:var(--navy)}
#top .sub{font-size:11px;color:var(--text-mute)}
.sp{flex:1}
.btn{padding:6px 11px;border:1px solid var(--border);border-radius:7px;background:var(--card);
  color:var(--text);font-size:12.5px;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--navy);color:#FFFFFF;border-color:var(--navy)}
.btn.sm{padding:3px 8px;font-size:11.5px}
/* 대표 지시 2026-10-03 「좌우 넓게 한줄로 길게 최대 활용」 — 폭 제한을 풀었다 */
.wrap{max-width:none;margin:0 auto;padding:14px 18px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;white-space:nowrap}
.tag.navy{background:var(--bg);color:var(--navy);border:1px solid var(--border)}
.tag.teal{background:var(--bg);color:var(--teal);border:1px solid var(--teal)}
.tag.red{background:var(--bg);color:var(--red);border:1px solid var(--red)}
.tag.amber{background:var(--bg);color:var(--amber);border:1px solid var(--amber)}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
input,select{padding:6px 9px;border:1px solid var(--border);border-radius:7px;
  font-family:inherit;font-size:12.5px;background:var(--card);color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:8px 9px;font-weight:600;font-size:11.5px;color:var(--text-mute);
  border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--border);vertical-align:top}
.scroll{overflow-x:auto}
.kw{padding:3px 9px;border-radius:12px;border:1px solid var(--border);background:var(--card);
  color:var(--text-mute);font-size:11.5px;cursor:pointer;font-family:inherit}
.kw.on{background:var(--navy);color:#FFFFFF;border-color:var(--navy)}
.note{font-size:12.5px;line-height:1.8;color:var(--text-mute)}
.empty{padding:34px 12px;text-align:center;color:var(--text-mute);font-size:13px}
/* ── 「공고」·「신청 재료」 두 문 ──
   ⚠ 붙박이(sticky)로 두지 않는다 — 위 머리줄이 좁은 화면에서 두 줄로 접히면
     그만큼 어긋나고, 그걸 맞추려면 높이를 재는 코드가 또 필요해진다. */
#tabs{display:flex;gap:6px;padding:0 16px;background:var(--card);
  border-bottom:1px solid var(--border)}
#tabs .tb{padding:9px 14px;border:0;background:none;font-family:inherit;font-size:13px;
  cursor:pointer;color:var(--text-mute);border-bottom:2px solid transparent;margin-bottom:-1px}
#tabs .tb.on{color:var(--navy);font-weight:700;border-bottom-color:var(--navy)}
.sec{border:1px solid var(--border);border-radius:9px;margin-bottom:9px;background:var(--card)}
.sec>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:9px;
  align-items:center;font-size:13px;flex-wrap:wrap}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .nm{font-weight:700;color:var(--navy)}
.sec .body{padding:0 12px 12px}
.snt{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;
  font-size:12.5px;line-height:1.85;margin-bottom:9px;white-space:pre-wrap;word-break:break-all}
.sml{font-size:11.5px;color:var(--text-mute)}
.warn{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:9px 11px;
  font-size:12.5px;color:#991b1b;line-height:1.75;margin-bottom:9px}
/* ㅁ · № · 선택 줄 · 갈래 단추 · 쪽 넘기기 (2026-10-03) — 경력관리 목록과 같은 결 */
.chk{width:30px;text-align:center}
.rn{width:44px;text-align:right;color:var(--text-mute);font-size:11.5px;white-space:nowrap}
.row-chk{cursor:pointer}
tr.sel-on td{background:var(--bg)}
tr.sel-on td.rn{color:var(--navy);font-weight:700}
.sel-bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12.5px;
  border:1px solid var(--navy);border-radius:8px;padding:6px 10px;margin:8px 0;background:var(--card)}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mchip{padding:7px 12px;border:1px solid var(--border);border-radius:18px;background:var(--card);
  font-family:inherit;font-size:12.5px;cursor:pointer;color:var(--text)}
.mchip .n{font-size:11px;color:var(--text-mute);margin-left:2px}
.mchip.on{background:var(--navy);border-color:var(--navy);color:#FFFFFF;font-weight:700}
.mchip.on .n{color:#FFFFFF}
.mhead .bar{margin-bottom:0}
.pager{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:10px}
.pager .btn.on{background:var(--navy);border-color:var(--navy);color:#FFFFFF}
.pager .btn[disabled]{opacity:.4;cursor:default}
/* 한 줄 표 — 긴 칸은 … 으로 줄이고 title 로 전체(＋팝업). max-width:0 은 표 칸 줄임표 요령이다 */
#pgFeed table,#pgMat table{width:100%}
#pgFeed td,#pgMat td{white-space:nowrap;vertical-align:middle}
td.nm{width:42%;max-width:0;overflow:hidden;text-overflow:ellipsis}
/* 🧑‍💼 컨설턴트 모집 (2026-10-04) */
#pgRec td{vertical-align:middle}
.yr{display:inline-block;min-width:24px;text-align:center;padding:0 4px;margin:1px 2px 1px 0;border-radius:4px;
  font-size:11px;background:var(--bg);color:var(--text-mute);border:1px solid var(--border)}
.yr.cur{background:var(--navy);color:#FFFFFF;border-color:var(--navy)}
.recban{border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.75;margin-bottom:10px;
  background:#fffbeb;border:1px solid #fde68a;color:#854d0e}
.recban.calm{background:var(--bg);border-color:var(--border);color:var(--text-mute)}
tr.rec-now td{background:#fffbeb}
td.og{width:15%;max-width:0;overflow:hidden;text-overflow:ellipsis}
td.dt{font-size:12px;color:var(--text-mute)}
td.act{white-space:nowrap}
.kwt{font-size:11px;color:var(--text-mute);margin-left:5px;font-weight:400}
tr.fr,tr.mr{cursor:pointer}
tr.fr:hover td,tr.mr:hover td{background:var(--bg)}
tr.gone td{opacity:.62}
/* 팝업 */
.pop{position:fixed;inset:0;z-index:9000;display:none;align-items:flex-start;justify-content:center;
  padding:40px 16px;overflow:auto;background:rgba(15,23,42,.45)}
.pop.on{display:flex}
.pop-box{background:var(--card);border-radius:12px;width:100%;max-width:1000px;padding:14px 18px 18px;
  box-shadow:0 12px 40px rgba(15,23,42,.25)}
.pop-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:15px;color:var(--navy)}
table.kv th{width:120px;background:none;white-space:nowrap;vertical-align:top}
table.kv td{white-space:normal;word-break:break-all}
.pop-sub{font-weight:700;color:var(--navy);margin:12px 0 6px}
table.cmp td{white-space:nowrap}
#lock{position:fixed;inset:0;z-index:9999;background:var(--bg);display:none;
  align-items:center;justify-content:center;padding:20px}
#lock .box{max-width:420px;text-align:center}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(18px);
  background:var(--navy);color:#FFFFFF;padding:9px 16px;border-radius:8px;font-size:13px;
  opacity:0;pointer-events:none;transition:.2s;z-index:9998}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="top">
  <div>
    <div class="ttl">정부사업신청</div>
    <div class="sub">푸른노무법인 · 공고 모아보기</div>
  </div>
  <div class="sp"></div>
  <span id="who" class="sub"></span>
  <button class="btn" onclick="openKeys()">🔑 인증키</button>
  <button class="btn" id="outBtn" onclick="doLogout()" style="display:none">로그아웃</button>
</div>

<!-- ⚠ 두 문의 «성격이 다르다» — 공고는 «아직 안 한 일», 신청 재료는 «이미 한 일»이다.
     재료는 경력관리에서 읽어만 온다(원본은 언제나 저쪽이다). -->
<div id="tabs">
  <button class="tb on" id="tbFeed" onclick="setTab('feed')">📋 공고 모아보기</button>
  <button class="tb" id="tbRec" onclick="setTab('rec')">🧑‍💼 컨설턴트 모집</button>
  <button class="tb" id="tbMat" onclick="setTab('mat')">👤 신청 재료</button>
</div>

<div class="wrap" id="pgFeed">
  <div class="card">
    <div class="bar">
      <input id="q" placeholder="공고명·기관 검색" style="min-width:190px" oninput="draw()">
      <select id="fSrc" onchange="draw()"><option value="">전체 출처</option>
        <option>나라장터</option><option>알리오</option><option>기업마당</option></select>
      <select id="fSt" onchange="draw()"><option value="">전체 상태</option>
        <option>새 공고</option><option>관심</option><option>지원함</option><option>지나감</option>
        <option value="__hidden">🙈 숨긴 것</option><option value="__all">모두 (숨긴 것 포함)</option></select>
      <div class="sp"></div>
      <span id="cnt" class="sub"></span>
      <span id="perBox"></span>
      <button class="btn" onclick="fetchAll()">🔄 새로 받기</button>
      <button class="btn" onclick="expCsv()">📤 CSV</button>
    </div>
    <div class="bar" id="kwBox"></div>
    <div id="note" style="font-size:12.5px;margin-bottom:9px"></div>
    <div id="feedSel"></div>
    <div class="scroll"><table>
      <thead><tr><th class="chk"><input type="checkbox" id="fSelAll" title="보이는 것 모두" onchange="feedSelAll(this.checked)"></th><th class="rn">№</th><th>출처</th><th>상태</th><th>공고명</th><th>기관</th><th>받은 날</th><th>마감</th>
        <th style="text-align:right">남음</th><th style="text-align:right">추정가격</th><th>관리</th></tr></thead>
      <tbody id="tb"></tbody>
    </table></div>
    <div id="feedPager"></div>
  </div>
</div>

<!-- 🧑‍💼 컨설턴트 모집 (대표 지시 2026-10-04) — 해마다 지원하던 기관을 «모집 달» 순으로.
     ⚠ 지원 이력은 대표님 브라우저가 서류 폴더 7번에서 «읽기만» 한다(원본은 안 건드린다). -->
<div class="wrap" id="pgRec" style="display:none">
  <div class="card">
    <div class="bar">
      <b style="color:var(--navy)">해마다 지원하던 곳</b>
      <span class="sml" id="recAt"></span>
      <div class="sp"></div>
      <button class="btn primary" onclick="recScan()">📂 서류 폴더에서 읽기</button>
      <button class="btn" onclick="recAddOrg()">＋ 기관 더하기</button>
    </div>
    <div id="recBan"></div>
    <div class="scroll"><table>
      <thead><tr><th class="rn">№</th><th>기관 · 하는 일</th><th>보통</th><th>지원한 해</th><th>올해</th><th>할 일</th></tr></thead>
      <tbody id="recTb"></tbody>
    </table></div>
    <div id="recRest" style="margin-top:10px"></div>
  </div>
</div>

<div class="wrap" id="pgMat" style="display:none">
  <div class="card" style="margin-bottom:12px">
    <div class="bar" style="margin-bottom:0">
      <b style="color:var(--navy)">경력관리에서 당겨온 재료</b>
      <span class="sml" id="matAt"></span>
      <div class="sp"></div>
      <button class="btn primary" onclick="matPull()">🔄 경력관리에서 받아오기</button>
    </div>
    <div id="matNote" class="note" style="margin-top:8px"></div>
  </div>
  <div id="matBox"></div>
</div>

<div id="pop" class="pop" onclick="if(event.target===this)popClose()"><div class="pop-box">
  <div class="pop-head"><b id="popTtl"></b><div class="sp"></div><button class="btn sm" onclick="popClose()">✕ 닫기</button></div>
  <div id="popBody"></div>
</div></div>

<div id="lock"><div class="box">
  <div style="font-size:17px;font-weight:700;margin-bottom:10px">대표 전용 화면입니다</div>
  <div class="note" id="lockWho"></div>
</div></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

     ⚠ pu-appbar 를 빼면 오른쪽 「즐겨찾기」 손잡이가 아예 안 뜬다.
     ⚠ pu-back 은 «싣기만» 하면 없는 것과 같다 — 아래에서 guard 로 «등록»해야 한다. -->
<!-- 로그아웃 화면은 푸른 통합이 «모두 같은 것»을 쓴다 (대표 지시 2026-09-14) -->

<script src="js/pu-appbar.js?v=16"></script>
<!-- «지금 쓰고 있다»를 모든 앱이 함께 적는다 — 없으면 이 앱에서 일해도 60분 뒤 뒤에 있던 창이 전체 로그아웃을 건다 (2026-09-30) -->
<script src="js/pu-active.js?v=1"></script>
<!-- 상단에 «로그인한 사람 이름» — 머리줄 #who 자리에 그린다 (대표 지시 2026-09-29 「로그인시 모든 앱 상단에 본인의 이름이 나와야 된다」) -->

     두 벌이 되면 한쪽만 고쳐져 고객사 이름이 새는 날이 온다. -->
<script src="js/kcareer-adv-summary.js?v=1"></script>

<script>

var FB_CONFIG={apiKey:'AIzaSyDkZz5QlKSoqMOYByp5YGeMNLNDrIghliA',authDomain:'pureun-erp.firebaseapp.com',databaseURL:'https://pureun-erp-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'pureun-erp',appId:'1:936817166182:web:9bd31f70d0afdf5fca2aa7',messagingSenderId:'936817166182'};
var NS='gov3_', fbDb=null, fbUid=null;

function $(id){ return document.getElementById(id); }
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('on'); },2600); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){

/* ═══ 인증키 ═══
   ⚠ 열쇠가 둘이다 — 공공데이터포털(나라장터+알리오 겸용)과 기업마당(따로, crtfcKey).

function keyBiz(){ return lsGet('key_biz'); }
function openKeys(){
  var a=prompt('공공데이터포털 인증키 (나라장터·알리오가 «같은 열쇠»를 씁니다)\n\n⚠ 「일반 인증키(Decoding)」를 넣으세요.\n⚠ 열쇠는 하나지만 «활용신청은 둘 다» 따로 해야 합니다 —\n   나라장터(15129394) · 공공기관 채용정보(15125273, 알리오)\n\n발급: data.go.kr → 로그인 → 활용신청', keyData());
  if(a!==null) lsSet('key_data', a.trim());
  var b=prompt('기업마당 인증키 (crtfcKey — 따로 발급)\n\n발급: bizinfo.go.kr → 정책정보 개방', keyBiz());
  if(b!==null) lsSet('key_biz', b.trim());
  if(a!==null||b!==null){ lsSet('last',''); cloudPush(); readyNote(); toast('인증키를 저장했습니다 — 🔄 새로 받기를 눌러 보세요'); }
}

/* ═══ 찾는 말 ═══
   ⚠ 「교육」은 뺐다(대표 지시 2026-09-06). 되살리지 말 것 —
     클린아이 410건 실측에서 걸린 9건이 전부 「평생교육진흥원 직원 채용」 오탐이었다. */
function kws(){
  try{ var a=JSON.parse(lsGet('kw')||'null'); if(Array.isArray(a)&&a.length) return a; }catch(e){}
  return GovG2b.KEYWORDS_DEFAULT;
}
function drawKw(){
  var cur=kws(), all=GovG2b.KEYWORDS_DEFAULT.slice();
  cur.forEach(function(k){ if(all.indexOf(k)<0) all.push(k); });
  $('kwBox').innerHTML='<span class="sub" style="margin-right:2px">찾는 말</span>'
    + all.map(function(k){ return '<button class="kw'+(cur.indexOf(k)>=0?' on':'')+
        '" onclick="kwTog(\''+esc(k)+'\')">'+(cur.indexOf(k)>=0?'':'+ ')+esc(k)+'</button>'; }).join('')
    + '<button class="kw" onclick="kwAdd()">＋ 낱말</button>'
    + (kwIsDefault(cur) ? '' : '<button class="kw" onclick="kwReset()" title="처음 찾는 말로 되돌립니다">↺ 기본값으로</button>');
}
function kwIsDefault(cur){ var d=GovG2b.KEYWORDS_DEFAULT;
  return cur.length===d.length && d.every(function(k){ return cur.indexOf(k)>=0; }); }
/* ⚠ 찾는 말을 줄이면 rejudge 가 줄을 «기계 판단»으로 숨긴다(ruleOut). 되돌릴 때 그 줄도 되살아나야
     한다 — 안 그러면 「숨김 31건」이 영영 남는다(2026-10-04 대표 화면 실측). rejudge 가 양쪽을 다 본다. */
function kwReset(){
  if(!confirm('찾는 말을 처음 것('+GovG2b.KEYWORDS_DEFAULT.length+'개)으로 되돌릴까요?\n\n찾는 말 때문에 숨겨졌던 공고 가운데 다시 맞는 것은 되살아납니다.\n(손으로 숨긴 것은 그대로 둡니다)')) return;
  lsSet('kw',''); cloudPush(); drawKw(); rejudge(); draw();
  toast('찾는 말을 기본값으로 되돌렸습니다 — 🔄 새로 받기를 누르면 새로 걸립니다');
}
function kwTog(k){ var r=GovG2b.toggleKw(kws(),k);
  if(!r.ok){ toast(r.err); return; }
  lsSet('kw',JSON.stringify(r.list)); drawKw();
  toast('찾는 말이 바뀌었습니다 — 🔄 새로 받기를 누르면 새 기준으로 걸립니다'); }
function kwAdd(){ var k=prompt('더할 낱말 (예: 조직진단)'); if(!k) return;
  var r=GovG2b.toggleKw(kws(),k.trim()); if(!r.ok){ toast(r.err); return; }
  lsSet('kw',JSON.stringify(r.list)); drawKw(); }

/* ═══ 받아오기 ═══
   ⚠ 하루 1,000회 제한이 있다(공공데이터포털). 화면 열 때마다 부르지 않는다 —
     하루 한 번 저절로, 나머지는 손으로 「새로 받기」. */
function note(h,c){ $('note').innerHTML='<span style="color:'+(c||'var(--text-mute)')+'">'+h+'</span>'; }
function readyNote(){
  var a=keyData(), b=keyBiz();
  if(a||b){ if(!get('feed').length) note('아직 받은 공고가 없습니다 — <b>🔄 새로 받기</b>를 눌러 주세요'); else note(''); return; }
  note('🔑 <b>인증키가 아직 없습니다.</b> 준비는 다 돼 있고 열쇠만 꽂으면 됩니다.<br>'
    +'<b>열쇠는 두 개, 신청은 세 번</b>입니다.<br>'
    +'① 공공데이터포털에 로그인해 <b>둘 다</b> 활용신청 — 열쇠는 하나지만 <b>신청은 따로</b>입니다<br>'
    +'&nbsp;&nbsp;&nbsp;· <a href="https://www.data.go.kr/data/15129394/openapi.do" target="_blank" rel="noopener">조달청_나라장터 입찰공고정보서비스</a><br>'
    +'&nbsp;&nbsp;&nbsp;· <a href="https://www.data.go.kr/data/15125273/openapi.do" target="_blank" rel="noopener">재정경제부_공공기관 채용정보 조회서비스</a> (알리오)<br>'
    +'&nbsp;&nbsp;&nbsp;⚠ 열쇠를 두 벌 줍니다 — <b>일반 인증키(Decoding)</b> 쪽을 넣으세요<br>'
    +'② <a href="https://www.bizinfo.go.kr/apiDetail.do?id=bizinfoApi" target="_blank" rel="noopener">기업마당</a> 에서 따로 하나 더<br>'
    +'&nbsp;&nbsp;&nbsp;<b>시스템 URL</b> 칸에는 <code>https://nabaho.github.io/pureunall/gov.html</code><br>'
    +'③ 위 <b>🔑 인증키</b>를 눌러 넣고 → <b>🔄 새로 받기</b>');
}
function nextId(buf){ var n=1, mk=function(){ return 'G'+String(n).padStart(4,'0'); };
  while(buf.some(function(x){ return x.id===mk(); })) n++; return mk(); }

async function pull(url){
  var c=new AbortController(), t=setTimeout(function(){ c.abort(); },20000);
  try{ var r=await fetch(url,{signal:c.signal}); return await r.json(); }
  finally{ clearTimeout(t); }
}
/* ═══ 쪽을 «끝까지» 넘겨 받는다 (2026-10-03) ═══
   ⚠★ 첫 쪽만 받고 있었다 — 실측 7일치 나라장터 3,077건 중 999건, 알리오 525건 중 100건만 봤다.
      나라장터 3분의 2·알리오 5분의 4는 «낱말에 걸리는지 보지도 못하고» 버려졌다.
   ⚠ 뚜껑(PAGE_MAX)을 둔다 — 하루 1,000회 제한이 있다. 실측 하루 10회 안팎이라 넉넉하다.
   ⚠ 뚜껑에 걸려 다 못 받으면 «그렇다고 말한다» — 조용히 자르면 또 같은 일이 된다. */
var PAGE_MAX={g2b:8, alio:10};
async function pullAll(name, urlOf, parse, max){
  var rows=[], errs=[], total=0;
  for(var p=1;p<=max;p++){
    var o;
    try{ o=parse(await pull(urlOf(p))); }
    catch(e){ errs.push(name+': 받지 못했습니다'+(p>1?' ('+p+'쪽)':'')); break; }
    if(!o.ok){ errs.push(name+': '+o.err); break; }
    rows=rows.concat(o.rows); total=o.total||rows.length;
    if(!o.rows.length || rows.length>=total) break;
    if(p===max) errs.push(name+': '+total+'건 중 '+rows.length+'건만 받았습니다(쪽 뚜껑)');
  }
  return {rows:rows, errs:errs, total:total};
}
async function fetchAll(){
  var kd=keyData(), kb=keyBiz();
  if(!kd && !kb){ readyNote(); toast('인증키를 먼저 넣어 주세요'); return; }
  note('⏳ 받는 중…');
  var today=new Date().toISOString().slice(0,10);
  var buf=get('feed'), got=[], errs=[];
  var to=new Date(), from=new Date(Date.now()-7*86400000);
  if(kd){
    var g=await pullAll('나라장터', function(p){ return GovG2b.buildUrl({key:kd,from:from,to:to,page:p,rows:999}); },
                        GovG2b.parse, PAGE_MAX.g2b);
    got=got.concat(g.rows); errs=errs.concat(g.errs);
    var a=await pullAll('알리오', function(p){ return GovAlio.buildUrl({key:kd,page:p,rows:100,ongoingOnly:true}); },
                        GovAlio.parse, PAGE_MAX.alio);
    got=got.concat(a.rows); errs=errs.concat(a.errs);
  }
  if(kb){
    for(var i=0;i<GovBizinfo.FIELDS_DEFAULT.length;i++){
      try{ var b=GovBizinfo.parse(await pull(GovBizinfo.buildUrl({key:kb,
             field:GovBizinfo.FIELDS_DEFAULT[i], regions:GovBizinfo.REGIONS_DEFAULT, count:200})));
        if(b.ok) got=got.concat(b.rows); else { errs.push('기업마당: '+b.err); break; } }
      catch(e){ errs.push('기업마당: 받지 못했습니다'); break; }
    }
  }
  var m=GovG2b.merge(buf, got, kws(), today);
  m.adds.forEach(function(r){ r.id=nextId(buf); r.savedAt=new Date().toISOString(); buf.unshift(r); });
  if(m.adds.length) set('feed',buf);
  ageOut(); lsSet('last',today); draw();
  note('받은 공고 '+got.length+'건 중 <b>'+m.adds.length+'건</b>이 새로 걸렸습니다 '
    +'<span class="sub">(이미 있어 건너뜀 '+m.skipped+' · 낱말에 안 걸림 '+m.unmatched+')</span>'
    +(errs.length?'<br><span style="color:var(--red)">'+esc(errs.join(' · '))+'</span>':''),
    errs.length?'var(--text-mute)':'');
}
/* 마감이 지난 것은 「지나감」으로 — ⚠ 손으로 관심을 켠 것은 건드리지 않는다 */
function ageOut(){
  var a=get('feed'), n=0, today=new Date().toISOString().slice(0,10);
  a.forEach(function(r){ if(!r||r.type==='관심'||r.type==='지원함'||r.type==='지나감') return;
    var d=GovG2b.dday(r.closeDt,today); if(d!=null&&d<0){ r.type='지나감'; n++; } });
  if(n) set('feed',a); return n;
}
function auto(){ if(!keyData()&&!keyBiz()) return;
  if(lsGet('last')===new Date().toISOString().slice(0,10)){ ageOut(); return; }
  fetchAll(); }

/* ═══ 목록 ═══ */
function dchip(r){ var d=(typeof r.dday==='number')?r.dday:GovG2b.dday(r.closeDt);
  if(d==null) return '<span class="sub">-</span>';
  if(d<0) return '<span class="tag">지남</span>';
  return '<span class="tag '+(d<=7?'red':'teal')+'">D-'+Math.round(d)+'</span>'; }
/* 공고 목록 — 대표 지시 2026-10-03
   ① 「ㅁ와 넘버링」 ② 「몇건씩 볼수 있게」(20·50·100·전체, 기본 50)
   ③ 「과거 데이터도 삭제 하지 말고 남기고 비교할 수 있게」 — 아무것도 지우지 않는다(숨김뿐).
      상태 거르개에 「숨긴 것」·「모두(숨긴 것 포함)」 + 「받은 날」 칸 + 팝업의 «비교» 표.
   ④ 「좌우 넓게 한줄로 길게」 — 줄마다 한 줄, 긴 이름은 … 으로 줄이고 title 로 전체를 본다.
   ⑤ 「클릭하면 팝업」 — 줄을 누르면 상세 창(ㅁ·단추를 누른 것은 빼고).
   ⚠ 고른 것은 «id»로 기억한다(줄 순서는 거르개·새로 받기로 바뀐다).
   ⚠ 거르개로 안 보이게 된 줄은 고른 것에서 뺀다 — 보이지도 않는 것이 함께 숨겨지면 안 된다. */
var _feedSel={}, _feedPage=0;
var PER_OPTS=[20,50,100,0];                     /* 0 = 전체 */
function perOf(key){ var v=parseInt(lsGet(key),10); return PER_OPTS.indexOf(v)>=0 ? v : 50; }
function perSel(key, onch){
  var cur=perOf(key);
  return '<label class="sml">표시 <select onchange="'+onch+'(this.value)">'
    + PER_OPTS.map(function(n){ return '<option value="'+n+'"'+(n===cur?' selected':'')+'>'+(n?n+'건':'전체')+'</option>'; }).join('')
    + '</select></label>';
}
function feedPer(v){ lsSet('per', String(v)); _feedPage=0; draw(); }
function feedPageTo(p){ _feedPage=p; draw(); }

function feedVisible(){
  var q=($('q').value||'').toLowerCase(), fs=$('fSrc').value, ft=$('fSt').value;
  var every=get('feed').filter(function(r){ return !!r; });
  var base=every.filter(function(r){
    if(ft==='__hidden') return !!r.hidden;
    if(ft==='__all') return true;
    return !r.hidden; });
  var rows=base.filter(function(r){
    if(fs && r.src!==fs) return false;
    if(ft && ft.charAt(0)!=='_' && r.type!==ft) return false;
    if(q && [r.nm,r.org,r.ntce,r.kw].join(' ').toLowerCase().indexOf(q)<0) return false;
    return true; });
  return {every:every, all:every.filter(function(r){ return !r.hidden; }), rows:rows};
}
function _pager(p, pages, from, shown, n, fn){
  if(pages<=1) return '';
  var h='<div class="pager"><button class="btn sm" '+(p<=0?'disabled':'')+' onclick="'+fn+'('+(p-1)+')">◀</button>';
  for(var i=0;i<pages;i++) h+='<button class="btn sm'+(i===p?' on':'')+'" onclick="'+fn+'('+i+')">'+(i+1)+'</button>';
  return h+'<button class="btn sm" '+(p>=pages-1?'disabled':'')+' onclick="'+fn+'('+(p+1)+')">▶</button>'
    +'<span class="sml">'+(from+1)+'–'+(from+shown)+' / '+n+'건</span></div>';
}
function draw(){
  var v=feedVisible(), all=v.all, rows=v.rows;
  var vis={}; rows.forEach(function(r){ vis[r.id]=1; });
  Object.keys(_feedSel).forEach(function(id){ if(!vis[id]) delete _feedSel[id]; });
  var sn=Object.keys(_feedSel).length, hiddenN=v.every.length-all.length;
  $('cnt').textContent='전체 '+all.length+'건'+(rows.length!==all.length?' · 지금 '+rows.length+'건':'')
    +(hiddenN?' · 숨김 '+hiddenN+'건':'');
  var pb=$('perBox'); if(pb) pb.innerHTML=perSel('per','feedPer');
  var per=perOf('per'), n=rows.length;
  var pages=per?Math.max(1,Math.ceil(n/per)):1, p=Math.min(_feedPage,pages-1); _feedPage=p;
  var from=per?p*per:0, page=per?rows.slice(from,from+per):rows;
  var bar=$('feedSel');
  if(bar) bar.innerHTML = sn ? ('<div class="sel-bar">✔ <b>'+sn+'건</b> 선택'
      +' <button class="btn sm" onclick="feedBulk(\'star\')">★ 관심</button>'
      +' <button class="btn sm" onclick="feedBulk(\'hide\')">🚫 숨기기</button>'
      +' <button class="btn sm" onclick="feedBulk(\'unhide\')">↩ 되살리기</button>'
      +' <button class="btn sm" onclick="expCsv(true)">📤 고른 것 CSV</button>'
      +' <button class="btn sm" onclick="feedSelAll(false)">선택 해제</button></div>') : '';
  var sa=$('fSelAll'); if(sa) sa.checked = page.length>0 && page.every(function(r){ return _feedSel[r.id]; });
  $('tb').innerHTML = page.length ? page.map(function(r,i){ var on=!!_feedSel[r.id], id=esc(r.id);
    var st=r.hidden ? '<span class="tag red">'+(r.ruleOut?'숨김·규칙':'숨김')+'</span>'
      : '<span class="tag '+(r.type==='관심'?'teal':(r.type==='지나감'?'':'navy'))+'">'+esc(r.type||'-')+'</span>';
    return '<tr class="fr'+(on?' sel-on':'')+(r.hidden?' gone':'')+'" onclick="feedRowClick(event,\''+id+'\')">'
      +'<td class="chk"><input type="checkbox" class="row-chk" '+(on?'checked':'')+' onchange="feedTog(\''+id+'\',this.checked)"></td>'
      +'<td class="rn">'+(from+i+1)+'</td>'
      +'<td><span class="tag navy">'+esc(r.src||'-')+'</span></td>'
      +'<td>'+st+'</td>'
      +'<td class="nm" title="'+esc(r.nm||'')+'"><b>'+esc(r.nm||'-')+'</b>'+(r.kw?' <span class="kwt">'+esc(r.kw)+'</span>':'')+'</td>'
      +'<td class="og" title="'+esc(r.org||'')+'">'+esc(r.org||'-')+'</td>'
      +'<td class="dt">'+esc((r.savedAt||'').slice(0,10)||'-')+'</td>'
      +'<td class="dt">'+esc((r.closeDt||'-').slice(0,16))+'</td>'
      +'<td style="text-align:right">'+dchip(r)+'</td>'
      +'<td style="text-align:right">'+(r.prc?Math.round(r.prc/10000).toLocaleString()+'만원':'-')+'</td>'
      +'<td class="act">'
        +'<button class="btn sm" onclick="star(\''+id+'\')">'+(r.type==='관심'?'★':'☆')+'</button> '
        +(r.url?'<button class="btn sm" onclick="open2(\''+id+'\')">🔗</button> ':'')
        +'<button class="btn sm" title="서식 채우기 — 경력관리에서 열립니다" onclick="toForm(\''+id+'\')">📝</button> '
        +(r.hidden ? '<button class="btn sm" title="되살리기" onclick="unhide(\''+id+'\')">↩</button>'
                   : '<button class="btn sm" onclick="hide(\''+id+'\')">🚫</button>')+'</td></tr>';
  }).join('') : '<tr><td colspan="11" class="empty">'+(!v.every.length?'아직 받은 공고가 없습니다':(!all.length&&$('fSt').value.charAt(0)!=='_'?'보이는 공고가 없습니다 — 숨긴 '+hiddenN+'건은 상태 「🙈 숨긴 것」에서 봅니다':'걸리는 공고가 없습니다 — 조건을 넓혀 보세요'))+'</td></tr>';
  var pg=$('feedPager'); if(pg) pg.innerHTML=_pager(p, pages, from, page.length, n, 'feedPageTo');
}
function feedTog(id,on){ if(on) _feedSel[id]=1; else delete _feedSel[id]; draw(); }
/* 머리 ㅁ — «이 쪽에 보이는 것»만 고른다(다른 쪽은 그대로) */
function feedSelAll(on){
  if(!on){ _feedSel={}; draw(); return; }
  var v=feedVisible().rows, per=perOf('per'), from=per?_feedPage*per:0;
  (per?v.slice(from,from+per):v).forEach(function(r){ _feedSel[r.id]=1; });
  draw();
}
/* 고른 것을 한꺼번에 — 관심은 «켜기»만(섞여 있어도 끄지 않는다), 숨기기는 세고 묻는다 */
function feedBulk(what){
  var ids=Object.keys(_feedSel); if(!ids.length) return;
  var a=get('feed'), n=0;
  if(what==='hide' && !confirm('고른 '+ids.length+'건을 숨길까요?\n지우지 않습니다 — 상태 「숨긴 것」에서 언제든 되살립니다.')) return;
  a.forEach(function(r){ if(!r||!_feedSel[r.id]) return;
    if(what==='star' && r.type!=='관심'){ r.type='관심'; n++; }
    if(what==='hide' && !r.hidden){ r.hidden=true; n++; }
    if(what==='unhide' && r.hidden){ r.hidden=false; r.ruleOut=false; r.keep=true; n++; } });
  _feedSel={};
  set('feed',a); draw();
  toast(what==='star' ? n+'건을 관심으로 표시했습니다'
      : what==='unhide' ? n+'건을 되살렸습니다 — 규칙이 다시 숨기지 않습니다'
      : n+'건을 숨겼습니다 — 「숨긴 것」에서 되살립니다');
}
/* ⚠ 되살린 줄은 keep — 다음에 rejudge 가 다시 숨기면 «되살렸는데 또 사라졌다»가 된다 */
function unhide(id){ var h=find(id); if(!h) return;
  var r=h.a[h.i]; r.hidden=false; r.ruleOut=false; r.keep=true; set('feed',h.a); draw(); popClose();
  toast('되살렸습니다'); }

/* ═══ 팝업 — 줄을 누르면 상세 + «비교» ═══
   비교 둘: ⑴ 같은 공고의 다른 차수(번호 앞부분이 같다 — 재공고·정정)
            ⑵ 같은 기관의 다른 공고(숨긴 것·지난 것까지 «모두» — 과거와 견주라고 남겨 둔 것이다) */
function feedRowClick(e,id){
  var t=e&&e.target; if(t && t.closest && t.closest('input,button,a,select,label')) return;
  feedPop(id);

  var body='<table class="kv">'

    +_kv('출처',esc(r.src||'-'))+_kv('공고번호',esc(r.no||''))
    +_kv('기관',esc(r.org||''))+(r.ntce&&r.ntce!==r.org?_kv('공고기관',esc(r.ntce)):'')
    +_kv('상태',(r.hidden?'<span class="tag red">'+(r.ruleOut?'숨김 · 걸러내기 규칙':'숨김')+'</span> ':'')+esc(r.type||''))

    +_kv('계약방법',esc(r.mthd||''))+_kv('받은 날',esc((r.savedAt||'').slice(0,16).replace('T',' ')))
    +'</table>'
    +'<div class="bar" style="margin:12px 0">'

    +(r.url?'<button class="btn sm" onclick="open2(\''+esc(r.id)+'\')">🔗 원문 공고</button>':'')

function srcBackfill(){

/* 새 걸러내기 규칙(2026-10-03 대표 결정)을 «이미 받은» 줄에도 댄다.
   ⚠ 사람이 손댄 줄(관심·지원함)과 이미 숨긴 줄은 건드리지 않는다 — 기계가 정한 「새 공고」·「지나감」만.
   ⚠ 지우지 않고 숨긴다(🚫 와 같은 표시 + ruleOut). 멱등. */
function rejudge(){
  var a=get('feed'), n=0, back=0, kw=kws();
  a.forEach(function(r){
    if(!r) return;
    /* ⚠ 기계가 숨긴 것(ruleOut)만 되살린다 — 사람이 숨긴 것은 건드리지 않는다 */
    if(r.hidden && r.ruleOut){ if(GovG2b.judge(r,kw).length){ r.hidden=false; r.ruleOut=false; back++; } return; }
    if(r.hidden||r.keep||r.type==='관심'||r.type==='지원함') return;   /* 「지나감」도 기계가 정한 것이다 */
    if(!GovG2b.judge(r,kw).length){ r.hidden=true; r.ruleOut=true; n++; } });
  if(n||back){ set('feed',a); toast((n?'새 걸러내기 규칙에 맞지 않는 '+n+'건을 숨겼습니다':'')+(n&&back?' · ':'')+(back?'다시 맞는 '+back+'건을 되살렸습니다':'')); }
  return n;
}

async function whoAmI(u){

/* ═══ 개인 클라우드 보관 ═══
   ⚠ kcareer 자리를 건드리지 않는다. gov/{uid} 는 이 앱 것이다. */
var _pushT=null;
function cloudPush(){
  if(!fbDb||!fbUid) return;
  clearTimeout(_pushT);
  _pushT=setTimeout(function(){
    try{ fbDb.ref('gov/'+fbUid).set({ feed:get('feed'), kw:lsGet('kw'),
      key_data:keyData(), key_biz:keyBiz(), last:lsGet('last'),
      recruit:{ scan:get('recruit_scan'), at:lsGet('recruit_at'), log:recObj('recruit_log'),
        url:recObj('recruit_url'), custom:get('recruit_custom') }, at:Date.now() })
      .then(function(){ _cloudFail=0; })
      .catch(function(e){ cloudFailSay('저장', e); }); }catch(e){ cloudFailSay('저장', e); }
  },1200);
}
/* ⚠★ 클라우드가 막히면 «조용히» 넘기지 않는다 (2026-10-03).
   앱이 생긴 날부터 gov/ 에 보안규칙이 없어 저장·불러오기가 통째로 막혀 있었는데
   .catch(function(){}) 가 삼켜 아무도 몰랐다 — 다른 브라우저에서 넣은 인증키가 안 넘어왔다.
   알림은 «처음 한 번»만(1.2초마다 뜨면 일을 못 한다). 다시 되면 표시를 놓는다. */
var _cloudFail=0;
function cloudFailSay(what, e){
  _cloudFail++;
  if(_cloudFail>1) return;
  var why=(e && /permission/i.test(String(e.code||e.message||e))) ? '권한이 막혀 있습니다' : '인터넷을 확인해 주세요';
  toast('⚠ 클라우드 '+what+' 실패 — '+why+'. 이 기기에만 담겼습니다');
}
async function cloudPull(){
  if(!fbDb||!fbUid) return;
  try{
    var s=await fbDb.ref('gov/'+fbUid).once('value'); var v=s.val(); if(!v) return;
    if(Array.isArray(v.feed) && !get('feed').length) set('feed', v.feed);
    if(v.kw && !lsGet('kw')) lsSet('kw', v.kw);
    if(v.key_data && !keyData()) lsSet('key_data', v.key_data);
    if(v.key_biz && !keyBiz()) lsSet('key_biz', v.key_biz);
    if(v.last && !lsGet('last')) lsSet('last', v.last);
    var rc=v.recruit||{};
    if(Array.isArray(rc.scan) && !get('recruit_scan').length) lsSet('recruit_scan', JSON.stringify(rc.scan));
    if(rc.at && !lsGet('recruit_at')) lsSet('recruit_at', rc.at);
    if(rc.log && !Object.keys(recObj('recruit_log')).length) lsSet('recruit_log', JSON.stringify(rc.log));
    if(rc.url && !Object.keys(recObj('recruit_url')).length) lsSet('recruit_url', JSON.stringify(rc.url));
    if(Array.isArray(rc.custom) && !get('recruit_custom').length) lsSet('recruit_custom', JSON.stringify(rc.custom));
  }catch(e){ cloudFailSay('불러오기', e); }
}

/* ═══ 신청 재료 — 경력관리에서 «읽기만» 한다 ═══
   대표 승인 2026-09-10: 화면은 「안 A · 접이식」, 갈래에 「수행 실적」 포함.
   범위는 대표 선택 「나」 = 자문·고문 + 경력·자격증·표창·학력 (+ 수행 실적).

   ⚠★ 받아온 재료를 «어디에도 담지 않는다» — 화면이 열려 있는 동안만 머리에 둔다.
      담으면 ⑴대표님 이력이 두 자리에 있게 되고 ⑵한쪽이 낡아 «두 앱이 다른 건수»를
      보여 준다. 원본은 언제나 경력관리 하나다. (cloudPush 도 건드리지 않는다.)
   ⚠★ 경력관리에 한 글자도 쓰지 않는다 — 읽기 전용이다.
   ⚠★ 자문·고문 이름은 «내보낼 때» 가려 나간다(대표 지시 「목록보이고 내보낼떄 가림」).
      가리기는 GovCareer 가 KcareerAdvSummary 를 거쳐서만 한다 — 여기서 짓지 않는다. */
var _mat=null, _matLive=true;

function setTab(t){
  if(t!=='mat' && t!=='rec') t='feed';
  $('pgFeed').style.display = (t==='feed'?'':'none');

function matNote(h){ $('matNote').innerHTML=h||''; }

/* ═══ 🧑‍💼 컨설턴트 모집 (대표 지시 2026-10-04) ═══
   「매년 공인노무사 컨설턴트 모집이 있어서 지원해야 되는데 … 거기 기관들 모두 찾아서 별도로 창」
   ⚠★ 지원 «이력»은 서류 폴더 「7. 컨설턴트,위원신청등」에서 «이름만» 읽는다 — 원본은 읽기 전용이다.
      읽은 이름은 이 기기와 대표 전용 클라우드(gov/{uid})에만 둔다. 공개 파일(js/gov-recruit.js)에는
      기관 «사전»만 있다.
   ⚠ 폴더 열쇠는 경력관리의 것(IndexedDB kcareer_fs › rootDir)을 «빌려» 쓴다(같은 주소라 보인다).
      거기 없으면 직접 고르게 하고 이 앱 자리(gov_fs)에 둔다. 경력관리 자리에는 «쓰지 않는다».
   ⚠ 제출은 대표님이 한다 — 기관마다 접수 방법이 다르고 비밀번호를 대신 넣을 수 없다.
      여기서는 «언제»(모집 달)·«어디로»(공지 링크)·«무엇을»(작년 서류)·«채우기»(경력관리)까지. */
var REC_DIR='7. 컨설턴트,위원신청등', _recDir=null;
function recObj(k){ try{ var v=JSON.parse(lsGet(k)||'{}'); return (v&&typeof v==='object'&&!Array.isArray(v))?v:{}; }catch(e){ return {}; } }
function recObjSet(k,v){ lsSet(k, JSON.stringify(v)); cloudPush(); }
function recToday(){ return new Date(); }

function _recIdb(name){ return new Promise(function(res,rej){
  var q=indexedDB.open(name,1);
  q.onupgradeneeded=function(e){ e.target.result.createObjectStore('handles',{keyPath:'key'}); };
  q.onsuccess=function(e){ res(e.target.result); }; q.onerror=function(){ rej(q.error); }; }); }
async function _recHandle(name, key){
  try{ var db=await _recIdb(name); return await new Promise(function(res){
    var q=db.transaction('handles','readonly').objectStore('handles').get(key);
    q.onsuccess=function(){ res(q.result?q.result.handle:null); }; q.onerror=function(){ res(null); }; });
  }catch(e){ return null; } }
async function _recSave(h){ try{ var db=await _recIdb('gov_fs');
  db.transaction('handles','readwrite').objectStore('handles').put({key:'recDir',handle:h}); }catch(e){} }
async function _recOk(h){ if(!h) return false;
  try{ if(await h.queryPermission({mode:'read'})==='granted') return true;
    return (await h.requestPermission({mode:'read'}))==='granted'; }catch(e){ return false; } }
/* 받은 폴더가 7번 자체인지, 그 위(서류 폴더 전체)인지 가린다 */
async function _recFind7(h){
  if(!h) return null;
  if(/^7\./.test(h.name)) return h;
  try{ return await h.getDirectoryHandle(REC_DIR); }catch(e){}
  try{ for await (var e of h.values()){ if(e.kind==='directory' && /^7\./.test(e.name) && /신청/.test(e.name)) return e; } }catch(e){}
  return null;
}
async function recDirGet(ask){
  if(_recDir) return _recDir;
  var cands=[await _recHandle('gov_fs','recDir'), await _recHandle('kcareer_fs','rootDir')];
  for(var i=0;i<cands.length;i++){ if(cands[i] && await _recOk(cands[i])){ var d=await _recFind7(cands[i]); if(d){ _recDir=d; return d; } } }
  if(!ask) return null;
  if(typeof window.showDirectoryPicker!=='function'){ toast('이 브라우저는 폴더를 열 수 없습니다 — 크롬·엣지에서 열어 주세요'); return null; }
  try{ var h=await window.showDirectoryPicker({id:'gov-recruit',mode:'read'}); }catch(e){ return null; }
  var d2=await _recFind7(h);
  if(!d2){ toast('「'+REC_DIR+'」 폴더(또는 그 위 서류 폴더)를 골라 주세요'); return null; }
  _recDir=d2; _recSave(d2); return d2;
}
async function _recFirstTime(dir){
  var t=0;
  try{ for await (var e of dir.values()){ if(e.kind!=='file') continue;
    try{ var f=await e.getFile(); if(f.lastModified && (!t||f.lastModified<t)) t=f.lastModified; }catch(x){} } }catch(x){}
  return t;
}
async function recScan(){
  var dir=await recDirGet(true); if(!dir) return;
  toast('서류 폴더를 읽는 중입니다…');
  var out=[];
  try{
    for await (var yd of dir.values()){
      if(yd.kind!=='directory' || !/^\d{4}/.test(yd.name)) continue;
      for await (var e of yd.values()){
        var t=0;
        if(e.kind==='file'){ try{ t=(await e.getFile()).lastModified||0; }catch(x){} }
        else t=await _recFirstTime(e);
        out.push({ y:yd.name.slice(0,4), yd:yd.name, name:e.name, dir:e.kind==='directory', t:t });
      }
    }
  }catch(e){ toast('⚠ 폴더를 읽지 못했습니다 — '+(e&&e.message||'')); return; }
  if(!out.length){ toast('「2015년」 같은 해 폴더를 찾지 못했습니다 — 폴더를 다시 골라 주세요'); _recDir=null; return; }
  lsSet('recruit_scan', JSON.stringify(out)); lsSet('recruit_at', String(Date.now())); cloudPush();
  recDraw();
  var g=GovRecruit.group(out, get('recruit_custom'));
  toast('📂 '+out.length+'건을 읽었습니다 — '+(out.length-g.rest.length)+'건이 기관에 묶였습니다');
}

/* 서류 폴더의 파일을 «읽기만» 해서 연다 — 옮기거나 고치지 않는다 */
async function recOpen(id, i){
  var o=recFind(id); if(!o) return; var e=o.items[i]; if(!e) return;
  var dir=await recDirGet(true); if(!dir){ toast('서류 폴더를 열 수 없습니다 — 📂 서류 폴더에서 읽기를 먼저 눌러 주세요'); return; }
  try{
    var yd=await dir.getDirectoryHandle(e.yd||(e.y+'년'));
    if(!e.dir){ recOpenFile(await yd.getFileHandle(e.name)); return; }
    var sub=await yd.getDirectoryHandle(e.name), rows=[], hs=[];
    for await (var f of sub.values()){ hs.push(f); }
    hs.sort(function(a,b){ return a.name.localeCompare(b.name); });
    window._recSub=hs;
    $('recFiles').innerHTML='<div class="snt" style="white-space:normal"><b>📁 '+esc(e.name)+'</b><br>'
      + (hs.length ? hs.map(function(f,k){ return (f.kind==='file'
          ? '📄 <a href="javascript:void(0)" onclick="recOpenFile(window._recSub['+k+'])">'+esc(f.name)+'</a>'
          : '📁 '+esc(f.name)); }).join('<br>') : '<span class="sml">빈 폴더</span>')+'</div>';
  }catch(x){ toast('⚠ 찾지 못했습니다 — 폴더가 옮겨졌을 수 있습니다. 📂 서류 폴더에서 읽기를 다시 눌러 주세요'); }
}
async function recOpenFile(h){
  try{ var f=await h.getFile(), u=URL.createObjectURL(f);
    if(/\.(pdf|png|jpe?g|gif|txt)$/i.test(f.name)) window.open(u,'_blank','noopener');
    else { var a=document.createElement('a'); a.href=u; a.download=f.name; a.click();
      toast('브라우저가 열 수 없는 형식이라 내려받기로 엽니다 — 원본 폴더는 그대로입니다'); }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }catch(x){ toast('⚠ 파일을 열지 못했습니다'); }
}

async function matPull(){
  if(!fbDb || !fbUid){ matNote('로그인이 필요합니다.'); return; }
  matNote('⏳ 경력관리에서 받아오는 중…');
  var ls={}, okN=0, errN=0;
  /* ⚠ 창고를 «콕 집어» 읽는다 — 노드를 통째로 읽으면 첨부 조각(수 MB)과
     API 열쇠(_secrets)까지 딸려 온다. 어느 창고를 읽는지는 GovCareer.paths 가 정한다. */
  await Promise.all(GovCareer.paths(fbUid).map(function(p){
    return fbDb.ref(p.path).once('value')
      .then(function(s){ ls[p.store]=s.val(); okN++; })
      .catch(function(){ errN++; });
  }));
  if(!okN){
    _mat=null; $('matBox').innerHTML='';
    matNote('⚠ <b>경력관리 자료를 읽지 못했습니다.</b> 인터넷을 확인하시고 다시 눌러 주세요.');
    return;
  }
  _mat=GovCareer.build(ls, new Date().toISOString().slice(0,10));
  var c=GovCareer.counts(_mat);
  $('matAt').textContent='마지막으로 받은 때 : '+new Date().toLocaleString('ko-KR')
    +' · 모두 '+c.total+'건'+(errN?(' · 못 읽은 창고 '+errN+'개'):'');
  if(!c.total){
    matNote('경력관리에 담긴 것이 <b>클라우드에는 아직 없습니다.</b><br>'
      +'경력관리를 열어 <b>☁ 클라우드에 저장</b>을 한 번 누르신 뒤 다시 받아와 주세요 — '
      +'이 화면은 «클라우드에 올라간 것»만 읽습니다.');
  } else matNote('');
  matDraw();
}

/* ── 그리기 ──
   대표 지시 2026-10-03 「신청재료 너무 많은 내용으로 정리되어 있다 구분 좀 하고 50개씩 볼수 있게
   정리하고 ㅁ 와 넘버링」 — 여섯 갈래를 한 화면에 쌓던 것(모두 1,053건)을
   «갈래 단추로 하나씩» 보이고, 한 쪽 50건 · 줄마다 ㅁ · № 를 둔다.
   ⚠ 고른 것이 있으면 📋·📤 는 «고른 것만», 없으면 그 갈래 «전부» — 화면이 어느 쪽인지 밝힌다.
   ⚠★ 자문·고문은 고른 것이든 전부든 «반드시» 가려서 나간다(GovCareer 를 거친다). */
var MAT_PER=50;   /* 기본 — 대표가 「표시」로 바꾸면 그 값(matPerN) */
function matPerN(){ var v=perOf('mper'); return v||100000; }
function matPer(v){ lsSet('mper', String(v)); _matPage={}; matDraw(); }
var MAT_KINDS=[
  {k:'edu',      icon:'🎓', nm:'학력'},
  {k:'cert',     icon:'📜', nm:'자격 · 수료'},
  {k:'wiccok',   icon:'🏛', nm:'위촉 · 위원 경력'},
  {k:'award',    icon:'🏅', nm:'표창 · 포상'},
  {k:'advisory', icon:'🤝', nm:'자문 · 고문'},
  {k:'perf',     icon:'📈', nm:'수행 실적'}
];
var _matKind=null, _matPage={}, _matSel={};

function _b(v){ return '<b>'+esc(v||'-')+'</b>'; }
function _td(v){ var t=(v==null||v==='')?'-':v; return '<td>'+t+'</td>'; }

/* 위촉·위원은 197건이라 다 펼치면 못 읽는다 — 「지금 맡고 있는 것만」이 기본. */
function matWicRows(){
  var a=(_mat&&_mat.wiccok)||[];
  return _matLive ? a.filter(function(r){ return r.state==='진행'; }) : a;
}
/* ⚠ 목록이 바뀌면(끄고 켜기) 고른 것·쪽을 놓는다 — 번호가 다른 줄을 가리키게 된다 */
function matLiveTog(){ _matLive=!_matLive; _matSel.wiccok={}; _matPage.wiccok=0; matDraw(); }

/* 갈래별 «보이는» 목록 — 화면·고르기·내보내기가 모두 이것 하나를 본다 */
function matList(k){
  var m=_mat; if(!m) return [];
  if(k==='cert') return m.license.map(function(r){ r=Object.assign({},r); r._k='자격'; return r; })
    .concat(m.complete.map(function(r){ r=Object.assign({},r); r._k='수료'; return r; }));
  if(k==='wiccok') return matWicRows();
  return m[k]||[];
}
function matSelN(k){ return Object.keys(_matSel[k]||{}).length; }
/* 고른 것이 있으면 고른 것만, 없으면 전부 */
function matPicked(k){
  var a=matList(k), s=_matSel[k]||{};
  if(!matSelN(k)) return a;
  return a.filter(function(r,i){ return s[i]; });
}

function matGo(k){ _matKind=k; lsSet('matkind',k); matDraw(); }
function matPageTo(p){ _matPage[_matKind]=p; matDraw(); }
function matTog(i,on){ var s=_matSel[_matKind]=_matSel[_matKind]||{}; if(on) s[i]=1; else delete s[i]; matDraw(); }
function matSelPage(on){
  var k=_matKind, a=matList(k), p=_matPage[k]||0, s=_matSel[k]=_matSel[k]||{};
  for(var i=p*matPerN();i<Math.min(a.length,(p+1)*matPerN());i++){ if(on) s[i]=1; else delete s[i]; }
  matDraw();
}
function matSelAll(){ var k=_matKind, s=_matSel[k]={}; matList(k).forEach(function(r,i){ s[i]=1; }); matDraw(); }
function matSelClear(){ _matSel[_matKind]={}; matDraw(); }

function _matCount(k){
  var m=_mat;
  if(k==='cert') return '자격 '+m.license.length+' · 수료 '+m.complete.length;
  if(k==='wiccok') return m.wiccok.length+'건 · 지금 '+m.wiccok.filter(function(r){ return r.state==='진행'; }).length+'건';
  if(k==='advisory') return m.advisory.length+'개사';
  return (m[k]||[]).length+'건';
}
var MAT_COLS={
  edu:     {h:['기간','학교명','학과·전공','학위','졸업구분'],
            c:function(r){ return [esc(r.period), _b(r.school), esc(r.major), esc(r.degree), esc(r.graduated)]; }},
  cert:    {h:['구분','자격·과정명','발급기관','취득일','번호·시간'],
            c:function(r){ return ['<span class="tag '+(r._k==='자격'?'navy':'teal')+'">'+r._k+'</span>',
              _b(r.title), esc(r.org), esc(r.date), esc(r.num || (r.duration ? r.duration+'h' : ''))]; }},
  wiccok:  {h:['위촉기관','직책','위촉시작','위촉종료','상태'],
            c:function(r){ return [_b(r.org), esc(r.role), esc(r.start), esc(r.end),
              r.state ? '<span class="tag '+(r.state==='진행'?'teal':'amber')+'">'+r.state+'</span>'
                      : '<span class="sml">기간 모름</span>']; }},
  award:   {h:['수여기관','내용','수상일'],
            c:function(r){ return [_b(r.org), esc(r.title), esc(r.date||r.year)]; }},
  /* ⚠ 목록에는 이름을 그대로 둔다 — 대표님이 알아보셔야 한다. 가리는 것은 내보낼 때다. */
  advisory:{h:['고객사','업태·종목','규모','근로자','기간','상태'],
            c:function(r){ return [_b(r.org), esc([r.bizType,r.bizCategory].filter(Boolean).join(' · ')),
              esc(r.size), r.insured?r.insured.toLocaleString('ko-KR'):'', esc(r.period),
              '<span class="tag '+(r.status==='진행'?'teal':'amber')+'">'+esc(r.status||'-')+'</span>']; }},
  perf:    {h:['연도','갈래','사업·과제','고객사','수행기관','상태'],
            c:function(r){ return [esc(r.year), '<span class="tag navy">'+esc(r.kind)+'</span>', _b(r.project),
              esc(r.org), esc(r.agency), esc(r.status)]; }}
};

function matDraw(){
  if(!_mat){ $('matBox').innerHTML=''; return; }
  var k=_matKind;
  if(!MAT_KINDS.some(function(x){ return x.k===k; })) k=_matKind=(lsGet('matkind')||'edu');
  if(!MAT_KINDS.some(function(x){ return x.k===k; })) k=_matKind='edu';
  var info=MAT_KINDS.filter(function(x){ return x.k===k; })[0];
  var all=matList(k), n=all.length, sel=_matSel[k]||{}, sn=matSelN(k);
  var pages=Math.max(1,Math.ceil(n/matPerN())), p=Math.min(_matPage[k]||0,pages-1); _matPage[k]=p;
  var from=p*matPerN(), rows=all.slice(from, from+matPerN());
  var pageAll=rows.length && rows.every(function(r,i){ return sel[from+i]; });
  var h='';

  /* ① 갈래 단추 — 한 번에 한 갈래만 */
  h+='<div class="mchips">'+MAT_KINDS.map(function(x){
    return '<button class="mchip'+(x.k===k?' on':'')+'" onclick="matGo(\''+x.k+'\')">'
      +x.icon+' '+esc(x.nm)+' <span class="n">'+(matList(x.k).length)+'</span></button>'; }).join('')+'</div>';

  /* ② 머리줄 — 무엇을 내보내는지 밝힌다 */
  var tgt=sn ? '고른 '+sn+'건' : '전체 '+n+'건';
  h+='<div class="card mhead"><div class="bar" style="margin-bottom:0">'
    +'<b style="color:var(--navy)">'+info.icon+' '+esc(info.nm)+'</b>'
    +'<span class="sml">'+esc(_matCount(k))+'</span>'
    +(k==='wiccok' ? '<label class="sml"><input type="checkbox" '+(_matLive?'checked':'')
        +' onchange="matLiveTog()"> 지금 맡고 있는 것만</label>' : '')
    +(k==='advisory' ? ' <span class="tag red">내보낼 때 이름 가림</span>' : '')
    +'<div class="sp"></div>'+perSel('mper','matPer')+' '
    +'<button class="btn sm" onclick="matCopy(\''+k+'\')">📋 복사 · '+tgt+'</button> '
    +'<button class="btn sm" onclick="matCsv(\''+k+'\')">📤 CSV · '+tgt+'</button>'
    +'</div>';
  if(sn) h+='<div class="sel-bar">✔ <b>'+sn+'건</b> 선택'
    +' <button class="btn sm" onclick="matSelAll()">이 갈래 전체 선택 ('+n+')</button>'
    +' <button class="btn sm" onclick="matSelClear()">선택 해제</button></div>';
  if(k==='advisory'){
    h+='<div class="warn">⚠ <b>고객사 이름은 내보낼 때 가려집니다.</b> 아래 목록에는 대표님이 '
      +'알아보시게 실제 이름을 두지만, <b>복사·CSV 로 나갈 때는</b> 「○○제조사」처럼 바뀝니다 — '
      +'고객사와의 비밀유지 때문입니다.</div>';
    var t=GovCareer.advisorySentence(matPicked(k), new Date().toISOString().slice(0,10));
    if(t) h+='<div class="snt">'+esc(t)+'</div>';
  }

  /* ③ 표 — ㅁ · № · 칸 */
  var C=MAT_COLS[k];
  if(!n) h+='<div class="sml" style="padding:10px 2px">없습니다.</div>';
  else h+='<div class="scroll"><table><thead><tr>'
    +'<th class="chk"><input type="checkbox" title="이 쪽 모두" '+(pageAll?'checked':'')+' onchange="matSelPage(this.checked)"></th>'
    +'<th class="rn">№</th>'
    +C.h.map(function(c){ return '<th>'+esc(c)+'</th>'; }).join('')
    +'</tr></thead><tbody>'
    +rows.map(function(r,i){ var gi=from+i, on=!!sel[gi];
        return '<tr class="mr'+(on?' sel-on':'')+'" onclick="matRowClick(event,'+gi+')">'
          +'<td class="chk"><input type="checkbox" class="row-chk" '+(on?'checked':'')+' onchange="matTog('+gi+',this.checked)"></td>'
          +'<td class="rn">'+(gi+1)+'</td>'
          +C.c(r).map(_td).join('')+'</tr>'; }).join('')
    +'</tbody></table></div>';

  /* ④ 쪽 넘기기 — 50건씩 */
  if(pages>1){
    h+='<div class="pager"><button class="btn sm" '+(p<=0?'disabled':'')+' onclick="matPageTo('+(p-1)+')">◀</button>';
    for(var i=0;i<pages;i++) h+='<button class="btn sm'+(i===p?' on':'')+'" onclick="matPageTo('+i+')">'+(i+1)+'</button>';
    h+='<button class="btn sm" '+(p>=pages-1?'disabled':'')+' onclick="matPageTo('+(p+1)+')">▶</button>'
      +'<span class="sml">'+(from+1)+'–'+(from+rows.length)+' / '+n+'건</span></div>';
  }
  h+='</div>';
  $('matBox').innerHTML=h;
}

/* 줄을 누르면 그 줄의 칸을 모두 보여 준다 — 표에선 잘린 긴 글자를 여기서 다 읽는다 */
var MAT_LABEL={period:'기간',school:'학교명',major:'학과·전공',degree:'학위',graduated:'졸업구분',
  title:'이름·내용',org:'기관',date:'날짜',num:'번호',duration:'시간',role:'직책',issuer:'발급·위촉인',
  issueDate:'발급일',start:'시작',end:'종료',year:'연도',state:'상태',type:'유형',bizType:'업태',
  bizCategory:'종목',size:'규모',insured:'근로자 수',status:'상태',kind:'갈래',project:'사업·과제',
  agency:'수행기관',main:'담당',dept:'부서'};
function matRowClick(e,gi){
  var t=e&&e.target; if(t && t.closest && t.closest('input,button,a,select,label')) return;
  var r=matList(_matKind)[gi]; if(!r) return;
  var info=MAT_KINDS.filter(function(x){ return x.k===_matKind; })[0];
  var rows=Object.keys(r).filter(function(k){ return k.charAt(0)!=='_' && r[k]!=='' && r[k]!=null; })
    .map(function(k){ return _kv(MAT_LABEL[k]||k, esc(String(r[k]))); }).join('');
  popOpen(info.icon+' '+info.nm+' · '+(gi+1)+'번', '<table class="kv">'+rows+'</table>'
    +(_matKind==='advisory'?'<div class="warn" style="margin-top:10px">⚠ 이 창에는 이름이 보이지만, 복사·CSV 로 나갈 때는 가려집니다.</div>':''));
}

/* ── 내보내기 ──
   ⚠★ 자문·고문은 «반드시» 가려서 나간다. GovCareer 가 가릴 수 없으면 «빈 것»을 돌리므로
      이름이 든 채로 나갈 길이 없다. 여기에 따로 만들지 말 것.
   ⚠ 고른 것이 있으면 고른 것만(matPicked) — 화면 단추 글자와 같은 잣대다. */
function matRowsFor(k){
  if(!_mat) return [];
  var a=matPicked(k);
  if(k==='advisory') return GovCareer.advisoryForExport(a);
  return a;
}
function matText(k){
  if(!_mat) return '';
  var a=matPicked(k);
  if(k==='advisory') return GovCareer.advisorySentence(a, new Date().toISOString().slice(0,10));
  if(k==='cert') return [GovCareer.sentence('license',a.filter(function(r){ return r._k==='자격'; })),
                         GovCareer.sentence('complete',a.filter(function(r){ return r._k==='수료'; }))]
                        .filter(Boolean).join('\n');
  return GovCareer.sentence(k, a);
}
function matCopy(k){
  var t=matText(k);
  if(!t){ toast('내보낼 것이 없습니다'); return; }
  var done=function(){ toast('복사했습니다 — 신청서에 붙여 넣으세요'); };
  try{ navigator.clipboard.writeText(t).then(done, function(){ _matCopyOld(t,done); }); }
  catch(e){ _matCopyOld(t,done); }
}
function _matCopyOld(t,done){
  try{ var ta=document.createElement('textarea'); ta.value=t;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); done(); }catch(e){ toast('복사하지 못했습니다'); }
}
function matCsv(k){
  var rows=matRowsFor(k);
  if(!rows.length){ toast('내보낼 것이 없습니다'); return; }
  var keys=Object.keys(rows[0]).filter(function(x){ return x.charAt(0)!=='_'; });
  var csv=[keys.join(',')].concat(rows.map(function(r){
    return keys.map(function(x){ return '"'+String(r[x]==null?'':r[x]).replace(/"/g,'""')+'"'; }).join(','); })).join('\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));
  a.download='정부사업신청_재료_'+k+'.csv'; a.click();
}

function boot(){
  drawKw(); draw(); readyNote(); applyLock('checking');
  if(location.protocol==='file:'){ applyLock('lock','file:// 로 열면 로그인할 수 없습니다 — 주소로 여세요'); return; }
  if(typeof firebase==='undefined'){ applyLock('lock','인터넷이 필요합니다'); return; }
  if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
  fbDb=firebase.database();
  try{ firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
  firebase.auth().onAuthStateChanged(async function(u){
    fbUid=u?u.uid:null;
    /* 이름은 공용 부품이 #who 에 그린다 — 여기서 메일로 덮지 않는다(로그아웃 때만 비운다) */
    if(!u) $('who').textContent='';
    $('outBtn').style.display=u?'':'none';
    /* ⚠★ 「로그아웃」과 「권한 없음」은 다른 말이다 (대표 지시 2026-09-14).
         세션이 아예 없으면 → 통합 자물쇠 화면(모든 앱이 같은 것).
         로그인은 됐는데 이 앱을 못 보는 것이면 → 그대로 잠금 카드다.
         둘을 뭉뚱그려 「로그인하세요」라고 하면, 시키는 대로 해도 아무것도 안 달라진다. */
    if(!u){ PuGate.show(); return; }
    PuGate.hide();
    var r=await whoAmI(u);
    if(!r.ok){ applyLock('lock', r.why); return; }
    applyLock('ok');
    await cloudPull(); srcBackfill(); rejudge(); drawKw(); draw(); readyNote(); auto();
    /* 마지막으로 보던 문을 다시 연다 — 재료 탭이면 그때 받아온다(setTab 이 부른다) */
    setTab(lsGet('tab'));
  });
}
boot();
</script>
