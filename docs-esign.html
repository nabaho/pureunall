  .shell{display:flex;align-items:flex-start;max-width:1360px;margin:0 auto}

    .hwp-preview{min-height:300px;max-height:none}.hwp-actions{display:grid!important;grid-template-columns:1fr 1fr}.hwp-actions .btn{width:100%}

<script>
'use strict';
var FB_CONFIG = {
  apiKey: 'AIzaSyDkZz5QlKSoqMOYByp5YGeMNLNDrIghliA',
  databaseURL: 'https://pureun-erp-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'pureun-erp',
  appId: '1:936817166182:web:9bd31f70d0afdf5fca2aa7',
  messagingSenderId: '936817166182'
};
firebase.initializeApp(FB_CONFIG);
var db = firebase.database();
var $ = function (id) { return document.getElementById(id); };
var curUser = null;
var casesCache = {};
var savePending = 0, saveFailed = false;
function setSaveState(kind, text) {
  var el = $('saveState'); if (!el) return;
  el.className = 'save-state ' + kind; el.textContent = text;
}
function trackedWrite(promise) {
  if (savePending === 0) saveFailed = false;
  savePending++; setSaveState('saving', '저장 중…');
  return promise.then(function (v) {
    savePending = Math.max(0, savePending - 1);
    if (!savePending) setSaveState(saveFailed ? 'failed' : 'saved', saveFailed ? '저장 실패' : '저장 완료');
    return v;
  }).catch(function (e) {
    saveFailed = true; savePending = Math.max(0, savePending - 1); setSaveState('failed', '저장 실패');
    throw e;
  });
}

// ── 로그인 가드 (직원 이메일 계정 필수 — 익명/미로그인은 포털로) ──
firebase.auth().onAuthStateChanged(function (u) {
  /* ⚠★ 포털로 «튕기지» 않는다 (대표 지시 2026-09-14 「모두 캡쳐1의 모습으로」).
     튕기면 로그인 창이 뜨는데, 대표는 자기가 무엇을 누르다 그리로 갔는지 알 수가 없다.
     자물쇠 화면을 보이고 「🏠 통합시스템으로 이동」을 «누르게» 한다. */
  if (!u || !u.email) { PuGate.show(); return; }
  PuGate.hide();
  curUser = u;
  $('whoami').textContent = u.email.split('@')[0];
  loadCases();
  showPane(paneFromHash());
});

/* ── 왼쪽 목록: 전자송부 ↔ 사무관리서류 › 계약서 양식 ──
   주소 끝(#forms)에 적어 두어 새로고침해도 보던 자리로 돌아온다.
   ⚠ 양식 화면은 «처음 열 때» 한 번만 싣는다 — 전자송부만 쓰는 날엔 양식 표를 받지 않는다. */
var formsMounted = false;
function paneFromHash() { return location.hash === '#forms' ? 'forms' : 'esign'; }
function showPane(name) {
  $('paneEsign').hidden = name !== 'esign';
  $('paneForms').hidden = name !== 'forms';
  document.querySelectorAll('.side .nav').forEach(function (b) {
    var on = b.getAttribute('data-pane') === name;
    b.classList.toggle('on', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if (name === 'forms' && !formsMounted && curUser) {
    formsMounted = true;
    PuContractForms.mount($('formsRoot'), { db: db, track: trackedWrite });
  }
}
document.querySelectorAll('.side .nav').forEach(function (b) {
  b.addEventListener('click', function () {
    var name = b.getAttribute('data-pane');
    var want = name === 'forms' ? '#forms' : '';
    if (location.hash !== want) history.pushState(null, '', want || (location.pathname + location.search));
    showPane(name);
  });
});
/* 뒤로가기로 칸을 바꿨으면 «우리가 처리했다»고 알린다 — 안 그러면 js/pu-back.js 가
   같은 한 번 누름에 앱까지 나간다(칸이 그대로일 때는 그쪽이 덮개를 닫거나 나간다). */
window.addEventListener('popstate', function () {
  var want = paneFromHash();
  if ($('paneForms').hidden === (want === 'forms')) window.__puBackNav = true;
  showPane(want);
});

// ── 사건 목록 ──
// 캐시(casesCache)를 화면 표로 그린다. once 로 받은 뒤에도, 내가 한 일(사건
// 생성·마감·파기)로 캐시를 직접 고친 다음에도 이 함수 하나로 다시 그린다.
function renderCaseList() {
  var ids = Object.keys(casesCache).sort(function (a, b) {
    return ((casesCache[b].meta || {}).createdAt || 0) - ((casesCache[a].meta || {}).createdAt || 0);
  });
  var tb = $('caseRows');
  if (!ids.length) { tb.innerHTML = '<tr><td colspan="6" style="color:#94a3b8">사건이 없습니다. [+ 새 사건]으로 시작하세요.</td></tr>'; return; }
  tb.innerHTML = ids.map(function (id) {
    var c = casesCache[id], m = c.meta || {};
    var n = Object.keys(c.submissions || {}).length;
    return '<tr>'
      + '<td><a href="javascript:void(0)" onclick="openCase(\'' + id + '\')" style="color:#1e40af;font-weight:700">' + EsignDocs.esc(m.title || '(제목 없음)') + '</a></td>'
      + '<td>' + EsignDocs.esc(m.company || '') + '</td>'
      + '<td><b>' + n + '</b>명</td>'
      + '<td><span class="badge b-' + (m.status === 'active' ? 'active' : 'closed') + '">' + EsignDocs.esc(m.status || '') + '</span></td>'
      + '<td>' + (m.createdAt ? localYMD(new Date(m.createdAt)) : '') + '</td>'
      + '<td><button class="btn btn-sub" onclick="shareCase(\'' + id + '\')">🔗 링크</button></td>'
      + '</tr>';
  }).join('');
}

/* ── 사건 목록 받기 (대표 지시 2026-08-13, 비용 조사) ──
   "비용을 최소화할 수 있는 방향 검토해 달라" — 8/1~8/11 실시간DB 내려받기
   ₩28,833(청구서의 93%).

   ⚠ .on('value') 로 esign/cases 를 통째 구독하면, 그 아래 **모든 사건의 모든
     제출**(암호문 + 서명 그림)까지 실시간DB 가 그대로 실어 보낸다. 화면은 그중
     meta 와 제출 **개수**만 쓴다 — 나머지(제출 내용)는 내려받고서 버린다.
     사건이 늘고 제출이 쌓일수록, **아무 관계 없는 사건의 제출 하나만 늘어도**
     구독 중인 모든 탭에 전체가 다시 내려간다.
   그래서 once 로 한 번만 받는다. 그 뒤로는 **내가 한 일**(사건 생성·마감·
   파기)만 casesCache 를 직접 고쳐 화면을 바꾼다 — 서버에 다시 묻지 않는다.
   ⚠ 다른 직원이 사건을 만들거나 마감한 것은 스스로 안 보인다 — [🔄 새로고침]을
     눌러야 한다. 이 화면은 개인정보가 걸린 소수 사건을 다루는 관리자용 목록이라
     실시간 협업(다른 직원 변경을 곧바로 보는 것)이 꼭 필요하지 않다고 봤다. */
function loadCases() {
  return db.ref('esign/cases').once('value').then(function (snap) {
    casesCache = snap.val() || {};
    renderCaseList();
  }).catch(function (e) {
    var tb = $('caseRows');
    tb.innerHTML = '<tr><td colspan="6" style="color:#991b1b">사건 목록을 불러오지 못했습니다 — '
      + EsignDocs.esc(String((e && e.message) || e)) + '</td></tr>';
  });
}
$('btnRefreshCases').onclick = loadCases;

  bg.className = 'modal-bg';

    + '<label>회사명(피진정인) *</label><input id="ncCompany" style="width:100%">'
    + '<label>대표자/주소 등</label><input id="ncResp" style="width:100%">'
    + '<label>사건 비밀번호 * (제출 열람용)</label><input id="ncPw" type="password" style="width:100%">'
    + '<label>사건 비밀번호 확인 *</label><input id="ncPw2" type="password" style="width:100%">'
    + '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px;margin-top:12px;font-size:12.5px;color:#991b1b">'
    + '⚠ 이 비밀번호를 잊으면 <b>제출된 개인정보를 영구히 복구할 수 없습니다.</b> 안전한 곳에 별도 보관하세요.</div>'
    + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">'
    + '<button class="btn btn-sub" id="ncCancel">취소</button>'
    + '<button class="btn btn-pri" id="ncOk">사건 생성</button></div></div>';
  document.body.appendChild(bg);
  $('ncCancel').onclick = function () { bg.remove(); };
  $('ncOk').onclick = async function () {
    var title = $('ncTitle').value.trim(), company = $('ncCompany').value.trim();
    var pw = $('ncPw').value, pw2 = $('ncPw2').value;
    if (!title || !company) { showToast('사건명과 회사명을 입력하세요'); return; }
    if (pw.length < 6) { showToast('비밀번호는 6자 이상으로 하세요'); return; }
    if (pw !== pw2) { showToast('비밀번호 확인이 일치하지 않습니다'); return; }
    this.textContent = '키 생성 중…'; this.disabled = true;
    try {
      var keys = await EsignCrypto.generateCaseKeys();
      var prot = await EsignCrypto.protectPrivKey(keys.privKeyJwk, pw);
      var ref = db.ref('esign/cases').push();
      var linkToken = EsignCrypto.randomToken();
      var meta = {
        title: title, company: company, respondent: $('ncResp').value.trim(),
        ownerSid: curUser.email.split('@')[0],
        pubKey: keys.pubKeyJwk, linkToken: linkToken,
        createdAt: firebase.database.ServerValue.TIMESTAMP, status: 'active'
      };
      await trackedWrite(ref.child('meta').set(meta));
      await trackedWrite(ref.child('secret/encPrivKey').set(prot));
      bg.remove();
      /* ⚠ 목록을 once 로만 받으므로(비용 절감) 여기서 캐시에 직접 넣어야
         한다 — 안 넣으면 [🔄 새로고침]을 누르기 전까지 방금 만든 사건이
         목록에 안 보인다. createdAt 은 서버 시각을 몰라 지금 시각으로
         어림한다(정렬에만 쓰인다 — 서버 값은 다음 새로고침 때 정확해진다). */
      casesCache[ref.key] = { meta: Object.assign({}, meta, { createdAt: Date.now() }) };
      renderCaseList();
      showToast('✅ 사건이 생성되었습니다 — [🔗 링크]로 근로자에게 공유하세요');
    } catch (e) {
      this.textContent = '사건 생성'; this.disabled = false;
      showToast('사건 생성에 실패했습니다 — 인터넷 연결을 확인하고 다시 시도해 주세요');
    }
  };
};

// ── 링크·QR 공유 ──
function shareCase(caseId) {
  var m = (casesCache[caseId] || {}).meta || {};
  var url = location.origin + location.pathname.replace(/docs-esign\.html$/, 'sign.html')
    + '?case=' + caseId + '&t=' + (m.linkToken || '');
  var bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal" style="text-align:center">'
    + '<h3>' + EsignDocs.esc(m.title || '') + '</h3>'
    + '<div id="qrBox" style="display:flex;justify-content:center;margin:16px 0"></div>'
    + '<input readonly value="' + url + '" style="width:100%;font-size:12px;color:#475569" onclick="this.select()">'
    + '<div style="display:flex;gap:8px;justify-content:center;margin-top:14px">'
    + '<button class="btn btn-pri" id="shCopy">📋 링크 복사</button>'
    + '<button class="btn btn-sub" id="shShare">📤 공유(카톡)</button>'
    + '<button class="btn btn-sub" id="shClose">닫기</button></div></div>';

    else copyToClipboard(url);
  };
  $('shClose').onclick = function () { bg.remove(); };
}

// ── 사건 상세 (복호화 세션) ──
var curCaseId = null, curPrivKey = null, decrypted = [];

async function openCase(caseId) {
  var c = casesCache[caseId]; if (!c) return;
  var pw = prompt('사건 비밀번호를 입력하세요 (사건 생성 시 설정)');
  if (!pw) return;
  var protSnap;
  try {
    protSnap = await db.ref('esign/cases/' + caseId + '/secret/encPrivKey').once('value');
  } catch (e) {
    showToast('사건 정보를 불러올 수 없습니다 — 네트워크를 확인해 주세요');
    return;
  }
  try {
    curPrivKey = await EsignCrypto.unprotectPrivKey(protSnap.val(), pw);
  } catch (e) {
    showToast('❌ 비밀번호가 올바르지 않습니다');
    return;
  }
  curCaseId = caseId;
  await refreshSubs();
  $('viewList').style.display = 'none';
  $('viewDetail').style.display = 'block';
  renderDetail();
}

// 제출 전체 복호화 (실패 건은 표시만 하고 건너뜀)
async function refreshSubs() {
  var snap = await db.ref('esign/cases/' + curCaseId + '/submissions').once('value');
  var subs = snap.val() || {};
  decrypted = [];
  for (var id in subs) {
    var s = subs[id];
    try {
      var d = await EsignCrypto.decryptSubmission({ enc: s.enc, encKey: s.encKey, iv: s.iv }, curPrivKey);
      d._subId = id; d._submittedAt = s.submittedAt || 0; d._reviewState = s.reviewState || 'pending';
      decrypted.push(d);
    } catch (e) {
      if (window.console) console.error('제출 복호화 실패', id, e);
      decrypted.push({ _subId: id, _submittedAt: s.submittedAt || 0, _reviewState: 'error', name: '(복호화 실패)', idNo: '', phone: '' });
    }
  }
  decrypted.sort(function (a, b) { return a._submittedAt - b._submittedAt; });
}

var RS_LABEL = { pending: '⏳ 대기', confirmed: '✅ 확인', hold: '⚠ 보류', error: '❌ 오류' };

function renderDetail() {
  var m = (casesCache[curCaseId] || {}).meta || {};
  // 중복 감지: 동일 주민번호 2건 이상
  var cnt = {};
  decrypted.forEach(function (d) { if (d.idNo) cnt[d.idNo] = (cnt[d.idNo] || 0) + 1; });
  $('viewDetail').innerHTML =

    + '<button class="btn btn-sub" onclick="closeDetail()">← 목록</button>'
    + '<b style="flex:1;font-size:15px">' + EsignDocs.esc(m.title || '') + ' <span style="color:#64748b;font-weight:400">— 제출 '
    + decrypted.length + '명</span></b>'
    + '<button class="btn btn-sub" onclick="shareCase(curCaseId)">🔗 링크</button>'
    + '<span id="detailActions"></span>' // Task 11·12가 버튼 추가
    + '</div>'
    + '<table><thead><tr><th>#</th><th>성명</th><th>주민등록번호</th><th>연락처</th><th>제출일시</th><th>상태</th><th></th></tr></thead><tbody>'
    + decrypted.map(function (d, i) {
      var dup = d.idNo && cnt[d.idNo] > 1 ? ' <span class="badge" style="background:#fffbeb;color:#854d0e">중복</span>' : '';
      return '<tr>'
        + '<td>' + (i + 1) + '</td>'
        + '<td style="font-weight:700">' + EsignDocs.esc(d.name) + dup + '</td>'
        + '<td class="rrnCell" data-full="' + EsignDocs.esc(d.idNo || '') + '" style="cursor:pointer" title="클릭하면 전체 표시">' + EsignDocs.esc(EsignDocs.maskIdNo(d.idNo)) + '</td>'
        + '<td>' + EsignDocs.esc(d.phone || '') + '</td>'
        + '<td>' + (d._submittedAt ? new Date(d._submittedAt).toLocaleString('ko-KR') : '') + '</td>'
        + '<td><a href="javascript:void(0)" onclick="cycleReview(\'' + d._subId + '\')">' + EsignDocs.esc(RS_LABEL[d._reviewState] || d._reviewState) + '</a></td>'
        + '<td><button class="btn btn-sub" onclick="showPerson(\'' + d._subId + '\')">상세</button> '
        + '<button class="btn btn-danger" onclick="delSub(\'' + d._subId + '\')">삭제</button></td>'
        + '</tr>';
    }).join('')
    + '</tbody></table></div>';
  // RRN 마스킹 셀 클릭 시 전체 표시 — textContent 대입이라 HTML 파싱 없이 안전
  $('viewDetail').querySelectorAll('.rrnCell').forEach(function (td) {
    td.onclick = function () { this.textContent = this.dataset.full; };
  });
  if (typeof renderDetailActions === 'function') renderDetailActions(); // Task 11·12
}
function closeDetail() {
  curCaseId = null; curPrivKey = null; decrypted = []; // 복호화 세션 종료 — 메모리 정리
  $('viewDetail').style.display = 'none';
  $('viewList').style.display = 'block';
}

// 검토상태 순환: pending → confirmed → hold → pending
function cycleReview(subId) {
  var d = decrypted.find(function (x) { return x._subId === subId; }); if (!d) return;
  var prev = d._reviewState;
  var next = { pending: 'confirmed', confirmed: 'hold', hold: 'pending' }[prev] || 'pending';
  trackedWrite(db.ref('esign/cases/' + curCaseId + '/submissions/' + subId + '/reviewState').set(next)).catch(function (e) {
    showToast('저장 실패 — 다시 시도해 주세요');
    d._reviewState = prev;
    renderDetail();
  });
  d._reviewState = next;
  renderDetail();
}

// 개인 상세 (서명 미리보기)
function showPerson(subId) {
  var d = decrypted.find(function (x) { return x._subId === subId; }); if (!d) return;
  // sigPng는 근로자가 임의 조작 가능한 평문(암호문 자체는 형식 검증 대상이 아님) — 정상 PNG data URL 형식만 허용
  var okSig = d.sigPng && /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(d.sigPng);
  var bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.onclick = function (e) { if (e.target === bg) bg.remove(); };
  bg.innerHTML = '<div class="modal">'
    + '<h3 style="margin-bottom:10px">' + EsignDocs.esc(d.name) + '</h3>'
    + '<table>'
    + '<tr><th>주민등록번호</th><td>' + EsignDocs.esc(d.idNo) + '</td></tr>'
    + '<tr><th>연락처</th><td>' + EsignDocs.esc(d.phone) + '</td></tr>'
    + '<tr><th>주소</th><td>' + EsignDocs.esc(d.addr || '') + '</td></tr>'
    + '<tr><th>입금계좌</th><td>' + EsignDocs.esc(d.bank || '') + '</td></tr>'
    + '<tr><th>입사일</th><td>' + (d.joinDate ? EsignDocs.esc(d.joinDate) : '-') + '</td></tr>'
    + '<tr><th>퇴사일</th><td>' + (d.leaveDate ? EsignDocs.esc(d.leaveDate) : '-') + '</td></tr>'
    + '<tr><th>동의일시</th><td>' + EsignDocs.esc(String(d.consentAt || '').replace('T', ' ').slice(0, 16)) + '</td></tr>'
    + '<tr><th>서명</th><td>' + (okSig ? '<img src="' + d.sigPng + '" style="height:70px;border:1px solid #e2e8f0;border-radius:6px">' : '-') + '</td></tr>'
    + '</table>'
    + '<div style="text-align:right;margin-top:12px"><button class="btn btn-sub" onclick="this.closest(\'.modal-bg\').remove()">닫기</button></div></div>';
  document.body.appendChild(bg);
}

// 삭제 (Undo 토스트 — utils.js showToastUndo)
function delSub(subId) {
  var snapCache = null;
  db.ref('esign/cases/' + curCaseId + '/submissions/' + subId).once('value').then(function (s) {
    snapCache = s.val();
    return trackedWrite(db.ref('esign/cases/' + curCaseId + '/submissions/' + subId).remove());
  }).then(function () {
    decrypted = decrypted.filter(function (x) { return x._subId !== subId; });
    renderDetail();
    showToastUndo('제출 1건을 삭제했습니다', function () {
      trackedWrite(db.ref('esign/cases/' + curCaseId + '/submissions/' + subId).set(snapCache)).then(refreshSubs).then(renderDetail).catch(function (e) {
        showToast('삭제 실패 — 다시 시도해 주세요');
      });
    });
  }).catch(function (e) {
    showToast('삭제 실패 — 다시 시도해 주세요');
  });
}

// ── 체불내역 입력 (근로자에게 받지 않고 노무사가 입력 — 설계 §8.1) ──

// 사건별 HWP/HWPX 원본은 관리자 기기의 브라우저에만 보관한다.
// 공개 근로자 서명 화면(sign.html)과 RTDB에는 파일을 전송하지 않는다.
var caseHwpModal = null;
var caseHwpEditor = null;

function closeCaseHwp() {
  if (caseHwpEditor && typeof caseHwpEditor.destroy === 'function') {
    try { caseHwpEditor.destroy(); } catch (_) {}
  }
  caseHwpEditor = null;
  if (caseHwpModal) caseHwpModal.remove();

function hwpFileSummary(record) {
  if (!record) return '<b>등록된 한글 원본이 없습니다.</b><div style="color:#64748b;margin-top:4px">HWP 또는 HWPX 파일을 선택해 주세요.</div>';
  var kb = Math.max(1, Math.round((record.size || 0) / 1024));
  var when = record.savedAt ? new Date(record.savedAt).toLocaleString('ko-KR') : '';
  return '<b>' + EsignDocs.esc(record.name || '한글 원본') + '</b>'
    + '<div style="color:#64748b;margin-top:4px">' + String(record.format || '').toUpperCase() + ' · ' + kb.toLocaleString() + 'KB · ' + EsignDocs.esc(when) + '</div>';
}

async function refreshCaseHwp() {
  if (!caseHwpModal) return null;
  var record = await PureunHwpStore.get('esign-case', curCaseId);
  var status = caseHwpModal.querySelector('#caseHwpStatus');
  if (status) status.innerHTML = hwpFileSummary(record);
  ['caseHwpOpen', 'caseHwpDownload', 'caseHwpDelete'].forEach(function (id) {
    var btn = caseHwpModal.querySelector('#' + id); if (btn) btn.disabled = !record;
  });
  refreshCaseHwpTpl(record).catch(function (e) { if (window.console) console.warn('표지 살펴보기 실패', e); });
  return record;
}

// ── 근로자별로 채우기 (대표 지시 2026-09-24 「문서관리 앱에도 넣어줄수있나」) ──
// 한글 원본에 {{이름}} 같은 표지가 있으면, 확인된 근로자별로 값을 채운 파일을 만든다.
// 표지가 없는(누름틀·백지 위임장 그대로인) 파일은 이 칸을 보여주지 않는다 — 기존 [열기]만 쓰면 된다.
var _esignArrearsLoadedFor = null;
async function refreshCaseHwpTpl(record) {
  var box = caseHwpModal && caseHwpModal.querySelector('#caseHwpTplBox');
  if (!box) return;
  if (!record) { box.innerHTML = ''; return; }
  var mk = {};
  try {
    var doc = await PureunHwp.openDoc(record.bytes, record.name);
    try { mk = EsignHwpTpl.markersOf(doc); } finally { try { doc.free(); } catch (e2) {} }
  } catch (e) { box.innerHTML = ''; return; }
  var names = Object.keys(mk), total = names.reduce(function (a, k) { return a + mk[k]; }, 0);
  if (!total) { box.innerHTML = ''; return; }   // 표지가 없다 — 원본을 그대로 여는 길만 쓴다
  var known = EsignHwpTpl.valuesOf({}, {}, {});
  var unknown = names.filter(function (k) { return known[k] === undefined; });
  if (_esignArrearsLoadedFor !== curCaseId) {
    try {
      var snap = await db.ref('esign/cases/' + curCaseId + '/arrears').once('value');
      arrearsCache = snap.val() || {};
      _esignArrearsLoadedFor = curCaseId;
    } catch (e) { /* 체불액 없이도 나머지는 채운다 */ }
  }
  renderCaseHwpFillBox(box, total, unknown);
}
function renderCaseHwpFillBox(box, total, unknown) {
  var pool = (decrypted || []).filter(function (d) { return d._reviewState !== 'error'; });
  if (!pool.length) { box.innerHTML = ''; return; }
  var STATE_COLOR = { confirmed: '#166534', hold: '#854d0e', pending: '#64748b' };
  var rows = pool.map(function (d) {
    var a = arrearsCache[d._subId] || {};
    var sum = (+a.month1 || 0) + (+a.month2 || 0) + (+a.month3 || 0) + (+a.severance || 0);
    return '<div style="display:flex;gap:8px;align-items:center;padding:5px 8px;border-bottom:1px solid #e2e8f0;font-size:12px">'
      + '<input type="checkbox" class="tplPersonChk" data-sub="' + d._subId + '"' + (d._reviewState === 'confirmed' ? ' checked' : '') + '>'
      + '<span style="flex:1">' + EsignDocs.esc(d.name) + ' <span style="color:' + (STATE_COLOR[d._reviewState] || '#64748b') + '">' + (RS_LABEL[d._reviewState] || '') + '</span></span>'
      + '<span>' + (sum ? sum.toLocaleString() : '—') + '</span></div>';
  }).join('');
  box.innerHTML = '<div style="border:2px solid #bfdbfe;border-radius:10px;padding:10px 12px;margin-top:10px">'
    + '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><b>근로자별로 채우기</b></div>'
    + '<div style="font-size:12px;color:#64748b;margin-bottom:8px">채울 자리 ' + total + '곳 알아봄'
    + (unknown.length ? ' · <span style="color:#854d0e">모르는 이름 ' + unknown.length + '곳 — 밑줄로 남김: ' + unknown.map(function (k) { return EsignDocs.esc(k); }).join(', ') + '</span>' : '')
    + '</div>'
    + '<div style="border:1px solid #e2e8f0;border-radius:8px;max-height:220px;overflow:auto">' + rows + '</div>'
    + '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'
    + '<button class="btn btn-sub" id="tplPreviewOne">첫 사람 것 열어 보기</button>'
    + '<button class="btn btn-pri" id="tplDownloadAll">채워 내려받기 (zip)</button></div></div>';
  box.querySelector('#tplPreviewOne').onclick = tplPreviewFirst;
  box.querySelector('#tplDownloadAll').onclick = tplDownloadZip;
}
function tplCheckedPeople() {
  var ids = Array.prototype.map.call(caseHwpModal.querySelectorAll('.tplPersonChk:checked'), function (c) { return c.dataset.sub; });
  return decrypted.filter(function (d) { return ids.indexOf(d._subId) >= 0; });
}
var _esignJsZipP = null;
function _esignLoadJsZip() {
  if (window.JSZip) return Promise.resolve(window.JSZip);
  if (_esignJsZipP) return _esignJsZipP;
  _esignJsZipP = new Promise(function (res, rej) {
    var s = document.createElement('script'); s.src = 'vendor/jszip.min.js';
    s.onload = function () { window.JSZip ? res(window.JSZip) : rej(new Error('zip 도구를 못 읽었습니다')); };
    s.onerror = function () { _esignJsZipP = null; rej(new Error('zip 도구를 못 불러왔습니다')); };
    document.head.appendChild(s);
  });
  return _esignJsZipP;
}
/* ★ 줄 다시 나누기 (기금 회의록 #1583·경력관리 #1584 에서 한글로 직접 열어 보고 배운 것) —
   값을 채운 문단에 옛 줄 정보가 남으면 한글이 그것을 믿어 글자가 겹친다.
   HWPX 로 내보내 줄 정보를 걷어낸 뒤 다시 읽어 reflowLinesegs 로 새로 나눈다. */
async function _esignRelayout(doc) {
  var hx = doc.exportHwpx();
  var JSZ = await _esignLoadJsZip();
  var zip = await JSZ.loadAsync(hx);
  var secs = Object.keys(zip.files).filter(function (n) { return /^Contents\/section\d+\.xml$/.test(n); });
  await Promise.all(secs.map(function (n) {
    return zip.file(n).async('string').then(function (x) { zip.file(n, EsignHwpTpl.stripLinesegs(x)); });
  }));
  var bytes = await zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE', mimeType: 'application/hwp+zip' });
  var d2 = await PureunHwp.openDoc(bytes, 'relayout.hwpx');
  try { d2.reflowLinesegs(); return d2.exportHwp(); } finally { try { d2.free(); } catch (e) {} }
}
async function _esignFillOne(record, meta, person) {
  var doc = await PureunHwp.openDoc(record.bytes, record.name);
  var r;
  try {
    var V = EsignHwpTpl.valuesOf(person, meta, arrearsCache[person._subId] || {});
    r = EsignHwpTpl.fillDoc(doc, V);
  } catch (e) { try { doc.free(); } catch (e2) {} throw e; }
  try { r.bytes = await _esignRelayout(doc); r.relayoutFailed = false; }
  catch (e) { r.bytes = doc.exportHwp(); r.relayoutFailed = true; }
  try { doc.free(); } catch (e) {}
  return r;
}
function _esignSafeName(s) { return String(s || '').replace(/[\\/:*?"<>|]/g, '_').trim() || '사람'; }
async function tplPreviewFirst() {
  var people = tplCheckedPeople();
  if (!people.length) { showToast('채울 사람을 먼저 선택해 주세요'); return; }
  var record = await PureunHwpStore.get('esign-case', curCaseId);
  if (!record) return;
  var meta = (casesCache[curCaseId] || {}).meta || {};
  showToast('채우는 중…');
  try {
    var r = await _esignFillOne(record, meta, people[0]);
    if (r.unknown.length) showToast('모르는 표지 ' + r.unknown.length + '가지 — 그대로 두었습니다: ' + r.unknown.join(', '), 'warn');
    if (r.relayoutFailed) showToast('줄 다시 나누기를 못 해 원본 줄 정보로 냈습니다', 'warn');
    var host = caseHwpModal.querySelector('#caseHwpPreview');
    host.style.display = 'block';
    host.innerHTML = '<div style="padding:24px;color:#64748b">한글 문서를 여는 중…</div>';
    var fname = _esignSafeName(people[0].name) + '.hwp';
    try {
      var opened = await PureunHwp.createEditor('#caseHwpPreview', r.bytes, fname);
      caseHwpEditor = opened.editor;
    } catch (_) { await PureunHwp.renderPreview(host, r.bytes, fname); }
  } catch (e) { showToast(e.message || '채우기 실패'); }
}
async function tplDownloadZip() {
  var people = tplCheckedPeople();
  if (!people.length) { showToast('채울 사람을 먼저 선택해 주세요'); return; }
  var record = await PureunHwpStore.get('esign-case', curCaseId);
  if (!record) return;
  var meta = (casesCache[curCaseId] || {}).meta || {};
  showToast('서류 채우는 중… (' + people.length + '명)');
  try {
    var JSZ = await _esignLoadJsZip();
    var zip = new JSZ();
    var unknownAll = {}, relayoutFailN = 0;
    for (var i = 0; i < people.length; i++) {
      var r = await _esignFillOne(record, meta, people[i]);
      r.unknown.forEach(function (k) { unknownAll[k] = 1; });
      if (r.relayoutFailed) relayoutFailN++;
      zip.file(_esignSafeName(people[i].name) + '.hwp', r.bytes);
    }
    var blob = await zip.generateAsync({ type: 'blob' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = _esignSafeName(meta.title || '사건') + '_채운서류.zip';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    var msgs = ['✅ ' + people.length + '명 채워 내려받음'];
    if (Object.keys(unknownAll).length) msgs.push('모르는 표지: ' + Object.keys(unknownAll).join(', '));
    if (relayoutFailN) msgs.push('줄 다시 나누기 실패 ' + relayoutFailN + '건 — 옛 줄 정보로 냄');
    showToast(msgs.join(' · '));
  } catch (e) { showToast(e.message || '채워 내려받기 실패'); }
}

async function previewCaseHwp() {
  try {
    var record = await PureunHwpStore.get('esign-case', curCaseId);
    if (!record) { showToast('먼저 한글 원본을 등록해 주세요'); return; }
    var host = caseHwpModal.querySelector('#caseHwpPreview');
    host.style.display = 'block';
    host.innerHTML = '<div style="padding:24px;color:#64748b">한글 문서를 여는 중…</div>';
    try {
      var opened = await PureunHwp.createEditor('#caseHwpPreview', record.bytes, record.name);
      caseHwpEditor = opened.editor;
    } catch (_) {
      await PureunHwp.renderPreview(host, record.bytes, record.name);
    }
  } catch (e) { showToast(e.message || '문서를 열지 못했습니다'); }
}

async function openCaseHwp() {
  if (!curCaseId) return;
  closeCaseHwp();
  var bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal" style="max-width:920px">'
    + '<div style="display:flex;align-items:center;gap:10px"><h3 style="flex:1">📄 사건 한글 원본</h3><button class="btn btn-sub" id="caseHwpClose">닫기</button></div>'
    + '<div class="hwp-local-note"><b>관리자 전용</b> · 이 파일은 현재 PC의 이 브라우저에만 보관되며 근로자 서명 링크에는 전송되지 않습니다.</div>'
    + '<div id="caseHwpStatus" class="hwp-file-card">불러오는 중…</div>'
    + '<input id="caseHwpInput" type="file" accept=".hwp,.hwpx" hidden>'
    + '<div class="hwp-actions" style="display:flex;flex-wrap:wrap;gap:8px">'
    + '<button class="btn btn-pri" id="caseHwpChoose">HWP/HWPX 등록</button>'
    + '<button class="btn btn-sub" id="caseHwpOpen">열기</button>'
    + '<button class="btn btn-sub" id="caseHwpDownload">원본 다운로드</button>'
    + '<button class="btn btn-danger" id="caseHwpDelete">삭제</button></div>'
    + '<div id="caseHwpTplBox"></div>'
    + '<div id="caseHwpPreview" class="hwp-preview"></div></div>';
  document.body.appendChild(bg);
  caseHwpModal = bg;
  bg.querySelector('#caseHwpClose').onclick = closeCaseHwp;
  bg.onclick = function (e) { if (e.target === bg) closeCaseHwp(); };
  var input = bg.querySelector('#caseHwpInput');
  bg.querySelector('#caseHwpChoose').onclick = function () { input.click(); };
  input.onchange = async function () {
    if (!input.files || !input.files[0]) return;
    try {
      await PureunHwpStore.putFile('esign-case', curCaseId, input.files[0]);
      await refreshCaseHwp();
      showToast('한글 원본을 이 기기에 보관했습니다');
    } catch (e) { showToast(e.message || '한글 원본을 등록하지 못했습니다'); }
    input.value = '';
  };
  bg.querySelector('#caseHwpOpen').onclick = previewCaseHwp;
  bg.querySelector('#caseHwpDownload').onclick = async function () {
    var record = await PureunHwpStore.get('esign-case', curCaseId);
    if (record) PureunHwp.download(record.bytes, record.name, record.format);
  };
  bg.querySelector('#caseHwpDelete').onclick = function () {
    customConfirm('이 기기에 보관된 사건 한글 원본을 삭제할까요?', async function () {
      await PureunHwpStore.remove('esign-case', curCaseId);
      var host = bg.querySelector('#caseHwpPreview'); if (host) { host.style.display = 'none'; host.innerHTML = ''; }
      await refreshCaseHwp();
      showToast('한글 원본을 삭제했습니다');
    });
  };
  try { await refreshCaseHwp(); }
  catch (e) { $('caseHwpStatus').textContent = e.message || '한글 원본 보관함을 열지 못했습니다.'; }
}

// 서류 4종 생성 — 확인(confirmed)된 제출만 (없으면 오류 제외 전체)
async function genDocs() {
  var m = (casesCache[curCaseId] || {}).meta || {};
  var pool = decrypted.filter(function (d) { return d._reviewState === 'confirmed'; });
  if (!pool.length) pool = decrypted.filter(function (d) { return d._reviewState !== 'error'; });
  if (!pool.length) { showToast('생성할 제출이 없습니다'); return; }
  try {
    showToast('서류 생성 중… (' + pool.length + '명)');
    // 최신 체불내역 로드
    var snap = await db.ref('esign/cases/' + curCaseId + '/arrears').once('value');
    arrearsCache = snap.val() || {};
    // ① 개인별 위임장 PDF (전원 1파일, 1인 1페이지)
    await EsignDocs.htmlPagesToPdf(
      pool.map(function (d) { return EsignDocs.buildDelegationHtml(d, m); }),
      (m.title || '사건') + '_위임장.pdf');
    // ② 개인정보 동의서 PDF
    await EsignDocs.htmlPagesToPdf(
      pool.map(function (d) { return EsignDocs.buildConsentHtml(d, m); }),
      (m.title || '사건') + '_개인정보동의서.pdf');
    // ③ 진정인 연명부 XLSX
    EsignDocs.downloadRosterXlsx(pool, m);
    // ④ 체불/체당금 정리 XLSX
    EsignDocs.downloadArrearsXlsx(pool, arrearsCache, m);
    showToast('✅ 서류 4종 다운로드 완료');
  } catch (e) {
    showToast('서류 생성 실패 — 다시 시도해 주세요');
  }
}

// 사건 마감 (신규 제출 차단 — RTDB 규칙의 status==='active' 조건)
function closeCase() {
  customConfirm('사건을 마감할까요?\n마감하면 근로자 링크로 더 이상 제출할 수 없습니다.', function () {
    trackedWrite(db.ref('esign/cases/' + curCaseId + '/meta/status').set('closed')).then(function () {
      /* 목록을 once 로만 받으므로 캐시도 직접 고친다 — 안 고치면 목록으로
         돌아갔을 때 마감했는데도 「진행중」으로 보인다. */
      if (casesCache[curCaseId] && casesCache[curCaseId].meta) casesCache[curCaseId].meta.status = 'closed';
      renderCaseList();
      showToast('사건이 마감되었습니다'); renderDetail();
    }).catch(function () {
      showToast('마감 실패 — 다시 시도해 주세요');
    });
  });
}

// 제출 데이터 파기 (개인정보보호법 파기 의무 — 서류 다운로드 후 실행)
function purgeCase() {
  customConfirm('제출된 개인정보(암호문 포함)를 영구 파기할까요?\n\n⚠ 되돌릴 수 없습니다. 필요한 서류를 먼저 [서류 일괄 생성]으로 내려받았는지 확인하세요.', function () {
    trackedWrite(Promise.all([
      db.ref('esign/cases/' + curCaseId + '/submissions').remove(),
      db.ref('esign/cases/' + curCaseId + '/arrears').remove(),
      db.ref('esign/cases/' + curCaseId + '/meta/status').set('purged')
    ])).then(function () {
      /* 목록을 once 로만 받으므로 캐시도 직접 고친다 — 안 고치면 제출 개수가
         지운 뒤에도 목록에 그대로 남는다. */
      var c = casesCache[curCaseId];
      if (c) {
        if (c.meta) c.meta.status = 'purged';
        delete c.submissions; delete c.arrears;
      }
      renderCaseList();
      showToast('제출 데이터가 파기되었습니다');
      closeDetail();
    }).catch(function () {
      showToast('파기 실패 — 다시 시도해 주세요. 일부만 삭제되었을 수 있습니다');
    });
  });
}

async function openArrears() {
  var snap = await db.ref('esign/cases/' + curCaseId + '/arrears').once('value');
  arrearsCache = snap.val() || {};
  var bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal" style="max-width:760px">'
    + '<h3 style="margin-bottom:4px">체불내역 입력 (원 단위)</h3>'
    + '<div style="font-size:12px;color:#64748b;margin-bottom:10px">엑셀에서 [성명·1개월차·2개월차·3개월차·퇴직금] 열을 복사해 아래 표에 붙여넣기(Ctrl+V)해도 됩니다. 성명으로 매칭합니다.</div>'
    + '<table id="arrTable"><thead><tr><th>성명</th><th>체불임금 1개월차</th><th>2개월차</th><th>3개월차</th><th>체불퇴직금</th></tr></thead><tbody>'
    + decrypted.filter(function (d) { return d._reviewState !== 'error'; }).map(function (d) {
      var a = arrearsCache[d._subId] || {};
      function cell(k) { return '<td><input data-sub="' + d._subId + '" data-k="' + k + '" type="text" inputmode="numeric" style="width:110px;text-align:right" value="' + (a[k] || '') + '"></td>'; }
      return '<tr><td style="font-weight:700">' + EsignDocs.esc(d.name) + '</td>' + cell('month1') + cell('month2') + cell('month3') + cell('severance') + '</tr>';
    }).join('')
    + '</tbody></table>'
    + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">'
    + '<button class="btn btn-sub" id="arrCancel">취소</button>'
    + '<button class="btn btn-pri" id="arrSave">저장</button></div></div>';
  document.body.appendChild(bg);

  // 엑셀 붙여넣기: 첫 열 성명 매칭 (utils.js parseExcelPaste)
  bg.querySelector('#arrTable').addEventListener('paste', function (e) {
    var rows = parseExcelPaste(e.clipboardData.getData('text'));
    if (rows.length < 1 || rows[0].length < 2) return;
    e.preventDefault();
    var byName = {};
    decrypted.forEach(function (d) { byName[d.name] = d._subId; });
    var hit = 0;
    rows.forEach(function (r) {
      var sid = byName[String(r[0]).trim()];
      if (!sid) return;
      ['month1', 'month2', 'month3', 'severance'].forEach(function (k, idx) {
        var inp = bg.querySelector('input[data-sub="' + sid + '"][data-k="' + k + '"]');
        if (inp && r[idx + 1] != null) inp.value = String(r[idx + 1]).replace(/[^0-9]/g, '');
      });
      hit++;
    });
    showToast(hit + '명 매칭되었습니다');
  });

  bg.querySelector('#arrCancel').onclick = function () { bg.remove(); };
  bg.querySelector('#arrSave').onclick = async function () {
    var out = {};
    bg.querySelectorAll('#arrTable input').forEach(function (inp) {
      var sid = inp.dataset.sub, k = inp.dataset.k;
      var v = parseInt(inp.value.replace(/[^0-9]/g, ''), 10) || 0;
      if (!out[sid]) out[sid] = {};
      out[sid][k] = v;
    });
    await trackedWrite(db.ref('esign/cases/' + curCaseId + '/arrears').update(out));
    arrearsCache = out;
    bg.remove();
    showToast('✅ 체불내역이 저장되었습니다');
  };
}
