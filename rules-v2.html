<!-- 취업규칙 새로 짓기 ① — 「📥 모은 자료」 (설계 docs/superpowers/specs/2026-10-03-취업규칙-새로짓기-design.md)
     서버(collectRulesMail)가 매일 새벽 메일함에서 취업규칙 첨부를 골라 «개인정보를 가린 사본만» 담는다.
     이 화면은 그것을 보고, 사람이 사업장을 잇고 회차마다 ★최종본을 정한다.
     ⚠ 옛 규정관리(rules.html)와 «나란히» 둔다 — 옛 앱의 자리는 건드리지 않는다.
     2026-10-04 두 앱 합치기 — 포털 타일은 「취업규칙」(rules.html) 하나다. 이 화면은 그 앱의
     📚 조별 문안(#topics)·📥 모은 자료(#lib) 갈래이고, 머리줄 갈래 단추로 들어온다.
     2026-10-04 ③-ⓐⓑ 「🏢 사업장」(#sites) 갈래를 더했다 — 빈 주소의 첫 화면이 이것이다(목업 「추천대로」). -->

     rulesv2 는 LEGACY_OBSERVE_PROGRAMS 에 없어 표시와 상관없이 «강제»로 돈다(runtimeMode). -->

<script>
/* 화면 가르기 — 주소가 #topics 면 「📚 조별 문안」, #lib 면 「📥 모은 자료」, 그 밖(빈 것·#sites)은 「🏢 사업장」.
   ⚠ 이 손잡이는 pu-back.js «앞»에 단다 — 뒤로가기(popstate)를 공통 층보다 먼저 받아야
     「이 걸음은 우리 화면 바꾸기였다」는 깃발(__puBackNav)을 세울 수 있다.
     안 세우면 공통 층이 「열린 층 없음」으로 읽고 앱을 통째로 나간다.
   ⚠ 깃발은 «화면이 실제로 바뀔 때만» 세운다 — 조건 없이 세우면 앱을 영영 못 나간다. */
window.RV2_MODE = function (h) { h = String(h || ''); return h === '#topics' ? 'topics' : h === '#lib' ? 'lib' : 'sites'; };
window.addEventListener('popstate', function () {
  if (window.__rv2Mode && window.RV2_MODE(location.hash) !== window.__rv2Mode) window.__puBackNav = true;
  if (window.rv2Route) window.rv2Route();
});
window.addEventListener('hashchange', function () { if (window.rv2Route) window.rv2Route(); });
</script>

  window.__rv2Mode = mode;
  $sites.style.display = mode === 'sites' ? '' : 'none';
  $lib.style.display = mode === 'lib' ? '' : 'none';
  $topics.style.display = mode === 'topics' ? '' : 'none';
  if (S && mode !== 'topics' && mode !== was) draw();
  /* 갈래 단추의 켜짐 — 이 파일 안 갈래(🏢·📚·📥)만 켤 수 있다. ✏️ 는 rules.html 에서만 켜진다 */
  document.querySelectorAll('.top .rmode a').forEach(function (a) {
    var on = a.getAttribute('href') === 'rules-v2.html#' + mode;
    a.classList.toggle('on', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (mode === 'topics' && S && topicsCtl) topicsCtl.enter();   // 📥 에서 저장한 게 있으면 새로 셈한다(없으면 그대로)
  if (mode === 'topics' && S && !topicsCtl) {
    topicsCtl = PuRulesV2TopicsView.mount($topics, { S: S, cache: PuRulesV2TextCache.make(window.indexedDB),
      companies: ST.companies, stdText: (window.STD_2026 || {}).text || '', loadFix: FIX_LOAD });
  }
}
window.rv2Route = rv2Route;
/* 갈래 단추를 누르면 같은 창에서 주소만 바꾼다(pushState — 뒤로가기로 돌아온다).
   ⚠ 주소창 글자 이동(<a href="#…"> 그대로)은 popstate 를 쏘아 공통 뒤로가기 층이 앱을 나가려 든다.
   ⚠ ✏️ 검토·개정(rules.html)은 다른 파일이다 — 가로채지 않고 그냥 간다(같은 창, 기록 한 걸음). */
var RV2_SELF = 'rules-v2.html#';
document.querySelector('.top .rmode').addEventListener('click', function (ev) {
  var a = ev.target.closest && ev.target.closest('a[href]');
  if (!a || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.button) return;
  var href = a.getAttribute('href');
  if (href.indexOf(RV2_SELF) !== 0) return;
  ev.preventDefault();
  var hash = href.slice(RV2_SELF.length - 1);
  if (window.RV2_MODE(hash) !== window.__rv2Mode) history.pushState(null, '', hash);
  rv2Route();
});
rv2Route();

function boot(store, o) {
  S = store; ST.isAdmin = o.isAdmin; ST.companies = o.companies;
  reload().catch(function (e) { libMsg('모은 자료를 못 읽었습니다: ' + ((e && e.message) || e)); });
  rv2Route();
}

try {
  firebase.initializeApp(FB_CONFIG);
  firebase.auth().onAuthStateChanged(function (u) {
    if (!u) { PuGate.show(); return; }
    var db = firebase.database();
    db.ref('uid_roles/' + u.uid).once('value').then(function (s) {
      var role = s.val() || {};
      var gw = PuOntologyWrite.createGateway({ mode: 'enforce', actor: role.sid || u.uid });
      return db.ref('data/companies').once('value').then(function (c) {
        /* ⚠ 업체는 id 로 «고른다» — 이름은 거르는 데만 쓴다 */
        var list = PuRulesV2Lib.companyList(c.val());
        /* 사람이 고친 조문 연결(규정관리 rules.html 의 MFIX 와 같은 자리) — 조별 문안의 위반 판정에 넘긴다.
           못 읽으면 교정 없이 판정한다(화면을 막지 않는다). */
        FIX_LOAD = function () {
          return db.ref('rules_mgmt/matchfix').once('value').then(function (s) { return s.val() || {}; }, function () { return {}; });
        };
        var store = PuRulesV2Store.make({ db: db, gateway: gw, companies: function () { return list; },
          actor: function () { return role.sid || u.uid; }, now: function () { return Date.now(); } });
        boot(store, { isAdmin: role.isAdmin === true, companies: list });
      });
    }).catch(function (e) { libMsg('시작하지 못했습니다: ' + ((e && e.message) || e)); });
  });
} catch (e) {
  libMsg('초기화 실패: ' + e.message);
}
</script>

try { PuWhoami.mount('#whoslot'); } catch (e) {}</script>
