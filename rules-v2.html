<!-- 취업규칙 새로 짓기 ① — 「📥 모은 자료」 (설계 docs/superpowers/specs/2026-10-03-취업규칙-새로짓기-design.md)
     서버(collectRulesMail)가 매일 새벽 메일함에서 취업규칙 첨부를 골라 «개인정보를 가린 사본만» 담는다.
     이 화면은 그것을 보고, 사람이 사업장을 잇고 회차마다 ★최종본을 정한다.
     ⚠ 옛 규정관리(rules.html)와 «나란히» 둔다 — 옛 앱의 자리는 건드리지 않는다.
     2026-10-04 두 앱 합치기 — 포털 타일은 「취업규칙」(rules.html) 하나다. 이 화면은 그 앱의
     📚 조별 문안(#topics)·📥 모은 자료(#lib) 갈래이고, 머리줄 갈래 단추로 들어온다.
     2026-10-04 ③-ⓐⓑ 「🏢 사업장」(#sites) 갈래를 더했다 — 빈 주소의 첫 화면이 이것이다(목업 「추천대로」). -->

     rulesv2 는 LEGACY_OBSERVE_PROGRAMS 에 없어 표시와 상관없이 «강제»로 돈다(runtimeMode). -->

<script>
/* 화면 가르기 — 주소가 #topics 면 「📚 조별 문안」, #lib 면 「📥 모은 자료」, 그 밖(빈 것·#sites)은 「🏢 사업장」.
   ⚠ 이 손잡이는 pu-back.js «앞»에 단다 — 뒤로가기(popstate)를 공통 층보다 먼저 받아야
     「이 걸음은 우리 화면 바꾸기였다」는 깃발(__puBackNav)을 세울 수 있다.
     안 세우면 공통 층이 「열린 층 없음」으로 읽고 앱을 통째로 나간다.
   ⚠ 깃발은 «화면이 실제로 바뀔 때만» 세운다 — 조건 없이 세우면 앱을 영영 못 나간다. */
window.RV2_MODE = function (h) { h = String(h || ''); return h === '#topics' ? 'topics' : h === '#lib' ? 'lib' : 'sites'; };
window.addEventListener('popstate', function () {
  if (window.__rv2Mode && window.RV2_MODE(location.hash) !== window.__rv2Mode) window.__puBackNav = true;
  if (window.rv2Route) window.rv2Route();
});
window.addEventListener('hashchange', function () { if (window.rv2Route) window.rv2Route(); });
</script>

<script src="js/rules-v2/lib-daily.js?v=1"></script>

   칩 글자를 줄이고(「취업규칙」은 이 앱 이름이라 뺐다 — view-sites.js) 안쪽 여백을 줄여 412px 에서 칩 셋이 한 줄,
   담당·찾기·↻ 가 한 줄 — 거르개 네 줄(150px)이 두 줄(73px)이 된다. 글씨 크기는 줄이지 않는다 */

/* ── 폰(900px 이하) 🏢 사업장 — 표를 «두 줄 카드»로 (폰화면관리 2026-10-18) ──
   ⚠ 표가 min-width:800px 이라, 폰에서는 다른 칸 폭을 다 빼고 남은 «사업장» 칸이 46px 남짓이었다 —
     머리는 「사···」, 이름은 「(주…」 로만 보였다. 가장 중요한 칸이 가장 좁았다.
   ⚠ 줄을 누르면 이력이 표 «아래»(최대 50줄 뒤)에 그려져, 폰에서는 눌러도 아무 일이 없는 것처럼 보였다.
   처방(PC 는 그대로):
     · 줄 = 두 줄 카드 — 1줄 번호·사업장·취업규칙 자료 / 2줄 최근·★최종본·담당·규모·업태(작은 글씨, 넘치면 …).
       2줄 칸은 «바탕 0 + 내용 폭까지만 자람»(flex:1 1 0 · max-width:max-content)이라 자리가 모자라도 셋째 줄로 안 접힌다.
       「—」만 든 칸(말 없는 값)은 안 그린다. 「✓ 이 회사 자료 맞음」은 판에서 누른다 — 근거(후보 자료)를 보고 누르는 자리다.
     · 머리줄(거르기·순서 단추)은 옆으로 미는 한 줄.
     · 고른 사업장의 이력은 화면을 덮는 판으로 — 「← 목록」·폰 뒤로가기로 닫는다(목록은 보던 자리 그대로).
     · 바깥 상자 좌우 여백 22px → 6px (360px 폰에서 44px 이 그냥 빈자리였다). */
@media (max-width:900px){
  /* 양옆 빈자리 (대표 지시 2026-10-18 「양옆 빈공백이 많다 … 좌우 옆공간 모두 채워서」) —
     회색 바탕 위 바깥 상자(여백·테두리·둥근 모서리) 안에 흰 줄·흰 카드가 또 겹쳐, 사업장 이름이 화면 끝에서 45px 안쪽에서 시작했다.
     폰에서는 바깥 상자를 «없는 셈»으로(여백·테두리·바탕 0) 두고, 안쪽 띠·줄이 화면 폭 그대로 한 겹이 된다. 글은 화면 끝에서 8~10px. */
  #lib,#topics,#sites{margin:0 0 16px;border:0;border-radius:0;background:transparent}
  #sites .stbl{overflow-x:visible}
  #sites .sites{min-width:0;display:block}
  #sites .sites colgroup{display:none}
  #sites .sites thead{display:block}
  #sites .sites thead tr{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:#f8fafc;border-bottom:1px solid #e2e8f0;scrollbar-width:none}
  #sites .sites thead tr::-webkit-scrollbar{display:none}
  #sites .sites thead th{display:block;flex:none;padding:0;border:0;background:none}
  /* 머리 ☐(보이는 줄 모두)는 칸 거르기 칩 줄의 맨 앞 칩으로 · # 머리는 숨긴다 */
  #sites .sites thead th:nth-child(2){display:none}
  #sites .sites thead th.pk label{height:32px;padding:0 11px 0 8px;border:1px solid #cbd5e1;border-radius:16px;background:#ffffff;white-space:nowrap;gap:4px}
  #sites .sites thead th.pk .pk-t{display:inline}
  #sites th.ch .h{height:32px;border:1px solid #cbd5e1;border-radius:16px;background:#ffffff;padding:0 11px}
  #sites .sites tbody{display:block}
  #sites .sites tbody tr{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;padding:8px 10px 8px 4px;border-bottom:1px solid #e2e8f0;background:#ffffff}
  #sites .sites tbody tr.sel{background:#eff6ff}
  #sites .sites tbody tr::after{content:'';order:4;flex-basis:100%;height:0}
  #sites .sites td{display:block;padding:0;border:0;background:none;min-width:0}
  #sites .sites tr.sel td{background:none}
  /* 1줄 ☐ · № · 사업장 · 취업규칙 자료 / 2줄 최근 · ★최종본 · 담당 · 규모 · 업태 (☐ 칸이 맨 앞이라 칸 번호가 하나씩 밀렸다) */
  #sites .sites tbody tr.ck{background:#eff6ff}
  #sites .sites tr.ck td{background:none}
  #sites .sites td:nth-child(1){order:0;flex:0 0 30px}
  #sites .sites td.pk label{min-height:30px}
  #sites .sites td.pk input{width:22px;height:22px;margin:0}
  #sites .sites td:nth-child(2){order:1;flex:0 0 22px}
  #sites .sites td:nth-child(3){order:2;flex:1 1 0}
  #sites .sites td:nth-child(7){order:3;flex:none}
  #sites .sites td:nth-child(7) .btn{display:none}
  #sites .sites td:nth-child(n+4):not(:nth-child(7)){flex:1 1 0;max-width:max-content;font-size:12px;color:#475569}
  #sites .sites td:nth-child(8){order:5;margin-left:68px}
  #sites .sites td:nth-child(9){order:6}
  #sites .sites td:nth-child(6){order:7}
  #sites .sites td:nth-child(4){order:8}
  #sites .sites td:nth-child(5){order:9}
  #sites .sites td:is(:nth-child(4),:nth-child(5),:nth-child(6),:nth-child(9)):has(> .k.none:only-child){display:none}
  #sites .sites td.empty{flex:1 1 100%;padding:30px 10px;white-space:normal}
  #sites .sside.empty{display:none}
  #sites .sside:not(.empty){position:fixed;inset:0;z-index:40;overflow-y:auto;overscroll-behavior:contain;padding:10px 10px 40px}
  #sites .sside .sback{display:inline-flex;align-items:center;min-height:36px;margin-bottom:4px;font-weight:700}
  /* 찾기칸 옆에 「새로고침」 — 찾기칸이 한 줄을 통째로 먹어 새로고침이 넷째 줄로 혼자 내려갔다 */
  #sites .flt .q{width:auto;flex:1 1 160px;min-width:0}
  /* 머리줄 로그인 이름은 한 줄 — 「점검대표 / admin · P- / 001」 석 줄로 쌓여 머리줄이 64px 이 됐다 */
  .top .r{min-width:0;flex:0 1 auto}
  .top #whoslot{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* ── 📥 모은 자료 ──
     · 맨 위 요약은 간격만 줄인다(다섯 줄 → 셋).
     · 거르개(보기 셋·갈래 칩 여섯·딱지 넷·찾기)는 «옆으로 미는 한 줄» — 여섯 줄(약 200px)이 첫 화면을 먹었다. 찾기칸을 맨 앞에 둔다.
     · 메일 순 표(.lmail)는 두 줄 카드 — 1줄 ☐·번호·갈래·파일 / 2줄 사업장·판·최종본·상태·가린 것.
       사업장·판·최종본이 화면 밖(옆으로 밀어야 보임)에 있었다. 메일 머리 줄은 한 줄(제목만 …).
     · ☐ 는 손가락 크기(15px → 24px). 머리 ☐(보이는 것 모두 고르기)는 그대로 둔다. */
  #lib .run{gap:4px 12px;padding:8px 10px}
  #lib>.flt{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:8px 10px}
  #lib>.flt::-webkit-scrollbar{display:none}
  #lib>.flt>*{flex:none}
  #lib>.flt .q{order:-1;width:150px;margin-left:0}
  #lib .lmail{min-width:0;display:block}
  #lib .lmail colgroup{display:none}
  #lib .lmail thead,#lib .lmail tbody{display:block}
  #lib .lmail tr{display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;padding:6px 10px 6px 0;border-bottom:1px solid #e2e8f0;background:#ffffff}
  #lib .lmail td,#lib .lmail th{display:block;padding:0;border:0;background:none;min-width:0}
  #lib .lmail thead tr{background:#f8fafc}
  #lib .lmail th:nth-child(n+5){display:none}
  #lib .lmail tr.ck{background:#eff6ff}#lib .lmail tr.hold{background:#fffbeb}#lib .lmail tr.fin{background:#f0fdf4}
  #lib .lmail tr.ck td,#lib .lmail tr.hold td,#lib .lmail tr.fin td{background:none}
  #lib .lmail input[type=checkbox]{width:24px;height:24px}
  #lib .lmail tbody tr:not(.mail)::after{content:'';order:4;flex-basis:100%;height:0}
  #lib .lmail td:nth-child(1),#lib .lmail th:nth-child(1){order:1;flex:0 0 40px;text-align:center}
  #lib .lmail td:nth-child(2),#lib .lmail th:nth-child(2){order:2;flex:none;min-width:22px}
  #lib .lmail td:nth-child(3),#lib .lmail th:nth-child(3){order:3;flex:none}
  #lib .lmail td:nth-child(4),#lib .lmail th:nth-child(4){order:3;flex:1 1 0}
  #lib .lmail td:nth-child(n+5){order:5;flex:1 1 0;max-width:max-content;font-size:12px;color:#475569}
  #lib .lmail td:nth-child(5){margin-left:46px}
  #lib .lmail td:nth-child(9){order:6}
  #lib .lmail td.fin0,#lib .lmail td.pii:has(> .none:only-child){display:none}
  #lib .lmail tr.mail{padding:5px 10px;background:#f8fafc}
  #lib .lmail tr.mail td:first-child{display:none}
  #lib .lmail tr.mail td:last-child{flex:1 1 100%;display:flex;align-items:center;gap:4px;white-space:nowrap;margin-left:0;max-width:none}
  #lib .lmail tr.mail td:last-child b{min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
  #lib .lmail tr.mail td:last-child .btn{flex:none;margin-left:auto}
  #lib .lmail td.empty{flex:1 1 100%;padding:30px 10px;white-space:normal;max-width:none;margin-left:0}
  /* 📚 조별 문안 — 문안 카드가 바깥 상자·본문 칸(좌우 22px) 안에 또 둥근 카드(14px)로 앉아 글이 44px 안쪽이었다.
     폰에서는 본문 칸을 흰 띠 하나로 펴고, 카드는 옆 테두리·둥근 모서리·바탕을 걷어 위아래 선으로만 가른다(한 겹) */

/* 창 안 목록(.cpop .list)은 다시 그리면 맨 위로 돌아간다 — 체크·찾기 때 읽던 자리를 지킨다 */

function reload() {

/* 「앞 판과 달라진 조」 — 두 판의 가린 글을 읽어 조 단위로 견준다(두 파일 견주기와 같은 부품) */
function diffOf(id, prev) {

    var r = PuRulesFileCmp.compare(PuRulesV2Lib.parseArticles(t[0]), PuRulesV2Lib.parseArticles(t[1]));

/* ── 🧹 정리하기 (설계 §10) — 셈은 PuRulesV2Tidy, 그리기는 PuRulesV2TidyView ── */
function T() { return PuRulesV2TidyView.ensure(ST); }
function tGroups() { return PuRulesV2Tidy.groups(ST.data, ST.companies); }
function tRounds() { return PuRulesV2Tidy.rounds(ST.data); }
function tGroup(key) { return tGroups().filter(function (g) { return g.key === key; })[0]; }
function tRound(rid) { return tRounds().filter(function (r) { return r.roundId === rid; })[0]; }
/* 보이는 것만 — 찾기 칸에 걸러진 것 (일괄은 «보이는» 것에만) */
function tVisible(list, parts) {
  var q = String(T().q || '').trim().toLowerCase();
  return list.filter(function (x) { return !q || parts(x).join(' ').toLowerCase().indexOf(q) >= 0; });
}
function tVisGroups() {

}
function tVisRounds() { return tVisible(tRounds(), function (r) { return [PuRulesV2TidyView.coName(ST, r.companyId), r.roundKey]; }); }
/* 진행 글 — 문서 한 건마다 화면 전체를 다시 그리지 않고 «바쁨» 줄 글만 바꾼다(줄이 없을 때만 다시 그린다) */
function tProgress(t) {
  ST.busy = t;
  var b = $lib.querySelector('.busy');
  if (b) b.textContent = t; else draw();
}
/* 일괄이 중간에 멈췄을 때의 알림 — 저장소가 말하는 «n/m건»은 묶음 하나 몫이라, 일괄 «전체» 기준으로 다시 쓴다 */
function tStopped(done, total, e) {
  var why = String((e && e.message) || e).replace(/^\d+\/\d+건 저장한 뒤 멈춤 — /, '');
  return new Error(done + '/' + total + '건 저장한 뒤 멈춤 — ' + why);
}
/* 여러 묶음을 차례로 잇는다 — 진행은 «서류» 수로. 멈추면 «저장된 만큼»을 되돌리기 줄에 남긴다 */
function tLinkMany(list, label) {
  var total = 0, saved = [];
  list.forEach(function (x) { total += x.ids.length; });
  var p = list.reduce(function (p, x) {
    return p.then(function () {
      return S.linkCompany(x.ids, x.co, function (n) { saved.push(x.ids[n - 1]); tProgress('사업장을 잇는 중… ' + saved.length + '/' + total); });
    });
  }, Promise.resolve()).catch(function (e) { throw tStopped(saved.length, total, e); });
  return busy('사업장을 잇는 중… 0/' + total, p).then(function () {
    T().last = { kind: 'link', label: label, ids: saved, rounds: [] }; T().picked.clear(); return reload();
  }, function () {
    T().last = saved.length ? { kind: 'link', label: label + ' (일부)', ids: saved, rounds: [] } : null;
    return reload();
  });
}
function tFinalMany(list, label) {
  var saved = [];
  var p = list.reduce(function (p, r) {
    return p.then(function () {
      return S.setFinal(r.companyId, r.roundKey, r.docId).then(function () {
        saved.push({ co: r.companyId, rk: r.roundKey, what: 'final' });
        tProgress('★ 정하는 중… ' + saved.length + '/' + list.length);
      });
    });
  }, Promise.resolve()).catch(function (e) { throw tStopped(saved.length, list.length, e); });
  return busy('★ 정하는 중… 0/' + list.length, p).then(function () {
    T().last = { kind: 'final', label: label, ids: [], rounds: saved };
    T().picked.clear(); return reload();
  }, function () {
    T().last = saved.length ? { kind: 'final', label: label + ' (일부)', ids: [], rounds: saved } : null;
    return reload();
  });
}
/* 「사업장 없음」으로 두기 — 멈추면 저장된 만큼만 되돌리기 줄에 남긴다 */
function tNoneMany(ids, label) {
  var saved = [];
  var p = S.notRequired(ids, function (n) { saved.push(ids[n - 1]); tProgress('사업장 없음으로 두는 중… ' + saved.length + '/' + ids.length); })
    .catch(function (e) { throw tStopped(saved.length, ids.length, e); });
  return busy('사업장 없음으로 두는 중…', p).then(function () {
    T().last = { kind: 'none', label: label, ids: saved, rounds: [] }; T().picked.clear(); return reload();
  }, function () {
    T().last = saved.length ? { kind: 'none', label: label + ' (일부)', ids: saved, rounds: [] } : null;
    return reload();
  });
}
/* 🤖 고른 줄 가운데 조건에 맞는 것 — «보이는» 줄만(걸러져 안 보이는 줄은 고르지 않는다) */
function dPicked(ok) {
  var M = PuRulesV2DailyView.model(ST), t = PuRulesV2DailyView.ensure(ST);

/* 🤖 자동 확정 되돌리기 — 건수를 묻고 한 건씩(🧹 와 같은 길). 멈추면 «몇 건 했는지»를 알린다 */
function dUndo(ids) {
  if (!ids.length) return;
  if (!confirm('자동 확정 ' + ids.length + '건을 «미확정»으로 돌립니다.\n이 서류들의 주소는 앞으로 자동 확정하지 않습니다(사람이 정합니다).')) return;
  busy('되돌리는 중… 0/' + ids.length, S.undoAuto(ids, function (n) { tProgress('되돌리는 중… ' + n + '/' + ids.length); }))

    var ok = picked.filter(function (g) { return g.pre; }), skip = picked.length - ok.length;
    if (!ok.length) { alert('골라 둔 후보가 있는 묶음이 없습니다 — 줄마다 회사를 골라 주세요.'); return; }
    var n = 0; ok.forEach(function (g) { n += g.ids.length; });
    if (!confirm(ok.length + '묶음 · 서류 ' + n + '건을 골라 둔 회사로 확정합니다.' + (skip ? '\n(후보가 없는 ' + skip + '묶음은 건너뜁니다)' : ''))) return;
    tLinkMany(ok.map(function (g) { return { ids: g.ids, co: g.pre }; }), '고른 ' + ok.length + '묶음');
  },
  tidyBulkNone: function () {
    var picked = tVisGroups().filter(function (g) { return T().picked.has(g.key); });
    var ids = []; picked.forEach(function (g) { ids = ids.concat(g.ids); });
    if (!ids.length || !confirm(picked.length + '묶음 · 서류 ' + ids.length + '건을 «사업장 없음»으로 둡니다.')) return;
    tNoneMany(ids, '고른 ' + picked.length + '묶음');
  },
  tidyUnpick: function () { T().picked.clear(); draw(); },
  /* 되돌리기 — 방금 한 일만. 서류는 다시 미확정(pending), 회차는 최종본·「없음」을 푼다 */
  tidyUndo: function () {
    var l = T().last; if (!l) return;
    var p = l.ids.length ? S.unlink(l.ids) : Promise.resolve();
    (l.rounds || []).forEach(function (r) {
      p = p.then(function () { return r.what === 'noFinal' ? S.setNoFinal(r.co, r.rk, false) : S.setFinal(r.co, r.rk, null); });
    });
    busy('되돌리는 중…', p).then(function () { T().last = null; return reload(); }, function () { return reload(); });
  },
  tidyVer: function (rid, id) { T().ver[rid] = id; draw(); },
  tidyFinal: function (d) {
    var r = tRound(d.rid); if (!r) return;
    tFinalMany([{ companyId: r.companyId, roundKey: r.roundKey, docId: T().ver[r.roundId] || r.pre }], PuRulesV2TidyView.coName(ST, r.companyId));
  },
  tidyNoFinal: function (d) {
    var r = tRound(d.rid); if (!r) return;
    busy('「최종본 없음」으로 두는 중…', S.setNoFinal(r.companyId, r.roundKey, true)).then(function () {
      T().last = { kind: 'final', label: PuRulesV2TidyView.coName(ST, r.companyId) + ' 최종본 없음', ids: [], rounds: [{ co: r.companyId, rk: r.roundKey, what: 'noFinal' }] };
      return reload();
    }, function () { return reload(); });
  },
  tidyBandFinal: function () {
    // 줄에서 직접 다른 판을 고른 회차는 띠가 덮어쓰지 않는다 — 띠 글과 같은 셈(bandRounds)
    var bd = PuRulesV2TidyView.bandRounds(ST, tVisRounds()), list = bd.ok;
    if (!list.length || !confirm('신고서 메일 바로 앞 판이 있는 ' + list.length + '회차를 그 판으로 ★ 정합니다.'
      + (bd.skipped ? '\n(직접 고른 ' + bd.skipped + '회차는 빼고)' : ''))) return;
    tFinalMany(list.map(function (r) { return { companyId: r.companyId, roundKey: r.roundKey, docId: r.pre }; }), '신고서 앞 판 ' + list.length + '회차');
  },
  tidyBulkFinal: function () {
    var list = tVisRounds().filter(function (r) { return T().picked.has(r.roundId); });
    if (!list.length || !confirm('고른 ' + list.length + '회차를 골라 둔 판으로 ★ 정합니다.')) return;
    tFinalMany(list.map(function (r) { return { companyId: r.companyId, roundKey: r.roundKey, docId: T().ver[r.roundId] || r.pre }; }), '고른 ' + list.length + '회차');
  },
  /* ── 🏢 사업장 ── */
  siteF: function (d) { ST.sites.f = d.f === 'wait' || d.f === 'all' ? d.f : 'has'; ST.sites.page = 1; draw(); },
  sq: function (v) {
    /* 값은 바로 상태에 넣는다(다른 일로 다시 그려도 낡은 글이 안 보이게). 다시 그리는 것만 미룬다 —
       한글 조합 중($sites.__pdComposing)에는 그리지 않고, 조합이 끝나면 뷰가 한 번 더 부른다 */
    ST.sites.q = v; ST.sites.page = 1;
    clearTimeout(qTimer);
    qTimer = setTimeout(function () {
      if ($sites.__pdComposing) return;
      draw();
      var q = $sites.querySelector(ST.sites.pop === 'name' ? '.cpop [data-role="sq"]' : '[data-role="sq"]'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    }, 200);
  },
  siteSel: function (d) { ST.sites.sel = d.co || ''; draw(); },
  sm: function (v) { ST.sites.who = String(v || ''); ST.sites.page = 1; draw(); },
  /* 머리줄 거르기·순서·쪽 (설계 §12) — 조건이 바뀌면 1쪽으로. siteSel(고르기)·reload() 는 쪽을 안 건드린다(그리는 쪽이 없는 쪽을 당긴다) */
  colOpen: function (d, ev) {
    var s = ST.sites, key = d.key;
    if (s.pop === key) { s.pop = ''; draw(); return; }
    var b = ev && ev.target && ev.target.closest && ev.target.closest('button'), r = b && b.getBoundingClientRect();
    s.pop = key; s.popq = '';
    s.popPos = r ? { x: Math.max(8, Math.min(r.left, (window.innerWidth || 1200) - 250)), y: Math.max(8, Math.min(r.bottom + 2, (window.innerHeight || 800) - 300)) } : { x: 40, y: 140 };
    draw();
  },
  colClose: function () { ST.sites.pop = ''; ST.sites.popq = ''; draw(); },   // 늘 다시 그린다 — render 가 «열려 있을 때만» 부른다
  colSort: function (d) {
    var s = ST.sites, sk = PuRulesV2SiteCols.SORT_OF[d.key], dir = d.dir === 'desc' ? 'desc' : 'asc';
    if (!sk) return;   // 순서 열쇠가 없는 칸 — 아무 일도 하지 않는다
    s.sort = s.sort && s.sort.key === sk && s.sort.dir === dir ? null : { key: sk, dir: dir };
    s.page = 1; draw();
  },
  colToggle: function (key, v, on) {
    var s = ST.sites, a = (s.cols[key] || []).slice(), i = a.indexOf(v);
    if (on && i < 0) a.push(v); else if (!on && i >= 0) a.splice(i, 1);
    if (a.length) s.cols[key] = a; else delete s.cols[key];
    s.page = 1; drawKeepList();
  },
  colClear: function (d) {
    var s = ST.sites;
    if (d.key === 'name') s.q = ''; else if (d.key === 'who') s.who = ''; else delete s.cols[d.key];
    s.page = 1; draw();
  },
  colsClear: function () { ST.sites.cols = {}; ST.sites.page = 1; draw(); },
  colWho: function (d) { ST.sites.who = String(d.v || ''); ST.sites.page = 1; draw(); },
  colq: function (v) {
    ST.sites.popq = v;   // 상태는 바로, 그리기는 미룬다(sq 와 같은 방식 — 조합 중에는 그리지 않는다)
    clearTimeout(cqTimer);
    cqTimer = setTimeout(function () {
      if ($sites.__pdComposing || !ST.sites.pop) return;
      drawKeepList();
      var q = $sites.querySelector('[data-role="colq"]'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    }, 250);
  },
  pageGo: function (d) {
    var p = Number(d.p); if (!(p >= 1)) return;
    ST.sites.page = p; draw();
    var t = $sites.querySelector('.stbl'); if (t) t.scrollTop = 0;
    var w = $sites.querySelector('.swrap'); if (w && w.scrollIntoView && w.getBoundingClientRect().top < 0) w.scrollIntoView();
  },
  /* ☐ 고르기 — 고르기만으로는 아무것도 안 바뀐다(위에 「N곳 골랐습니다」 띠만 뜬다) */
  sitePick: function (id, on) { if (on) ST.sites.picked.add(id); else ST.sites.picked.delete(id); draw(); },
  // 머리 ☐ — «지금 보이는 줄»(이 쪽에 그려진 ☐)만. 다른 쪽·걸러진 줄은 건드리지 않는다
  sitePickAll: function (on) {
    $sites.querySelectorAll('input[data-pick]').forEach(function (c) { if (on) ST.sites.picked.add(c.dataset.pick); else ST.sites.picked.delete(c.dataset.pick); });
    draw();
  },
  siteUnpick: function () { ST.sites.picked.clear(); draw(); },
  /* ☐ 일괄 «자료 맞음» — 고른 곳 가운데 후보가 있는 곳만, 각 사업장의 열린 후보 전부를 그 업체 id 로 잇는다(한 곳 단추 siteLink 와 같은 일).
     ⚠ 건수를 먼저 묻는다 · 쓰기 전에 업체 id 를 «전부» 먼저 검사한다(하나라도 틀리면 아무것도 안 쓴다).
     ⚠ 저장은 관문(gateway.save, revision 트랜잭션)으로 한 건씩 — 🧹 정리하기의 tLinkMany 를 그대로 탄다
       (진행 n/m · 멈추면 «몇 건 저장했는지» 알림 · 📥 → 🧹 정리하기 「방금 한 일」에서 되돌리기). */
  siteBulkLink: function () {
    var rows = PuRulesV2Sites.model(ST.data, ST.companies).filter(function (r) { return ST.sites.picked.has(r.id) && r.cand > 0; });
    if (!rows.length) return;
    var docs = 0, mails = 0, skip = ST.sites.picked.size - rows.length;
    rows.forEach(function (r) { docs += r.cand; mails += r.candMails; });
    var bad = rows.filter(function (r) { return !PuOntology.validateCompanyLink({ companyId: r.id }, ST.companies).ok; });
    if (bad.length) { alert('업체관리에서 찾을 수 없는 사업장이 있어 아무것도 확정하지 않았습니다: ' + bad.map(function (r) { return r.name; }).join(', ')); return; }
    if (!confirm(rows.length + '곳 · 후보 ' + docs + '건(메일 ' + mails + '통)을 각 사업장 자료로 확정합니다.'
      + (skip ? '\n(후보가 없는 ' + skip + '곳은 건너뜁니다)' : ''))) return;
    tLinkMany(rows.map(function (r) { return { ids: r.candIds, co: r.id }; }), '🏢 고른 ' + rows.length + '곳').then(function () {
      // 다 된 곳은 후보가 0 이 되어 빠지고, 멈춰서 남은 곳만 골라진 채로 둔다(다시 누르면 이어서)
      var left = {}; PuRulesV2Sites.model(ST.data, ST.companies).forEach(function (r) { if (r.cand > 0) left[r.id] = 1; });
      ST.sites.picked.forEach(function (id) { if (!left[id]) ST.sites.picked.delete(id); });
      draw();
    });
  },
  /* 후보를 한 번에 확정 — 그 사업장의 열린 후보 «전부»(메일 단위로 모인 것)를 이 업체 id 로 잇는다 */
  siteLink: function (d) {
    var row = siteRow(d.co);
    if (!row || !row.cand) return;
    if (!confirm(row.name + ' 자료로 ' + row.cand + '건(메일 ' + row.candMails + '통) 확정합니다.')) return;
    busy('사업장을 잇는 중…', S.linkCompany(row.candIds, row.id)).then(reload);
  },
  /* 개정 시작 — 같은 창에서 검토·개정(rules.html)으로. 그쪽이 메일 원본을 받아 지문을 맞춰 본 뒤 연다 */
  siteStart: function (d) {
    location.href = 'rules.html#open=' + encodeURIComponent(d.id) + (d.nf === '1' ? '&nf=1' : '');
  },
  siteUpload: function (d) {
    location.href = 'rules.html#co=' + encodeURIComponent(d.co);
  },
  /* 서류 한 건을 📥 모은 자료에서 — 갈래를 바꾸고(뒤로가기로 🏢 에 돌아온다) 그 줄의 오른쪽 칸을 연다 */
  siteDoc: function (d) {
    history.pushState(null, '', '#lib'); rv2Route(); openSide(d.id);
  }
};

/* ── 세 화면 가르기 (손잡이는 머리의 RV2_MODE·popstate 와 짝) ──
   「📚 조별 문안」은 처음 열 때 한 번만 꽂는다 — 글을 받고 모델을 셈하는 일은 그때 한 번뿐이다.
   🏢·📥 는 draw() 가 «보이는 쪽»만 그리므로, 갈래가 바뀌면 새로 보이는 쪽을 여기서 그린다. */
var $topics = document.getElementById('topics'), topicsCtl = null, FIX_LOAD = null;
function rv2Route() {
  var mode = window.RV2_MODE(location.hash), was = window.__rv2Mode;
  window.__rv2Mode = mode;
  // 화면을 떠나면 고른 것을 비운다 — 돌아왔을 때 모르는 것이 골라져 있으면 안 된다(CLAUDE.md ☐ 규칙)
  if (mode !== 'sites' && ST.sites.picked) ST.sites.picked.clear();
  $sites.style.display = mode === 'sites' ? '' : 'none';
  $lib.style.display = mode === 'lib' ? '' : 'none';
  $topics.style.display = mode === 'topics' ? '' : 'none';
  if (S && mode !== 'topics' && mode !== was) draw();
  /* 갈래 단추의 켜짐 — 이 파일 안 갈래(🏢·📚·📥)만 켤 수 있다. ✏️ 는 rules.html 에서만 켜진다 */
  document.querySelectorAll('.top .rmode a').forEach(function (a) {
    var on = a.getAttribute('href') === 'rules-v2.html#' + mode;
    a.classList.toggle('on', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (mode === 'topics' && S && topicsCtl) topicsCtl.enter();   // 📥 에서 저장한 게 있으면 새로 셈한다(없으면 그대로)
  if (mode === 'topics' && S && !topicsCtl) {
    topicsCtl = PuRulesV2TopicsView.mount($topics, { S: S, cache: PuRulesV2TextCache.make(window.indexedDB),
      companies: ST.companies, stdText: (window.STD_2026 || {}).text || '', loadFix: FIX_LOAD });
  }
}
window.rv2Route = rv2Route;
/* 갈래 단추를 누르면 같은 창에서 주소만 바꾼다(pushState — 뒤로가기로 돌아온다).
   ⚠ 주소창 글자 이동(<a href="#…"> 그대로)은 popstate 를 쏘아 공통 뒤로가기 층이 앱을 나가려 든다.
   ⚠ ✏️ 검토·개정(rules.html)은 다른 파일이다 — 가로채지 않고 그냥 간다(같은 창, 기록 한 걸음). */
var RV2_SELF = 'rules-v2.html#';
document.querySelector('.top .rmode').addEventListener('click', function (ev) {
  var a = ev.target.closest && ev.target.closest('a[href]');
  if (!a || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.button) return;
  var href = a.getAttribute('href');
  if (href.indexOf(RV2_SELF) !== 0) return;
  ev.preventDefault();
  var hash = href.slice(RV2_SELF.length - 1);
  if (window.RV2_MODE(hash) !== window.__rv2Mode) history.pushState(null, '', hash);
  rv2Route();
});
/* Esc — 열린 머리줄 창을 닫는다. 창을 열면 다시 그려 포커스가 body 로 떨어지므로 문서 전체에서 듣는다(한 번만 단다) */
if (!window.__rv2EscSites) {
  window.__rv2EscSites = true;
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && window.__rv2Mode === 'sites' && ST.sites.pop) H.colClose();
  });
}
rv2Route();

function boot(store, o) {
  S = store; ST.isAdmin = o.isAdmin; ST.companies = o.companies;
  reload().catch(function (e) { libMsg('모은 자료를 못 읽었습니다: ' + ((e && e.message) || e)); });
  rv2Route();
}

try {
  firebase.initializeApp(FB_CONFIG);
  firebase.auth().onAuthStateChanged(function (u) {
    if (!u) { PuGate.show(); return; }
    var db = firebase.database();
    db.ref('uid_roles/' + u.uid).once('value').then(function (s) {
      var role = s.val() || {};
      var gw = PuOntologyWrite.createGateway({ mode: 'enforce', actor: role.sid || u.uid });
      return db.ref('data/companies').once('value').then(function (c) {
        /* ⚠ 업체는 id 로 «고른다» — 이름은 거르는 데만 쓴다 */
        var list = PuRulesV2Lib.companyList(c.val());
        /* 사람이 고친 조문 연결(규정관리 rules.html 의 MFIX 와 같은 자리) — 조별 문안의 위반 판정에 넘긴다.
           못 읽으면 교정 없이 판정한다(화면을 막지 않는다). */
        FIX_LOAD = function () {
          return db.ref('rules_mgmt/matchfix').once('value').then(function (s) { return s.val() || {}; }, function () { return {}; });
        };
        var store = PuRulesV2Store.make({ db: db, gateway: gw, companies: function () { return list; },
          actor: function () { return role.sid || u.uid; }, now: function () { return Date.now(); } });
        /* 명부 — 담당 이름. 못 읽어도 화면은 돈다(이름을 모르면 빈 글자 — 사번을 이름 자리에 적지 않는다, 2026-10-25) */
        var sidOf = function (x) { return String(x || '').trim().toUpperCase().replace(/^([A-Z])-?(\d+)$/, '$1-$2'); };
        return db.ref('data/user_dir').once('value').then(function (d) { return d.val() || {}; }, function () { return {}; }).then(function (dir) {
          var arr = Array.isArray(dir.v) ? dir.v : Object.keys(dir.v || {}).map(function (k) { return dir.v[k]; });
          arr.forEach(function (p) { if (p && p.sid) ST.staff[sidOf(p.sid)] = String(p.name || ''); });
          ST.me = sidOf(role.sid);
          boot(store, { isAdmin: role.isAdmin === true, companies: list });
        });
      });
    }).catch(function (e) { libMsg('시작하지 못했습니다: ' + ((e && e.message) || e)); });
  });
} catch (e) {
  libMsg('초기화 실패: ' + e.message);
}
</script>
<script>/* 「지금 로그인한 사람」은 머리줄 자리에 — 안 알려 주면 부품이 떠 있는 표를 따로 띄워 겹친다 */
try { PuWhoami.mount('#whoslot'); } catch (e) {}</script>
<script>try { PuAppBar.mount('#appslot', { current: 'rules' }); } catch (e) {}</script>
<script>/* 폰 뒤로가기 — 🏢 사업장의 이력 판(폰에서는 화면을 덮는다)이 떠 있으면 그 판만 닫는다 (폰화면관리 2026-10-18).
   판이 없으면 false — 예전처럼 공통 층(pu-back)이 앱을 나간다. PC 는 판이 아니라 오른쪽 칸이라 건드리지 않는다. */
try { PuBack.guard(function () {
  if (window.__rv2Mode === 'sites' && ST.sites.sel && window.matchMedia && window.matchMedia('(max-width:900px)').matches) { H.siteSel({ co: '' }); return true; }
  return false;
}); } catch (e) {}</script>
</body>
