<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>급여아웃소싱</title>

<!--
  급여 아웃소싱 앱 — 푸른통합시스템 타일(급여관리)
  - pu-erp와 같은 프로젝트(pureun-erp)·같은 도메인 → 로그인(SSO)·권한(uid_roles)·App Check 공유
  - 데이터는 payroll_os 칸에만 (pu-erp data 안 건드림)
-->
<script src="js/pu-sid-guard.js?v=1"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="js/pu-ontology.js?v=89"></script>
<script src="js/pu-pubdata.js?v=1"></script>
<script src="js/pu-ls-guard.js?v=4"></script>
<script src="js/pu-dnd.js?v=1"></script>
<script src="js/pu-ontology-write.js?v=7" data-mode="observe"></script>
<script src="js/pu-resilience.js?v=3"></script>
<script src="js/pu-health.js?v=7"></script>
<script src="js/pu-version.js?v=12"></script>
<script src="js/pu-rrn-seal.js?v=3"></script>
<script src="js/pu-backup.js?v=2"></script>
<script src="js/pu-labor-core.js?v=12"></script>
<script src="js/pu-simpletax.js?v=1"></script>
<script src="js/pu-site-staff.js?v=6"></script>
<script src="js/pu-co-thread.js?v=3"></script>
<script src="js/pu-hwp-engine.js?v=21"></script>
<script src="hwpx_gen.js?v=14"></script>
<script src="hwpx_doc.js?v=2"></script>
<script src="xlsx_gen.js?v=15"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<style>
:root{--navy:#1e40af;--violet:#2563eb;--ok:#166534;--warn:#d97706;--bad:#dc2626;
--ink:#1e293b;--sub:#64748b;--line:#e2e8f0;--paper:#f8fafc;--card:#FFF;}
*{box-sizing:border-box;margin:0}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink);font-size:14px}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 18px}
header .logo{font-weight:800;font-size:16px}
header .env{font-size:11px;background:#ffffff22;border:1px solid #ffffff55;border-radius:99px;padding:2px 9px}
header .who{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:10px}
header .out{background:#ffffff22;border:1px solid #ffffff66;color:#fff;border-radius:8px;padding:3px 10px;cursor:pointer;font-size:12px}
.save-state{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border:1px solid #ffffff55;border-radius:99px;padding:3px 8px;font-size:11px;font-weight:700;background:#ffffff18}
.save-state::before{content:'';width:7px;height:7px;border-radius:50%;background:#cbd5e1}
.save-state.saving::before{background:#fbbf24;animation:savePulse .8s infinite alternate}
.save-state.saved::before{background:#4ade80}.save-state.failed::before{background:#f87171}
@keyframes savePulse{from{opacity:.4}to{opacity:1}}
.layout{display:flex;min-height:calc(100vh - 46px)}
nav{width:180px;background:#fff;border-right:1px solid var(--line);padding:14px 10px;flex-shrink:0}
nav button{display:block;width:100%;text-align:left;border:none;background:none;border-radius:10px;padding:10px 12px;font-size:13.5px;cursor:pointer;color:var(--ink);font-family:inherit}
nav button.on{background:var(--navy);color:#fff;font-weight:700}
main{flex:1;padding:12px 18px;overflow:auto}
.sum-grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.sum-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.sum-card:hover{border-color:var(--navy);background:#f8fafc}
.dash-2col{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,0.95fr);gap:10px;align-items:start}
.filing-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.rrn-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.pay-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.pay-kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mpills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:10px;align-items:center}
.mpill{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.mpill:hover{border-color:var(--navy);color:var(--navy)}
.mpill.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.subtab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.subtab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
h1{font-size:20px;margin-bottom:4px}.sub{color:var(--sub);font-size:13px;margin-bottom:16px}
.btn{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:9px 16px;cursor:pointer;font-size:13px;font-family:inherit}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.c .t{font-weight:700;color:var(--navy)}.c .m{font-size:12px;color:var(--sub);margin:3px 0 8px}
.c .kv{font-size:12.5px;margin:3px 0}.c .kv b{color:var(--sub);font-weight:600;display:inline-block;width:64px;flex-shrink:0}
.badge{font-size:11px;border-radius:99px;padding:2px 8px}.badge.warn{background:#fffbeb;color:var(--warn)}.badge.ok{background:#e2e8f0;color:var(--ok)}
/* ── 설정 카드 채우기 (2026-09-03) ── */
.c .kv{display:flex;align-items:center;gap:6px}
/* 빈 칸은 «비었다고» 보인다 — 점선이 「여기 채워 주세요」다 */
.fill{border:1px dashed #cbd5e1;border-radius:7px;padding:3px 9px;background:#fff;
      color:var(--sub);cursor:pointer;font-family:inherit;font-size:12.5px}
.fill:hover{border-color:var(--navy);color:var(--navy)}
.val{padding:3px 0}.val.mine{color:var(--navy);font-weight:600}
/* 파란 점 = 사람이 정한 값(기계가 뽑은 값과 눈으로 구별된다) */
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--navy);
     margin-right:3px;vertical-align:1px}
.pen{font-size:11px;color:#cbd5e1;cursor:pointer;background:none;border:none;padding:0;font-family:inherit}
.c:hover .pen{color:var(--sub)}
/* 어둡게 덮는 색·그림자는 새 색을 만들지 않고 --ink(#1e293b)를 흐리게 쓴다 */
.mask{position:fixed;inset:0;background:rgba(30,41,59,.42);display:flex;align-items:center;
      justify-content:center;padding:20px;z-index:900}
.modal{background:#fff;border-radius:14px;padding:20px;width:380px;max-width:100%;
       box-shadow:0 20px 50px -12px rgba(30,41,59,.35)}
.modal h3{margin:0 0 2px;font-size:16px;color:var(--navy)}
.modal .who{font-size:12px;color:var(--sub);margin-bottom:16px}
.modal label{display:block;font-size:12px;color:var(--sub);margin:12px 0 5px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;
      font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.modal input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;
      padding:8px 10px;font-family:inherit;font-size:13px}
.why{background:var(--paper);border-radius:8px;padding:9px 11px;font-size:11.5px;
     color:var(--sub);line-height:1.6;margin-top:14px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:36px;text-align:center;color:var(--sub)}
#gate{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:9}
#gate .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px 36px;width:360px;text-align:center}
#gate h2{color:var(--navy);font-size:20px;margin-bottom:4px}#gate p{color:var(--sub);font-size:12.5px;margin:6px 0 16px}
#gate input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;margin-bottom:10px;font-family:inherit}
#gate .err{color:var(--bad);font-size:12.5px;margin-top:8px;white-space:pre-wrap;text-align:left}
/* ── 임금명세서 ── */
.slip{position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;max-width:840px;margin:0 0 18px;padding:30px 36px;page-break-after:always;overflow:hidden}
.slip .shead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--navy);padding-bottom:9px}
.slip .co{font-weight:800;font-size:15px;color:var(--navy)}
.slip .ttl{font-size:18px;font-weight:800;letter-spacing:6px}
.slip .meta{width:100%;border-collapse:collapse;margin:11px 0 14px;font-size:13px}
.slip .meta td{padding:3px 0}.slip .meta b{color:var(--sub);font-weight:600;margin-right:6px}
.slip .cols{display:flex;gap:20px}.slip .cols>div{flex:1}
.slip .sec{font-weight:700;font-size:13px;color:var(--navy);margin-bottom:6px}
.slip .tb{width:100%;border-collapse:collapse;font-size:13px}
.slip .tb td{border:1px solid var(--line);padding:6px 10px}.slip .tb .n{text-align:right;font-variant-numeric:tabular-nums}
.slip .tb .tot td{font-weight:800;background:var(--paper)}
.slip .net{margin-top:14px;text-align:right;font-size:14px}.slip .net b{font-size:19px;color:var(--navy)}
.slip .calc{margin-top:9px;font-size:12.5px;color:var(--sub)}
.slip .snote{margin-top:11px;font-size:12px;background:#fffbeb;border-radius:8px;padding:9px 12px;color:#854d0e;white-space:pre-wrap}
.slip .foot{margin-top:15px;border-top:1px solid var(--line);padding-top:7px;font-size:11px;color:#94a3b8}
.slip.draft::after{content:'미확정 · 검토용';position:absolute;top:45%;left:50%;transform:translate(-50%,-50%) rotate(-24deg);font-size:52px;font-weight:800;color:rgba(196,61,61,.13);white-space:nowrap;pointer-events:none}
@media (max-width:760px){
  /* 머리줄은 한 줄로 — 「푸른통합시스템」 딱지는 접고, 이름은 …으로 줄인다.
     저장 알림은 점만 남기되 «실패»일 때는 글씨까지 되살린다(놓치면 안 되는 알림이다). */
  header{padding:8px 10px;gap:8px;flex-wrap:nowrap;overflow:hidden}
  header>*{min-width:0}
  header .env{display:none}
  header .logo{font-size:15px;white-space:nowrap;flex:0 0 auto}
  header #backbtn{flex:0 0 auto;white-space:nowrap}
  header .who{margin-left:auto;min-width:0;flex:0 1 auto;gap:7px}
  header .who #whoami{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .who .save-state{font-size:0;gap:0;padding:4px 5px;flex:0 0 auto}
  header .who .save-state.failed{font-size:11px;gap:5px;padding:3px 8px}
  header .out{white-space:nowrap;flex:0 0 auto}
  .layout{display:block;min-height:calc(100vh - 82px)}
  nav{position:sticky;top:0;z-index:5;width:100%;display:flex;gap:6px;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
  nav button{display:inline-block;width:auto;flex:0 0 auto;padding:8px 11px;white-space:nowrap}
  main{padding:15px 12px;overflow:visible}
  .cards{grid-template-columns:minmax(0,1fr)}
  .c,.empty{min-width:0}.empty{padding:24px 14px}
  #gate{padding:14px}#gate .box{width:100%;max-width:360px;padding:26px 20px}
  .slip{padding:20px 14px;overflow-x:auto}
  .slip .shead{gap:10px}.slip .ttl{font-size:16px;letter-spacing:3px;white-space:nowrap}
  .slip .cols{display:block}.slip .cols>div+div{margin-top:14px}
  .sub.noprint .btn{display:block;width:100%;margin:8px 0 0!important;min-height:44px}
  .report-hwp-action{width:100%;min-height:44px;margin:0 0 10px!important}
}
/* ══════ 3칸 (2026-10-05) — 급여데이터함과 같은 치수(보기 170 · 목록 238)·같은 이름 ══════ */
nav.viewbar{width:178px;padding:4px 0 14px;overflow:auto;max-height:calc(100vh - 46px);position:sticky;top:0}
.ctitle{padding:11px 10px 4px;font-size:10.5px;color:var(--sub);font-weight:700}
.vrow{display:flex;align-items:center;gap:5px;padding:7px 10px;font-size:12.5px;cursor:pointer}
.vrow:hover{background:#f8fafc}
.vrow.sel{background:#e2e8f0}.vrow.sel b{color:var(--navy)}
.vrow b{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow .n{font-size:10.5px;color:var(--sub);background:var(--paper);border-radius:99px;padding:1px 6px;white-space:nowrap}
.vrow.warn .n{background:#fffbeb;color:var(--warn)}
.vrow.bad b{color:var(--bad)}.vrow.bad .n{background:#e2e8f0;color:var(--bad)}
.vrow.prow{position:relative}
.vrow.prow .fill{position:absolute;left:0;top:0;bottom:0;background:#eff6ff;pointer-events:none}
.vrow.prow>b,.vrow.prow>.n,.vrow.prow>.pno{position:relative}
.vrow.prow .pno{flex:0 0 15px;text-align:right;font-size:10px;color:var(--sub)}
.vrow.prow.badsid b{color:var(--bad)}
#colist{width:238px;flex:0 0 238px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;
  max-height:calc(100vh - 46px);position:sticky;top:0}
#colist[hidden]{display:none}
#colist .chead{padding:9px 10px 7px;border-bottom:1px solid var(--line);flex:0 0 auto}
#colist .ct{font-size:12px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px}
#colist .ct .n{font-size:10.5px;font-weight:700;color:var(--sub);background:var(--paper);border-radius:99px;padding:1px 6px}
#colist .ym{display:flex;align-items:center;gap:4px;margin-bottom:6px;font-size:12px}
#colist .ym button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:1px 7px;cursor:pointer}
#colist .ym b{flex:1;text-align:center}
#colist input{width:100%;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:11.5px;font-family:inherit}
#colRows{overflow:auto;flex:1}
.corow{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
.corow:hover{background:#f8fafc}.corow.sel{background:#e2e8f0}
.corow .nm{flex:1;min-width:0}
.corow .nm b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corow .nm i{display:block;font-style:normal;font-size:10.5px;color:var(--sub)}
.st{font-size:10.5px;border-radius:99px;padding:1px 7px;white-space:nowrap;flex:0 0 auto}
.st.done{background:#f0fdf4;color:#166534}.st.review{background:#fffbeb;color:#854d0e}
/* 색은 5계열 27색 팔레트 안에서만(tests/color-palette-apps.test.js) — 「자료 없음」 글자는 #94a3b8 이면 흰 바탕에서 2.6:1 로 묻혀 #64748b */
.st.ready,.st.arrived{background:#eff6ff;color:#1e40af}.st.none{background:#f8fafc;color:#64748b;border:1px solid #e2e8f0}.st.nodata{background:#fff;color:#64748b;border:1px dashed #cbd5e1}
/* ── 모든 사업장·직원 줄 번호(1,2,3…) · ㅁ 체크(☐/☑) · 별표(☆/★) · 시간차 단추 (2026-11-02 대표 지시) ── */
.rno{font-size:10.5px;color:var(--sub);min-width:16px;text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto;display:inline-block}
.rmk,.rst{border:none;background:none;padding:1px 2px;cursor:pointer;font-size:13px;line-height:1;color:#cbd5e1;font-family:inherit;flex:0 0 auto}
.rmk:hover,.rst:hover{color:var(--sub)}
.rmk.on{color:var(--navy);font-weight:700}
.rst.on{color:var(--warn)}
.mkwrap{display:inline-flex;align-items:center;gap:2px;vertical-align:middle;margin-right:4px}
.hrbtn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:5px;padding:1px 5px;font-size:10.5px;cursor:pointer;font-family:inherit;margin-left:2px}
.hrbtn:hover{border-color:var(--navy);color:var(--navy)}
.hrbtn.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.cohead{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.cohead .ttl{font-size:19px;font-weight:800}
.cohead .meta{font-size:12.5px;color:var(--sub);margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:2px 10px;cursor:pointer;font-family:inherit;font-size:12px}
.chips button.on{border-color:var(--navy);color:var(--navy);font-weight:700}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:12px 0 14px}
.tabs button{border:none;background:none;padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;color:var(--ink)}
.tabs button.on{border-bottom-color:var(--navy);color:var(--navy);font-weight:700}
.tabbody h1{font-size:16px}
@media (max-width:760px){
  nav.viewbar{max-height:none;position:sticky}
  nav.viewbar .ctitle,nav.viewbar .pnote{display:none}
  nav.viewbar .vrow{flex:0 0 auto;border:1px solid var(--line);border-radius:99px;padding:6px 10px}
  #colist{width:100%;flex:none;max-height:42vh;position:static;border-right:0;border-bottom:1px solid var(--line)}
  .sum-grid4,.dash-2col,.filing-grid,.rrn-grid,.pay-kpis{grid-template-columns:1fr}
}
/* ══════ 머리줄 회사 칸 (2026-10-05) — 회사 이름·담당·지표를 맨 위 파란 줄에 ══════ */
/* ⚠ 넘치면 잘라 버리지 않고 둘째 줄로 내린다 — 맨 끝의 「확정」 단추가 잘려 안 보이면 안 된다 */
header .cobar{flex:1;min-width:0;display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap}
header .cobar:empty{display:none}
body.has-co header .env{display:none}
header .cobar .cn{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;max-width:34%}
header .cobar .cm{font-size:11.5px;opacity:.85;overflow:hidden;text-overflow:ellipsis}
header .cobar .kpis{display:flex;gap:5px;flex-wrap:wrap}
header .kpi{font-size:11px;background:#ffffff22;border:1px solid #ffffff55;border-radius:99px;padding:2px 9px;cursor:pointer;font-family:inherit;color:inherit;white-space:nowrap}
header .kpi.ok{background:#f0fdf4;color:#166534;border-color:#bbf7d0}
header .kpi.warn{background:#fffbeb;color:#854d0e;border-color:#fde68a}

/* ══════ PC 틀·창 고정 (2026-11-02 대표 지시 「틀이나 창이 계속 움직인다 이부분 안움직이게 해라」) ══════

    fbDb.ref(ROOT+'/attend').once('value'),

       ⚠ 구독으로 건다 — 알림은 «다른 앱»에서 오므로, 열어 둔 사이에 와도 보여야 한다.

         그래서 «무엇을 하면 되는지»를 적는다. 만든 사람을 위한 코드는 작게 뒤에 둔다. */
    var 권한없음 = String((e && e.code) || '').indexOf('permission') >= 0;

        + '<span style="color:#94a3b8">' + ((e && e.code) || '알 수 없음') + '</span></div>'; });
}
function dbGet(k,fb){ return (cache[k]!=null)?cache[k]:fb; }

/* ══════ 급여 목록·직원 표 (2026-08-17 나눠 읽기) ══════
   payIdx = 얇은 목록(사업장→줄들, 직원 표 없음). payOld = 옛 모양(직원 표가 안에 든 것).
   empBox = 그 달을 열 때 받아 둔 직원 표(줄 번호 → 직원들).
   ⚠ 어느 모양이든 화면은 payRecs(site) 하나만 보면 되게 감싼다 — 화면 곳곳에서
     모양을 가리기 시작하면 한 군데를 빠뜨려 그 화면만 빈다. */
var payIdx=null, payOld=null, empBox={}, empLoading={};

function payHas(){ return !!(payIdx||payOld); }

/* ── 신고 화면 전용 (2026-08-17) ──
   신고는 여러 사업장·여러 달의 직원 표를 **한꺼번에** 본다(취득·상실·퇴직정산·연차).
   그래서 이 화면에 들어갈 때만 직원 표를 통째로 받는다. 급여 처리는 그대로 가볍다 —
   신고는 가끔 쓰고 급여 처리는 늘 쓰기 때문이다.
   ⚠ 받은 뒤에는 **옛 모양으로 감싸** 돌려준다. 그래야 신고 계산 코드를 한 글자도
     안 건드린다 — 거기를 손대면 취득·상실·퇴직금 셈이 조용히 달라질 수 있다. */
var allEmpsState='';      // '' 아직 · 'loading' 받는 중 · 'done' 다 받음 · 'err' 실패

function ensureAllEmps(){
  if(payOld) { allEmpsState='done'; return; }   // 옛 모양은 이미 다 들어 있다
  if(allEmpsState) return;
  allEmpsState='loading';
  fbDb.ref(ROOT+'/payroll/emp').once('value').then(function(s){
    var v=s.val()||{}; for(var k in v) empBox[k]=v[k];
    allEmpsState='done'; render();
  }).catch(function(e){ allEmpsState='err'; console.warn('[직원 표 전체]',e&&e.code); render(); });
}

function payForReport(){
  var sites={};
  paySites().forEach(function(st){
    sites[st]=payRecs(st).map(function(r){
      var o={}; for(var k in r) o[k]=r[k];
      o.직원=empsOf(r)||[];
      return o;
    });
  });
  return {sites:sites};
}
function paySites(){ return payIdx?Object.keys(payIdx):(payOld?Object.keys(payOld):[]); }
function payRecs(site){ return (payIdx&&payIdx[site])||(payOld&&payOld[site])||[]; }

/* 그 줄의 직원 표 — 이미 손에 있으면 그것, 없으면 null(부르는 쪽이 받아 온다). */
function empsOf(rec){
  if(!rec) return null;
  if(rec.직원) return rec.직원;              // 옛 모양은 줄 안에 들어 있다
  return (rec.id&&empBox[rec.id])||null;
}

/* 그 달을 열 때 그 줄만 받는다. 두 번 부르지 않는다 — 다시 그릴 때마다 또 받으면
   화면이 깜빡이고 요금만 는다. */
function ensureEmps(rec){
  if(!rec||!rec.id||rec.직원||empBox[rec.id]||empLoading[rec.id]) return;
  empLoading[rec.id]=1;
  fbDb.ref(ROOT+'/payroll/emp/'+rec.id).once('value').then(function(s){
    empBox[rec.id]=s.val()||[]; delete empLoading[rec.id]; render();
  }).catch(function(e){
    /* 못 받으면 **빈 표로 두지 않는다** — 빈 표는 「직원이 없다」로 읽혀
       명세서가 0명으로 나간다. 다시 눌러 볼 수 있게 표시만 지운다. */
    delete empLoading[rec.id]; console.warn('[직원 표]',e&&e.code); render();
  });
}
var savePending=0, saveFailed=false;
function setSaveState(kind,text){ var el=document.getElementById('saveState'); if(!el)return; el.className='save-state '+kind; el.textContent=text; }
function dbSet(k,v){
  cache[k]=v; render();
  if(savePending===0) saveFailed=false;
  savePending++; setSaveState('saving','저장 중…');
  return fbDb.ref(ROOT+'/'+k).set(v).then(function(){
    savePending=Math.max(0,savePending-1);
    if(savePending===0) setSaveState(saveFailed?'failed':'saved',saveFailed?'저장 실패':'저장 완료');
    return true;
  }).catch(function(e){
    saveFailed=true; savePending=Math.max(0,savePending-1); setSaveState('failed','저장 실패');
    alert('저장 실패: '+e.code+'\n인터넷 연결을 확인한 뒤 다시 저장하세요.'); return false;
  });
}

/* ★ 첫 화면은 3칸(shell)이다(2026-10-05). view=왼쪽 보기 · coId=고른 업체(업체번호) ·
   loose=업체에 안 이어진 급여관리 자료 · tab=오른쪽 탭 · ym=기준 달(YYYY-MM) · q=찾기 */
var App={screen:'shell',site:null,month:null,emp:null,day:null,view:null,coId:null,loose:null,tab:'sum',ym:null,q:''};
/* ── 화면 이동 기록(직전 화면으로 되돌아가는 백 키) ──
   헤더 ← 버튼과 폰 물리 백키가 같은 History API를 공유. file://에선 pushState가
   막혀도(try/catch) 화면 전환은 정상, 폰 백키만 비활성(라이브 https에선 전부 동작). */
var navDepth=0;
function navSnap(){ return {screen:App.screen,site:App.site,month:App.month,emp:App.emp,day:App.day,view:App.view,coId:App.coId,loose:App.loose,tab:App.tab,ym:App.ym}; }
function navSame(a,b){ return a.screen===b.screen&&a.site===b.site&&a.month===b.month&&a.emp===b.emp&&a.day===b.day
  &&a.view===b.view&&a.coId===b.coId&&a.loose===b.loose&&a.tab===b.tab&&a.ym===b.ym; }
function navApply(s){ App.screen=s.screen||'shell'; App.site=s.site; App.month=s.month; App.emp=s.emp||null; App.day=s.day||null;
  App.view=s.view||null; App.coId=s.coId||null; App.loose=s.loose||null; App.tab=s.tab||'sum'; if(s.ym) App.ym=s.ym; }
function navSeed(){ navDepth=0; try{ history.replaceState({pnav:navSnap(),depth:0},''); }catch(e){} }
function navTo(patch){
  var next=Object.assign(navSnap(),patch);
  if(navSame(next,navSnap())) return;      // 같은 화면이면 기록 안 함
  navApply(next); navDepth++;
  try{ history.pushState({pnav:next,depth:navDepth},''); }catch(e){}
  render();
}
function goBack(){ if(navDepth>0) history.back(); }   // 버튼·폰키 공용 진입점
window.addEventListener('popstate',function(ev){
  var st=ev.state;
  if(st&&st.pnav){ try{ window.__puBackNav = true; }catch(e){}  /* 이 걸음은 우리가 썼다 — 공통 뒤로가기는 비켜선다 */ navApply(st.pnav); navDepth=st.depth||0; render(); }
  // 시작점보다 더 뒤로 = 브라우저 기본(앱 이탈/포털) 허용
});
App.go=function(s){ navTo({screen:s,site:null,month:null,emp:null,day:null,coId:null,loose:null}); };  // 도구(여러 회사를 한꺼번에 보는 화면)로
/* 옛 왼쪽 기능 메뉴 9개는 둘로 갈랐다(대표 결정 2026-10-05 「도구로 줄여 남김」):
   한 회사의 일 → 오른쪽 «회사 한 장»의 탭(TABS) · 여러 회사를 한꺼번에 보는 것 → 왼쪽 「도구」(TOOLS). */
var TABS=[{id:'sum',label:'📋 한눈에'},{id:'roster',label:'👤 근로자명부'},{id:'compliance',label:'📜 계약·취업규칙'},{id:'payroll',label:'💰 급여'},{id:'attend',label:'🕒 근태'},{id:'leave',label:'🌴 연차·휴가'},{id:'sever',label:'🎓 퇴직'},{id:'slip',label:'📄 명세서'},{id:'report',label:'📑 신고'}];
var TOOLS=[{id:'cards',label:'⚙️ 설정 카드'},{id:'inbox',label:'📥 수신함 전체'},{id:'report',label:'📑 신고 모아보기'},{id:'names',label:'🏷 이름표 맞추기'}];
var SIG={green:'#166534',orange:'#d97706',red:'#dc2626',gray:'#94a3b8'};
function won(n){ return (n==null)?'-':Number(n).toLocaleString(); }
/* ── 표시용 중복 정리 ──
   같은 성명이 여러 줄(신고/실지급 시나리오·중복 추출 등)일 때 한 사람당 한 줄만 남김.
   남길 기준 = 항목이 많고 '임금총액−공제=실수령'이 맞아떨어지는 행(가장 신뢰). */
var DED_KEYS_=['기본급','과세총액','소득세','지방세','국민연금','건강보험','장기요양','고용보험','공제총액','실수령'];
function empScore(e){
  var s=0; DED_KEYS_.forEach(function(k){ if(e[k]!=null) s++; });
  var g=e.지급총액||e.과세총액||e.기본급, d=e.공제총액, n=e.실수령;
  if(g!=null&&d!=null&&n!=null&&Math.abs(g-d-n)<=1) s+=5;  // tie-out 우대
  return s;
}
function dedupeEmps(list){
  var by={}, order=[];
  (list||[]).forEach(function(e){
    var k=(e.성명||'').trim(); if(!k) return;
    if(!(k in by)){ order.push(k); by[k]=e; }
    else if(empScore(e)>empScore(by[k])) by[k]=e;
  });
  return order.map(function(k){ return by[k]; });
}
function empCount(r){ var e=empsOf(r); return (e&&e.length)?dedupeEmps(e).length:(r.직원수||0); }
function lockKey(site,month){ return site+'|'+month; }
function isLocked(site,month){ var L=dbGet('payroll_locked',{})||{}; return !!L[lockKey(site,month)]; }
/* ══════ 확정 기록 — 2026-10-07 (보고서 「계산자≠확정자·감사 로그」 중 기록 부분) ══════
   확정 잠금은 «시각»만 남겨, 누가 확정했는지·누가 왜 되돌렸는지 알 길이 없었다. 분쟁 때 「누가 언제
   이 급여를 확정했나」가 증빙이다. 그래서 확정·되돌리기·일괄 확정마다 회사별 기록을 하나씩 쌓는다.
     payroll_os/lock_log/{사업장}/{push} = {months:[…], action:'확정'|'되돌리기'|'일괄 확정', by, at, why}
   ⚠ 되돌릴 때는 사유가 있어야 되돌린다 — 확정된 급여를 고치는 것은 명세서가 이미 나갔을 수 있는 일이다.
   ⚠ 잠금 저장(payroll_locked)의 꼴은 그대로 둔다 — 신호·명세서·relockFor 가 그 꼴에 기댄다. */
function lockLog(site, months, action, why){
  if(!fbDb||!site) return;
  try{ fbDb.ref(ROOT+'/lock_log/'+String(site).replace(/[.#$\[\]\/]/g,'_')).push(
    {months:months, action:action, by:(me&&me.email)||'', at:Date.now(), why:why||''}); }catch(e){ console.warn('[확정 기록]', e); }
}
function toggleLock(site,month){ var L=dbGet('payroll_locked',{})||{}; var k=lockKey(site,month);
  if(L[k]){

/* ── 예외 중심 검토: 데이터 완전성 반영 신호 + 초록 일괄확정 + 필터 ──
   원본 신호(r.신호)는 엔진 계산 결과. 여기서 표시용으로 보정:
   핵심값(총지급·공제·실수령)이 절반 이상 채워지지 않으면 초록 대신 회색(데이터부족=확인필요).
   → 초록불이 진짜로 믿을 수 있어야 [초록 전부 확정]이 안전하다. */
var CORE_GROSS_=['과세총액','지급총액','기본급'];
function recComplete(r){
  var emps=dedupeEmps(empsOf(r)||[]); if(!emps.length) return false;
  var ok=0; emps.forEach(function(e){
    var net=e.실수령!=null, ded=e.공제총액!=null,
        gross=CORE_GROSS_.some(function(k){return e[k]!=null;});
    if(net&&ded&&gross) ok++;
  });
  return ok>=Math.ceil(emps.length*0.5);
}
function effSig(r){
  if(r.신호==='red') return 'red';
  /* ⚠ 직원 표를 아직 안 받았으면 **미리 세어 둔 값**을 쓴다(생성기의 표시신호).
     안 그러면 목록의 모든 줄이 「데이터부족」 회색으로 보여, 멀쩡한 달까지
     확인이 필요한 것처럼 뜬다. 표를 받은 뒤에는 아래처럼 다시 센다. */
  if(!empsOf(r)) return r.표시신호||r.신호||'green';
  if(!recComplete(r)) return 'gray';
  return r.신호||'green';
}
function sigLabel(s){ return {green:'이상없음',orange:'확인필요',red:'막힘',gray:'데이터부족'}[s]||s; }
function lockAllGreen(site){
  if(!payHas()) return;
  var recs=payRecs(site);
  var t=recs.filter(function(r){return effSig(r)==='green'&&!isLocked(site,r.월);});
  if(!t.length){ alert('일괄 확정할 초록(이상없음) 항목이 없습니다. 남은 건 확인이 필요합니다.'); return; }
  if(!confirm(site+' — 초록(이상없음) '+t.length+'건을 한 번에 확정할까요?\n(주황·빨강·데이터부족은 제외됩니다. 되돌리기 가능)')) return;
  var L=dbGet('payroll_locked',{})||{};
  t.forEach(function(r){ L[lockKey(site,r.월)]=Date.now(); });
  lockLog(site, t.map(function(r){ return r.월; }), '일괄 확정', '초록(이상없음)만');
  dbSet('payroll_locked', L);
}
/* 회사 한 장(한눈에)에 보일 확정 기록 — 그 회사 것만 받는다 */
var lockLogBox={}, lockLogBusy={};
function ensureLockLog(site){
  if(!site||lockLogBox[site]!==undefined||lockLogBusy[site]||!fbDb) return;
  lockLogBusy[site]=1;
  fbDb.ref(ROOT+'/lock_log/'+String(site).replace(/[.#$\[\]\/]/g,'_')).limitToLast(10).once('value').then(function(sn){
    var v=sn.val()||{}; lockLogBox[site]=Object.keys(v).map(function(k){ return v[k]; }).sort(function(a,b){ return (b.at||0)-(a.at||0); });
    delete lockLogBusy[site]; if(ready) render();
  }).catch(function(e){ delete lockLogBusy[site]; lockLogBox[site]=[]; console.warn('[확정 기록]', e&&e.code); });
}

function maxHourLeaveFor(site, name){
  var P=(typeof policyFor==='function')?policyFor(site):{dailyContractHours:8};
  var meta=(name&&typeof empMeta==='function')?empMeta(site,name):{};
  var empH=Number(meta.일소정근로시간||meta.소정근로시간||0);
  if(typeof LC!=='undefined'&&LC&&LC.maxHourLeaveOf) return LC.maxHourLeaveOf(P, empH);
  var raw=empH>0?empH:Number(P.dailyContractHours||8);
  return Math.max(1, Math.min(8, Math.floor(raw||8)));
}
function setLeaveHours(site, year, name, h){
  var k=site+'|'+year+'|'+name, lv=leaveOf(site, year, name);
  var maxH=maxHourLeaveFor(site, name);
  var norm=(typeof LC!=='undefined'&&LC&&LC.normalizeHourLeave)
    ? LC.normalizeHourLeave({사용시간:h, policy:policyFor(site), dailyContractHours:maxH})
    : {사용시간:Math.max(0, Math.min(maxH, Math.round(Number(h)||0))), 최대시간차:maxH};
  var nextH=norm.사용시간;
  var patch={사용시간:nextH};
  if(nextH>0){
    var d=new Date(), tag=(d.getMonth()+1)+'/'+d.getDate()+'(시간차 '+nextH+'h)';
    var curDates=String(lv.사용일||'').trim();
    if(!curDates) patch.사용일=tag;
  }
  lput('leave', k, patch);
}
function addLeaveHours(site, year, name, dh){
  var k=site+'|'+year+'|'+name, lv=leaveOf(site, year, name);
  var maxH=maxHourLeaveFor(site, name);
  var step=Math.max(1, Math.min(maxH, Math.round(Number(dh)||1)));
  var rawNext=Math.max(0, Math.round(Number(lv.사용시간||0)+step));
  var norm=(typeof LC!=='undefined'&&LC&&LC.normalizeHourLeave)
    ? LC.normalizeHourLeave({사용시간:rawNext, policy:policyFor(site), dailyContractHours:maxH})
    : {사용시간:Math.min(maxH, rawNext), 최대시간차:maxH};
  var nextH=norm.사용시간;
  var d=new Date(), tag=(d.getMonth()+1)+'/'+d.getDate()+'(시간차 '+step+'h)';
  var curDates=String(lv.사용일||'').trim();
  var nextDates=curDates?(curDates+', '+tag):tag;
  lput('leave', k, {사용시간:nextH, 사용일:nextDates});
}
function setSiteDailyHours(site, h){
  var maxH=Math.max(1, Math.min(8, Math.floor(Number(h)||8)));
  lput('labor_policy', site, {dailyContractHours:maxH});
  var L=lmap('leave'), pre=site+'|', changed=false;
  Object.keys(L).forEach(function(k){
    if(k.indexOf(pre)!==0) return;
    var row=L[k]||{};
    var curH=Number(row.사용시간||0);
    if(curH>maxH||curH!==Math.round(curH)){
      row.사용시간=Math.max(0, Math.min(maxH, Math.round(curH)));
      L[k]=row; changed=true;
    }
  });
  if(changed) dbSet('leave', L);
}

/* ── 가져오기 (2026-08-17 나눠 올리기) ──
   새 모양은 {index, emp} 다. 목록과 직원 표를 **따로** 올린다 —
   ⚠ 통째로 한 번에 쓰면 7MB 한 방이라 느리고, 끊기면 어디까지 갔는지 모른다.
     직원 표는 사업장 묶음으로 나눠 올리고, **목록은 맨 마지막에** 올린다.
     그래야 중간에 끊겨도 화면은 옛 목록 그대로 — 반쯤 들어간 것을 보여 주지 않는다.
   ⚠ 확정 잠금(payroll_locked) 열쇠는 「사업장|시트」다. 사업장 이름이 바뀌면
     확정이 조용히 풀린다. 그래서 **올리기 전에 갈 곳을 찾아 함께 옮긴다.**
   옛 모양({sites})도 그대로 받는다 — 되돌릴 일이 있을 때 쓴다. */
function relockFor(index, locked){
  var out={}, moved=0, lost=[];
  Object.keys(locked||{}).forEach(function(k){
    var at=k.lastIndexOf('|'); if(at<0){ out[k]=locked[k]; return; }
    var site=k.slice(0,at), sheet=k.slice(at+1);
    if(index[site]&&index[site].some(function(r){return r.월===sheet;})){ out[k]=locked[k]; return; }
    var hit=Object.keys(index).filter(function(s){
      return index[s].some(function(r){return r.월===sheet;});
    });
    /* 이름이 갈렸을 때만 옮긴다 — 옛 이름으로 시작하거나, 옛 이름이 새 이름으로
       시작하는 곳(다온원 → 다온원 서산점, 새별 → 새별반찬 3곳). */
    var near=hit.filter(function(s){ return s.indexOf(site)===0||site.indexOf(s.split(' ')[0])===0; });
    if(near.length===1){ out[near[0]+'|'+sheet]=locked[k]; moved++; }
    else { out[k]=locked[k]; lost.push(k); }   // 못 찾으면 **버리지 않고** 그대로 둔다
  });
  return {locked:out, moved:moved, lost:lost};
}

function importPayroll(dropped){var i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
   r.onload=function(){
    var raw; try{ raw=JSON.parse(r.result); }catch(err){ alert('JSON 오류: '+err.message); return; }
    /* ★ 주민번호가 섞인 급여 파일은 올리지 않는다(2026-10-07) — 주민번호는 「주민번호 올리기」로만, 잠가서. */
    var leak=rrnLeakCount(r.result);
    if(leak){ alert('⚠ 이 파일에 주민번호 모양 값이 '+leak+'개 들어 있어 올리지 않았습니다.\n\n급여 자료(payroll_all.json)에는 주민번호가 없어야 합니다. 주민번호는 ⚙️ 설정 카드 → 「주민번호 올리기」로만 올립니다(잠가서 저장).'); return; }
    if(raw.sites&&!raw.index){                       // 옛 모양 — 되돌릴 때만 쓴다
      /* ★ 옛 모양은 payroll 칸을 **통째로** 갈아 끼운다 — 목록(index)·직원 표(emp)가 지워진다
         (2026-10-05 발견). 서버에 새 모양 목록이 이미 있는데 옛 파일(pilot_payroll.json,
         파일럿 10곳)을 올리면 전체 54곳이 10곳으로 줄고 확정 표시도 안 옮겨진다.
         payroll_all.json 이 파일럿 줄을 이미 다 품고 있으니, 평소에 올릴 것은 그것이다.
         그래서 새 모양이 있으면 막고, 「되돌리기」를 손으로 쳐야만 지나가게 한다. */
      var oldN=Object.keys(raw.sites).length;
      if(payIdx){
        var ans=prompt('⚠ 이 파일은 옛 모양(사업장 '+oldN+'곳)입니다.\n\n'
          +'지금 서버에는 새 모양 목록(사업장 '+Object.keys(payIdx).length+'곳)이 있습니다.\n'
          +'올리면 목록과 직원 표가 통째로 지워지고 이 파일의 '+oldN+'곳만 남습니다.\n\n'
          +'평소에 올릴 파일은 _harness_out\\payroll_all.json 입니다.\n\n'
          +'정말 옛 모양으로 되돌리려면 「되돌리기」 네 글자를 그대로 입력하세요.','');
        if((ans||'').trim()!=='되돌리기'){
          alert('올리지 않았습니다. 서버 자료는 그대로입니다.\n\n올릴 파일은 _harness_out\\payroll_all.json 입니다.'); return;
        }
      }
      var orl=relockFor(raw.sites, dbGet('payroll_locked',{})||{});
      dbSet('payroll',raw).then(function(ok){
        if(!ok) return false;
        payIdx=null; payOld=raw.sites; empBox={}; allEmpsState='';
        return dbSet('payroll_locked', orl.locked);
      }).then(function(ok){
        if(ok) alert('옛 모양으로 저장했습니다: '+oldN+'곳 · 확정 '+orl.moved+'건 옮김'
          +(orl.lost.length?'\n갈 곳을 못 찾아 그대로 둔 확정 '+orl.lost.length+'건: '+orl.lost.join(', '):''));
      });
      return;
    }
    if(!raw.index||!raw.emp){ alert('모양을 알 수 없습니다 — index 와 emp 가 있어야 합니다.'); return; }
    var sites=Object.keys(raw.index);
    var rl=relockFor(raw.index, dbGet('payroll_locked',{})||{});
    if(!confirm('사업장 '+sites.length+'곳을 올릴까요?\n\n확정 표시 '+rl.moved+'건은 새 이름으로 옮깁니다.'
      +(rl.lost.length?'\n갈 곳을 못 찾은 '+rl.lost.length+'건은 그대로 둡니다: '+rl.lost.join(', '):''))) return;

    /* 직원 표를 사업장 묶음으로 나눠 올린다 — 한 묶음이 실패하면 거기서 멈춘다. (RTDB 금지 문자 . # $ [ ] / 정리) */
    function cleanFbObj(o){
      if(Array.isArray(o)) return o.map(cleanFbObj);
      if(o&&typeof o==='object'){ var out={}; Object.keys(o).forEach(function(k){ var ck=String(k).replace(/\./g,'·').replace(/[#\$\[\]\/]/g,'_').trim()||'_'; out[ck]=cleanFbObj(o[k]); }); return out; }
      return o;
    }
    raw.index=cleanFbObj(raw.index); raw.emp=cleanFbObj(raw.emp);
    var byId={}, order=[];
    sites.forEach(function(st){ raw.index[st].forEach(function(rec){
      if(rec.id&&raw.emp[rec.id]){ byId[rec.id]=raw.emp[rec.id]; order.push(rec.id); } }); });
    var CH=200, done=0;
    function step(i){
      if(i>=order.length) return Promise.resolve();
      var part={}; order.slice(i,i+CH).forEach(function(id){ part[id]=byId[id]; });
      return fbDb.ref(ROOT+'/payroll/emp').update(part).then(function(){
        done+=Object.keys(part).length;
        setSaveState('saving','직원 표 올리는 중… '+done+'/'+order.length);
        return step(i+CH);
      });
    }
    setSaveState('saving','올리는 중…');
    step(0).then(function(){
      return fbDb.ref(ROOT+'/payroll_locked').set(rl.locked);
    }).then(function(){
      /* 목록은 **맨 마지막**이다 — 여기까지 와야 화면이 새 것으로 바뀐다. */
      return fbDb.ref(ROOT+'/payroll/index').set(raw.index);
    }).then(function(){
      payIdx=raw.index; payOld=null; cache.payroll_locked=rl.locked;
      empBox={}; allEmpsState='';
      setSaveState('saved','저장 완료'); render();
      alert('사업장 '+sites.length+'곳 저장 완료.\n직원 표 '+order.length+'줄 · 확정 '+rl.moved+'건 옮김.');
    }).catch(function(err){
      setSaveState('failed','저장 실패');
      alert('올리다 멈췄습니다 — '+(err&&(err.code||err.message))+'\n\n목록은 아직 안 바뀌었으니 화면은 그대로입니다. 다시 시도해 주세요.');
    });
   };r.readAsText(f);};if(dropped&&dropped.length&&window.PuDnd)PuDnd.pick(i,dropped);else i.click();}

/* ── 명세서(임금명세서) — 확정 급여 → 화이트라벨 인쇄/PDF ──
   렌더 규칙 원본: harness engine/payslip_html.py (동일 로직 유지할 것) */
function slipRows(e){
  var DED=[['소득세','소득세'],['지방세','지방소득세'],['국민연금','국민연금'],['건강보험','건강보험'],
           ['장기요양','장기요양보험'],['고용보험','고용보험'],
           ['연말정산','연말정산 정산액'],  // 부호 그대로(음수=환급) — 공제란에 표시
           ['기타공제','기타 공제']];
  var dedRows=[],dedSum=0;
  DED.forEach(function(p){ if(e[p[0]]!=null){ dedRows.push([p[1],e[p[0]]]); dedSum+=e[p[0]]; } });
  var dedTotal=(e.공제총액!=null)?e.공제총액:(dedRows.length?dedSum:null);
  if(dedTotal!=null&&dedTotal>dedSum) dedRows.push(['기타 공제(차액)',dedTotal-dedSum]);
  var net=(e.실수령!=null)?e.실수령:null;
  // 임금총액 = 반드시 (실수령 + 공제총액) → 명세서가 항상 '임금총액 − 공제 = 실수령'으로 맞음.
  // 기본급/과세엔 비과세(식대 등)가 빠져 그대로 쓰면 숫자가 안 맞는 사고가 생김.
  var gross;
  if(net!=null&&dedTotal!=null) gross=net+dedTotal;
  else if(e.지급총액!=null) gross=e.지급총액;
  else gross=(e.과세총액!=null)?e.과세총액:((e.기본급!=null)?e.기본급:null);
  if(net==null&&gross!=null&&dedTotal!=null) net=gross-dedTotal;
  if(dedTotal==null&&gross!=null&&net!=null&&gross>=net) dedTotal=gross-net;
  var payRows=[],calc=null;
  if(e.일당&&e.근무일수){
    payRows.push(['노무비(일당제)',(gross!=null)?gross:e.일당*e.근무일수]);
    calc='일당 '+won(e.일당)+'원 × '+e.근무일수+'일';
  }else{
    /* ★ 구성항목별 금액(근로기준법 시행령 제27조의2 — 원문 대조 전, 2차 자료로 확인) — 2026-10-07.
       파서가 대장의 수당 열을 「지급항목」으로 읽어 오면 한 줄씩 적는다. 예전엔 기본급 밖을 전부
       「그 외 지급」 한 줄로 뭉쳐(실측 직원 줄의 85.6%) 법정 기재사항을 못 채웠다.
       ⚠ 안전장치: 기본급+항목 합이 임금총액을 «넘으면» 잘못 읽은 것이라 쓰지 않고 예전처럼 뭉친다.
         모자라면 남는 몫을 「그 외 지급(차액)」으로 — 그래서 임금총액−공제=실수령은 늘 그대로다. */
    var items=(e.지급항목&&typeof e.지급항목==='object')?Object.keys(e.지급항목).map(function(k){ return [k, Number(e.지급항목[k])||0]; }).filter(function(x){ return x[1]; }):[];
    var base=(e.기본급!=null)?e.기본급:0, isum=items.reduce(function(a,x){ return a+x[1]; },0);
    if(items.length&&gross!=null&&base+isum<=gross+1){
      if(e.기본급!=null) payRows.push(['기본급',e.기본급]);
      items.forEach(function(x){ payRows.push(x); });
      if(gross-(base+isum)>=1) payRows.push(['그 외 지급(차액)',gross-(base+isum)]);
    } else {
      if(e.기본급!=null) payRows.push(['기본급',e.기본급]);
      if(gross!=null&&e.기본급!=null&&gross>e.기본급) payRows.push(['그 외 지급(수당·비과세 등)',gross-e.기본급]);
      else if(gross!=null&&e.기본급==null) payRows.push(['지급액',gross]);
    }
  }
  /* 연장·야간·휴일 시간 수 — 대장에 시간 열이 있으면 적는다(상시 4명 이하는 생략 가능) */
  var hours=(e.근로시간&&typeof e.근로시간==='object')?Object.keys(e.근로시간).map(function(k){ return k+' '+e.근로시간[k]+'시간'; }).join(' · '):'';
  return {pay:payRows,ded:dedRows,gross:gross,dedTotal:dedTotal,net:net,calc:calc,hours:hours};
}
/* 설정카드의 급여일이 «진짜 급여일인가».
   ⚠ 생성기(engine/build_site_cards.py)는 못 찾은 곳에 「미확인(사람 지정 필요)」이라는
     **글자**를 넣는다. 사람 보라고 넣은 표시지 급여일이 아니다. 그런데 글자라서
     `if(c.급여일)` 을 그냥 통과한다 — 그대로 두면 명세서 지급일 자리에 그 문구가
     찍혀 근로자에게 나간다(근로기준법 제48조제2항 필수 기재란이다).
     46곳 중 26곳이 이 상태다. 빈칸으로 본다 — 모르면 «모른다고» 비워 두는 편이
     틀린 글자를 찍는 것보다 낫다. */
function realPayday(v){
  var s=String(v==null?'':v).trim();
  return (!s||s.indexOf('미확인')>=0)?'':s;
}

/* ══════ 사람이 채운 설정값 (2026-09-03) ══════
   ⚠ 왜 site_cards 에 안 적나 — 그 자리는 기계가 다시 만들어 **통째로 덮어쓴다**
     (설정 카드 화면의 「JSON 가져와 서버 저장」이 배열을 그대로 set 한다).
     거기에 적으면 다음에 카드를 올릴 때 사람이 채운 값이 **조용히 사라진다.**
     그래서 사람 값만 따로 담고, 읽을 때 겹쳐 본다.
   담는 꼴: site_card_edit[사업장] = {급여일, 산정기간, by, at}
   ⚠ 단수처리는 담지 않는다 — 계산(policyFor)에 닿는 값이라 대표 판단이 먼저다. */
function cardEdits(){ return lmap('site_card_edit'); }

/* 카드 한 장을 «화면이 볼 모양»으로 겹친다 — 사람 값이 이긴다.
   빈 글자('')도 사람의 답이다(「모른다」를 뜻한다) — 있으면 그대로 쓴다. */
function cardView(c){
  var e=cardEdits()[String((c&&c.사업장)||'')]||{};
  var pick=function(f){ return (e[f]!=null)?realPayday(e[f]):realPayday(c&&c[f]); };
  return {
    사업장: (c&&c.사업장)||'',
    담당자: (c&&c.담당자)||'',
    급여일: pick('급여일'),
    산정기간: pick('산정기간'),
    급여일_사람: e.급여일!=null,
    산정기간_사람: e.산정기간!=null,
    고친이: e.by||'', 고친때: e.at||0,
    원본: c||{}
  };
}
/* 겹쳐 본 카드들. 사람이 채웠지만 카드에는 없는 사업장은 만들지 않는다 —
   카드가 진짜 목록이고, 편집은 그 위에 얹는 것뿐이다. */
function cardsView(){ return (dbGet('site_cards',[])||[]).map(cardView); }

function paydayOf(site){
  var set={};
  cardsView().forEach(function(v){ var nm=String(v.사업장||'');
    if(nm.indexOf(site)>=0||site.indexOf(nm)>=0){
      if(v.급여일) set[v.급여일]=1; } });
  var ks=Object.keys(set);
  return ks.length===1?ks[0]:'';
}
function leaveSummaryForSlip(site, month, e){
  var nm=String((e&&e.성명)||'').trim();
  if(!nm) return null;
  var meta=(typeof empMeta==='function')?empMeta(site,nm):{};
  var hire=meta.입사일||(e&&e.입사일)||'';
  var yr=(typeof laborYearOfMonth==='function')?laborYearOfMonth(month):String(new Date().getFullYear());
  var lv=(typeof leaveOf==='function')?leaveOf(site,yr,nm):{};
  var P=(typeof policyFor==='function')?policyFor(site):{fiveOrMore:true,annualBase:15,annualCap:25};
  var accrued=null;
  if(lv.발생!=null&&lv.발생!=='') accrued=Number(lv.발생);
  else if(hire&&typeof LC!=='undefined'&&LC&&LC.accrueAnnual){
    var ac=LC.accrueAnnual({hireDate:hire,asOf:yr+'-12-31',policy:P});
    if(ac&&ac.발생일수!=null) accrued=Number(ac.발생일수);
  } else if(hire&&typeof annualLeaveOf==='function'){
    var al=annualLeaveOf(hire,new Date());
    if(al&&al.발생일수!=null) accrued=Number(al.발생일수);
  }
  var carry=Number(lv.이월||0);
  var dates=[], calUsed=0, calHours=0;
  var A=(typeof lmap==='function')?lmap('attend'):{};
  var pre=site+'|', suf='|'+nm;
  Object.keys(A).forEach(function(k){
    if(k.indexOf(pre)!==0||k.slice(-suf.length)!==suf) return;
    var row=A[k]||{};
    (row.일별||[]).forEach(function(d){
      if(!d||!d.date||String(d.date).slice(0,4)!==String(yr)) return;
      if(d.type==='annual'){ calUsed+=1; dates.push(d.date+'(1일)'); }
      else if(d.type==='half'){ calUsed+=0.5; dates.push(d.date+'(반차)'); } else if(d.type==='quarter'){ calHours+=2; dates.push(d.date+'(반반차2h)'); } else if(d.type==='hourleave'){ var maxDh=maxHourLeaveFor(site,nm); var hh=Math.min(maxDh,Math.max(1,Math.round(Number(d.leaveHours||d.hours||1)))); calHours+=hh; dates.push(d.date+'(시간차'+hh+'h)'); }
    });
  });
  dates.sort();
  var curRec=(typeof attendOf==='function')?attendOf(site,month,nm):{};
  var mUsed=Number(curRec.연차사용||0);
  var dayH=maxHourLeaveFor(site,nm); var usedH=Math.min(dayH,Math.max(0,Math.round(Number(lv.사용시간||0))))+calHours; var used=(lv.사용!=null&&lv.사용!=='')?Math.round((Number(lv.사용)+usedH/dayH)*100)/100:((calUsed>0||usedH>0)?Math.round((calUsed+usedH/dayH)*100)/100:(mUsed>0?mUsed:(accrued!=null?0:null)));
  var manualDates=String(lv.사용일||'').trim();
  var usedDates=manualDates||(dates.length?dates.join(', '):(used?'대장 반영 ('+used+'일)':'없음'));
  if(accrued==null&&used==null&&!hire&&!manualDates) return null;
  var total=(accrued!=null)?(accrued+carry):null;
  var remain=(total!=null&&used!=null)?Math.round((total-used)*100)/100:null; var remainH=(remain!=null)?Math.round(remain*dayH*100)/100:null;
  return {입사일:hire||'-',발생:total!=null?total:(accrued!=null?accrued:'-'),사용:used!=null?used:0,사용시간:usedH,잔여:remain!=null?remain:'-',잔여시간:remainH!=null?remainH:'-',사용일:usedDates};
}

/* 명세서 한글 저장 — 화면을 긁지 않고 «화면이 쓰는 그 자료»로 바로 만든다.
   slipRows() 가 지급·공제·실수령을 셈하는 한 곳이므로, 화면과 문서가 어긋날 수 없다.

}

/* ── 수신함: 사업장별 자료 준비 현황(정상/도착/미도착/지연/오류) ──

/* 귀속월을 숫자(1~12)로. 여러 꼴을 다 받는다 —

   「2026.08」 · 「26-08」 · 「8」.
   ⚠ 2026-08 에서 앞 네 자리를 월로 읽으면 20월·26월이 된다 — 그래서
   연-월 꼴을 **먼저** 가려낸다. 이걸 안 해서 급여데이터함에서 값을 넘겨도

  if(!m) m=t.match(/^(\d{1,2})$/);                         // 숫자만

/* ── 신고(파생신고 1호): 일용직 근로내용확인신고 초안 ──

function dailyReportRows(emps){

    var daily=e.일당, hourly=e.시급; if(!daily&&!hourly) return;
    var pay=(e.과세총액!=null)?e.과세총액:e.지급총액;

    if(daily){ expect=daily*days; unit=daily; kind='일당'; }
    else { var hrs=e.근무시간; expect=hrs?hourly*hrs:null; unit=hourly; kind='시급'; }
    if(pay==null) pay=expect;

    else if(Math.abs(expect-pay)<=1) chk='일치';
    else if(pay>expect) chk='확인(+'+won(pay-expect)+' 주휴·야간?)';
    else chk='확인('+kind+'×근무='+won(expect)+')';

/* 취득·상실: 입사일/퇴사일의 월이 신고월과 같은 직원 추출(연도는 표기해 사람이 확인) */

/* 명단 비교(추정): 전월 명단 대비 사라짐=상실추정 / 새로 나타남(입사일 없음)=취득추정.
   상용만 비교(일용은 매달 들고남이 정상 → 근로내용확인신고 영역). 연도는 파일명에서. */
function isDailyEmp(e){

  // 상용 대장에도 통상시급 열이 있어 '시급 보유'만으로 일용 취급하면 상용이 명단에서 빠지고,
  // 반대로 상용/일용 블록이 쌓인 명세서는 일용의 '일급'이 시급 열로 흡수됨(예: 100,000원).

function ymOf(rec){

  if(mn==null) return null;
  var f=String(rec.파일||'')+' '+String(rec.월||''), y=null, m;
  m=f.match(/(20\d{2})\s*년?/); if(m) y=parseInt(m[1],10);
  if(y==null){ m=f.match(/(?:^|[^\d])(\d{2})\s*년/); if(m) y=2000+parseInt(m[1],10); }
  if(y==null){ m=f.match(/(?:^|[^\d])(\d{2})[.\-](\d{1,2})(?![\d])/);
    if(m&&parseInt(m[2],10)===mn) y=2000+parseInt(m[1],10); }
  return (y==null||y<2015||y>2035)?null:{y:y,m:mn};

function rosterMaps(pay, site){

    dedupeEmps(r.직원||[]).forEach(function(e){
      if(isDailyEmp(e)) return;                       // 상용만

function rosterDiffRows(pay, site, mLabel){

/* ── 연차 관리(파생 4호): 재직자 법정 연차 발생일수 초안 ──
   근로기준법 60조: 1년미만 월개근 1일(최대11) / 1년이상 15일+2년마다 1일 가산(최대25).
   입사일 기준 산정(회계연도 방식 사업장은 설정 필요 — 화면 명시). 사용·잔여는 근태 영역. */
function annualLeaveOf(hire, base){
  var h=new Date(hire); if(isNaN(h.getTime())) return null;
  var years=base.getFullYear()-h.getFullYear();
  var anniv=new Date(base.getFullYear(), h.getMonth(), h.getDate());
  if(anniv>base) years--;
  var months=(base.getFullYear()-h.getFullYear())*12+(base.getMonth()-h.getMonth());
  if(base.getDate()<h.getDate()) months--;
  var days, note='';
  if(years<1){ days=Math.min(Math.max(months,0),11); note='1년 미만: 월 개근 시 1일(개근 가정 최대치)'; }
  else { days=Math.min(15+Math.floor((years-1)/2),25); }
  var next=new Date(base.getFullYear(), h.getMonth(), h.getDate());
  if(next<=base) next=new Date(base.getFullYear()+1, h.getMonth(), h.getDate());
  function iso(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  return {근속년:Math.max(years,0), 발생일수:days, 다음발생일:iso(next), 비고:note};
}
function leaveRows(pay, site, base){

    }

/* ── 퇴직정산(파생 3호): 퇴사자(정식+추정)의 퇴직금 추정 초안 ──
   평균임금 = 마지막 3개월 임금총액 ÷ 그 3개월 역일수, 퇴직금 = 평균임금×30×(재직일수÷365).
   초안 수준: 상여·연차수당 가산 등 정밀 규칙은 노무사 확인(화면 명시). 상용만. */
function grossOf(e){ var r=slipRows(e); return r.gross; }
function empIndex(pay, site){
  // 상용 직원의 (연-월)별 기록: {성명: {ym: emp}}, ymList
  var ix={}, yms={};
  (((pay||{}).sites||{})[site]||[]).forEach(function(r){
    var ym=ymOf(r); if(!ym) return;
    var k=ym.y*100+ym.m;
    dedupeEmps(r.직원||[]).forEach(function(e){
      if(isDailyEmp(e)) return;
      var nm=(e.성명||'').trim(); if(!nm) return;
      yms[k]=1;                                        // 상용이 실재하는 달만 명단으로 인정
      ix[nm]=ix[nm]||{}; if(!ix[nm][k]) ix[nm][k]=e;
    });
  });
  return {ix:ix, yms:Object.keys(yms).map(Number).sort(function(a,b){return a-b;})};
}
function daysInYM(k){ var y=Math.floor(k/100), m=k%100; return new Date(y,m,0).getDate(); }
function ymAdd(k,delta){ var y=Math.floor(k/100), m=k%100-1+delta; return (y+Math.floor(m/12))*100+(m%12+12)%12+1; }
function severRows(pay, site, mLabel){
  var mn=monthNum(mLabel); if(mn==null) return [];
  var E=empIndex(pay,site), out=[];
  E.yms.forEach(function(k){
    if(k%100!==mn) return;
    var pk=ymAdd(k,-1); if(E.yms.indexOf(pk)<0) return;
    Object.keys(E.ix).forEach(function(nm){
      var rec=E.ix[nm], leave=null, kindTxt=null;
      var e=rec[k]||rec[pk]||{};
      if(e.퇴사일&&parseInt(e.퇴사일.slice(5,7),10)===mn){ leave=e.퇴사일; kindTxt='정식(퇴사일)'; }
      else if(rec[pk]&&!rec[k]&&!rec[pk].퇴사일){ var pd=daysInYM(pk);   // 퇴사일 기재자는 그 달에 정식 처리(중복 방지)
        leave=Math.floor(pk/100)+'-'+('0'+(pk%100)).slice(-2)+'-'+('0'+pd).slice(-2); kindTxt='추정(명단 사라짐)'; }
      if(!leave) return;
      var hire=null; Object.keys(rec).forEach(function(kk){ if(!hire&&rec[kk].입사일) hire=rec[kk].입사일; });
      var flags=[];
      // 마지막 근무월(임금 있는 최근 달)부터 3개월 수집
      var lastK=rec[k]?k:pk, months=[], sum=0, days=0, kk=lastK;
      for(var i=0;i<3;i++){ var em=rec[kk];
        if(em){ var g=grossOf(em); if(g!=null){ months.push(kk); sum+=g; days+=daysInYM(kk); } }
        kk=ymAdd(kk,-1); }
      if(months.length<3) flags.push('임금자료 '+months.length+'개월뿐');
      var avg=(days>0)?sum/days:null;
      var tenure=null, sever=null, target='';
      if(hire){
        var d1=new Date(hire), d2=new Date(leave);
        tenure=Math.round((d2-d1)/86400000)+1;
        if(tenure<365){ target='대상 아님(1년 미만)'; }
        else if(avg!=null){ sever=Math.round(avg*30*tenure/365); target='대상'; }
        else { target='계산불가(임금자료 없음)'; }
      } else { flags.push('입사일 미상 — 근속 계산 불가'); target='계산불가'; }
      out.push({성명:nm,입사일:hire||'-',마지막근무:leave,근거:kindTxt,
        재직일수:tenure,개월수:months.length,임금3개월:sum||null,평균임금:(avg!=null)?Math.round(avg):null,
        퇴직금추정:sever,대상:target,플래그:flags.join(' · ')});
    });
  });
  out.sort(function(a,b){return a.성명<b.성명?-1:1;});
  return out;
}

   {ts,filename,사업장,월,종류,상태,출처} 를 써 준다. 여기서는 그것을 **읽기만** 한다.

     오히려 틀린 사업장·월을 만든다. 잘못 온 알림은 급여데이터함에서 고쳐 다시 넘긴다. */
function inboxLog(){ var v=dbGet('inbox',{}); return (v&&typeof v==='object'&&!Array.isArray(v))?v:{}; }
function guessMonth(text){
  text=String(text||'');
  var m=text.match(/(\d{1,2})\s*월/); if(m) return parseInt(m[1],10)+'월';        // 'N월' 우선
  m=text.match(/(?:^|[^\d])(\d{2})[.\-](\d{1,2})(?![\d.\-])/);                     // 'YY.MM' (귀속)
  if(m){ var mm=parseInt(m[2],10); if(mm>=1&&mm<=12) return mm+'월'; }
  return null;

function siteKey(s){ return String(s||'').replace(/\(.*?\)|㈜|주식회사|\s/g,''); }

/* 이 사업장에 그 달 자료가 왔나.
   ★ 2026-10-05: 데이터함은 업체관리 «정식 이름»을, 여기는 급여대장 «폴더 이름»을 쓴다.
     글자로만 견주면 44곳 중 20곳이 안 붙었다. 이제 알림에 실려 오는 업체번호를
     대표가 확정한 이름표(site_co_link)의 번호와 견준다 — 규칙은 PuSiteStaff.arrivalMatches 한 곳.
   ⚠ 모듈을 못 불러온 때만 예전 글자 비교로 물러선다(화면이 통째로 비면 안 된다). */
function arrivalFor(site, mLabel){
  var map=inboxLog(), mn=monthNum(mLabel), key=siteKey(site), links=lmap('site_co_link');

  return Object.keys(map).some(function(id){ var a=map[id];
    if(!a) return false;
    var same=S ? S.arrivalMatches(a, site, links)
               : (!!a.사업장&&((a.사업장===site)||(!!key&&siteKey(a.사업장)===key)));

/* ══════ 설정값 채우기 창 ══════
   ⚠ 「비우기」가 반드시 있어야 한다 — 잘못 넣었을 때 되돌릴 길이 없으면
     틀린 급여일이 명세서에 계속 찍힌다. */
/* 누가 정했는지 남기려고 쓴다 — 나중에 「이 급여일 누가 넣었지」를 물을 수 있게.
   ⚠ 로그인 정보를 못 읽어도 저장은 막지 않는다(누가 넣었는지만 비고 값은 들어간다). */
function meEmail(){   // 기록용 저장값(by) — 저장은 이대로, 화면에 보일 때는 아래 whoName() 을 거친다
  try{ var u=(window.firebase&&firebase.auth&&firebase.auth().currentUser)||null;
       return (u&&u.email)||''; }catch(e){ return ''; }
}
/* 기록에 남은 «누가»(by)를 화면에 보일 때 — 저장값(이메일)은 그대로 두고 «보이는 글자»만 이름으로 (대표 결정 2026-10-25 「이름만 있어야한다」).
   이름이 적혀 있으면 그대로, 로그인 이메일·사번 꼴이면 공개 명부(coData.dir)에서 이름을 찾는다. 못 찾으면 빈 글자. */
function whoName(v){
  var s=String(v==null?'':v).trim(); if(!s) return '';
  var mail=s.indexOf('@')>=0;
  if(!mail && !/^[A-Za-z]{1,3}-?\d{3}$/.test(s)) return s;          // 이름이다
  if(mail && !/@pureun\.kr$/i.test(s)) return '';                   // 다른 도메인 이메일 — 이름을 알 길이 없다
  var key=(mail?s.split('@')[0]:s).toLowerCase().replace(/-/g,'');
  var m=window.PuWhoami&&PuWhoami.get&&PuWhoami.get();
  if(m&&m.name&&me&&String(me.email||'').toLowerCase()===(key+'@pureun.kr')) return m.name;   // 내 것은 상단에 이미 뜬 이름
  var map=(coData&&window.PuSiteStaff&&PuSiteStaff.nameBySid)?PuSiteStaff.nameBySid(coData.dir):{};
  var hit=Object.keys(map).filter(function(sid){ return String(sid).toLowerCase().replace(/-/g,'')===key; })[0];
  return hit?map[hit]:'';
}

/* ══════════════════════════════════════════════════════════════════════
   노동법 화면 3장 — 근태 · 연차·휴가 · 퇴직
   계산은 한 줄도 여기서 하지 않는다. 전부 js/pu-labor-core.js(PuLaborCore)를
   부른다 — 규칙이 화면에 흩어지면 사업장 110곳에서 서로 달라진다.
   저장은 기존 방식 그대로 납작한 지도(payroll_locked 와 같은 꼴):
     labor_policy[사업장] · emp_meta[사업장|성명]
     attend[사업장|월|성명] · leave[사업장|연도|성명] · sever[사업장|성명]
   ══════════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════════
   명세서 발송 · 회계프로그램용 엑셀 내보내기
   ──────────────────────────────────────────────────────────────────────
   발송은 **되돌릴 수 없는 밖으로 나가는 행위**다. 그래서 규칙을 못 박는다:
     ① 확정된 월만 보낸다(미확정은 검토용 워터마크본 — 나가면 사고다)
     ② 보내기 전에 사람에게 확인받는다(누구에게·몇 명·어느 달)
     ③ 보낸 사실을 남긴다(slip_sent) — 두 번 보내는 것을 막고, 물으면 답한다
   메일 함수는 이미 있는 sendPayslip 을 쓴다(pu-erp 와 같은 자리·같은 방식).
   ══════════════════════════════════════════════════════════════════════ */
var PAYSLIP_FN_URL = 'https://us-central1-pureun-erp.cloudfunctions.net/sendPayslip';

/* 보낸 기록 — 사업장|월|성명 */
function sentMap() { return lmap('slip_sent'); }
function sentOf(site, month, name) { return sentMap()[site + '|' + month + '|' + name] || null; }

/* 로그인 증표를 붙여 함수를 부른다(pu-erp 의 postMail 과 같은 방식).
   ⚠ 증표가 없으면 서버가 401 로 되돌린다 — 우리 도메인이 공개 발송기가 되지 않게. */
function postPayslip(payload) {
  var u = null;
  try { u = (window.firebase && firebase.auth && firebase.auth().currentUser) || null; } catch (e) {}
  if (!u) return Promise.reject(new Error('로그인 후 이용해 주세요.'));
  return u.getIdToken().then(function (tok) {
    return fetch(PAYSLIP_FN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); });
  });
}

/* 메일 본문 — 명세서 표를 그대로 담는다. 메일 클라이언트는 CSS 를 많이 지우므로
   표는 style 속성으로만 꾸민다(class 는 메일에서 사라진다). */
function payslipMailHtml(site, month, e) {
  var sr = slipRows(e) || [];
  var rows = Array.isArray(sr) ? sr : [].concat(
    (sr.pay || []).map(function (p) { return ['[지급] ' + p[0], won(p[1]) + '원']; }),
    sr.gross != null ? [['임금총액', won(sr.gross) + '원']] : [],
    (sr.ded || []).map(function (p) { return ['[공제] ' + p[0], won(p[1]) + '원']; }),
    sr.dedTotal != null ? [['공제총액', won(sr.dedTotal) + '원']] : [],
    sr.net != null ? [['실수령액', won(sr.net) + '원']] : [],
    sr.hours ? [['근로시간', sr.hours]] : []
  );
  var tr = rows.map(function (r) {
    return '<tr><td style="padding:5px 8px;border-bottom:1px solid #e2e8f0">' + (r[0] == null ? '' : r[0]) + '</td>' +
      '<td style="padding:5px 8px;border-bottom:1px solid #e2e8f0;text-align:right">' + (r[1] == null ? '' : r[1]) + '</td></tr>';
  }).join('');
  return '<div style="font-family:sans-serif;font-size:14px;line-height:1.7;color:#1e293b">' +
    '<p>' + (e.성명 || '') + ' 님 안녕하세요.</p>' +
    '<p>' + site + ' ' + month + ' 임금명세서를 보내 드립니다. (근로기준법 48조 2항)</p>' +
    '<table style="border-collapse:collapse;font-size:13px;min-width:280px">' + tr + '</table>' +
    leaveMailBlockHtml(site, month, e) +
    '<p style="font-size:12px;color:#64748b">문의는 담당자에게 회신해 주세요. 이 메일은 푸른노무법인이 사업장을 대행해 보냅니다.</p>' +
    '</div>';
}

/* 한 사람에게 보내기 — 확인 → 발송 → 기록 */
function sendSlipOne(site, month, name) {
  if (!isLocked(site, month)) {
    alert('확정되지 않은 달입니다. 급여 처리 화면에서 확정한 뒤 보내세요.\n(미확정본은 「검토용」 워터마크가 찍힙니다)');
    return;
  }
  var meta = empMeta(site, name);
  var to = (meta.이메일 || '').trim();
  if (!to || to.indexOf('@') < 0) { alert(name + ' 님의 이메일이 없습니다. 이메일 칸에 넣어 주세요.'); return; }
  var rec = payRecs(site).filter(function (r) { return r.월 === month; })[0];
  var emps = rec ? (empsOf(rec) || []) : [];
  var e = dedupeEmps(emps).filter(function (x) { return x.성명 === name; })[0];
  if (!e) { alert('직원 표를 아직 받지 못했습니다. 잠시 뒤 다시 눌러 주세요.'); return; }
  var prev = sentOf(site, month, name);
  var msg = name + ' 님에게\n' + to + ' (으)로\n' + site + ' ' + month + ' 임금명세서를 보낼까요?';
  if (prev) msg = '이미 ' + new Date(prev.at).toLocaleString() + ' 에 보냈습니다.\n\n' + msg + '\n\n(다시 보내면 두 번 받게 됩니다)';
  if (!confirm(msg)) return;
  postPayslip({
    to: to, name: name, ym: month,
    subject: '[푸른노무법인] ' + month + ' 임금명세서 — ' + name,
    html: payslipMailHtml(site, month, e)
  }).then(function (d) {
    if (d && d.ok) {
      lput('slip_sent', site + '|' + month + '|' + name, { at: Date.now(), to: to, by: (d.by || '') });
      alert('발송 완료 → ' + to);
    } else {
      alert('발송 실패: ' + JSON.stringify((d && d.error) || d));
    }
  }).catch(function (err) { alert('호출 실패: ' + ((err && err.message) || err)); });
}

/* 여럿에게 — 한 번 확인하고 차례로 보낸다.
   ⚠ 한꺼번에 던지지 않는다(메일 서비스가 막고, 어디까지 갔는지도 모르게 된다).
     하나씩 보내고 결과를 세어 마지막에 알린다. */
function sendSlipAll(site, month) {
  if (!isLocked(site, month)) { alert('확정되지 않은 달입니다. 확정 후 보내세요.'); return; }
  var rec = payRecs(site).filter(function (r) { return r.월 === month; })[0];
  var emps = rec ? dedupeEmps(empsOf(rec) || []) : [];
  var todo = emps.filter(function (e) {
    var m = empMeta(site, e.성명);
    return m.이메일 && m.이메일.indexOf('@') > -1 && !sentOf(site, month, e.성명);
  });
  var noMail = emps.length - emps.filter(function (e) {
    var m = empMeta(site, e.성명); return m.이메일 && m.이메일.indexOf('@') > -1;
  }).length;
  if (!todo.length) {
    alert('보낼 대상이 없습니다.' + (noMail ? '\n이메일이 없는 사람 ' + noMail + '명 — 이메일 칸을 채우세요.' : '\n(이미 모두 보냈습니다)'));
    return;
  }
  if (!confirm(site + ' ' + month + ' 임금명세서를 ' + todo.length + '명에게 보낼까요?' +
    (noMail ? '\n(이메일 없는 ' + noMail + '명은 건너뜁니다)' : '') +
    '\n(이미 보낸 사람은 제외했습니다)')) return;
  var okN = 0, failN = 0, i = 0;
  function next() {
    if (i >= todo.length) {
      alert('발송 끝 — 성공 ' + okN + '명' + (failN ? ' · 실패 ' + failN + '명' : ''));
      render();
      return;
    }
    var e = todo[i++];
    var to = empMeta(site, e.성명).이메일;
    postPayslip({
      to: to, name: e.성명, ym: month,
      subject: '[푸른노무법인] ' + month + ' 임금명세서 — ' + e.성명,
      html: payslipMailHtml(site, month, e)
    }).then(function (d) {
      if (d && d.ok) { okN++; lput('slip_sent', site + '|' + month + '|' + e.성명, { at: Date.now(), to: to, by: (d.by || '') }); }
      else failN++;
      next();
    }).catch(function () { failN++; next(); });
  }
  next();
}

/* ── 회계프로그램용 급여대장 엑셀 ──
   ⚠ 더존 등 프로그램마다 가져오기 열 순서가 다르다. 그래서 「더존 전용 서식」이라고
     하지 않고 **표준 급여대장**을 낸다 — 첫 사용 시 프로그램의 가져오기 매핑을
     한 번 맞추면 그다음부터는 그대로 쓸 수 있다. 주민번호는 넣지 않는다. */
var LEDGER_COLS = ['순번', '성명', '기본급', '과세총액', '비과세', '지급총액',
  '국민연금', '건강보험', '장기요양', '고용보험', '소득세', '지방소득세', '공제총액', '실지급액'];
function ledgerRows(site, month) {
  var rec = payRecs(site).filter(function (r) { return r.월 === month; })[0];
  var emps = rec ? dedupeEmps(empsOf(rec) || []) : [];
  var out = [], i = 0;
  emps.forEach(function (e, idx) {
    i++;
    var 지급 = (e.지급총액 != null) ? e.지급총액
      : ((e.실수령 != null && e.공제총액 != null) ? (Number(e.실수령) + Number(e.공제총액)) : null);
    out.push([i, e.성명 || '', e.기본급, e.과세총액, e.비과세, 지급,
      e.국민연금, e.건강보험, e.장기요양, e.고용보험, e.소득세, e.지방세, e.공제총액, e.실수령]
      .map(function (v, ix) { return ix <= 1 ? v : (v == null ? '' : v); }));
  });
  return out;
}
function exportLedgerXlsx(site, month) {
  var rows = ledgerRows(site, month);
  if (!rows.length) { alert('내보낼 직원 표가 없습니다. 잠시 뒤 다시 눌러 주세요.'); return; }
  if (!window.XLSXGEN) { alert('엑셀 만들기 도구를 불러오지 못했습니다.'); return; }
  XLSXGEN.download({
    sheet: '급여대장',
    title: site + ' ' + month + ' 급여대장',
    sub: '푸른노무법인 · 주민번호 미포함 · 회계프로그램 가져오기용',
    headers: LEDGER_COLS,
    rows: rows,
    landscape: true
  }, '급여대장_' + site + '_' + month + '.xlsx');
}
/* CSV — 엑셀이 막히거나 다른 프로그램에 넣을 때. 한글이 깨지지 않게 BOM 을 붙인다. */
function exportLedgerCsv(site, month) {
  var rows = ledgerRows(site, month);
  if (!rows.length) { alert('내보낼 직원 표가 없습니다.'); return; }
  var esc2 = function (v) {
    var s2 = (v == null ? '' : String(v));
    return (s2.indexOf(',') > -1 || s2.indexOf('"') > -1) ? '"' + s2.replace(/"/g, '""') + '"' : s2;
  };
  var lines = [LEDGER_COLS.join(',')].concat(rows.map(function (r) { return r.map(esc2).join(','); }));
  var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '급여대장_' + site + '_' + month + '.csv';
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
}

function parseKakaoOcrLines(text, year, mon){
  var lines=String(text||'').split(/\r?\n/), out=[];
  var y=Number(year||new Date().getFullYear()), m=Number(mon||(new Date().getMonth()+1));
  var pad=function(n){ return (n<10?'0':'')+n; };
  lines.forEach(function(raw){
    var s=raw.trim(); if(!s) return;
    var nm='';
    var mBr=s.match(/^\[([^\]]+)\]/);
    if(mBr) nm=mBr[1].trim();
    else {
      var mNm=s.match(/^([가-힣]{2,4})\s*[:·\-]/);
      if(mNm) nm=mNm[1].trim();
    }
    var dMatch=s.match(/(?:(20\d{2})[.\-\/])?(\d{1,2})[.\-\/월]\s*(\d{1,2})일?/);
    var dateStr=dMatch?((dMatch[1]||y)+'-'+pad(Number(dMatch[2]))+'-'+pad(Number(dMatch[3]))):(y+'-'+pad(m)+'-01');
    var tMatch=s.match(/(\d{1,2}:\d{2})\s*[~\-부터]\s*(\d{1,2}:\d{2})/);
    var type='work', tin='', tout='', brk=60, lvh=0;
    if(/반반차/.test(s)){ type='quarter'; lvh=2; }
    else if(/시간차|시간연차/.test(s)){ type='hourleave'; var hm=s.match(/(\d+(?:\.\d+)?)\s*(?:시간|h)/i); lvh=hm?Number(hm[1]):1; }
    else if(/반차/.test(s)) type='half';
    else if(/연차|휴가/.test(s)) type='annual';
    else if(/결근/.test(s)) type='absent';
    else if(/휴일|특근/.test(s)) type='holiday';
    if(tMatch){
      var p1=tMatch[1].split(':'), p2=tMatch[2].split(':');
      tin=pad(Number(p1[0]))+':'+p1[1];
      tout=pad(Number(p2[0]))+':'+p2[1];
    }
    var bMatch=s.match(/휴게\s*(\d+)\s*분/);
    if(bMatch) brk=Number(bMatch[1]);
    if(nm||tMatch||type!=='work'){
      out.push({name:nm,date:dateStr,type:type,leaveHours:lvh||undefined,in:tin||((type==='work'||type==='holiday')?'09:00':''),out:tout||((type==='work'||type==='holiday')?'18:00':''),breakMin:brk,raw:s});
    }
  });
  return out;
}

     급여데이터함도 같은 곳을 본다(js/pu-paydata-store.js 의 isMyCompany).

     이 앱의 약속은 그대로다(사람이 확정한 짝도 payroll_os/site_co_link 에 담는다).
   ⚠ 업체 명단은 374KB다 — 시작할 때 받지 않고, 이 화면을 열 때 한 번만 받는다.
   ══════════════════════════════════════════════════════════════════════ */
var coData=null, coBusy=false, coErr='';
function ensureCo(){
  if(coData||coBusy||!fbDb) return;
  coBusy=true;
  Promise.all([
    fbDb.ref('data/companies/v').once('value'),
    fbDb.ref('data/user_dir/v').once('value')
  ]).then(function(r){
    coData={companies:(window.PuSiteStaff&&PuSiteStaff.list)?PuSiteStaff.list(r[0].val()||[]):(r[0].val()||[]), dir:r[1].val()||[]};
    coBusy=false; if(ready) render();
  }).catch(function(e){
    coBusy=false; coErr=(e&&e.code)||String(e); if(ready) render();
  });
}
/* 사업장 한 곳의 담당 — 아직 명단을 못 받았으면 null(「불러오는 중」으로 그린다) */
function staffOf(site){
  if(!coData||!window.PuSiteStaff) return null;
  return PuSiteStaff.staffFor(site,{companies:coData.companies,dir:coData.dir,links:lmap('site_co_link')});
}

/* ── 한 회사의 «지금 상태» — 직원 표를 받지 않고 셀 수 있는 것만 센다 ──
   ⚠ 110곳 목록에서 직원 표를 받으면 화면이 안 열린다(이미 겪은 자리).
     그래서 모르는 것은 「—」로 둔다. 모른다고 말하는 편이 지어내는 것보다 낫다. */
function hubCounts(site){
  var recs=payRecs(site)||[];
  var lock=0, review=0;
  recs.forEach(function(r){ if(isLocked(site,r.월)) lock++; else if(effSig(r)!=='green') review++; });
  var pre=site+'|', at=0, lv=0, sv=0;
  var A=lmap('attend'); Object.keys(A).forEach(function(k){ if(k.indexOf(pre)===0) at++; });
  var L=lmap('leave');  Object.keys(L).forEach(function(k){ if(k.indexOf(pre)===0) lv++; });
  var V=lmap('sever');  Object.keys(V).forEach(function(k){ if(k.indexOf(pre)===0&&V[k]&&V[k].퇴사일) sv++; });
  return {months:recs.length, lock:lock, review:review, attend:at, leave:lv, sever:sv};
}
/* 사람이 «이 업체가 맞다»고 못 박는다 — 짐작을 답으로 바꾸는 유일한 길 */
function linkCo(site){
  var st=staffOf(site);
  if(!st||!st.업체){ alert('이을 업체를 아직 못 찾았습니다.'); return; }
  if(!confirm(site+' 을(를) 업체관리 「'+st.업체+'」로 확정할까요?\n(담당 '+(st.담당||'미확인')+') \u2014 나중에 바꿀 수 있습니다.')) return;
  saveLink(site, linkVal(st.coId, st.업체));
}
window.linkCo=linkCo;

/* ══════════════════════════════════════════════════════════════════════
   🏷 이름표 맞추기 — 대표 지시 2026-10-05 「1단계 진행, 이름표 맞추기는 내가」
   ──────────────────────────────────────────────────────────────────────
   급여관리는 사업장을 급여대장 «폴더 이름»으로 부르고(꼬리표·찌꺼기 포함),
   급여데이터함·업체관리는 «업체번호»로 부른다. 둘을 한 번 이어 두면
   ① 데이터함이 넘긴 도착 알림이 번호로 붙고 ② 담당자가 이알피를 따라가고
   ③ 이름 짐작이 남의 회사를 고르는 일이 없어진다.
   ⚠ 짐작은 미리 채워 둔다 — 대표는 「맞음」만 누르면 된다. 이름 알맹이가
     똑같은 것(꼬리표만 다름)은 한꺼번에 확정할 수 있다. 이름이 다른 짐작은
     반드시 한 곳씩 본다(실제로 남의 회사·다른 지점을 고른 적이 있다).
   ⚠ 담는 곳: payroll_os/site_co_link — 꼴은 js/pu-site-staff.js 머리말.
   ══════════════════════════════════════════════════════════════════════ */
function linkVal(coId, coName){
  var v={coName:String(coName||''), by:(me&&me.email)||'', at:Date.now()};
  if(coId) v.coId=String(coId);
  return v;
}
function saveLink(site, val){
  var m=lmap('site_co_link'), k=String(site||'');
  if(!k) return;
  if(val==null) delete m[k]; else m[k]=val;
  dbSet('site_co_link', m);
}
/* 사업장 하나가 이름표 어디쯤에 있나 — done(확정) · same(이름이 같은 짐작) · check(꼭 볼 짐작) · none(못 찾음) */
function nameState(st){
  if(!st) return 'none';
  if(st.확정) return 'done';
  if(!st.업체) return 'none';
  if(st.정확&&!st.경고) return 'same';
  return 'check';
}
function linkStats(sites){
  var n={done:0,same:0,check:0,none:0,all:0};
  if(!coData) return null;
  (sites||[]).forEach(function(s){ n[nameState(staffOf(s))]++; n.all++; });
  return n;
}

/* ══════════════════════════════════════════════════════════════════════
   3칸 화면 — 대표 승인 2026-10-05 「형태나 유형을 일치시켜 연결성이 강하게」
   ──────────────────────────────────────────────────────────────────────
   급여데이터함과 같은 뼈대: ① 보기(내 일·전체·담당자·도구) ② 사업장 목록 ③ 회사 한 장.
   · 가운데 명단은 **업체관리 급여 업체 전부**(데이터함과 같은 명단·같은 업체번호).
     급여관리에 자료가 없는 곳도 「자료 없음」으로 보인다 — 숨기면 빠진 줄 모른다.
   · 회사 ↔ 급여관리 자료는 이름표(site_co_link)로 잇는다. 확정 전엔 짐작으로 잇고 그렇다고 밝힌다.
   · 오른쪽 탭은 **원래 화면 그대로**다(App.site 가 정해져 있으면 고르기를 건너뛴다).
     계산은 건드리지 않는다 — 둘러싼 틀만 바뀐다.
   · 담당자 줄·「내 담당」은 데이터함과 같은 규칙(PuSiteStaff.rosterCos·isMine) — 검사가 견준다.
   ⚠ 목록을 그리는 동안 직원 표를 받지 않는다(110곳에서 받으면 화면이 안 열린다).
   ══════════════════════════════════════════════════════════════════════ */
function ymNow(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); }
/* ══════ 자료 기준월 (2026-10-07 대표 「순서대로」 1번) ══════
   급여관리에 올라온 자료의 마지막 달. 화면 기준 달이 이것보다 뒤면 거의 모든 회사가 「미도착」으로
   떠서, 정말 안 보낸 곳과 «아직 안 올린» 곳을 가를 수 없었다(실측: 자료는 2026-05 까지, 화면은 10월).
   그래서 ① 처음 열 때 기준 달은 자료가 있는 마지막 달(이번 달보다 뒤면 이번 달) ② 목록 머리에
   「자료는 언제까지」를 늘 적는다. ⚠ 직원 표는 안 본다 — 얇은 목록의 귀속월만 센다. */
var horizonMemo={of:null, v:null};
function dataHorizon(){
  var src=payIdx||payOld;
  if(horizonMemo.of===src) return horizonMemo.v;
  var best=null;
  paySites().forEach(function(s){ (payRecs(s)||[]).forEach(function(r){ var x=ymOf(r); if(!x) return;
    var k=x.y*100+x.m; if(best==null||k>best) best=k; }); });
  horizonMemo={of:src, v:best==null?null:(Math.floor(best/100)+'-'+('0'+(best%100)).slice(-2))};
  return horizonMemo.v;
}
function defaultYm(){ var n=ymNow(), h=dataHorizon(); return (h&&h<n)?h:n; }
function ymParts(s){ var m=String(s||'').match(/^(\d{4})-(\d{1,2})$/); return m?{y:+m[1],m:+m[2]}:null; }
function ymText(s){ var t=ymParts(s); return t?(t.y+'년 '+t.m+'월'):''; }
/* 데이터함 알림의 귀속월 — 「2026-08」이면 해까지, 「8월」이면 달만 */
function inboxYm(a){
  var m=String((a&&a.월)||'').match(/^(\d{4})\s*[.\-\/]\s*(\d{1,2})$/);
  if(m) return {y:+m[1],m:+m[2]};
  var mn=monthNum(a&&a.월); return mn?{y:null,m:mn}:null;
}
/* 이 회사에 그 달 자료가 왔나 — 번호가 실려 오면 번호로, 아니면 이름표로 */
function coArrivals(co, sites, ym, links){
  var t=ymParts(ym), map=inboxLog(), out=[];
  Object.keys(map).forEach(function(id){ var a=map[id]; if(!a) return;
    var mine=(co&&a.companyId&&String(a.companyId)===String(co.id))
      ||sites.some(function(s){ return PuSiteStaff.arrivalMatches(a,s,links); });
    if(!mine) return;
    var r=inboxYm(a);
    if(t&&r&&(r.m!==t.m||(r.y!=null&&r.y!==t.y))) return;
    out.push(a);
  });
  return out;
}
/* 한 회사의 그 달 상태 — 직원 표 없이 얇은 목록만 본다.
   ⚠ 연·월을 못 읽은 기록(약 1/4)은 달 판정에서 빠진다 — 급여 탭에서는 그대로 보인다. */
function coState(co, sites, ym, links){
  var t=ymParts(ym), recs=[];
  sites.forEach(function(s){ (payRecs(s)||[]).forEach(function(r){ var x=ymOf(r);
    if(x&&t&&x.y===t.y&&x.m===t.m) recs.push({site:s,r:r}); }); });
  var arrived=coArrivals(co,sites,ym,links).length>0;
  if(recs.length){
    var lock=recs.filter(function(x){return isLocked(x.site,x.r.월);}).length;
    var rev=recs.filter(function(x){return !isLocked(x.site,x.r.월)&&effSig(x.r)!=='green';}).length;
    if(lock===recs.length) return {key:'done',label:'확정 ✔',recs:recs.length};
    if(rev) return {key:'review',label:'검토 '+rev,recs:recs.length};
    return {key:'ready',label:'처리 전',recs:recs.length};
  }
  if(arrived) return {key:'arrived',label:'자료 도착',recs:0};
  if(!sites.length) return {key:'nodata',label:'자료 없음',recs:0};
  return {key:'none',label:'미도착',recs:0};
}
function sitesHaveSever(sites){
  var V=lmap('sever');
  return sites.some(function(s){ return Object.keys(V).some(function(k){ return k.indexOf(s+'|')===0&&V[k]&&V[k].퇴사일; }); });
}

/* ══════ 머리줄 금액 지표 — 대표 지시 2026-10-05 「직원 수·이번 달 총 지급액을 윗줄에」 ══════

     · 지급이 20% 이상 바뀐 사람 — 일할·수당 변동이면 정상, 아니면 입력 실수를 의심

/* ══════════════════════════════════════════════════════════════════════
   주민번호 — 대표 결정 2026-10-07 「암호화해서 저장」
   ──────────────────────────────────────────────────────────────────────
   · 하네스가 원본 급여대장에서 읽은 주민번호(rrn_local.json, 평문, 자료 폴더 안)를 «브라우저에서
     잠근 뒤에만» 서버에 보낸다. 잠금은 백업이 쓰는 모듈(js/pu-rrn-seal.js, AES-GCM) 그대로.
   · 서버: payroll_os/rrn/{사업장}/{성명} = {v:'enc:v1:…', mask:'800101-1******', by, at}
           payroll_os/rrn_key/v1 = 열쇠(처음 한 번 만든다)
   · 화면에는 mask 만 보인다(명세서 생년월일 칸도 이것으로). 「보기」를 누를 때만 풀고,
     누가·언제·누구 것을 봤는지 payroll_os/rrn_log 에 남긴다.
   ⚠ 못 막는 것(솔직히): 급여관리 권한(재무·관리자)이 있는 사람은 열쇠도 읽을 수 있어 「보기」가 된다.
     그래서 열람 기록을 남긴다. 막는 것은 «서버 자료·백업·내보낸 파일이 밖으로 나갔을 때» 읽히는 것.
   ⚠ 급여 자료 파일(payroll_all.json)에는 주민번호가 들어가면 안 된다 — 올릴 때 막는다(rrnLeakCount).
   ══════════════════════════════════════════════════════════════════════ */
var rrnBox={}, rrnBusy={}, rrnKeyP=null;
function fbk(s){ return String(s==null?'':s).replace(/[.#$\[\]\/]/g,'_'); }
/* 주민번호 모양 검사 — 13자리, 생년월일이 날짜로 말이 되고 7번째 자리가 1~8 */
function rrnValid(v){
  var d=String(v==null?'':v).replace(/\D/g,'');
  if(d.length!==13) return null;
  var mm=+d.slice(2,4), dd=+d.slice(4,6);
  if(mm<1||mm>12||dd<1||dd>31||'12345678'.indexOf(d[6])<0) return null;
  return d;
}
function rrnMask(d){ return d.slice(0,6)+'-'+d[6]+'******'; }
/* 가린 값에서 생년월일 — 7번째 자리로 세기를 가린다(1·2·5·6=1900년대, 3·4·7·8=2000년대) */
function birthOfMask(mask){
  var m=String(mask||'').match(/^(\d{2})(\d{2})(\d{2})-(\d)/); if(!m) return '';
  var c='3478'.indexOf(m[4])>=0?'20':'19';
  return c+m[1]+'.'+m[2]+'.'+m[3];
}
/* 급여 자료 파일 글자 안의 주민번호 모양 개수 — 0이 아니면 올리지 않는다 */
function rrnLeakCount(text){
  var n=0, re=/(^|[^\d])(\d{6})-?(\d{7})(?!\d)/g, m;
  while((m=re.exec(String(text||'')))){ if(rrnValid(m[2]+m[3])) n++; }
  return n;
}
function rrnKey(){ if(!rrnKeyP) rrnKeyP=PuRrnSeal.keyFor(fbDb.ref(ROOT+'/rrn_key/v1')); return rrnKeyP; }
/* 사업장 하나의 주민번호(잠긴 것)만 받는다 — 전체를 받지 않는다 */
function ensureRrn(site){
  if(!site||rrnBox[site]!==undefined||rrnBusy[site]||!fbDb) return;
  rrnBusy[site]=1;
  fbDb.ref(ROOT+'/rrn/'+fbk(site)).once('value').then(function(sn){
    rrnBox[site]=sn.val()||{}; delete rrnBusy[site]; if(ready) render();
  }).catch(function(e){ delete rrnBusy[site]; rrnBox[site]={}; console.warn('[주민번호]', e&&e.code); });
}
function rrnRec(site, name){ var b=rrnBox[site]; return b?b[fbk(String(name||'').trim())]||null:null; }
/* 명세서 생년월일 — 그 사업장 것만 처음 한 번 받는다(받는 동안은 빈칸, 받으면 다시 그린다) */
function birthOf(site, name){ ensureRrn(site); var r=rrnRec(site, name); return r?birthOfMask(r.mask):''; }
/* 한 사람 잠그기 — {v, mask, by, at} */
function sealRrn(d, key){
  return PuRrnSeal.sealOne(d, key).then(function(v){
    if(!PuRrnSeal.isSealed(v)) throw new Error('잠기지 않았습니다');
    return {v:v, mask:rrnMask(d), by:(me&&me.email)||'', at:Date.now()};
  });
}
function rrnLog(site, name, why){
  try{ fbDb.ref(ROOT+'/rrn_log').push({site:site, name:name, why:why, by:(me&&me.email)||'', at:Date.now()}); }catch(e){}
}
/* 올릴 묶음 만들기 — rrn_local.json → {경로: 잠긴 값}. 평문은 이 함수 밖으로 안 나간다. */
function rrnUploadMap(json, key){
  var jobs=[], bad=0, skipped=json&&json._동명이인?Object.keys(json._동명이인).reduce(function(a,k){ return a+json._동명이인[k].length; },0):0;
  Object.keys(json||{}).forEach(function(site){
    if(site==='_동명이인') return;
    var ppl=json[site]||{};
    Object.keys(ppl).forEach(function(nm){
      var d=rrnValid(ppl[nm]); if(!d){ bad++; return; }
      jobs.push(sealRrn(d, key).then(function(rec){ return [ROOT+'/rrn/'+fbk(site)+'/'+fbk(nm), rec]; }));
    });
  });
  return Promise.all(jobs).then(function(pairs){
    var up={}; pairs.forEach(function(x){ up[x[0]]=x[1]; });
    return {up:up, n:pairs.length, bad:bad, dup:skipped};
  });
}
function uploadRrn(dropped){
  var i=document.createElement('input'); i.type='file'; i.accept='.json';
  i.onchange=function(e){ var f=e.target.files[0]; if(!f) return; var r=new FileReader();
    r.onload=function(){
      var json; try{ json=JSON.parse(r.result); }catch(err){ alert('JSON 오류: '+err.message); return; }
      rrnKey().then(function(key){ return rrnUploadMap(json, key); }).then(function(res){
        if(!res.n){ alert('올릴 주민번호가 없습니다.'); return; }
        if(!confirm('주민번호 '+res.n+'명분을 «잠가서» 저장합니다.\n(모양이 틀린 것 '+res.bad+'건 · 동명이인이라 뺀 것 '+res.dup+'명은 화면에서 직접 넣습니다)\n\n계속할까요?')) return;
        return fbDb.ref().update(res.up).then(function(){
          rrnBox={}; rrnLog('*', '*', '올리기 '+res.n+'명'); render();
          alert('잠가서 저장했습니다: '+res.n+'명\n원본 파일(rrn_local.json)은 자료 폴더 밖으로 옮기지 마세요.');
        });
      }).catch(function(err){ alert('주민번호 올리기 실패: '+((err&&err.code)||err.message||err)); });
    }; r.readAsText(f); };
  if(dropped&&dropped.length&&window.PuDnd) PuDnd.pick(i,dropped); else i.click();
}
function revealRrn(site, name){
  var rec=rrnRec(site, name); if(!rec){ alert('등록된 주민번호가 없습니다.'); return; }
  rrnKey().then(function(key){ return PuRrnSeal.unsealOne(rec.v, key); }).then(function(plain){
    rrnLog(site, name, '보기');
    prompt(name+' 주민번호 (열람 기록이 남습니다)', plain.slice(0,6)+'-'+plain.slice(6));
  }).catch(function(err){ alert('풀지 못했습니다: '+((err&&err.code)||err.message||err)); });
}
function enterRrn(site, name){
  var v=prompt(name+' 주민번호 13자리(입력하는 즉시 잠가서 저장합니다)',''); if(v==null) return;
  var d=rrnValid(v); if(!d){ alert('주민번호 모양이 아닙니다(13자리, 생년월일·성별 자리 확인).'); return; }
  rrnKey().then(function(key){ return sealRrn(d, key); }).then(function(rec){
    return fbDb.ref(ROOT+'/rrn/'+fbk(site)+'/'+fbk(name)).set(rec).then(function(){
      (rrnBox[site]=rrnBox[site]||{})[fbk(name)]=rec; rrnLog(site, name, '입력'); render();
    });
  }).catch(function(err){ alert('저장 실패: '+((err&&err.code)||err.message||err)); });
}
window.uploadRrn=uploadRrn; window.revealRrn=revealRrn; window.enterRrn=enterRrn;

    TAX_WATCH.items.map(function (x) {

/* 월 이름에서 '몇 월'인지 — 달력 격자를 그리려면 필요하다.
   ⚠ 실제 시트 이름은 '3월'·'2026-03'·'23년 7월'·'25.05 새별반찬' 로 섞여 온다. */
function laborMonthNum(month) {
  var s = String(month || '');
  var m = s.match(/(20\d{2})[-.\/]?(\d{1,2})/);
  if (m && Number(m[2]) >= 1 && Number(m[2]) <= 12) return Number(m[2]);
  var m2 = s.match(/(\d{1,2})\s*월/);
  if (m2 && Number(m2[1]) >= 1 && Number(m2[1]) <= 12) return Number(m2[1]);
  var m3 = s.match(/(?:^|[^\d])(\d{2})[.\-\/](\d{1,2})(?!\d)/);
  if (m3 && Number(m3[2]) >= 1 && Number(m3[2]) <= 12) return Number(m3[2]);
  return null;
}

var DAY_TYPES = [
  { key: 'work', label: '근무' }, { key: 'holiday', label: '휴일근로' },
  { key: 'annual', label: '연차(1일)' }, { key: 'half', label: '반차(4h)' }, { key: 'quarter', label: '반반차(2h)' }, { key: 'hourleave', label: '시간차(시간연차)' },
  { key: 'absent', label: '결근' }, { key: 'paid', label: '유급휴가' },
  { key: 'unpaid', label: '무급휴가·휴직' }
];
function dayTypeLabel(t) {
  for (var i = 0; i < DAY_TYPES.length; i++) if (DAY_TYPES[i].key === t) return DAY_TYPES[i].label;
  return '근무';
}

/* 하루 기록 저장·삭제 — 같은 날짜는 덮어쓴다(두 줄이 되면 시간이 두 배로 센다) */
function saveDay(site, month, name) {
  var d = document.getElementById('dayDate'), i = document.getElementById('dayIn'),
      o = document.getElementById('dayOut'), b = document.getElementById('dayBreak'),
      t = document.getElementById('dayType'), nt = document.getElementById('dayNote');
  if (!d || !d.value) { alert('날짜를 확인하세요.'); return; }
  var type = t ? t.value : 'work';
  var rec = { date: d.value, type: type };
  if (type === 'work' || type === 'holiday') {
    if (!i.value || !o.value) { alert('출근·퇴근 시각을 넣으세요. (휴가·결근이면 유형을 바꾸세요)'); return; }
    rec.in = i.value; rec.out = o.value; rec.breakMin = Number(b.value || 0);
  }
  var lh = document.getElementById('dayLeaveHours');
  if (type === 'hourleave' || type === 'quarter') {
    var maxDayH = maxHourLeaveFor(site, name);
    rec.leaveHours = Math.min(maxDayH, Math.max(1, Math.round(Number((lh && lh.value) || (type === 'quarter' ? 2 : 1)))));
  }
  if (nt && nt.value) rec.note = nt.value;
  var list = dayRecords(site, month, name).filter(function (r) { return r.date !== rec.date; });
  list.push(rec);
  list.sort(function (a, c) { return String(a.date) < String(c.date) ? -1 : 1; });
  lput('attend', site + '|' + month + '|' + name, { 일별: list });
  App.day = null;
}
function delDay(site, month, name, date) {

  var list = dayRecords(site, month, name).filter(function (r) { return r.date !== date; });
  lput('attend', site + '|' + month + '|' + name, { 일별: list });
  App.day = null;
}

}

function sexFromMask(mask) {
  var m = String(mask || '').match(/^\d{6}-(\d)/);
  if (!m) return '';
  return (m[1] === '1' || m[1] === '3' || m[1] === '5' || m[1] === '7') ? '남' : ((m[1] === '2' || m[1] === '4' || m[1] === '6' || m[1] === '8') ? '여' : '');
}
function rosterEmployees(site) {
  var base = siteEmployees(site) || [];
  var extra = (lmap('roster_extra')[site] || []);
  var seen = {}, out = [];
  base.concat(extra).forEach(function (e) {
    var nm = String((e && e.성명) || '').trim();
    if (!nm || seen[nm]) return;
    seen[nm] = 1;
    out.push(e);
  });
  return out;
}
function addRosterEmp(site) {
  var el = document.getElementById('rosterNewName');
  var nm = String((el && el.value) || '').trim();
  if (!nm) { alert('추가할 근로자 성명을 입력하세요.'); return; }
  var m = lmap('roster_extra'), arr = (m[site] || []).slice();
  if (!arr.some(function (x) { return x && x.성명 === nm; })) arr.push({ 성명: nm });
  m[site] = arr;
  dbSet('roster_extra', m);
}
function copyRosterTSV(site) {
  var emps = rosterEmployees(site);
  var head = ['순번', '성명', '성별', '생년월일', '주소', '이력', '종사업무', '고용형태', '입사일(고용연월일)', '계약종료일', '퇴직연월일', '퇴직사유', '보존기한(3년)'];
  var lines = [head.join('\t')];
  emps.forEach(function (e, idx) {
    var nm = String(e.성명 || '').trim(), meta = empMeta(site, nm), sv = severOf(site, nm), rrn = (typeof rrnRec === 'function') ? rrnRec(site, nm) : null;
    var birth = meta.생년월일 || (rrn ? birthOfMask(rrn.mask) : '');
    var sex = meta.성별 || (rrn ? sexFromMask(rrn.mask) : '');
    var row = { 성명: nm, 성별: sex, 생년월일: birth, 주소: meta.주소 || '', 이력: meta.이력 || '', 종사업무: meta.직종 || '', 고용형태: meta.고용형태 || '정규직', 입사일: meta.입사일 || e.입사일 || '', 계약종료일: meta.계약종료일 || '', 퇴사일: sv.퇴사일 || e.퇴사일 || '', 퇴직사유: sv.퇴직사유 || '' };
    var ev = LC.evaluateRosterRow(row);
    lines.push([idx + 1, row.성명, row.성별, row.생년월일, row.주소, row.이력, row.종사업무, row.고용형태, row.입사일, row.계약종료일, row.퇴사일, row.퇴직사유, ev.보존기한 || '재직중'].join('\t'));
  });
  var tsv = lines.join('\n');

     var bad=t.rows.filter(function(x){return x.min==null||!x.tax||!x.tax.length;}).length;
     if(bad) throw new Error(bad+'개 구간에 min 또는 tax 가 없습니다');
     if(t.rows[t.rows.length-1].max!=null) throw new Error('마지막 구간에 상한이 있습니다 — 높은 급여가 「표없음」이 됩니다');

   }catch(err){alert('간이세액표 오류: '+err.message);}};r.readAsText(f);};if(dropped&&dropped.length&&window.PuDnd)PuDnd.pick(i,dropped);else i.click();}
